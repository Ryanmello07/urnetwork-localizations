description: "Sessions screen (Account > Sessions): footer note shown when sign-ins from older app versions are not all listed yet; each appears once its sign-in renews. Must not claim that signing sessions out here ends every sign-in."
source: "Sign-ins from older app versions appear here once they renew. To end every sign-in, change your sign-in details."
platforms:
  - apple
  - android
  - windows
  - linux
  - site
localizations:
  ar: "تظهر عمليات تسجيل الدخول من إصدارات التطبيق الأقدم هنا بعد تجديدها. لإنهاء كل عمليات تسجيل الدخول، غيّر بيانات تسجيل الدخول الخاصة بك."
  cs: "Přihlášení ze starších verzí aplikace se zde zobrazí, jakmile se obnoví. Chcete-li ukončit všechna přihlášení, změňte své přihlašovací údaje."
  de: "Anmeldungen aus älteren App-Versionen erscheinen hier, sobald sie erneuert werden. Um alle Anmeldungen zu beenden, ändere deine Anmeldedaten."
  el: "Οι συνδέσεις από παλαιότερες εκδόσεις της εφαρμογής εμφανίζονται εδώ μόλις ανανεωθούν. Για να τερματίσετε κάθε σύνδεση, αλλάξτε τα στοιχεία σύνδεσής σας."
  en: "Sign-ins from older app versions appear here once they renew. To end every sign-in, change your sign-in details."
  es: "Los inicios de sesión de versiones anteriores de la app aparecen aquí cuando se renuevan. Para cerrar todos los inicios de sesión, cambia tus datos de inicio de sesión."
  es-419: "Los inicios de sesión de versiones anteriores de la app aparecen aquí cuando se renuevan. Para cerrar todos los inicios de sesión, cambia tus datos de inicio de sesión."
  es-MX: "Los inicios de sesión de versiones anteriores de la app aparecen aquí cuando se renuevan. Para cerrar todos los inicios de sesión, cambia tus datos de inicio de sesión."
  fr: "Les connexions des anciennes versions de l’application apparaissent ici dès qu’elles se renouvellent. Pour mettre fin à toutes les connexions, modifiez vos identifiants."
  he: "התחברויות מגרסאות ישנות של האפליקציה יופיעו כאן אחרי שיתחדשו. כדי לסיים את כל ההתחברויות, שנו את פרטי ההתחברות שלכם."
  hi: "पुराने ऐप संस्करणों से किए गए साइन-इन नवीनीकृत होने पर यहाँ दिखेंगे। सभी साइन-इन समाप्त करने के लिए, अपनी साइन-इन जानकारी बदलें।"
  id: "Proses masuk dari versi aplikasi lama akan muncul di sini setelah diperbarui. Untuk mengakhiri semua proses masuk, ubah detail masuk Anda."
  it: "Gli accessi dalle versioni precedenti dell’app compaiono qui quando vengono rinnovati. Per chiudere tutti gli accessi, cambia i tuoi dati di accesso."
  ja: "古いバージョンのアプリからのサインインは、更新されるとここに表示されます。すべてのサインインを終了するには、サインイン情報を変更してください。"
  ko: "이전 버전 앱의 로그인은 갱신되면 여기에 표시됩니다. 모든 로그인을 종료하려면 로그인 정보를 변경하세요."
  nl: "Inlogsessies van oudere appversies verschijnen hier zodra ze worden vernieuwd. Wijzig je inloggegevens om alle inlogsessies te beëindigen."
  pl: "Logowania ze starszych wersji aplikacji pojawią się tutaj po ich odnowieniu. Aby zakończyć wszystkie logowania, zmień swoje dane logowania."
  pt: "Os inícios de sessão de versões mais antigas da app aparecem aqui quando forem renovados. Para terminar todos os inícios de sessão, altere os seus dados de início de sessão."
  pt-BR: "Logins de versões mais antigas do app aparecem aqui quando forem renovados. Para encerrar todos os logins, altere seus dados de login."
  pt-PT: "Os inícios de sessão de versões mais antigas da app aparecem aqui quando forem renovados. Para terminar todos os inícios de sessão, altere os seus dados de início de sessão."
  ru: "Входы из старых версий приложения появятся здесь после их обновления. Чтобы завершить все входы, смените данные для входа."
  sv: "Inloggningar från äldre appversioner visas här när de förnyas. Ändra dina inloggningsuppgifter för att avsluta alla inloggningar."
  sw: "Kuingia kutoka kwenye matoleo ya zamani ya programu kutaonekana hapa kukishasasishwa. Ili kukomesha kuingia kote, badilisha maelezo yako ya kuingia."
  th: "การลงชื่อเข้าใช้จากแอปเวอร์ชันเก่าจะแสดงที่นี่เมื่อมีการต่ออายุ หากต้องการยุติการลงชื่อเข้าใช้ทั้งหมด ให้เปลี่ยนข้อมูลการลงชื่อเข้าใช้ของคุณ"
  uk: "Входи зі старіших версій застосунку з’являться тут після їх оновлення. Щоб завершити всі входи, змініть дані для входу."
  vi: "Các lượt đăng nhập từ phiên bản ứng dụng cũ sẽ xuất hiện ở đây khi được gia hạn. Để kết thúc mọi lượt đăng nhập, hãy thay đổi thông tin đăng nhập của bạn."
  zh: "旧版应用的登录会在续期后显示在这里。要结束所有登录，请更改您的登录信息。"
  zh-HK: "舊版應用程式的登入會在續期後顯示在這裡。如要結束所有登入，請更改你的登入資料。"
