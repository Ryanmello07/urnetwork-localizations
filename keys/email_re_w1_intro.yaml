description: "Win-back email W1 opening. {pro_ended_date} is a localized date."
source: "Your URnetwork Pro ended on {pro_ended_date}. Thank you for supporting the network while you had it."
platforms:
  - email
placeholders:
  - name: pro_ended_date
    type: string
