description: "Re-engagement email N1 (trust): stated in the public threat model (summary and section 2: relayed modes never give the provider the source IP; direct mode is opt-in by turning off Strong Anonymization). 'Strong Anonymization' is the setting's name in the app. Do not soften or strengthen it in translation."
source: "By default, the provider that carries your traffic never sees your real IP address, whatever software it runs. Only you can change that, by turning off Strong Anonymization."
platforms:
  - email
localizations:
  en: "By default, the provider that carries your traffic never sees your real IP address, whatever software it runs. Only you can change that, by turning off Strong Anonymization."
  ar: "بشكل افتراضي، لا يرى المزوّد الذي ينقل حركة بياناتك عنوان IP الحقيقي الخاص بك أبداً، مهما كان البرنامج الذي يشغّله. وحدك تستطيع تغيير ذلك، بإيقاف «إخفاء الهوية القوي»."
  cs: "Ve výchozím nastavení poskytovatel, přes kterého jde váš provoz, nikdy nevidí vaši skutečnou IP adresu, ať na něm běží jakýkoli software. Změnit to můžete jen vy, a to vypnutím přepínače Silná anonymizace."
  de: "Standardmäßig sieht der Anbieter, über den dein Datenverkehr läuft, nie deine echte IP-Adresse, ganz gleich, welche Software er betreibt. Nur du kannst das ändern, indem du „Starke Anonymisierung“ ausschaltest."
  el: "Από προεπιλογή, ο πάροχος που μεταφέρει την κίνησή σου δεν βλέπει ποτέ την πραγματική σου διεύθυνση IP, όποιο λογισμικό κι αν τρέχει. Μόνο εσύ μπορείς να το αλλάξεις, απενεργοποιώντας την Ισχυρή ανωνυμοποίηση."
  es: "Por defecto, el proveedor que transporta tu tráfico nunca ve tu dirección IP real, sin importar qué software ejecute. Solo tú puedes cambiar eso, desactivando la Anonimización fuerte."
  es-419: "Por defecto, el proveedor que transporta tu tráfico nunca ve tu dirección IP real, sin importar qué software ejecute. Solo tú puedes cambiar eso, desactivando la Anonimización fuerte."
  es-MX: "Por defecto, el proveedor que transporta tu tráfico nunca ve tu dirección IP real, sin importar qué software ejecute. Solo tú puedes cambiar eso, desactivando la Anonimización fuerte."
  fr: "Par défaut, le fournisseur qui transporte ton trafic ne voit jamais ton adresse IP réelle, quel que soit le logiciel qu'il utilise. Il n'y a que toi qui puisses changer ça, en désactivant l'Anonymisation renforcée."
  he: "כברירת מחדל, הספק שמעביר את התעבורה שלכם אף פעם לא רואה את כתובת ה-IP האמיתית שלכם, לא משנה איזו תוכנה הוא מריץ. רק אתם יכולים לשנות את זה, על ידי כיבוי ״אנונימיזציה חזקה״."
  hi: "डिफ़ॉल्ट रूप से, आपका ट्रैफ़िक ले जाने वाला प्रदाता आपका असली IP पता कभी नहीं देखता, चाहे वह कोई भी सॉफ़्टवेयर चलाए। इसे सिर्फ़ आप बदल सकते हैं, “मजबूत गुमनामीकरण” बंद करके।"
  id: "Secara default, penyedia yang membawa lalu lintasmu tidak pernah melihat alamat IP aslimu, apa pun perangkat lunak yang dijalankannya. Hanya kamu yang bisa mengubahnya, dengan mematikan “Anonimisasi kuat”."
  it: "Per impostazione predefinita, il provider che trasporta il tuo traffico non vede mai il tuo indirizzo IP reale, qualunque software esegua. Solo tu puoi cambiarlo, disattivando l'Anonimizzazione avanzata."
  ja: "デフォルトでは、あなたの通信を運ぶプロバイダーは、どんなソフトウェアを動かしていても、あなたの実際の IP アドレスを決して見ることはありません。これを変えられるのはあなただけで、その方法は「強力な匿名化」をオフにすることです。"
  ko: "기본적으로, 트래픽을 전달하는 제공자는 어떤 소프트웨어를 실행하든 실제 IP 주소를 절대 보지 못합니다. 이를 바꿀 수 있는 사람은 본인뿐이며, 그 방법은 '강력한 익명화'를 끄는 것입니다."
  nl: "Standaard ziet de provider die je verkeer doorgeeft nooit je echte IP-adres, welke software die ook draait. Alleen jij kunt dat veranderen, door Sterke anonimisering uit te zetten."
  pl: "Domyślnie dostawca, przez którego przechodzi twój ruch, nigdy nie widzi twojego prawdziwego adresu IP, niezależnie od tego, jakie oprogramowanie uruchamia. Tylko ty możesz to zmienić, wyłączając opcję Silna anonimizacja."
  pt: "Por padrão, o provedor que transporta seu tráfego nunca vê seu endereço IP real, seja qual for o software que ele use. Só você pode mudar isso, desativando a Anonimização forte."
  pt-BR: "Por padrão, o provedor que transporta seu tráfego nunca vê seu endereço IP real, seja qual for o software que ele use. Só você pode mudar isso, desativando a Anonimização forte."
  pt-PT: "Por defeito, o fornecedor que transporta o seu tráfego, seja qual for o software que utilize, nunca vê o seu endereço IP real. Isso só pode ser alterado por si, desativando a Anonimização forte."
  ru: "По умолчанию провайдер, через которого идёт ваш трафик, никогда не видит ваш настоящий IP-адрес, какое бы ПО на нём ни работало. Изменить это можете только вы, выключив переключатель «Усиленная анонимизация»."
  sv: "Som standard ser leverantören som förmedlar din trafik aldrig din riktiga IP-adress, oavsett vilken programvara den kör. Bara du kan ändra på det, genom att stänga av Stark anonymisering."
  sw: "Kwa chaguo-msingi, mtoa huduma anayebeba trafiki yako haoni kamwe anwani yako halisi ya IP, bila kujali anaendesha programu gani. Ni wewe tu unayeweza kubadilisha hilo, kwa kuzima “Ufichaji utambulisho mkubwa”."
  th: "โดยค่าเริ่มต้น ผู้ให้บริการที่รับส่งทราฟฟิกของคุณจะไม่เห็นที่อยู่ IP จริงของคุณเลย ไม่ว่าผู้ให้บริการนั้นจะใช้ซอฟต์แวร์ใดก็ตาม มีเพียงคุณเท่านั้นที่เปลี่ยนเรื่องนี้ได้ ด้วยการปิด “การทำให้ไม่สามารถระบุตัวตนได้แบบเข้มงวด”"
  uk: "За замовчуванням провайдер, через якого йде ваш трафік, ніколи не бачить вашої справжньої IP-адреси, хоч би яке ПЗ на ньому працювало. Змінити це можете лише ви, вимкнувши перемикач «Посилена анонімізація»."
  vi: "Theo mặc định, nhà cung cấp chuyển tải lưu lượng của bạn không bao giờ thấy địa chỉ IP thật của bạn, dù nhà cung cấp đó chạy phần mềm nào. Chỉ bạn mới có thể thay đổi điều đó, bằng cách tắt “Ẩn danh mạnh”."
  zh: "默认情况下，为你传输流量的提供者，无论运行什么软件，都绝不会看到你的真实 IP 地址。只有你能改变这一点，方法是关闭“强匿名化”。"
  zh-HK: "預設情況下，為你傳輸流量的提供者，無論運行什麼軟件，都絕不會看到你的真實 IP 地址。只有你能改變這一點，方法是關閉「強匿名化」。"
