description: "Win-back email W1, App Store subscribers only, and only when the App Store Server API lists one of Apple's win-back offers for their subscription (eligibleWinBackOfferIds). Apple sets and shows the price; the email never states it."
source: "The App Store has a returning-subscriber price for you. The button below opens it."
platforms:
  - email
localizations:
  en: "The App Store has a returning-subscriber price for you. The button below opens it."
  ar: "لدى App Store سعر للمشتركين العائدين متاح لك. يفتحه الزر أدناه."
  cs: "App Store pro vás má cenu pro vracející se předplatitele. Tlačítko níže vás tam dovede."
  de: "Im App Store gibt es für dich einen Preis für zurückkehrende Abonnenten. Der Button unten führt dich dorthin."
  el: "Στο App Store υπάρχει για σένα μια τιμή για συνδρομητές που επιστρέφουν. Το κουμπί παρακάτω σε πηγαίνει εκεί."
  es: "El App Store te ofrece un precio para suscriptores que vuelven. El botón de abajo lo abre."
  es-419: "El App Store te ofrece un precio para suscriptores que vuelven. El botón de abajo lo abre."
  es-MX: "El App Store te ofrece un precio para suscriptores que vuelven. El botón de abajo lo abre."
  fr: "L'App Store te propose un tarif pour les abonnés qui reviennent. Le bouton ci-dessous l'ouvre."
  he: "ב-App Store יש בשבילכם מחיר למנויים חוזרים. הכפתור שלמטה פותח אותו."
  hi: "App Store में आपके लिए दोबारा सदस्यता लेने वालों की कीमत उपलब्ध है। नीचे दिया गया बटन उसे खोलता है।"
  id: "App Store punya harga untuk pelanggan yang kembali, dan harga itu tersedia untukmu. Tombol di bawah ini membukanya."
  it: "L'App Store ha per te un prezzo per chi torna ad abbonarsi. Il pulsante qui sotto lo apre."
  ja: "App Store で、再登録者向けの価格をご利用いただけます。下のボタンから開けます。"
  ko: "App Store에서 재구독자 가격을 받으실 수 있습니다. 아래 버튼을 누르면 열립니다."
  nl: "In de App Store staat een prijs voor terugkerende abonnees voor je klaar. Via de knop hieronder kom je er."
  pl: "App Store ma dla ciebie cenę dla powracających subskrybentów. Przycisk poniżej cię tam zaprowadzi."
  pt: "A App Store tem um preço para quem volta a assinar, disponível para você. O botão abaixo leva até lá."
  pt-BR: "A App Store tem um preço para quem volta a assinar, disponível para você. O botão abaixo leva até lá."
  pt-PT: "A App Store tem um preço para quem volta a subscrever, disponível para si. O botão abaixo leva até lá."
  ru: "В App Store для вас есть цена для возвращающихся подписчиков. Кнопка ниже ведёт туда."
  sv: "App Store har ett pris för återvändande prenumeranter åt dig. Knappen nedan tar dig dit."
  sw: "App Store ina bei ya wateja wanaorudi kwa ajili yako. Kitufe kilicho hapa chini kinaifungua."
  th: "App Store มีราคาสำหรับสมาชิกที่กลับมาสมัครใหม่ไว้ให้คุณ ปุ่มด้านล่างจะพาไปที่ราคานั้น"
  uk: "В App Store для вас є ціна для підписників, які повертаються. Кнопка нижче веде туди."
  vi: "App Store có một mức giá dành cho bạn với tư cách người đăng ký quay lại. Nút bên dưới sẽ mở mức giá đó."
  zh: "App Store 为你准备了回归订阅者价格。下面的按钮可以打开它。"
  zh-HK: "App Store 為你準備了回歸訂閱者價格。下方的按鈕可以打開它。"
