  cs: "Chcete-li tyto aplikace ponechat mimo VPN, povolte v Nastavení systému rozšíření URnetwork Split Tunnel."
  de: "Damit diese Apps das VPN umgehen, erlaube die Erweiterung URnetwork Split Tunnel in den Systemeinstellungen."
  el: "Για να κρατήσετε αυτές τις εφαρμογές εκτός VPN, επιτρέψτε την επέκταση URnetwork Split Tunnel στις Ρυθμίσεις συστήματος."
  en: "To keep these apps off the VPN, allow the URnetwork Split Tunnel extension in System Settings."
  es: "Para dejar estas apps fuera de la VPN, permite la extensión URnetwork Split Tunnel en Ajustes del Sistema."
  es-419: "Para dejar estas apps fuera de la VPN, permite la extensión URnetwork Split Tunnel en Configuración del Sistema."
  es-MX: "Para dejar estas apps fuera de la VPN, permite la extensión URnetwork Split Tunnel en Configuración del Sistema."
  fr: "Pour garder ces applications hors du VPN, autorisez l’extension URnetwork Split Tunnel dans Réglages Système."
  he: "כדי להשאיר את האפליקציות האלה מחוץ ל-VPN, אשר את התוסף URnetwork Split Tunnel בהגדרות המערכת."
  hi: "इन ऐप्स को VPN से बाहर रखने के लिए, सिस्टम सेटिंग्ज़ में URnetwork Split Tunnel एक्सटेंशन को अनुमति दें।"
  id: "Agar aplikasi ini tidak melalui VPN, izinkan ekstensi URnetwork Split Tunnel di Pengaturan Sistem."
  it: "Per tenere queste app fuori dalla VPN, consenti l’estensione URnetwork Split Tunnel in Impostazioni di Sistema."
