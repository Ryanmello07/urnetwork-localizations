description: "Split rules screen on macOS, Apps section: the split tunnel system extension waits for the user's one-time approval in System Settings (General > Login Items & Extensions > Network Extensions). Use the name macOS gives System Settings in the language. Keep URnetwork Split Tunnel (the extension's name) and VPN unchanged."
source: "To keep these apps off the VPN, allow the URnetwork Split Tunnel extension in System Settings."
platforms:
  - apple
localizations:
