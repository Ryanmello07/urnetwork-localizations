  ko: "이 앱들을 VPN에서 제외하려면 시스템 설정에서 URnetwork Split Tunnel 확장 프로그램을 허용하세요."
  nl: "Sta de extensie URnetwork Split Tunnel toe in Systeeminstellingen om deze apps buiten de VPN te houden."
  pl: "Aby wyłączyć te aplikacje z VPN, zezwól na rozszerzenie URnetwork Split Tunnel w Ustawieniach systemowych."
  pt: "Para manter esses apps fora da VPN, permita a extensão URnetwork Split Tunnel nos Ajustes do Sistema."
  pt-BR: "Para manter esses apps fora da VPN, permita a extensão URnetwork Split Tunnel nos Ajustes do Sistema."
  pt-PT: "Para manter estas aplicações fora da VPN, permita a extensão URnetwork Split Tunnel nas Definições do Sistema."
  ru: "Чтобы эти приложения работали вне VPN, разрешите расширение URnetwork Split Tunnel в Системных настройках."
  sv: "Om du vill hålla de här apparna utanför VPN:et tillåter du tillägget URnetwork Split Tunnel i Systeminställningar."
  sw: "Ili kuweka programu hizi nje ya VPN, ruhusu kiendelezi cha URnetwork Split Tunnel katika Mipangilio ya Mfumo."
