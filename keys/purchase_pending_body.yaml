description: "Upgrade: the overlay shown while a store purchase waits for approval. Keep UR Pro (the plan's name) unchanged."
source: "Your purchase is waiting for approval. UR Pro will turn on by itself once it goes through — there's no need to buy again."
platforms:
  - android
localizations:
  ar: "عملية الشراء بانتظار الموافقة. سيتم تفعيل UR Pro تلقائيًا بمجرد إتمامها — لا حاجة للشراء مرة أخرى."
  cs: "Váš nákup čeká na schválení. Jakmile projde, UR Pro se zapne samo — není třeba kupovat znovu."
  de: "Dein Kauf wartet auf Genehmigung. UR Pro schaltet sich von selbst ein, sobald er durchgeht – du musst nicht noch einmal kaufen."
  el: "Η αγορά σας αναμένει έγκριση. Το UR Pro θα ενεργοποιηθεί αυτόματα μόλις ολοκληρωθεί — δεν χρειάζεται να αγοράσετε ξανά."
  en: "Your purchase is waiting for approval. UR Pro will turn on by itself once it goes through — there's no need to buy again."
  es: "Tu compra está pendiente de aprobación. UR Pro se activará solo en cuanto se complete; no hace falta volver a comprar."
  es-419: "Tu compra está esperando aprobación. UR Pro se activará automáticamente cuando se complete; no es necesario volver a comprar."
  es-MX: "Tu compra está esperando aprobación. UR Pro se activará automáticamente cuando se complete; no es necesario volver a comprar."
  fr: "Votre achat est en attente d’approbation. UR Pro s’activera tout seul dès qu’il sera validé — inutile d’acheter à nouveau."
  he: "הרכישה שלך ממתינה לאישור. UR Pro יופעל מעצמו ברגע שהיא תושלם — אין צורך לקנות שוב."
  hi: "आपकी खरीदारी अनुमोदन की प्रतीक्षा में है। पूरी होते ही UR Pro अपने आप चालू हो जाएगा — दोबारा खरीदने की ज़रूरत नहीं है।"
  id: "Pembelian Anda menunggu persetujuan. UR Pro akan aktif dengan sendirinya setelah pembelian selesai — tidak perlu membeli lagi."
  it: "Il tuo acquisto è in attesa di approvazione. UR Pro si attiverà da solo appena verrà completato: non serve acquistarlo di nuovo."
  ja: "購入は承認待ちです。承認されると UR Pro が自動的に有効になります。再度購入する必要はありません。"
  ko: "구매가 승인 대기 중입니다. 승인되면 UR Pro가 자동으로 켜지므로 다시 구매할 필요가 없습니다."
  nl: "Je aankoop wacht op goedkeuring. UR Pro gaat vanzelf aan zodra die rond is — je hoeft niet opnieuw te kopen."
  pl: "Twój zakup czeka na zatwierdzenie. UR Pro włączy się samo, gdy zakup zostanie zatwierdzony — nie musisz kupować ponownie."
  pt: "A sua compra está a aguardar aprovação. O UR Pro será ativado automaticamente assim que for concluída — não precisa de comprar novamente."
  pt-BR: "Sua compra está aguardando aprovação. O UR Pro será ativado sozinho assim que ela for concluída — não é preciso comprar de novo."
  pt-PT: "A sua compra está a aguardar aprovação. O UR Pro será ativado automaticamente assim que for concluída — não precisa de comprar novamente."
  ru: "Ваша покупка ожидает подтверждения. UR Pro включится сам, как только она пройдёт, — покупать повторно не нужно."
  sv: "Ditt köp väntar på godkännande. UR Pro aktiveras av sig självt när det har gått igenom – du behöver inte köpa igen."
  sw: "Ununuzi wako unasubiri idhini. UR Pro itawashwa yenyewe mara utakapokamilika — hakuna haja ya kununua tena."
  th: "การซื้อของคุณกำลังรอการอนุมัติ UR Pro จะเปิดใช้งานเองเมื่อการซื้อเสร็จสมบูรณ์ — ไม่ต้องซื้อซ้ำ"
  uk: "Ваша покупка очікує підтвердження. UR Pro увімкнеться сам, щойно її буде підтверджено, — купувати повторно не потрібно."
  vi: "Giao dịch mua của bạn đang chờ phê duyệt. UR Pro sẽ tự bật khi giao dịch hoàn tất — bạn không cần mua lại."
  zh: "你的购买正在等待批准。购买完成后，UR Pro 会自动开启，无需再次购买。"
  zh-HK: "你的購買正在等待批准。完成後 UR Pro 會自動開啟，無需再次購買。"
