description: "Settings, kill switch: what may leave the device while the switch is on, and the name-lookup window during a connection attempt."
source: "While it is on and nothing is connecting, nothing leaves this device - name lookups included. During a connection attempt, name lookups from any app on this device can leave in the clear so URnetwork can reach its servers; everything else stays blocked."
platforms:
  - linux
localizations:
  ar: "عندما يكون مفعّلًا ولا يوجد اتصال جارٍ، لا يغادر أي شيء هذا الجهاز - بما في ذلك استعلامات الأسماء. أثناء محاولة الاتصال، يمكن لاستعلامات الأسماء من أي تطبيق على هذا الجهاز الخروج دون تشفير ليتمكن URnetwork من الوصول إلى خوادمه؛ ويبقى كل شيء آخر محجوبًا."
  cs: "Když je zapnutý a nic se nepřipojuje, ze zařízení neodejde nic - včetně překladu názvů. Během pokusu o připojení mohou dotazy na názvy z jakékoli aplikace na tomto zařízení odejít nešifrovaně, aby se URnetwork dostal ke svým serverům; vše ostatní zůstává blokované."
  de: "Solange er an ist und nichts verbindet, verlässt nichts dieses Gerät - auch keine Namensauflösungen. Während eines Verbindungsversuchs dürfen Namensauflösungen jeder App auf diesem Gerät unverschlüsselt hinaus, damit URnetwork seine Server erreicht; alles andere bleibt blockiert."
  el: "Όσο είναι ενεργό και τίποτα δεν συνδέεται, τίποτα δεν φεύγει από αυτήν τη συσκευή - ούτε οι αναζητήσεις ονομάτων. Κατά τη διάρκεια μιας προσπάθειας σύνδεσης, οι αναζητήσεις ονομάτων από οποιαδήποτε εφαρμογή σε αυτήν τη συσκευή μπορούν να βγουν ακρυπτογράφητες ώστε το URnetwork να φτάσει στους διακομιστές του· όλα τα υπόλοιπα παραμένουν αποκλεισμένα."
  en: "While it is on and nothing is connecting, nothing leaves this device - name lookups included. During a connection attempt, name lookups from any app on this device can leave in the clear so URnetwork can reach its servers; everything else stays blocked."
  es: "Mientras está activado y nada se está conectando, nada sale de este dispositivo - ni siquiera las consultas de nombres. Durante un intento de conexión, las consultas de nombres de cualquier app de este dispositivo pueden salir sin cifrar para que URnetwork llegue a sus servidores; todo lo demás sigue bloqueado."
  es-419: "Mientras está activado y nada se está conectando, nada sale de este dispositivo - ni siquiera las consultas de nombres. Durante un intento de conexión, las consultas de nombres de cualquier app de este dispositivo pueden salir sin cifrar para que URnetwork llegue a sus servidores; todo lo demás sigue bloqueado."
  es-MX: "Mientras está activado y nada se está conectando, nada sale de este dispositivo - ni siquiera las consultas de nombres. Durante un intento de conexión, las consultas de nombres de cualquier app de este dispositivo pueden salir sin cifrar para que URnetwork llegue a sus servidores; todo lo demás sigue bloqueado."
  fr: "Tant qu’il est activé et que rien ne se connecte, rien ne quitte cet appareil - résolutions de noms comprises. Pendant une tentative de connexion, les résolutions de noms de n’importe quelle application de cet appareil peuvent sortir en clair pour qu’URnetwork atteigne ses serveurs ; tout le reste reste bloqué."
  he: "כשהוא פעיל ושום דבר לא מתחבר, שום דבר לא יוצא מהמכשיר הזה - כולל בירורי שמות. במהלך ניסיון התחברות, בירורי שמות מכל אפליקציה במכשיר הזה יכולים לצאת לא מוצפנים כדי ש-URnetwork יגיע לשרתים שלו; כל השאר נשאר חסום."
  hi: "जब यह चालू हो और कुछ भी कनेक्ट न हो रहा हो, तो इस डिवाइस से कुछ भी बाहर नहीं जाता - नाम लुकअप भी नहीं। कनेक्शन के प्रयास के दौरान, इस डिवाइस के किसी भी ऐप के नाम लुकअप बिना एन्क्रिप्शन के बाहर जा सकते हैं ताकि URnetwork अपने सर्वर तक पहुँच सके; बाकी सब कुछ रुका रहता है।"
  id: "Saat aktif dan tidak ada yang tersambung, tidak ada yang keluar dari perangkat ini - termasuk pencarian nama. Selama upaya koneksi, pencarian nama dari aplikasi mana pun di perangkat ini boleh keluar tanpa enkripsi agar URnetwork dapat mencapai servernya; yang lainnya tetap diblokir."
  it: "Finché è attivo e nulla si sta connettendo, nulla esce da questo dispositivo - risoluzioni dei nomi incluse. Durante un tentativo di connessione, le risoluzioni dei nomi di qualsiasi app su questo dispositivo possono uscire in chiaro perché URnetwork raggiunga i suoi server; tutto il resto resta bloccato."
  ja: "オンの状態で何も接続していない間は、名前解決を含めて何もこのデバイスから出ていきません。接続を試みている間は、URnetwork がサーバーに到達できるよう、このデバイス上のどのアプリの名前解決も暗号化されずに外へ出ることがあります。それ以外はすべて遮断されたままです。"
  ko: "켜져 있고 아무것도 연결 중이 아닐 때는 이름 조회를 포함해 아무것도 이 기기에서 나가지 않습니다. 연결을 시도하는 동안에는 URnetwork가 서버에 도달할 수 있도록 이 기기의 모든 앱에서 보내는 이름 조회가 암호화 없이 나갈 수 있으며, 나머지는 모두 차단된 상태로 유지됩니다."
  nl: "Zolang hij aanstaat en er niets verbindt, verlaat niets dit apparaat - ook geen naamopzoekingen. Tijdens een verbindingspoging mogen naamopzoekingen van elke app op dit apparaat onversleuteld naar buiten zodat URnetwork zijn servers bereikt; al het andere blijft geblokkeerd."
  pl: "Gdy jest włączony i nic się nie łączy, z tego urządzenia nie wychodzi nic - łącznie z zapytaniami o nazwy. Podczas próby połączenia zapytania o nazwy z dowolnej aplikacji na tym urządzeniu mogą wyjść niezaszyfrowane, aby URnetwork dotarł do swoich serwerów; cała reszta pozostaje zablokowana."
  pt: "Enquanto está ligado e nada está conectando, nada sai deste dispositivo - nem as consultas de nomes. Durante uma tentativa de conexão, as consultas de nomes de qualquer app deste dispositivo podem sair sem criptografia para que a URnetwork alcance seus servidores; todo o resto continua bloqueado."
  pt-BR: "Enquanto está ligado e nada está conectando, nada sai deste dispositivo - nem as consultas de nomes. Durante uma tentativa de conexão, as consultas de nomes de qualquer app deste dispositivo podem sair sem criptografia para que a URnetwork alcance seus servidores; todo o resto continua bloqueado."
  pt-PT: "Enquanto está ligado e nada está a ligar, nada sai deste dispositivo - nem as consultas de nomes. Durante uma tentativa de ligação, as consultas de nomes de qualquer app deste dispositivo podem sair sem cifra para que a URnetwork alcance os seus servidores; tudo o resto continua bloqueado."
  ru: "Пока он включён и ничего не подключается, с этого устройства не уходит ничего - включая запросы имён. Во время попытки подключения запросы имён от любого приложения на этом устройстве могут уходить в открытом виде, чтобы URnetwork достиг своих серверов; всё остальное остаётся заблокированным."
  sv: "När den är på och inget ansluter lämnar inget den här enheten - inte heller namnuppslag. Under ett anslutningsförsök får namnuppslag från vilken app som helst på den här enheten gå ut okrypterade så att URnetwork når sina servrar; allt annat förblir blockerat."
  sw: "Ikiwa imewashwa na hakuna kinachounganisha, hakuna kinachotoka kwenye kifaa hiki - pamoja na utafutaji wa majina. Wakati wa jaribio la kuunganisha, utafutaji wa majina kutoka programu yoyote kwenye kifaa hiki unaweza kutoka bila usimbaji ili URnetwork ifikie seva zake; kila kitu kingine hubaki kimezuiwa."
  th: "ขณะที่เปิดอยู่และไม่มีอะไรกำลังเชื่อมต่อ จะไม่มีสิ่งใดออกจากอุปกรณ์นี้ - รวมถึงการค้นหาชื่อ ระหว่างพยายามเชื่อมต่อ การค้นหาชื่อจากแอปใดก็ตามบนอุปกรณ์นี้อาจออกไปโดยไม่เข้ารหัสเพื่อให้ URnetwork เข้าถึงเซิร์ฟเวอร์ของตนได้ ส่วนอื่นทั้งหมดยังคงถูกบล็อก"
  uk: "Поки він увімкнений і нічого не підключається, із цього пристрою не виходить нічого - включно із запитами імен. Під час спроби підключення запити імен від будь-якого застосунку на цьому пристрої можуть виходити незашифрованими, щоб URnetwork дістався своїх серверів; усе інше залишається заблокованим."
  vi: "Khi đang bật và không có gì đang kết nối, không có gì rời khỏi thiết bị này - kể cả tra cứu tên. Trong lúc thử kết nối, tra cứu tên từ bất kỳ ứng dụng nào trên thiết bị này có thể đi ra không mã hóa để URnetwork tiếp cận máy chủ của mình; mọi thứ khác vẫn bị chặn."
  zh: "在开启且没有任何连接进行时，任何数据都不会离开此设备 - 包括域名查询。在尝试连接期间，此设备上任何应用的域名查询可以明文发出，以便 URnetwork 连接其服务器；其他一切仍被阻断。"
  zh-HK: "在開啟且沒有任何連線進行時，任何資料都不會離開此裝置 - 包括網域查詢。在嘗試連線期間，此裝置上任何應用程式的網域查詢可以明文送出，以便 URnetwork 連線至其伺服器；其他一切仍被封鎖。"
