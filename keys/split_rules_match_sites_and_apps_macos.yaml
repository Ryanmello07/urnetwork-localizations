description: "Split rules screen on macOS 15 and later: the rules match sites and addresses, and an app is kept off the VPN by adding it in the Apps section below (the section is titled with the \"Apps\" string, so use the same word as that title). Notes that local network addresses already bypass the VPN. Keep Mac and VPN unchanged."
source: "Split rules match sites and addresses. To keep an app off the VPN on this Mac, add it under Apps. Local network addresses already bypass the VPN."
platforms:
  - apple
localizations:
  ar: "تطابق قواعد التقسيم المواقع والعناوين. لإبقاء تطبيق خارج VPN على جهاز Mac هذا، أضفه ضمن التطبيقات. عناوين الشبكة المحلية تتجاوز VPN بالفعل."
  cs: "Pravidla rozdělení se vztahují na weby a adresy. Chcete-li na tomto Macu ponechat aplikaci mimo VPN, přidejte ji v části Aplikace. Adresy místní sítě už VPN obcházejí."
  de: "Split-Regeln gelten für Websites und Adressen. Um eine App auf diesem Mac vom VPN auszunehmen, füge sie unter Apps hinzu. Adressen im lokalen Netzwerk umgehen das VPN bereits."
  el: "Οι κανόνες διαχωρισμού ισχύουν για ιστότοπους και διευθύνσεις. Για να κρατήσετε μια εφαρμογή εκτός VPN σε αυτό το Mac, προσθέστε την στις Εφαρμογές. Οι διευθύνσεις του τοπικού δικτύου παρακάμπτουν ήδη το VPN."
  en: "Split rules match sites and addresses. To keep an app off the VPN on this Mac, add it under Apps. Local network addresses already bypass the VPN."
  es: "Las reglas de división se aplican a sitios y direcciones. Para dejar una app fuera de la VPN en este Mac, añádela en Apps. Las direcciones de la red local ya omiten la VPN."
  es-419: "Las reglas de división se aplican a sitios y direcciones. Para dejar una app fuera de la VPN en esta Mac, agrégala en Apps. Las direcciones de la red local ya omiten la VPN."
  es-MX: "Las reglas de división se aplican a sitios y direcciones. Para dejar una app fuera de la VPN en esta Mac, agrégala en Apps. Las direcciones de la red local ya omiten la VPN."
  fr: "Les règles de séparation s’appliquent aux sites et aux adresses. Pour garder une app hors du VPN sur ce Mac, ajoutez-la dans Applications. Les adresses du réseau local contournent déjà le VPN."
  he: "כללי פיצול חלים על אתרים וכתובות. כדי להשאיר אפליקציה מחוץ ל-VPN ב-Mac הזה, הוסף אותה תחת אפליקציות. כתובות ברשת המקומית כבר עוקפות את ה-VPN."
  hi: "स्प्लिट नियम साइटों और पतों पर लागू होते हैं। इस Mac पर किसी ऐप को VPN से बाहर रखने के लिए, उसे ऐप्स में जोड़ें। लोकल नेटवर्क के पते पहले से VPN को बायपास करते हैं।"
  id: "Aturan pemisahan berlaku untuk situs dan alamat. Agar aplikasi tidak melalui VPN di Mac ini, tambahkan di Aplikasi. Alamat jaringan lokal sudah tidak melalui VPN."
  it: "Le regole di suddivisione si applicano a siti e indirizzi. Per tenere un’app fuori dalla VPN su questo Mac, aggiungila in App. Gli indirizzi della rete locale aggirano già la VPN."
  ja: "分割ルールが対象にするのはサイトとアドレスです。このMacでアプリをVPNの対象外にするには、「アプリ」に追加してください。ローカルネットワークのアドレスは、すでにVPNを経由しません。"
  ko: "분할 규칙은 사이트와 주소에 적용됩니다. 이 Mac에서 앱을 VPN에서 제외하려면 '앱'에 추가하세요. 로컬 네트워크 주소는 이미 VPN을 우회합니다."
  nl: "Splitsregels gelden voor sites en adressen. Om een app op deze Mac buiten de VPN te houden, voeg je hem toe onder Apps. Adressen in het lokale netwerk omzeilen de VPN al."
  pl: "Reguły podziału dotyczą witryn i adresów. Aby wyłączyć aplikację z VPN na tym Macu, dodaj ją w sekcji Aplikacje. Adresy sieci lokalnej już omijają VPN."
  pt: "As regras de divisão se aplicam a sites e endereços. Para manter um app fora da VPN neste Mac, adicione-o em Aplicações. Os endereços da rede local já ignoram a VPN."
  pt-BR: "As regras de divisão se aplicam a sites e endereços. Para manter um app fora da VPN neste Mac, adicione-o em Apps. Os endereços da rede local já ignoram a VPN."
  pt-PT: "As regras de divisão aplicam-se a sites e endereços. Para manter uma aplicação fora da VPN neste Mac, adicione-a em Aplicações. Os endereços da rede local já ignoram a VPN."
  ru: "Правила разделения применяются к сайтам и адресам. Чтобы приложение на этом Mac работало вне VPN, добавьте его в разделе «Приложения». Адреса локальной сети уже идут в обход VPN."
  sv: "Delningsregler gäller webbplatser och adresser. Om du vill hålla en app utanför VPN:et på den här Macen lägger du till den under Appar. Adresser i det lokala nätverket kringgår redan VPN:et."
  sw: "Sheria za mgawanyo zinahusu tovuti na anwani. Ili kuweka programu nje ya VPN kwenye Mac hii, iongeze chini ya Programu. Anwani za mtandao wa ndani tayari zinapita nje ya VPN."
  th: "กฎแยกเส้นทางใช้กับเว็บไซต์และที่อยู่ หากต้องการให้แอปบน Mac เครื่องนี้ไม่ผ่าน VPN ให้เพิ่มแอปนั้นในส่วนแอป ที่อยู่ในเครือข่ายภายในข้าม VPN อยู่แล้ว"
  uk: "Правила розділення застосовуються до сайтів і адрес. Щоб застосунок на цьому Mac працював поза VPN, додайте його в розділі «Застосунки». Адреси локальної мережі вже оминають VPN."
  vi: "Quy tắc tách luồng áp dụng cho trang web và địa chỉ. Để giữ một ứng dụng ngoài VPN trên máy Mac này, hãy thêm ứng dụng đó trong mục Ứng dụng. Địa chỉ mạng cục bộ vốn đã bỏ qua VPN."
  zh: "分流规则针对的是网站和地址。要让此 Mac 上的某个应用不走 VPN，请将它添加到“应用”中。本地网络地址本来就不经过 VPN。"
  zh-HK: "分流規則針對的是網站和地址。如要讓這部 Mac 上的某個應用程式不經 VPN，請將它加入「應用程式」。本地網絡地址本來就不經過 VPN。"
