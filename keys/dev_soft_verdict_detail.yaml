description: "Developer tools screen: explanatory subtext under the 'soft verdict' control."
source: "Ambiguous verdicts bench an exit instead of tearing down its flows; removal needs sustained evidence or an empty exit"
platforms:
  - android
  - linux
  - apple
localizations:
  ar: "الأحكام الملتبسة تحجر المخرج بدلًا من قطع تدفقاته؛ وتتطلب الإزالة أدلة مستمرة أو مخرجًا فارغًا"
  cs: "Nejednoznačné verdikty pošlou výstup na lavičku, místo aby ukončily jeho toky; odstranění vyžaduje trvalé důkazy nebo prázdný výstup"
  de: "Mehrdeutige Urteile setzen einen Exit auf die Ersatzbank, statt seine Flows abzubauen; für eine Entfernung braucht es anhaltende Hinweise oder einen leeren Exit"
  el: "Οι αμφίσημες ετυμηγορίες βάζουν μια έξοδο στον πάγκο αντί να τερματίζουν τις ροές της· η αφαίρεση απαιτεί επίμονα στοιχεία ή κενή έξοδο"
  en: "Ambiguous verdicts bench an exit instead of tearing down its flows; removal needs sustained evidence or an empty exit"
  es: "Los veredictos ambiguos mandan una salida al banquillo en lugar de cerrar sus flujos; eliminarla requiere indicios sostenidos o una salida vacía"
  es-419: "Los veredictos ambiguos mandan una salida a la banca en lugar de cerrar sus flujos; eliminarla requiere indicios sostenidos o una salida vacía"
  es-MX: "Los veredictos ambiguos mandan una salida a la banca en lugar de cerrar sus flujos; eliminarla requiere indicios sostenidos o una salida vacía"
  fr: "Les verdicts ambigus mettent une sortie sur la touche au lieu de couper ses flux ; le retrait exige des indices persistants ou une sortie vide"
  he: "הכרעות לא חד-משמעיות מעבירות יציאה לספסל במקום לנתק את הזרימות שלה; הסרה דורשת ראיות מתמשכות או יציאה ריקה"
  hi: "अस्पष्ट फ़ैसले एग्ज़िट के फ़्लो तोड़ने के बजाय उसे बेंच पर भेजते हैं; हटाने के लिए लगातार सबूत या खाली एग्ज़िट चाहिए"
  id: "Vonis yang ambigu mencadangkan exit alih-alih memutus alirannya; penghapusan memerlukan bukti yang berkelanjutan atau exit yang kosong"
  it: "I verdetti ambigui mandano un’uscita in panchina invece di chiudere i suoi flussi; la rimozione richiede prove persistenti o un’uscita vuota"
  ja: "あいまいな判定では、フローを切断せずに出口を待機させます。除外には継続的な証拠か空の出口が必要です"
  ko: "모호한 판정은 플로우를 끊지 않고 출구를 대기시킵니다. 제외하려면 지속적인 근거나 빈 출구가 필요합니다"
  nl: "Onduidelijke oordelen zetten een exit op de bank in plaats van zijn flows af te breken; verwijderen vraagt aanhoudend bewijs of een lege exit"
  pl: "Niejednoznaczne werdykty sadzają wyjście na ławce, zamiast zrywać jego przepływy; usunięcie wymaga trwałych dowodów albo pustego wyjścia"
  pt: "Os veredictos ambíguos põem uma saída no banco em vez de terminar os seus fluxos; a remoção exige indícios persistentes ou uma saída vazia"
  pt-BR: "Vereditos ambíguos põem uma saída no banco em vez de encerrar seus fluxos; a remoção exige evidência persistente ou uma saída vazia"
  pt-PT: "Os veredictos ambíguos põem uma saída no banco em vez de terminar os seus fluxos; a remoção exige indícios persistentes ou uma saída vazia"
  ru: "Неоднозначные вердикты отстраняют выход, а не разрывают его потоки; для удаления нужны устойчивые признаки или пустой выход"
  sv: "Tvetydiga domar bänkar en utgång i stället för att riva dess flöden; borttagning kräver ihållande belägg eller en tom utgång"
  sw: "Hukumu zisizo wazi huweka njia ya kutoka benchi badala ya kuvunja mitiririko yake; kuondoa kunahitaji ushahidi endelevu au njia ya kutoka isiyo na kitu"
  th: "คำตัดสินที่ไม่ชัดเจนจะพักทางออกไว้แทนการตัดโฟลว์ การลบต้องมีหลักฐานต่อเนื่องหรือทางออกว่าง"
  uk: "Неоднозначні вердикти відправляють вихід на лаву замість обриву його потоків; для видалення потрібні стійкі докази або порожній вихід"
  vi: "Các phán quyết không rõ ràng sẽ cho một điểm thoát dự bị thay vì cắt các luồng của nó; loại bỏ cần bằng chứng kéo dài hoặc một điểm thoát trống"
  zh: "不明确的判定会隔离出口，而不是断开其流；移除需要持续的证据或出口已空"
  zh-HK: "不明確的判定會隔離出口，而不是中斷其流；移除需要持續的證據或出口已空"
