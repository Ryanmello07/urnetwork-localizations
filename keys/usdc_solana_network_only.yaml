description: "Payment: the chain to send on. Shown wherever a USDC payment is requested, because USDC exists on many chains and a transfer sent on the wrong one is lost."
source: "Send USDC on the Solana network only. USDC sent on any other network will not arrive."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  en: "Send USDC on the Solana network only. USDC sent on any other network will not arrive."
  ar: "أرسل USDC على شبكة Solana فقط. لن تصل عملات USDC المُرسَلة عبر أي شبكة أخرى."
  cs: "USDC posílejte pouze v síti Solana. USDC odeslané v jiné síti nedorazí."
  de: "Sende USDC nur über das Solana-Netzwerk. USDC, die über ein anderes Netzwerk gesendet werden, kommen nicht an."
  el: "Στείλτε USDC μόνο στο δίκτυο Solana. Τα USDC που στέλνονται σε άλλο δίκτυο δεν θα φτάσουν."
  es: "Envía USDC solo por la red Solana. Los USDC enviados por cualquier otra red no llegarán."
  es-419: "Envía USDC solo por la red Solana. Los USDC enviados por cualquier otra red no llegarán."
  es-MX: "Envía USDC solo por la red Solana. Los USDC enviados por cualquier otra red no llegarán."
  fr: "Envoyez des USDC uniquement sur le réseau Solana. Les USDC envoyés sur un autre réseau n'arriveront pas."
  he: "שלחו USDC ברשת Solana בלבד. USDC שיישלחו ברשת אחרת לא יגיעו."
  hi: "USDC केवल Solana नेटवर्क पर भेजें। किसी अन्य नेटवर्क पर भेजे गए USDC नहीं पहुंचेंगे।"
  id: "Kirim USDC hanya di jaringan Solana. USDC yang dikirim di jaringan lain tidak akan sampai."
  it: "Invia USDC solo sulla rete Solana. Gli USDC inviati su un'altra rete non arriveranno."
  ja: "USDCはSolanaネットワークでのみ送金してください。他のネットワークで送金したUSDCは届きません。"
  ko: "USDC는 Solana 네트워크로만 보내세요. 다른 네트워크로 보낸 USDC는 도착하지 않습니다."
  nl: "Stuur USDC alleen via het Solana-netwerk. USDC die via een ander netwerk wordt verstuurd, komt niet aan."
  pl: "Wysyłaj USDC wyłącznie w sieci Solana. USDC wysłane w innej sieci nie dotrą."
  pt: "Envie USDC apenas na rede Solana. Os USDC enviados noutra rede não chegarão."
  pt-BR: "Envie USDC apenas na rede Solana. Os USDC enviados em outra rede não vão chegar."
  pt-PT: "Envie USDC apenas na rede Solana. Os USDC enviados noutra rede não chegarão."
  ru: "Отправляйте USDC только в сети Solana. USDC, отправленные в другой сети, не дойдут."
  sv: "Skicka USDC endast på Solana-nätverket. USDC som skickas på ett annat nätverk kommer inte fram."
  sw: "Tuma USDC kwenye mtandao wa Solana pekee. USDC zilizotumwa kwenye mtandao mwingine hazitafika."
  th: "ส่ง USDC บนเครือข่าย Solana เท่านั้น USDC ที่ส่งบนเครือข่ายอื่นจะไม่เข้าบัญชี"
  uk: "Надсилайте USDC лише в мережі Solana. USDC, надіслані в іншій мережі, не дійдуть."
  vi: "Chỉ gửi USDC trên mạng Solana. USDC gửi trên mạng khác sẽ không đến nơi."
  zh: "请仅在 Solana 网络上发送 USDC。通过其他网络发送的 USDC 将无法到账。"
  zh-HK: "請僅在 Solana 網絡上發送 USDC。透過其他網絡發送的 USDC 將無法到賬。"
