description: "Manage subscription (ur.io's screen; Settings in the Windows app, Account in the Linux app): Stripe did not answer or refused the change, or the billing portal could not be opened; trying again usually works (error.code store_unavailable)."
source: "Stripe could not be reached just now. Try again in a moment."
platforms:
  - site
  - windows
  - linux
localizations:
