description: "Accessibility label for one contract stack in the contracts widget. The arguments are the number of contracts and the bytes moved."
source: "%lld contracts, %@"
platforms:
  - apple
  - android
placeholders:
  - name: count
    type: int
  - name: bytes
    type: string
plurals:
  select: count
localizations:
  ar:
    zero: "{count} عقد، {bytes}"
    one: "عقد واحد، {bytes}"
    two: "عقدان، {bytes}"
    few: "{count} عقود، {bytes}"
    many: "{count} عقدًا، {bytes}"
    other: "{count} عقد، {bytes}"
  cs:
    one: "{count} kontrakt, {bytes}"
    few: "{count} kontrakty, {bytes}"
    many: "{count} kontraktu, {bytes}"
