description: "Compact relative-time label with an abbreviated hours unit (\"3h ago\"), shown by the windows and linux stats formatters for events an hour or more old. The argument is the elapsed hours. Not a plural: the abbreviated unit does not inflect, but the word order and the unit abbreviation localize."
source: "{count}h ago"
platforms:
  - windows
  - linux
  - site
