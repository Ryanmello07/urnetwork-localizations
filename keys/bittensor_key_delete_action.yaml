description: "Key screen: the screen that shows the Bittensor recovery phrase, a 12 word secret for a key this app made on the device. The one destructive button: the user says the phrase is saved, and the app may forget it."
source: "I have saved the key, it's OK to delete it now."
platforms:
  - apple
  - android
