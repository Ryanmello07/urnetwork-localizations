description: "Re-engagement 'what changed' item for readers in mainland China. 'Connection region' is the setting's name in the app (keep it identical to the app's label). Sent only once the build the reader can install has the setting."
source: "A Connection region setting for people in mainland China. Choose China, and the app finds our servers through local resolvers when the usual ones are blocked."
platforms:
  - email
localizations:
  en: "A Connection region setting for people in mainland China. Choose China, and the app finds our servers through local resolvers when the usual ones are blocked."
  ar: "إعداد «منطقة الاتصال» للأشخاص في البر الرئيسي للصين. اختر الصين، وسيجد التطبيق خوادمنا عبر محلّلات DNS محلية عندما تكون المحلّلات المعتادة محجوبة."
  cs: "Nastavení Oblast připojení pro lidi v pevninské Číně. Zvolte Čínu a aplikace najde naše servery přes místní resolvery, když jsou ty obvyklé zablokované."
  de: "Eine Einstellung „Verbindungsregion“ für Menschen in Festlandchina. Wähle China, und die App findet unsere Server über lokale Resolver, wenn die üblichen blockiert sind."
  el: "Περιοχή σύνδεσης: μια ρύθμιση για όσους βρίσκονται στην ηπειρωτική Κίνα. Διάλεξε την Κίνα και η εφαρμογή βρίσκει τους διακομιστές μας μέσω τοπικών επιλυτών όταν οι συνηθισμένοι είναι αποκλεισμένοι."
  es: "Región de conexión, un ajuste para quienes están en China continental. Elige China y la app encuentra nuestros servidores mediante resolvedores locales cuando los habituales están bloqueados."
  es-419: "Región de conexión, un ajuste para quienes están en China continental. Elige China y la app encuentra nuestros servidores mediante resolvedores locales cuando los habituales están bloqueados."
  es-MX: "Región de conexión, un ajuste para quienes están en China continental. Elige China y la app encuentra nuestros servidores mediante resolvedores locales cuando los habituales están bloqueados."
  fr: "Région de connexion, un réglage pour les personnes en Chine continentale. Choisis la Chine, et l'app trouve nos serveurs via des résolveurs locaux quand les résolveurs habituels sont bloqués."
  he: "הגדרת ״אזור החיבור״ לאנשים בסין היבשתית. בוחרים בסין, והאפליקציה מוצאת את השרתים שלנו דרך פותרי DNS מקומיים כשהפותרים הרגילים חסומים."
  hi: "मुख्यभूमि चीन में मौजूद लोगों के लिए एक “कनेक्शन क्षेत्र” सेटिंग। चीन चुनें, और जब सामान्य रिज़ॉल्वर ब्लॉक हों, तब ऐप स्थानीय रिज़ॉल्वर के ज़रिए हमारे सर्वर ढूँढ लेता है।"
  id: "Pengaturan “Wilayah koneksi” untuk orang-orang di Tiongkok daratan. Pilih Tiongkok, dan aplikasi akan menemukan server kami lewat resolver lokal saat resolver yang biasa diblokir."
  it: "Regione di connessione, un'impostazione per chi si trova nella Cina continentale. Scegli la Cina e l'app trova i nostri server tramite resolver locali quando quelli abituali sono bloccati."
  ja: "中国本土にいる方のための「接続地域」設定。「中国」を選ぶと、通常のリゾルバーがブロックされているときに、アプリが現地のリゾルバーを通じて私たちのサーバーを見つけます。"
  ko: "중국 본토에 계신 분들을 위한 '연결 지역' 설정. '중국'을 선택하면, 평소 쓰던 리졸버가 차단되었을 때 앱이 현지 리졸버를 통해 저희 서버를 찾습니다."
  nl: "Een instelling Verbindingsregio voor mensen op het Chinese vasteland. Kies China, en de app vindt onze servers via lokale resolvers als de gebruikelijke geblokkeerd zijn."
  pl: "Ustawienie Region połączenia dla osób w Chinach kontynentalnych. Wybierz Chiny, a aplikacja znajdzie nasze serwery przez lokalne resolwery, gdy zwykłe są zablokowane."
  pt: "Região de ligação, uma configuração para quem está na China continental. Escolha a China e o app encontra nossos servidores por meio de resolvedores locais quando os habituais estão bloqueados."
  pt-BR: "Região de conexão, uma configuração para quem está na China continental. Escolha a China e o app encontra nossos servidores por meio de resolvedores locais quando os habituais estão bloqueados."
  pt-PT: "Região de ligação, uma definição para quem está na China continental. Escolha a China e a app encontra os nossos servidores através de resolvedores locais quando os habituais estão bloqueados."
  ru: "Настройка «Регион подключения» для тех, кто находится в материковом Китае. Выберите Китай, и приложение найдёт наши серверы через локальные резолверы, когда обычные заблокированы."
  sv: "Inställningen Anslutningsregion för personer i Fastlandskina. Välj Kina, så hittar appen våra servrar via lokala resolvrar när de vanliga är blockerade."
  sw: "Mpangilio wa “Eneo la muunganisho” kwa watu walioko China bara. Chagua China, na programu itapata seva zetu kupitia visuluhishi vya ndani pale vile vya kawaida vinapozuiwa."
  th: "การตั้งค่า “ภูมิภาคการเชื่อมต่อ” สำหรับผู้ที่อยู่ในจีนแผ่นดินใหญ่ เลือกจีน แล้วแอปจะค้นหาเซิร์ฟเวอร์ของเราผ่านตัวแปลง DNS ในประเทศเมื่อตัวที่ใช้ตามปกติถูกบล็อก"
  uk: "Налаштування «Регіон підключення» для тих, хто перебуває в материковому Китаї. Виберіть Китай, і застосунок знайде наші сервери через локальні резолвери, коли звичайні заблоковано."
  vi: "Cài đặt “Khu vực kết nối” cho những người ở Trung Quốc đại lục. Chọn Trung Quốc, và ứng dụng sẽ tìm máy chủ của chúng tôi qua các trình phân giải trong nước khi những trình phân giải thông thường bị chặn."
  zh: "面向中国大陆用户的“连接地区”设置。选择“中国”后，当常用的解析器被屏蔽时，应用会通过本地解析器找到我们的服务器。"
  zh-HK: "為中國內地用戶而設的「連線地區」設定。選擇「中國」後，當平常使用的解析器被封鎖時，應用程式會透過本地解析器找到我們的伺服器。"
