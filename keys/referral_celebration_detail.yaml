description: "Body of the one-time full-screen crowning celebration shown to the referrer when a friend joins with their code. {count} is the number of friends that just joined, {data} the daily GiB bonus per referral (currently 3)."
source: "%1$lld friends just joined URnetwork with your code. Each one earns you +%2$lld GiB a day of free data — for life."
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: count
    type: int
  - name: data
    type: int
plurals:
  select: count
