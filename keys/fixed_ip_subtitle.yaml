description: "Subtitle under the Fixed IP toggle in the connect options. With Fixed IP on, the connection keeps the same exit (provider) for the whole session, so the egress IP stays the same unless that provider goes offline."
source: "Keeps one exit for the session; changes only if that provider goes offline."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "يحتفظ بمخرج واحد طوال الجلسة؛ ولا يتغير إلا إذا انقطع اتصال ذلك المزود."
  cs: "Ponechá jeden výstup po celou relaci; změní se, jen když se tento poskytovatel odpojí."
  de: "Behält einen Exit für die Sitzung; wechselt nur, wenn dieser Anbieter offline geht."
  el: "Διατηρεί μία έξοδο για όλη τη συνεδρία· αλλάζει μόνο αν αυτός ο πάροχος αποσυνδεθεί."
  en: "Keeps one exit for the session; changes only if that provider goes offline."
  es: "Mantiene una sola salida durante la sesión; solo cambia si ese proveedor se desconecta."
  es-419: "Mantiene una sola salida durante la sesión; solo cambia si ese proveedor se desconecta."
  es-MX: "Mantiene una sola salida durante la sesión; solo cambia si ese proveedor se desconecta."
  fr: "Conserve une seule sortie pendant la session ; elle ne change que si ce fournisseur se déconnecte."
  he: "שומר על יציאה אחת לאורך ההפעלה; משתנה רק אם הספק הזה מתנתק."
  hi: "पूरे सत्र में एक ही एग्ज़िट रखता है; यह तभी बदलता है जब वह प्रदाता ऑफ़लाइन हो जाए।"
  id: "Mempertahankan satu titik keluar selama sesi; hanya berubah jika penyedia tersebut offline."
  it: "Mantiene una sola uscita per tutta la sessione; cambia solo se quel provider va offline."
  ja: "セッション中は同じ出口を使い続けます。そのプロバイダーがオフラインになった場合にのみ変わります。"
  ko: "세션 동안 하나의 출구를 유지하며, 해당 제공자가 오프라인이 될 때만 바뀝니다."
  nl: "Houdt één exit aan voor de sessie; wisselt alleen als die aanbieder offline gaat."
  pl: "Utrzymuje jedno wyjście przez całą sesję; zmienia się tylko wtedy, gdy ten dostawca przejdzie w tryb offline."
  pt: "Mantém uma única saída durante a sessão; só muda se esse provedor ficar offline."
  pt-BR: "Mantém uma única saída durante a sessão; só muda se esse provedor ficar offline."
  pt-PT: "Mantém uma única saída durante a sessão; só muda se esse fornecedor ficar offline."
  ru: "Сохраняет один выход на всю сессию; меняется, только если этот провайдер отключится."
  sv: "Behåller en utgång under hela sessionen; byts bara om den leverantören går offline."
  sw: "Hutumia njia moja ya kutoka kwa kipindi chote; hubadilika tu ikiwa mtoa huduma huyo atatoka mtandaoni."
  th: "ใช้ทางออกเดียวตลอดเซสชัน และจะเปลี่ยนก็ต่อเมื่อผู้ให้บริการนั้นออฟไลน์เท่านั้น"
  uk: "Зберігає один вихід на всю сесію; змінюється, лише якщо цей провайдер відключиться."
  vi: "Giữ một điểm thoát trong suốt phiên; chỉ thay đổi nếu nhà cung cấp đó ngoại tuyến."
  zh: "在整个会话中保持同一个出口；仅当该提供商离线时才会更换。"
  zh-HK: "在整個工作階段中保持同一個出口；只有該供應商離線時才會更換。"
