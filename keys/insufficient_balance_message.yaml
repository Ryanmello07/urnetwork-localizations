description: "Body of the warning shown when the balance runs out; the tunnel disconnects without more balance or a plan."
source: "Add balance or a plan to keep connecting."
platforms:
  - windows
localizations:
  ar: "أضف رصيدًا أو اشترك في خطة لمواصلة الاتصال."
  cs: "Přidejte zůstatek nebo tarif, abyste se mohli dále připojovat."
  de: "Füge Guthaben oder einen Tarif hinzu, um weiterhin verbunden zu bleiben."
  el: "Προσθέστε υπόλοιπο ή ένα πρόγραμμα για να συνεχίσετε να συνδέεστε."
  en: "Add balance or a plan to keep connecting."
  es: "Añade saldo o un plan para seguir conectándote."
  es-419: "Agrega saldo o un plan para seguir conectándote."
  es-MX: "Agrega saldo o un plan para seguir conectándote."
  fr: "Ajoutez du solde ou un forfait pour continuer à vous connecter."
  he: "הוסיפו יתרה או תוכנית כדי להמשיך להתחבר."
  hi: "कनेक्ट करना जारी रखने के लिए शेष राशि या कोई प्लान जोड़ें।"
  id: "Tambahkan saldo atau paket untuk tetap terhubung."
  it: "Aggiungi saldo o un piano per continuare a connetterti."
  ja: "接続を続けるには、残高またはプランを追加してください。"
  ko: "계속 연결하려면 잔액 또는 요금제를 추가하세요."
  nl: "Voeg saldo of een abonnement toe om verbinding te blijven maken."
  pl: "Dodaj środki lub plan, aby dalej się łączyć."
  pt: "Adicione saldo ou um plano para continuar a ligar-se."
  pt-BR: "Adicione saldo ou um plano para continuar se conectando."
  pt-PT: "Adicione saldo ou um plano para continuar a ligar-se."
  ru: "Пополните баланс или подключите тариф, чтобы продолжать подключаться."
  sv: "Lägg till saldo eller ett abonnemang för att fortsätta ansluta."
  sw: "Ongeza salio au mpango ili kuendelea kuunganisha."
  th: "เพิ่มยอดเงินหรือแพ็กเกจเพื่อเชื่อมต่อต่อไป"
  uk: "Поповніть баланс або підключіть тариф, щоб продовжувати підключатися."
  vi: "Thêm số dư hoặc gói cước để tiếp tục kết nối."
  zh: "添加余额或套餐以继续连接。"
  zh-HK: "新增餘額或方案以繼續連接。"
