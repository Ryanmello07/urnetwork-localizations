description: "Split rules screen: hint shown while there are no rules yet. Routing locally sends traffic outside the VPN; holding to one provider keeps a site on the same VPN exit."
source: "Add a host above, or tap traffic below to route it locally or hold it to one provider."
platforms:
  - apple
localizations:
  ar: "أضف مضيفًا أعلاه، أو انقر على حركة المرور أدناه لتوجيهها محليًا أو إبقائها على مزود واحد."
  cs: "Přidejte hostitele výše nebo klepněte na provoz níže, abyste ho směrovali lokálně nebo drželi u jednoho poskytovatele."
  de: "Füge oben einen Host hinzu oder tippe unten auf Datenverkehr, um ihn lokal zu leiten oder bei einem Anbieter zu halten."
  el: "Προσθέστε έναν host παραπάνω ή πατήστε την κίνηση παρακάτω για να τη δρομολογήσετε τοπικά ή να την κρατήσετε σε έναν πάροχο."
  en: "Add a host above, or tap traffic below to route it locally or hold it to one provider."
  es: "Añade un host arriba o pulsa el tráfico de abajo para enrutarlo localmente o mantenerlo en un solo proveedor."
  es-419: "Agrega un host arriba o toca el tráfico de abajo para enrutarlo localmente o mantenerlo en un solo proveedor."
  es-MX: "Agrega un host arriba o toca el tráfico de abajo para enrutarlo localmente o mantenerlo en un solo proveedor."
  fr: "Ajoutez un hôte ci-dessus, ou appuyez sur le trafic ci-dessous pour le router localement ou le garder sur un seul fournisseur."
  he: "הוסיפו מארח למעלה, או הקישו על התעבורה שלמטה כדי לנתב אותה מקומית או להשאיר אותה אצל ספק אחד."
  hi: "ऊपर एक होस्ट जोड़ें, या नीचे किसी ट्रैफ़िक पर टैप करें ताकि वह स्थानीय रूप से रूट हो या एक प्रदाता पर रहे।"
  id: "Tambahkan host di atas, atau ketuk lalu lintas di bawah untuk merutekannya secara lokal atau menahannya di satu penyedia."
  it: "Aggiungi un host qui sopra, oppure tocca il traffico qui sotto per instradarlo localmente o mantenerlo su un solo provider."
  ja: "上でホストを追加するか、下のトラフィックをタップして、ローカルにルーティングするか 1 つのプロバイダーに固定します。"
  ko: "위에서 호스트를 추가하거나 아래 트래픽을 탭하여 로컬로 라우팅하거나 하나의 제공업체에 고정하세요."
  nl: "Voeg hierboven een host toe, of tik hieronder op verkeer om het lokaal te routeren of bij één provider te houden."
  pl: "Dodaj host powyżej lub stuknij ruch poniżej, aby kierować go lokalnie albo trzymać przy jednym dostawcy."
  pt: "Adicione um host acima ou toque no tráfego abaixo para roteá-lo localmente ou mantê-lo em um único provedor."
  pt-BR: "Adicione um host acima ou toque no tráfego abaixo para roteá-lo localmente ou mantê-lo em um único provedor."
  pt-PT: "Adicione um host acima ou toque no tráfego abaixo para o encaminhar localmente ou o manter num único fornecedor."
  ru: "Добавьте хост выше или нажмите на трафик ниже, чтобы направить его локально или закрепить за одним провайдером."
  sv: "Lägg till en värd ovan, eller tryck på trafik nedan för att dirigera den lokalt eller hålla den till en leverantör."
  sw: "Ongeza mwenyeji hapo juu, au gusa trafiki hapa chini ili ipitishwe ndani au ibaki kwa mtoa huduma mmoja."
  th: "เพิ่มโฮสต์ด้านบน หรือแตะทราฟฟิกด้านล่างเพื่อส่งผ่านภายในเครื่องหรือคงไว้กับผู้ให้บริการรายเดียว"
  uk: "Додайте хост вище або торкніться трафіку нижче, щоб спрямувати його локально або закріпити за одним провайдером."
  vi: "Thêm một host ở trên, hoặc chạm vào lưu lượng bên dưới để định tuyến cục bộ hoặc giữ nó ở một nhà cung cấp."
  zh: "在上方添加主机，或点按下方的流量，将其改走本地路由或固定到一个提供商。"
  zh-HK: "在上方新增主機，或輕按下方的流量，將其改走本地路由或固定到單一供應商。"
