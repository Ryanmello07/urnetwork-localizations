description: "Update notice error (Linux Settings, Windows update banner): the release download failed."
source: "The download didn't finish. Check the connection and click to try again."
platforms:
  - linux
  - windows
localizations:
  ar: "لم يكتمل التنزيل. تحقق من الاتصال وانقر لإعادة المحاولة."
  cs: "Stahování se nedokončilo. Zkontrolujte připojení a klikněte, abyste to zkusili znovu."
  de: "Der Download wurde nicht abgeschlossen. Prüfe die Verbindung und klicke, um es erneut zu versuchen."
  el: "Η λήψη δεν ολοκληρώθηκε. Ελέγξτε τη σύνδεση και κάντε κλικ για να δοκιμάσετε ξανά."
  en: "The download didn't finish. Check the connection and click to try again."
  es: "La descarga no terminó. Comprueba la conexión y haz clic para volver a intentarlo."
  es-419: "La descarga no terminó. Revisa la conexión y haz clic para volver a intentarlo."
  es-MX: "La descarga no terminó. Revisa la conexión y haz clic para volver a intentarlo."
  fr: "Le téléchargement n’a pas abouti. Vérifiez la connexion et cliquez pour réessayer."
  he: "ההורדה לא הושלמה. בדקו את החיבור ולחצו כדי לנסות שוב."
  hi: "डाउनलोड पूरा नहीं हुआ। कनेक्शन जाँचें और फिर से कोशिश करने के लिए क्लिक करें।"
  id: "Unduhan tidak selesai. Periksa koneksi dan klik untuk mencoba lagi."
  it: "Il download non è stato completato. Controlla la connessione e fai clic per riprovare."
  ja: "ダウンロードが完了しませんでした。接続を確認し、クリックして再試行してください。"
  ko: "다운로드가 완료되지 않았습니다. 연결을 확인하고 클릭하여 다시 시도하세요."
  nl: "De download is niet voltooid. Controleer de verbinding en klik om het opnieuw te proberen."
  pl: "Pobieranie nie zostało ukończone. Sprawdź połączenie i kliknij, aby spróbować ponownie."
  pt: "O download não terminou. Verifique a conexão e clique para tentar novamente."
  pt-BR: "O download não terminou. Verifique a conexão e clique para tentar novamente."
  pt-PT: "A transferência não terminou. Verifique a ligação e clique para tentar novamente."
  ru: "Загрузка не завершилась. Проверьте подключение и нажмите, чтобы попробовать снова."
  sv: "Nedladdningen slutfördes inte. Kontrollera anslutningen och klicka för att försöka igen."
  sw: "Upakuaji haukukamilika. Angalia muunganisho kisha ubofye ili ujaribu tena."
  th: "ดาวน์โหลดไม่เสร็จ ตรวจสอบการเชื่อมต่อแล้วคลิกเพื่อลองอีกครั้ง"
  uk: "Завантаження не завершилося. Перевірте з’єднання й натисніть, щоб спробувати ще раз."
  vi: "Quá trình tải về chưa hoàn tất. Kiểm tra kết nối và nhấp để thử lại."
  zh: "下载未完成。请检查网络连接，然后点击重试。"
  zh-HK: "下載未完成。請檢查網絡連線，然後按一下再試一次。"
