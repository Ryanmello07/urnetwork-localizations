  ja: "今すぐ新しいリリースを確認します。結果は上の行に表示されます。"
  ko: "지금 새 릴리스를 확인합니다. 결과는 위 행에 표시됩니다."
  nl: "Zoekt nu naar een nieuwe release; de uitkomst verschijnt in de rij hierboven."
  pl: "Sprawdza teraz, czy jest nowe wydanie; wynik pojawi się w wierszu powyżej."
  pt: "Procura agora uma nova versão; o resultado aparece na linha acima."
  pt-BR: "Verifica agora se há uma nova versão; o resultado aparece na linha acima."
  pt-PT: "Procura agora uma nova versão; o resultado aparece na linha acima."
  ru: "Проверяет наличие нового выпуска прямо сейчас; результат появится в строке выше."
  sv: "Söker efter en ny version nu; resultatet visas på raden ovanför."
  sw: "Huangalia toleo jipya sasa hivi; matokeo huonekana kwenye safu iliyo juu."
  th: "ตรวจหารุ่นใหม่ทันที ผลลัพธ์จะแสดงในแถวด้านบน"
  uk: "Перевіряє наявність нового випуску просто зараз; результат з’явиться в рядку вище."
  vi: "Kiểm tra bản phát hành mới ngay bây giờ; kết quả hiển thị ở hàng phía trên."
  zh: "立即检查新版本；结果会显示在上方一行。"
  zh-HK: "立即檢查新版本；結果會顯示在上方一行。"
