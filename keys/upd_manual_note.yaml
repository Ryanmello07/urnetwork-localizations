  cs: "Hned teď vyhledá nové vydání; výsledek se zobrazí v řádku výše."
  de: "Sucht jetzt nach einer neuen Version; das Ergebnis erscheint in der Zeile darüber."
  el: "Ελέγχει τώρα για νέα έκδοση· το αποτέλεσμα εμφανίζεται στη γραμμή από πάνω."
  en: "Runs the release check now; the outcome lands on the row above."
  es: "Busca una nueva versión ahora; el resultado aparece en la fila de arriba."
  es-419: "Busca una nueva versión ahora; el resultado aparece en la fila de arriba."
  es-MX: "Busca una nueva versión ahora; el resultado aparece en la fila de arriba."
  fr: "Recherche une nouvelle version maintenant ; le résultat s’affiche sur la ligne ci-dessus."
  he: "בודק עכשיו אם יש גרסה חדשה; התוצאה מופיעה בשורה שלמעלה."
  hi: "अभी नए रिलीज़ की जाँच करता है; नतीजा ऊपर वाली पंक्ति में दिखता है।"
  id: "Memeriksa rilis baru sekarang; hasilnya muncul di baris di atas."
