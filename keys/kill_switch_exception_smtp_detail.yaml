description: "Explains the deliberate SMTP port 25 exception to the VPN kill switch, that IPv6 is routed through the tunnel, and the encrypted SMTP behavior."
source: "While the VPN is connected, IPv6 is routed through URnetwork like IPv4. Outbound SMTP on TCP port 25 bypasses the VPN, even when the kill switch is on, which may expose your local public IP to those mail servers. SMTP on ports 465 and 587 stays in the VPN and must establish TLS."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "أثناء اتصال VPN، يُوجَّه IPv6 عبر URnetwork مثل IPv4. يتجاوز SMTP الصادر عبر منفذ TCP رقم 25 شبكة VPN، حتى عند تشغيل مفتاح القتل، وقد يكشف ذلك عنوان IP العام المحلي لديك لخوادم البريد تلك. يبقى SMTP على المنفذين 465 و587 داخل VPN ويجب أن يُنشئ اتصال TLS."
  cs: "Když je VPN připojená, IPv6 se směruje přes URnetwork stejně jako IPv4. Odchozí SMTP na portu TCP 25 obchází VPN, i když je kill switch zapnutý, což může odhalit vaši místní veřejnou IP těmto poštovním serverům. SMTP na portech 465 a 587 zůstává ve VPN a musí navázat TLS."
  de: "Während das VPN verbunden ist, wird IPv6 wie IPv4 über URnetwork geleitet. Ausgehendes SMTP über TCP-Port 25 umgeht das VPN, selbst wenn der Kill switch aktiviert ist. Dadurch kann deine lokale öffentliche IP für diese Mailserver sichtbar werden. SMTP über die Ports 465 und 587 bleibt im VPN und muss TLS aufbauen."
  el: "Όσο το VPN είναι συνδεδεμένο, το IPv6 δρομολογείται μέσω του URnetwork όπως και το IPv4. Το εξερχόμενο SMTP στη θύρα TCP 25 παρακάμπτει το VPN, ακόμη και όταν το Kill switch είναι ενεργό, κάτι που μπορεί να εκθέσει την τοπική δημόσια IP σας σε αυτούς τους διακομιστές αλληλογραφίας. Το SMTP στις θύρες 465 και 587 μένει μέσα στο VPN και πρέπει να δημιουργήσει TLS."
  en: "While the VPN is connected, IPv6 is routed through URnetwork like IPv4. Outbound SMTP on TCP port 25 bypasses the VPN, even when the kill switch is on, which may expose your local public IP to those mail servers. SMTP on ports 465 and 587 stays in the VPN and must establish TLS."
  es: "Mientras la VPN está conectada, IPv6 se enruta a través de URnetwork igual que IPv4. El SMTP saliente por el puerto TCP 25 evita la VPN, incluso con el Kill switch activado, lo que puede exponer tu IP pública local a esos servidores de correo. El SMTP por los puertos 465 y 587 permanece en la VPN y debe establecer TLS."
  es-419: "Mientras la VPN está conectada, IPv6 se enruta a través de URnetwork igual que IPv4. El SMTP saliente por el puerto TCP 25 evita la VPN, incluso con el Kill switch activado, lo que puede exponer tu IP pública local a esos servidores de correo. El SMTP por los puertos 465 y 587 permanece en la VPN y debe establecer TLS."
  es-MX: "Mientras la VPN está conectada, IPv6 se enruta a través de URnetwork igual que IPv4. El SMTP saliente por el puerto TCP 25 evita la VPN, incluso con el Kill switch activado, lo que puede exponer tu IP pública local a esos servidores de correo. El SMTP por los puertos 465 y 587 permanece en la VPN y debe establecer TLS."
  fr: "Tant que le VPN est connecté, l’IPv6 passe par URnetwork comme l’IPv4. Le SMTP sortant sur le port TCP 25 contourne le VPN, même quand le Kill switch est activé, ce qui peut exposer votre IP publique locale à ces serveurs de messagerie. Le SMTP sur les ports 465 et 587 reste dans le VPN et doit établir TLS."
  he: "כשה-VPN מחובר, IPv6 מנותב דרך URnetwork בדיוק כמו IPv4. SMTP יוצא בפורט TCP 25 עוקף את ה-VPN, גם כשהקיל סוויץ' מופעל, ועלול לחשוף את כתובת ה-IP הציבורית המקומית שלכם לשרתי הדואר האלה. SMTP בפורטים 465 ו-587 נשאר ב-VPN וחייב ליצור TLS."
  hi: "VPN कनेक्ट रहने पर IPv6 को भी IPv4 की तरह URnetwork से रूट किया जाता है। TCP पोर्ट 25 पर आउटबाउंड SMTP, किल स्विच चालू होने पर भी, VPN को बायपास करता है, जिससे आपका स्थानीय सार्वजनिक IP उन मेल सर्वरों के सामने आ सकता है। पोर्ट 465 और 587 पर SMTP VPN में रहता है और उसे TLS स्थापित करना होता है।"
  id: "Saat VPN terhubung, IPv6 dirutekan melalui URnetwork seperti IPv4. SMTP keluar di port TCP 25 melewati VPN, bahkan saat Kill switch aktif, sehingga dapat memperlihatkan IP publik lokal Anda ke server email tersebut. SMTP di port 465 dan 587 tetap di dalam VPN dan harus membangun TLS."
  it: "Mentre la VPN è connessa, IPv6 passa attraverso URnetwork come IPv4. L’SMTP in uscita sulla porta TCP 25 aggira la VPN, anche con il Kill switch attivo, e può esporre il tuo IP pubblico locale a quei server di posta. L’SMTP sulle porte 465 e 587 resta nella VPN e deve stabilire TLS."
  ja: "VPN 接続中は、IPv6 も IPv4 と同様に URnetwork 経由でルーティングされます。TCP ポート 25 の送信 SMTP は、キルスイッチがオンでも VPN を経由しないため、あなたのローカルのパブリック IP がそれらのメールサーバーに知られる可能性があります。ポート 465 と 587 の SMTP は VPN 内にとどまり、TLS を確立する必要があります。"
  ko: "VPN이 연결되어 있는 동안 IPv6도 IPv4처럼 URnetwork를 통해 라우팅됩니다. TCP 포트 25의 발신 SMTP는 킬 스위치가 켜져 있어도 VPN을 우회하므로, 해당 메일 서버에 로컬 공인 IP가 노출될 수 있습니다. 포트 465와 587의 SMTP는 VPN 안에 머물며 TLS를 설정해야 합니다."
  nl: "Terwijl de VPN verbonden is, wordt IPv6 net als IPv4 via URnetwork gerouteerd. Uitgaande SMTP op TCP-poort 25 gaat buiten de VPN om, zelfs als de Kill switch aan staat, waardoor je lokale openbare IP zichtbaar kan worden voor die mailservers. SMTP op poort 465 en 587 blijft in de VPN en moet TLS opzetten."
  pl: "Gdy VPN jest połączony, IPv6 jest kierowany przez URnetwork tak samo jak IPv4. Wychodzący SMTP na porcie TCP 25 omija VPN, nawet przy włączonym Kill switchu, co może ujawnić twój lokalny publiczny adres IP tym serwerom pocztowym. SMTP na portach 465 i 587 zostaje w VPN i musi nawiązać TLS."
  pt: "Enquanto a VPN está ligada, o IPv6 é encaminhado pela URnetwork tal como o IPv4. O SMTP de saída na porta TCP 25 contorna a VPN, mesmo com o Kill switch ativado, o que pode expor o seu IP público local a esses servidores de correio. O SMTP nas portas 465 e 587 fica na VPN e tem de estabelecer TLS."
  pt-BR: "Enquanto a VPN está conectada, o IPv6 é roteado pela URnetwork como o IPv4. O SMTP de saída na porta TCP 25 contorna a VPN, mesmo com o Kill switch ativado, o que pode expor seu IP público local a esses servidores de e-mail. O SMTP nas portas 465 e 587 fica na VPN e precisa estabelecer TLS."
  pt-PT: "Enquanto a VPN está ligada, o IPv6 é encaminhado pela URnetwork tal como o IPv4. O SMTP de saída na porta TCP 25 contorna a VPN, mesmo com o Kill switch ativado, o que pode expor o seu IP público local a esses servidores de correio. O SMTP nas portas 465 e 587 fica na VPN e tem de estabelecer TLS."
  ru: "Пока VPN подключён, IPv6 маршрутизируется через URnetwork так же, как IPv4. Исходящий SMTP через TCP-порт 25 идёт в обход VPN, даже если Kill switch включён, и может раскрыть ваш локальный публичный IP этим почтовым серверам. SMTP на портах 465 и 587 остаётся в VPN и обязан устанавливать TLS."
  sv: "När VPN:en är ansluten dirigeras IPv6 genom URnetwork precis som IPv4. Utgående SMTP på TCP-port 25 går förbi VPN:en, även när Kill switch är på, vilket kan avslöja din lokala offentliga IP för de e-postservrarna. SMTP på portarna 465 och 587 stannar i VPN:en och måste upprätta TLS."
  sw: "VPN ikiwa imeunganishwa, IPv6 hupitishwa kupitia URnetwork kama IPv4. SMTP inayotoka kwenye mlango wa TCP 25 hupita nje ya VPN, hata Kill switch ikiwa imewashwa, jambo ambalo linaweza kufichua IP yako ya umma ya ndani kwa seva hizo za barua. SMTP kwenye milango 465 na 587 hubaki ndani ya VPN na lazima ianzishe TLS."
  th: "ขณะที่ VPN เชื่อมต่ออยู่ IPv6 จะถูกส่งผ่าน URnetwork เช่นเดียวกับ IPv4 ส่วน SMTP ขาออกบนพอร์ต TCP 25 จะข้าม VPN แม้เปิดสวิตช์หยุดการเชื่อมต่ออยู่ ซึ่งอาจเปิดเผย IP สาธารณะในพื้นที่ของคุณต่อเซิร์ฟเวอร์อีเมลเหล่านั้น SMTP บนพอร์ต 465 และ 587 จะอยู่ใน VPN และต้องสร้าง TLS"
  uk: "Поки VPN підключено, IPv6 маршрутизується через URnetwork так само, як IPv4. Вихідний SMTP на TCP-порту 25 оминає VPN, навіть коли Kill switch увімкнено, що може розкрити вашу локальну публічну IP цим поштовим серверам. SMTP на портах 465 і 587 залишається у VPN і має встановлювати TLS."
  vi: "Khi VPN đã kết nối, IPv6 được định tuyến qua URnetwork giống như IPv4. SMTP gửi đi qua cổng TCP 25 sẽ đi vòng qua VPN, ngay cả khi Kill switch đang bật, điều này có thể làm lộ IP công khai cục bộ của bạn với các máy chủ thư đó. SMTP trên cổng 465 và 587 vẫn ở trong VPN và phải thiết lập TLS."
  zh: "VPN 连接期间，IPv6 与 IPv4 一样经由 URnetwork 路由。即使开启了断网保护，通过 TCP 端口 25 的出站 SMTP 也会绕过 VPN，这可能会向相应邮件服务器暴露您本地的公网 IP。端口 465 和 587 上的 SMTP 仍在 VPN 内，并且必须建立 TLS。"
  zh-HK: "VPN 連接期間，IPv6 與 IPv4 一樣經由 URnetwork 路由。即使已開啟斷線開關 (Kill switch)，經 TCP 連接埠 25 外送的 SMTP 亦會繞過 VPN，可能向相關郵件伺服器暴露你本地的公共 IP。連接埠 465 和 587 上的 SMTP 會留在 VPN 內，而且必須建立 TLS。"
