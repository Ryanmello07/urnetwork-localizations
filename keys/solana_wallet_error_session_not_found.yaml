description: "Solana wallet error in the desktop apps (macOS, Windows, Linux) when the ur.io wallet bridge page returns session_not_found: the browser no longer has the wallet connection made in the connect step (another browser or a private window, or its site data was cleared), so nothing was signed. Starting again reconnects the wallet (Phantom or Solflare)."
source: "The wallet connection wasn't found in this browser. Start again to reconnect your wallet."
platforms:
  - apple
  - windows
  - linux
localizations:
  ar: "لم يتم العثور على اتصال المحفظة في هذا المتصفح. ابدأ من جديد لإعادة ربط محفظتك."
  cs: "Připojení peněženky se v tomto prohlížeči nenašlo. Začněte znovu a peněženku znovu připojte."
  de: "Die Wallet-Verbindung wurde in diesem Browser nicht gefunden. Starte erneut, um deine Wallet wieder zu verbinden."
  el: "Η σύνδεση του πορτοφολιού δεν βρέθηκε σε αυτό το πρόγραμμα περιήγησης. Ξεκινήστε ξανά για να συνδέσετε ξανά το πορτοφόλι σας."
  en: "The wallet connection wasn't found in this browser. Start again to reconnect your wallet."
  es: "No se encontró la conexión de la billetera en este navegador. Empieza de nuevo para volver a conectar tu billetera."
  es-419: "No se encontró la conexión de la billetera en este navegador. Comienza de nuevo para volver a conectar tu billetera."
  es-MX: "No se encontró la conexión de la cartera en este navegador. Comienza de nuevo para volver a conectar tu cartera."
  fr: "La connexion du portefeuille est introuvable dans ce navigateur. Recommencez pour reconnecter votre portefeuille."
  he: "החיבור לארנק לא נמצא בדפדפן הזה. התחילו מחדש כדי לחבר שוב את הארנק."
  hi: "इस ब्राउज़र में वॉलेट कनेक्शन नहीं मिला। अपना वॉलेट फिर से कनेक्ट करने के लिए दोबारा शुरू करें।"
  id: "Koneksi dompet tidak ditemukan di browser ini. Mulai lagi untuk menghubungkan ulang dompet Anda."
  it: "La connessione del portafoglio non è stata trovata in questo browser. Ricomincia per ricollegare il tuo portafoglio."
  ja: "このブラウザーでウォレットの接続が見つかりませんでした。最初からやり直して、ウォレットを再接続してください。"
  ko: "이 브라우저에서 지갑 연결을 찾을 수 없습니다. 다시 시작하여 지갑을 다시 연결하세요."
  nl: "De walletverbinding is niet gevonden in deze browser. Begin opnieuw om je wallet opnieuw te koppelen."
  pl: "Nie znaleziono połączenia z portfelem w tej przeglądarce. Zacznij od nowa, aby ponownie połączyć portfel."
  pt: "A ligação da carteira não foi encontrada neste navegador. Comece de novo para voltar a ligar a sua carteira."
  pt-BR: "A conexão da carteira não foi encontrada neste navegador. Comece de novo para reconectar sua carteira."
  pt-PT: "A ligação da carteira não foi encontrada neste navegador. Comece de novo para voltar a ligar a sua carteira."
  ru: "В этом браузере не найдено подключение кошелька. Начните заново, чтобы снова подключить кошелек."
  sv: "Plånboksanslutningen hittades inte i den här webbläsaren. Börja om för att ansluta din plånbok igen."
  sw: "Muunganisho wa pochi haukupatikana kwenye kivinjari hiki. Anza upya ili kuunganisha pochi yako tena."
  th: "ไม่พบการเชื่อมต่อกระเป๋าเงินในเบราว์เซอร์นี้ เริ่มใหม่เพื่อเชื่อมต่อกระเป๋าเงินของคุณอีกครั้ง"
  uk: "У цьому браузері не знайдено підключення гаманця. Почніть знову, щоб повторно підключити гаманець."
  vi: "Không tìm thấy kết nối ví trong trình duyệt này. Hãy bắt đầu lại để kết nối lại ví của bạn."
  zh: "在此浏览器中未找到钱包连接。请重新开始以重新连接您的钱包。"
  zh-HK: "在此瀏覽器中找不到錢包連接。請重新開始以重新連接你的錢包。"
