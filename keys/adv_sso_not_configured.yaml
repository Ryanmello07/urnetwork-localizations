description: "Windows sign-in screen, error line: a Google or Apple sign-in in the browser was turned back because this network has no such sign-in set up yet. Provider sign-in means signing in with a Google or Apple account, not a URnetwork provider. It points to signing in with email, or through the browser (Sign in with browser), instead."
source: "Provider sign-in isn't available on this network yet — use email or browser sign-in"
platforms:
  - windows
localizations:
  ar: "تسجيل الدخول باستخدام Google أو Apple غير متاح على هذه الشبكة بعد — استخدم البريد الإلكتروني أو تسجيل الدخول عبر المتصفح"
  cs: "Přihlášení přes Google nebo Apple zatím v této síti není k dispozici — použijte e-mail nebo přihlášení přes prohlížeč"
  de: "Die Anmeldung mit Google oder Apple ist in diesem Netzwerk noch nicht verfügbar – melde dich per E-Mail oder im Browser an"
  el: "Η σύνδεση με Google ή Apple δεν είναι ακόμη διαθέσιμη σε αυτό το δίκτυο — χρησιμοποιήστε email ή σύνδεση μέσω προγράμματος περιήγησης"
  en: "Provider sign-in isn't available on this network yet — use email or browser sign-in"
  es: "El inicio de sesión con Google o Apple aún no está disponible en esta red: usa el correo electrónico o el inicio de sesión en el navegador"
  es-419: "El inicio de sesión con Google o Apple aún no está disponible en esta red: usa el correo electrónico o el inicio de sesión en el navegador"
  es-MX: "El inicio de sesión con Google o Apple aún no está disponible en esta red: usa el correo electrónico o el inicio de sesión en el navegador"
  fr: "La connexion avec Google ou Apple n’est pas encore disponible sur ce réseau — utilisez l’e-mail ou la connexion via le navigateur"
  he: "התחברות עם Google או Apple עדיין לא זמינה ברשת הזו — השתמשו באימייל או בהתחברות דרך הדפדפן"
  hi: "इस नेटवर्क पर Google या Apple से साइन इन अभी उपलब्ध नहीं है — ईमेल या ब्राउज़र से साइन इन करें"
  id: "Masuk dengan Google atau Apple belum tersedia di jaringan ini — gunakan email atau masuk melalui browser"
  it: "L’accesso con Google o Apple non è ancora disponibile su questa rete — usa l’email o l’accesso tramite browser"
  ja: "このネットワークでは Google または Apple でのサインインはまだ利用できません。メールアドレスかブラウザでサインインしてください"
  ko: "이 네트워크에서는 아직 Google 또는 Apple 로그인을 사용할 수 없습니다. 이메일 또는 브라우저 로그인을 이용하세요"
  nl: "Inloggen met Google of Apple is nog niet beschikbaar op dit netwerk — gebruik e-mail of log in via de browser"
  pl: "Logowanie przez Google lub Apple nie jest jeszcze dostępne w tej sieci — użyj e-maila lub logowania przez przeglądarkę"
  pt: "O início de sessão com Google ou Apple ainda não está disponível nesta rede — use o e-mail ou o início de sessão no navegador"
  pt-BR: "O login com Google ou Apple ainda não está disponível nesta rede — use o e-mail ou o login pelo navegador"
  pt-PT: "O início de sessão com Google ou Apple ainda não está disponível nesta rede — use o e-mail ou o início de sessão no navegador"
  ru: "Вход через Google или Apple в этой сети пока недоступен — используйте email или вход через браузер"
  sv: "Inloggning med Google eller Apple är inte tillgänglig i det här nätverket än – använd e-post eller logga in via webbläsaren"
  sw: "Kuingia kwa Google au Apple bado hakupatikani kwenye mtandao huu — tumia barua pepe au kuingia kupitia kivinjari"
  th: "เครือข่ายนี้ยังไม่รองรับการเข้าสู่ระบบด้วย Google หรือ Apple — โปรดใช้อีเมลหรือเข้าสู่ระบบผ่านเบราว์เซอร์"
  uk: "Вхід через Google або Apple у цій мережі поки недоступний — скористайтеся ел. поштою або входом через браузер"
  vi: "Mạng này chưa hỗ trợ đăng nhập bằng Google hoặc Apple — hãy dùng email hoặc đăng nhập bằng trình duyệt"
  zh: "此网络暂不支持使用 Google 或 Apple 登录——请使用电子邮件或浏览器登录"
  zh-HK: "此網絡暫不支援使用 Google 或 Apple 登入——請使用電郵或瀏覽器登入"
