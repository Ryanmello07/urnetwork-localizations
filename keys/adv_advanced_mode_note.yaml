description: "Settings: explanation under the advanced mode switch."
source: "Show raw values, identifiers, the connection inspector and the reliability tuning surface across the app."
platforms:
  - linux
  - windows
localizations:
  ar: "يعرض القيم الخام والمعرّفات وفاحص الاتصال وأدوات ضبط الموثوقية في كل أنحاء التطبيق."
  cs: "Zobrazí surové hodnoty, identifikátory, inspektor připojení a ladění spolehlivosti v celé aplikaci."
  de: "Zeigt Rohwerte, Kennungen, den Verbindungsinspektor und die Zuverlässigkeitseinstellungen in der ganzen App an."
  el: "Εμφανίζει ακατέργαστες τιμές, αναγνωριστικά, τον επιθεωρητή σύνδεσης και τις ρυθμίσεις αξιοπιστίας σε όλη την εφαρμογή."
  en: "Show raw values, identifiers, the connection inspector and the reliability tuning surface across the app."
  es: "Muestra valores sin procesar, identificadores, el inspector de conexión y los ajustes de fiabilidad en toda la app."
  es-MX: "Muestra valores sin procesar, identificadores, el inspector de conexión y los ajustes de confiabilidad en toda la app."
  fr: "Affiche les valeurs brutes, les identifiants, l’inspecteur de connexion et les réglages de fiabilité dans toute l’application."
  he: "מציג ערכים גולמיים, מזהים, את בודק החיבור ואת כוונון האמינות בכל האפליקציה."
  hi: "पूरे ऐप में कच्चे मान, पहचानकर्ता, कनेक्शन इंस्पेक्टर और विश्वसनीयता ट्यूनिंग दिखाता है।"
  id: "Menampilkan nilai mentah, pengenal, pemeriksa koneksi, dan penyetelan keandalan di seluruh aplikasi."
  it: "Mostra valori grezzi, identificatori, l’ispettore della connessione e la regolazione dell’affidabilità in tutta l’app."
  ja: "アプリ全体で生の値、識別子、接続インスペクター、信頼性の調整項目を表示します。"
  ko: "앱 전체에서 원시 값, 식별자, 연결 검사기, 안정성 조정 항목을 표시합니다."
  nl: "Toont ruwe waarden, identifiers, de verbindingsinspecteur en de betrouwbaarheidsinstellingen in de hele app."
  pl: "Pokazuje surowe wartości, identyfikatory, inspektor połączenia i ustawienia niezawodności w całej aplikacji."
  pt: "Mostra valores brutos, identificadores, o inspetor de conexão e os ajustes de confiabilidade em todo o app."
  pt-BR: "Mostra valores brutos, identificadores, o inspetor de conexão e os ajustes de confiabilidade em todo o app."
  pt-PT: "Mostra valores em bruto, identificadores, o inspetor de ligação e as afinações de fiabilidade em toda a app."
  ru: "Показывает сырые значения, идентификаторы, инспектор соединения и настройки надёжности во всём приложении."
  sv: "Visar råvärden, identifierare, anslutningsinspektören och tillförlitlighetsinställningarna i hela appen."
  sw: "Huonyesha thamani ghafi, vitambulisho, kikagua muunganisho na mipangilio ya uaminifu kote kwenye programu."
  th: "แสดงค่าดิบ ตัวระบุ ตัวตรวจสอบการเชื่อมต่อ และการปรับแต่งความน่าเชื่อถือทั่วทั้งแอป"
  uk: "Показує сирі значення, ідентифікатори, інспектор з’єднання та налаштування надійності в усьому застосунку."
  vi: "Hiển thị giá trị thô, mã định danh, trình kiểm tra kết nối và các tùy chỉnh độ tin cậy trên toàn ứng dụng."
  zh: "在整个应用中显示原始值、标识符、连接检查器和可靠性调节项。"
  zh-HK: "在整個應用程式中顯示原始值、識別碼、連線檢查器和可靠性調校項目。"
