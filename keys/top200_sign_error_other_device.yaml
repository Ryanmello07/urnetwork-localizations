description: "Top 200 sign screen: the binding's client_id or client_key is not this device's; the app refuses to sign it."
source: "This binding is for another device. A device signs only the binding with its own client ID and client key."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "هذا الربط لجهاز آخر. لا يوقّع الجهاز إلا الربط الذي يحمل معرّف العميل ومفتاح العميل الخاصين به."
  cs: "Tato vazba patří jinému zařízení. Zařízení podepisuje jen vazbu s vlastním ID klienta a klientským klíčem."
  de: "Diese Bindung gehört zu einem anderen Gerät. Ein Gerät signiert nur die Bindung mit seiner eigenen Client-ID und seinem eigenen Client-Schlüssel."
  el: "Αυτή η σύνδεση αφορά άλλη συσκευή. Μια συσκευή υπογράφει μόνο τη σύνδεση με το δικό της ID πελάτη και κλειδί πελάτη."
  en: "This binding is for another device. A device signs only the binding with its own client ID and client key."
  es: "Esta vinculación es de otro dispositivo. Un dispositivo solo firma la vinculación con su propio ID de cliente y su propia clave de cliente."
  es-419: "Esta vinculación es de otro dispositivo. Un dispositivo solo firma la vinculación con su propio ID de cliente y su propia clave de cliente."
  es-MX: "Esta vinculación es de otro dispositivo. Un dispositivo solo firma la vinculación con su propio ID de cliente y su propia clave de cliente."
  fr: "Cette liaison concerne un autre appareil. Un appareil ne signe que la liaison portant son propre ID client et sa propre clé client."
  he: "הקישור הזה שייך למכשיר אחר. מכשיר חותם רק על הקישור עם מזהה הלקוח ומפתח הלקוח שלו."
  hi: "यह बाइंडिंग किसी दूसरे डिवाइस की है। डिवाइस केवल अपनी क्लाइंट ID और क्लाइंट कुंजी वाली बाइंडिंग पर हस्ताक्षर करता है।"
  id: "Pengikatan ini untuk perangkat lain. Perangkat hanya menandatangani pengikatan dengan ID klien dan kunci kliennya sendiri."
  it: "Questo collegamento è per un altro dispositivo. Un dispositivo firma solo il collegamento con il proprio ID client e la propria chiave client."
  ja: "このバインディングは別のデバイス用です。デバイスが署名するのは、自身のクライアントIDとクライアントキーを含むバインディングだけです。"
  ko: "이 바인딩은 다른 기기용입니다. 기기는 자신의 클라이언트 ID와 클라이언트 키가 담긴 바인딩에만 서명합니다."
  nl: "Deze koppeling is voor een ander apparaat. Een apparaat ondertekent alleen de koppeling met zijn eigen client-ID en clientsleutel."
  pl: "To powiązanie dotyczy innego urządzenia. Urządzenie podpisuje tylko powiązanie z własnym ID klienta i kluczem klienta."
  pt: "Esta vinculação é de outro dispositivo. Um dispositivo só assina a vinculação com o próprio ID do cliente e a própria chave de cliente."
  pt-BR: "Esta vinculação é de outro dispositivo. Um dispositivo só assina a vinculação com o próprio ID do cliente e a própria chave de cliente."
  pt-PT: "Esta associação é de outro dispositivo. Um dispositivo só assina a associação com o seu próprio ID do cliente e a sua própria chave de cliente."
  ru: "Эта привязка для другого устройства. Устройство подписывает только привязку со своим ID клиента и клиентским ключом."
  sv: "Den här bindningen gäller en annan enhet. En enhet signerar bara bindningen med sitt eget klient-ID och sin egen klientnyckel."
  sw: "Ufungaji huu ni wa kifaa kingine. Kifaa husaini tu ufungaji wenye kitambulisho chake cha mteja na ufunguo wake wa mteja."
  th: "การผูกนี้เป็นของอุปกรณ์อื่น อุปกรณ์จะลงนามเฉพาะการผูกที่มี ID ไคลเอ็นต์และคีย์ไคลเอ็นต์ของตัวเองเท่านั้น"
  uk: "Ця прив'язка для іншого пристрою. Пристрій підписує лише прив'язку зі своїм ID клієнта та клієнтським ключем."
  vi: "Liên kết này dành cho thiết bị khác. Thiết bị chỉ ký liên kết có ID máy khách và khóa máy khách của chính nó."
  zh: "此绑定属于另一台设备。设备只会签署包含其自身客户端 ID 和客户端密钥的绑定。"
  zh-HK: "此綁定屬於另一部裝置。裝置只會簽署包含其自身客戶端 ID 和客戶端金鑰的綁定。"
