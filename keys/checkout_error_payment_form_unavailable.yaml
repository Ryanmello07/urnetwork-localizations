description: "Checkout error in the desktop apps (the macOS direct download, Windows and Linux) when the ur.io checkout page hands back stripe_unavailable: Stripe's payment form could not be loaded in the checkout page (usually no internet connection, or a network that blocks it). Nothing was charged."
source: "The payment form couldn't load. Check your internet connection, then try again."
platforms:
  - apple
  - windows
  - linux
localizations:
  ar: "تعذّر تحميل نموذج الدفع. تحقق من اتصالك بالإنترنت، ثم حاول مرة أخرى."
  cs: "Platební formulář se nepodařilo načíst. Zkontrolujte připojení k internetu a zkuste to znovu."
  de: "Das Zahlungsformular konnte nicht geladen werden. Prüfe deine Internetverbindung und versuche es dann erneut."
  el: "Δεν ήταν δυνατή η φόρτωση της φόρμας πληρωμής. Ελέγξτε τη σύνδεσή σας στο διαδίκτυο και δοκιμάστε ξανά."
  en: "The payment form couldn't load. Check your internet connection, then try again."
  es: "No se pudo cargar el formulario de pago. Comprueba tu conexión a internet y vuelve a intentarlo."
  es-419: "No se pudo cargar el formulario de pago. Verifica tu conexión a internet y vuelve a intentarlo."
  es-MX: "No se pudo cargar el formulario de pago. Verifica tu conexión a internet y vuelve a intentarlo."
  fr: "Le formulaire de paiement n'a pas pu se charger. Vérifiez votre connexion Internet, puis réessayez."
  he: "לא ניתן היה לטעון את טופס התשלום. בדקו את החיבור לאינטרנט ונסו שוב."
  hi: "भुगतान फ़ॉर्म लोड नहीं हो सका। अपना इंटरनेट कनेक्शन जांचें, फिर दोबारा प्रयास करें।"
  id: "Formulir pembayaran tidak dapat dimuat. Periksa koneksi internet Anda, lalu coba lagi."
  it: "Impossibile caricare il modulo di pagamento. Controlla la connessione a Internet, poi riprova."
  ja: "支払いフォームを読み込めませんでした。インターネット接続を確認してから、もう一度お試しください。"
  ko: "결제 양식을 불러올 수 없습니다. 인터넷 연결을 확인한 후 다시 시도하세요."
  nl: "Het betaalformulier kon niet worden geladen. Controleer je internetverbinding en probeer het opnieuw."
  pl: "Nie udało się wczytać formularza płatności. Sprawdź połączenie z internetem, a potem spróbuj ponownie."
  pt: "Não foi possível carregar o formulário de pagamento. Verifique a sua ligação à Internet e tente novamente."
  pt-BR: "Não foi possível carregar o formulário de pagamento. Verifique sua conexão com a internet e tente novamente."
  pt-PT: "Não foi possível carregar o formulário de pagamento. Verifique a sua ligação à Internet e tente novamente."
  ru: "Не удалось загрузить форму оплаты. Проверьте подключение к интернету и повторите попытку."
  sv: "Betalningsformuläret kunde inte läsas in. Kontrollera din internetanslutning och försök sedan igen."
  sw: "Fomu ya malipo haikuweza kupakia. Angalia muunganisho wako wa intaneti, kisha ujaribu tena."
  th: "ไม่สามารถโหลดแบบฟอร์มการชำระเงินได้ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตของคุณ แล้วลองอีกครั้ง"
  uk: "Не вдалося завантажити форму оплати. Перевірте підключення до інтернету й спробуйте ще раз."
  vi: "Không thể tải biểu mẫu thanh toán. Hãy kiểm tra kết nối internet rồi thử lại."
  zh: "无法加载付款表单。请检查您的网络连接，然后重试。"
  zh-HK: "無法載入付款表格。請檢查您的網絡連線，然後再試一次。"
