description: "VLESS settings: the explanation at the top of the screen. VLESS is a proxy protocol; the user's own server carries the app's connections to URnetwork when direct connections are blocked."
source: "Connect to URnetwork through your own VLESS server when direct connections are blocked. Your traffic to URnetwork stays encrypted end to end."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "اتصل بـ URnetwork عبر خادم VLESS الخاص بك عندما تكون الاتصالات المباشرة محظورة. تبقى حركة بياناتك إلى URnetwork مشفّرة من طرف إلى طرف."
  cs: "Připojte se k URnetwork přes vlastní server VLESS, když jsou přímá připojení blokována. Váš provoz do URnetwork zůstává šifrovaný od začátku do konce."
  de: "Verbinde dich über deinen eigenen VLESS-Server mit URnetwork, wenn direkte Verbindungen blockiert sind. Dein Datenverkehr zu URnetwork bleibt durchgehend verschlüsselt."
  el: "Συνδεθείτε στο URnetwork μέσω του δικού σας διακομιστή VLESS όταν οι άμεσες συνδέσεις είναι αποκλεισμένες. Η κίνησή σας προς το URnetwork παραμένει κρυπτογραφημένη από άκρο σε άκρο."
  en: "Connect to URnetwork through your own VLESS server when direct connections are blocked. Your traffic to URnetwork stays encrypted end to end."
  es: "Conéctate a URnetwork a través de tu propio servidor VLESS cuando las conexiones directas estén bloqueadas. Tu tráfico hacia URnetwork sigue cifrado de extremo a extremo."
  es-419: "Conéctate a URnetwork a través de tu propio servidor VLESS cuando las conexiones directas estén bloqueadas. Tu tráfico hacia URnetwork sigue cifrado de extremo a extremo."
  es-MX: "Conéctate a URnetwork a través de tu propio servidor VLESS cuando las conexiones directas estén bloqueadas. Tu tráfico hacia URnetwork sigue cifrado de extremo a extremo."
  fr: "Connectez-vous à URnetwork via votre propre serveur VLESS lorsque les connexions directes sont bloquées. Votre trafic vers URnetwork reste chiffré de bout en bout."
  he: "התחברו ל-URnetwork דרך שרת VLESS משלכם כאשר חיבורים ישירים חסומים. התעבורה שלכם ל-URnetwork נשארת מוצפנת מקצה לקצה."
  hi: "जब सीधे कनेक्शन ब्लॉक हों, तब अपने VLESS सर्वर के ज़रिए URnetwork से कनेक्ट करें। URnetwork तक आपका ट्रैफ़िक शुरू से अंत तक एन्क्रिप्टेड रहता है।"
  id: "Hubungkan ke URnetwork melalui server VLESS Anda sendiri saat koneksi langsung diblokir. Lalu lintas Anda ke URnetwork tetap terenkripsi secara end-to-end."
  it: "Connettiti a URnetwork tramite il tuo server VLESS quando le connessioni dirette sono bloccate. Il tuo traffico verso URnetwork resta crittografato end-to-end."
  ja: "直接接続がブロックされているときは、自分の VLESS サーバー経由で URnetwork に接続します。URnetwork への通信はエンドツーエンドで暗号化されたままです。"
  ko: "직접 연결이 차단된 경우 자신의 VLESS 서버를 통해 URnetwork에 연결합니다. URnetwork로 가는 트래픽은 계속 종단 간 암호화됩니다."
  nl: "Maak verbinding met URnetwork via je eigen VLESS-server als directe verbindingen zijn geblokkeerd. Je verkeer naar URnetwork blijft end-to-end versleuteld."
  pl: "Łącz się z URnetwork przez własny serwer VLESS, gdy połączenia bezpośrednie są zablokowane. Twój ruch do URnetwork pozostaje szyfrowany end-to-end."
  pt: "Ligue-se à URnetwork através do seu próprio servidor VLESS quando as ligações diretas estiverem bloqueadas. O seu tráfego para a URnetwork continua encriptado de ponta a ponta."
  pt-BR: "Conecte-se à URnetwork pelo seu próprio servidor VLESS quando as conexões diretas estiverem bloqueadas. Seu tráfego para a URnetwork continua criptografado de ponta a ponta."
  pt-PT: "Ligue-se à URnetwork através do seu próprio servidor VLESS quando as ligações diretas estiverem bloqueadas. O seu tráfego para a URnetwork continua encriptado de ponta a ponta."
  ru: "Подключайтесь к URnetwork через собственный сервер VLESS, когда прямые подключения заблокированы. Ваш трафик к URnetwork по-прежнему защищён сквозным шифрованием."
  sv: "Anslut till URnetwork via din egen VLESS-server när direkta anslutningar är blockerade. Din trafik till URnetwork förblir krypterad hela vägen."
  sw: "Unganisha kwenye URnetwork kupitia seva yako ya VLESS wakati miunganisho ya moja kwa moja imezuiwa. Trafiki yako kwenda URnetwork inabaki imesimbwa kutoka mwanzo hadi mwisho."
  th: "เชื่อมต่อกับ URnetwork ผ่านเซิร์ฟเวอร์ VLESS ของคุณเองเมื่อการเชื่อมต่อโดยตรงถูกบล็อก การรับส่งข้อมูลของคุณไปยัง URnetwork ยังคงเข้ารหัสตั้งแต่ต้นทางถึงปลายทาง"
  uk: "Підключайтеся до URnetwork через власний сервер VLESS, коли прямі підключення заблоковані. Ваш трафік до URnetwork і далі захищений наскрізним шифруванням."
  vi: "Kết nối với URnetwork qua máy chủ VLESS của riêng bạn khi kết nối trực tiếp bị chặn. Lưu lượng của bạn đến URnetwork vẫn được mã hóa đầu cuối."
  zh: "当直接连接被封锁时，通过您自己的 VLESS 服务器连接 URnetwork。您到 URnetwork 的流量始终保持端到端加密。"
  zh-HK: "當直接連線被封鎖時，透過您自己的 VLESS 伺服器連線至 URnetwork。您往 URnetwork 的流量始終保持端對端加密。"
