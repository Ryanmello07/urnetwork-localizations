description: "Network page, selected provider pane: note under the Name row while Best available provider is selected, saying what best available means."
source: "URnetwork picks the fastest healthy providers for you, with no location constraint, and re-picks as the network changes."
platforms:
  - linux
localizations:
  ar: "يختار URnetwork لك أسرع المزودين السليمين، دون أي قيد على الموقع، ويعيد الاختيار كلما تغيّرت الشبكة."
  cs: "URnetwork za vás vybírá nejrychlejší funkční poskytovatele bez omezení polohy a při změnách sítě je vybírá znovu."
  de: "URnetwork wählt für dich die schnellsten funktionierenden Anbieter ohne Standortvorgabe aus und wählt neu, wenn sich das Netzwerk ändert."
  el: "Το URnetwork επιλέγει για εσάς τους ταχύτερους λειτουργικούς παρόχους, χωρίς περιορισμό τοποθεσίας, και επιλέγει ξανά καθώς αλλάζει το δίκτυο."
  en: "URnetwork picks the fastest healthy providers for you, with no location constraint, and re-picks as the network changes."
  es: "URnetwork elige por ti los proveedores operativos más rápidos, sin restricción de ubicación, y vuelve a elegir a medida que cambia la red."
  es-419: "URnetwork elige por ti los proveedores operativos más rápidos, sin restricción de ubicación, y vuelve a elegir a medida que cambia la red."
  es-MX: "URnetwork elige por ti los proveedores operativos más rápidos, sin restricción de ubicación, y vuelve a elegir a medida que cambia la red."
  fr: "URnetwork choisit pour vous les fournisseurs opérationnels les plus rapides, sans contrainte d'emplacement, et refait ce choix à mesure que le réseau évolue."
  he: "URnetwork בוחרת עבורך את הספקים התקינים המהירים ביותר, ללא הגבלת מיקום, ובוחרת מחדש כשהרשת משתנה."
  hi: "URnetwork आपके लिए सबसे तेज़ और ठीक से काम कर रहे प्रदाता चुनता है, बिना किसी स्थान की पाबंदी के, और नेटवर्क बदलने पर फिर से चुनता है।"
  id: "URnetwork memilihkan penyedia tercepat yang berfungsi baik untuk Anda, tanpa batasan lokasi, dan memilih ulang saat jaringan berubah."
  it: "URnetwork sceglie per te i provider funzionanti più veloci, senza vincoli di posizione, e li sceglie di nuovo quando la rete cambia."
  ja: "URnetwork は場所を限定せずに、正常に動作している最も高速なプロバイダーを選び、ネットワークの変化に合わせて選び直します。"
  ko: "URnetwork가 위치 제한 없이 정상 작동하는 가장 빠른 제공자를 골라 주며, 네트워크가 바뀌면 다시 고릅니다."
  nl: "URnetwork kiest voor je de snelste goed werkende aanbieders, zonder locatiebeperking, en kiest opnieuw als het netwerk verandert."
  pl: "URnetwork wybiera dla Ciebie najszybszych sprawnych dostawców, bez ograniczeń lokalizacji, i wybiera ponownie, gdy sieć się zmienia."
  pt: "O URnetwork escolhe para você os provedores operacionais mais rápidos, sem restrição de localização, e escolhe de novo conforme a rede muda."
  pt-BR: "O URnetwork escolhe para você os provedores operacionais mais rápidos, sem restrição de localização, e escolhe de novo conforme a rede muda."
  pt-PT: "O URnetwork escolhe por si os fornecedores operacionais mais rápidos, sem restrição de localização, e volta a escolher à medida que a rede muda."
  ru: "URnetwork сам выбирает для вас самых быстрых исправных провайдеров без привязки к местоположению и выбирает заново, когда сеть меняется."
  sv: "URnetwork väljer de snabbaste fungerande leverantörerna åt dig, utan platsbegränsning, och väljer om när nätverket förändras."
  sw: "URnetwork inakuchagulia watoa huduma wenye kasi zaidi wanaofanya kazi vizuri, bila kikomo cha eneo, na huchagua upya mtandao unapobadilika."
  th: "URnetwork เลือกผู้ให้บริการที่ทำงานปกติและเร็วที่สุดให้คุณ โดยไม่จำกัดตำแหน่ง และเลือกใหม่เมื่อเครือข่ายเปลี่ยนแปลง"
  uk: "URnetwork сам обирає для вас найшвидших справних провайдерів без прив'язки до розташування й обирає знову, коли мережа змінюється."
  vi: "URnetwork tự chọn cho bạn những nhà cung cấp hoạt động tốt và nhanh nhất, không giới hạn vị trí, và chọn lại khi mạng thay đổi."
  zh: "URnetwork 会为你挑选运行正常且最快的提供商，不限位置，并随网络变化重新挑选。"
  zh-HK: "URnetwork 會為你挑選運作正常且最快的供應商，不限位置，並隨網絡變化重新挑選。"
