description: "Shown after the app hands the user to the Stripe hosted checkout in the system browser. The app polls the server and flips the plan automatically when the payment webhook lands."
source: "Complete your purchase in the browser. Your plan updates here automatically once payment is confirmed."
platforms:
  - windows
  - apple
  - linux
localizations:
  ar: "أكمل عملية الشراء في المتصفح. سيتم تحديث خطتك هنا تلقائيًا بمجرد تأكيد الدفع."
  cs: "Dokončete nákup v prohlížeči. Jakmile bude platba potvrzena, váš tarif se zde automaticky aktualizuje."
  de: "Schließe den Kauf im Browser ab. Dein Plan wird hier automatisch aktualisiert, sobald die Zahlung bestätigt ist."
  el: "Ολοκληρώστε την αγορά στο πρόγραμμα περιήγησης. Το πρόγραμμά σας θα ενημερωθεί εδώ αυτόματα μόλις επιβεβαιωθεί η πληρωμή."
  en: "Complete your purchase in the browser. Your plan updates here automatically once payment is confirmed."
  es: "Completa tu compra en el navegador. Tu plan se actualizará aquí automáticamente cuando se confirme el pago."
  es-419: "Completa tu compra en el navegador. Tu plan se actualizará aquí automáticamente cuando se confirme el pago."
  es-MX: "Completa tu compra en el navegador. Tu plan se actualizará aquí automáticamente cuando se confirme el pago."
  fr: "Terminez votre achat dans le navigateur. Votre plan sera mis à jour ici automatiquement une fois le paiement confirmé."
  he: "השלימו את הרכישה בדפדפן. התוכנית שלכם תתעדכן כאן אוטומטית ברגע שהתשלום יאושר."
  hi: "ब्राउज़र में अपनी खरीदारी पूरी करें। भुगतान की पुष्टि होते ही आपकी योजना यहां अपने आप अपडेट हो जाएगी।"
  id: "Selesaikan pembelian Anda di browser. Paket Anda akan diperbarui di sini secara otomatis setelah pembayaran dikonfirmasi."
  it: "Completa l'acquisto nel browser. Il tuo piano si aggiornerà qui automaticamente una volta confermato il pagamento."
  ja: "ブラウザで購入を完了してください。支払いが確認されると、プランはここで自動的に更新されます。"
  ko: "브라우저에서 구매를 완료하세요. 결제가 확인되면 플랜이 여기에서 자동으로 업데이트됩니다."
  nl: "Rond je aankoop af in de browser. Je plan wordt hier automatisch bijgewerkt zodra de betaling is bevestigd."
  pl: "Dokończ zakup w przeglądarce. Twój plan zaktualizuje się tutaj automatycznie po potwierdzeniu płatności."
  pt: "Conclua a sua compra no navegador. O seu plano será atualizado aqui automaticamente assim que o pagamento for confirmado."
  pt-BR: "Conclua sua compra no navegador. Seu plano será atualizado aqui automaticamente assim que o pagamento for confirmado."
  pt-PT: "Conclua a sua compra no navegador. O seu plano será atualizado aqui automaticamente assim que o pagamento for confirmado."
  ru: "Завершите покупку в браузере. Ваш тариф обновится здесь автоматически, как только платеж будет подтвержден."
  sv: "Slutför ditt köp i webbläsaren. Din plan uppdateras här automatiskt när betalningen har bekräftats."
  sw: "Kamilisha ununuzi wako kwenye kivinjari. Mpango wako utasasishwa hapa kiotomatiki mara malipo yatakapothibitishwa."
  th: "ทำการซื้อให้เสร็จในเบราว์เซอร์ แพ็กเกจของคุณจะอัปเดตที่นี่โดยอัตโนมัติเมื่อการชำระเงินได้รับการยืนยัน"
  uk: "Завершіть покупку в браузері. Ваш план оновиться тут автоматично, щойно оплату буде підтверджено."
  vi: "Hoàn tất giao dịch mua trong trình duyệt. Kế hoạch của bạn sẽ tự động cập nhật tại đây sau khi thanh toán được xác nhận."
  zh: "请在浏览器中完成购买。付款确认后，您的计划将在此处自动更新。"
  zh-HK: "請在瀏覽器中完成購買。付款確認後，您的計劃將在此處自動更新。"
