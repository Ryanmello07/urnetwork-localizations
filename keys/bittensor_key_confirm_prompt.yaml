description: "Key screen, the confirmation before the key leaves the app, where the user enters two of its words. Two fields follow, labeled Word 3, Word 9 and so on."
source: "To show you saved it, enter these two words from your recovery phrase."
platforms:
  - apple
localizations:
  ar: "لإثبات أنك حفظتها، أدخل هاتين الكلمتين من عبارة النسخ الاحتياطي الخاصة بك."
  cs: "Abyste ukázali, že jste si ji uložili, zadejte tato dvě slova ze své obnovovací fráze."
  de: "Gib diese zwei Wörter aus deiner Wiederherstellungsphrase ein, um zu zeigen, dass du sie gespeichert hast."
  el: "Για να δείξετε ότι την αποθηκεύσατε, εισαγάγετε αυτές τις δύο λέξεις από τη φράση επαναφοράς σας."
  en: "To show you saved it, enter these two words from your recovery phrase."
  es: "Para demostrar que la has guardado, introduce estas dos palabras de tu frase de recuperación."
  es-419: "Para demostrar que la guardaste, ingresa estas dos palabras de tu frase de recuperación."
  es-MX: "Para demostrar que la guardaste, ingresa estas dos palabras de tu frase de recuperación."
  fr: "Pour montrer que vous l’avez enregistrée, saisissez ces deux mots de votre phrase de sauvegarde."
  he: "כדי להראות ששמרתם אותו, הזינו את שתי המילים האלה מביטוי השחזור שלכם."
  hi: "यह दिखाने के लिए कि आपने इसे सहेज लिया है, अपने रिकवरी फ़्रेज़ के ये दो शब्द डालें।"
  id: "Untuk menunjukkan bahwa Anda sudah menyimpannya, masukkan dua kata ini dari frasa cadangan Anda."
  it: "Per dimostrare di averla salvata, inserisci queste due parole della tua frase di recupero."
  ja: "保存したことを確認するため、復元フレーズの次の 2 語を入力してください。"
  ko: "저장했음을 확인하기 위해 복구 문구에서 다음 두 단어를 입력하세요."
  nl: "Voer deze twee woorden uit je herstelzin in om te laten zien dat je hem hebt opgeslagen."
  pl: "Aby pokazać, że masz ją zapisaną, wpisz te dwa słowa ze swojej frazy odzyskiwania."
  pt: "Para mostrar que a guardou, introduza estas duas palavras da sua frase de recuperação."
  pt-BR: "Para mostrar que você a salvou, insira estas duas palavras da sua frase de recuperação."
  pt-PT: "Para mostrar que a guardou, introduza estas duas palavras da sua frase de recuperação."
  ru: "Чтобы показать, что вы её сохранили, введите эти два слова из фразы восстановления."
  sv: "Ange de här två orden från din återställningsfras för att visa att du har sparat den."
  sw: "Ili kuonyesha kwamba umekihifadhi, weka maneno haya mawili kutoka kwenye kifungu chako cha urejeshaji."
  th: "เพื่อแสดงว่าคุณบันทึกไว้แล้ว ให้ป้อนคำสองคำนี้จากวลีสำรองของคุณ"
  uk: "Щоб показати, що ви її зберегли, введіть ці два слова з фрази відновлення."
  vi: "Để cho thấy bạn đã lưu, hãy nhập hai từ này trong cụm từ sao lưu của bạn."
  zh: "为确认您已保存，请输入恢复短语中的这两个词。"
  zh-HK: "為確認你已儲存，請輸入復原短語中的這兩個詞。"
