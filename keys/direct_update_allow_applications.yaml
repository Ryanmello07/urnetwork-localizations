description: "macOS folder-access panel message when installing an update: the user selects the Applications folder to grant access. Keep \"Allow\" consistent with the panel's button."
source: "To install the update, allow URnetwork to replace itself in the Applications folder. Select Applications and click Allow."
platforms:
  - apple
localizations:
  ar: "لتثبيت التحديث، اسمح لـ URnetwork باستبدال نفسه في مجلد التطبيقات. حدد التطبيقات وانقر على سماح."
  cs: "Chcete-li nainstalovat aktualizaci, povolte URnetwork, aby se nahradila ve složce Aplikace. Vyberte Aplikace a klikněte na Povolit."
  de: "Um das Update zu installieren, erlaube URnetwork, sich im Ordner „Programme“ zu ersetzen. Wähle „Programme“ aus und klicke auf „Erlauben“."
  el: "Για να εγκαταστήσετε την ενημέρωση, επιτρέψτε στο URnetwork να αντικαταστήσει τον εαυτό του στον φάκελο Εφαρμογές. Επιλέξτε Εφαρμογές και κάντε κλικ στο Επιτρέψτε."
  en: "To install the update, allow URnetwork to replace itself in the Applications folder. Select Applications and click Allow."
  es: "Para instalar la actualización, permite que URnetwork se sustituya en la carpeta Aplicaciones. Selecciona Aplicaciones y haz clic en Permitir."
  es-419: "Para instalar la actualización, permite que URnetwork se sustituya en la carpeta Aplicaciones. Selecciona Aplicaciones y haz clic en Permitir."
  es-MX: "Para instalar la actualización, permite que URnetwork se sustituya en la carpeta Aplicaciones. Selecciona Aplicaciones y haz clic en Permitir."
  fr: "Pour installer la mise à jour, autorisez URnetwork à se remplacer dans le dossier Applications. Sélectionnez Applications et cliquez sur Autoriser."
  he: "כדי להתקין את העדכון, אפשרו ל-URnetwork להחליף את עצמו בתיקייה ״יישומים״. בחרו ״יישומים״ ולחצו על ״אפשר״."
  hi: "अपडेट इंस्टॉल करने के लिए, URnetwork को ऐप्लिकेशन फ़ोल्डर में खुद को बदलने की अनुमति दें। ऐप्लिकेशन चुनें और अनुमति दें पर क्लिक करें।"
  id: "Untuk memasang pembaruan, izinkan URnetwork mengganti dirinya di folder Aplikasi. Pilih Aplikasi dan klik Izinkan."
  it: "Per installare l’aggiornamento, consenti a URnetwork di sostituirsi nella cartella Applicazioni. Seleziona Applicazioni e fai clic su Consenti."
  ja: "アップデートをインストールするには、URnetwork が「アプリケーション」フォルダ内で自身を置き換えることを許可してください。「アプリケーション」を選択して「許可」をクリックします。"
  ko: "업데이트를 설치하려면 URnetwork가 응용 프로그램 폴더에서 자신을 교체하도록 허용하세요. 응용 프로그램을 선택하고 허용을 클릭하세요."
  nl: "Sta URnetwork toe om zichzelf te vervangen in de map Apps om de update te installeren. Selecteer Apps en klik op Sta toe."
  pl: "Aby zainstalować aktualizację, pozwól URnetwork zastąpić się w folderze Aplikacje. Wybierz Aplikacje i kliknij Pozwól."
  pt: "Para instalar a atualização, permita que a URnetwork se substitua na pasta Aplicativos. Selecione Aplicativos e clique em Permitir."
  pt-BR: "Para instalar a atualização, permita que a URnetwork se substitua na pasta Aplicativos. Selecione Aplicativos e clique em Permitir."
  pt-PT: "Para instalar a atualização, permita que a URnetwork se substitua na pasta Aplicações. Selecione Aplicações e clique em Permitir."
  ru: "Чтобы установить обновление, разрешите URnetwork заменить себя в папке «Программы». Выберите «Программы» и нажмите «Разрешить»."
  sv: "För att installera uppdateringen, tillåt URnetwork att ersätta sig själv i mappen Program. Välj Program och klicka på Tillåt."
  sw: "Ili kusakinisha sasisho, ruhusu URnetwork ijibadilishe kwenye folda ya Applications. Chagua Applications kisha ubofye Ruhusu."
  th: "หากต้องการติดตั้งอัปเดต ให้อนุญาตให้ URnetwork แทนที่ตัวเองในโฟลเดอร์แอปพลิเคชัน เลือกแอปพลิเคชันแล้วคลิกอนุญาต"
  uk: "Щоб установити оновлення, дозвольте URnetwork замінити себе в папці «Програми». Виберіть «Програми» й натисніть «Дозволити»."
  vi: "Để cài đặt bản cập nhật, hãy cho phép URnetwork tự thay thế trong thư mục Ứng dụng. Chọn Ứng dụng rồi bấm Cho phép."
  zh: "要安装更新，请允许 URnetwork 在“应用程序”文件夹中替换自身。选择“应用程序”，然后点按“允许”。"
  zh-HK: "如要安裝更新，請允許 URnetwork 在「應用程式」資料夾中取代自身。選擇「應用程式」，然後按一下「允許」。"
