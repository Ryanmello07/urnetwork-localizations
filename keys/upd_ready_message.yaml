description: "Linux Settings update notice once the update is installed and waiting for a relaunch."
source: "The new AppImage is in place and verified. Relaunch to start using it; the previous file is kept beside it until then."
platforms:
  - linux
localizations:
  ar: "ملف AppImage الجديد في مكانه وتم التحقق منه. أعد التشغيل لبدء استخدامه؛ يبقى الملف السابق بجانبه حتى ذلك الحين."
  cs: "Nový AppImage je na místě a ověřený. Restartujte aplikaci, abyste ho začali používat; do té doby zůstane předchozí soubor vedle."
  de: "Das neue AppImage ist installiert und geprüft. Starte neu, um es zu verwenden; die vorherige Datei bleibt bis dahin daneben liegen."
  el: "Το νέο AppImage είναι στη θέση του και επαληθευμένο. Κάντε επανεκκίνηση για να αρχίσετε να το χρησιμοποιείτε· το προηγούμενο αρχείο μένει δίπλα του μέχρι τότε."
  en: "The new AppImage is in place and verified. Relaunch to start using it; the previous file is kept beside it until then."
  es: "La nueva AppImage ya está en su sitio y verificada. Reinicia para empezar a usarla; el archivo anterior se conserva al lado hasta entonces."
  es-419: "La nueva AppImage ya está en su lugar y verificada. Reinicia para empezar a usarla; el archivo anterior se conserva al lado hasta entonces."
  es-MX: "La nueva AppImage ya está en su lugar y verificada. Reinicia para empezar a usarla; el archivo anterior se conserva al lado hasta entonces."
  fr: "La nouvelle AppImage est en place et vérifiée. Redémarrez pour commencer à l’utiliser ; l’ancien fichier est conservé à côté jusque-là."
  he: "ה-AppImage החדש במקומו ואומת. הפעילו מחדש כדי להתחיל להשתמש בו; הקובץ הקודם נשמר לידו עד אז."
  hi: "नया AppImage अपनी जगह पर है और सत्यापित है। इसका उपयोग शुरू करने के लिए फिर से लॉन्च करें; तब तक पिछली फ़ाइल उसके बगल में रखी जाती है।"
  id: "AppImage baru sudah terpasang dan diverifikasi. Mulai ulang untuk mulai menggunakannya; file sebelumnya disimpan di sebelahnya sampai saat itu."
  it: "La nuova AppImage è al suo posto e verificata. Riavvia per iniziare a usarla; il file precedente resta accanto fino ad allora."
  ja: "新しい AppImage は配置され、検証済みです。使い始めるには再起動してください。それまでは以前のファイルが隣に残ります。"
  ko: "새 AppImage가 준비되었고 확인되었습니다. 사용을 시작하려면 다시 실행하세요. 그때까지 이전 파일은 옆에 보관됩니다."
  nl: "De nieuwe AppImage staat klaar en is gecontroleerd. Start opnieuw om hem te gebruiken; het vorige bestand blijft tot dan ernaast staan."
  pl: "Nowy plik AppImage jest na miejscu i zweryfikowany. Uruchom ponownie, aby zacząć go używać; do tego czasu poprzedni plik pozostaje obok."
  pt: "O novo AppImage está no lugar e verificado. Reinicie para começar a usá-lo; o arquivo anterior fica ao lado até lá."
  pt-BR: "O novo AppImage está no lugar e verificado. Reinicie para começar a usá-lo; o arquivo anterior fica ao lado até lá."
  pt-PT: "A nova AppImage está no lugar e verificada. Reinicie para começar a usá-la; o ficheiro anterior fica ao lado até lá."
  ru: "Новый AppImage на месте и проверен. Перезапустите приложение, чтобы начать им пользоваться; до тех пор предыдущий файл хранится рядом."
  sv: "Den nya AppImage-filen är på plats och verifierad. Starta om för att börja använda den; den tidigare filen ligger kvar bredvid tills dess."
  sw: "AppImage mpya iko mahali pake na imethibitishwa. Zindua upya ili uanze kuitumia; faili la awali linabaki kando yake hadi wakati huo."
  th: "AppImage ใหม่พร้อมใช้งานและผ่านการตรวจสอบแล้ว เปิดใหม่เพื่อเริ่มใช้งาน ระหว่างนี้ไฟล์เดิมจะเก็บไว้ข้างกัน"
  uk: "Новий AppImage на місці й перевірений. Перезапустіть застосунок, щоб почати ним користуватися; доти попередній файл зберігається поруч."
  vi: "AppImage mới đã sẵn sàng và được xác minh. Khởi chạy lại để bắt đầu dùng; tệp trước đó được giữ bên cạnh cho đến lúc đó."
  zh: "新的 AppImage 已就位并通过验证。重新启动即可开始使用；在此之前，旧文件会保留在旁边。"
  zh-HK: "新的 AppImage 已就位並通過驗證。重新啟動即可開始使用；在此之前，舊檔案會保留在旁邊。"
