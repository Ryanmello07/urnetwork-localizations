description: "Protocol leaderboard (Leaderboard > Protocol): the warning every claim prompt carries: a fleet that claimed a Top 200 spot but is ranked 201st or lower by the SN25 validator earns nothing (its devices leave the regular payout pool either way). The Earnings Top 200 tile repeats it (earnings_top200_claiming_soon_body)."
source: "A claimed fleet that ranks 201 or lower earns nothing."
platforms:
  - apple
  - android
  - windows
  - site
