description: "Key screen: the screen that shows the Bittensor recovery phrase, a 12 word secret for a key this app made on the device. The app also has a sign-in seed phrase of 24 words, a different secret, and people mix them up. Keep the two terms clearly different: use the same word for 'seed phrase' as the sign-up screen's 'Your Seedphrase' does in your language where it fits, and the word for 'recovery phrase' everywhere else in these strings."
source: "This is not your account seed phrase from sign-up. It only controls this Bittensor key."
platforms:
  - apple
localizations:
  ar: "هذه ليست عبارة الاسترداد الخاصة بحسابك التي حصلت عليها عند التسجيل. عبارة النسخ الاحتياطي هذه تتحكم في مفتاح Bittensor هذا فقط."
  cs: "Toto není seed fráze vašeho účtu z registrace. Tato obnovovací fráze ovládá jen tento klíč Bittensor."
  de: "Das ist nicht die Seedphrase deines Kontos aus der Registrierung. Diese Wiederherstellungsphrase kontrolliert nur diesen Bittensor-Schlüssel."
  el: "Αυτή δεν είναι η φράση ανάκτησης του λογαριασμού σας από την εγγραφή. Αυτή η φράση επαναφοράς ελέγχει μόνο αυτό το κλειδί Bittensor."
  en: "This is not your account seed phrase from sign-up. It only controls this Bittensor key."
  es: "Esta no es la frase semilla de tu cuenta que obtuviste al registrarte. Esta frase de recuperación solo controla esta clave de Bittensor."
  es-419: "Esta no es la frase semilla de tu cuenta que obtuviste al registrarte. Esta frase de recuperación solo controla esta clave de Bittensor."
  es-MX: "Esta no es la frase semilla de tu cuenta que obtuviste al registrarte. Esta frase de recuperación solo controla esta clave de Bittensor."
  fr: "Ce n’est pas la phrase de récupération de votre compte, reçue à l’inscription. Cette phrase de sauvegarde contrôle uniquement cette clé Bittensor."
  he: "זה לא ביטוי הסיד של החשבון שלכם מההרשמה. ביטוי השחזור הזה שולט רק במפתח ה-Bittensor הזה."
  hi: "यह आपके खाते का साइन-अप वाला सीड फ़्रेज़ नहीं है। यह रिकवरी फ़्रेज़ केवल इस Bittensor कुंजी को नियंत्रित करता है।"
  id: "Ini bukan frasa pemulihan akun Anda dari saat mendaftar. Frasa cadangan ini hanya mengendalikan kunci Bittensor ini."
  it: "Questa non è la frase seed del tuo account ricevuta alla registrazione. Questa frase di recupero controlla solo questa chiave Bittensor."
  ja: "これは登録時に発行されたアカウントのシードフレーズではありません。この復元フレーズが制御するのは、この Bittensor キーだけです。"
  ko: "이것은 가입할 때 받은 계정 시드 문구가 아닙니다. 이 복구 문구는 이 Bittensor 키만 제어합니다."
  nl: "Dit is niet de seedphrase die je bij het aanmaken van je account kreeg. Deze herstelzin geeft alleen controle over deze Bittensor-sleutel."
  pl: "To nie jest fraza seed twojego konta z rejestracji. Ta fraza odzyskiwania kontroluje tylko ten klucz Bittensor."
  pt: "Esta não é a frase-semente da sua conta, criada no registo. Esta frase de recuperação só controla esta chave Bittensor."
  pt-BR: "Esta não é a frase-semente da sua conta, criada no cadastro. Esta frase de recuperação só controla esta chave Bittensor."
  pt-PT: "Esta não é a frase-semente da sua conta, criada no registo. Esta frase de recuperação só controla esta chave Bittensor."
  ru: "Это не сид-фраза вашего аккаунта, полученная при регистрации. Эта фраза восстановления контролирует только этот ключ Bittensor."
  sv: "Det här är inte ditt kontos seedfras från registreringen. Den här återställningsfrasen kontrollerar bara den här Bittensor-nyckeln."
  sw: "Hiki si kifungu cha seed cha akaunti yako cha wakati wa kujisajili. Kifungu hiki cha urejeshaji kinadhibiti ufunguo huu wa Bittensor pekee."
  th: "นี่ไม่ใช่วลีกู้คืนของบัญชีคุณจากตอนสมัคร วลีสำรองนี้ควบคุมเฉพาะคีย์ Bittensor นี้เท่านั้น"
  uk: "Це не сід-фраза вашого облікового запису, отримана під час реєстрації. Ця фраза відновлення контролює лише цей ключ Bittensor."
  vi: "Đây không phải là cụm từ khôi phục của tài khoản bạn từ lúc đăng ký. Cụm từ sao lưu này chỉ kiểm soát khóa Bittensor này."
  zh: "这不是您注册时的账户助记词。此恢复短语仅控制这个 Bittensor 密钥。"
  zh-HK: "這不是你註冊時的帳戶助記詞。此復原短語只控制這個 Bittensor 金鑰。"
