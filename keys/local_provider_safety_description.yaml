description: "Call to action"
source: "A local provider will run when you are connected to the network. There are over 30k providers today, and we have zero known security or ISP incidents. We value the ability for people to participate without issues, and have built the protocol to put safety first."
platforms:
  - android
localizations:
  ar: "سيتم تشغيل مزود محلي عند اتصالك بالشبكة. يوجد اليوم أكثر من 30 ألف مزود، ولم نسجل أي حوادث أمنية أو مع مزودي خدمة الإنترنت. نحن نقدر قدرة الأشخاص على المشاركة دون مشاكل، وقد أنشأنا البروتوكول ليضع السلامة أولاً."
  cs: "Po připojení k síti bude spuštěn místní poskytovatel. Dnes je k dispozici přes 30 000 poskytovatelů a nemáme žádné známé bezpečnostní nebo ISP incidenty. Oceňujeme možnost účasti bez problémů a protokol jsme navrhli s důrazem na bezpečnost."
  de: "Ein lokaler Anbieter wird ausgeführt, wenn du mit dem Netzwerk verbunden bist. Es gibt heute über 30.000 Anbieter und keine bekannten Sicherheits- oder ISP-Vorfälle. Wir legen Wert darauf, dass Menschen ohne Probleme teilnehmen können und haben das Protokoll mit Fokus auf Sicherheit entwickelt."
  el: "Ένας τοπικός πάροχος θα λειτουργεί όταν είστε συνδεδεμένοι στο δίκτυο. Υπάρχουν πάνω από 30.000 πάροχοι σήμερα και δεν έχουμε κανένα γνωστό περιστατικό ασφαλείας ή ISP. Εκτιμούμε τη δυνατότητα των ανθρώπων να συμμετέχουν χωρίς προβλήματα και έχουμε σχεδιάσει το πρωτόκολλο με προτεραιότητα την ασφάλεια."
  en: "A local provider will run when you are connected to the network. There are over 30k providers today, and we have zero known security or ISP incidents. We value the ability for people to participate without issues, and have built the protocol to put safety first."
  es: "Un proveedor local se ejecutará cuando estés conectado a la red. Hoy hay más de 30,000 proveedores y no tenemos incidentes de seguridad o ISP conocidos. Valoramos la capacidad de las personas para participar sin problemas y hemos creado el protocolo priorizando la seguridad."
  es-419: "Un proveedor local se ejecutará cuando estés conectado a la red. Hoy hay más de 30,000 proveedores y no tenemos incidentes de seguridad o ISP conocidos. Valoramos la capacidad de las personas para participar sin problemas y hemos creado el protocolo priorizando la seguridad."
  es-MX: "Un proveedor local se ejecutará cuando estés conectado a la red. Hoy hay más de 30,000 proveedores y no tenemos incidentes de seguridad o ISP conocidos. Valoramos la capacidad de las personas para participar sin problemas y hemos creado el protocolo priorizando la seguridad."
  fr: "Un fournisseur local s’exécutera lorsque vous serez connecté au réseau. Il y a aujourd’hui plus de 30 000 fournisseurs, et nous n’avons aucun incident de sécurité ou avec les FAI connu. Nous valorisons la capacité des gens à participer sans problème et avons conçu le protocole en mettant la sécurité en priorité."
  he: "ספק מקומי יפעל כאשר אתה מחובר לרשת. כיום יש יותר מ-30 אלף ספקים, ואין לנו אף תקרית ידועה של אבטחה או ספקי אינטרנט. אנחנו מעריכים את היכולת של אנשים להשתתף ללא בעיות, ובנינו את הפרוטוקול כשהבטיחות במקום הראשון."
  hi: "जब आप नेटवर्क से जुड़े होते हैं, एक स्थानीय प्रदाता चलेगा। आज 30,000 से अधिक प्रदाता हैं, और हमारे पास कोई ज्ञात सुरक्षा या ISP घटनाएं नहीं हैं। हम लोगों की बिना किसी समस्या के भागीदारी को महत्व देते हैं और सुरक्षा को प्राथमिकता देने के लिए प्रोटोकॉल बनाया है।"
  id: "Penyedia lokal akan berjalan saat Anda terhubung ke jaringan. Saat ini ada lebih dari 30 ribu penyedia, dan kami tidak memiliki insiden keamanan atau ISP yang diketahui. Kami menghargai kemampuan orang untuk berpartisipasi tanpa masalah, dan telah membangun protokol dengan mengutamakan keamanan."
  it: "Un provider locale sarà attivo quando sei connesso alla rete. Oggi ci sono oltre 30k provider e non abbiamo alcun incidente noto di sicurezza o con gli ISP. Teniamo alla possibilità delle persone di partecipare senza problemi e abbiamo costruito il protocollo mettendo la sicurezza al primo posto."
  ja: "ネットワークに接続するとローカルプロバイダーが稼働します。現在3万以上のプロバイダーがあり、セキュリティやISPのインシデントは一切ありません。誰もが問題なく参加できることを重視し、安全性を最優先にプロトコルを構築しています。"
  ko: "네트워크에 연결되면 로컬 제공자가 실행됩니다. 현재 3만 개 이상의 제공자가 있으며, 알려진 보안 또는 ISP 사고는 없습니다. 누구나 문제 없이 참여할 수 있는 능력을 중요하게 여기며, 안전을 최우선으로 하는 프로토콜을 구축했습니다."
  nl: "Een lokale aanbieder wordt actief zodra je verbonden bent met het netwerk. Er zijn vandaag de dag meer dan 30.000 aanbieders en we hebben geen bekende beveiligings- of ISP-incidenten. We waarderen het dat mensen zonder problemen kunnen deelnemen en hebben het protocol ontworpen met veiligheid als prioriteit."
  pl: "Lokalny dostawca będzie działał, gdy będziesz połączony z siecią. Obecnie jest ponad 30 tys. dostawców i nie mamy żadnych znanych incydentów związanych z bezpieczeństwem lub ISP. Cenimy możliwość uczestnictwa bez problemów i stworzyliśmy protokół z myślą o bezpieczeństwie."
  pt: "Um fornecedor local será executado quando estiver ligado à rede. Existem atualmente mais de 30 mil fornecedores e não temos incidentes conhecidos de segurança ou ISP. Valorizamos a capacidade das pessoas de participar sem problemas e criámos o protocolo para dar prioridade à segurança."
  pt-BR: "Um provedor local será executado quando você estiver conectado à rede. Hoje há mais de 30 mil provedores e não temos nenhum incidente de segurança ou ISP conhecido. Valorizamos a participação sem problemas e desenvolvemos o protocolo priorizando a segurança."
  pt-PT: "Um fornecedor local será executado quando estiver ligado à rede. Existem atualmente mais de 30 mil fornecedores e não temos incidentes conhecidos de segurança ou ISP. Valorizamos a capacidade das pessoas de participar sem problemas e criámos o protocolo para dar prioridade à segurança."
  ru: "Локальный провайдер будет работать, когда вы подключены к сети. Сегодня существует более 30 тысяч провайдеров, и у нас нет известных инцидентов, связанных с безопасностью или интернет-провайдерами. Мы ценим возможность участия без проблем и создали протокол с приоритетом безопасности."
  sv: "En lokal leverantör körs när du är ansluten till nätverket. Det finns över 30k leverantörer idag, och vi har inga kända säkerhets- eller ISP-incidenter. Vi värdesätter att människor kan delta utan problem och har byggt protokollet med säkerheten främst."
  sw: "Mtoa huduma wa eneo lako ataendeshwa unapounganishwa na mtandao. Kuna zaidi ya watoa huduma 30,000 leo, na hatuna matukio yoyote yanayojulikana ya usalama au ISP. Tunathamini uwezo wa watu kushiriki bila matatizo, na tumeunda itifaki inayoweka usalama kwanza."
  th: "ผู้ให้บริการในพื้นที่จะทำงานเมื่อคุณเชื่อมต่อกับเครือข่าย ปัจจุบันมีผู้ให้บริการมากกว่า 30,000 ราย และเราไม่มีเหตุการณ์ด้านความปลอดภัยหรือ ISP ที่ทราบ เราให้ความสำคัญกับความสามารถในการเข้าร่วมโดยไม่มีปัญหา และได้สร้างโปรโตคอลโดยคำนึงถึงความปลอดภัยเป็นอันดับแรก"
  uk: "Локальний провайдер працюватиме, коли ви підключені до мережі. Сьогодні існує понад 30 тис. провайдерів, і в нас немає жодних відомих інцидентів з безпекою чи інтернет-провайдерами. Ми цінуємо можливість людей брати участь без проблем і побудували протокол, поставивши безпеку на перше місце."
  vi: "Nhà cung cấp cục bộ sẽ chạy khi bạn kết nối với mạng. Hiện có hơn 30 nghìn nhà cung cấp, và chúng tôi chưa ghi nhận sự cố nào về bảo mật hay với ISP. Chúng tôi coi trọng việc mọi người có thể tham gia mà không gặp vấn đề, và đã xây dựng giao thức với sự an toàn được đặt lên hàng đầu."
  zh: "当您连接到网络时，本地提供者将运行。目前有超过 3 万个提供者，我们没有已知的安全或 ISP 事件。我们重视让每个人都能无障碍参与，并将安全性作为协议设计的首要任务。"
  zh-HK: "當您連接到網絡時，本地供應商將會運行。目前有超過 3 萬個供應商，我們沒有任何已知的安全或 ISP 事故。我們重視讓人們能夠無障礙地參與，並在建構協議時將安全放在首位。"
