description: "Developer tools screen: explanatory subtext under the 'probe timeout' control."
source: "How long a qualification probe waits for an answer. Off uses the built-in 4s. It only bounds waiting for proof, it never convicts"
platforms:
  - android
localizations:
  ar: "المدة التي ينتظر فيها فحص التأهيل ردًا. عند الإيقاف، تُستخدم المهلة المدمجة البالغة 4 ثوانٍ. يحدّ فقط من انتظار الإثبات، ولا يُدين أبدًا"
  cs: "Jak dlouho kvalifikační sonda čeká na odpověď. Vypnuto použije vestavěné 4 s. Omezuje jen čekání na důkaz, nikdy neodsuzuje"
  de: "Wie lange eine Qualifizierungsprüfung auf eine Antwort wartet. Aus: nutzt die eingebauten 4 s. Begrenzt nur das Warten auf einen Nachweis und verurteilt nie"
  el: "Πόσο περιμένει απάντηση ένας ανιχνευτής πιστοποίησης. Η απενεργοποίηση χρησιμοποιεί τα ενσωματωμένα 4 δ. Περιορίζει μόνο την αναμονή για απόδειξη, δεν καταδικάζει ποτέ"
  en: "How long a qualification probe waits for an answer. Off uses the built-in 4s. It only bounds waiting for proof, it never convicts"
  es: "Cuánto espera una sonda de calificación una respuesta. Si está desactivado, se usan los 4 s integrados. Solo limita la espera de una prueba; nunca condena"
  es-419: "Cuánto espera una sonda de calificación una respuesta. Si está desactivado, se usan los 4 s integrados. Solo limita la espera de una prueba; nunca condena"
  es-MX: "Cuánto espera una sonda de calificación una respuesta. Si está desactivado, se usan los 4 s integrados. Solo limita la espera de una prueba; nunca condena"
  fr: "Combien de temps une sonde de qualification attend une réponse. Désactivé utilise les 4 s intégrées. Elle borne seulement l’attente d’une preuve, elle ne condamne jamais"
  he: "כמה זמן בדיקת הכשרה ממתינה לתשובה. כיבוי משתמש ב-4 השניות המובנות. היא רק מגבילה את ההמתנה להוכחה, ולעולם אינה מרשיעה"
  hi: "योग्यता प्रोब जवाब के लिए कितनी देर रुकता है। बंद करने पर अंतर्निहित 4 सेकंड इस्तेमाल होते हैं। यह सिर्फ़ सबूत के इंतज़ार को सीमित करता है, कभी दोषी नहीं ठहराता"
  id: "Berapa lama probe kualifikasi menunggu jawaban. Nonaktif memakai 4 dtk bawaan. Ini hanya membatasi penantian bukti, tidak pernah memvonis"
  it: "Quanto aspetta una risposta una sonda di qualifica. Disattivato usa i 4 s integrati. Limita solo l’attesa di una prova, non condanna mai"
  ja: "検証の確認が応答を待つ時間。オフにすると組み込みの 4 秒を使います。証拠を待つ時間を制限するだけで、判定には使われません"
  ko: "검증 점검이 응답을 기다리는 시간입니다. 끄면 내장된 4초를 사용합니다. 증거를 기다리는 시간만 제한하며 판정하지는 않습니다"
  nl: "Hoe lang een kwalificatietest op een antwoord wacht. Uit gebruikt de ingebouwde 4 s. Het begrenst alleen het wachten op bewijs, het veroordeelt nooit"
  pl: "Jak długo sonda kwalifikacyjna czeka na odpowiedź. Wyłączenie używa wbudowanych 4 s. Ogranicza tylko czekanie na dowód, nigdy nie skazuje"
  pt: "Durante quanto tempo uma sonda de qualificação espera uma resposta. Desativado usa os 4 s integrados. Só limita a espera por uma prova, nunca condena"
  pt-BR: "Por quanto tempo uma sonda de qualificação espera uma resposta. Desativado usa os 4 s integrados. Ela só limita a espera por uma prova, nunca condena"
  pt-PT: "Durante quanto tempo uma sonda de qualificação espera uma resposta. Desativado usa os 4 s integrados. Só limita a espera por uma prova, nunca condena"
  ru: "Как долго проба квалификации ждёт ответа. Если выключено, используются встроенные 4 с. Ограничивает только ожидание подтверждения и никогда не осуждает"
  sv: "Hur länge en kvalificeringssond väntar på svar. Av använder de inbyggda 4 s. Den begränsar bara väntan på bevis, den fäller aldrig"
  sw: "Muda ambao kipimo cha uthibitisho husubiri jibu. Kuzima kunatumia sekunde 4 zilizojengewa ndani. Hupunguza tu muda wa kusubiri uthibitisho, haihukumu kamwe"
  th: "การทดสอบรับรองจะรอคำตอบนานเท่าใด ปิดเพื่อใช้ค่าในตัว 4 วินาที ใช้จำกัดเวลารอหลักฐานเท่านั้น ไม่เคยตัดสิน"
  uk: "Скільки кваліфікаційний зонд чекає на відповідь. Вимкнення використовує вбудовані 4 с. Він лише обмежує очікування доказу, ніколи не засуджує"
  vi: "Một lần thăm dò kiểm định chờ phản hồi bao lâu. Tắt sẽ dùng 4 giây tích hợp. Nó chỉ giới hạn thời gian chờ bằng chứng, không bao giờ kết luận lỗi"
  zh: "验证探测等待应答的时长。关闭时使用内置的 4 秒。它只限制等待证明的时间，绝不定罪"
  zh-HK: "驗證探測等待回應的時長。關閉時使用內置的 4 秒。它只限制等待證明的時間，絕不判罪"
