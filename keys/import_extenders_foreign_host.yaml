description: "Error when a share code belongs to another network. The argument is that network's host."
source: "This code is for %@, not this network. Use extender settings to switch networks."
platforms:
  - android
  - apple
  - linux
  - windows
placeholders:
  - name: host
    type: string
localizations:
  ar: "هذا الرمز مخصص لـ {host} وليس لهذه الشبكة. استخدم إعدادات الموسّع لتبديل الشبكة."
  cs: "Tento kód je pro {host}, ne pro tuto síť. Ke změně sítě použijte nastavení extenderu."
  de: "Dieser Code ist für {host}, nicht für dieses Netzwerk. Wechsle das Netzwerk in den Extender-Einstellungen."
  el: "Αυτός ο κωδικός είναι για το {host}, όχι για αυτό το δίκτυο. Χρησιμοποιήστε τις ρυθμίσεις επεκτατή για να αλλάξετε δίκτυο."
  en: "This code is for {host}, not this network. Use extender settings to switch networks."
  es: "Este código es para {host}, no para esta red. Usa los ajustes del extensor para cambiar de red."
  es-419: "Este código es para {host}, no para esta red. Usa la configuración del extensor para cambiar de red."
  es-MX: "Este código es para {host}, no para esta red. Usa la configuración del extensor para cambiar de red."
  fr: "Ce code est destiné à {host}, pas à ce réseau. Utilisez les paramètres de l’extendeur pour changer de réseau."
  he: "הקוד הזה מיועד ל-{host}, לא לרשת הזו. השתמשו בהגדרות המרחיב כדי להחליף רשת."
  hi: "यह कोड {host} के लिए है, इस नेटवर्क के लिए नहीं। नेटवर्क बदलने के लिए एक्सटेंडर सेटिंग इस्तेमाल करें।"
  id: "Kode ini untuk {host}, bukan jaringan ini. Gunakan setelan extender untuk berganti jaringan."
  it: "Questo codice è per {host}, non per questa rete. Usa le impostazioni dell’extender per cambiare rete."
  ja: "このコードはこのネットワークではなく {host} 用です。ネットワークを切り替えるにはエクステンダー設定を使ってください。"
  ko: "이 코드는 이 네트워크가 아니라 {host}용입니다. 네트워크를 바꾸려면 익스텐더 설정을 사용하세요."
  nl: "Deze code is voor {host}, niet voor dit netwerk. Gebruik de extender-instellingen om van netwerk te wisselen."
  pl: "Ten kod jest dla {host}, nie dla tej sieci. Aby zmienić sieć, użyj ustawień extendera."
  pt: "Este código é para {host}, não para esta rede. Use as definições do extensor para mudar de rede."
  pt-BR: "Este código é para {host}, não para esta rede. Use as configurações do extensor para trocar de rede."
  pt-PT: "Este código é para {host}, não para esta rede. Use as definições do extensor para mudar de rede."
  ru: "Этот код предназначен для {host}, а не для этой сети. Чтобы сменить сеть, используйте настройки экстендера."
  sv: "Den här koden är för {host}, inte för det här nätverket. Använd extenderinställningarna för att byta nätverk."
  sw: "Msimbo huu ni wa {host}, si wa mtandao huu. Tumia mipangilio ya kipanuzi ili kubadilisha mtandao."
  th: "รหัสนี้สำหรับ {host} ไม่ใช่เครือข่ายนี้ ใช้การตั้งค่าตัวขยายเพื่อสลับเครือข่าย"
  uk: "Цей код призначено для {host}, а не для цієї мережі. Щоб змінити мережу, скористайтеся налаштуваннями екстендера."
  vi: "Mã này dành cho {host}, không phải mạng này. Hãy dùng cài đặt bộ mở rộng để chuyển mạng."
  zh: "此代码适用于 {host}，而不是当前网络。请在扩展器设置中切换网络。"
  zh-HK: "此代碼適用於 {host}，而不是目前的網絡。請在擴展器設定中切換網絡。"
