description: "Settings: the confirmation before a new seedphrase replaces the current one; the new one is shown once, to be saved."
source: "Your current seedphrase will stop working. You'll be shown a new one to save."
platforms:
  - android
localizations:
  ar: "ستتوقف عبارة الاسترداد الحالية عن العمل. ستظهر لك عبارة جديدة لتحفظها."
  cs: "Vaše současná seed fráze přestane fungovat. Zobrazí se vám nová, kterou si uložte."
  de: "Deine aktuelle Seedphrase funktioniert dann nicht mehr. Dir wird eine neue zum Aufbewahren angezeigt."
  el: "Η τρέχουσα φράση ανάκτησης θα σταματήσει να λειτουργεί. Θα σας εμφανιστεί μια νέα για να την αποθηκεύσετε."
  en: "Your current seedphrase will stop working. You'll be shown a new one to save."
  es: "Tu frase semilla actual dejará de funcionar. Verás una nueva para guardarla."
  es-419: "Tu frase semilla actual dejará de funcionar. Verás una nueva para guardarla."
  es-MX: "Tu frase semilla actual dejará de funcionar. Verás una nueva para guardarla."
  fr: "Votre phrase de récupération actuelle ne fonctionnera plus. Une nouvelle vous sera présentée, à conserver."
  he: "ביטוי הסיד הנוכחי שלך יפסיק לעבוד. יוצג לך ביטוי חדש לשמירה."
  hi: "आपका मौजूदा सीड फ़्रेज़ काम करना बंद कर देगा। आपको सहेजने के लिए एक नया दिखाया जाएगा।"
  id: "Frasa pemulihan Anda saat ini akan berhenti berfungsi. Anda akan diperlihatkan frasa baru untuk disimpan."
  it: "La tua frase seed attuale smetterà di funzionare. Te ne verrà mostrata una nuova da conservare."
  ja: "現在のシードフレーズは使えなくなります。保存用に新しいシードフレーズが表示されます。"
  ko: "현재 시드 문구는 더 이상 작동하지 않습니다. 저장할 새 시드 문구가 표시됩니다."
  nl: "Je huidige seedphrase werkt dan niet meer. Je krijgt een nieuwe te zien om te bewaren."
  pl: "Twoja obecna fraza seed przestanie działać. Zobaczysz nową, którą trzeba zachować."
  pt: "A sua frase-semente atual deixará de funcionar. Ser-lhe-á mostrada uma nova para guardar."
  pt-BR: "Sua frase-semente atual deixará de funcionar. Você verá uma nova para guardar."
  pt-PT: "A sua frase-semente atual deixará de funcionar. Ser-lhe-á mostrada uma nova para guardar."
  ru: "Текущая сид-фраза перестанет работать. Вам покажут новую — сохраните её."
  sv: "Din nuvarande seedfras slutar fungera. Du får se en ny som du ska spara."
  sw: "Kifungu chako cha seed cha sasa kitaacha kufanya kazi. Utaonyeshwa kipya cha kuhifadhi."
  th: "วลีกู้คืนปัจจุบันของคุณจะใช้ไม่ได้อีก คุณจะเห็นวลีใหม่เพื่อเก็บไว้"
  uk: "Ваша поточна сід-фраза перестане працювати. Вам покажуть нову — збережіть її."
  vi: "Cụm từ khôi phục hiện tại của bạn sẽ ngừng hoạt động. Bạn sẽ thấy một cụm từ mới để lưu lại."
  zh: "你当前的助记词将失效。系统会显示新的助记词，请保存。"
  zh-HK: "你目前的助記詞將會失效。系統會顯示新的助記詞，請妥善保存。"
