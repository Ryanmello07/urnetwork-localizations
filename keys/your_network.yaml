description: "Heading of the panel beside the leaderboard on wide screens (an unfolded foldable phone, a tablet, a wide window). The panel shows the user's own URnetwork network: its current ranking, the data it provided, its points, its longest streak and the switch that shows it on the leaderboard. \"Network\" is the user's URnetwork account (the network they named), not a Wi-Fi or mobile network. A short heading: two or three words."
