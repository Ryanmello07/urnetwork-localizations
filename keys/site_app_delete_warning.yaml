description: "App settings: delete warning"
source: "This permanently deletes your network, its data, and its earnings. This cannot be undone."
platforms:
  - site
  - linux
  - windows
localizations:
  ar: "سيؤدي هذا إلى حذف شبكتك وبياناتها وأرباحها نهائياً. لا يمكن التراجع عن هذا الإجراء."
  cs: "Tímto trvale smažete svou síť, její data a výdělky. Tuto akci nelze vrátit zpět."
  de: "Dadurch werden dein Netzwerk, seine Daten und seine Einnahmen dauerhaft gelöscht. Dies kann nicht rückgängig gemacht werden."
  el: "Αυτό διαγράφει οριστικά το δίκτυό σας, τα δεδομένα του και τα κέρδη του. Δεν είναι δυνατή η αναίρεση."
  en: "This permanently deletes your network, its data, and its earnings. This cannot be undone."
  es: "Esto elimina de forma permanente tu red, sus datos y sus ganancias. No se puede deshacer."
  es-419: "Esto elimina de forma permanente tu red, sus datos y sus ganancias. No se puede deshacer."
  es-MX: "Esto elimina de forma permanente tu red, sus datos y sus ganancias. No se puede deshacer."
  fr: "Cette action supprime définitivement votre réseau, ses données et ses gains. Elle est irréversible."
  he: "פעולה זו מוחקת לצמיתות את הרשת שלכם, את הנתונים שלה ואת הרווחים שלה. אי אפשר לבטל אותה."
  hi: "इससे आपका नेटवर्क, उसका डेटा और उसकी कमाई स्थायी रूप से हट जाती है। इसे पूर्ववत नहीं किया जा सकता।"
  id: "Tindakan ini menghapus jaringan Anda, datanya, dan pendapatannya secara permanen. Tindakan ini tidak dapat dibatalkan."
  it: "Questa azione elimina definitivamente la tua rete, i suoi dati e i suoi guadagni. Non è possibile annullarla."
  ja: "ネットワーク、そのデータ、収益が完全に削除されます。この操作は元に戻せません。"
  ko: "네트워크와 그 데이터, 수익이 영구적으로 삭제됩니다. 이 작업은 되돌릴 수 없습니다."
  nl: "Hiermee worden je netwerk, de gegevens en de verdiensten ervan permanent verwijderd. Dit kan niet ongedaan worden gemaakt."
  pl: "Spowoduje to trwałe usunięcie Twojej sieci, jej danych i zarobków. Tej operacji nie można cofnąć."
  pt: "Esta ação elimina permanentemente a sua rede, os respetivos dados e os ganhos. Não é possível anulá-la."
  pt-BR: "Isso exclui permanentemente sua rede, os dados dela e os ganhos. Essa ação não pode ser desfeita."
  pt-PT: "Esta ação elimina permanentemente a sua rede, os respetivos dados e os ganhos. Não é possível anulá-la."
  ru: "Это навсегда удалит вашу сеть, её данные и заработок. Отменить это действие нельзя."
  sv: "Detta raderar permanent ditt nätverk, dess data och dess intäkter. Det går inte att ångra."
  sw: "Hii inafuta kabisa mtandao wako, data yake na mapato yake. Hili haliwezi kutenduliwa."
  th: "การดำเนินการนี้จะลบเครือข่ายของคุณ ข้อมูล และรายได้ของเครือข่ายอย่างถาวร และไม่สามารถย้อนกลับได้"
  uk: "Це остаточно видалить вашу мережу, її дані та заробіток. Цю дію не можна скасувати."
  vi: "Thao tác này sẽ xóa vĩnh viễn mạng của bạn, cùng dữ liệu và thu nhập của mạng. Không thể hoàn tác."
  zh: "这将永久删除您的网络、其数据及收益。此操作无法撤销。"
  zh-HK: "此操作會永久刪除你的網絡、其數據及收益，且無法復原。"
