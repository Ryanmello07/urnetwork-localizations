description: "Developer tools screen: explanatory subtext under the 'load corroboration' control."
source: "Extra silent destinations required per this many flows before a busy exit can be benched on soft evidence: a 24-flow exit at 8 needs 3 silent sites, not 2. Off keeps the flat minimum"
platforms:
  - android
localizations:
  ar: "عدد الوجهات الصامتة الإضافية المطلوبة لكل هذا العدد من التدفقات قبل أن يمكن حجر مخرج مشغول بناءً على أدلة ضعيفة: المخرج ذو 24 تدفقًا عند القيمة 8 يحتاج إلى 3 مواقع صامتة لا 2. عند الإيقاف، يبقى الحد الأدنى الثابت"
  cs: "Další tiché cíle vyžadované na každý tento počet toků, než může být vytížený výstup na základě slabých důkazů poslán na lavičku: výstup s 24 toky při 8 potřebuje 3 tiché weby, ne 2. Vypnuto drží pevné minimum"
  de: "Zusätzliche stille Ziele, die pro so vielen Flows nötig sind, bevor ein ausgelasteter Exit auf schwache Hinweise hin auf die Ersatzbank gesetzt werden kann: Ein Exit mit 24 Flows braucht bei 8 3 stille Websites statt 2. Aus: behält das feste Minimum"
  el: "Επιπλέον σιωπηλοί προορισμοί που απαιτούνται ανά τόσες ροές πριν μια απασχολημένη έξοδος μπει στον πάγκο με αδύναμα στοιχεία: μια έξοδος 24 ροών με τιμή 8 χρειάζεται 3 σιωπηλούς ιστότοπους, όχι 2. Η απενεργοποίηση κρατά το σταθερό ελάχιστο"
  en: "Extra silent destinations required per this many flows before a busy exit can be benched on soft evidence: a 24-flow exit at 8 needs 3 silent sites, not 2. Off keeps the flat minimum"
  es: "Destinos silenciosos adicionales necesarios por cada esta cantidad de flujos antes de poder mandar al banquillo una salida ocupada con indicios débiles: una salida de 24 flujos con 8 necesita 3 sitios silenciosos, no 2. Si está desactivado, se mantiene el mínimo fijo"
  es-419: "Destinos silenciosos adicionales necesarios por cada esta cantidad de flujos antes de poder mandar a la banca una salida ocupada con indicios débiles: una salida de 24 flujos con 8 necesita 3 sitios silenciosos, no 2. Si está desactivado, se mantiene el mínimo fijo"
  es-MX: "Destinos silenciosos adicionales necesarios por cada esta cantidad de flujos antes de poder mandar a la banca una salida ocupada con indicios débiles: una salida de 24 flujos con 8 necesita 3 sitios silenciosos, no 2. Si está desactivado, se mantiene el mínimo fijo"
  fr: "Destinations silencieuses supplémentaires exigées par tranche de ce nombre de flux avant qu’une sortie chargée puisse être mise sur la touche sur des indices faibles : une sortie de 24 flux à 8 exige 3 sites silencieux, pas 2. Désactivé garde le minimum fixe"
  he: "יעדים שקטים נוספים שנדרשים לכל מספר כזה של זרימות לפני שיציאה עמוסה תועבר לספסל על סמך ראיות חלשות: יציאה עם 24 זרימות בערך 8 צריכה 3 אתרים שקטים, לא 2. כיבוי שומר על המינימום הקבוע"
  hi: "किसी व्यस्त एग्ज़िट को कमज़ोर सबूत पर बेंच भेजने से पहले हर इतने फ़्लो पर ज़रूरी अतिरिक्त शांत गंतव्य: 8 पर 24 फ़्लो वाले एग्ज़िट को 2 नहीं, 3 शांत साइटें चाहिए। बंद करने पर तय न्यूनतम बना रहता है"
  id: "Tujuan diam tambahan yang diperlukan per sekian aliran sebelum exit yang sibuk bisa dicadangkan dengan bukti lemah: exit 24 aliran pada nilai 8 butuh 3 situs diam, bukan 2. Nonaktif mempertahankan minimum tetap"
  it: "Destinazioni silenziose in più richieste ogni tot flussi prima che un’uscita occupata possa andare in panchina con indizi deboli: un’uscita da 24 flussi con 8 richiede 3 siti silenziosi, non 2. Disattivato mantiene il minimo fisso"
  ja: "弱い証拠で混雑した出口を待機させる前に、このフロー数ごとに必要な追加の無応答宛先。値が 8 のとき、24 フローの出口では無応答サイトが 2 つではなく 3 つ必要です。オフにすると固定の最小値を保ちます"
  ko: "약한 근거로 바쁜 출구를 대기시키기 전에 이 플로우 수마다 필요한 추가 무응답 대상입니다. 값이 8일 때 플로우 24개인 출구는 무응답 사이트가 2개가 아니라 3개 필요합니다. 끄면 고정 최솟값을 유지합니다"
  nl: "Extra stille bestemmingen die per dit aantal flows nodig zijn voordat een drukke exit op zwak bewijs op de bank kan: een exit met 24 flows bij 8 heeft 3 stille sites nodig, niet 2. Uit houdt het vaste minimum"
  pl: "Dodatkowe milczące cele wymagane na każdą taką liczbę przepływów, zanim zajęte wyjście trafi na ławkę na podstawie słabych dowodów: wyjście z 24 przepływami przy 8 wymaga 3 milczących witryn, nie 2. Wyłączenie zachowuje stałe minimum"
  pt: "Destinos silenciosos adicionais exigidos por cada este número de fluxos antes de uma saída ocupada poder ir para o banco com indícios fracos: uma saída de 24 fluxos com 8 precisa de 3 sites silenciosos, não 2. Desativado mantém o mínimo fixo"
  pt-BR: "Destinos silenciosos extras exigidos a cada essa quantidade de fluxos antes que uma saída ocupada possa ir para o banco com evidências fracas: uma saída de 24 fluxos com 8 precisa de 3 sites silenciosos, não 2. Desativado mantém o mínimo fixo"
  pt-PT: "Destinos silenciosos adicionais exigidos por cada este número de fluxos antes de uma saída ocupada poder ir para o banco com indícios fracos: uma saída de 24 fluxos com 8 precisa de 3 sites silenciosos, não 2. Desativado mantém o mínimo fixo"
  ru: "Сколько дополнительных молчащих адресатов требуется на каждое такое число потоков, прежде чем загруженный выход можно отстранить по косвенным признакам: выходу с 24 потоками при значении 8 нужно 3 молчащих сайта, а не 2. Если выключено, действует фиксированный минимум"
  sv: "Extra tysta destinationer som krävs per så här många flöden innan en upptagen utgång kan bänkas på svaga belägg: en utgång med 24 flöden vid 8 kräver 3 tysta webbplatser, inte 2. Av behåller det fasta minimumet"
  sw: "Malengo ya ziada yaliyo kimya yanayohitajika kwa kila idadi hii ya mitiririko kabla njia ya kutoka yenye shughuli haijawekwa benchi kwa ushahidi dhaifu: njia yenye mitiririko 24 kwa thamani 8 inahitaji tovuti 3 zilizo kimya, si 2. Kuzima kunabakiza kiwango cha chini kisichobadilika"
  th: "ปลายทางที่เงียบเพิ่มเติมที่ต้องมีต่อจำนวนโฟลว์เท่านี้ ก่อนที่ทางออกที่ยุ่งจะถูกพักด้วยหลักฐานที่อ่อน: ทางออก 24 โฟลว์ที่ค่า 8 ต้องมีเว็บไซต์ที่เงียบ 3 แห่ง ไม่ใช่ 2 ปิดเพื่อคงค่าขั้นต่ำคงที่"
  uk: "Додаткові мовчазні цілі, потрібні на кожну таку кількість потоків, перш ніж зайнятий вихід можна відправити на лаву за слабкими ознаками: вихід із 24 потоками при 8 потребує 3 мовчазних сайтів, а не 2. Вимкнення зберігає фіксований мінімум"
  vi: "Số đích im lặng bổ sung cần có cho mỗi chừng ấy luồng trước khi một điểm thoát bận có thể bị cho dự bị dựa trên bằng chứng yếu: một điểm thoát 24 luồng ở mức 8 cần 3 trang im lặng, không phải 2. Tắt sẽ giữ mức tối thiểu cố định"
  zh: "在仅凭弱证据隔离繁忙出口之前，每达到此数量的流需额外增加的静默目标数：值为 8 时，有 24 个流的出口需要 3 个静默站点，而不是 2 个。关闭时保持固定的最小值"
  zh-HK: "在只憑弱證據隔離繁忙出口之前，每達到此數量的流須額外增加的靜默目標數：值為 8 時，有 24 個流的出口需要 3 個靜默網站，而不是 2 個。關閉時保持固定的最小值"
