description: "Key screen: the screen that shows the Bittensor recovery phrase, a 12 word secret for a key this app made on the device. Shown after the user took a screenshot of the screen."
source: "If that screenshot shows your recovery phrase, delete it. Anyone with this phrase controls your SN25α."
platforms:
  - apple
localizations:
  ar: "إذا كانت لقطة الشاشة تلك تُظهر عبارة النسخ الاحتياطي الخاصة بك، فاحذف اللقطة. أي شخص لديه هذه العبارة يتحكم في SN25α الخاص بك."
  cs: "Pokud ten snímek obrazovky zobrazuje vaši obnovovací frázi, odstraňte ho. Kdokoli má tuto frázi, ovládá vaše SN25α."
  de: "Wenn dieser Screenshot deine Wiederherstellungsphrase zeigt, lösche ihn. Wer diese Phrase hat, kontrolliert dein SN25α."
  el: "Αν αυτό το στιγμιότυπο οθόνης δείχνει τη φράση επαναφοράς σας, διαγράψτε το. Όποιος έχει αυτή τη φράση ελέγχει τα SN25α σας."
  en: "If that screenshot shows your recovery phrase, delete it. Anyone with this phrase controls your SN25α."
  es: "Si esa captura de pantalla muestra tu frase de recuperación, elimina la captura. Quien tenga esta frase controla tu SN25α."
  es-419: "Si esa captura de pantalla muestra tu frase de recuperación, elimina la captura. Quien tenga esta frase controla tu SN25α."
  es-MX: "Si esa captura de pantalla muestra tu frase de recuperación, elimina la captura. Quien tenga esta frase controla tu SN25α."
  fr: "Si cette capture d’écran montre votre phrase de sauvegarde, supprimez cette capture. Toute personne qui a cette phrase contrôle vos SN25α."
  he: "אם צילום המסך הזה מציג את ביטוי השחזור שלכם, מחקו את הצילום. כל מי שיש לו את הביטוי הזה שולט ב-SN25α שלכם."
  hi: "अगर उस स्क्रीनशॉट में आपका रिकवरी फ़्रेज़ दिख रहा है, तो स्क्रीनशॉट डिलीट करें। जिसके पास भी यह फ़्रेज़ है, वह आपके SN25α को नियंत्रित करता है।"
  id: "Jika tangkapan layar itu menampilkan frasa cadangan Anda, hapus tangkapan layar tersebut. Siapa pun yang memiliki frasa ini mengendalikan SN25α Anda."
  it: "Se quello screenshot mostra la tua frase di recupero, eliminalo. Chiunque abbia questa frase controlla i tuoi SN25α."
  ja: "そのスクリーンショットに復元フレーズが写っている場合は、スクリーンショットを削除してください。このフレーズを持つ人は誰でも、あなたの SN25α をコントロールできます。"
  ko: "그 스크린샷에 복구 문구가 보이면 스크린샷을 삭제하세요. 이 문구를 가진 사람은 누구나 내 SN25α를 제어할 수 있습니다."
  nl: "Als die screenshot je herstelzin toont, verwijder de screenshot dan. Iedereen met deze zin heeft controle over je SN25α."
  pl: "Jeśli ten zrzut ekranu pokazuje twoją frazę odzyskiwania, usuń go. Każdy, kto ma tę frazę, kontroluje twoje SN25α."
  pt: "Se essa captura de ecrã mostrar a sua frase de recuperação, elimine a captura. Quem tiver esta frase controla o seu SN25α."
  pt-BR: "Se essa captura de tela mostrar sua frase de recuperação, exclua a captura. Quem tiver esta frase controla seu SN25α."
  pt-PT: "Se essa captura de ecrã mostrar a sua frase de recuperação, elimine a captura. Quem tiver esta frase controla o seu SN25α."
  ru: "Если на этом снимке экрана видна ваша фраза восстановления, удалите его. Любой, у кого есть эта фраза, контролирует ваши SN25α."
  sv: "Om skärmbilden visar din återställningsfras ska du radera skärmbilden. Alla som har den här frasen kontrollerar dina SN25α."
  sw: "Ikiwa picha hiyo ya skrini inaonyesha kifungu chako cha urejeshaji, ifute. Yeyote aliye na kifungu hiki anadhibiti SN25α yako."
  th: "หากภาพหน้าจอนั้นแสดงวลีสำรองของคุณ ให้ลบภาพหน้าจอนั้น ใครก็ตามที่มีวลีนี้จะควบคุม SN25α ของคุณได้"
  uk: "Якщо на цьому знімку екрана видно вашу фразу відновлення, видаліть його. Будь-хто, хто має цю фразу, контролює ваші SN25α."
  vi: "Nếu ảnh chụp màn hình đó hiển thị cụm từ sao lưu của bạn, hãy xóa ảnh đó. Bất kỳ ai có cụm từ này đều kiểm soát SN25α của bạn."
  zh: "如果该截图显示了您的恢复短语，请删除该截图。任何拥有此短语的人都能控制您的 SN25α。"
  zh-HK: "如果該截圖顯示了你的復原短語，請刪除該截圖。任何擁有此短語的人都能控制你的 SN25α。"
