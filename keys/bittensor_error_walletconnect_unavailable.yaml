description: "Bittensor wallet error in the apps, when the ur.io bridge page returns walletconnect_unavailable: the page has no WalletConnect project id, so it cannot pair a wallet. Manual entry still works. WalletConnect is a product name."
source: "WalletConnect is not available right now. Try again later, or enter your address manually."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
