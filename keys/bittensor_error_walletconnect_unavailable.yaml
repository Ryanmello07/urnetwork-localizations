  cs: "WalletConnect teď není k dispozici. Zkuste to později znovu, nebo zadejte adresu ručně."
  de: "WalletConnect ist gerade nicht verfügbar. Versuche es später erneut oder gib deine Adresse manuell ein."
  el: "Το WalletConnect δεν είναι διαθέσιμο αυτή τη στιγμή. Δοκιμάστε ξανά αργότερα ή εισαγάγετε τη διεύθυνσή σας χειροκίνητα."
  en: "WalletConnect is not available right now. Try again later, or enter your address manually."
  es: "WalletConnect no está disponible en este momento. Inténtalo de nuevo más tarde o introduce tu dirección manualmente."
  es-419: "WalletConnect no está disponible en este momento. Inténtalo de nuevo más tarde o ingresa tu dirección manualmente."
  es-MX: "WalletConnect no está disponible en este momento. Inténtalo de nuevo más tarde o ingresa tu dirección manualmente."
