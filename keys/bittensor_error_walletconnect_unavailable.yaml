  nl: "WalletConnect is op dit moment niet beschikbaar. Probeer het later opnieuw of voer je adres handmatig in."
  pl: "WalletConnect jest teraz niedostępny. Spróbuj ponownie później lub wprowadź adres ręcznie."
  pt: "O WalletConnect não está disponível neste momento. Tente novamente mais tarde ou introduza o seu endereço manualmente."
  pt-BR: "O WalletConnect não está disponível no momento. Tente novamente mais tarde ou digite seu endereço manualmente."
  pt-PT: "O WalletConnect não está disponível neste momento. Tente novamente mais tarde ou introduza o seu endereço manualmente."
  ru: "WalletConnect сейчас недоступен. Повторите попытку позже или введите адрес вручную."
  sv: "WalletConnect är inte tillgängligt just nu. Försök igen senare eller ange din adress manuellt."
  sw: "WalletConnect haipatikani kwa sasa. Jaribu tena baadaye, au weka anwani yako mwenyewe."
  th: "WalletConnect ไม่พร้อมใช้งานในขณะนี้ ลองอีกครั้งในภายหลัง หรือป้อนที่อยู่ของคุณด้วยตนเอง"
