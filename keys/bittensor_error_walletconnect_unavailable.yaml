  he: "WalletConnect אינו זמין כרגע. נסו שוב מאוחר יותר, או הזינו את הכתובת שלכם ידנית."
  hi: "WalletConnect अभी उपलब्ध नहीं है। बाद में फिर से प्रयास करें, या अपना पता मैन्युअल रूप से दर्ज करें।"
  id: "WalletConnect sedang tidak tersedia. Coba lagi nanti, atau masukkan alamat Anda secara manual."
  it: "WalletConnect non è disponibile al momento. Riprova più tardi oppure inserisci il tuo indirizzo manualmente."
  ja: "WalletConnect は現在利用できません。しばらくしてからもう一度お試しいただくか、アドレスを手動で入力してください。"
