description: "Update channel (Windows): a change of channel was asked for while an update installs."
source: "An update is in progress. Change the update channel when it is done."
platforms:
  - windows
localizations:
  ar: "يجري تحديث الآن. غيّر قناة التحديث بعد انتهائه."
  cs: "Probíhá aktualizace. Kanál aktualizací změňte, až skončí."
  de: "Ein Update läuft gerade. Ändere den Update-Kanal, wenn es fertig ist."
  el: "Βρίσκεται σε εξέλιξη μια ενημέρωση. Αλλάξτε το κανάλι ενημερώσεων όταν ολοκληρωθεί."
  en: "An update is in progress. Change the update channel when it is done."
  es: "Hay una actualización en curso. Cambia el canal de actualizaciones cuando termine."
  es-419: "Hay una actualización en curso. Cambia el canal de actualizaciones cuando termine."
  es-MX: "Hay una actualización en curso. Cambia el canal de actualizaciones cuando termine."
  fr: "Une mise à jour est en cours. Modifiez le canal de mise à jour une fois qu’elle est terminée."
  he: "מתבצע עדכון. שנה את ערוץ העדכונים כשהוא יסתיים."
  hi: "एक अपडेट चल रहा है। उसके पूरा होने पर अपडेट चैनल बदलें।"
  id: "Pembaruan sedang berlangsung. Ubah saluran pembaruan setelah selesai."
  it: "È in corso un aggiornamento. Cambia il canale di aggiornamento quando è terminato."
  ja: "アップデートを実行中です。完了してからアップデートチャンネルを変更してください。"
  ko: "업데이트가 진행 중입니다. 완료된 후 업데이트 채널을 변경하세요."
  nl: "Er wordt een update uitgevoerd. Wijzig het updatekanaal wanneer die klaar is."
  pl: "Trwa aktualizacja. Zmień kanał aktualizacji po jej zakończeniu."
  pt: "Há uma atualização em andamento. Altere o canal de atualização quando ela terminar."
  pt-BR: "Há uma atualização em andamento. Altere o canal de atualização quando ela terminar."
  pt-PT: "Está a decorrer uma atualização. Altere o canal de atualização quando terminar."
  ru: "Идёт обновление. Измените канал обновлений, когда оно завершится."
  sv: "En uppdatering pågår. Ändra uppdateringskanalen när den är klar."
  sw: "Sasisho linaendelea. Badilisha chaneli ya masasisho likikamilika."
  th: "กำลังอัปเดตอยู่ เปลี่ยนช่องทางการอัปเดตเมื่อเสร็จแล้ว"
  uk: "Триває оновлення. Змініть канал оновлень, коли воно завершиться."
  vi: "Đang có bản cập nhật được cài đặt. Hãy đổi kênh cập nhật khi quá trình này hoàn tất."
  zh: "正在更新。请在完成后再更改更新渠道。"
  zh-HK: "正在更新。請在完成後再更改更新頻道。"
