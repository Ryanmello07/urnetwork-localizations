description: "Windows Connect page line while connected but no provider carries traffic, with leak protection in force."
source: "No working provider right now — your traffic is blocked, not exposed. Disconnect to go back to your normal connection."
platforms:
  - windows
localizations:
  ar: "لا يوجد مزود يعمل الآن — حركة بياناتك محجوبة وليست مكشوفة. اقطع الاتصال للعودة إلى اتصالك العادي."
  cs: "Teď není k dispozici žádný funkční poskytovatel – váš provoz je zablokovaný, ne odhalený. Odpojte se, abyste se vrátili ke svému běžnému připojení."
  de: "Gerade kein funktionierender Anbieter – dein Datenverkehr ist blockiert, nicht offengelegt. Trenne die Verbindung, um zu deiner normalen Verbindung zurückzukehren."
  el: "Κανένας πάροχος δεν λειτουργεί αυτή τη στιγμή — η κίνησή σας είναι αποκλεισμένη, όχι εκτεθειμένη. Αποσυνδεθείτε για να επιστρέψετε στην κανονική σας σύνδεση."
  en: "No working provider right now — your traffic is blocked, not exposed. Disconnect to go back to your normal connection."
  es: "No hay ningún proveedor que funcione ahora mismo: tu tráfico está bloqueado, no expuesto. Desconéctate para volver a tu conexión normal."
  es-419: "No hay ningún proveedor que funcione en este momento: tu tráfico está bloqueado, no expuesto. Desconéctate para volver a tu conexión normal."
  es-MX: "No hay ningún proveedor que funcione en este momento: tu tráfico está bloqueado, no expuesto. Desconéctate para volver a tu conexión normal."
  fr: "Aucun fournisseur fonctionnel pour le moment — votre trafic est bloqué, pas exposé. Déconnectez-vous pour revenir à votre connexion habituelle."
  he: "אין כרגע ספק שעובד — התעבורה שלכם חסומה, לא חשופה. התנתקו כדי לחזור לחיבור הרגיל שלכם."
  hi: "अभी कोई काम करने वाला प्रदाता नहीं है — आपका ट्रैफ़िक अवरुद्ध है, उजागर नहीं। अपने सामान्य कनेक्शन पर लौटने के लिए डिस्कनेक्ट करें।"
  id: "Tidak ada penyedia yang berfungsi saat ini — lalu lintas Anda diblokir, bukan terbuka. Putuskan koneksi untuk kembali ke koneksi normal Anda."
  it: "Nessun provider funzionante al momento — il tuo traffico è bloccato, non esposto. Disconnettiti per tornare alla tua connessione normale."
  ja: "現在、機能しているプロバイダーがありません — 通信はブロックされており、露出していません。通常の接続に戻るには切断してください。"
  ko: "지금은 작동하는 제공업체가 없습니다 — 트래픽은 노출되지 않고 차단되어 있습니다. 평소 연결로 돌아가려면 연결을 해제하세요."
  nl: "Nu geen werkende provider – je verkeer is geblokkeerd, niet blootgesteld. Verbreek de verbinding om terug te gaan naar je normale verbinding."
  pl: "Brak działającego dostawcy — Twój ruch jest zablokowany, a nie odsłonięty. Rozłącz się, aby wrócić do zwykłego połączenia."
  pt: "Nenhum provedor funcionando agora — seu tráfego está bloqueado, não exposto. Desconecte para voltar à sua conexão normal."
  pt-BR: "Nenhum provedor funcionando agora — seu tráfego está bloqueado, não exposto. Desconecte para voltar à sua conexão normal."
  pt-PT: "Nenhum fornecedor a funcionar neste momento — o seu tráfego está bloqueado, não exposto. Desligue para voltar à sua ligação normal."
  ru: "Сейчас нет работающего провайдера — ваш трафик заблокирован, а не открыт. Отключитесь, чтобы вернуться к обычному подключению."
  sv: "Ingen fungerande leverantör just nu – din trafik är blockerad, inte exponerad. Koppla från för att gå tillbaka till din vanliga anslutning."
  sw: "Hakuna mtoa huduma anayefanya kazi sasa hivi — trafiki yako imezuiwa, haijafichuliwa. Tenganisha ili urudi kwenye muunganisho wako wa kawaida."
  th: "ขณะนี้ไม่มีผู้ให้บริการที่ใช้งานได้ — ทราฟฟิกของคุณถูกบล็อก ไม่ได้ถูกเปิดเผย ตัดการเชื่อมต่อเพื่อกลับไปใช้การเชื่อมต่อตามปกติ"
  uk: "Зараз немає робочого провайдера — ваш трафік заблоковано, а не відкрито. Відключіться, щоб повернутися до звичайного з’єднання."
  vi: "Hiện không có nhà cung cấp nào hoạt động — lưu lượng của bạn bị chặn, không bị lộ. Ngắt kết nối để quay lại kết nối thông thường."
  zh: "目前没有可用的提供商 — 你的流量已被阻断，而不是暴露。断开连接即可恢复正常网络。"
  zh-HK: "目前沒有可用的供應商 — 你的流量已被封鎖，而不是外洩。中斷連線即可回到正常網絡。"
