description: "Protocol leaderboard (Leaderboard > Protocol): own-status card, next to the trend arrow after the margin to the Top 200 line: how many positions the network moved down since the previous update (once per tempo, about every 72 minutes). {count} is the number of positions, inserted as is, so the wording must read with any number. Lowercase in English: it continues the margin line."
