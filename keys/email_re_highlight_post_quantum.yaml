description: "Re-engagement 'what changed' item. 'Post Quantum Encryption' is the switch's name in the app (keep it identical to the app's label). Sent only once the post-quantum connection fix is live."
source: "Post Quantum Encryption is in the app. Turn it on in the connection options on the Connect screen to seal your session between your device and the provider."
platforms:
  - email
localizations:
  en: "Post Quantum Encryption is in the app. Turn it on in the connection options on the Connect screen to seal your session between your device and the provider."
  ar: "«التشفير ما بعد الكمومي» متوفر في التطبيق. فعّله من خيارات الاتصال في شاشة «اربط» لتكون جلستك محكمة الإغلاق بين جهازك والمزوّد."
  cs: "Postkvantové šifrování je teď v aplikaci. Zapněte ho v možnostech připojení na obrazovce Připojit, abyste svou relaci zapečetili mezi svým zařízením a poskytovatelem."
  de: "Die „Post-Quanten-Verschlüsselung“ ist jetzt in der App. Schalte sie in den Verbindungsoptionen auf dem Bildschirm „Verbinde“ ein, um deine Sitzung zwischen deinem Gerät und dem Anbieter zu versiegeln."
  el: "Η Μετακβαντική κρυπτογράφηση είναι πλέον στην εφαρμογή. Ενεργοποίησέ την στις επιλογές σύνδεσης, στην οθόνη Σύνδεση, για να σφραγίσεις τη συνεδρία σου ανάμεσα στη συσκευή σου και τον πάροχο."
  es: "El Cifrado poscuántico está disponible en la app. Actívalo en las opciones de conexión de la pantalla Conecta para sellar tu sesión entre tu dispositivo y el proveedor."
  es-419: "El Cifrado poscuántico está disponible en la app. Actívalo en las opciones de conexión de la pantalla Conectar para sellar tu sesión entre tu dispositivo y el proveedor."
  es-MX: "El Cifrado poscuántico está disponible en la app. Actívalo en las opciones de conexión de la pantalla Conecta para sellar tu sesión entre tu dispositivo y el proveedor."
  fr: "Le Chiffrement post-quantique est disponible dans l'app. Active-le dans les options de connexion de l'écran Connecte pour sceller ta session entre ton appareil et le fournisseur."
  he: "״הצפנה פוסט-קוונטית״ זמינה באפליקציה. מפעילים אותה באפשרויות החיבור במסך ״התחבר״ כדי לאטום את הסשן בין המכשיר שלכם לספק."
  hi: "“पोस्ट-क्वांटम एन्क्रिप्शन” ऐप में उपलब्ध है। अपने डिवाइस और प्रदाता के बीच अपना सेशन सील करने के लिए इसे “कनेक्ट करें” स्क्रीन पर कनेक्शन विकल्पों में चालू करें।"
  id: "“Enkripsi pasca-kuantum” sudah ada di aplikasi. Aktifkan di opsi koneksi pada layar “Hubungkan” untuk menyegel sesimu antara perangkatmu dan penyedia."
  it: "La Crittografia post-quantistica è disponibile nell'app. Attivala nelle opzioni di connessione della schermata Connetti per sigillare la tua sessione tra il tuo dispositivo e il provider."
  ja: "アプリで「ポスト量子暗号」が使えるようになりました。「接続」画面の接続オプションでオンにすると、お使いのデバイスとプロバイダーの間でセッションが密封されます。"
  ko: "앱에서 '포스트 양자 암호화'를 쓸 수 있게 되었습니다. 연결 화면의 연결 옵션에서 켜면 기기와 제공자 사이의 세션이 봉인됩니다."
  nl: "Post-quantumversleuteling zit nu in de app. Zet die aan in de verbindingsopties op het scherm Verbinden om je sessie tussen je apparaat en de provider te verzegelen."
  pl: "Szyfrowanie postkwantowe jest już w aplikacji. Włącz je w opcjach połączenia na ekranie Połącz, aby zapieczętować sesję między twoim urządzeniem a dostawcą."
  pt: "A Encriptação pós-quântica está disponível no app. Ative-a nas opções de conexão da tela Conecte para selar sua sessão entre seu dispositivo e o provedor."
  pt-BR: "A Criptografia pós-quântica está disponível no app. Ative-a nas opções de conexão da tela Conectar para selar sua sessão entre seu dispositivo e o provedor."
  pt-PT: "A Encriptação pós-quântica está disponível na app. Ative-a nas opções de conexão do ecrã Ligar para selar a sua sessão entre o seu dispositivo e o fornecedor."
  ru: "«Постквантовое шифрование» теперь есть в приложении. Включите его в параметрах подключения на экране «Подключить», чтобы запечатать сеанс между вашим устройством и провайдером."
  sv: "Postkvantkryptering finns nu i appen. Slå på den i anslutningsalternativen på skärmen Anslut för att försegla din session mellan din enhet och leverantören."
  sw: "“Usimbaji fiche wa baada ya kwantamu” upo kwenye programu. Uwashe katika chaguo za kuunganisha kwenye skrini ya “Unganisha” ili kikao chako kifungwe kwa muhuri kati ya kifaa chako na mtoa huduma."
  th: "“การเข้ารหัสแบบโพสต์ควอนตัม” มีในแอปแล้ว เปิดใช้ได้ในตัวเลือกการเชื่อมต่อบนหน้าจอ “เชื่อมต่อ” เพื่อปิดผนึกเซสชันของคุณระหว่างอุปกรณ์ของคุณกับผู้ให้บริการ"
  uk: "«Постквантове шифрування» тепер є в застосунку. Увімкніть його в параметрах підключення на екрані «Підключитися», щоб запечатати сеанс між вашим пристроєм і провайдером."
  vi: "“Mã hóa hậu lượng tử” đã có trong ứng dụng. Hãy bật nó trong tùy chọn kết nối trên màn hình “Kết nối” để niêm phong phiên của bạn giữa thiết bị và nhà cung cấp."
  zh: "应用里已经有“后量子加密”了。在“连接”页面的连接选项中开启它，就能在你的设备和提供者之间密封你的会话。"
  zh-HK: "應用程式內已經有「後量子加密」了。在「連接」頁面的連接選項中開啟它，就能在你的裝置和提供者之間密封你的會話。"
