description: "transfer stats and split rules"
source: "Included apps take precedence: when any app is included, only included apps use the VPN and exclusions have no effect."
platforms:
  - android
  - windows
localizations:
  ar: "التطبيقات المشمولة لها الأولوية: عند تضمين أي تطبيق، تستخدم التطبيقات المشمولة فقط VPN ولا يكون للاستثناءات أي تأثير."
  cs: "Zahrnuté aplikace mají přednost: pokud je zahrnutá jakákoli aplikace, VPN používají jen zahrnuté aplikace a vyloučení nemá žádný účinek."
  de: "Eingeschlossene Apps haben Vorrang: Sobald eine App eingeschlossen ist, nutzen nur eingeschlossene Apps das VPN und Ausschlüsse haben keine Wirkung."
  el: "Οι συμπεριλαμβανόμενες εφαρμογές έχουν προτεραιότητα: αν συμπεριληφθεί έστω μία εφαρμογή, μόνο αυτές χρησιμοποιούν το VPN και οι εξαιρέσεις δεν ισχύουν."
  en: "Included apps take precedence: when any app is included, only included apps use the VPN and exclusions have no effect."
  es: "Las apps incluidas tienen prioridad: si hay alguna app incluida, solo las apps incluidas usan la VPN y las exclusiones no tienen efecto."
  es-419: "Las apps incluidas tienen prioridad: si hay alguna app incluida, solo las apps incluidas usan la VPN y las exclusiones no tienen efecto."
  es-MX: "Las apps incluidas tienen prioridad: si hay alguna app incluida, solo las apps incluidas usan la VPN y las exclusiones no tienen efecto."
  fr: "Les applications incluses ont la priorité : dès qu'une application est incluse, seules les applications incluses utilisent le VPN et les exclusions n'ont aucun effet."
  he: "לאפליקציות שנכללו יש עדיפות: כאשר אפליקציה כלשהי נכללת, רק אפליקציות שנכללו משתמשות ב-VPN ולהחרגות אין השפעה."
  hi: "शामिल ऐप्स को प्राथमिकता मिलती है: यदि कोई भी ऐप शामिल है, तो केवल शामिल ऐप्स ही VPN का उपयोग करते हैं और बाहर रखने का कोई असर नहीं होता।"
  id: "Aplikasi yang disertakan diprioritaskan: saat ada aplikasi yang disertakan, hanya aplikasi yang disertakan yang menggunakan VPN dan pengecualian tidak berlaku."
  it: "Le app incluse hanno la precedenza: quando un'app è inclusa, solo le app incluse usano la VPN e le esclusioni non hanno effetto."
  ja: "含めるアプリが優先されます。1つでもアプリを含めると、含めたアプリのみがVPNを使用し、除外は無効になります。"
  ko: "포함이 우선합니다. 앱을 하나라도 포함하면 포함된 앱만 VPN을 사용하고 제외는 적용되지 않습니다."
  nl: "Inbegrepen apps hebben voorrang: zodra er één app is inbegrepen, gebruiken alleen inbegrepen apps de VPN en hebben uitsluitingen geen effect."
  pl: "Uwzględnione aplikacje mają pierwszeństwo: jeśli jakaś aplikacja jest uwzględniona, z VPN korzystają tylko uwzględnione aplikacje, a wykluczenia nie działają."
  pt: "As aplicações incluídas têm prioridade: quando alguma aplicação é incluída, apenas as aplicações incluídas usam a VPN e as exclusões não têm efeito."
  pt-BR: "Os apps incluídos têm prioridade: quando algum app é incluído, apenas os apps incluídos usam a VPN e as exclusões não têm efeito."
  pt-PT: "As aplicações incluídas têm prioridade: quando alguma aplicação é incluída, apenas as aplicações incluídas usam a VPN e as exclusões não têm efeito."
  ru: "Включённые приложения имеют приоритет: если включено хотя бы одно приложение, VPN используют только включённые, а исключения не действуют."
  sv: "Inkluderade appar har företräde: när någon app är inkluderad använder endast inkluderade appar VPN och exkluderingar har ingen effekt."
  sw: "Programu zilizojumuishwa hupewa kipaumbele: programu yoyote ikijumuishwa, ni programu zilizojumuishwa pekee zinazotumia VPN na utengaji hauna athari."
  th: "แอปที่รวมไว้จะมาก่อนเสมอ: หากมีแอปใดถูกรวมไว้ จะมีเฉพาะแอปที่รวมไว้เท่านั้นที่ใช้ VPN และการยกเว้นจะไม่มีผล"
  uk: "Включені застосунки мають пріоритет: коли якийсь застосунок включено, лише включені застосунки використовують VPN, а виключення не діють."
  vi: "Ứng dụng được bao gồm sẽ được ưu tiên: khi có ứng dụng được bao gồm, chỉ các ứng dụng đó dùng VPN và các loại trừ không có hiệu lực."
  zh: "包含优先：只要有应用被包含，就只有已包含的应用使用 VPN，排除设置不再生效。"
  zh-HK: "已包含的應用程式優先：只要有應用程式被包含，就只有已包含的應用程式使用 VPN，排除設定不再生效。"
