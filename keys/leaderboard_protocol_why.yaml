description: "Protocol leaderboard (Leaderboard > Protocol): own-status card, why this score: how many distinct IP prefixes the network's devices provide from, and how many of those other networks provide from too (a shared prefix's credit is split between the networks on it). {prefixes} and {shared} are counts, each after its label and a colon, so the line reads with any number, 0 and 1 included. Counts only, never addresses."
source: "Distinct IP prefixes: %lld. Shared with other networks: %lld."
platforms:
  - apple
  - android
  - site
  - linux
placeholders:
  - name: prefixes
    type: int
  - name: shared
    type: int
