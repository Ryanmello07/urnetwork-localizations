description: "Protocol leaderboard (Leaderboard > Protocol): own-status card, why this score: how many distinct IP prefixes the network's devices provide from, and how many of those other networks provide from too (a shared prefix's credit is split between the networks on it). {prefixes} and {shared} are counts, inserted as is, so the wording must read with any number, 0 and 1 included. Counts only, never addresses."
source: "%lld distinct IP prefixes, %lld shared with other networks."
platforms:
  - apple
  - android
  - site
placeholders:
  - name: prefixes
    type: int
  - name: shared
    type: int
