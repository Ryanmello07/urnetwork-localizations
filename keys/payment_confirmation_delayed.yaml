description: "Shown when the post-payment confirmation poll exhausts its budget (2 minutes) without the server confirming the subscription. The payment evidence is real (store or payment sheet reported success), so say that plainly, and head off a second purchase. Android also shows it, without the \"Payment received\" title, when the 2-minute Solana Pay return-path check ends without the payment landing."
source: "Confirmation is taking longer than expected. Your plan will update automatically once it's confirmed — there's no need to buy again."
platforms:
  - android
localizations:
  ar: "يستغرق التأكيد وقتًا أطول من المتوقع. سيتم تحديث خطتك تلقائيًا بمجرد تأكيد الدفع — لا داعي للشراء مرة أخرى."
  cs: "Potvrzení trvá déle, než se čekalo. Váš tarif se aktualizuje automaticky, jakmile bude potvrzen — není třeba kupovat znovu."
  de: "Die Bestätigung dauert länger als erwartet. Dein Plan wird automatisch aktualisiert, sobald die Zahlung bestätigt ist — du musst nicht noch einmal kaufen."
  el: "Η επιβεβαίωση αργεί περισσότερο από το αναμενόμενο. Το πρόγραμμά σας θα ενημερωθεί αυτόματα μόλις επιβεβαιωθεί — δεν χρειάζεται να αγοράσετε ξανά."
  en: "Confirmation is taking longer than expected. Your plan will update automatically once it's confirmed — there's no need to buy again."
  es: "La confirmación está tardando más de lo esperado. Tu plan se actualizará automáticamente en cuanto se confirme — no hace falta volver a comprar."
  es-419: "La confirmación está tardando más de lo esperado. Tu plan se actualizará automáticamente en cuanto se confirme — no es necesario volver a comprar."
  es-MX: "La confirmación está tardando más de lo esperado. Tu plan se actualizará automáticamente en cuanto se confirme — no es necesario volver a comprar."
  fr: "La confirmation prend plus de temps que prévu. Votre forfait se mettra à jour automatiquement dès sa confirmation — inutile de racheter."
  he: "האישור לוקח יותר זמן מהצפוי. התוכנית שלכם תתעדכן אוטומטית ברגע שהוא יתקבל — אין צורך לקנות שוב."
  hi: "पुष्टि में उम्मीद से ज़्यादा समय लग रहा है। पुष्टि होते ही आपका प्लान अपने-आप अपडेट हो जाएगा — दोबारा खरीदने की ज़रूरत नहीं है।"
  id: "Konfirmasi memakan waktu lebih lama dari perkiraan. Paket Anda akan diperbarui otomatis setelah dikonfirmasi — tidak perlu membeli lagi."
  it: "La conferma sta richiedendo più tempo del previsto. Il tuo piano si aggiornerà automaticamente appena confermato — non serve acquistare di nuovo."
  ja: "確認に予想以上の時間がかかっています。確認され次第、プランは自動的に更新されます。もう一度購入する必要はありません。"
  ko: "확인이 예상보다 오래 걸리고 있습니다. 확인되는 즉시 요금제가 자동으로 업데이트됩니다. 다시 구매할 필요는 없습니다."
  nl: "De bevestiging duurt langer dan verwacht. Je abonnement wordt automatisch bijgewerkt zodra het is bevestigd — je hoeft niet opnieuw te kopen."
  pl: "Potwierdzenie trwa dłużej niż zwykle. Twój plan zaktualizuje się automatycznie, gdy tylko zostanie potwierdzony — nie musisz kupować ponownie."
  pt: "A confirmação está a demorar mais do que o esperado. O seu plano é atualizado automaticamente assim que for confirmado — não é preciso comprar de novo."
  pt-BR: "A confirmação está demorando mais que o esperado. Seu plano será atualizado automaticamente assim que for confirmado — não é preciso comprar de novo."
  pt-PT: "A confirmação está a demorar mais do que o esperado. O seu plano é atualizado automaticamente assim que for confirmado — não é preciso comprar de novo."
  ru: "Подтверждение занимает больше времени, чем ожидалось. Ваш тариф обновится автоматически, как только оплата будет подтверждена, — покупать повторно не нужно."
  sv: "Bekräftelsen tar längre tid än väntat. Ditt abonnemang uppdateras automatiskt när den är klar — du behöver inte köpa igen."
  sw: "Uthibitishaji unachukua muda mrefu kuliko ilivyotarajiwa. Mpango wako utasasishwa kiotomatiki mara utakapothibitishwa — hakuna haja ya kununua tena."
  th: "การยืนยันใช้เวลานานกว่าที่คาดไว้ แพ็กเกจของคุณจะอัปเดตโดยอัตโนมัติเมื่อได้รับการยืนยัน — ไม่ต้องซื้อซ้ำ"
  uk: "Підтвердження триває довше, ніж очікувалося. Ваш план оновиться автоматично, щойно його буде підтверджено — купувати ще раз не потрібно."
  vi: "Việc xác nhận đang lâu hơn dự kiến. Gói của bạn sẽ tự động cập nhật ngay khi được xác nhận — không cần mua lại."
  zh: "确认时间比预期要长。确认后，您的方案会自动更新，无需再次购买。"
  zh-HK: "確認時間比預期長。確認後，你的計劃會自動更新，無需再次購買。"
