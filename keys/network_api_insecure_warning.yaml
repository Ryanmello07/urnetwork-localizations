description: "Warning shown when a custom endpoint uses plain HTTP/WS instead of HTTPS/WSS."
source: "Warning: one or more custom endpoints are not using HTTPS/WSS. Traffic may be unencrypted."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "تحذير: نقطة نهاية مخصصة واحدة أو أكثر لا تستخدم HTTPS/WSS. قد تكون حركة المرور غير مشفرة."
  cs: "Upozornění: jeden nebo více vlastních koncových bodů nepoužívá HTTPS/WSS. Provoz může být nešifrovaný."
  de: "Warnung: Ein oder mehrere eigene Endpunkte verwenden kein HTTPS/WSS. Der Datenverkehr ist möglicherweise unverschlüsselt."
  el: "Προειδοποίηση: ένα ή περισσότερα προσαρμοσμένα σημεία δεν χρησιμοποιούν HTTPS/WSS. Η κίνηση μπορεί να μην είναι κρυπτογραφημένη."
  en: "Warning: one or more custom endpoints are not using HTTPS/WSS. Traffic may be unencrypted."
  es: "Advertencia: uno o más endpoints personalizados no usan HTTPS/WSS. El tráfico puede no estar cifrado."
  es-419: "Advertencia: uno o más endpoints personalizados no usan HTTPS/WSS. El tráfico puede no estar cifrado."
  es-MX: "Advertencia: uno o más endpoints personalizados no usan HTTPS/WSS. El tráfico puede no estar cifrado."
  fr: "Avertissement : un ou plusieurs points de terminaison personnalisés n'utilisent pas HTTPS/WSS. Le trafic peut être non chiffré."
  he: "אזהרה: נקודת קצה מותאמת אחת או יותר אינה משתמשת ב-HTTPS/WSS. התעבורה עלולה להיות לא מוצפנת."
  hi: "चेतावनी: एक या अधिक कस्टम एंडपॉइंट HTTPS/WSS का उपयोग नहीं कर रहे हैं। ट्रैफ़िक अनएन्क्रिप्टेड हो सकता है।"
  id: "Peringatan: satu atau beberapa endpoint kustom tidak menggunakan HTTPS/WSS. Lalu lintas mungkin tidak terenkripsi."
  it: "Avviso: uno o più endpoint personalizzati non usano HTTPS/WSS. Il traffico potrebbe non essere cifrato."
  ja: "警告: 1つ以上のカスタムエンドポイントが HTTPS/WSS を使用していません。通信が暗号化されない可能性があります。"
  ko: "경고: 하나 이상의 사용자 지정 엔드포인트가 HTTPS/WSS를 사용하지 않습니다. 트래픽이 암호화되지 않을 수 있습니다."
  nl: "Waarschuwing: een of meer aangepaste endpoints gebruiken geen HTTPS/WSS. Verkeer is mogelijk niet versleuteld."
  pl: "Ostrzeżenie: co najmniej jeden niestandardowy punkt końcowy nie używa HTTPS/WSS. Ruch może być nieszyfrowany."
  pt: "Aviso: um ou mais endpoints personalizados não usam HTTPS/WSS. O tráfego pode não estar encriptado."
  pt-BR: "Aviso: um ou mais endpoints personalizados não usam HTTPS/WSS. O tráfego pode não estar criptografado."
  pt-PT: "Aviso: um ou mais endpoints personalizados não usam HTTPS/WSS. O tráfego pode não estar encriptado."
  ru: "Внимание: один или несколько пользовательских эндпоинтов не используют HTTPS/WSS. Трафик может быть незашифрованным."
  sv: "Varning: en eller flera anpassade slutpunkter använder inte HTTPS/WSS. Trafiken kan vara okrypterad."
  sw: "Onyo: kituo kimoja au zaidi maalum hakitumii HTTPS/WSS. Trafiki inaweza kuwa haijasimbwa."
  th: "คำเตือน: ปลายทางที่กำหนดเองอย่างน้อยหนึ่งรายการไม่ได้ใช้ HTTPS/WSS การรับส่งข้อมูลอาจไม่ถูกเข้ารหัส"
  uk: "Попередження: одна або кілька користувацьких кінцевих точок не використовують HTTPS/WSS. Трафік може бути незашифрованим."
  vi: "Cảnh báo: một hoặc nhiều điểm cuối tùy chỉnh không dùng HTTPS/WSS. Lưu lượng có thể không được mã hóa."
  zh: "警告：一个或多个自定义端点未使用 HTTPS/WSS。流量可能未加密。"
  zh-HK: "警告：一個或多個自訂端點未使用 HTTPS/WSS。流量可能未加密。"
