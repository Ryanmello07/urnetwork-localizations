description: "Split rules screen on macOS, Apps section: the split tunnel extension or its proxy configuration could not be installed or started, so the listed apps still use the VPN. The Retry button follows; macOS asks the user to allow URnetwork's proxy configuration the first time. Keep VPN and macOS unchanged."
source: "These apps can't bypass the VPN right now. Retry, and allow the proxy configuration if macOS asks."
platforms:
  - apple
localizations:
  ar: "لا يمكن لهذه التطبيقات تجاوز VPN الآن. أعد المحاولة، واسمح بإعداد الوكيل إذا طلب macOS ذلك."
  cs: "Tyto aplikace teď nemohou obejít VPN. Zkuste to znovu, a pokud se macOS zeptá, povolte konfiguraci proxy."
  de: "Diese Apps können das VPN gerade nicht umgehen. Versuche es erneut und erlaube die Proxy-Konfiguration, wenn macOS danach fragt."
  el: "Αυτές οι εφαρμογές δεν μπορούν να παρακάμψουν το VPN αυτή τη στιγμή. Προσπαθήστε ξανά και επιτρέψτε τη διαμόρφωση διακομιστή μεσολάβησης, αν το ζητήσει το macOS."
  en: "These apps can't bypass the VPN right now. Retry, and allow the proxy configuration if macOS asks."
  es: "Estas apps no pueden omitir la VPN ahora mismo. Reintenta y permite la configuración de proxy si macOS lo pide."
  es-419: "Estas apps no pueden omitir la VPN en este momento. Reintenta y permite la configuración de proxy si macOS lo solicita."
  es-MX: "Estas apps no pueden omitir la VPN en este momento. Reintenta y permite la configuración de proxy si macOS lo solicita."
  fr: "Ces applications ne peuvent pas contourner le VPN pour le moment. Réessayez et autorisez la configuration de proxy si macOS le demande."
  he: "האפליקציות האלה לא יכולות לעקוף את ה-VPN כרגע. נסה שוב, ואשר את תצורת הפרוקסי אם macOS מבקש זאת."
  hi: "ये ऐप्स अभी VPN को बायपास नहीं कर सकते। पुनः प्रयास करें, और macOS पूछे तो प्रॉक्सी कॉन्फ़िगरेशन को अनुमति दें।"
  id: "Aplikasi ini belum bisa melewati VPN saat ini. Coba lagi, dan izinkan konfigurasi proxy jika macOS memintanya."
  it: "Queste app al momento non possono aggirare la VPN. Riprova e consenti la configurazione proxy se macOS lo chiede."
  ja: "現在、これらのアプリはVPNを回避できません。再試行し、macOSから求められたらプロキシ構成を許可してください。"
  ko: "지금은 이 앱들이 VPN을 우회할 수 없습니다. 다시 시도하고, macOS에서 요청하면 프록시 구성을 허용하세요."
  nl: "Deze apps kunnen de VPN nu niet omzeilen. Probeer het opnieuw en sta de proxyconfiguratie toe als macOS erom vraagt."
  pl: "Te aplikacje nie mogą teraz omijać VPN. Spróbuj ponownie i zezwól na konfigurację proxy, jeśli macOS o to poprosi."
  pt: "Esses apps não podem ignorar a VPN agora. Tente novamente e permita a configuração de proxy se o macOS pedir."
  pt-BR: "Esses apps não podem ignorar a VPN agora. Tente novamente e permita a configuração de proxy se o macOS pedir."
  pt-PT: "Estas aplicações não conseguem ignorar a VPN neste momento. Tente novamente e permita a configuração de proxy se o macOS o pedir."
  ru: "Сейчас эти приложения не могут работать в обход VPN. Повторите попытку и разрешите конфигурацию прокси, если macOS попросит."
  sv: "De här apparna kan inte gå utanför VPN:et just nu. Försök igen och tillåt proxykonfigurationen om macOS frågar."
  sw: "Programu hizi haziwezi kupita nje ya VPN kwa sasa. Jaribu tena, na uruhusu usanidi wa proksi ikiwa macOS itauliza."
  th: "ขณะนี้แอปเหล่านี้ไม่สามารถข้าม VPN ได้ ลองอีกครั้ง และอนุญาตการกำหนดค่าพร็อกซีหาก macOS ถาม"
  uk: "Зараз ці застосунки не можуть працювати в обхід VPN. Повторіть спробу й дозвольте конфігурацію проксі, якщо macOS попросить."
  vi: "Hiện các ứng dụng này không thể bỏ qua VPN. Hãy thử lại và cho phép cấu hình proxy nếu macOS yêu cầu."
  zh: "这些应用目前无法绕过 VPN。请重试，并在 macOS 询问时允许代理配置。"
  zh-HK: "這些應用程式目前無法繞過 VPN。請重試，並在 macOS 詢問時允許代理設定。"
