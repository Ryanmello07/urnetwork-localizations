description: "Developer tools screen: explanation shown when the diagnostic log detail level cannot be read."
source: "There is no device to read the log level from yet. Sign in first"
platforms:
  - android
localizations:
  ar: "لا يوجد جهاز بعد لقراءة مستوى السجل منه. سجّل الدخول أولًا"
  cs: "Zatím není žádné zařízení, ze kterého by šla úroveň logu načíst. Nejprve se přihlaste"
  de: "Es gibt noch kein Gerät, von dem der Log-Level gelesen werden kann. Melde dich zuerst an"
  el: "Δεν υπάρχει ακόμη συσκευή από την οποία να διαβαστεί το επίπεδο καταγραφής. Συνδεθείτε πρώτα"
  en: "There is no device to read the log level from yet. Sign in first"
  es: "Todavía no hay ningún dispositivo del que leer el nivel de registro. Inicia sesión primero"
  es-419: "Todavía no hay ningún dispositivo del cual leer el nivel de registro. Inicia sesión primero"
  es-MX: "Todavía no hay ningún dispositivo del cual leer el nivel de registro. Inicia sesión primero"
  fr: "Il n’y a pas encore d’appareil sur lequel lire le niveau de journal. Connectez-vous d’abord"
  he: "עדיין אין מכשיר שממנו אפשר לקרוא את רמת הלוג. התחברו קודם"
  hi: "लॉग स्तर पढ़ने के लिए अभी कोई डिवाइस नहीं है। पहले साइन इन करें"
  id: "Belum ada perangkat untuk membaca tingkat log. Masuk terlebih dahulu"
