  pt-BR: "Ainda não há nenhum dispositivo do qual ler o nível de log. Entre primeiro"
  pt-PT: "Ainda não há nenhum dispositivo de onde ler o nível de log. Inicie sessão primeiro"
  ru: "Пока нет устройства, с которого можно прочитать уровень логирования. Сначала войдите"
