description: "Settings, kill switch: Disconnect always restores the internet; the switch only covers drops the user did not ask for."
source: "Pressing Disconnect always restores your internet straight away. The kill switch only applies to drops you did not ask for - a tunnel that stops carrying traffic, a network change, or the URnetwork service stopping."
platforms:
  - linux
localizations:
  ar: "الضغط على قطع الاتصال يعيد الإنترنت فورًا دائمًا. لا ينطبق مفتاح القتل إلا على الانقطاعات التي لم تطلبها - نفق توقف عن نقل البيانات، أو تغيّر في الشبكة، أو توقف خدمة URnetwork."
  cs: "Stisknutí Odpojit vždy okamžitě obnoví internet. Kill switch se týká jen výpadků, o které jste nepožádali - tunelu, který přestal přenášet provoz, změny sítě nebo zastavení služby URnetwork."
  de: "Trennen stellt das Internet immer sofort wieder her. Der Kill switch greift nur bei Abbrüchen, die du nicht angefordert hast - ein Tunnel, der keinen Verkehr mehr trägt, ein Netzwerkwechsel oder das Anhalten des URnetwork-Dienstes."
  el: "Το πάτημα της Αποσύνδεσης επαναφέρει πάντα αμέσως το διαδίκτυο. Το Kill switch ισχύει μόνο για διακοπές που δεν ζητήσατε - μια σήραγγα που σταματά να μεταφέρει κίνηση, μια αλλαγή δικτύου ή τη διακοπή της υπηρεσίας URnetwork."
  en: "Pressing Disconnect always restores your internet straight away. The kill switch only applies to drops you did not ask for - a tunnel that stops carrying traffic, a network change, or the URnetwork service stopping."
  es: "Pulsar Desconectar siempre restablece internet al instante. El Kill switch solo actúa ante caídas que no pediste - un túnel que deja de transportar tráfico, un cambio de red o la detención del servicio de URnetwork."
  es-419: "Presionar Desconectar siempre restablece internet al instante. El Kill switch solo actúa ante caídas que no pediste - un túnel que deja de transportar tráfico, un cambio de red o la detención del servicio de URnetwork."
  es-MX: "Pulsar Desconectar siempre restablece internet al instante. El Kill switch solo actúa ante caídas que no pediste - un túnel que deja de transportar tráfico, un cambio de red o la detención del servicio de URnetwork."
  fr: "Appuyer sur Déconnecter rétablit toujours Internet immédiatement. Le Kill switch ne s’applique qu’aux coupures que vous n’avez pas demandées - un tunnel qui cesse d’acheminer le trafic, un changement de réseau ou l’arrêt du service URnetwork."
  he: "לחיצה על התנתק תמיד משחזרת את האינטרנט מיד. הקיל סוויץ' חל רק על ניתוקים שלא ביקשתם - מנהרה שהפסיקה להעביר תעבורה, שינוי רשת או עצירת שירות URnetwork."
  hi: "डिस्कनेक्ट दबाने से इंटरनेट हमेशा तुरंत बहाल हो जाता है। किल स्विच केवल उन रुकावटों पर लागू होता है जो आपने नहीं माँगीं - ऐसी टनल जो ट्रैफ़िक ले जाना बंद कर दे, नेटवर्क में बदलाव, या URnetwork सेवा का रुक जाना।"
  id: "Menekan Putuskan selalu memulihkan internet seketika. Kill switch hanya berlaku untuk putusnya koneksi yang tidak Anda minta - terowongan yang berhenti membawa lalu lintas, perubahan jaringan, atau layanan URnetwork yang berhenti."
  it: "Premere Disconnetti ripristina sempre subito Internet. Il Kill switch riguarda solo le interruzioni che non hai chiesto - un tunnel che smette di trasportare traffico, un cambio di rete o l’arresto del servizio URnetwork."
  ja: "切断を押すと、いつでもすぐにインターネットが復旧します。キルスイッチが働くのは意図しない切断だけです - 通信を運ばなくなったトンネル、ネットワークの切り替え、URnetwork サービスの停止など。"
  ko: "연결 해제를 누르면 언제나 즉시 인터넷이 복구됩니다. 킬 스위치는 요청하지 않은 끊김에만 적용됩니다 - 트래픽을 더 이상 전달하지 않는 터널, 네트워크 변경, URnetwork 서비스 중단 등."
  nl: "Op Verbinding verbreken drukken herstelt het internet altijd meteen. De Kill switch geldt alleen voor onderbrekingen waar je niet om vroeg - een tunnel die geen verkeer meer vervoert, een netwerkwissel of het stoppen van de URnetwork-dienst."
  pl: "Naciśnięcie Rozłącz zawsze natychmiast przywraca internet. Kill switch dotyczy tylko zerwań, o które nie prosiłeś - tunelu, który przestał przenosić ruch, zmiany sieci lub zatrzymania usługi URnetwork."
  pt: "Tocar em Desconectar sempre restaura a internet na hora. O Kill switch só vale para quedas que você não pediu - um túnel que para de transportar tráfego, uma troca de rede ou a parada do serviço URnetwork."
  pt-BR: "Tocar em Desconectar sempre restaura a internet na hora. O Kill switch só vale para quedas que você não pediu - um túnel que para de transportar tráfego, uma troca de rede ou a parada do serviço URnetwork."
  pt-PT: "Premir Desligar repõe sempre a internet de imediato. O Kill switch só se aplica a quebras que não pediu - um túnel que deixa de transportar tráfego, uma mudança de rede ou a paragem do serviço URnetwork."
  ru: "Нажатие «Отключить» всегда сразу возвращает интернет. Kill switch касается только обрывов, которых вы не запрашивали - туннель перестал передавать трафик, сменилась сеть или остановилась служба URnetwork."
  sv: "Att trycka på Koppla från återställer alltid internet direkt. Kill switch gäller bara avbrott du inte bett om - en tunnel som slutar bära trafik, ett nätverksbyte eller att URnetwork-tjänsten stannar."
  sw: "Kubonyeza Tenganisha hurejesha intaneti mara moja kila wakati. Kill switch hutumika tu kwa kukatika ambako hukuomba - handaki linaloacha kubeba trafiki, mabadiliko ya mtandao, au huduma ya URnetwork kusimama."
  th: "การกดตัดการเชื่อมต่อจะคืนอินเทอร์เน็ตทันทีเสมอ สวิตช์หยุดการเชื่อมต่อจะทำงานเฉพาะกับการหลุดที่คุณไม่ได้สั่ง - อุโมงค์ที่หยุดรับส่งทราฟฟิก การเปลี่ยนเครือข่าย หรือบริการ URnetwork ที่หยุดทำงาน"
  uk: "Натискання «Відключитися» завжди одразу повертає інтернет. Kill switch стосується лише обривів, яких ви не просили - тунель перестав передавати трафік, змінилася мережа або зупинилася служба URnetwork."
  vi: "Nhấn Ngắt kết nối luôn khôi phục internet ngay lập tức. Kill switch chỉ áp dụng cho những lần rớt mà bạn không yêu cầu - đường hầm ngừng truyền lưu lượng, thay đổi mạng, hoặc dịch vụ URnetwork dừng lại."
  zh: "按下断开连接总会立即恢复互联网。断网保护仅针对非你所愿的断开 - 隧道停止传输流量、网络切换，或 URnetwork 服务停止。"
  zh-HK: "按下斷開連接一律會立即恢復互聯網。斷線開關 (Kill switch) 只針對非你所願的中斷 - 隧道停止傳輸流量、網絡切換，或 URnetwork 服務停止。"
