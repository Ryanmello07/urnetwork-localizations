description: "Windows and Linux Connect page reason line when connecting failed."
source: "No providers could be reached. Retry rebuilds the connection from scratch."
platforms:
  - windows
  - linux
localizations:
  ar: "تعذّر الوصول إلى أي مزود. تعيد المحاولة بناء الاتصال من البداية."
  cs: "Nepodařilo se spojit s žádným poskytovatelem. Opakování sestaví připojení znovu od začátku."
  de: "Kein Anbieter war erreichbar. Ein neuer Versuch baut die Verbindung von Grund auf neu auf."
  el: "Δεν ήταν δυνατή η επικοινωνία με κανέναν πάροχο. Η επανάληψη ξαναχτίζει τη σύνδεση από την αρχή."
  en: "No providers could be reached. Retry rebuilds the connection from scratch."
  es: "No se pudo contactar con ningún proveedor. Reintentar reconstruye la conexión desde cero."
  es-419: "No se pudo contactar a ningún proveedor. Reintentar reconstruye la conexión desde cero."
  es-MX: "No se pudo contactar a ningún proveedor. Reintentar reconstruye la conexión desde cero."
  fr: "Aucun fournisseur n’a pu être joint. Réessayer reconstruit la connexion depuis le début."
  he: "לא ניתן היה להגיע לאף ספק. ניסיון חוזר בונה את החיבור מחדש מאפס."
  hi: "किसी भी प्रदाता तक नहीं पहुँचा जा सका। दोबारा कोशिश करने पर कनेक्शन शुरू से फिर बनता है।"
  id: "Tidak ada penyedia yang dapat dijangkau. Mencoba lagi akan membangun koneksi dari awal."
  it: "Non è stato possibile raggiungere alcun provider. Riprovare ricostruisce la connessione da zero."
  ja: "どのプロバイダーにも接続できませんでした。再試行すると接続を最初から作り直します。"
  ko: "어떤 제공업체에도 연결할 수 없었습니다. 다시 시도하면 연결을 처음부터 다시 구성합니다."
  nl: "Er was geen provider bereikbaar. Opnieuw proberen bouwt de verbinding helemaal opnieuw op."
  pl: "Nie udało się połączyć z żadnym dostawcą. Ponowna próba buduje połączenie od zera."
  pt: "Nenhum provedor pôde ser alcançado. Tentar novamente reconstrói a conexão do zero."
  pt-BR: "Nenhum provedor pôde ser alcançado. Tentar novamente reconstrói a conexão do zero."
  pt-PT: "Não foi possível contactar nenhum fornecedor. Tentar novamente reconstrói a ligação de raiz."
  ru: "Не удалось связаться ни с одним провайдером. Повторная попытка заново выстраивает соединение с нуля."
  sv: "Inga leverantörer gick att nå. Ett nytt försök bygger upp anslutningen från början."
  sw: "Hakuna mtoa huduma aliyefikiwa. Kujaribu tena hujenga muunganisho upya kuanzia mwanzo."
  th: "ติดต่อผู้ให้บริการรายใดไม่ได้เลย การลองอีกครั้งจะสร้างการเชื่อมต่อใหม่ตั้งแต่ต้น"
  uk: "Не вдалося зв’язатися з жодним провайдером. Повторна спроба вибудовує з’єднання з нуля."
  vi: "Không thể kết nối tới nhà cung cấp nào. Thử lại sẽ dựng lại kết nối từ đầu."
  zh: "无法连接到任何提供商。重试会从头重建连接。"
  zh-HK: "無法連接任何供應商。重試會從頭重建連線。"
