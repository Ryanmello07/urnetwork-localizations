description: "Developer page: note when the daemon restarted and the log began again."
source: "The daemon restarted. This is a new log; the previous run's lines are gone."
platforms:
  - linux
localizations:
  ar: "أُعيد تشغيل الخدمة. هذا سجل جديد؛ أسطر التشغيل السابق لم تعد موجودة."
  cs: "Služba se restartovala. Toto je nový log; řádky předchozího běhu jsou pryč."
  de: "Der Dienst wurde neu gestartet. Dies ist ein neues Log; die Zeilen des vorherigen Laufs sind weg."
  el: "Η υπηρεσία επανεκκινήθηκε. Αυτό είναι νέο αρχείο καταγραφής· οι γραμμές της προηγούμενης εκτέλεσης χάθηκαν."
  en: "The daemon restarted. This is a new log; the previous run's lines are gone."
  es: "El servicio se reinició. Este es un registro nuevo; las líneas de la ejecución anterior ya no están."
  es-419: "El servicio se reinició. Este es un registro nuevo; las líneas de la ejecución anterior ya no están."
  es-MX: "El servicio se reinició. Este es un registro nuevo; las líneas de la ejecución anterior ya no están."
  fr: "Le service a redémarré. Ceci est un nouveau journal ; les lignes de l’exécution précédente ont disparu."
  he: "השירות הופעל מחדש. זה לוג חדש; השורות של ההרצה הקודמת כבר אינן."
  hi: "सेवा फिर से शुरू हुई। यह नया लॉग है; पिछले रन की पंक्तियाँ अब नहीं हैं।"
  id: "Layanan dimulai ulang. Ini log baru; baris dari jalannya sebelumnya sudah hilang."
  it: "Il servizio si è riavviato. Questo è un nuovo log; le righe dell’esecuzione precedente non ci sono più."
  ja: "サービスが再起動しました。これは新しいログで、前回の実行の行は残っていません。"
  ko: "서비스가 다시 시작되었습니다. 새 로그이며, 이전 실행의 줄은 없어졌습니다."
  nl: "De dienst is opnieuw gestart. Dit is een nieuwe log; de regels van de vorige run zijn weg."
  pl: "Usługa została uruchomiona ponownie. To nowy log; wierszy z poprzedniego uruchomienia już nie ma."
  pt: "O serviço reiniciou. Este é um log novo; as linhas da execução anterior desapareceram."
  pt-BR: "O serviço reiniciou. Este é um log novo; as linhas da execução anterior sumiram."
  pt-PT: "O serviço reiniciou. Este é um log novo; as linhas da execução anterior desapareceram."
  ru: "Служба перезапустилась. Это новый лог; строк предыдущего запуска больше нет."
  sv: "Tjänsten startade om. Det här är en ny logg; raderna från den förra körningen är borta."
  sw: "Huduma imeanzishwa upya. Hii ni kumbukumbu mpya; mistari ya uendeshaji uliopita imetoweka."
  th: "บริการเริ่มทำงานใหม่ นี่คือล็อกใหม่ บรรทัดจากการทำงานครั้งก่อนหายไปแล้ว"
  uk: "Службу перезапущено. Це новий лог; рядків попереднього запуску більше немає."
  vi: "Dịch vụ đã khởi động lại. Đây là nhật ký mới; các dòng của lần chạy trước đã mất."
  zh: "服务已重启。这是一个新日志；上一次运行的行已不存在。"
  zh-HK: "服務已重新啟動。這是新的日誌；上一次執行的行已不存在。"
