description: "Shown in the upgrade sheet and intro funnel when the App Store product fetch failed, with a retry action — replaces the eternal spinner (Shared/Views/UpgradeSubscriptionSheet.swift, Shared/Views/Introduction/IntroductionView.swift)."
source: "Couldn't load subscription options. Check your connection and retry."
platforms:
  - apple
localizations:
  ar: "تعذّر تحميل خيارات الاشتراك. تحقق من اتصالك وأعد المحاولة."
  cs: "Možnosti předplatného se nepodařilo načíst. Zkontrolujte připojení a zkuste to znovu."
  de: "Die Abo-Optionen konnten nicht geladen werden. Überprüfe deine Verbindung und versuche es erneut."
  el: "Δεν ήταν δυνατή η φόρτωση των επιλογών συνδρομής. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά."
  en: "Couldn't load subscription options. Check your connection and retry."
  es: "No se pudieron cargar las opciones de suscripción. Revisa tu conexión y vuelve a intentarlo."
  es-419: "No se pudieron cargar las opciones de suscripción. Revisa tu conexión y vuelve a intentarlo."
  es-MX: "No se pudieron cargar las opciones de suscripción. Revisa tu conexión y vuelve a intentarlo."
  fr: "Impossible de charger les options d’abonnement. Vérifiez votre connexion et réessayez."
  he: "לא ניתן היה לטעון את אפשרויות המינוי. בדקו את החיבור ונסו שוב."
  hi: "सदस्यता विकल्प लोड नहीं हो सके। अपना कनेक्शन जाँचें और दोबारा कोशिश करें।"
  id: "Tidak dapat memuat opsi langganan. Periksa koneksi Anda dan coba lagi."
  it: "Impossibile caricare le opzioni di abbonamento. Controlla la connessione e riprova."
  ja: "サブスクリプションのオプションを読み込めませんでした。接続を確認してもう一度お試しください。"
  ko: "구독 옵션을 불러올 수 없습니다. 연결을 확인한 후 다시 시도하세요."
  nl: "Abonnementsopties konden niet worden geladen. Controleer je verbinding en probeer het opnieuw."
  pl: "Nie udało się wczytać opcji subskrypcji. Sprawdź połączenie i spróbuj ponownie."
  pt: "Não foi possível carregar as opções de assinatura. Verifique a sua ligação e tente novamente."
  pt-BR: "Não foi possível carregar as opções de assinatura. Verifique sua conexão e tente novamente."
  pt-PT: "Não foi possível carregar as opções de assinatura. Verifique a sua ligação e tente novamente."
  ru: "Не удалось загрузить варианты подписки. Проверьте подключение и повторите попытку."
  sv: "Det gick inte att läsa in prenumerationsalternativen. Kontrollera din anslutning och försök igen."
  sw: "Imeshindwa kupakia chaguo za usajili. Kagua muunganisho wako kisha ujaribu tena."
  th: "โหลดตัวเลือกการสมัครสมาชิกไม่ได้ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง"
  uk: "Не вдалося завантажити варіанти підписки. Перевірте з’єднання і спробуйте ще раз."
  vi: "Không thể tải các tùy chọn gói đăng ký. Hãy kiểm tra kết nối và thử lại."
  zh: "无法加载订阅选项。请检查网络连接后重试。"
  zh-HK: "無法載入訂閱選項。請檢查網絡連線後再試。"
