description: "How to add a desktop widget on macOS."
source: "Open the widget gallery from Notification Center, search URnetwork, and drag a widget to the desktop."
platforms:
  - apple
localizations:
  ar: "افتح معرض الأدوات من مركز الإشعارات، وابحث عن URnetwork، واسحب أداة إلى سطح المكتب."
  cs: "Otevřete galerii widgetů z Oznamovacího centra, vyhledejte URnetwork a přetáhněte widget na plochu."
  de: "Öffne die Widget-Galerie über die Mitteilungszentrale, suche nach URnetwork und ziehe ein Widget auf den Schreibtisch."
  el: "Ανοίξτε τη συλλογή γραφικών στοιχείων από το Κέντρο γνωστοποιήσεων, αναζητήστε το URnetwork και σύρετε ένα γραφικό στοιχείο στο γραφείο."
  en: "Open the widget gallery from Notification Center, search URnetwork, and drag a widget to the desktop."
  es: "Abre la galería de widgets desde el Centro de notificaciones, busca URnetwork y arrastra un widget al escritorio."
  es-419: "Abre la galería de widgets desde el Centro de notificaciones, busca URnetwork y arrastra un widget al escritorio."
  es-MX: "Abre la galería de widgets desde el Centro de notificaciones, busca URnetwork y arrastra un widget al escritorio."
  fr: "Ouvrez la galerie de widgets depuis le Centre de notifications, recherchez URnetwork et faites glisser un widget sur le bureau."
  he: "פתחו את גלריית הווידג׳טים ממרכז העדכונים, חפשו URnetwork וגררו ווידג׳ט לשולחן העבודה."
  hi: "नोटिफ़िकेशन सेंटर से विजेट गैलरी खोलें, URnetwork खोजें, और एक विजेट को डेस्कटॉप पर खींचें।"
  id: "Buka galeri widget dari Pusat Pemberitahuan, cari URnetwork, dan seret widget ke desktop."
  it: "Apri la galleria dei widget dal Centro Notifiche, cerca URnetwork e trascina un widget sulla scrivania."
  ja: "通知センターからウィジェットギャラリーを開き、URnetwork を検索して、ウィジェットをデスクトップにドラッグします。"
  ko: "알림 센터에서 위젯 갤러리를 열고 URnetwork를 검색한 다음 위젯을 데스크탑으로 끌어다 놓으세요."
  nl: "Open de widgetgalerie vanuit het Berichtencentrum, zoek URnetwork en sleep een widget naar het bureaublad."
  pl: "Otwórz galerię widżetów z centrum powiadomień, wyszukaj URnetwork i przeciągnij widżet na biurko."
  pt: "Abra a galeria de widgets na Central de notificações, pesquise URnetwork e arraste um widget para a secretária."
  pt-BR: "Abra a galeria de widgets na Central de Notificações, busque URnetwork e arraste um widget para a mesa."
  pt-PT: "Abra a galeria de widgets na Central de notificações, pesquise URnetwork e arraste um widget para a secretária."
  ru: "Откройте галерею виджетов из Центра уведомлений, найдите URnetwork и перетащите виджет на рабочий стол."
  sv: "Öppna widgetgalleriet från Notiscenter, sök efter URnetwork och dra en widget till skrivbordet."
  sw: "Fungua matunzio ya wijeti kutoka kwenye Kituo cha Arifa, tafuta URnetwork, na uburute wijeti hadi kwenye eneo-kazi."
  th: "เปิดคลังวิดเจ็ตจากศูนย์การแจ้งเตือน ค้นหา URnetwork แล้วลากวิดเจ็ตไปที่เดสก์ท็อป"
  uk: "Відкрийте галерею віджетів із Центру сповіщень, знайдіть URnetwork і перетягніть віджет на робочий стіл."
  vi: "Mở thư viện tiện ích từ Trung tâm thông báo, tìm URnetwork và kéo một tiện ích ra màn hình nền."
  zh: "从通知中心打开小组件库，搜索 URnetwork，然后将小组件拖到桌面。"
  zh-HK: "從通知中心開啟小工具庫，搜尋 URnetwork，然後將小工具拖到桌面。"
