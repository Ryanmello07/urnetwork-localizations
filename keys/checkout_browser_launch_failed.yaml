  cs: "Nepodařilo se otevřít prohlížeč. Zkopírujte tento odkaz do prohlížeče a dokončete platbu:"
  de: "Wir konnten deinen Browser nicht öffnen. Kopiere diesen Link in einen Browser, um den Kauf abzuschließen:"
  el: "Δεν μπορέσαμε να ανοίξουμε το πρόγραμμα περιήγησης. Αντιγράψτε αυτόν τον σύνδεσμο σε ένα πρόγραμμα περιήγησης για να ολοκληρώσετε την πληρωμή:"
  en: "We couldn't open your browser. Copy this link into a browser to finish checkout:"
  es: "No pudimos abrir tu navegador. Copia este enlace en un navegador para completar el pago:"
  es-419: "No pudimos abrir tu navegador. Copia este enlace en un navegador para completar el pago:"
