description: "Upgrade sheet: the system browser could not be opened for the hosted checkout url. The app appends the url itself on the next line (selectable) so the user can copy it into a browser by hand — never advancing to the waiting page with no payment page open."
source: "We couldn't open your browser. Copy this link into a browser to finish checkout:"
platforms:
  - windows
localizations:
