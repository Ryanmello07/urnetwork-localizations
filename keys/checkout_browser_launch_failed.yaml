  pt-BR: "Não conseguimos abrir seu navegador. Copie este link em um navegador para concluir o pagamento:"
  pt-PT: "Não conseguimos abrir o seu navegador. Copie esta ligação para um navegador para concluir o pagamento:"
  ru: "Не удалось открыть браузер. Скопируйте эту ссылку в браузер, чтобы завершить оплату:"
