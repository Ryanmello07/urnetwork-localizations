  hi: "हम आपका ब्राउज़र नहीं खोल सके। चेकआउट पूरा करने के लिए यह लिंक किसी ब्राउज़र में कॉपी करें:"
  id: "Kami tidak dapat membuka browser Anda. Salin tautan ini ke browser untuk menyelesaikan pembayaran:"
  it: "Non siamo riusciti ad aprire il browser. Copia questo link in un browser per completare il pagamento:"
