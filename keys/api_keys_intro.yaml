description: "API keys screen (Account > API keys): the explanation at the top of the screen. It must keep both points: a key lets the user's own tools and scripts use the account through the API, and anyone who has a key has full access to the account until the key is deleted."
source: "API keys let your own tools and scripts use your URnetwork account through the API. Anyone with a key has full access to your account until you delete it."
platforms:
  - apple
  - android
  - site
  - linux
localizations:
  ar: "تتيح مفاتيح API لأدواتك ونصوصك البرمجية الخاصة استخدام حسابك على URnetwork من خلال API. يحصل أي شخص لديه مفتاح على وصول كامل إلى حسابك إلى أن تحذفه."
  cs: "Klíče API umožňují vašim vlastním nástrojům a skriptům používat váš účet URnetwork přes API. Kdokoli, kdo má klíč, má k vašemu účtu plný přístup, dokud ho neodstraníte."
  de: "Mit API-Schlüsseln können deine eigenen Tools und Skripte dein URnetwork-Konto über die API nutzen. Wer einen Schlüssel hat, hat vollen Zugriff auf dein Konto, bis du ihn löschst."
  el: "Τα κλειδιά API επιτρέπουν στα δικά σας εργαλεία και scripts να χρησιμοποιούν τον λογαριασμό σας στο URnetwork μέσω του API. Όποιος έχει ένα κλειδί έχει πλήρη πρόσβαση στον λογαριασμό σας μέχρι να το διαγράψετε."
  en: "API keys let your own tools and scripts use your URnetwork account through the API. Anyone with a key has full access to your account until you delete it."
  es: "Las claves de API permiten que tus propias herramientas y scripts usen tu cuenta de URnetwork a través de la API. Cualquiera que tenga una clave tiene acceso completo a tu cuenta hasta que la elimines."
  es-419: "Las claves de API permiten que tus propias herramientas y scripts usen tu cuenta de URnetwork a través de la API. Cualquiera que tenga una clave tiene acceso completo a tu cuenta hasta que la elimines."
  es-MX: "Las claves de API permiten que tus propias herramientas y scripts usen tu cuenta de URnetwork a través de la API. Cualquiera que tenga una clave tiene acceso completo a tu cuenta hasta que la elimines."
  fr: "Les clés API permettent à vos propres outils et scripts d’utiliser votre compte URnetwork via l’API. Toute personne qui dispose d’une clé a un accès complet à votre compte jusqu’à ce que vous la supprimiez."
  he: "מפתחות API מאפשרים לכלים ולסקריפטים שלכם להשתמש בחשבון URnetwork שלכם דרך ה-API. לכל מי שיש מפתח יש גישה מלאה לחשבון שלכם, עד שתמחקו אותו."
  hi: "API कुंजियों की मदद से आपके अपने टूल और स्क्रिप्ट API के ज़रिए आपके URnetwork खाते का उपयोग कर सकते हैं। जिसके पास भी कुंजी हो, उसे आपके खाते की पूरी पहुँच मिलती है, जब तक आप उसे डिलीट नहीं कर देते।"
  id: "Kunci API memungkinkan alat dan skrip Anda sendiri menggunakan akun URnetwork Anda melalui API. Siapa pun yang memiliki kunci mendapatkan akses penuh ke akun Anda hingga Anda menghapusnya."
  it: "Le chiavi API consentono ai tuoi strumenti e script di usare il tuo account URnetwork tramite l’API. Chiunque abbia una chiave ha accesso completo al tuo account finché non la elimini."
  ja: "APIキーを使うと、自分のツールやスクリプトから API 経由で URnetwork アカウントを利用できます。キーを持っている人は誰でも、キーを削除するまでアカウントにフルアクセスできます。"
  ko: "API 키를 사용하면 직접 만든 도구와 스크립트에서 API를 통해 URnetwork 계정을 사용할 수 있습니다. 키를 가진 사람은 누구나 키를 삭제할 때까지 계정에 대한 전체 액세스 권한을 갖습니다."
  nl: "Met API-sleutels kunnen je eigen tools en scripts je URnetwork-account gebruiken via de API. Iedereen met een sleutel heeft volledige toegang tot je account totdat je de sleutel verwijdert."
  pl: "Klucze API pozwalają Twoim własnym narzędziom i skryptom korzystać z Twojego konta URnetwork przez API. Każdy, kto ma klucz, ma pełny dostęp do Twojego konta, dopóki go nie usuniesz."
  pt: "As chaves de API permitem que as suas próprias ferramentas e scripts utilizem a sua conta URnetwork através da API. Qualquer pessoa com uma chave tem acesso total à sua conta até a eliminar."
  pt-BR: "As chaves de API permitem que suas próprias ferramentas e scripts usem sua conta URnetwork pela API. Qualquer pessoa com uma chave tem acesso total à sua conta até que você a exclua."
  pt-PT: "As chaves de API permitem que as suas próprias ferramentas e scripts utilizem a sua conta URnetwork através da API. Qualquer pessoa com uma chave tem acesso total à sua conta até a eliminar."
  ru: "API-ключи позволяют вашим собственным инструментам и скриптам использовать ваш аккаунт URnetwork через API. Любой, у кого есть ключ, получает полный доступ к вашему аккаунту, пока вы не удалите этот ключ."
  sv: "Med API-nycklar kan dina egna verktyg och skript använda ditt URnetwork-konto via API:et. Alla som har en nyckel har full åtkomst till ditt konto tills du raderar den."
  sw: "Funguo za API huruhusu zana na skripti zako mwenyewe kutumia akaunti yako ya URnetwork kupitia API. Mtu yeyote aliye na ufunguo ana ufikiaji kamili wa akaunti yako hadi utakapoufuta."
  th: "คีย์ API ช่วยให้เครื่องมือและสคริปต์ของคุณเองใช้บัญชี URnetwork ของคุณผ่าน API ได้ ทุกคนที่มีคีย์จะเข้าถึงบัญชีของคุณได้อย่างเต็มที่จนกว่าคุณจะลบคีย์นั้น"
  uk: "Ключі API дають змогу вашим власним інструментам і скриптам користуватися вашим обліковим записом URnetwork через API. Будь-хто, хто має ключ, має повний доступ до вашого облікового запису, доки ви не видалите цей ключ."
  vi: "Khóa API cho phép các công cụ và tập lệnh của riêng bạn sử dụng tài khoản URnetwork của bạn thông qua API. Bất kỳ ai có khóa đều có toàn quyền truy cập vào tài khoản của bạn cho đến khi bạn xóa khóa đó."
  zh: "API 密钥可让您自己的工具和脚本通过 API 使用您的 URnetwork 账户。任何持有密钥的人都能完全访问您的账户，直到您将其删除。"
  zh-HK: "API 金鑰可讓你自己的工具和指令碼透過 API 使用你的 URnetwork 帳戶。任何持有金鑰的人都可以完全存取你的帳戶，直至你將其刪除。"
