description: "Re-engagement email N1 (trust): line before the button to the threat model page."
source: "Our threat model spells out what we can see, what we can't, and what still rests on trusting us."
platforms:
  - email
localizations:
  en: "Our threat model spells out what we can see, what we can't, and what still rests on trusting us."
  ar: "يوضّح نموذج التهديدات الخاص بنا ما يمكننا رؤيته، وما لا يمكننا رؤيته، وما لا يزال قائماً على الثقة بنا."
  cs: "Náš model hrozeb přesně popisuje, co vidět můžeme, co ne a co pořád stojí na tom, že nám věříte."
  de: "Unser Bedrohungsmodell legt genau dar, was wir sehen können, was nicht und was weiterhin darauf beruht, dass du uns vertraust."
  el: "Το μοντέλο απειλών μας εξηγεί αναλυτικά τι μπορούμε να δούμε, τι όχι, και τι εξακολουθεί να βασίζεται στην εμπιστοσύνη σε εμάς."
  es: "Nuestro modelo de amenazas explica con detalle qué podemos ver, qué no podemos ver y qué sigue dependiendo de que confíes en nosotros."
  es-419: "Nuestro modelo de amenazas explica con detalle qué podemos ver, qué no podemos ver y qué sigue dependiendo de que confíes en nosotros."
  es-MX: "Nuestro modelo de amenazas explica con detalle qué podemos ver, qué no podemos ver y qué sigue dependiendo de que confíes en nosotros."
  fr: "Notre modèle de menaces détaille ce que nous pouvons voir, ce que nous ne pouvons pas voir, et ce qui repose encore sur la confiance que tu nous accordes."
  he: "מודל האיומים שלנו מפרט מה אנחנו יכולים לראות, מה לא, ומה עדיין תלוי באמון בנו."
  hi: "हमारा थ्रेट मॉडल साफ़-साफ़ बताता है कि हम क्या देख सकते हैं, क्या नहीं, और किन बातों के लिए अब भी हम पर भरोसा करना पड़ता है।"
  id: "Model ancaman kami menjabarkan apa yang bisa kami lihat, apa yang tidak, dan apa yang masih bergantung pada kepercayaan kepada kami."
  it: "Il nostro modello delle minacce spiega nel dettaglio cosa possiamo vedere, cosa non possiamo vedere e cosa dipende ancora dalla fiducia che riponi in noi."
  ja: "私たちの脅威モデルには、私たちに見えるもの、見えないもの、そしてまだ私たちを信頼していただく必要がある部分が、はっきり書かれています。"
  ko: "저희 위협 모델에는 저희가 볼 수 있는 것, 볼 수 없는 것, 그리고 아직 저희를 믿으셔야 하는 부분이 분명히 적혀 있습니다."
  nl: "Ons dreigingsmodel legt precies uit wat we kunnen zien, wat niet, en wat nog steeds neerkomt op vertrouwen in ons."
  pl: "Nasz model zagrożeń dokładnie opisuje, co możemy zobaczyć, czego nie możemy i co wciąż opiera się na zaufaniu do nas."
  pt: "Nosso modelo de ameaças explica em detalhes o que podemos ver, o que não podemos ver e o que ainda depende de você confiar em nós."
  pt-BR: "Nosso modelo de ameaças explica em detalhes o que podemos ver, o que não podemos ver e o que ainda depende de você confiar em nós."
  pt-PT: "O nosso modelo de ameaças explica em pormenor o que podemos ver, o que não podemos ver e o que ainda depende de confiar em nós."
  ru: "Наша модель угроз подробно описывает, что мы можем видеть, чего не можем и что по-прежнему держится на доверии к нам."
  sv: "Vår hotmodell beskriver i detalj vad vi kan se, vad vi inte kan se och vad som fortfarande bygger på att du litar på oss."
  sw: "Modeli yetu ya vitisho inaeleza wazi kile tunachoweza kuona, kile tusichoweza, na kile ambacho bado kinategemea kutuamini."
  th: "แบบจำลองภัยคุกคามของเราอธิบายชัดเจนว่าเราเห็นอะไรได้ อะไรที่เห็นไม่ได้ และอะไรที่ยังต้องอาศัยความไว้ใจในตัวเรา"
  uk: "Наша модель загроз докладно описує, що ми можемо бачити, чого не можемо і що досі тримається на довірі до нас."
  vi: "Mô hình mối đe dọa của chúng tôi nói rõ những gì chúng tôi có thể thấy, những gì không thể, và những gì vẫn phụ thuộc vào việc tin tưởng chúng tôi."
  zh: "我们的威胁模型写清楚了我们能看到什么、看不到什么，以及哪些地方仍然需要你信任我们。"
  zh-HK: "我們的威脅模型寫清楚了我們能看到什麼、看不到什麼，以及哪些地方仍然需要你信任我們。"
