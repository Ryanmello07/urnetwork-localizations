description: "Warning banner in the transport settings editor when the Auto policy is degraded because the platform memory budget cannot admit every enabled transport."
source: "Auto is degraded because system memory limits prevent some enabled transports from running."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "الوضع «تلقائي» متدهور لأن حدود ذاكرة النظام تمنع تشغيل بعض بروتوكولات النقل المفعّلة."
  cs: "Režim Auto je omezený, protože limity systémové paměti brání spuštění některých zapnutých transportů."
  de: "„Automatisch“ ist eingeschränkt, weil Speichergrenzen des Systems verhindern, dass einige aktivierte Transporte laufen."
  el: "Η Αυτόματη λειτουργία είναι υποβαθμισμένη επειδή τα όρια μνήμης του συστήματος εμποδίζουν την εκτέλεση ορισμένων ενεργών μεταφορών."
  en: "Auto is degraded because system memory limits prevent some enabled transports from running."
  es: "«Automático» funciona con limitaciones porque los límites de memoria del sistema impiden que se ejecuten algunos transportes activados."
  es-419: "\"Automático\" funciona con limitaciones porque los límites de memoria del sistema impiden que se ejecuten algunos transportes activados."
  es-MX: "\"Automático\" funciona con limitaciones porque los límites de memoria del sistema impiden que se ejecuten algunos transportes activados."
  fr: "Le mode Auto est dégradé, car les limites de mémoire du système empêchent certains transports activés de fonctionner."
  he: "המצב האוטומטי פועל באופן מוגבל כי מגבלות הזיכרון של המערכת מונעות הפעלה של חלק מפרוטוקולי ההעברה המופעלים."
  hi: "ऑटो सीमित रूप से चल रहा है, क्योंकि सिस्टम मेमोरी की सीमाएँ कुछ चालू ट्रांसपोर्ट को चलने से रोक रही हैं।"
  id: "Otomatis berjalan terbatas karena batas memori sistem mencegah beberapa transport yang diaktifkan berjalan."
  it: "Automatico funziona in modo ridotto perché i limiti di memoria del sistema impediscono l’esecuzione di alcuni trasporti attivi."
  ja: "システムのメモリ制限により一部の有効なトランスポートを実行できないため、自動モードは制限付きで動作しています。"
  ko: "시스템 메모리 한도로 일부 켜진 전송 방식을 실행할 수 없어 자동 모드가 제한된 상태로 동작합니다."
  nl: "Auto werkt beperkt omdat de geheugenlimieten van het systeem verhinderen dat sommige ingeschakelde transports draaien."
  pl: "Tryb Auto działa w ograniczonym zakresie, bo limity pamięci systemu nie pozwalają uruchomić niektórych włączonych transportów."
  pt: "O modo Automático está degradado porque os limites de memória do sistema impedem a execução de alguns transportes ativados."
  pt-BR: "O modo Automático está degradado porque limites de memória do sistema impedem a execução de alguns transportes ativados."
  pt-PT: "O modo Automático está degradado porque os limites de memória do sistema impedem a execução de alguns transportes ativados."
  ru: "Режим «Автоматически» работает с ограничениями: лимиты системной памяти не позволяют запустить некоторые включённые транспорты."
  sv: "Auto är försämrat eftersom systemets minnesgränser hindrar vissa aktiverade transporter från att köras."
  sw: "Kiotomatiki kinafanya kazi kwa kiwango cha chini kwa sababu vikomo vya kumbukumbu ya mfumo vinazuia baadhi ya usafirishaji uliowashwa kufanya kazi."
  th: "โหมดอัตโนมัติทำงานได้จำกัด เพราะขีดจำกัดหน่วยความจำของระบบทำให้ทรานสปอร์ตที่เปิดไว้บางรายการทำงานไม่ได้"
  uk: "Режим «Авто» працює з обмеженнями, бо ліміти системної пам’яті не дають запустити деякі ввімкнені транспорти."
  vi: "Chế độ Tự động đang bị giới hạn vì giới hạn bộ nhớ của hệ thống khiến một số phương thức truyền tải đã bật không thể chạy."
  zh: "“自动”模式已降级，因为系统内存限制导致部分已启用的传输方式无法运行。"
  zh-HK: "「自動」模式已降級，因為系統記憶體限制令部分已啟用的傳輸方式無法運作。"
