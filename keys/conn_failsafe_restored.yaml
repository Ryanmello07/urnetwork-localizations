description: "Windows Connect page line and tray notification after the service stopped a tunnel that carried nothing, with the kill switch off. Keep the emphasis on NOT."
source: "URnetwork disconnected you to keep you online: the tunnel was up but nothing was getting through. Your traffic is going out normally now and is NOT protected. Press Connect to try again."
platforms:
  - windows
localizations:
  ar: "قطع URnetwork اتصالك ليبقيك متصلًا بالإنترنت: كان النفق قائمًا لكن لم يكن يمر عبره أي شيء. حركة بياناتك تخرج الآن بشكل عادي وهي غير محمية. اضغط اتصال لإعادة المحاولة."
  cs: "URnetwork vás odpojil, abyste zůstali online: tunel běžel, ale nic jím neprocházelo. Váš provoz teď odchází normálně a NENÍ chráněn. Stiskněte Připojit a zkuste to znovu."
  de: "URnetwork hat die Verbindung getrennt, damit du online bleibst: Der Tunnel war aktiv, aber nichts kam durch. Dein Datenverkehr läuft jetzt wieder normal und ist NICHT geschützt. Drücke auf Verbinden, um es erneut zu versuchen."
  el: "Το URnetwork σάς αποσύνδεσε για να παραμείνετε online: η σήραγγα ήταν ενεργή αλλά δεν περνούσε τίποτα. Η κίνησή σας βγαίνει τώρα κανονικά και ΔΕΝ προστατεύεται. Πατήστε Σύνδεση για να δοκιμάσετε ξανά."
  en: "URnetwork disconnected you to keep you online: the tunnel was up but nothing was getting through. Your traffic is going out normally now and is NOT protected. Press Connect to try again."
  es: "URnetwork te desconectó para que sigas en línea: el túnel estaba activo, pero no pasaba nada. Tu tráfico sale ahora con normalidad y NO está protegido. Pulsa Conectar para volver a intentarlo."
  es-419: "URnetwork te desconectó para que sigas en línea: el túnel estaba activo, pero no pasaba nada. Tu tráfico sale ahora con normalidad y NO está protegido. Pulsa Conectar para volver a intentarlo."
  es-MX: "URnetwork te desconectó para que sigas en línea: el túnel estaba activo, pero no pasaba nada. Tu tráfico sale ahora con normalidad y NO está protegido. Pulsa Conectar para volver a intentarlo."
  fr: "URnetwork vous a déconnecté pour que vous restiez en ligne : le tunnel était actif mais rien ne passait. Votre trafic sort maintenant normalement et n’est PAS protégé. Appuyez sur Connecter pour réessayer."
  he: "URnetwork ניתק אתכם כדי שתישארו מחוברים לאינטרנט: המנהרה פעלה, אבל שום דבר לא עבר דרכה. התעבורה שלכם יוצאת עכשיו כרגיל והיא אינה מוגנת. לחצו על התחבר כדי לנסות שוב."
  hi: "आपको ऑनलाइन रखने के लिए URnetwork ने आपको डिस्कनेक्ट कर दिया: टनल चालू था, लेकिन उससे कुछ भी नहीं गुज़र रहा था। आपका ट्रैफ़िक अब सामान्य रूप से बाहर जा रहा है और सुरक्षित नहीं है। फिर से कोशिश करने के लिए कनेक्ट दबाएँ।"
  id: "URnetwork memutuskan koneksi Anda agar Anda tetap online: terowongan aktif tetapi tidak ada yang tembus. Lalu lintas Anda sekarang keluar seperti biasa dan TIDAK terlindungi. Tekan Hubungkan untuk mencoba lagi."
  it: "URnetwork ti ha disconnesso per mantenerti online: il tunnel era attivo ma non passava nulla. Ora il tuo traffico esce normalmente e NON è protetto. Premi Connetti per riprovare."
  ja: "オンラインを保つため、URnetwork が接続を切断しました: トンネルは動作していましたが、何も通っていませんでした。現在、通信は通常どおり外に出ており、保護されていません。もう一度試すには「接続」を押してください。"
  ko: "온라인 상태를 유지하도록 URnetwork가 연결을 해제했습니다: 터널은 켜져 있었지만 아무것도 통과하지 못했습니다. 이제 트래픽이 평소처럼 나가며 보호되지 않습니다. 다시 시도하려면 연결을 누르세요."
  nl: "URnetwork heeft de verbinding verbroken zodat je online blijft: de tunnel was actief, maar er kwam niets door. Je verkeer gaat nu weer normaal naar buiten en is NIET beschermd. Druk op Verbinden om het opnieuw te proberen."
  pl: "URnetwork rozłączył Cię, żebyś pozostał online: tunel działał, ale nic przez niego nie przechodziło. Twój ruch wychodzi teraz normalnie i NIE jest chroniony. Naciśnij Połącz, aby spróbować ponownie."
  pt: "A URnetwork desconectou você para mantê-lo on-line: o túnel estava ativo, mas nada passava. Seu tráfego está saindo normalmente agora e NÃO está protegido. Toque em Conectar para tentar novamente."
  pt-BR: "A URnetwork desconectou você para mantê-lo on-line: o túnel estava ativo, mas nada passava. Seu tráfego está saindo normalmente agora e NÃO está protegido. Toque em Conectar para tentar novamente."
  pt-PT: "A URnetwork desligou-o para o manter online: o túnel estava ativo, mas nada passava. O seu tráfego sai agora normalmente e NÃO está protegido. Prima Ligar para tentar novamente."
  ru: "URnetwork отключил вас, чтобы вы оставались в сети: туннель работал, но через него ничего не проходило. Сейчас ваш трафик идёт напрямую и НЕ защищён. Нажмите «Подключить», чтобы попробовать снова."
  sv: "URnetwork kopplade från dig för att hålla dig online: tunneln var uppe men inget kom igenom. Din trafik går nu ut som vanligt och är INTE skyddad. Tryck på Anslut för att försöka igen."
  sw: "URnetwork ilikutenganisha ili ubaki mtandaoni: handaki lilikuwa limewashwa lakini hakuna kilichopita. Trafiki yako sasa inatoka kama kawaida na HAILINDWI. Bonyeza Unganisha ili ujaribu tena."
  th: "URnetwork ตัดการเชื่อมต่อของคุณเพื่อให้คุณยังออนไลน์อยู่: อุโมงค์ทำงานอยู่แต่ไม่มีสิ่งใดผ่านไปได้ ตอนนี้ทราฟฟิกของคุณออกไปตามปกติและไม่ได้รับการป้องกัน กดเชื่อมต่อเพื่อลองอีกครั้ง"
  uk: "URnetwork відключив вас, щоб ви залишалися в мережі: тунель працював, але через нього нічого не проходило. Зараз ваш трафік іде напряму і НЕ захищений. Натисніть «Підключитися», щоб спробувати ще раз."
  vi: "URnetwork đã ngắt kết nối để giữ bạn trực tuyến: đường hầm vẫn hoạt động nhưng không có gì đi qua. Lưu lượng của bạn giờ đi ra bình thường và KHÔNG được bảo vệ. Nhấn Kết nối để thử lại."
  zh: "为了让你保持在线，URnetwork 已断开你的连接：隧道处于开启状态，但没有任何流量通过。你的流量现在正常发出，并且不受保护。按“连接”重试。"
  zh-HK: "為了讓你保持在線，URnetwork 已中斷你的連線：隧道處於開啟狀態，但沒有任何流量通過。你的流量現在正常發出，而且不受保護。按「連接」再試一次。"
