description: "Exclude apps from the VPN sheet: how the launcher copies work and what stays in the VPN. The suffix in parentheses must match exclude_app_launcher_name."
source: "Each app you turn on gets a second launcher in your app menu, with (outside VPN) after its name. An app opened from that launcher bypasses the VPN and the kill switch. An app that is already running stays in the VPN until you quit it, and Flatpak and Snap apps are not listed."
platforms:
  - linux
localizations:
  ar: "يحصل كل تطبيق تفعّله على مشغّل ثانٍ في قائمة التطبيقات، يتبع اسمه (خارج VPN). التطبيق الذي يُفتح من هذا المشغّل يتجاوز VPN ومفتاح القتل. التطبيق الذي يعمل بالفعل يبقى داخل VPN حتى تغلقه، ولا تُدرج تطبيقات Flatpak وSnap."
  cs: "Každá aplikace, kterou zapnete, dostane v nabídce aplikací druhý spouštěč s (mimo VPN) za názvem. Aplikace otevřená z tohoto spouštěče obchází VPN i kill switch. Aplikace, která už běží, zůstane ve VPN, dokud ji neukončíte, a aplikace Flatpak a Snap se nezobrazují."
  de: "Jede App, die du einschaltest, erhält im App-Menü einen zweiten Starter mit (außerhalb des VPN) hinter ihrem Namen. Eine über diesen Starter geöffnete App umgeht das VPN und den Kill switch. Eine bereits laufende App bleibt im VPN, bis du sie beendest, und Flatpak- und Snap-Apps werden nicht aufgeführt."
  el: "Κάθε εφαρμογή που ενεργοποιείτε αποκτά μια δεύτερη εκκίνηση στο μενού εφαρμογών, με (εκτός VPN) μετά το όνομά της. Μια εφαρμογή που ανοίγει από αυτή την εκκίνηση παρακάμπτει το VPN και το kill switch. Μια εφαρμογή που ήδη εκτελείται παραμένει στο VPN μέχρι να την κλείσετε, και οι εφαρμογές Flatpak και Snap δεν εμφανίζονται."
  en: "Each app you turn on gets a second launcher in your app menu, with (outside VPN) after its name. An app opened from that launcher bypasses the VPN and the kill switch. An app that is already running stays in the VPN until you quit it, and Flatpak and Snap apps are not listed."
  es: "Cada app que actives tendrá un segundo lanzador en tu menú de aplicaciones, con (fuera de la VPN) tras su nombre. Una app abierta desde ese lanzador evita la VPN y el kill switch. Una app que ya esté en ejecución sigue en la VPN hasta que la cierres, y las apps de Flatpak y Snap no aparecen."
  es-419: "Cada app que actives tendrá un segundo lanzador en tu menú de apps, con (fuera de la VPN) después de su nombre. Una app abierta desde ese lanzador evita la VPN y el kill switch. Una app que ya se esté ejecutando sigue en la VPN hasta que la cierres, y las apps de Flatpak y Snap no aparecen."
  es-MX: "Cada app que actives tendrá un segundo lanzador en tu menú de apps, con (fuera de la VPN) después de su nombre. Una app abierta desde ese lanzador evita la VPN y el kill switch. Una app que ya se esté ejecutando sigue en la VPN hasta que la cierres, y las apps de Flatpak y Snap no aparecen."
  fr: "Chaque application que vous activez obtient un second lanceur dans votre menu d’applications, avec (hors VPN) après son nom. Une application ouverte depuis ce lanceur contourne le VPN et le kill switch. Une application déjà en cours d’exécution reste dans le VPN jusqu’à ce que vous la quittiez, et les applications Flatpak et Snap ne sont pas listées."
  he: "כל אפליקציה שתפעילו מקבלת משגר שני בתפריט האפליקציות, עם (מחוץ ל-VPN) אחרי שמה. אפליקציה שנפתחת מהמשגר הזה עוקפת את ה-VPN ואת הקיל סוויץ'. אפליקציה שכבר פועלת נשארת ב-VPN עד שתסגרו אותה, ואפליקציות Flatpak ו-Snap אינן מופיעות ברשימה."
  hi: "आप जो भी ऐप चालू करते हैं, उसे आपके ऐप मेनू में एक दूसरा लॉन्चर मिलता है, जिसके नाम के बाद (VPN के बाहर) होता है। उस लॉन्चर से खोला गया ऐप VPN और किल स्विच को बायपास करता है। जो ऐप पहले से चल रहा है, वह बंद करने तक VPN में रहता है, और Flatpak और Snap ऐप सूची में नहीं दिखते।"
  id: "Setiap aplikasi yang Anda aktifkan mendapat peluncur kedua di menu aplikasi, dengan (di luar VPN) setelah namanya. Aplikasi yang dibuka dari peluncur itu melewati VPN dan kill switch. Aplikasi yang sudah berjalan tetap berada di VPN sampai Anda menutupnya, dan aplikasi Flatpak serta Snap tidak ditampilkan."
  it: "Ogni app che attivi riceve una seconda icona di avvio nel menu delle app, con (fuori dalla VPN) dopo il nome. Un'app aperta da quell'icona bypassa la VPN e il kill switch. Un'app già in esecuzione resta nella VPN finché non la chiudi, e le app Flatpak e Snap non sono elencate."
  ja: "オンにした各アプリには、名前のあとに（VPN外）が付いた2つ目のランチャーがアプリメニューに追加されます。そのランチャーから開いたアプリはVPNとキルスイッチを迂回します。すでに実行中のアプリは終了するまでVPN内にとどまり、FlatpakとSnapのアプリは一覧に表示されません。"
  ko: "켜는 앱마다 이름 뒤에 (VPN 외부)가 붙은 두 번째 실행기가 앱 메뉴에 추가됩니다. 그 실행기로 연 앱은 VPN과 킬 스위치를 우회합니다. 이미 실행 중인 앱은 종료할 때까지 VPN에 남아 있으며, Flatpak 및 Snap 앱은 목록에 표시되지 않습니다."
  nl: "Elke app die je aanzet, krijgt een tweede starter in je app-menu, met (buiten VPN) achter de naam. Een app die je vanuit die starter opent, omzeilt de VPN en de kill switch. Een app die al draait, blijft in de VPN tot je hem afsluit, en Flatpak- en Snap-apps worden niet getoond."
  pl: "Każda włączona aplikacja otrzymuje w menu aplikacji drugi skrót z dopiskiem (poza VPN) po nazwie. Aplikacja otwarta z tego skrótu omija VPN i kill switch. Aplikacja, która już działa, pozostaje w VPN, dopóki jej nie zamkniesz, a aplikacje Flatpak i Snap nie są wyświetlane."
  pt: "Cada app que você ativar ganha um segundo atalho no menu de apps, com (fora da VPN) depois do nome. Um app aberto por esse atalho contorna a VPN e o kill switch. Um app que já está em execução continua na VPN até você fechá-lo, e apps Flatpak e Snap não são listados."
  pt-BR: "Cada app que você ativar ganha um segundo atalho no menu de apps, com (fora da VPN) depois do nome. Um app aberto por esse atalho contorna a VPN e o kill switch. Um app que já está em execução continua na VPN até você fechá-lo, e apps Flatpak e Snap não são listados."
  pt-PT: "Cada aplicação que ativar recebe um segundo atalho no menu de aplicações, com (fora da VPN) depois do nome. Uma aplicação aberta a partir desse atalho contorna a VPN e o kill switch. Uma aplicação que já está em execução continua na VPN até a fechar, e as aplicações Flatpak e Snap não são listadas."
  ru: "Каждое включённое приложение получает в меню приложений второй ярлык с пометкой (вне VPN) после названия. Приложение, открытое из этого ярлыка, обходит VPN и kill switch. Уже запущенное приложение остаётся в VPN, пока вы его не закроете, а приложения Flatpak и Snap не показываются."
  sv: "Varje app du slår på får en andra startare i appmenyn, med (utanför VPN) efter namnet. En app som öppnas från den startaren kringgår VPN och kill switch. En app som redan körs stannar i VPN tills du avslutar den, och Flatpak- och Snap-appar visas inte."
  sw: "Kila programu unayowasha inapata kizindua cha pili kwenye menyu ya programu, chenye (nje ya VPN) baada ya jina lake. Programu inayofunguliwa kutoka kwa kizindua hicho inaepuka VPN na kill switch. Programu ambayo tayari inaendeshwa inabaki kwenye VPN hadi uifunge, na programu za Flatpak na Snap hazionyeshwi."
  th: "แอปแต่ละตัวที่คุณเปิดจะมีตัวเปิดตัวที่สองในเมนูแอป โดยมี (นอก VPN) ต่อท้ายชื่อ แอปที่เปิดจากตัวเปิดนั้นจะไม่ผ่าน VPN และสวิตช์หยุดการเชื่อมต่อ แอปที่กำลังทำงานอยู่จะยังอยู่ใน VPN จนกว่าคุณจะปิด และจะไม่แสดงแอป Flatpak และ Snap"
  uk: "Кожен увімкнений застосунок отримує в меню застосунків другий ярлик із позначкою (поза VPN) після назви. Застосунок, відкритий із цього ярлика, обходить VPN і kill switch. Застосунок, який уже працює, залишається у VPN, доки ви його не закриєте, а застосунки Flatpak і Snap не показуються."
  vi: "Mỗi ứng dụng bạn bật sẽ có thêm một trình khởi chạy thứ hai trong menu ứng dụng, với (ngoài VPN) sau tên. Ứng dụng mở từ trình khởi chạy đó sẽ bỏ qua VPN và kill switch. Ứng dụng đang chạy sẽ vẫn ở trong VPN cho đến khi bạn thoát nó, và các ứng dụng Flatpak và Snap không được liệt kê."
  zh: "你开启的每个应用都会在应用菜单中多出一个启动器，名称后带有（VPN 外）。从该启动器打开的应用会绕过 VPN 和断网保护。已在运行的应用在你退出之前仍留在 VPN 内，Flatpak 和 Snap 应用不会列出。"
  zh-HK: "你開啟的每個應用程式都會在應用程式選單中多一個啟動器，名稱後附有（VPN 外）。從該啟動器開啟的應用程式會繞過 VPN 和斷線開關。已在執行的應用程式在你結束之前仍會留在 VPN 內，Flatpak 和 Snap 應用程式不會列出。"
