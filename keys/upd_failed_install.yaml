description: "Linux Settings update notice error: the verified download could not be swapped in for the running AppImage."
source: "The AppImage couldn't be replaced. Check the folder's permissions and click to try again."
platforms:
  - linux
localizations:
  ar: "تعذّر استبدال ملف AppImage. تحقق من أذونات المجلد وانقر لإعادة المحاولة."
  cs: "AppImage se nepodařilo nahradit. Zkontrolujte oprávnění složky a klikněte, abyste to zkusili znovu."
  de: "Das AppImage konnte nicht ersetzt werden. Prüfe die Berechtigungen des Ordners und klicke, um es erneut zu versuchen."
  el: "Δεν ήταν δυνατή η αντικατάσταση του AppImage. Ελέγξτε τα δικαιώματα του φακέλου και κάντε κλικ για να δοκιμάσετε ξανά."
  en: "The AppImage couldn't be replaced. Check the folder's permissions and click to try again."
  es: "No se pudo sustituir la AppImage. Comprueba los permisos de la carpeta y haz clic para volver a intentarlo."
  es-419: "No se pudo sustituir la AppImage. Revisa los permisos de la carpeta y haz clic para volver a intentarlo."
  es-MX: "No se pudo sustituir la AppImage. Revisa los permisos de la carpeta y haz clic para volver a intentarlo."
  fr: "L’AppImage n’a pas pu être remplacée. Vérifiez les autorisations du dossier et cliquez pour réessayer."
  he: "לא ניתן היה להחליף את ה-AppImage. בדקו את ההרשאות של התיקייה ולחצו כדי לנסות שוב."
  hi: "AppImage बदला नहीं जा सका। फ़ोल्डर की अनुमतियाँ जाँचें और फिर से कोशिश करने के लिए क्लिक करें।"
  id: "AppImage tidak dapat diganti. Periksa izin folder dan klik untuk mencoba lagi."
  it: "Impossibile sostituire l’AppImage. Controlla i permessi della cartella e fai clic per riprovare."
  ja: "AppImage を置き換えられませんでした。フォルダのアクセス許可を確認し、クリックして再試行してください。"
  ko: "AppImage를 교체할 수 없습니다. 폴더 권한을 확인하고 클릭하여 다시 시도하세요."
  nl: "De AppImage kon niet worden vervangen. Controleer de rechten van de map en klik om het opnieuw te proberen."
  pl: "Nie udało się zastąpić pliku AppImage. Sprawdź uprawnienia folderu i kliknij, aby spróbować ponownie."
  pt: "Não foi possível substituir o AppImage. Verifique as permissões da pasta e clique para tentar novamente."
  pt-BR: "Não foi possível substituir o AppImage. Verifique as permissões da pasta e clique para tentar novamente."
  pt-PT: "Não foi possível substituir a AppImage. Verifique as permissões da pasta e clique para tentar novamente."
  ru: "Не удалось заменить AppImage. Проверьте права доступа к папке и нажмите, чтобы попробовать снова."
  sv: "AppImage-filen kunde inte ersättas. Kontrollera mappens behörigheter och klicka för att försöka igen."
  sw: "AppImage haikuweza kubadilishwa. Angalia ruhusa za folda kisha ubofye ili ujaribu tena."
  th: "แทนที่ AppImage ไม่ได้ ตรวจสอบสิทธิ์ของโฟลเดอร์แล้วคลิกเพื่อลองอีกครั้ง"
  uk: "Не вдалося замінити AppImage. Перевірте права доступу до папки й натисніть, щоб спробувати ще раз."
  vi: "Không thể thay thế AppImage. Kiểm tra quyền của thư mục và nhấp để thử lại."
  zh: "无法替换 AppImage。请检查文件夹权限，然后点击重试。"
  zh-HK: "無法取代 AppImage。請檢查資料夾權限，然後按一下再試一次。"
