description: "Instant account: explains that no email, phone or password is needed."
source: "No email, phone, or password needed. Your account is secured by a seedphrase."
platforms:
  - linux
  - windows
localizations:
  ar: "لا حاجة إلى بريد إلكتروني أو هاتف أو كلمة مرور. حسابك محمي بعبارة الاسترداد."
  cs: "Není potřeba e-mail, telefon ani heslo. Váš účet je zabezpečen seed frází."
  de: "Keine E-Mail, Telefonnummer oder Passwort nötig. Dein Konto ist durch eine Seedphrase gesichert."
  el: "Δεν χρειάζεται email, τηλέφωνο ή κωδικός πρόσβασης. Ο λογαριασμός σας προστατεύεται από μια φράση ανάκτησης."
  en: "No email, phone, or password needed. Your account is secured by a seedphrase."
  es: "No necesitas correo, teléfono ni contraseña. Tu cuenta está protegida por una frase semilla."
  es-419: "No necesitas correo, teléfono ni contraseña. Tu cuenta está protegida por una frase semilla."
  es-MX: "No necesitas correo, teléfono ni contraseña. Tu cuenta está protegida por una frase semilla."
  fr: "Ni e-mail, ni téléphone, ni mot de passe. Votre compte est protégé par une phrase de récupération."
  he: "לא צריך אימייל, טלפון או סיסמה. החשבון שלכם מאובטח בביטוי סיד."
  hi: "ईमेल, फ़ोन या पासवर्ड की ज़रूरत नहीं। आपका खाता एक सीड फ़्रेज़ से सुरक्षित है।"
  id: "Tidak perlu email, telepon, atau kata sandi. Akun Anda diamankan dengan frasa pemulihan."
  it: "Nessuna email, telefono o password richiesti. Il tuo account è protetto da una frase seed."
  ja: "メール、電話番号、パスワードは不要です。アカウントはシードフレーズで保護されます。"
  ko: "이메일, 전화번호, 비밀번호가 필요 없습니다. 계정은 시드 문구로 보호됩니다."
  nl: "Geen e-mail, telefoon of wachtwoord nodig. Je account is beveiligd met een seedphrase."
  pl: "Nie potrzeba e-maila, telefonu ani hasła. Twoje konto jest zabezpieczone frazą seed."
  pt: "Não precisa de e-mail, telefone ou senha. Sua conta é protegida por uma frase-semente."
  pt-BR: "Não precisa de e-mail, telefone ou senha. Sua conta é protegida por uma frase-semente."
  pt-PT: "Não precisa de e-mail, telefone ou palavra-passe. A sua conta é protegida por uma frase-semente."
  ru: "Не нужны ни почта, ни телефон, ни пароль. Ваш аккаунт защищён сид-фразой."
  sv: "Ingen e-post, telefon eller lösenord behövs. Ditt konto skyddas av en seedfras."
  sw: "Hakuna barua pepe, simu, au nenosiri linalohitajika. Akaunti yako inalindwa na kifungu cha seed."
  th: "ไม่ต้องใช้อีเมล โทรศัพท์ หรือรหัสผ่าน บัญชีของคุณได้รับการปกป้องด้วยวลีกู้คืน"
  uk: "Не потрібні ні пошта, ні телефон, ні пароль. Ваш обліковий запис захищено сід-фразою."
  vi: "Không cần email, điện thoại hay mật khẩu. Tài khoản của bạn được bảo vệ bằng cụm từ khôi phục."
  zh: "无需电子邮件、电话或密码。你的账户由助记词保护。"
  zh-HK: "無需電郵、電話或密碼。你的帳戶由助記詞保護。"
