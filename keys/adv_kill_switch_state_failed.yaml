  cs: "Systémová služba URnetwork nemohla nainstalovat kill switch, takže se provoz neblokuje."
  de: "Der URnetwork-Systemdienst konnte den Kill switch nicht installieren, der Datenverkehr wird also nicht blockiert."
  el: "Η υπηρεσία συστήματος URnetwork δεν μπόρεσε να εγκαταστήσει το Kill switch, οπότε η κίνηση δεν αποκλείεται."
  en: "The URnetwork system service could not install the kill switch, so your traffic is NOT being blocked."
  es: "El servicio del sistema de URnetwork no pudo instalar el Kill switch, así que el tráfico no se bloquea."
  es-419: "El servicio del sistema de URnetwork no pudo instalar el Kill switch, así que tu tráfico NO se está bloqueando."
  es-MX: "El servicio del sistema de URnetwork no pudo instalar el Kill switch, así que el tráfico no se bloquea."
  fr: "Le service système URnetwork n’a pas pu installer le Kill switch, le trafic n’est donc pas bloqué."
  he: "שירות המערכת של URnetwork לא הצליח להתקין את הקיל סוויץ', ולכן התעבורה לא נחסמת."
  hi: "URnetwork सिस्टम सेवा किल स्विच इंस्टॉल नहीं कर सकी, इसलिए ट्रैफ़िक रोका नहीं जा रहा है।"
  id: "Layanan sistem URnetwork tidak dapat memasang Kill switch, jadi lalu lintas tidak diblokir."
  it: "Il servizio di sistema URnetwork non è riuscito a installare il Kill switch, quindi il traffico non viene bloccato."
  ja: "URnetwork のシステムサービスがキルスイッチを設定できなかったため、通信は遮断されていません。"
  ko: "URnetwork 시스템 서비스가 킬 스위치를 설치하지 못해 트래픽이 차단되지 않습니다."
  nl: "De URnetwork-systeemdienst kon de Kill switch niet instellen, dus het verkeer wordt niet geblokkeerd."
  pl: "Usługa systemowa URnetwork nie mogła zainstalować Kill switch, więc ruch nie jest blokowany."
  pt: "O serviço do sistema URnetwork não conseguiu instalar o Kill switch, então o tráfego não está sendo bloqueado."
  pt-BR: "O serviço do sistema URnetwork não conseguiu instalar o Kill switch, então o tráfego não está sendo bloqueado."
  pt-PT: "O serviço de sistema URnetwork não conseguiu instalar o Kill switch, pelo que o tráfego não está a ser bloqueado."
  ru: "Системная служба URnetwork не смогла установить Kill switch, поэтому трафик не блокируется."
  sv: "URnetworks systemtjänst kunde inte installera Kill switch, så trafiken blockeras inte."
  sw: "Huduma ya mfumo ya URnetwork haikuweza kusakinisha Kill switch, kwa hivyo trafiki haizuiwi."
  th: "บริการระบบของ URnetwork ติดตั้งสวิตช์หยุดการเชื่อมต่อไม่ได้ ทราฟฟิกจึงไม่ถูกบล็อก"
  uk: "Системна служба URnetwork не змогла встановити Kill switch, тому трафік не блокується."
  vi: "Dịch vụ hệ thống URnetwork không thể cài đặt Kill switch, nên lưu lượng không bị chặn."
