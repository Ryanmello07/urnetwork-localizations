description: "Sessions screen (Account > Sessions), row line 1: the device type of a session signed in from the ur.io web app in a browser. Not tagged apple: Apple's catalog is keyed by the English source, and window_type_quality already carries \"Web\" there, so the apple screen reads that entry. Translated as window_type_quality is, so every platform shows the same words. The exception is Hebrew: window_type_quality's גלישה (\"browsing\") names the connect drawer's Web mode, so this key says ווב."
