description: "Body of the no-wallet alert (android) and note (iOS) of the Solana payout wallet's connect sheet, when no wallet app on the device can connect (android: no wallet app answers the Mobile Wallet Adapter request, as reported with Brave Wallet installed; iOS: neither Phantom nor Solflare is installed). A typed address works with any wallet, so the line points at the sheet's manual entry, naming its Enter address manually control in that control's own words (enter_address_manually); the android alert also offers that control as its action. Signing in needs a wallet app and keeps no_wallets_found_alert_content."
source: "No compatible Solana wallet app was found on this device. Choose “Enter address manually” to paste your wallet address instead."
platforms:
  - android
  - apple
localizations:
  ar: "لم يتم العثور على تطبيق محفظة Solana متوافق على هذا الجهاز. اختر «إدخال العنوان يدويًا» للصق عنوان محفظتك بدلاً من ذلك."
  cs: "Na tomto zařízení nebyla nalezena žádná kompatibilní aplikace peněženky Solana. Zvolte „Zadat adresu ručně“ a vložte místo toho adresu své peněženky."
  de: "Auf diesem Gerät wurde keine kompatible Solana-Wallet-App gefunden. Wähle „Adresse manuell eingeben“, um stattdessen deine Wallet-Adresse einzufügen."
  el: "Δεν βρέθηκε συμβατή εφαρμογή πορτοφολιού Solana σε αυτήν τη συσκευή. Επιλέξτε «Χειροκίνητη εισαγωγή διεύθυνσης» για να επικολλήσετε αντί γι’ αυτό τη διεύθυνση του πορτοφολιού σας."
  en: "No compatible Solana wallet app was found on this device. Choose “Enter address manually” to paste your wallet address instead."
  es: "No se encontró ninguna app de billetera de Solana compatible en este dispositivo. Elige «Introducir la dirección manualmente» para pegar la dirección de tu billetera en su lugar."
  es-419: "No se encontró ninguna app de billetera de Solana compatible en este dispositivo. Elige \"Ingresar la dirección manualmente\" para pegar la dirección de tu billetera en su lugar."
  es-MX: "No se encontró ninguna app de cartera de Solana compatible en este dispositivo. Elige \"Ingresar la dirección manualmente\" para pegar la dirección de tu cartera en su lugar."
  fr: "Aucune application de portefeuille Solana compatible n’a été trouvée sur cet appareil. Choisissez « Saisir l’adresse manuellement » pour coller l’adresse de votre portefeuille à la place."
  he: "לא נמצאה במכשיר זה אפליקציית ארנק Solana תואמת. בחרו \"הזנת הכתובת ידנית\" כדי להדביק במקום זאת את כתובת הארנק שלכם."
  hi: "इस डिवाइस पर कोई संगत Solana वॉलेट ऐप नहीं मिला। इसके बजाय अपने वॉलेट का पता पेस्ट करने के लिए \"पता मैन्युअल रूप से डालें\" चुनें।"
  id: "Tidak ada aplikasi dompet Solana yang kompatibel di perangkat ini. Pilih “Masukkan alamat secara manual” untuk menempelkan alamat dompet Anda sebagai gantinya."
  it: "Nessuna app di portafoglio Solana compatibile trovata su questo dispositivo. Scegli «Inserisci l’indirizzo manualmente» per incollare invece l’indirizzo del tuo portafoglio."
  ja: "このデバイスに対応する Solana ウォレットアプリが見つかりません。代わりにウォレットのアドレスを貼り付けるには、「アドレスを手動で入力」を選択してください。"
  ko: "이 기기에서 호환되는 Solana 지갑 앱을 찾을 수 없습니다. 대신 지갑 주소를 붙여 넣으려면 '주소 직접 입력'을 선택하세요."
  nl: "Er is geen compatibele Solana-wallet-app gevonden op dit apparaat. Kies ‘Adres handmatig invoeren’ om in plaats daarvan je walletadres te plakken."
  pl: "Na tym urządzeniu nie znaleziono zgodnej aplikacji portfela Solana. Wybierz „Wpisz adres ręcznie”, aby zamiast tego wkleić adres swojego portfela."
  pt: "Não foi encontrada nenhuma aplicação de carteira Solana compatível neste dispositivo. Escolha \"Introduzir o endereço manualmente\" para colar o endereço da sua carteira em vez disso."
  pt-BR: "Nenhum app de carteira Solana compatível foi encontrado neste dispositivo. Escolha \"Digitar o endereço manualmente\" para colar o endereço da sua carteira em vez disso."
  pt-PT: "Não foi encontrada nenhuma aplicação de carteira Solana compatível neste dispositivo. Escolha \"Introduzir o endereço manualmente\" para colar o endereço da sua carteira em vez disso."
  ru: "На этом устройстве не найдено совместимое приложение кошелька Solana. Выберите «Ввести адрес вручную», чтобы вместо этого вставить адрес вашего кошелька."
  sv: "Ingen kompatibel Solana-plånboksapp hittades på den här enheten. Välj ”Ange adressen manuellt” för att klistra in din plånboksadress i stället."
  sw: "Hakuna programu ya pochi ya Solana inayooana iliyopatikana kwenye kifaa hiki. Chagua \"Weka anwani mwenyewe\" ili ubandike anwani ya pochi yako badala yake."
  th: "ไม่พบแอปกระเป๋าเงิน Solana ที่รองรับบนอุปกรณ์นี้ เลือก “ป้อนที่อยู่ด้วยตนเอง” เพื่อวางที่อยู่กระเป๋าเงินของคุณแทน"
  uk: "На цьому пристрої не знайдено сумісного застосунку гаманця Solana. Виберіть «Ввести адресу вручну», щоб натомість вставити адресу свого гаманця."
  vi: "Không tìm thấy ứng dụng ví Solana tương thích trên thiết bị này. Thay vào đó, hãy chọn “Nhập địa chỉ thủ công” để dán địa chỉ ví của bạn."
  zh: "此设备上未找到兼容的 Solana 钱包应用。请选择“手动输入地址”，改为粘贴您的钱包地址。"
  zh-HK: "此裝置上找不到相容的 Solana 錢包應用程式。請選擇「手動輸入地址」，改為貼上你的錢包地址。"
