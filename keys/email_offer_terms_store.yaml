description: "Onboarding emails E3a, E4b, E5b, for networks billed by the App Store or Google Play: the terms line under the button, WITHOUT a price (the store shows its own local price before the purchase). It must still say the subscription renews."
source: "14 days free, then a year of Pro with 3 months free, renewing yearly. Your store shows the price before you pay. Cancel anytime."
platforms:
  - email
localizations:
