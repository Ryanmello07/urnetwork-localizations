description: "Blocked locations: the list could not be loaded."
source: "Couldn't load your blocked locations. Pull down to try again."
platforms:
  - android
localizations:
  ar: "تعذّر تحميل المواقع المحظورة. اسحب لأسفل للمحاولة مرة أخرى."
  cs: "Vaše blokovaná místa se nepodařilo načíst. Stáhněte dolů a zkuste to znovu."
  de: "Deine blockierten Standorte konnten nicht geladen werden. Zum erneuten Versuchen nach unten ziehen."
  el: "Δεν ήταν δυνατή η φόρτωση των αποκλεισμένων τοποθεσιών σας. Σύρετε προς τα κάτω για να δοκιμάσετε ξανά."
  en: "Couldn't load your blocked locations. Pull down to try again."
  es: "No se pudieron cargar tus ubicaciones bloqueadas. Desliza hacia abajo para volver a intentarlo."
  es-419: "No se pudieron cargar tus ubicaciones bloqueadas. Desliza hacia abajo para volver a intentarlo."
  es-MX: "No se pudieron cargar tus ubicaciones bloqueadas. Desliza hacia abajo para volver a intentarlo."
  fr: "Impossible de charger vos emplacements bloqués. Tirez vers le bas pour réessayer."
  he: "לא ניתן היה לטעון את המיקומים החסומים שלכם. משכו למטה כדי לנסות שוב."
  hi: "आपकी ब्लॉक की गई लोकेशन लोड नहीं हो सकीं। दोबारा कोशिश करने के लिए नीचे खींचें।"
  id: "Tidak dapat memuat lokasi yang Anda blokir. Tarik ke bawah untuk mencoba lagi."
  it: "Impossibile caricare le tue posizioni bloccate. Trascina verso il basso per riprovare."
  ja: "ブロックした場所を読み込めませんでした。下に引っ張ってもう一度お試しください。"
  ko: "차단한 위치를 불러올 수 없습니다. 아래로 당겨 다시 시도하세요."
  nl: "Je geblokkeerde locaties konden niet worden geladen. Trek omlaag om het opnieuw te proberen."
  pl: "Nie udało się wczytać zablokowanych lokalizacji. Przeciągnij w dół, aby spróbować ponownie."
  pt: "Não foi possível carregar as suas localizações bloqueadas. Puxe para baixo para tentar novamente."
  pt-BR: "Não foi possível carregar seus locais bloqueados. Puxe para baixo para tentar novamente."
  pt-PT: "Não foi possível carregar as suas localizações bloqueadas. Puxe para baixo para tentar novamente."
  ru: "Не удалось загрузить заблокированные локации. Потяните вниз, чтобы попробовать ещё раз."
  sv: "Det gick inte att läsa in dina blockerade platser. Dra nedåt för att försöka igen."
  sw: "Imeshindwa kupakia maeneo uliyozuia. Vuta chini ili ujaribu tena."
  th: "โหลดตำแหน่งที่คุณบล็อกไม่ได้ ดึงลงเพื่อลองอีกครั้ง"
  uk: "Не вдалося завантажити заблоковані розташування. Потягніть униз, щоб спробувати ще раз."
  vi: "Không thể tải các vị trí bạn đã chặn. Kéo xuống để thử lại."
  zh: "无法加载您已屏蔽的位置。下拉即可重试。"
  zh-HK: "無法載入你已封鎖的位置。請向下拉以重試。"
