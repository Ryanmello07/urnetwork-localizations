  sw: "Dai la mwisho halikufanikiwa. URnetwork itajaribu tena baadaye."
  th: "คำขอรับครั้งล่าสุดไม่สำเร็จ URnetwork จะลองอีกครั้งในภายหลัง"
  uk: "Останній запит на отримання не пройшов. URnetwork спробує ще раз пізніше."
  vi: "Yêu cầu nhận gần nhất không thành công. URnetwork sẽ thử lại sau."
  zh: "上一次领取未成功。URnetwork 稍后会重试。"
  zh-HK: "上一次領取未成功。URnetwork 稍後會重試。"
