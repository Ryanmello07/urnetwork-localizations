  nl: "De laatste claim is niet gelukt. URnetwork probeert het later opnieuw."
  pl: "Ostatni odbiór się nie powiódł. URnetwork spróbuje ponownie później."
  pt: "A última reivindicação não foi concluída. O URnetwork volta a tentar mais tarde."
  pt-BR: "O último resgate não foi concluído. O URnetwork vai tentar de novo mais tarde."
