description: "Earnings, the settlement v2 tile and the claim sheet: the last claim transaction failed, and URnetwork will try again by itself."
source: "The last claim didn't go through. URnetwork tries again later."
platforms:
  - linux
  - apple
  - android
  - windows
  - site
localizations:
  ar: "لم تنجح المطالبة الأخيرة. سيحاول URnetwork مرة أخرى لاحقًا."
  cs: "Poslední nárok neprošel. URnetwork to zkusí znovu později."
  de: "Die letzte Einlösung ist nicht durchgegangen. URnetwork versucht es später erneut."
  el: "Η τελευταία διεκδίκηση δεν ολοκληρώθηκε. Το URnetwork θα δοκιμάσει ξανά αργότερα."
  en: "The last claim didn't go through. URnetwork tries again later."
  es: "La última reclamación no se completó. URnetwork volverá a intentarlo más tarde."
  es-419: "La última reclamación no se completó. URnetwork volverá a intentarlo más tarde."
  es-MX: "La última reclamación no se completó. URnetwork volverá a intentarlo más tarde."
  fr: "La dernière réclamation n’a pas abouti. URnetwork réessaiera plus tard."
  he: "המימוש האחרון לא הצליח. URnetwork ינסה שוב מאוחר יותר."
