description: "Windows Settings: confirmation dialog before uninstalling the VPN service."
source: "This stops the URnetwork service and removes it from Windows. The app can't connect until it is set up again. Windows will ask for administrator permission."
platforms:
  - windows
localizations:
  ar: "هذا يوقف خدمة URnetwork ويزيلها من Windows. لن يتمكن التطبيق من الاتصال حتى تُعدّ الخدمة مجددًا. سيطلب Windows إذن المسؤول."
  cs: "Tím se zastaví služba URnetwork a odebere se z Windows. Aplikace se nebude moci připojit, dokud se služba znovu nenastaví. Windows požádá o oprávnění správce."
  de: "Das stoppt den URnetwork-Dienst und entfernt ihn aus Windows. Die App kann sich erst wieder verbinden, wenn er neu eingerichtet ist. Windows fragt nach einer Administratorberechtigung."
  el: "Αυτό σταματά την υπηρεσία URnetwork και την αφαιρεί από τα Windows. Η εφαρμογή δεν μπορεί να συνδεθεί μέχρι να ρυθμιστεί ξανά. Τα Windows θα ζητήσουν άδεια διαχειριστή."
  en: "This stops the URnetwork service and removes it from Windows. The app can't connect until it is set up again. Windows will ask for administrator permission."
  es: "Esto detiene el servicio de URnetwork y lo elimina de Windows. La app no podrá conectarse hasta que se configure de nuevo. Windows pedirá permiso de administrador."
  es-419: "Esto detiene el servicio de URnetwork y lo elimina de Windows. La app no podrá conectarse hasta que se configure de nuevo. Windows pedirá permiso de administrador."
  es-MX: "Esto detiene el servicio de URnetwork y lo elimina de Windows. La app no podrá conectarse hasta que se configure de nuevo. Windows pedirá permiso de administrador."
  fr: "Cela arrête le service URnetwork et le supprime de Windows. L’application ne pourra pas se connecter tant qu’il n’est pas reconfiguré. Windows demandera une autorisation d’administrateur."
  he: "פעולה זו עוצרת את שירות URnetwork ומסירה אותו מ-Windows. האפליקציה לא תוכל להתחבר עד שהוא יוגדר מחדש. Windows יבקש הרשאת מנהל."
  hi: "यह URnetwork सेवा को रोकता है और उसे Windows से हटा देता है। इसे फिर से सेट अप करने तक ऐप कनेक्ट नहीं कर सकता। Windows व्यवस्थापक अनुमति माँगेगा।"
  id: "Ini menghentikan layanan URnetwork dan menghapusnya dari Windows. Aplikasi tidak dapat terhubung sampai layanan disiapkan lagi. Windows akan meminta izin administrator."
  it: "Questo arresta il servizio URnetwork e lo rimuove da Windows. L’app non può connettersi finché non viene configurato di nuovo. Windows chiederà il permesso dell’amministratore."
  ja: "URnetwork サービスを停止し、Windows から削除します。再設定するまでアプリは接続できません。Windows が管理者の許可を求めます。"
  ko: "URnetwork 서비스를 중지하고 Windows에서 제거합니다. 다시 설정할 때까지 앱은 연결할 수 없습니다. Windows에서 관리자 권한을 요청합니다."
  nl: "Dit stopt de URnetwork-dienst en verwijdert hem uit Windows. De app kan pas weer verbinden als die opnieuw is ingesteld. Windows vraagt om beheerdersrechten."
  pl: "To zatrzymuje usługę URnetwork i usuwa ją z systemu Windows. Aplikacja nie będzie mogła się łączyć, dopóki usługa nie zostanie ponownie skonfigurowana. Windows poprosi o uprawnienia administratora."
  pt: "Isso para o serviço URnetwork e o remove do Windows. O app não pode conectar até que ele seja configurado de novo. O Windows vai pedir permissão de administrador."
  pt-BR: "Isso para o serviço URnetwork e o remove do Windows. O app não pode conectar até que ele seja configurado de novo. O Windows vai pedir permissão de administrador."
  pt-PT: "Isto para o serviço URnetwork e remove-o do Windows. A app não pode ligar até ele ser configurado novamente. O Windows vai pedir permissão de administrador."
  ru: "Это остановит службу URnetwork и удалит её из Windows. Приложение не сможет подключаться, пока служба не будет настроена заново. Windows запросит разрешение администратора."
  sv: "Det här stoppar URnetwork-tjänsten och tar bort den från Windows. Appen kan inte ansluta förrän den har konfigurerats igen. Windows ber om administratörsbehörighet."
  sw: "Hii husimamisha huduma ya URnetwork na kuiondoa kwenye Windows. Programu haiwezi kuunganisha hadi isanidiwe tena. Windows itaomba ruhusa ya msimamizi."
  th: "การดำเนินการนี้จะหยุดบริการ URnetwork และนำออกจาก Windows แอปจะเชื่อมต่อไม่ได้จนกว่าจะตั้งค่าใหม่ Windows จะขอสิทธิ์ผู้ดูแลระบบ"
  uk: "Це зупинить службу URnetwork і видалить її з Windows. Застосунок не зможе підключатися, доки службу не буде налаштовано знову. Windows попросить дозвіл адміністратора."
  vi: "Thao tác này dừng dịch vụ URnetwork và gỡ nó khỏi Windows. Ứng dụng không thể kết nối cho đến khi thiết lập lại. Windows sẽ yêu cầu quyền quản trị viên."
  zh: "这会停止 URnetwork 服务并将其从 Windows 中移除。在重新设置之前应用无法连接。Windows 会请求管理员权限。"
  zh-HK: "這會停止 URnetwork 服務並將其從 Windows 中移除。在重新設定之前應用程式無法連線。Windows 會要求管理員權限。"
