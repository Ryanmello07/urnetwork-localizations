description: "Linux notice when the app cannot reach the URnetwork system service because the service restarted under a sandboxed (Flatpak) app."
source: "The URnetwork system service restarted while this app was open. Close the app and open it again to reconnect to it."
platforms:
  - linux
localizations:
  ar: "أُعيد تشغيل خدمة نظام URnetwork أثناء فتح هذا التطبيق. أغلق التطبيق وافتحه مجددًا لإعادة الاتصال بها."
  cs: "Systémová služba URnetwork se restartovala, zatímco byla tato aplikace otevřená. Zavřete aplikaci a znovu ji otevřete, abyste se k ní znovu připojili."
  de: "Der URnetwork-Systemdienst wurde neu gestartet, während diese App geöffnet war. Schließe die App und öffne sie erneut, um wieder eine Verbindung zu ihm herzustellen."
  el: "Η υπηρεσία συστήματος URnetwork επανεκκινήθηκε ενώ αυτή η εφαρμογή ήταν ανοιχτή. Κλείστε την εφαρμογή και ανοίξτε την ξανά για να συνδεθείτε ξανά σε αυτήν."
  en: "The URnetwork system service restarted while this app was open. Close the app and open it again to reconnect to it."
  es: "El servicio del sistema URnetwork se reinició mientras esta app estaba abierta. Cierra la app y vuelve a abrirla para reconectarte a él."
  es-419: "El servicio del sistema URnetwork se reinició mientras esta app estaba abierta. Cierra la app y vuelve a abrirla para reconectarte a él."
  es-MX: "El servicio del sistema URnetwork se reinició mientras esta app estaba abierta. Cierra la app y vuelve a abrirla para reconectarte a él."
  fr: "Le service système URnetwork a redémarré pendant que cette application était ouverte. Fermez l’application et rouvrez-la pour vous y reconnecter."
  he: "שירות המערכת של URnetwork הופעל מחדש בזמן שהאפליקציה הזו הייתה פתוחה. סגרו את האפליקציה ופתחו אותה שוב כדי להתחבר אליו מחדש."
  hi: "यह ऐप खुला रहते हुए URnetwork सिस्टम सेवा फिर से शुरू हो गई। उससे फिर से जुड़ने के लिए ऐप बंद करके दोबारा खोलें।"
  id: "Layanan sistem URnetwork dimulai ulang saat aplikasi ini terbuka. Tutup aplikasi dan buka lagi untuk terhubung kembali ke layanan tersebut."
  it: "Il servizio di sistema URnetwork si è riavviato mentre questa app era aperta. Chiudi l’app e riaprila per riconnetterti al servizio."
  ja: "このアプリを開いている間に URnetwork システムサービスが再起動しました。サービスに再接続するには、アプリを閉じてもう一度開いてください。"
  ko: "이 앱이 열려 있는 동안 URnetwork 시스템 서비스가 다시 시작되었습니다. 서비스에 다시 연결하려면 앱을 닫았다가 다시 여세요."
  nl: "De URnetwork-systeemservice is opnieuw gestart terwijl deze app open was. Sluit de app en open hem opnieuw om weer verbinding te maken met de service."
  pl: "Usługa systemowa URnetwork uruchomiła się ponownie, gdy ta aplikacja była otwarta. Zamknij aplikację i otwórz ją ponownie, aby znów się z nią połączyć."
  pt: "O serviço de sistema URnetwork foi reiniciado enquanto este app estava aberto. Feche o app e abra-o de novo para se reconectar a ele."
  pt-BR: "O serviço de sistema URnetwork foi reiniciado enquanto este app estava aberto. Feche o app e abra-o de novo para se reconectar a ele."
  pt-PT: "O serviço de sistema URnetwork foi reiniciado enquanto esta app estava aberta. Feche a app e volte a abri-la para se ligar novamente a ele."
  ru: "Системная служба URnetwork перезапустилась, пока это приложение было открыто. Закройте приложение и откройте его снова, чтобы заново подключиться к службе."
  sv: "Systemtjänsten URnetwork startades om medan den här appen var öppen. Stäng appen och öppna den igen för att ansluta till tjänsten på nytt."
  sw: "Huduma ya mfumo ya URnetwork ilianzishwa upya programu hii ikiwa imefunguliwa. Funga programu na uifungue tena ili kuunganisha nayo tena."
  th: "บริการระบบ URnetwork รีสตาร์ทขณะที่แอปนี้เปิดอยู่ ปิดแอปแล้วเปิดใหม่เพื่อเชื่อมต่อกับบริการอีกครั้ง"
  uk: "Системна служба URnetwork перезапустилася, поки цей застосунок був відкритий. Закрийте застосунок і відкрийте його знову, щоб повторно підключитися до служби."
  vi: "Dịch vụ hệ thống URnetwork đã khởi động lại trong khi ứng dụng này đang mở. Hãy đóng ứng dụng và mở lại để kết nối lại với dịch vụ."
  zh: "此应用打开期间，URnetwork 系统服务已重新启动。请关闭应用并重新打开，以重新连接到该服务。"
  zh-HK: "此應用程式開啟期間，URnetwork 系統服務已重新啟動。請關閉應用程式並重新開啟，以重新連接該服務。"
