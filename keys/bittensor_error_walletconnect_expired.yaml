description: "Bittensor wallet error in the apps, when the ur.io bridge page returns walletconnect_expired: the WalletConnect pairing or the signature request ran out of time before the wallet answered. WalletConnect is a product name."
source: "The WalletConnect request expired before the wallet answered. Start again."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "انتهت صلاحية طلب WalletConnect قبل أن تستجيب المحفظة. ابدأ من جديد."
  cs: "Požadavek WalletConnect vypršel dříve, než peněženka odpověděla. Začněte znovu."
  de: "Die WalletConnect-Anfrage ist abgelaufen, bevor die Wallet geantwortet hat. Starte erneut."
  el: "Το αίτημα WalletConnect έληξε πριν απαντήσει το πορτοφόλι. Ξεκινήστε ξανά."
  en: "The WalletConnect request expired before the wallet answered. Start again."
  es: "La solicitud de WalletConnect caducó antes de que respondiera la billetera. Empieza de nuevo."
  es-419: "La solicitud de WalletConnect venció antes de que respondiera la billetera. Comienza de nuevo."
  es-MX: "La solicitud de WalletConnect venció antes de que respondiera la cartera. Comienza de nuevo."
  fr: "La demande WalletConnect a expiré avant que le portefeuille ne réponde. Recommencez."
  he: "תוקף בקשת WalletConnect פג לפני שהארנק השיב. התחילו מחדש."
  hi: "वॉलेट के जवाब देने से पहले WalletConnect अनुरोध की समय-सीमा समाप्त हो गई। फिर से शुरू करें।"
  id: "Permintaan WalletConnect kedaluwarsa sebelum dompet menjawab. Mulai lagi."
  it: "La richiesta WalletConnect è scaduta prima che il portafoglio rispondesse. Ricomincia."
  ja: "ウォレットが応答する前に WalletConnect のリクエストの有効期限が切れました。最初からやり直してください。"
  ko: "지갑이 응답하기 전에 WalletConnect 요청이 만료되었습니다. 다시 시작하세요."
  nl: "Het WalletConnect-verzoek is verlopen voordat de wallet antwoordde. Begin opnieuw."
  pl: "Żądanie WalletConnect wygasło, zanim portfel odpowiedział. Zacznij od nowa."
  pt: "O pedido WalletConnect expirou antes de a carteira responder. Comece de novo."
  pt-BR: "A solicitação do WalletConnect expirou antes de a carteira responder. Comece de novo."
  pt-PT: "O pedido WalletConnect expirou antes de a carteira responder. Comece de novo."
  ru: "Срок действия запроса WalletConnect истек до того, как кошелек ответил. Начните заново."
  sv: "WalletConnect-begäran gick ut innan plånboken svarade. Börja om."
  sw: "Muda wa ombi la WalletConnect uliisha kabla pochi haijajibu. Anza upya."
  th: "คำขอ WalletConnect หมดอายุก่อนที่กระเป๋าเงินจะตอบกลับ เริ่มใหม่อีกครั้ง"
  uk: "Термін дії запиту WalletConnect минув, перш ніж гаманець відповів. Почніть знову."
  vi: "Yêu cầu WalletConnect đã hết hạn trước khi ví phản hồi. Hãy bắt đầu lại."
  zh: "钱包响应之前，WalletConnect 请求已过期。请重新开始。"
  zh-HK: "錢包回應之前，WalletConnect 請求已過期。請重新開始。"
