description: "Compact relative-time label with an abbreviated days unit (\"3d ago\"), shown by the windows and linux relative-time formatters (the Sessions screen's Last used) for events a day to 7 days old; older events show a date. The argument is the elapsed days. Not a plural: the abbreviated unit does not inflect, but the word order and the unit abbreviation localize."
source: "{count}d ago"
platforms:
  - windows
  - linux
  - site
placeholders:
  - name: count
    type: int
