description: "Re-engagement email R3 preheader."
source: "One tap keeps you on the list. Otherwise I'll stop."
platforms:
  - email
localizations:
  en: "One tap keeps you on the list. Otherwise I'll stop."
  ar: "ضغطة واحدة تُبقيك على القائمة. وإلا فسأتوقف."
  cs: "Jedno klepnutí a zůstanete na seznamu. Jinak přestanu."
  de: "Einmal tippen, und du bleibst auf der Liste. Sonst höre ich auf."
  el: "Ένα πάτημα και μένεις στη λίστα. Αλλιώς σταματάω."
  es: "Un toque y sigues en la lista. Si no, dejo de escribirte."
  es-419: "Un toque y sigues en la lista. Si no, dejo de escribirte."
  es-MX: "Un toque y sigues en la lista. Si no, dejo de escribirte."
  fr: "Un geste et tu restes sur la liste. Sinon, j'arrête."
  he: "הקשה אחת משאירה אתכם ברשימה. אחרת אפסיק."
  hi: "एक टैप से आप सूची में बने रहेंगे। वरना मैं भेजना बंद कर दूँगा।"
  id: "Satu ketukan membuatmu tetap di daftar. Kalau tidak, saya berhenti."
  it: "Un tocco e resti nella lista. Altrimenti smetto."
  ja: "ワンタップでリストに残れます。そうでなければ、ここでやめます。"
  ko: "한 번만 누르시면 목록에 남습니다. 아니면 여기서 그만 보내겠습니다."
  nl: "Eén tik en je blijft op de lijst. Anders stop ik."
  pl: "Jedno dotknięcie i zostajesz na liście. Inaczej przestanę."
  pt: "Um toque mantém você na lista. Se não, eu paro."
  pt-BR: "Um toque mantém você na lista. Se não, eu paro."
  pt-PT: "Com um toque, continua na lista. Caso contrário, eu paro."
  ru: "Одно касание, и вы остаётесь в списке. Иначе я перестану."
  sv: "Ett tryck så står du kvar på listan. Annars slutar jag."
  sw: "Mguso mmoja unakubakiza kwenye orodha. La sivyo nitaacha."
  th: "แตะครั้งเดียวเพื่ออยู่ในรายชื่อต่อ ไม่อย่างนั้นผมจะหยุดส่ง"
  uk: "Один дотик, і ви залишаєтеся в списку. Інакше я перестану."
  vi: "Một chạm giữ bạn trong danh sách. Nếu không, tôi sẽ dừng lại."
  zh: "点一下就能留在名单上。否则我就不再发了。"
  zh-HK: "點一下就能留在名單上。否則我就不再發了。"
