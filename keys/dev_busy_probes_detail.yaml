description: "Developer tools screen: explanatory subtext under the 'busy probes' control."
source: "Liveness pings fired at stalled exits; acquitted ones answered and were kept, the removals the probe prevented"
platforms:
  - android
localizations:
  ar: "اختبارات ping للتحقق من النشاط أُرسلت إلى المخارج المتوقفة؛ المخارج المُبرّأة ردّت وأُبقي عليها، أي عمليات الإزالة التي منعها الفحص"
  cs: "Pingy živosti odeslané zaseknutým výstupům; zproštěné odpověděly a zůstaly — odstranění, kterým sonda zabránila"
  de: "Lebenszeichen-Pings an hängende Exits; freigesprochene haben geantwortet und wurden behalten, also Entfernungen, die die Prüfung verhindert hat"
  el: "Ping ζωντάνιας προς κολλημένες εξόδους· όσες αθωώθηκαν απάντησαν και κρατήθηκαν — οι αφαιρέσεις που απέτρεψε ο ανιχνευτής"
  en: "Liveness pings fired at stalled exits; acquitted ones answered and were kept, the removals the probe prevented"
  es: "Pings de actividad enviados a salidas bloqueadas; las absueltas respondieron y se conservaron: son las eliminaciones que la sonda evitó"
  es-419: "Pings de actividad enviados a salidas trabadas; las absueltas respondieron y se conservaron: son las eliminaciones que la sonda evitó"
  es-MX: "Pings de actividad enviados a salidas trabadas; las absueltas respondieron y se conservaron: son las eliminaciones que la sonda evitó"
  fr: "Pings de vie envoyés aux sorties figées ; les acquittées ont répondu et ont été gardées — les retraits que la sonde a évités"
  he: "פינגים לבדיקת חיות שנשלחו ליציאות תקועות; אלה שזוכו ענו ונשמרו — ההסרות שהבדיקה מנעה"
  hi: "अटके एग्ज़िट को भेजे गए लाइवनेस पिंग; बरी हुए एग्ज़िट ने जवाब दिया और उन्हें रखा गया — ये वे निष्कासन हैं जिन्हें प्रोब ने रोका"
  id: "Ping keaktifan yang dikirim ke exit yang macet; yang dibebaskan menjawab dan dipertahankan — penghapusan yang dicegah oleh probe"
  it: "Ping di attività inviati alle uscite bloccate; quelle assolte hanno risposto e sono state tenute — le rimozioni che la sonda ha evitato"
  ja: "停止した出口に送った生存確認の ping。無罪となった出口は応答して維持されました。確認によって防がれた除外です"
  ko: "멈춘 출구에 보낸 생존 확인 ping입니다. 무혐의 처리된 출구는 응답해 유지되었으며, 점검이 막은 제외 횟수입니다"
  nl: "Levenstekenpings naar vastgelopen exits; vrijgesproken exits antwoordden en bleven behouden — de verwijderingen die de test voorkwam"
  pl: "Pingi życia wysłane do zablokowanych wyjść; uniewinnione odpowiedziały i zostały zachowane — to usunięcia, którym sonda zapobiegła"
  pt: "Pings de atividade enviados a saídas bloqueadas; as absolvidas responderam e foram mantidas — as remoções que a sonda evitou"
  pt-BR: "Pings de atividade enviados a saídas travadas; as absolvidas responderam e foram mantidas — as remoções que a sonda evitou"
  pt-PT: "Pings de atividade enviados a saídas bloqueadas; as absolvidas responderam e foram mantidas — as remoções que a sonda evitou"
  ru: "Пинги проверки активности, отправленные зависшим выходам; оправданные ответили и были сохранены — это удаления, которые предотвратила проба"
  sv: "Livstecken-pingar till låsta utgångar; frikända svarade och behölls — de borttagningar som sonden förhindrade"
  sw: "Ping za kukagua uhai zilizotumwa kwa njia za kutoka zilizokwama; zilizoachiliwa zilijibu na kubakizwa — hizi ndizo uondoaji ambao kipimo kilizuia"
  th: "ping ตรวจการทำงานที่ส่งไปยังทางออกที่ค้าง ทางออกที่พ้นผิดตอบกลับและถูกเก็บไว้ — คือการลบที่การทดสอบช่วยป้องกันไว้"
  uk: "Пінги живості, надіслані завислим виходам; виправдані відповіли й залишилися — це видалення, яким запобіг зонд"
  vi: "Các ping kiểm tra sống gửi tới điểm thoát bị kẹt; những điểm được minh oan đã trả lời và được giữ lại — đó là các lần loại bỏ mà thăm dò đã ngăn chặn"
  zh: "向停滞出口发送的存活 ping；判为无罪的出口已应答并被保留，即探测避免的移除"
  zh-HK: "向停滯出口發出的存活 ping；判為無罪的出口已回應並被保留，即探測避免了的移除"
