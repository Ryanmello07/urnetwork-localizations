description: "Developer page (Apple): note shown while disconnected."
source: "Connect to use the live connection tools. Diagnostics below work either way."
platforms:
  - apple
localizations:
  ar: "اتصل لاستخدام أدوات الاتصال الحي. أدوات التشخيص أدناه تعمل في الحالتين."
  cs: "Pro nástroje aktivního připojení se připojte. Diagnostika níže funguje v obou případech."
  de: "Verbinde dich, um die Werkzeuge für die aktive Verbindung zu nutzen. Die Diagnose unten funktioniert in beiden Fällen."
  el: "Συνδεθείτε για να χρησιμοποιήσετε τα εργαλεία της ενεργής σύνδεσης. Τα διαγνωστικά παρακάτω λειτουργούν σε κάθε περίπτωση."
  en: "Connect to use the live connection tools. Diagnostics below work either way."
  es: "Conéctate para usar las herramientas de la conexión activa. El diagnóstico de abajo funciona en cualquier caso."
  es-419: "Conéctate para usar las herramientas de la conexión activa. El diagnóstico de abajo funciona en cualquier caso."
  es-MX: "Conéctate para usar las herramientas de la conexión activa. El diagnóstico de abajo funciona en cualquier caso."
  fr: "Connectez-vous pour utiliser les outils de la connexion en cours. Les diagnostics ci-dessous fonctionnent dans tous les cas."
  he: "התחברו כדי להשתמש בכלים של החיבור הפעיל. האבחון שלמטה עובד בכל מקרה."
  hi: "लाइव कनेक्शन के टूल इस्तेमाल करने के लिए कनेक्ट करें। नीचे के डायग्नोस्टिक्स दोनों ही स्थितियों में काम करते हैं।"
  id: "Hubungkan untuk memakai alat koneksi aktif. Diagnostik di bawah berfungsi dalam kedua kondisi."
  it: "Connettiti per usare gli strumenti della connessione attiva. La diagnostica qui sotto funziona in ogni caso."
  ja: "稼働中の接続を操作するツールを使うには接続してください。以下の診断は接続の有無にかかわらず使えます。"
  ko: "활성 연결 도구를 사용하려면 연결하세요. 아래 진단은 연결 여부와 관계없이 작동합니다."
  nl: "Maak verbinding om de tools voor de actieve verbinding te gebruiken. De diagnose hieronder werkt altijd."
  pl: "Połącz się, aby używać narzędzi aktywnego połączenia. Diagnostyka poniżej działa w obu przypadkach."
  pt: "Ligue-se para usar as ferramentas da ligação ativa. O diagnóstico abaixo funciona em qualquer caso."
  pt-BR: "Conecte-se para usar as ferramentas da conexão ativa. O diagnóstico abaixo funciona de qualquer forma."
  pt-PT: "Ligue-se para usar as ferramentas da ligação ativa. O diagnóstico abaixo funciona em qualquer caso."
  ru: "Подключитесь, чтобы пользоваться инструментами активного соединения. Диагностика ниже работает в любом случае."
  sv: "Anslut för att använda verktygen för den aktiva anslutningen. Diagnostiken nedan fungerar i båda fallen."
  sw: "Unganisha ili kutumia zana za muunganisho unaoendelea. Uchunguzi ulio hapa chini hufanya kazi kwa hali zote mbili."
  th: "เชื่อมต่อเพื่อใช้เครื่องมือของการเชื่อมต่อที่ใช้งานอยู่ การวินิจฉัยด้านล่างใช้ได้ทั้งสองกรณี"
  uk: "Підключіться, щоб користуватися інструментами активного з’єднання. Діагностика нижче працює в будь-якому разі."
  vi: "Hãy kết nối để dùng các công cụ cho kết nối đang hoạt động. Phần chẩn đoán bên dưới vẫn dùng được trong cả hai trường hợp."
  zh: "连接后即可使用实时连接工具。下方的诊断功能在任何情况下都可用。"
  zh-HK: "連接後即可使用即時連線工具。下方的診斷功能在任何情況下都可用。"
