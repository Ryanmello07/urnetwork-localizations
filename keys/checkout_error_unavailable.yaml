description: "Checkout error in the desktop apps (the macOS direct download, Windows and Linux) when the ur.io checkout page hands back checkout_unavailable: the site cannot open Stripe's checkout right now (it has no Stripe key), so no payment form was shown and nothing was charged. The user cannot fix it; it may work later."
source: "Checkout isn't available right now. Please try again later."
platforms:
  - apple
  - windows
  - linux
