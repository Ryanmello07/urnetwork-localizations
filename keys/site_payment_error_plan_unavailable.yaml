description: "Checkout (ur.io's payment screens; the plan purchase in the F-Droid and dapp Android builds; the upgrade sheet in the macOS direct download, Windows and Linux): the server cannot sell this Pro plan right now (error.code plan_unavailable: no price or product is configured for it). Nothing was charged."
source: "This plan is not available right now. Try again later."
platforms:
  - site
  - android
  - apple
  - windows
  - linux
