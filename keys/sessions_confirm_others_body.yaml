description: "Sessions screen (Account > Sessions): body of the confirmation before Sign out all other sessions. Must not say that every device is signed out: anyone who has the sign-in details can sign in again."
source: "Every other session in this list will be signed out. This session stays signed in. Anyone who knows your sign-in details can still sign in again."
platforms:
  - apple
  - android
  - windows
  - linux
  - site
localizations:
  ar: "سيتم تسجيل الخروج من كل الجلسات الأخرى في هذه القائمة. ستبقى هذه الجلسة مسجَّلة الدخول. لا يزال بإمكان أي شخص يعرف بيانات تسجيل الدخول الخاصة بك تسجيل الدخول مجددًا."
  cs: "Všechny ostatní relace v tomto seznamu budou odhlášeny. Tato relace zůstane přihlášená. Kdokoli, kdo zná vaše přihlašovací údaje, se i tak může znovu přihlásit."
  de: "Alle anderen Sitzungen in dieser Liste werden abgemeldet. Diese Sitzung bleibt angemeldet. Wer deine Anmeldedaten kennt, kann sich trotzdem wieder anmelden."
  el: "Όλες οι άλλες συνεδρίες αυτής της λίστας θα αποσυνδεθούν. Αυτή η συνεδρία παραμένει συνδεδεμένη. Όποιος γνωρίζει τα στοιχεία σύνδεσής σας μπορεί ακόμη να συνδεθεί ξανά."
  en: "Every other session in this list will be signed out. This session stays signed in. Anyone who knows your sign-in details can still sign in again."
  es: "Se cerrarán todas las demás sesiones de esta lista. Esta sesión seguirá iniciada. Cualquiera que conozca tus datos de inicio de sesión podrá volver a iniciar sesión."
  es-419: "Se cerrarán todas las demás sesiones de esta lista. Esta sesión seguirá iniciada. Cualquiera que conozca tus datos de inicio de sesión podrá volver a iniciar sesión."
  es-MX: "Se cerrarán todas las demás sesiones de esta lista. Esta sesión seguirá iniciada. Cualquiera que conozca tus datos de inicio de sesión podrá volver a iniciar sesión."
  fr: "Toutes les autres sessions de cette liste seront déconnectées. Cette session reste connectée. Toute personne qui connaît vos identifiants peut toujours se reconnecter."
  he: "כל שאר ההפעלות ברשימה הזו ינותקו. ההפעלה הזו תישאר מחוברת. כל מי שמכיר את פרטי ההתחברות שלכם עדיין יכול להתחבר שוב."
  hi: "इस सूची के अन्य सभी सत्रों से साइन आउट हो जाएगा। यह सत्र साइन इन रहेगा। जो भी आपकी साइन-इन जानकारी जानता है, वह अब भी फिर से साइन इन कर सकता है।"
  id: "Semua sesi lain dalam daftar ini akan dikeluarkan. Sesi ini tetap masuk. Siapa pun yang mengetahui detail masuk Anda tetap dapat masuk kembali."
  it: "Tutte le altre sessioni di questo elenco verranno chiuse. Questa sessione resta attiva. Chiunque conosca i tuoi dati di accesso può comunque accedere di nuovo."
  ja: "この一覧にある他のすべてのセッションからサインアウトします。このセッションはサインインしたままです。サインイン情報を知っている人は、それでも再びサインインできます。"
  ko: "이 목록의 다른 모든 세션에서 로그아웃됩니다. 현재 세션은 로그인 상태로 유지됩니다. 로그인 정보를 아는 사람은 여전히 다시 로그인할 수 있습니다."
  nl: "Alle andere sessies in deze lijst worden uitgelogd. Deze sessie blijft ingelogd. Iedereen die je inloggegevens kent, kan nog steeds opnieuw inloggen."
  pl: "Wszystkie inne sesje z tej listy zostaną wylogowane. Ta sesja pozostanie zalogowana. Każdy, kto zna Twoje dane logowania, nadal może zalogować się ponownie."
  pt: "Todas as outras sessões desta lista serão terminadas. Esta sessão continua iniciada. Quem souber os seus dados de início de sessão pode voltar a iniciar sessão."
  pt-BR: "Todas as outras sessões desta lista serão encerradas. Esta sessão continua conectada. Quem souber seus dados de login ainda pode entrar novamente."
  pt-PT: "Todas as outras sessões desta lista serão terminadas. Esta sessão continua iniciada. Quem souber os seus dados de início de sessão pode voltar a iniciar sessão."
  ru: "Все остальные сеансы в этом списке будут завершены. Этот сеанс останется активным. Любой, кто знает ваши данные для входа, всё равно сможет войти снова."
  sv: "Alla andra sessioner i den här listan loggas ut. Den här sessionen förblir inloggad. Den som känner till dina inloggningsuppgifter kan fortfarande logga in igen."
  sw: "Utatoka kwenye vipindi vingine vyote vilivyo kwenye orodha hii. Kipindi hiki kitabaki ndani. Mtu yeyote anayejua maelezo yako ya kuingia bado anaweza kuingia tena."
  th: "เซสชันอื่นทั้งหมดในรายการนี้จะออกจากระบบ เซสชันนี้จะยังคงลงชื่อเข้าใช้อยู่ ผู้ที่รู้ข้อมูลการลงชื่อเข้าใช้ของคุณยังลงชื่อเข้าใช้อีกครั้งได้"
  uk: "Усі інші сеанси в цьому списку буде завершено. Цей сеанс залишиться активним. Будь-хто, хто знає ваші дані для входу, однаково зможе увійти знову."
  vi: "Tất cả các phiên khác trong danh sách này sẽ bị đăng xuất. Phiên này vẫn giữ trạng thái đăng nhập. Bất kỳ ai biết thông tin đăng nhập của bạn vẫn có thể đăng nhập lại."
  zh: "此列表中的所有其他会话都将退出登录。当前会话将保持登录状态。任何知道您登录信息的人仍可再次登录。"
  zh-HK: "此列表中的所有其他工作階段都會登出。目前工作階段會保持登入。任何知道你登入資料的人仍可再次登入。"
