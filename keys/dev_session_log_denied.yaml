  pl: "To konto może sterować usługą, ale nie może czytać jej logu."
  pt: "Esta conta pode controlar o serviço, mas não pode ler o respetivo log."
  pt-BR: "Esta conta pode controlar o serviço, mas não pode ler o log dele."
  pt-PT: "Esta conta pode controlar o serviço, mas não pode ler o respetivo log."
