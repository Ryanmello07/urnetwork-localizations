  cs: "Tento účet smí službu ovládat, ale nesmí číst její log."
  de: "Dieses Konto darf den Dienst steuern, aber nicht sein Log lesen."
  el: "Αυτός ο λογαριασμός μπορεί να χειρίζεται την υπηρεσία, αλλά όχι να διαβάζει το αρχείο καταγραφής της."
  en: "This account may drive the daemon but may not read its log."
  es: "Esta cuenta puede controlar el servicio, pero no leer su registro."
