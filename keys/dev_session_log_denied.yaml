  es-MX: "Esta cuenta puede controlar el servicio, pero no leer su registro."
  fr: "Ce compte peut piloter le service, mais pas lire son journal."
  he: "החשבון הזה יכול להפעיל את השירות, אבל לא לקרוא את הלוג שלו."
