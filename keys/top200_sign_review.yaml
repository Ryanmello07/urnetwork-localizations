description: "Top 200 sign screen: shown above the parsed binding's values before the Sign button."
source: "Check that the fleet ID, hotkey and epochs match the Top 200 page before you sign."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "تأكّد من أن معرّف الأسطول والمفتاح الساخن والحِقَب تطابق صفحة أفضل 200 قبل التوقيع."
  cs: "Před podpisem zkontrolujte, že ID flotily, hotkey a epochy odpovídají stránce Top 200."
  de: "Prüfe vor dem Signieren, dass Flotten-ID, Hotkey und Epochen mit der Top-200-Seite übereinstimmen."
  el: "Πριν υπογράψετε, ελέγξτε ότι το ID στόλου, το hotkey και οι εποχές ταιριάζουν με τη σελίδα Top 200."
  en: "Check that the fleet ID, hotkey and epochs match the Top 200 page before you sign."
  es: "Antes de firmar, comprueba que el ID de flota, la hotkey y las épocas coinciden con la página Top 200."
  es-419: "Antes de firmar, comprueba que el ID de flota, la hotkey y las épocas coinciden con la página Top 200."
  es-MX: "Antes de firmar, comprueba que el ID de flota, la hotkey y las épocas coinciden con la página Top 200."
  fr: "Avant de signer, vérifiez que l’ID de flotte, la hotkey et les époques correspondent à la page Top 200."
  he: "לפני החתימה, ודאו שמזהה הצי, ה-hotkey והתקופות תואמים לדף Top 200."
  hi: "हस्ताक्षर करने से पहले जाँच लें कि फ़्लीट ID, हॉटकी और एपॉक टॉप 200 पेज से मेल खाते हैं।"
  id: "Sebelum menandatangani, pastikan ID armada, hotkey, dan epoch cocok dengan halaman Top 200."
  it: "Prima di firmare, controlla che ID della flotta, hotkey ed epoche corrispondano alla pagina Top 200."
  ja: "署名する前に、フリートID、ホットキー、エポックがトップ 200 ページと一致していることを確認してください。"
  ko: "서명하기 전에 플릿 ID, 핫키, 에포크가 Top 200 페이지와 일치하는지 확인하세요."
  nl: "Controleer voor het ondertekenen of de vloot-ID, hotkey en epochs overeenkomen met de Top 200-pagina."
  pl: "Przed podpisaniem sprawdź, czy ID floty, hotkey i epoki zgadzają się ze stroną Top 200."
  pt: "Antes de assinar, confira se o ID da frota, a hotkey e as épocas correspondem à página Top 200."
  pt-BR: "Antes de assinar, confira se o ID da frota, a hotkey e as épocas correspondem à página Top 200."
  pt-PT: "Antes de assinar, confirme que o ID da frota, a hotkey e as épocas correspondem à página Top 200."
  ru: "Перед подписью убедитесь, что ID парка, hotkey и эпохи совпадают со страницей Топ-200."
  sv: "Kontrollera innan du signerar att flott-ID, hotkey och epoker stämmer med Topp 200-sidan."
  sw: "Kabla ya kusaini, hakikisha kitambulisho cha kundi, hotkey na epoch zinalingana na ukurasa wa Top 200."
  th: "ก่อนลงนาม ตรวจสอบว่า ID ฟลีต ฮอตคีย์ และ epoch ตรงกับหน้า Top 200"
  uk: "Перед підписом переконайтеся, що ID парку, hotkey та епохи збігаються зі сторінкою Топ-200."
  vi: "Trước khi ký, hãy kiểm tra ID đội máy, hotkey và các epoch khớp với trang Top 200."
  zh: "签名前，请确认设备群 ID、hotkey 和纪元与前 200 名页面一致。"
  zh-HK: "簽署前，請確認裝置群 ID、hotkey 和紀元與前 200 名頁面一致。"
