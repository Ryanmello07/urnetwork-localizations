description: "Hint under the Ignore battery optimizations row in the Google Play build. Tapping the row opens Android's system battery optimization list, which by default shows only apps that are not optimized; the quoted labels are Android's own labels for the list filter and the per-app choice."
source: "Tap to open Android's battery optimization list. If URnetwork isn't listed, switch the filter to “All apps”, then choose URnetwork and “Don't optimize”."
platforms:
  - android
localizations:
  ar: "اضغط لفتح قائمة تحسين البطارية في Android. إذا لم يظهر URnetwork، فغيّر عامل التصفية إلى «كل التطبيقات»، ثم اختر URnetwork و«عدم التحسين»."
  cs: "Klepnutím otevřete seznam optimalizace baterie v Androidu. Pokud URnetwork v seznamu není, přepněte filtr na „Všechny aplikace“ a pak vyberte URnetwork a „Neoptimalizovat“."
  de: "Tippe, um die Akku-Optimierungsliste von Android zu öffnen. Wenn URnetwork nicht aufgeführt ist, stelle den Filter auf „Alle Apps“ und wähle dann URnetwork und „Nicht optimieren“."
  el: "Πατήστε για να ανοίξει η λίστα βελτιστοποίησης μπαταρίας του Android. Αν το URnetwork δεν εμφανίζεται, αλλάξτε το φίλτρο σε «Όλες οι εφαρμογές» και, στη συνέχεια, επιλέξτε το URnetwork και «Χωρίς βελτιστοποίηση»."
  en: "Tap to open Android's battery optimization list. If URnetwork isn't listed, switch the filter to “All apps”, then choose URnetwork and “Don't optimize”."
  es: "Toca para abrir la lista de optimización de batería de Android. Si URnetwork no aparece, cambia el filtro a «Todas las aplicaciones» y luego elige URnetwork y «No optimizar»."
  es-419: "Toca para abrir la lista de optimización de batería de Android. Si URnetwork no aparece, cambia el filtro a \"Todas las apps\" y luego elige URnetwork y \"No optimizar\"."
  es-MX: "Toca para abrir la lista de optimización de batería de Android. Si URnetwork no aparece, cambia el filtro a \"Todas las apps\" y luego elige URnetwork y \"No optimizar\"."
  fr: "Touchez pour ouvrir la liste d’optimisation de la batterie d’Android. Si URnetwork n’y figure pas, réglez le filtre sur « Toutes les applications », puis choisissez URnetwork et « Ne pas optimiser »."
  he: "הקש כדי לפתוח את רשימת אופטימיזציית הסוללה של Android. אם URnetwork לא מופיעה ברשימה, שנה את המסנן ל\"כל האפליקציות\", ואז בחר ב-URnetwork וב\"ללא אופטימיזציה\"."
  hi: "Android की बैटरी ऑप्टिमाइज़ेशन सूची खोलने के लिए टैप करें। अगर URnetwork सूची में नहीं है, तो फ़िल्टर को \"सभी ऐप्लिकेशन\" पर बदलें, फिर URnetwork और \"ऑप्टिमाइज़ न करें\" चुनें।"
  id: "Ketuk untuk membuka daftar pengoptimalan baterai Android. Jika URnetwork tidak tercantum, ubah filter ke \"Semua aplikasi\", lalu pilih URnetwork dan \"Jangan optimalkan\"."
  it: "Tocca per aprire l'elenco di ottimizzazione della batteria di Android. Se URnetwork non è presente, imposta il filtro su \"Tutte le app\", quindi scegli URnetwork e \"Non ottimizzare\"."
  ja: "タップすると Android の電池の最適化リストが開きます。URnetwork が表示されない場合は、フィルタを「すべてのアプリ」に切り替えてから、URnetwork を選んで「最適化しない」を選択してください。"
  ko: "탭하여 Android의 배터리 최적화 목록을 엽니다. URnetwork가 목록에 없으면 필터를 '모든 앱'으로 바꾼 다음 URnetwork를 선택하고 '최적화 안함'을 선택하세요."
  nl: "Tik om de lijst voor batterijoptimalisatie van Android te openen. Staat URnetwork er niet tussen, zet het filter dan op ‘Alle apps’ en kies daarna URnetwork en ‘Niet optimaliseren’."
  pl: "Dotknij, aby otworzyć listę optymalizacji baterii w Androidzie. Jeśli URnetwork nie ma na liście, zmień filtr na „Wszystkie aplikacje”, a następnie wybierz URnetwork i „Nie optymalizuj”."
  pt: "Toque para abrir a lista de otimização da bateria do Android. Se a URnetwork não aparecer, mude o filtro para \"Todas as apps\" e, em seguida, escolha URnetwork e \"Não otimizar\"."
  pt-BR: "Toque para abrir a lista de otimização de bateria do Android. Se o URnetwork não aparecer, mude o filtro para \"Todos os apps\" e depois escolha URnetwork e \"Não otimizar\"."
  pt-PT: "Toque para abrir a lista de otimização da bateria do Android. Se a URnetwork não aparecer, mude o filtro para \"Todas as apps\" e, em seguida, escolha URnetwork e \"Não otimizar\"."
  ru: "Нажмите, чтобы открыть список оптимизации батареи Android. Если URnetwork нет в списке, переключите фильтр на «Все приложения», затем выберите URnetwork и «Не экономить»."
  sv: "Tryck för att öppna Androids lista för batterioptimering. Om URnetwork inte visas byter du filtret till ”Alla appar” och väljer sedan URnetwork och ”Optimera inte”."
  sw: "Gusa ili kufungua orodha ya uboreshaji wa betri ya Android. Ikiwa URnetwork haipo kwenye orodha, badilisha kichujio kiwe \"Programu zote\", kisha uchague URnetwork na \"Usiboreshe\"."
  th: "แตะเพื่อเปิดรายการการเพิ่มประสิทธิภาพแบตเตอรี่ของ Android หากไม่พบ URnetwork ในรายการ ให้เปลี่ยนตัวกรองเป็น \"แอปทั้งหมด\" แล้วเลือก URnetwork และ \"ไม่ต้องเพิ่มประสิทธิภาพ\""
  uk: "Торкніться, щоб відкрити список оптимізації батареї Android. Якщо URnetwork немає у списку, перемкніть фільтр на «Усі застосунки», а потім виберіть URnetwork і «Не оптимізувати»."
  vi: "Nhấn để mở danh sách tối ưu hóa pin của Android. Nếu không thấy URnetwork trong danh sách, hãy chuyển bộ lọc sang \"Tất cả ứng dụng\", sau đó chọn URnetwork và \"Không tối ưu hóa\"."
  zh: "点按即可打开 Android 的电池优化列表。如果列表中没有 URnetwork，请将筛选条件切换为“所有应用”，然后选择 URnetwork 并选择“不优化”。"
  zh-HK: "輕按即可開啟 Android 的電池優化清單。如果清單中沒有 URnetwork，請將篩選條件切換為「所有應用程式」，然後選擇 URnetwork 並選擇「不要優化」。"
