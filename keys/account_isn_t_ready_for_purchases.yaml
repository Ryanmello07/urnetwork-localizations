description: "Shown when a purchase is refused before contacting the store because the account is not ready: on apple the networkId is missing or unparseable (Shared/ViewModels/AppStoreSubscriptionManager.swift), on android the active network space has no api yet (the Stripe sheet and pay page purchasers). The purchase could never be credited to anyone. This used to be a silent no-op."
source: "Your account isn't ready for purchases. Please restart the app and try again."
platforms:
  - android
  - apple
localizations:
  ar: "حسابك غير جاهز لعمليات الشراء بعد. يرجى إعادة تشغيل التطبيق والمحاولة مرة أخرى."
  cs: "Váš účet zatím není připraven na nákupy. Restartujte aplikaci a zkuste to znovu."
  de: "Dein Konto ist noch nicht für Käufe bereit. Bitte starte die App neu und versuche es erneut."
  el: "Ο λογαριασμός σας δεν είναι ακόμη έτοιμος για αγορές. Επανεκκινήστε την εφαρμογή και δοκιμάστε ξανά."
  en: "Your account isn't ready for purchases. Please restart the app and try again."
  es: "Tu cuenta aún no está lista para compras. Reinicia la app e inténtalo de nuevo."
  es-419: "Tu cuenta todavía no está lista para compras. Reinicia la app e inténtalo de nuevo."
  es-MX: "Tu cuenta todavía no está lista para compras. Reinicia la app e inténtalo de nuevo."
  fr: "Votre compte n’est pas encore prêt pour les achats. Redémarrez l’app et réessayez."
  he: "החשבון שלכם עדיין לא מוכן לרכישות. הפעילו מחדש את האפליקציה ונסו שוב."
  hi: "आपका खाता अभी खरीदारी के लिए तैयार नहीं है। ऐप को फिर से शुरू करें और दोबारा कोशिश करें।"
  id: "Akun Anda belum siap untuk pembelian. Mulai ulang aplikasi dan coba lagi."
  it: "Il tuo account non è ancora pronto per gli acquisti. Riavvia l’app e riprova."
  ja: "アカウントはまだ購入できる状態になっていません。アプリを再起動してもう一度お試しください。"
  ko: "계정이 아직 구매할 준비가 되지 않았습니다. 앱을 다시 시작한 후 다시 시도하세요."
  nl: "Je account is nog niet klaar voor aankopen. Start de app opnieuw en probeer het nog eens."
  pl: "Twoje konto nie jest jeszcze gotowe do zakupów. Uruchom ponownie aplikację i spróbuj jeszcze raz."
  pt: "A sua conta ainda não está pronta para compras. Reinicie a app e tente novamente."
  pt-BR: "Sua conta ainda não está pronta para compras. Reinicie o app e tente novamente."
  pt-PT: "A sua conta ainda não está pronta para compras. Reinicie a app e tente novamente."
  ru: "Ваш аккаунт пока не готов к покупкам. Перезапустите приложение и попробуйте снова."
  sv: "Ditt konto är inte redo för köp än. Starta om appen och försök igen."
  sw: "Akaunti yako bado haiko tayari kwa ununuzi. Anzisha upya programu kisha ujaribu tena."
  th: "บัญชีของคุณยังไม่พร้อมสำหรับการซื้อ โปรดรีสตาร์ทแอปแล้วลองอีกครั้ง"
  uk: "Ваш обліковий запис ще не готовий до покупок. Перезапустіть застосунок і спробуйте ще раз."
  vi: "Tài khoản của bạn chưa sẵn sàng để mua hàng. Hãy khởi động lại ứng dụng và thử lại."
  zh: "您的账户暂时无法进行购买。请重启应用后重试。"
  zh-HK: "你的帳戶暫時未能進行購買。請重新啟動應用程式後再試。"
