description: "Shown when a purchase is refused before contacting the store because the account is not ready: on apple the networkId is missing or unparseable (Shared/ViewModels/AppStoreSubscriptionManager.swift), on android the active network space has no api yet (the Stripe sheet and pay page purchasers). The purchase could never be credited to anyone. This used to be a silent no-op."
source: "Your account isn't ready for purchases. Please restart the app and try again."
platforms:
  - android
  - apple
localizations:
  ar: "حسابك غير جاهز لعمليات الشراء بعد. يرجى إعادة تشغيل التطبيق والمحاولة مرة أخرى."
  de: "Dein Konto ist noch nicht für Käufe bereit. Bitte starte die App neu und versuche es erneut."
  en: "Your account isn't ready for purchases. Please restart the app and try again."
  es: "Tu cuenta aún no está lista para compras. Reinicia la app e inténtalo de nuevo."
  ru: "Ваш аккаунт пока не готов к покупкам. Перезапустите приложение и попробуйте снова."
  zh: "您的账户暂时无法进行购买。请重启应用后重试。"
