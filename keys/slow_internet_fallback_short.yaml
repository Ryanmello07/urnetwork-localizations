description: "Replaces \"Poor signal\" in the small pill at the top right of the connect screen on iPhone, iPad, Mac, Android, Windows and Linux while URnetwork carries the traffic over a slower fallback (backup) connection, because its usual connection is blocked or unavailable on this network. A status tag beside a small tunnel icon and the delay numbers: one short word, two at most."
