description: "Developer tools screen: explanatory subtext under the 'removal budget count' control."
source: "How many verdict removals are allowed per window before the rest are deferred; a burst is more likely one local cause than many failures. Off removes without limit"
platforms:
  - android
localizations:
  ar: "عدد عمليات الإزالة بموجب الأحكام المسموح بها في كل نافذة قبل تأجيل الباقي؛ فالموجة المفاجئة غالبًا ما يكون سببها محليًا واحدًا لا أعطالًا كثيرة. عند الإيقاف، تتم الإزالة دون حد"
  cs: "Kolik odstranění na základě verdiktu je povoleno za okno, než se zbytek odloží; nával má spíš jednu místní příčinu než mnoho selhání. Vypnuto odstraňuje bez omezení"
  de: "Wie viele Entfernungen durch Urteile pro Fenster erlaubt sind, bevor der Rest zurückgestellt wird; eine Häufung hat eher eine lokale Ursache als viele Ausfälle. Aus: entfernt ohne Limit"
  el: "Πόσες αφαιρέσεις λόγω ετυμηγορίας επιτρέπονται ανά παράθυρο πριν αναβληθούν οι υπόλοιπες· ένα κύμα οφείλεται πιθανότερα σε μία τοπική αιτία παρά σε πολλές αστοχίες. Η απενεργοποίηση αφαιρεί χωρίς όριο"
  en: "How many verdict removals are allowed per window before the rest are deferred; a burst is more likely one local cause than many failures. Off removes without limit"
  es: "Cuántas eliminaciones por veredicto se permiten por ventana antes de aplazar el resto; una ráfaga suele deberse a una causa local más que a muchos fallos. Si está desactivado, se elimina sin límite"
  es-419: "Cuántas eliminaciones por veredicto se permiten por ventana antes de aplazar el resto; una ráfaga suele deberse a una causa local más que a muchas fallas. Si está desactivado, se elimina sin límite"
  es-MX: "Cuántas eliminaciones por veredicto se permiten por ventana antes de aplazar el resto; una ráfaga suele deberse a una causa local más que a muchas fallas. Si está desactivado, se elimina sin límite"
  fr: "Combien de retraits sur verdict sont permis par fenêtre avant que les suivants soient différés ; une rafale vient plus probablement d’une cause locale que de nombreuses pannes. Désactivé retire sans limite"
  he: "כמה הסרות בעקבות הכרעה מותרות בכל חלון לפני שהשאר נדחות; פרץ נובע בסבירות גבוהה יותר מסיבה מקומית אחת מאשר מכשלים רבים. כיבוי מסיר ללא הגבלה"
  hi: "बाकी को टालने से पहले हर विंडो में फ़ैसले पर आधारित कितने निष्कासन की अनुमति है; अचानक बौछार कई विफलताओं के बजाय किसी एक स्थानीय कारण से होने की ज़्यादा संभावना है। बंद करने पर बिना सीमा के हटाया जाता है"
  id: "Berapa banyak penghapusan karena vonis yang diizinkan per jendela sebelum sisanya ditunda; lonjakan lebih mungkin berasal dari satu penyebab lokal daripada banyak kegagalan. Nonaktif menghapus tanpa batas"
  it: "Quante rimozioni da verdetto sono consentite per finestra prima che le altre vengano rinviate; una raffica dipende più probabilmente da una causa locale che da molti guasti. Disattivato rimuove senza limite"
  ja: "判定による除外をウィンドウごとに何件まで許可し、残りを延期するか。一斉発生は多数の障害よりもローカルの原因 1 つによる可能性が高いためです。オフにすると上限なく除外します"
  ko: "나머지를 미루기 전에 창마다 허용되는 판정 기반 제외 횟수입니다. 한꺼번에 몰리는 경우는 여러 장애보다 하나의 로컬 원인일 가능성이 큽니다. 끄면 제한 없이 제외합니다"
  nl: "Hoeveel verwijderingen op basis van een oordeel per venster zijn toegestaan voordat de rest wordt uitgesteld; een golf heeft eerder één lokale oorzaak dan veel storingen. Uit verwijdert zonder limiet"
  pl: "Ile usunięć na podstawie werdyktu jest dozwolonych w oknie, zanim reszta zostanie odłożona; seria ma raczej jedną lokalną przyczynę niż wiele awarii. Wyłączenie usuwa bez limitu"
  pt: "Quantas remoções por veredicto são permitidas por janela antes de o resto ser adiado; uma rajada tem mais probabilidade de ser uma causa local do que muitas falhas. Desativado remove sem limite"
  pt-BR: "Quantas remoções por veredito são permitidas por janela antes que o resto seja adiado; uma rajada tem mais chance de ser uma causa local do que muitas falhas. Desativado remove sem limite"
  pt-PT: "Quantas remoções por veredicto são permitidas por janela antes de o resto ser adiado; uma rajada tem mais probabilidade de ser uma causa local do que muitas falhas. Desativado remove sem limite"
  ru: "Сколько удалений по вердикту разрешено за окно, прежде чем остальные откладываются; всплеск скорее вызван одной локальной причиной, чем множеством сбоев. Если выключено, удаление без ограничений"
  sv: "Hur många borttagningar efter dom som tillåts per fönster innan resten skjuts upp; en skur beror troligare på en lokal orsak än på många fel. Av tar bort utan gräns"
  sw: "Idadi ya uondoaji wa kihukumu unaoruhusiwa kwa kila dirisha kabla ya mengine kuahirishwa; mlipuko una uwezekano mkubwa wa kuwa na chanzo kimoja cha ndani kuliko hitilafu nyingi. Kuzima kunaondoa bila kikomo"
  th: "จำนวนการลบตามคำตัดสินที่อนุญาตต่อช่วงเวลาก่อนเลื่อนส่วนที่เหลือ การลบพร้อมกันจำนวนมากมักมาจากสาเหตุภายในเครื่องเพียงอย่างเดียวมากกว่าความล้มเหลวหลายครั้ง ปิดเพื่อลบไม่จำกัด"
  uk: "Скільки видалень за вердиктом дозволено за вікно, перш ніж решту буде відкладено; сплеск радше має одну локальну причину, ніж багато збоїв. Вимкнення видаляє без обмежень"
  vi: "Bao nhiêu lần loại bỏ theo phán quyết được phép trong mỗi cửa sổ trước khi phần còn lại bị hoãn; một đợt dồn dập thường do một nguyên nhân cục bộ hơn là nhiều sự cố. Tắt sẽ loại bỏ không giới hạn"
  zh: "每个窗口内允许基于判定执行的移除次数，超出部分将被推迟；突发的大量移除更可能源于单一本地原因，而非许多故障。关闭时不限制移除"
  zh-HK: "每個視窗內容許按判定執行的移除次數，超出部分會被押後；突發的大量移除較可能源於單一本地原因，而非許多故障。關閉時不限制移除"
