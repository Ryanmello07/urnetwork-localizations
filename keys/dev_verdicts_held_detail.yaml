description: "Developer tools screen: explanatory subtext under the 'verdicts held' control."
source: "Convictions withheld because the phone's own uplink, not the provider, was silent (uplink / transport)"
platforms:
  - android
localizations:
  ar: "إدانات عُلّقت لأن الوصلة الصاعدة للهاتف نفسه، وليس المزود، كانت صامتة (الوصلة الصاعدة / بروتوكول النقل)"
  cs: "Odsouzení zadržená, protože ztichl vlastní uplink telefonu, ne poskytovatel (uplink / transport)"
  de: "Verurteilungen, die zurückgehalten wurden, weil der eigene Uplink des Telefons und nicht der Anbieter still war (Uplink / Transport)"
  el: "Καταδίκες που συγκρατήθηκαν επειδή σιωπούσε η ανερχόμενη ζεύξη του ίδιου του τηλεφώνου, όχι ο πάροχος (ανερχόμενη ζεύξη / μεταφορά)"
  en: "Convictions withheld because the phone's own uplink, not the provider, was silent (uplink / transport)"
  es: "Condenas retenidas porque el enlace ascendente del propio teléfono, y no el proveedor, estaba en silencio (enlace ascendente / transporte)"
  es-419: "Condenas retenidas porque el enlace ascendente del propio teléfono, y no el proveedor, estaba en silencio (enlace ascendente / transporte)"
  es-MX: "Condenas retenidas porque el enlace ascendente del propio teléfono, y no el proveedor, estaba en silencio (enlace ascendente / transporte)"
  fr: "Condamnations retenues parce que la liaison montante du téléphone lui-même, et non le fournisseur, était silencieuse (liaison montante / transport)"
  he: "הרשעות שעוכבו כי הערוץ העולה של הטלפון עצמו, ולא הספק, שתק (ערוץ עולה / תעבורה)"
  hi: "सज़ाएँ जो इसलिए रोकी गईं क्योंकि प्रदाता नहीं, बल्कि फ़ोन का अपना अपलिंक चुप था (अपलिंक / ट्रांसपोर्ट)"
  id: "Vonis yang ditahan karena uplink ponsel itu sendiri, bukan penyedia, sedang diam (uplink / transport)"
  it: "Condanne trattenute perché era in silenzio l’uplink del telefono stesso, non il provider (uplink / trasporto)"
  ja: "プロバイダーではなく端末自身のアップリンクが無通信だったため保留された判定（アップリンク / トランスポート）"
  ko: "제공자가 아니라 휴대폰 자체의 업링크가 무응답이어서 보류된 판정(업링크 / 전송)"
  nl: "Veroordelingen die zijn tegengehouden omdat de eigen uplink van de telefoon stil was, niet de provider (uplink / transport)"
  pl: "Wyroki wstrzymane, bo milczało łącze w górę samego telefonu, a nie dostawca (łącze w górę / transport)"
  pt: "Condenações retidas porque o próprio uplink do telemóvel, e não o fornecedor, estava em silêncio (uplink / transporte)"
  pt-BR: "Condenações retidas porque o próprio uplink do telefone, e não o provedor, estava em silêncio (uplink / transporte)"
  pt-PT: "Condenações retidas porque o próprio uplink do telemóvel, e não o fornecedor, estava em silêncio (uplink / transporte)"
  ru: "Осуждения, отложенные потому, что молчал собственный аплинк телефона, а не провайдер (аплинк / транспорт)"
  sv: "Fällningar som hölls tillbaka eftersom telefonens egen upplänk, inte leverantören, var tyst (upplänk / transport)"
  sw: "Hukumu zilizozuiliwa kwa sababu uplink ya simu yenyewe, si mtoa huduma, ilikuwa kimya (uplink / usafirishaji)"
  th: "คำตัดสินที่ถูกระงับเพราะอัปลิงก์ของโทรศัพท์เองเงียบ ไม่ใช่ผู้ให้บริการ (อัปลิงก์ / การส่งข้อมูล)"
  uk: "Вироки, утримані тому, що мовчав висхідний канал самого телефона, а не провайдер (висхідний канал / транспорт)"
  vi: "Các kết luận lỗi bị giữ lại vì đường lên của chính điện thoại im lặng, không phải nhà cung cấp (đường lên / truyền tải)"
  zh: "因手机自身上行（而非提供商）静默而暂缓的定罪（上行 / 传输方式）"
  zh-HK: "因手機本身的上行（而非供應商）靜默而暫緩的判罪（上行 / 傳輸方式）"
