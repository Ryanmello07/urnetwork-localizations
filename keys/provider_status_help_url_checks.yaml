description: "Provider status 'Why?' list: explanation under the network checks."
source: "Test sites that loaded through this connection in the last 8 hours. Most must load; filtering by your internet provider lowers it."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "مواقع الاختبار التي تم تحميلها عبر هذا الاتصال خلال آخر 8 ساعات. يجب أن يُحمَّل معظمها؛ والحجب من مزود الإنترنت لديك يخفض النتيجة."
  cs: "Testovací weby, které se přes toto připojení načetly za posledních 8 hodin. Většina se musí načíst; filtrování ze strany vašeho poskytovatele internetu výsledek snižuje."
  de: "Testseiten, die in den letzten 8 Stunden über diese Verbindung geladen wurden. Die meisten müssen laden; Filter deines Internetanbieters senken den Wert."
  el: "Δοκιμαστικοί ιστότοποι που φόρτωσαν μέσω αυτής της σύνδεσης τις τελευταίες 8 ώρες. Οι περισσότεροι πρέπει να φορτώνουν· το φιλτράρισμα από τον πάροχο διαδικτύου σας μειώνει το αποτέλεσμα."
  en: "Test sites that loaded through this connection in the last 8 hours. Most must load; filtering by your internet provider lowers it."
  es: "Sitios de prueba que cargaron a través de esta conexión en las últimas 8 horas. La mayoría debe cargar; el filtrado de tu proveedor de internet lo reduce."
  es-419: "Sitios de prueba que cargaron a través de esta conexión en las últimas 8 horas. La mayoría debe cargar; el filtrado de tu proveedor de internet lo reduce."
  es-MX: "Sitios de prueba que cargaron a través de esta conexión en las últimas 8 horas. La mayoría debe cargar; el filtrado de tu proveedor de internet lo reduce."
  fr: "Sites de test chargés via cette connexion au cours des 8 dernières heures. La plupart doivent se charger ; le filtrage par votre fournisseur d'accès le fait baisser."
  he: "אתרי בדיקה שנטענו דרך החיבור הזה ב-8 השעות האחרונות. רובם חייבים להיטען; סינון של ספק האינטרנט שלך מוריד את התוצאה."
  hi: "पिछले 8 घंटों में इस कनेक्शन से लोड हुई टेस्ट साइटें। अधिकांश का लोड होना ज़रूरी है; आपके इंटरनेट प्रदाता की फ़िल्टरिंग इसे घटाती है।"
  id: "Situs uji yang berhasil dimuat melalui koneksi ini dalam 8 jam terakhir. Sebagian besar harus termuat; pemfilteran oleh penyedia internet Anda menurunkannya."
  it: "Siti di test caricati tramite questa connessione nelle ultime 8 ore. La maggior parte deve caricarsi; i filtri del tuo provider internet riducono il risultato."
  ja: "過去8時間にこの接続を通じて読み込めたテストサイト。大半が読み込める必要があります。インターネットプロバイダーによるフィルタリングがあると下がります。"
  ko: "최근 8시간 동안 이 연결을 통해 로드된 테스트 사이트입니다. 대부분이 로드되어야 하며, 인터넷 서비스 제공업체의 필터링이 있으면 낮아집니다."
  nl: "Testsites die de afgelopen 8 uur via deze verbinding laadden. De meeste moeten laden; filtering door je internetprovider verlaagt dit."
  pl: "Strony testowe załadowane przez to połączenie w ciągu ostatnich 8 godzin. Większość musi się załadować; filtrowanie przez Twojego dostawcę internetu obniża wynik."
  pt: "Sites de teste que carregaram através desta ligação nas últimas 8 horas. A maioria tem de carregar; a filtragem do seu fornecedor de internet faz descer o resultado."
  pt-BR: "Sites de teste que carregaram por esta conexão nas últimas 8 horas. A maioria precisa carregar; a filtragem do seu provedor de internet reduz o resultado."
  pt-PT: "Sites de teste que carregaram através desta ligação nas últimas 8 horas. A maioria tem de carregar; a filtragem do seu fornecedor de internet faz descer o resultado."
  ru: "Тестовые сайты, загрузившиеся через это подключение за последние 8 часов. Загружаться должно большинство; фильтрация у вашего интернет-провайдера снижает результат."
  sv: "Testsajter som laddades via den här anslutningen de senaste 8 timmarna. De flesta måste laddas; filtrering hos din internetleverantör sänker värdet."
  sw: "Tovuti za majaribio zilizopakia kupitia muunganisho huu katika saa 8 zilizopita. Nyingi lazima zipakie; uchujaji wa mtoa huduma wako wa intaneti hupunguza matokeo."
  th: "เว็บไซต์ทดสอบที่โหลดผ่านการเชื่อมต่อนี้ได้ในช่วง 8 ชั่วโมงที่ผ่านมา ส่วนใหญ่ต้องโหลดได้ การกรองโดยผู้ให้บริการอินเทอร์เน็ตของคุณจะทำให้ค่านี้ลดลง"
  uk: "Тестові сайти, що завантажилися через це підключення за останні 8 годин. Завантажитися має більшість; фільтрування з боку вашого інтернет-провайдера знижує результат."
  vi: "Các trang thử nghiệm đã tải được qua kết nối này trong 8 giờ qua. Phần lớn phải tải được; việc lọc của nhà cung cấp Internet sẽ làm giảm kết quả."
  zh: "过去 8 小时内通过此连接成功加载的测试网站。大部分必须能够加载；你的互联网服务提供商进行过滤会降低结果。"
  zh-HK: "過去 8 小時內透過此連接成功載入的測試網站。大部分必須能夠載入；你的互聯網服務供應商進行過濾會降低結果。"
