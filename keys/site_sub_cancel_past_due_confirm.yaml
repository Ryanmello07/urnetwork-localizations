description: "Subscription: inline confirmation before cancelling a renewal whose payment is failing. The cancel takes effect now: Stripe stops retrying the failed payment, and the Pro plan ends. Retrying = Stripe trying to charge the card again."
source: "Cancel now? We'll stop retrying your payment, and Pro ends."
platforms:
  - site
localizations:
  en: "Cancel now? We'll stop retrying your payment, and Pro ends."
  ar: "هل تريد الإلغاء الآن؟ سنتوقف عن إعادة محاولة الدفع، وسينتهي Pro."
  cs: "Zrušit hned? Přestaneme opakovat platbu a Pro skončí."
  de: "Jetzt kündigen? Wir versuchen die Zahlung nicht mehr, und Pro endet."
  el: "Ακύρωση τώρα; Θα σταματήσουμε να επαναλαμβάνουμε την πληρωμή και το Pro θα λήξει."
  es: "¿Cancelar ahora? Dejaremos de reintentar el pago y Pro terminará."
  es-MX: "¿Cancelar ahora? Dejaremos de reintentar el pago y Pro terminará."
  fr: "Annuler maintenant ? Nous cessons de relancer le paiement, et Pro prend fin."
  he: "לבטל עכשיו? נפסיק לנסות לחייב שוב, ו-Pro יסתיים."
  hi: "अभी रद्द करें? हम भुगतान दोबारा करने की कोशिश बंद कर देंगे, और Pro समाप्त हो जाएगा।"
  id: "Batalkan sekarang? Kami akan berhenti mencoba ulang pembayaran, dan Pro berakhir."
  it: "Annullare ora? Smetteremo di riprovare il pagamento e Pro terminerà."
  ja: "今すぐ解約しますか？お支払いの再試行を停止し、Proは終了します。"
  ko: "지금 해지할까요? 결제 재시도가 중단되고 Pro가 종료됩니다."
  nl: "Nu opzeggen? We stoppen met het opnieuw proberen van de betaling, en Pro eindigt."
  pl: "Anulować teraz? Przestaniemy ponawiać płatność, a Pro się zakończy."
  pt: "Cancelar agora? Deixamos de repetir o pagamento e o Pro termina."
  pt-BR: "Cancelar agora? Vamos parar de tentar o pagamento de novo, e o Pro termina."
  pt-PT: "Cancelar agora? Deixamos de repetir o pagamento e o Pro termina."
  ru: "Отменить сейчас? Мы перестанем повторять попытки оплаты, и Pro закончится."
  sv: "Avsluta nu? Vi slutar försöka ta betalningen igen, och Pro upphör."
  sw: "Ughairi sasa? Tutaacha kujaribu tena malipo, na Pro itaisha."
  th: "ยกเลิกตอนนี้ไหม? เราจะหยุดลองเรียกเก็บเงินอีก และ Pro จะสิ้นสุดลง"
  uk: "Скасувати зараз? Ми припинимо повторювати спроби оплати, і Pro завершиться."
  vi: "Hủy ngay bây giờ? Chúng tôi sẽ ngừng thử thanh toán lại và Pro sẽ kết thúc."
  zh: "立即取消？我们将停止重试付款，Pro 也将结束。"
  zh-HK: "立即取消？我們將停止重試付款，Pro 也將結束。"
