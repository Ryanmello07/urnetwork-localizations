description: "Developer tools screen: explanatory subtext under the 'measurements' control."
source: "What a provider failure costs. Reset, run a test, read back."
platforms:
  - android
localizations:
  ar: "ما يكلّفه عطل المزود. أعد التعيين، وشغّل اختبارًا، واقرأ النتيجة."
  cs: "Co stojí selhání poskytovatele. Resetujte, spusťte test, přečtěte výsledek."
  de: "Was ein Anbieterausfall kostet. Zurücksetzen, Test ausführen, Ergebnis ablesen."
  el: "Τι κοστίζει μια αστοχία παρόχου. Επαναφέρετε, εκτελέστε μια δοκιμή, διαβάστε το αποτέλεσμα."
  en: "What a provider failure costs. Reset, run a test, read back."
  es: "Lo que cuesta un fallo de proveedor. Restablece, ejecuta una prueba y lee el resultado."
  es-419: "Lo que cuesta una falla de proveedor. Restablece, ejecuta una prueba y lee el resultado."
  es-MX: "Lo que cuesta una falla de proveedor. Restablece, ejecuta una prueba y lee el resultado."
  fr: "Ce que coûte une panne de fournisseur. Réinitialisez, lancez un test, relisez."
  he: "כמה עולה כשל של ספק. אפסו, הריצו בדיקה, קראו את התוצאה."
  hi: "प्रदाता विफलता की कीमत क्या है। रीसेट करें, टेस्ट चलाएँ, नतीजा पढ़ें।"
  id: "Berapa biaya satu kegagalan penyedia. Reset, jalankan tes, baca hasilnya."
  it: "Quanto costa un guasto di un provider. Azzera, esegui un test, rileggi."
  ja: "プロバイダー障害がどれだけの損失になるか。リセットしてテストを実行し、結果を確認します。"
  ko: "제공자 장애가 어떤 손실을 낳는지 확인합니다. 재설정하고, 테스트를 실행하고, 결과를 읽으세요."
  nl: "Wat een providerstoring kost. Reset, voer een test uit, lees terug."
  pl: "Ile kosztuje awaria dostawcy. Zresetuj, uruchom test, odczytaj wynik."
  pt: "O que custa uma falha de fornecedor. Reponha, execute um teste e leia o resultado."
  pt-BR: "O que custa uma falha de provedor. Redefina, execute um teste e leia o resultado."
  pt-PT: "O que custa uma falha de fornecedor. Reponha, execute um teste e leia o resultado."
  ru: "Во что обходится сбой провайдера. Сбросьте, запустите тест, посмотрите результат."
  sv: "Vad ett leverantörsfel kostar. Återställ, kör ett test, läs av."
  sw: "Hitilafu ya mtoa huduma inagharimu nini. Weka upya, endesha jaribio, soma matokeo."
  th: "ความล้มเหลวของผู้ให้บริการหนึ่งครั้งมีต้นทุนเท่าใด รีเซ็ต รันการทดสอบ แล้วอ่านผล"
  uk: "Чого коштує збій провайдера. Скиньте, запустіть тест, перегляньте результат."
  vi: "Một sự cố nhà cung cấp gây ra tổn thất gì. Đặt lại, chạy thử, đọc kết quả."
  zh: "提供商故障的代价。重置、运行测试、读取结果。"
  zh-HK: "供應商故障的代價。重設、執行測試、讀取結果。"
