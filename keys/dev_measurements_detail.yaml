description: "Developer tools screen: explanatory subtext under the 'measurements' control."
source: "What a provider failure costs. Reset, run a test, read back."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "ما يكلّفه عطل المزود. أعد التعيين، وشغّل اختبارًا، واقرأ النتيجة."
  de: "Was ein Anbieterausfall kostet. Zurücksetzen, Test ausführen, Ergebnis ablesen."
  en: "What a provider failure costs. Reset, run a test, read back."
