description: "Connect error: the permission request was not answered."
source: "The permission request was not answered, so nothing was connected. Press Connect to try again."
platforms:
  - linux
localizations:
  ar: "لم تتم الإجابة على طلب الإذن، لذا لم يتصل شيء. اضغط اتصال للمحاولة مجددًا."
  cs: "Na žádost o oprávnění nikdo neodpověděl, takže se nic nepřipojilo. Stiskněte Připojit a zkuste to znovu."
  de: "Die Berechtigungsanfrage wurde nicht beantwortet, deshalb wurde nichts verbunden. Drücke auf Verbinden, um es erneut zu versuchen."
  el: "Το αίτημα άδειας δεν απαντήθηκε, οπότε δεν έγινε σύνδεση. Πατήστε Σύνδεση για να δοκιμάσετε ξανά."
  en: "The permission request was not answered, so nothing was connected. Press Connect to try again."
  es: "La solicitud de permiso no recibió respuesta, así que no se conectó nada. Pulsa Conectar para intentarlo de nuevo."
  es-419: "La solicitud de permiso no recibió respuesta, así que no se conectó nada. Presiona Conectar para intentarlo de nuevo."
  es-MX: "La solicitud de permiso no recibió respuesta, así que no se conectó nada. Pulsa Conectar para intentarlo de nuevo."
  fr: "La demande d’autorisation est restée sans réponse, rien n’a donc été connecté. Appuyez sur Connecter pour réessayer."
  he: "בקשת ההרשאה לא נענתה, ולכן שום דבר לא התחבר. לחצו על התחבר כדי לנסות שוב."
  hi: "अनुमति अनुरोध का उत्तर नहीं मिला, इसलिए कुछ भी कनेक्ट नहीं हुआ। फिर से कोशिश करने के लिए कनेक्ट दबाएँ।"
  id: "Permintaan izin tidak dijawab, jadi tidak ada yang terhubung. Tekan Hubungkan untuk mencoba lagi."
  it: "La richiesta di permesso non ha ricevuto risposta, quindi non è stato connesso nulla. Premi Connetti per riprovare."
  ja: "許可の要求に応答がなかったため、接続されませんでした。「接続」を押して再試行してください。"
  ko: "권한 요청에 응답이 없어 아무것도 연결되지 않았습니다. 다시 시도하려면 연결을 누르세요."
  nl: "Het toestemmingsverzoek is niet beantwoord, dus er is niets verbonden. Druk op Verbinden om het opnieuw te proberen."
  pl: "Prośba o uprawnienia pozostała bez odpowiedzi, więc nic się nie połączyło. Naciśnij Połącz, aby spróbować ponownie."
  pt: "O pedido de permissão não foi respondido, então nada foi conectado. Toque em Conectar para tentar de novo."
  pt-BR: "O pedido de permissão não foi respondido, então nada foi conectado. Toque em Conectar para tentar de novo."
  pt-PT: "O pedido de permissão não obteve resposta, pelo que nada foi ligado. Prima Ligar para tentar novamente."
  ru: "Запрос разрешения остался без ответа, поэтому подключения не было. Нажмите «Подключить», чтобы попробовать снова."
  sv: "Behörighetsbegäran besvarades inte, så inget anslöts. Tryck på Anslut för att försöka igen."
  sw: "Ombi la ruhusa halikujibiwa, kwa hivyo hakuna kilichounganishwa. Bonyeza Unganisha ili kujaribu tena."
  th: "คำขอสิทธิ์ไม่ได้รับการตอบกลับ จึงไม่มีการเชื่อมต่อ กดเชื่อมต่อเพื่อลองอีกครั้ง"
  uk: "На запит дозволу не відповіли, тому підключення не було. Натисніть «Підключитися», щоб спробувати ще раз."
  vi: "Yêu cầu quyền không được trả lời, nên không có gì được kết nối. Nhấn Kết nối để thử lại."
  zh: "权限请求未得到响应，因此未连接。按下连接重试。"
  zh-HK: "權限請求未獲回應，因此未連線。按下連接重試。"
