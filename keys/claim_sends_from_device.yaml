description: "Explainer under the claim button."
source: "Your device sends the claim to the vault contract. Gas is paid in TAO from your gas key. Alpha lands on your coldkey."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "يرسل جهازك طلب المطالبة إلى عقد الخزنة. تُدفع رسوم الغاز بعملة TAO من مفتاح الغاز الخاص بك. ويصل Alpha إلى coldkey الخاص بك."
  cs: "Vaše zařízení odešle nárok do kontraktu trezoru. Gas se platí v TAO z vašeho klíče pro gas. Alpha přijde na váš coldkey."
  de: "Dein Gerät sendet die Einlösung an den Vault-Vertrag. Das Gas wird in TAO von deinem Gas-Schlüssel bezahlt. Das Alpha landet auf deinem Coldkey."
  el: "Η συσκευή σας στέλνει τη διεκδίκηση στο συμβόλαιο θησαυροφυλακίου. Το gas πληρώνεται σε TAO από το κλειδί gas σας. Το Alpha καταλήγει στο coldkey σας."
  en: "Your device sends the claim to the vault contract. Gas is paid in TAO from your gas key. Alpha lands on your coldkey."
  es: "Tu dispositivo envía la reclamación al contrato de bóveda. El gas se paga en TAO desde tu clave de gas. El Alpha llega a tu coldkey."
  es-419: "Tu dispositivo envía la reclamación al contrato de bóveda. El gas se paga en TAO desde tu clave de gas. El Alpha llega a tu coldkey."
  es-MX: "Tu dispositivo envía la reclamación al contrato de bóveda. El gas se paga en TAO desde tu clave de gas. El Alpha llega a tu coldkey."
  fr: "Votre appareil envoie la réclamation au contrat du coffre. Le gas est payé en TAO depuis votre clé de gas. L’Alpha arrive sur votre coldkey."
  he: "המכשיר שלכם שולח את בקשת המימוש לחוזה הכספת. הגז משולם ב-TAO ממפתח הגז שלכם. ה-Alpha מגיע ל-coldkey שלכם."
  hi: "आपका डिवाइस दावा वॉल्ट कॉन्ट्रैक्ट को भेजता है। गैस का भुगतान आपकी गैस कुंजी से TAO में होता है। Alpha आपकी coldkey पर पहुँचता है।"
  id: "Perangkat Anda mengirim klaim ke kontrak vault. Gas dibayar dalam TAO dari kunci gas Anda. Alpha masuk ke coldkey Anda."
  it: "Il tuo dispositivo invia il riscatto al contratto vault. Il gas si paga in TAO dalla tua chiave gas. L’Alpha arriva sulla tua coldkey."
  ja: "このデバイスが受け取りリクエストをボールトコントラクトに送信します。ガス代はガスキーから TAO で支払われます。Alpha は coldkey に届きます。"
  ko: "기기가 받기 요청을 볼트 컨트랙트로 보냅니다. 가스는 가스 키에서 TAO로 지불됩니다. Alpha는 coldkey로 들어옵니다."
  nl: "Je apparaat stuurt de claim naar het vault-contract. Gas wordt in TAO betaald vanuit je gas key. Alpha komt op je coldkey terecht."
  pl: "Twoje urządzenie wysyła odbiór do kontraktu skarbca. Gas jest opłacany w TAO z twojego klucza gas. Alpha trafia na twój coldkey."
  pt: "O seu dispositivo envia a reivindicação para o contrato do cofre. O gás é pago em TAO a partir da sua chave de gás. O Alpha chega à sua coldkey."
  pt-BR: "Seu dispositivo envia o resgate ao contrato do cofre. O gás é pago em TAO a partir da sua chave de gás. O Alpha chega à sua coldkey."
  pt-PT: "O seu dispositivo envia a reivindicação para o contrato do cofre. O gás é pago em TAO a partir da sua chave de gás. O Alpha chega à sua coldkey."
  ru: "Ваше устройство отправляет запрос на получение в контракт хранилища. Газ оплачивается в TAO с вашего ключа для оплаты газа. Alpha поступает на ваш coldkey."
  sv: "Din enhet skickar uttaget till valvkontraktet. Gas betalas i TAO från din gasnyckel. Alpha hamnar på din coldkey."
  sw: "Kifaa chako kinatuma dai kwenye mkataba wa hazina. Gas inalipwa kwa TAO kutoka kwenye ufunguo wako wa gas. Alpha inaingia kwenye coldkey yako."
  th: "อุปกรณ์ของคุณส่งคำขอรับไปยังสัญญาห้องนิรภัย ค่า gas ชำระเป็น TAO จากคีย์ gas ของคุณ Alpha จะเข้าสู่ coldkey ของคุณ"
  uk: "Ваш пристрій надсилає запит на отримання в контракт сховища. Газ оплачується в TAO з вашого ключа для газу. Alpha надходить на ваш coldkey."
  vi: "Thiết bị của bạn gửi yêu cầu nhận tới hợp đồng kho. Gas được trả bằng TAO từ khóa gas của bạn. Alpha sẽ về coldkey của bạn."
  zh: "您的设备会将领取请求发送到金库合约。Gas 费以 TAO 从您的 Gas 密钥中支付。Alpha 将存入您的 coldkey。"
  zh-HK: "你的裝置會將領取請求傳送至金庫合約。Gas 費以 TAO 從你的 Gas 密鑰支付。Alpha 會存入你的 coldkey。"
