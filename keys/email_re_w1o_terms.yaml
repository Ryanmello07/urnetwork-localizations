description: "Win-back email W1 (offer): terms line under the button."
source: "Half price for the first month, then the regular monthly price. You'll see both amounts before you pay. Cancel anytime."
platforms:
  - email
localizations:
  en: "Half price for the first month, then the regular monthly price. You'll see both amounts before you pay. Cancel anytime."
  ar: "نصف السعر للشهر الأول، ثم السعر الشهري المعتاد. سترى المبلغين قبل أن تدفع. يمكنك الإلغاء في أي وقت."
  cs: "Poloviční cena za první měsíc, pak běžná měsíční cena. Obě částky uvidíte před zaplacením. Zrušit lze kdykoli."
  de: "Halber Preis im ersten Monat, danach der reguläre Monatspreis. Du siehst beide Beträge, bevor du bezahlst. Jederzeit kündbar."
  el: "Μισή τιμή τον πρώτο μήνα, μετά η κανονική μηνιαία τιμή. Θα δεις και τα δύο ποσά πριν πληρώσεις. Ακύρωση οποιαδήποτε στιγμή."
  es: "Mitad de precio el primer mes, luego el precio mensual normal. Verás ambos importes antes de pagar. Cancela cuando quieras."
  es-419: "Mitad de precio el primer mes, luego el precio mensual normal. Verás ambos montos antes de pagar. Cancela cuando quieras."
  es-MX: "Mitad de precio el primer mes, luego el precio mensual normal. Verás ambos montos antes de pagar. Cancela cuando quieras."
  fr: "Moitié prix le premier mois, puis le prix mensuel habituel. Tu verras les deux montants avant de payer. Annulation à tout moment."
  he: "חצי מחיר לחודש הראשון, ואחר כך המחיר החודשי הרגיל. תראו את שני הסכומים לפני התשלום. אפשר לבטל בכל עת."
  hi: "पहले महीने के लिए आधी कीमत, फिर सामान्य मासिक कीमत। भुगतान से पहले आपको दोनों राशियाँ दिखेंगी। कभी भी रद्द करें।"
  id: "Setengah harga untuk bulan pertama, lalu harga bulanan biasa. Kamu akan melihat kedua nominalnya sebelum membayar. Batalkan kapan saja."
  it: "Metà prezzo il primo mese, poi il prezzo mensile normale. Vedrai entrambi gli importi prima di pagare. Annulla quando vuoi."
  ja: "最初の1か月は半額、その後は通常の月額料金です。お支払い前に両方の金額が表示されます。いつでもキャンセルできます。"
  ko: "첫 달은 반값, 그다음은 정상 월 요금입니다. 결제 전에 두 금액을 모두 확인할 수 있습니다. 언제든 취소할 수 있습니다."
  nl: "Halve prijs voor de eerste maand, daarna de normale maandprijs. Je ziet beide bedragen voordat je betaalt. Altijd opzegbaar."
  pl: "Pół ceny za pierwszy miesiąc, potem zwykła cena miesięczna. Obie kwoty zobaczysz przed zapłatą. Anuluj w każdej chwili."
  pt: "Metade do preço no primeiro mês, depois o preço mensal normal. Você verá os dois valores antes de pagar. Cancele quando quiser."
  pt-BR: "Metade do preço no primeiro mês, depois o preço mensal normal. Você verá os dois valores antes de pagar. Cancele quando quiser."
  pt-PT: "Metade do preço no primeiro mês, depois o preço mensal normal. Verá os dois valores antes de pagar. Cancele quando quiser."
  ru: "Полцены за первый месяц, затем обычная месячная цена. Обе суммы вы увидите до оплаты. Отмена в любое время."
  sv: "Halva priset första månaden, sedan ordinarie månadspris. Du ser båda beloppen innan du betalar. Avsluta när som helst."
  sw: "Nusu bei kwa mwezi wa kwanza, kisha bei ya kawaida ya kila mwezi. Utaona bei zote mbili kabla ya kulipa. Ghairi wakati wowote."
  th: "ครึ่งราคาสำหรับเดือนแรก แล้วเป็นราคารายเดือนปกติ คุณจะเห็นทั้งสองยอดก่อนชำระเงิน ยกเลิกได้ทุกเมื่อ"
  uk: "Пів ціни за перший місяць, потім звичайна місячна ціна. Обидві суми ви побачите до оплати. Скасувати можна будь-коли."
  vi: "Nửa giá cho tháng đầu, sau đó là giá hằng tháng thông thường. Bạn sẽ thấy cả hai số tiền trước khi thanh toán. Hủy bất cứ lúc nào."
  zh: "首月半价，之后按常规月费。付款前你会看到这两个金额。随时可取消。"
  zh-HK: "首月半價，之後按正常月費。付款前你會看到這兩個金額。隨時可取消。"
