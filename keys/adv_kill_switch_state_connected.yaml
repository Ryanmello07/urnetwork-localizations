description: "Kill switch status: in force while connected, traffic is blocked if the tunnel drops."
source: "In force: if the tunnel drops, this device's traffic is blocked instead of going out unprotected."
platforms:
  - linux
localizations:
  ar: "ساري المفعول: إذا انقطع النفق، تُحجب حركة هذا الجهاز بدلًا من الخروج دون حماية."
  cs: "V platnosti: pokud tunel spadne, provoz tohoto zařízení se zablokuje místo toho, aby odešel nechráněný."
  de: "In Kraft: Bricht der Tunnel ab, wird der Datenverkehr dieses Geräts blockiert, statt ungeschützt hinauszugehen."
  el: "Σε ισχύ: αν η σήραγγα πέσει, η κίνηση αυτής της συσκευής αποκλείεται αντί να βγει απροστάτευτη."
  en: "In force: if the tunnel drops, this device's traffic is blocked instead of going out unprotected."
  es: "En vigor: si el túnel se cae, el tráfico de este dispositivo se bloquea en vez de salir sin protección."
  es-419: "En vigor: si el túnel se cae, el tráfico de este dispositivo se bloquea en vez de salir sin protección."
  es-MX: "En vigor: si el túnel se cae, el tráfico de este dispositivo se bloquea en vez de salir sin protección."
  fr: "En vigueur : si le tunnel tombe, le trafic de cet appareil est bloqué au lieu de sortir sans protection."
  he: "בתוקף: אם המנהרה תיפול, התעבורה של המכשיר הזה תיחסם במקום לצאת ללא הגנה."
  hi: "प्रभावी: यदि टनल गिर जाए, तो इस डिवाइस का ट्रैफ़िक असुरक्षित बाहर जाने के बजाय रोक दिया जाता है।"
  id: "Berlaku: jika terowongan putus, lalu lintas perangkat ini diblokir alih-alih keluar tanpa perlindungan."
  it: "In vigore: se il tunnel cade, il traffico di questo dispositivo viene bloccato invece di uscire senza protezione."
  ja: "有効：トンネルが切れた場合、このデバイスの通信は保護なしで外に出る代わりに遮断されます。"
  ko: "적용 중: 터널이 끊어지면 이 기기의 트래픽은 보호 없이 나가는 대신 차단됩니다."
  nl: "Van kracht: als de tunnel wegvalt, wordt het verkeer van dit apparaat geblokkeerd in plaats van onbeschermd naar buiten te gaan."
  pl: "Obowiązuje: jeśli tunel się zerwie, ruch tego urządzenia zostanie zablokowany zamiast wyjść bez ochrony."
  pt: "Em vigor: se o túnel cair, o tráfego deste dispositivo é bloqueado em vez de sair sem proteção."
  pt-BR: "Em vigor: se o túnel cair, o tráfego deste dispositivo é bloqueado em vez de sair sem proteção."
  pt-PT: "Em vigor: se o túnel cair, o tráfego deste dispositivo é bloqueado em vez de sair sem proteção."
  ru: "Действует: если туннель оборвётся, трафик этого устройства будет заблокирован вместо выхода без защиты."
  sv: "Gäller: om tunneln faller blockeras den här enhetens trafik i stället för att gå ut oskyddad."
  sw: "Inatumika: ikiwa handaki litakatika, trafiki ya kifaa hiki huzuiwa badala ya kutoka bila ulinzi."
  th: "มีผลอยู่: หากอุโมงค์หลุด ทราฟฟิกของอุปกรณ์นี้จะถูกบล็อกแทนที่จะออกไปโดยไม่มีการป้องกัน"
  uk: "Діє: якщо тунель обірветься, трафік цього пристрою буде заблоковано замість виходу без захисту."
  vi: "Đang có hiệu lực: nếu đường hầm bị rớt, lưu lượng của thiết bị này sẽ bị chặn thay vì thoát ra mà không được bảo vệ."
  zh: "生效中：如果隧道断开，此设备的流量将被阻断，而不会在无保护的情况下流出。"
  zh-HK: "生效中：如果隧道中斷，此裝置的流量將被封鎖，而不會在無保護的情況下流出。"
