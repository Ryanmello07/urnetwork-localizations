description: "Earnings screen, the payout card for the network's payouts. The device's secure storage (Apple's Keychain) did not answer, usually because the device is locked."
source: "Couldn't read this device's keychain. Unlock your device and try again."
platforms:
  - apple
  - android
  - windows
localizations:
  ar: "تعذّرت قراءة سلسلة المفاتيح على هذا الجهاز. افتح قفل جهازك وحاول مرة أخرى."
  cs: "Klíčenku tohoto zařízení se nepodařilo přečíst. Odemkněte zařízení a zkuste to znovu."
  de: "Der Schlüsselbund dieses Geräts konnte nicht gelesen werden. Entsperre dein Gerät und versuche es erneut."
  el: "Δεν ήταν δυνατή η ανάγνωση του μπρελόκ αυτής της συσκευής. Ξεκλειδώστε τη συσκευή σας και δοκιμάστε ξανά."
  en: "Couldn't read this device's keychain. Unlock your device and try again."
  es: "No se pudo leer el llavero de este dispositivo. Desbloquea tu dispositivo y vuelve a intentarlo."
  es-419: "No se pudo leer el llavero de este dispositivo. Desbloquea tu dispositivo y vuelve a intentarlo."
  es-MX: "No se pudo leer el llavero de este dispositivo. Desbloquea tu dispositivo y vuelve a intentarlo."
  fr: "Impossible de lire le trousseau de cet appareil. Déverrouillez votre appareil et réessayez."
  he: "לא ניתן היה לקרוא את צרור המפתחות של המכשיר הזה. בטלו את נעילת המכשיר ונסו שוב."
  hi: "इस डिवाइस का कीचेन पढ़ा नहीं जा सका। अपना डिवाइस अनलॉक करें और दोबारा कोशिश करें।"
  id: "Tidak dapat membaca rantai kunci perangkat ini. Buka kunci perangkat Anda dan coba lagi."
  it: "Impossibile leggere il portachiavi di questo dispositivo. Sblocca il dispositivo e riprova."
  ja: "このデバイスのキーチェーンを読み取れませんでした。デバイスのロックを解除して、もう一度お試しください。"
  ko: "이 기기의 키체인을 읽지 못했습니다. 기기 잠금을 해제하고 다시 시도하세요."
  nl: "De sleutelhanger van dit apparaat kon niet worden gelezen. Ontgrendel je apparaat en probeer het opnieuw."
  pl: "Nie udało się odczytać pęku kluczy tego urządzenia. Odblokuj urządzenie i spróbuj ponownie."
  pt: "Não foi possível ler o porta-chaves deste dispositivo. Desbloqueie o seu dispositivo e tente novamente."
  pt-BR: "Não foi possível ler o chaveiro deste dispositivo. Desbloqueie seu dispositivo e tente novamente."
  pt-PT: "Não foi possível ler o porta-chaves deste dispositivo. Desbloqueie o seu dispositivo e tente novamente."
  ru: "Не удалось прочитать связку ключей этого устройства. Разблокируйте устройство и повторите попытку."
  sv: "Det gick inte att läsa den här enhetens nyckelring. Lås upp din enhet och försök igen."
  sw: "Imeshindwa kusoma keychain ya kifaa hiki. Fungua kifaa chako kisha ujaribu tena."
  th: "ไม่สามารถอ่านพวงกุญแจของอุปกรณ์นี้ได้ ปลดล็อกอุปกรณ์ของคุณแล้วลองอีกครั้ง"
  uk: "Не вдалося прочитати в'язку ключів цього пристрою. Розблокуйте пристрій і спробуйте ще раз."
  vi: "Không thể đọc chuỗi khóa của thiết bị này. Hãy mở khóa thiết bị rồi thử lại."
  zh: "无法读取这台设备的钥匙串。请解锁您的设备，然后重试。"
  zh-HK: "無法讀取這部裝置的鑰匙圈。請解鎖你的裝置，然後再試一次。"
