description: "Explainer in the claim dialog and on the unclaimed tile. No durations: the claim-open time and the expiry come from the chain's epoch schedule (sn_payout_schedule_times), so the copy never fixes the 48-hour finalize offset or the nine-epoch claim window."
source: "Each epoch's claims open after its payout list is finalized and stay open until they expire."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "تُفتح المطالبات الخاصة بكل فترة بعد اعتماد قائمة دفعاتها، وتظل مفتوحة حتى تنتهي صلاحيتها."
  cs: "Nároky za každou epochu se otevřou po finalizaci jejího seznamu výplat a zůstanou otevřené až do vypršení."
  de: "Die Einlösung einer Epoche öffnet, sobald ihre Auszahlungsliste abgeschlossen ist, und bleibt bis zum Ablauf offen."
  el: "Οι διεκδικήσεις κάθε εποχής ανοίγουν μόλις οριστικοποιηθεί η λίστα πληρωμών της και μένουν ανοιχτές μέχρι να λήξουν."
  en: "Each epoch's claims open after its payout list is finalized and stay open until they expire."
  es: "Las reclamaciones de cada época se abren cuando se finaliza su lista de pagos y siguen abiertas hasta que vencen."
  es-419: "Las reclamaciones de cada época se abren cuando se finaliza su lista de pagos y siguen abiertas hasta que vencen."
  es-MX: "Las reclamaciones de cada época se abren cuando se finaliza su lista de pagos y siguen abiertas hasta que vencen."
  fr: "Les réclamations de chaque époque s'ouvrent une fois sa liste de paiements finalisée et restent ouvertes jusqu'à leur expiration."
  he: "המימושים של כל תקופה נפתחים לאחר שרשימת התשלומים שלה סופית, ונשארים פתוחים עד שתוקפם פג."
  hi: "हर एपोक के दावे उसकी भुगतान सूची अंतिम होने के बाद खुलते हैं और समाप्त होने तक खुले रहते हैं।"
  id: "Klaim setiap epoch dibuka setelah daftar pembayarannya difinalisasi dan tetap terbuka hingga kedaluwarsa."
  it: "I riscatti di ogni epoca si aprono dopo che la sua lista dei pagamenti è finalizzata e restano aperti fino alla scadenza."
  ja: "各エポックの受け取りは、その支払いリストが確定した後に開始され、期限切れになるまで受け付けられます。"
  ko: "각 에포크의 받기는 해당 지급 목록이 확정된 후 열리며 만료될 때까지 열려 있습니다."
  nl: "Het opeisen voor elke epoch opent zodra de uitbetalingslijst is afgerond en blijft open tot het verloopt."
  pl: "Odbiór za każdą epokę otwiera się po sfinalizowaniu jej listy wypłat i pozostaje otwarty do wygaśnięcia."
  pt: "Os resgates de cada época abrem depois que a lista de pagamentos é finalizada e ficam abertos até expirarem."
  pt-BR: "Os resgates de cada época abrem depois que a lista de pagamentos é finalizada e ficam abertos até expirarem."
  pt-PT: "As reivindicações de cada época abrem depois de a sua lista de pagamentos ser finalizada e ficam abertas até expirarem."
  ru: "Получение за каждую эпоху открывается после утверждения её списка выплат и остаётся открытым до истечения срока."
  sv: "Uttag för varje epok öppnar när dess utbetalningslista har slutförts och är öppna tills de löper ut."
  sw: "Madai ya kila kipindi hufunguliwa baada ya orodha yake ya malipo kukamilishwa na hubaki wazi hadi muda wake uishe."
  th: "การรับของแต่ละอีพอคจะเปิดหลังจากรายการจ่ายเงินของอีพอคนั้นสรุปแล้ว และเปิดอยู่จนกว่าจะหมดอายุ"
  uk: "Отримання за кожну епоху відкривається після затвердження її списку виплат і залишається відкритим до завершення строку."
  vi: "Việc nhận cho mỗi epoch mở sau khi danh sách thanh toán của epoch đó được hoàn tất và vẫn mở cho đến khi hết hạn."
  zh: "每个周期的领取会在其支付名单确认后开放，并保持开放直到过期。"
  zh-HK: "每個週期的領取會在其支付名單確認後開放，並保持開放直到過期。"
