description: "Body of the remove confirmation for the payout wallet (the title is remove_wallet). Removing the payout wallet makes another of the account's active Solana or Polygon wallets the payout wallet when there is one (the server picks it; payouts_now_go_to names it after the removal), and holds USDC payouts until the user connects a wallet when there is none."
source: "USDC payouts move to another of your Solana or Polygon wallets, or are held until you connect one."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "تنتقل مدفوعات USDC إلى محفظة Solana أو Polygon أخرى لديك، أو تُحتجز حتى تربط واحدة."
  cs: "Výplaty v USDC se přesunou na jinou vaši peněženku Solana nebo Polygon, nebo budou zadrženy, dokud nějakou nepřipojíte."
  de: "USDC-Auszahlungen gehen an eine andere deiner Solana- oder Polygon-Wallets oder werden zurückgehalten, bis du eine verbindest."
  el: "Οι πληρωμές USDC μεταφέρονται σε άλλο πορτοφόλι σας Solana ή Polygon· αν δεν υπάρχει, παραμένουν σε αναμονή μέχρι να συνδέσετε ένα."
  en: "USDC payouts move to another of your Solana or Polygon wallets, or are held until you connect one."
  es: "Los pagos en USDC pasan a otra de tus billeteras de Solana o Polygon, o quedan retenidos hasta que conectes una."
  es-419: "Los pagos en USDC pasan a otra de tus billeteras de Solana o Polygon, o quedan retenidos hasta que conectes una."
  es-MX: "Los pagos en USDC pasan a otra de tus carteras de Solana o Polygon, o quedan retenidos hasta que conectes una."
  fr: "Les paiements en USDC sont envoyés à un autre de vos portefeuilles Solana ou Polygon, ou retenus jusqu’à ce que vous en connectiez un."
  he: "תשלומי USDC עוברים לארנק Solana או Polygon אחר שלך, או מוחזקים עד שתחבר אחד."
  hi: "USDC भुगतान आपके किसी दूसरे Solana या Polygon वॉलेट पर चले जाते हैं, या जब तक आप कोई वॉलेट कनेक्ट नहीं करते, तब तक रोक दिए जाते हैं।"
  id: "Pembayaran USDC dialihkan ke dompet Solana atau Polygon Anda yang lain, atau ditahan sampai Anda menghubungkan dompet."
  it: "I pagamenti in USDC passano a un altro dei tuoi portafogli Solana o Polygon, oppure vengono trattenuti finché non ne connetti uno."
  ja: "USDC の支払いは、別の Solana または Polygon ウォレットがあればそちらに移り、なければウォレットを接続するまで保留されます。"
  ko: "USDC 지급은 다른 Solana 또는 Polygon 지갑이 있으면 그 지갑으로 옮겨지고, 없으면 지갑을 연결할 때까지 보류됩니다."
  nl: "USDC-uitbetalingen gaan naar een van je andere Solana- of Polygon-wallets, of worden vastgehouden totdat je er een verbindt."
  pl: "Wypłaty w USDC trafią na inny Twój portfel Solana lub Polygon albo zostaną wstrzymane, dopóki nie połączysz takiego portfela."
  pt: "Os pagamentos em USDC passam para outra das suas carteiras Solana ou Polygon, ou ficam retidos até você conectar uma."
  pt-BR: "Os pagamentos em USDC passam para outra das suas carteiras Solana ou Polygon, ou ficam retidos até você conectar uma."
  pt-PT: "Os pagamentos em USDC passam para outra das suas carteiras Solana ou Polygon, ou ficam retidos até conectar uma."
  ru: "Выплаты в USDC перейдут на другой ваш кошелек Solana или Polygon, а если его нет, будут приостановлены, пока вы не подключите кошелек."
  sv: "USDC-utbetalningar går till en annan av dina Solana- eller Polygon-plånböcker, eller hålls kvar tills du ansluter en."
  sw: "Malipo ya USDC yanahamia kwenye pochi yako nyingine ya Solana au Polygon, au yanashikiliwa hadi uunganishe moja."
  th: "การจ่าย USDC จะย้ายไปยังกระเป๋าเงิน Solana หรือ Polygon อื่นของคุณ หรือจะถูกพักไว้จนกว่าคุณจะเชื่อมต่อกระเป๋าเงิน"
  uk: "Виплати в USDC перейдуть на інший ваш гаманець Solana або Polygon, а якщо його немає, будуть призупинені, доки ви не підключите гаманець."
  vi: "Các khoản thanh toán USDC sẽ chuyển sang một ví Solana hoặc Polygon khác của bạn, hoặc bị giữ lại cho đến khi bạn kết nối một ví."
  zh: "USDC 支付将转到你的另一个 Solana 或 Polygon 钱包；若没有，则暂停发放，直到你连接一个钱包。"
  zh-HK: "USDC 支付會轉到你的另一個 Solana 或 Polygon 錢包；若沒有，則暫停發放，直到你連接一個錢包。"
