description: "Out-of-balance notice (and the Upgrade screen when a blocked connect opened it), shown when most of what is missing is held by open connections rather than used up. {amount} is the reserved (Pending) data as a size, e.g. 1.4 GB. The unused part is returned as those connections close. Do not add a time promise."
source: "%@ is reserved for your open connections. What they don't use is returned as they close."
platforms:
  - android
  - apple
  - windows
  - linux
placeholders:
  - name: amount
    type: string
