description: "Upgrade sheet waiting page: the embedded checkout webview crashed after the payment form had rendered, so a charge may already have gone through with only the redirect lost. Shown while the confirmation poll asks the server for the payment webhook; must never invite buying again."
source: "The checkout view closed unexpectedly. If your payment went through, your plan updates here automatically — there's no need to buy again."
platforms:
  - linux
  - windows
localizations:
  ar: "أُغلقت نافذة الدفع بشكل غير متوقع. إذا تمت عملية الدفع، فسيتم تحديث خطتك هنا تلقائيًا — لا داعي للشراء مرة أخرى."
  cs: "Okno platby se nečekaně zavřelo. Pokud platba proběhla, váš tarif se tu aktualizuje automaticky — není třeba kupovat znovu."
  de: "Die Kaufansicht wurde unerwartet geschlossen. Falls deine Zahlung durchgegangen ist, wird dein Plan hier automatisch aktualisiert — du musst nicht noch einmal kaufen."
  el: "Το παράθυρο πληρωμής έκλεισε απροσδόκητα. Αν η πληρωμή σας ολοκληρώθηκε, το πρόγραμμά σας θα ενημερωθεί εδώ αυτόματα — δεν χρειάζεται να αγοράσετε ξανά."
  en: "The checkout view closed unexpectedly. If your payment went through, your plan updates here automatically — there's no need to buy again."
  es: "La ventana de pago se cerró inesperadamente. Si tu pago se completó, tu plan se actualizará aquí automáticamente — no hace falta volver a comprar."
  es-419: "La ventana de pago se cerró inesperadamente. Si tu pago se completó, tu plan se actualizará aquí automáticamente — no es necesario volver a comprar."
  es-MX: "La ventana de pago se cerró inesperadamente. Si tu pago se completó, tu plan se actualizará aquí automáticamente — no es necesario volver a comprar."
  fr: "La fenêtre de paiement s’est fermée de façon inattendue. Si votre paiement a abouti, votre forfait se met à jour ici automatiquement — inutile de racheter."
  he: "חלון התשלום נסגר באופן בלתי צפוי. אם התשלום עבר, התוכנית שלכם תתעדכן כאן אוטומטית — אין צורך לקנות שוב."
  hi: "चेकआउट व्यू अचानक बंद हो गया। अगर आपका भुगतान हो गया है, तो आपका प्लान यहाँ अपने-आप अपडेट हो जाएगा — दोबारा खरीदने की ज़रूरत नहीं है।"
  id: "Tampilan pembayaran tertutup secara tak terduga. Jika pembayaran Anda berhasil, paket Anda akan diperbarui di sini secara otomatis — tidak perlu membeli lagi."
  it: "La finestra di pagamento si è chiusa inaspettatamente. Se il pagamento è andato a buon fine, il tuo piano si aggiorna qui automaticamente — non serve acquistare di nuovo."
  ja: "支払い画面が予期せず閉じました。支払いが完了していれば、プランはここで自動的に更新されます。もう一度購入する必要はありません。"
  ko: "결제 화면이 예기치 않게 닫혔습니다. 결제가 완료되었다면 요금제가 여기서 자동으로 업데이트됩니다. 다시 구매할 필요는 없습니다."
  nl: "Het betaalvenster is onverwacht gesloten. Als je betaling is gelukt, wordt je abonnement hier automatisch bijgewerkt — je hoeft niet opnieuw te kopen."
  pl: "Okno płatności nieoczekiwanie się zamknęło. Jeśli płatność przeszła, twój plan zaktualizuje się tutaj automatycznie — nie musisz kupować ponownie."
  pt: "A janela de pagamento fechou-se inesperadamente. Se o seu pagamento foi concluído, o seu plano é atualizado aqui automaticamente — não é preciso comprar de novo."
  pt-BR: "A janela de pagamento fechou inesperadamente. Se o seu pagamento foi concluído, seu plano será atualizado aqui automaticamente — não é preciso comprar de novo."
  pt-PT: "A janela de pagamento fechou-se inesperadamente. Se o seu pagamento foi concluído, o seu plano é atualizado aqui automaticamente — não é preciso comprar de novo."
  ru: "Окно оплаты неожиданно закрылось. Если платёж прошёл, ваш тариф обновится здесь автоматически — покупать повторно не нужно."
  sv: "Betalningsvyn stängdes oväntat. Om din betalning gick igenom uppdateras ditt abonnemang här automatiskt — du behöver inte köpa igen."
  sw: "Ukurasa wa malipo ulifungwa bila kutarajiwa. Ikiwa malipo yako yalifaulu, mpango wako utasasishwa hapa kiotomatiki — hakuna haja ya kununua tena."
  th: "หน้าชำระเงินปิดลงโดยไม่คาดคิด หากชำระเงินสำเร็จแล้ว แพ็กเกจของคุณจะอัปเดตที่นี่โดยอัตโนมัติ — ไม่ต้องซื้อซ้ำ"
  uk: "Вікно оплати несподівано закрилося. Якщо оплата пройшла, ваш план оновиться тут автоматично — купувати ще раз не потрібно."
  vi: "Cửa sổ thanh toán đã đóng bất ngờ. Nếu bạn đã thanh toán thành công, gói của bạn sẽ tự động cập nhật tại đây — không cần mua lại."
  zh: "结账页面意外关闭。如果您的付款已完成，您的方案会在此处自动更新，无需再次购买。"
  zh-HK: "付款頁面意外關閉。如果你的付款已完成，你的計劃會在此自動更新，無需再次購買。"
