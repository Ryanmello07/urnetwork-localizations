description: "DNS settings: description under the Fast DNS on connect toggle. Explains that it answers DNS over the local network while the tunnel's DNS starts, which can reveal lookups to the local network."
source: "Answers DNS over the local network while the tunnel's DNS starts. This can reveal your lookups to the local network. When off, DNS only resolves through the tunnel."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "يجيب على استعلامات DNS عبر الشبكة المحلية أثناء بدء DNS الخاص بالنفق. قد يكشف هذا عمليات البحث الخاصة بك للشبكة المحلية. عند الإيقاف، يتم حل DNS عبر النفق فقط."
  cs: "Odpovídá na dotazy DNS přes místní síť, dokud se spouští DNS tunelu. Místní síť tak může vidět vaše dotazy. Když je vypnuto, DNS se překládá jen přes tunel."
  de: "Beantwortet DNS-Anfragen über das lokale Netzwerk, während das DNS des Tunnels startet. Dadurch können deine Abfragen im lokalen Netzwerk sichtbar werden. Wenn aus, wird DNS nur über den Tunnel aufgelöst."
  el: "Απαντά σε ερωτήματα DNS μέσω του τοπικού δικτύου όσο ξεκινά το DNS του τούνελ. Αυτό μπορεί να αποκαλύψει τις αναζητήσεις σας στο τοπικό δίκτυο. Όταν είναι ανενεργό, το DNS επιλύεται μόνο μέσω του τούνελ."
  en: "Answers DNS over the local network while the tunnel's DNS starts. This can reveal your lookups to the local network. When off, DNS only resolves through the tunnel."
  es: "Responde al DNS a través de la red local mientras se inicia el DNS del túnel. Esto puede revelar tus búsquedas a la red local. Si está desactivado, el DNS solo se resuelve a través del túnel."
  es-419: "Responde al DNS a través de la red local mientras se inicia el DNS del túnel. Esto puede revelar tus búsquedas a la red local. Si está desactivado, el DNS solo se resuelve a través del túnel."
  es-MX: "Responde al DNS a través de la red local mientras se inicia el DNS del túnel. Esto puede revelar tus búsquedas a la red local. Si está desactivado, el DNS solo se resuelve a través del túnel."
  fr: "Répond aux requêtes DNS via le réseau local pendant le démarrage du DNS du tunnel. Cela peut révéler vos recherches au réseau local. Désactivé, le DNS ne se résout qu'à travers le tunnel."
  he: "עונה לשאילתות DNS דרך הרשת המקומית בזמן שה-DNS של המנהרה עולה. הדבר עלול לחשוף את החיפושים שלך לרשת המקומית. כשהאפשרות כבויה, DNS נפתר רק דרך המנהרה."
  hi: "टनल का DNS शुरू होने तक स्थानीय नेटवर्क से DNS का जवाब देता है। इससे आपके लुकअप स्थानीय नेटवर्क को दिख सकते हैं। बंद होने पर DNS केवल टनल से ही रिज़ॉल्व होता है।"
  id: "Menjawab DNS melalui jaringan lokal saat DNS terowongan dimulai. Ini dapat memperlihatkan pencarian Anda ke jaringan lokal. Jika nonaktif, DNS hanya diselesaikan melalui terowongan."
  it: "Risponde alle richieste DNS tramite la rete locale mentre il DNS del tunnel si avvia. Questo può rivelare le tue ricerche alla rete locale. Se disattivato, il DNS si risolve solo attraverso il tunnel."
  ja: "トンネルのDNSが起動するまで、ローカルネットワーク経由でDNSに応答します。問い合わせ内容がローカルネットワークに知られる可能性があります。オフの場合、DNSはトンネル経由でのみ解決されます。"
  ko: "터널 DNS가 시작되는 동안 로컬 네트워크를 통해 DNS에 응답합니다. 이로 인해 조회 내용이 로컬 네트워크에 노출될 수 있습니다. 끄면 DNS는 터널을 통해서만 확인됩니다."
  nl: "Beantwoordt DNS via het lokale netwerk terwijl de DNS van de tunnel opstart. Hierdoor kan het lokale netwerk je zoekopdrachten zien. Als dit uitstaat, wordt DNS alleen via de tunnel opgelost."
  pl: "Odpowiada na zapytania DNS przez sieć lokalną, dopóki uruchamia się DNS tunelu. Może to ujawnić Twoje zapytania sieci lokalnej. Po wyłączeniu DNS jest rozwiązywany tylko przez tunel."
  pt: "Responde ao DNS através da rede local enquanto o DNS do túnel arranca. Isto pode revelar as suas pesquisas à rede local. Quando desativado, o DNS só é resolvido através do túnel."
  pt-BR: "Responde ao DNS pela rede local enquanto o DNS do túnel inicia. Isso pode revelar suas consultas à rede local. Quando desativado, o DNS só é resolvido através do túnel."
  pt-PT: "Responde ao DNS através da rede local enquanto o DNS do túnel arranca. Isto pode revelar as suas pesquisas à rede local. Quando desativado, o DNS só é resolvido através do túnel."
  ru: "Отвечает на DNS-запросы через локальную сеть, пока запускается DNS туннеля. Это может раскрыть ваши запросы локальной сети. Если выключено, DNS разрешается только через туннель."
  sv: "Besvarar DNS via det lokala nätverket medan tunnelns DNS startar. Det kan avslöja dina uppslag för det lokala nätverket. När det är av sker DNS-uppslag endast genom tunneln."
  sw: "Hujibu DNS kupitia mtandao wa ndani wakati DNS ya tuneli inaanza. Hii inaweza kufichua utafutaji wako kwa mtandao wa ndani. Ikizimwa, DNS husuluhishwa kupitia tuneli pekee."
  th: "ตอบ DNS ผ่านเครือข่ายภายในขณะที่ DNS ของอุโมงค์กำลังเริ่มทำงาน ซึ่งอาจเปิดเผยการค้นหาของคุณให้เครือข่ายภายในเห็น เมื่อปิดอยู่ DNS จะทำงานผ่านอุโมงค์เท่านั้น"
  uk: "Відповідає на DNS-запити через локальну мережу, поки запускається DNS тунелю. Це може розкрити ваші запити локальній мережі. Якщо вимкнено, DNS розв'язується лише через тунель."
  vi: "Trả lời DNS qua mạng cục bộ trong khi DNS của đường hầm khởi động. Điều này có thể để lộ các truy vấn của bạn cho mạng cục bộ. Khi tắt, DNS chỉ phân giải qua đường hầm."
  zh: "在隧道 DNS 启动期间通过本地网络应答 DNS。这可能会向本地网络暴露你的查询。关闭后，DNS 仅通过隧道解析。"
  zh-HK: "在隧道 DNS 啟動期間透過本地網絡回應 DNS。這可能會向本地網絡暴露你的查詢。關閉後，DNS 只會透過隧道解析。"
