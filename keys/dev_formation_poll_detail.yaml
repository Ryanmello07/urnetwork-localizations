description: "Developer tools screen: explanatory subtext under the 'formation poll' control."
source: "How often a connecting flow re-checks an empty window, so the first request leaves right after the first exit lands. Off waits the 2s retry pace"
platforms:
  - android
localizations:
  ar: "عدد مرات إعادة فحص التدفق الجاري اتصاله لنافذة فارغة، لكي ينطلق الطلب الأول فور وصول أول مخرج. عند الإيقاف، ينتظر وتيرة إعادة المحاولة البالغة 2 ثانية"
  cs: "Jak často připojující se tok znovu zkontroluje prázdné okno, aby první požadavek odešel hned, jak dorazí první výstup. Vypnuto čeká 2s tempo opakování"
  de: "Wie oft ein Flow im Verbindungsaufbau ein leeres Fenster erneut prüft, damit die erste Anfrage direkt nach dem Eintreffen des ersten Exits losgeht. Aus: wartet den 2-s-Wiederholungstakt ab"
  el: "Πόσο συχνά μια ροή που συνδέεται ελέγχει ξανά ένα κενό παράθυρο, ώστε το πρώτο αίτημα να φύγει μόλις φτάσει η πρώτη έξοδος. Η απενεργοποίηση περιμένει τον ρυθμό επανάληψης των 2 δ"
  en: "How often a connecting flow re-checks an empty window, so the first request leaves right after the first exit lands. Off waits the 2s retry pace"
  es: "Con qué frecuencia un flujo que se está conectando vuelve a comprobar una ventana vacía, para que la primera solicitud salga justo cuando llega la primera salida. Si está desactivado, se espera el ritmo de reintento de 2 s"
  es-419: "Con qué frecuencia un flujo que se está conectando vuelve a revisar una ventana vacía, para que la primera solicitud salga justo cuando llega la primera salida. Si está desactivado, se espera el ritmo de reintento de 2 s"
  es-MX: "Con qué frecuencia un flujo que se está conectando vuelve a revisar una ventana vacía, para que la primera solicitud salga justo cuando llega la primera salida. Si está desactivado, se espera el ritmo de reintento de 2 s"
  fr: "Fréquence à laquelle un flux en cours de connexion revérifie une fenêtre vide, pour que la première requête parte dès que la première sortie arrive. Désactivé attend le rythme de nouvelle tentative de 2 s"
  he: "באיזו תדירות זרימה שמתחברת בודקת שוב חלון ריק, כדי שהבקשה הראשונה תצא מיד כשהיציאה הראשונה מגיעה. כיבוי ממתין לקצב הניסיון החוזר של 2 שניות"
  hi: "कनेक्ट हो रहा फ़्लो खाली विंडो को कितनी बार दोबारा जाँचता है, ताकि पहला अनुरोध पहले एग्ज़िट के आते ही निकल जाए। बंद करने पर 2 सेकंड की पुनःप्रयास गति का इंतज़ार होता है"
  id: "Seberapa sering aliran yang sedang terhubung memeriksa ulang jendela kosong, agar permintaan pertama berangkat tepat setelah exit pertama tersedia. Nonaktif menunggu tempo coba ulang 2 dtk"
  it: "Ogni quanto un flusso in connessione ricontrolla una finestra vuota, così la prima richiesta parte appena arriva la prima uscita. Disattivato attende il ritmo di nuovo tentativo di 2 s"
  ja: "接続中のフローが空のウィンドウを再確認する頻度。最初の出口が到着した直後に最初のリクエストを送れます。オフにすると 2 秒の再試行間隔を待ちます"
  ko: "연결 중인 플로우가 빈 창을 다시 확인하는 빈도로, 첫 출구가 들어오자마자 첫 요청이 나갈 수 있게 합니다. 끄면 2초 재시도 간격을 기다립니다"
  nl: "Hoe vaak een flow die verbinding maakt een leeg venster opnieuw controleert, zodat het eerste verzoek vertrekt zodra de eerste exit er is. Uit wacht het herhaaltempo van 2 s"
  pl: "Jak często łączący się przepływ ponownie sprawdza puste okno, aby pierwsze żądanie wyszło zaraz po pojawieniu się pierwszego wyjścia. Wyłączenie czeka na 2-sekundowy rytm ponowień"
  pt: "Com que frequência um fluxo em ligação volta a verificar uma janela vazia, para que o primeiro pedido saia logo que a primeira saída chega. Desativado espera o ritmo de nova tentativa de 2 s"
  pt-BR: "Com que frequência um fluxo em conexão verifica de novo uma janela vazia, para que a primeira solicitação saia logo que a primeira saída chega. Desativado espera o ritmo de nova tentativa de 2 s"
  pt-PT: "Com que frequência um fluxo em ligação volta a verificar uma janela vazia, para que o primeiro pedido saia logo que a primeira saída chega. Desativado espera o ritmo de nova tentativa de 2 s"
  ru: "Как часто подключающийся поток перепроверяет пустое окно, чтобы первый запрос ушёл сразу после появления первого выхода. Если выключено, используется интервал повтора 2 с"
  sv: "Hur ofta ett flöde som ansluter kontrollerar ett tomt fönster igen, så att den första begäran går iväg direkt när den första utgången kommer. Av väntar omförsökstakten på 2 s"
  sw: "Mara ngapi mtiririko unaounganika hukagua upya dirisha tupu, ili ombi la kwanza liondoke mara tu njia ya kwanza ya kutoka inapofika. Kuzima kunasubiri mwendo wa kujaribu tena wa sekunde 2"
  th: "โฟลว์ที่กำลังเชื่อมต่อจะตรวจหน้าต่างที่ว่างซ้ำบ่อยเพียงใด เพื่อให้คำขอแรกออกไปทันทีที่ทางออกแรกพร้อม ปิดเพื่อรอตามจังหวะการลองใหม่ 2 วินาที"
  uk: "Як часто потік, що підключається, знову перевіряє порожнє вікно, щоб перший запит пішов одразу, щойно з’явиться перший вихід. Вимкнення чекає 2-секундний ритм повторів"
  vi: "Tần suất một luồng đang kết nối kiểm tra lại cửa sổ trống, để yêu cầu đầu tiên đi ngay khi điểm thoát đầu tiên xuất hiện. Tắt sẽ chờ theo nhịp thử lại 2 giây"
  zh: "正在连接的流重新检查空窗口的频率，使第一个请求在首个出口就绪后立即发出。关闭时按 2 秒的重试节奏等待"
  zh-HK: "正在連接的流重新檢查空視窗的頻率，讓第一個請求在首個出口就緒後立即發出。關閉時按 2 秒的重試節奏等待"
