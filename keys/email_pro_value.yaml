description: "Campaign emails that offer Pro (onboarding E4b, win-back W1): what Pro adds over the free plan. {daily_data_gb} is preformatted, e.g. \"30 GB\". TiB is the unit used in the app; keep the numbers. Data only: the free plan's device limit is not enforced (config/all/pro.yml), so a device count is no benefit to claim."
