description: "Claim status of an epoch the SDK reports as not-finalized. Despite that name the vault has finalized the epoch: with no payout root (the root was missed, so no payout list was published for it and nothing can ever be claimed for it), or with a payout list that has no share for this wallet. Never 'Finalizing' or 'Not finalized', and no 'yet': nothing more is published for that epoch."
