description: "Earnings Top 200 tile: under earnings_top200_claiming_soon while claiming isn't open. The second sentence is the claim warning (leaderboard_protocol_claim_warning): a fleet that claimed a spot but ranks 201st or lower earns nothing."
source: "We'll let you know when you can claim your spot. A claimed fleet that ranks 201 or lower earns nothing."
platforms:
  - apple
  - android
  - site
  - linux
localizations:
  ar: "سنُعلمك عندما يمكنك حجز مكانك. الأسطول الذي حجز مكانًا ويأتي في المرتبة 201 أو أدنى لا يكسب شيئًا."
  cs: "Dáme vám vědět, až si budete moct místo zajistit. Flotila se zajištěným místem, která skončí na 201. místě nebo níž, nevydělá nic."
  de: "Wir sagen dir Bescheid, sobald du dir deinen Platz sichern kannst. Eine Flotte mit gesichertem Platz, die auf Rang 201 oder tiefer landet, verdient nichts."
  el: "Θα σας ενημερώσουμε όταν μπορείτε να κλείσετε τη θέση σας. Ένας στόλος που έχει κλείσει θέση και κατατάσσεται 201ος ή χαμηλότερα δεν κερδίζει τίποτα."
  en: "We'll let you know when you can claim your spot. A claimed fleet that ranks 201 or lower earns nothing."
  es: "Te avisaremos cuando puedas reclamar tu puesto. Una flota con puesto reclamado que quede en el puesto 201 o más abajo no gana nada."
  es-419: "Te avisaremos cuando puedas reclamar tu lugar. Una flota con lugar reclamado que quede en el lugar 201 o más abajo no gana nada."
  es-MX: "Te avisaremos cuando puedas reclamar tu lugar. Una flota con lugar reclamado que quede en el lugar 201 o más abajo no gana nada."
  fr: "Nous vous préviendrons dès que vous pourrez réserver votre place. Une flotte qui a réservé sa place et se classe 201e ou au-delà ne gagne rien."
  he: "נודיע לכם כשתוכלו לתפוס את המקום שלכם. צי שתפס מקום ומדורג במקום 201 ומטה לא מרוויח כלום."
  hi: "जब आप अपनी जगह पक्की कर सकेंगे, हम आपको बताएँगे। जगह पक्की कर चुका फ़्लीट अगर 201वें या उससे नीचे के स्थान पर है, तो उसे कुछ नहीं मिलता।"
  id: "Kami akan memberi tahu Anda saat tempat Anda bisa diamankan. Armada yang sudah mengamankan tempat tetapi berada di peringkat 201 atau lebih rendah tidak mendapatkan apa pun."
  it: "Ti avviseremo quando potrai prendere il tuo posto. Una flotta che ha preso il posto ma si classifica 201ª o oltre non guadagna nulla."
  ja: "枠を確保できるようになったらお知らせします。枠を確保したフリートでも、201 位以下なら報酬はゼロです。"
  ko: "자리를 확보할 수 있게 되면 알려 드리겠습니다. 자리를 확보한 플릿이라도 201위 이하이면 아무것도 벌지 못합니다."
  nl: "We laten het je weten zodra je je plek kunt claimen. Een vloot met een geclaimde plek die op plaats 201 of lager eindigt, verdient niets."
  pl: "Damy ci znać, gdy będzie można zająć miejsce. Flota z zajętym miejscem, która jest na 201. miejscu lub niżej, nic nie zarabia."
  pt: "Iremos avisar quando puder garantir o seu lugar. Uma frota com lugar garantido que fique em 201.º ou abaixo não ganha nada."
  pt-BR: "Vamos avisar quando você puder garantir sua vaga. Uma frota com vaga garantida que fique em 201º ou abaixo não ganha nada."
  pt-PT: "Iremos avisar quando puder garantir o seu lugar. Uma frota com lugar garantido que fique em 201.º ou abaixo não ganha nada."
  ru: "Мы сообщим, когда можно будет занять место. Парк, занявший место, но оказавшийся на 201-м месте или ниже, ничего не зарабатывает."
  sv: "Vi meddelar dig när du kan ta din plats. En flotta som har tagit en plats men hamnar på plats 201 eller lägre tjänar ingenting."
  sw: "Tutakujulisha utakapoweza kupata nafasi yako. Kundi lililopata nafasi lakini likashika nafasi ya 201 au chini zaidi halipati chochote."
  th: "เราจะแจ้งให้ทราบเมื่อคุณจองที่ได้ ฟลีตที่จองที่แล้วแต่อยู่อันดับ 201 หรือต่ำกว่าจะไม่ได้รับอะไรเลย"
  uk: "Ми повідомимо, коли можна буде зайняти місце. Парк, що зайняв місце, але опинився на 201-му місці або нижче, нічого не заробляє."
  vi: "Chúng tôi sẽ báo cho bạn khi bạn có thể giành chỗ. Đội máy đã giành chỗ nhưng xếp hạng 201 trở xuống sẽ không kiếm được gì."
  zh: "可以获取席位时，我们会通知您。已获取席位的设备群如果排名在第 201 名或之后，将没有任何收益。"
  zh-HK: "可以取得席位時，我們會通知你。已取得席位的裝置群如果排名在第 201 名或之後，將沒有任何收益。"
