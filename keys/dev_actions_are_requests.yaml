description: "Developer page: note that the action buttons only request changes."
source: "Actions are requests: confirm them in the measurements and exit rows, which refresh underneath."
platforms:
  - linux
  - apple
  - windows
localizations:
  ar: "الإجراءات طلبات: تحقّق من أثرها في القياسات وصفوف المخارج، التي تتحدّث في الأسفل."
  cs: "Akce jsou požadavky: ověřte jejich účinek v měřeních a řádcích výstupů, které se níže obnovují."
  de: "Aktionen sind Anfragen: Prüfe ihre Wirkung in den Messwerten und Exit-Zeilen, die sich darunter aktualisieren."
  el: "Οι ενέργειες είναι αιτήματα: επιβεβαιώστε το αποτέλεσμά τους στις μετρήσεις και στις γραμμές εξόδων, που ανανεώνονται από κάτω."
  en: "Actions are requests: confirm them in the measurements and exit rows, which refresh underneath."
  es: "Las acciones son solicitudes: comprueba su efecto en las mediciones y las filas de salidas, que se actualizan debajo."
  es-419: "Las acciones son solicitudes: comprueba su efecto en las mediciones y las filas de salidas, que se actualizan abajo."
  es-MX: "Las acciones son solicitudes: comprueba su efecto en las mediciones y las filas de salidas, que se actualizan abajo."
  fr: "Les actions sont des demandes : vérifiez leur effet dans les mesures et les lignes de sorties, qui s’actualisent en dessous."
  he: "פעולות הן בקשות: בדקו את השפעתן במדידות ובשורות היציאות, שמתרעננות למטה."
  hi: "कार्रवाइयाँ अनुरोध हैं: उनका असर माप और एग्ज़िट की पंक्तियों में जाँचें, जो नीचे रीफ़्रेश होती हैं।"
  id: "Tindakan adalah permintaan: pastikan hasilnya di pengukuran dan baris exit, yang diperbarui di bawah."
  it: "Le azioni sono richieste: verificane l’effetto nelle misure e nelle righe delle uscite, che si aggiornano qui sotto."
  ja: "操作はリクエストです: 結果は、下で更新される測定値と出口の行で確認してください。"
  ko: "작업은 요청일 뿐입니다. 결과는 아래에서 새로 고쳐지는 측정값과 출구 행에서 확인하세요."
  nl: "Acties zijn verzoeken: controleer het effect in de metingen en de exitrijen, die hieronder bijwerken."
  pl: "Akcje są żądaniami: sprawdzaj ich skutek w pomiarach i wierszach wyjść, które odświeżają się poniżej."
  pt: "As ações são pedidos: confirme o efeito nas medições e nas linhas de saídas, que se atualizam por baixo."
  pt-BR: "As ações são solicitações: confirme o efeito nas medições e nas linhas de saídas, que se atualizam abaixo."
  pt-PT: "As ações são pedidos: confirme o efeito nas medições e nas linhas de saídas, que se atualizam por baixo."
  ru: "Действия — это запросы: проверяйте их результат в измерениях и строках выходов, которые обновляются ниже."
  sv: "Åtgärder är förfrågningar: kontrollera effekten i mätningarna och utgångsraderna, som uppdateras nedanför."
  sw: "Vitendo ni maombi: thibitisha matokeo yake kwenye vipimo na safu za njia za kutoka, zinazojisasisha hapa chini."
  th: "การดำเนินการเป็นเพียงคำขอ: ตรวจสอบผลในการวัดผลและแถวของทางออก ซึ่งรีเฟรชอยู่ด้านล่าง"
  uk: "Дії — це запити: перевіряйте їхній результат у вимірюваннях і рядках виходів, які оновлюються нижче."
  vi: "Thao tác chỉ là yêu cầu: hãy xác nhận kết quả trong phần đo lường và các hàng điểm thoát, vốn tự làm mới bên dưới."
  zh: "操作只是请求：请在下方会刷新的测量数据和出口行中确认其效果。"
  zh-HK: "操作只是請求：請在下方會更新的量度和出口行中確認其效果。"
