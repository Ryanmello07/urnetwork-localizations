description: "Developer tools screen: explanatory subtext under the 'scheduler pause tolerance' control."
source: "How much timer overshoot reads as the phone being suspended rather than an exit stalling, so a resumed phone does not convict every exit at once. Off disables it"
platforms:
  - android
localizations:
  ar: "مقدار تجاوز المؤقت الذي يُعدّ دليلًا على تعليق الهاتف لا على توقف مخرج، كي لا يُدين الهاتف بعد استئنافه كل المخارج دفعة واحدة. عند الإيقاف، يُعطَّل"
  cs: "Jak velké zpoždění časovače se vyloží jako uspaný telefon, a ne zaseknutý výstup, aby probuzený telefon neodsoudil všechny výstupy najednou. Vypnuto ho vypne"
  de: "Ab wie viel Timer-Überschreitung angenommen wird, dass das Telefon im Ruhezustand war und nicht ein Exit hängt, damit ein aufgewecktes Telefon nicht alle Exits auf einmal verurteilt. Aus: deaktiviert die Erkennung"
  el: "Πόση καθυστέρηση χρονομέτρου ερμηνεύεται ως αναστολή του τηλεφώνου και όχι ως κόλλημα εξόδου, ώστε ένα τηλέφωνο που ξυπνά να μην καταδικάζει όλες τις εξόδους μαζί. Η απενεργοποίηση τον απενεργοποιεί"
  en: "How much timer overshoot reads as the phone being suspended rather than an exit stalling, so a resumed phone does not convict every exit at once. Off disables it"
  es: "Cuánto retraso del temporizador se interpreta como que el teléfono estuvo suspendido y no como una salida bloqueada, para que un teléfono reanudado no condene todas las salidas a la vez. Si está desactivado, no se aplica"
  es-419: "Cuánto retraso del temporizador se interpreta como que el teléfono estuvo suspendido y no como una salida trabada, para que un teléfono reanudado no condene todas las salidas a la vez. Si está desactivado, no se aplica"
  es-MX: "Cuánto retraso del temporizador se interpreta como que el teléfono estuvo suspendido y no como una salida trabada, para que un teléfono reanudado no condene todas las salidas a la vez. Si está desactivado, no se aplica"
  fr: "Quel dépassement de minuterie est interprété comme une mise en veille du téléphone plutôt que comme une sortie figée, pour qu’un téléphone qui se réveille ne condamne pas toutes les sorties d’un coup. Désactivé le coupe"
  he: "כמה חריגה של הטיימר נחשבת להשהיית הטלפון ולא לתקיעת יציאה, כדי שטלפון שהתעורר לא ירשיע את כל היציאות בבת אחת. כיבוי מבטל אותו"
  hi: "टाइमर की कितनी देरी को एग्ज़िट के अटकने के बजाय फ़ोन के सस्पेंड होने के रूप में पढ़ा जाता है, ताकि फिर से चालू हुआ फ़ोन सभी एग्ज़िट को एक साथ दोषी न ठहराए। बंद करने पर यह बंद हो जाता है"
  id: "Seberapa besar keterlambatan timer yang dibaca sebagai ponsel yang ditangguhkan, bukan exit yang macet, agar ponsel yang baru aktif kembali tidak memvonis semua exit sekaligus. Nonaktif mematikannya"
  it: "Quanto ritardo del timer viene letto come telefono sospeso anziché come uscita bloccata, così un telefono che riprende non condanna tutte le uscite insieme. Disattivato lo spegne"
  ja: "どれだけのタイマーの遅れを、出口の停止ではなく端末のスリープとみなすか。復帰した端末がすべての出口を一度に判定するのを防ぎます。オフにすると無効になります"
  ko: "타이머 지연이 어느 정도일 때 출구 멈춤이 아니라 휴대폰 절전으로 볼지 정합니다. 절전에서 깨어난 휴대폰이 모든 출구를 한꺼번에 판정하지 않게 합니다. 끄면 사용하지 않습니다"
  nl: "Hoeveel timervertraging wordt gelezen als een telefoon in slaapstand in plaats van een vastgelopen exit, zodat een ontwaakte telefoon niet alle exits tegelijk veroordeelt. Uit schakelt hem uit"
  pl: "Jakie opóźnienie zegara jest uznawane za uśpienie telefonu, a nie za zablokowane wyjście, aby wybudzony telefon nie skazał wszystkich wyjść naraz. Wyłączenie je wyłącza"
  pt: "Quanto atraso do temporizador é interpretado como o telemóvel suspenso, e não como uma saída bloqueada, para que um telemóvel retomado não condene todas as saídas de uma vez. Desativado desliga-o"
  pt-BR: "Quanto atraso do timer é interpretado como o telefone suspenso, e não como uma saída travada, para que um telefone retomado não condene todas as saídas de uma vez. Desativado o desliga"
  pt-PT: "Quanto atraso do temporizador é interpretado como o telemóvel suspenso, e não como uma saída bloqueada, para que um telemóvel retomado não condene todas as saídas de uma vez. Desativado desliga-o"
  ru: "Какое превышение таймера считается приостановкой телефона, а не зависанием выхода, чтобы после пробуждения телефон не осудил сразу все выходы. Если выключено, детектор не работает"
  sv: "Hur mycket timerfördröjning som tolkas som att telefonen var i viloläge snarare än att en utgång låst sig, så att en väckt telefon inte fäller alla utgångar på en gång. Av stänger av den"
  sw: "Kiasi cha kuchelewa kwa kipima muda kinachotafsiriwa kama simu iliyolala badala ya njia ya kutoka iliyokwama, ili simu iliyoamka isihukumu njia zote za kutoka kwa wakati mmoja. Kuzima kunakizima"
  th: "ความล่าช้าของตัวจับเวลาเท่าใดจะถือว่าโทรศัพท์พักเครื่อง ไม่ใช่ทางออกค้าง เพื่อไม่ให้โทรศัพท์ที่เพิ่งกลับมาทำงานตัดสินทุกทางออกพร้อมกัน ปิดเพื่อยกเลิก"
  uk: "Яка затримка таймера вважається сном телефона, а не зависанням виходу, щоб телефон після пробудження не засудив усі виходи одразу. Вимкнення вимикає його"
  vi: "Mức trễ của bộ hẹn giờ được hiểu là điện thoại tạm ngưng thay vì điểm thoát bị kẹt, để điện thoại vừa hoạt động lại không kết luận lỗi mọi điểm thoát cùng lúc. Tắt sẽ vô hiệu hóa nó"
  zh: "计时器超时多少会被视为手机被挂起，而不是出口停滞，以免手机恢复后一次性将所有出口定罪。关闭时停用"
  zh-HK: "計時器超時多少會被視為手機進入休眠，而不是出口停滯，以免手機恢復後一次過將所有出口判罪。關閉時停用"
