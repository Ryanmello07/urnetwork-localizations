description: "Earnings screen, the payout card for the network's payouts. The short form of the warning, read before the one tap."
source: "URnetwork is not a wallet. To transfer or use your SN25α, you enter the key's recovery phrase into a Bittensor wallet or btcli. If you lose this device before saving it, your SN25α can't be reached."
platforms:
  - apple
localizations:
  ar: "URnetwork ليس محفظة. لتحويل SN25α الخاص بك أو استخدامه، تُدخل عبارة النسخ الاحتياطي الخاصة بالمفتاح في محفظة Bittensor أو في btcli. إذا فقدت هذا الجهاز قبل حفظها، فلن يمكن الوصول إلى SN25α الخاص بك."
  cs: "URnetwork není peněženka. Chcete-li své SN25α převést nebo použít, zadáte obnovovací frázi klíče do peněženky Bittensor nebo do btcli. Pokud toto zařízení ztratíte dřív, než ji uložíte, k vašemu SN25α se nebude možné dostat."
  de: "URnetwork ist keine Wallet. Um dein SN25α zu übertragen oder zu verwenden, gibst du die Wiederherstellungsphrase des Schlüssels in eine Bittensor-Wallet oder in btcli ein. Wenn du dieses Gerät verlierst, bevor du sie gespeichert hast, ist dein SN25α nicht mehr erreichbar."
  el: "Το URnetwork δεν είναι πορτοφόλι. Για να μεταφέρετε ή να χρησιμοποιήσετε τα SN25α σας, εισάγετε τη φράση επαναφοράς του κλειδιού σε ένα πορτοφόλι Bittensor ή στο btcli. Αν χάσετε αυτή τη συσκευή πριν αποθηκεύσετε τη φράση, δεν θα είναι δυνατή η πρόσβαση στα SN25α σας."
  en: "URnetwork is not a wallet. To transfer or use your SN25α, you enter the key's recovery phrase into a Bittensor wallet or btcli. If you lose this device before saving it, your SN25α can't be reached."
  es: "URnetwork no es una billetera. Para transferir o usar tu SN25α, introduces la frase de recuperación de la clave en una billetera de Bittensor o en btcli. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-419: "URnetwork no es una billetera. Para transferir o usar tu SN25α, ingresas la frase de recuperación de la clave en una billetera de Bittensor o en btcli. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-MX: "URnetwork no es una cartera. Para transferir o usar tu SN25α, ingresas la frase de recuperación de la clave en una cartera de Bittensor o en btcli. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  fr: "URnetwork n’est pas un portefeuille. Pour transférer ou utiliser vos SN25α, vous saisissez la phrase de sauvegarde de la clé dans un portefeuille Bittensor ou dans btcli. Si vous perdez cet appareil avant de l’avoir enregistrée, vos SN25α seront inaccessibles."
  he: "URnetwork אינו ארנק. כדי להעביר את ה-SN25α שלכם או להשתמש בו, מזינים את ביטוי השחזור של המפתח בארנק Bittensor או ב-btcli. אם תאבדו את המכשיר הזה לפני שתשמרו את הביטוי, לא תהיה גישה ל-SN25α שלכם."
  hi: "URnetwork वॉलेट नहीं है। अपने SN25α को ट्रांसफ़र करने या इस्तेमाल करने के लिए, आप कुंजी का रिकवरी फ़्रेज़ किसी Bittensor वॉलेट या btcli में डालते हैं। अगर आप फ़्रेज़ सहेजने से पहले यह डिवाइस खो देते हैं, तो आपके SN25α तक पहुँचा नहीं जा सकेगा।"
  id: "URnetwork bukan dompet. Untuk mentransfer atau menggunakan SN25α Anda, Anda memasukkan frasa cadangan kunci ke dompet Bittensor atau btcli. Jika Anda kehilangan perangkat ini sebelum menyimpan frasa tersebut, SN25α Anda tidak dapat diakses."
  it: "URnetwork non è un portafoglio. Per trasferire o usare i tuoi SN25α, inserisci la frase di recupero della chiave in un portafoglio Bittensor o in btcli. Se perdi questo dispositivo prima di averla salvata, i tuoi SN25α non saranno più accessibili."
  ja: "URnetwork はウォレットではありません。SN25α を送金または使用するには、キーの復元フレーズを Bittensor ウォレットまたは btcli に入力します。復元フレーズを保存する前にこのデバイスをなくすと、SN25α にアクセスできなくなります。"
  ko: "URnetwork는 지갑이 아닙니다. SN25α를 전송하거나 사용하려면 키의 복구 문구를 Bittensor 지갑이나 btcli에 입력합니다. 복구 문구를 저장하기 전에 이 기기를 잃어버리면 SN25α에 접근할 수 없습니다."
  nl: "URnetwork is geen wallet. Om je SN25α over te maken of te gebruiken, voer je de herstelzin van de sleutel in een Bittensor-wallet of in btcli in. Als je dit apparaat kwijtraakt voordat je de herstelzin hebt opgeslagen, is je SN25α niet meer bereikbaar."
  pl: "URnetwork nie jest portfelem. Aby przenieść swoje SN25α lub ich użyć, wpisujesz frazę odzyskiwania klucza do portfela Bittensor lub do btcli. Jeśli stracisz to urządzenie, zanim ją zapiszesz, do twoich SN25α nie będzie można się dostać."
  pt: "O URnetwork não é uma carteira. Para transferir ou utilizar o seu SN25α, tem de introduzir a frase de recuperação da chave numa carteira Bittensor ou no btcli. Se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  pt-BR: "O URnetwork não é uma carteira. Para transferir ou usar seu SN25α, você insere a frase de recuperação da chave em uma carteira Bittensor ou no btcli. Se você perder este dispositivo antes de salvá-la, não será possível acessar seu SN25α."
  pt-PT: "O URnetwork não é uma carteira. Para transferir ou utilizar o seu SN25α, tem de introduzir a frase de recuperação da chave numa carteira Bittensor ou no btcli. Se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  ru: "URnetwork не является кошельком. Чтобы перевести или использовать свои SN25α, нужно ввести фразу восстановления ключа в кошелек Bittensor или в btcli. Если вы потеряете это устройство, не сохранив её, получить доступ к вашим SN25α будет невозможно."
  sv: "URnetwork är inte en plånbok. För att överföra eller använda dina SN25α anger du nyckelns återställningsfras i en Bittensor-plånbok eller i btcli. Om du förlorar den här enheten innan du har sparat frasen går det inte att komma åt dina SN25α."
  sw: "URnetwork si pochi. Ili kuhamisha au kutumia SN25α yako, unaingiza kifungu cha urejeshaji cha ufunguo kwenye pochi ya Bittensor au btcli. Ukipoteza kifaa hiki kabla ya kuhifadhi kifungu hicho, SN25α yako haitaweza kufikiwa."
  th: "URnetwork ไม่ใช่กระเป๋าเงิน หากต้องการโอนหรือใช้ SN25α ของคุณ คุณต้องป้อนวลีสำรองของคีย์ลงในกระเป๋าเงิน Bittensor หรือ btcli หากคุณทำอุปกรณ์นี้หายก่อนบันทึกวลีนี้ จะไม่สามารถเข้าถึง SN25α ของคุณได้"
  uk: "URnetwork не є гаманцем. Щоб переказати або використати свої SN25α, потрібно ввести фразу відновлення ключа в гаманець Bittensor або в btcli. Якщо ви втратите цей пристрій, не зберігши її, отримати доступ до ваших SN25α буде неможливо."
  vi: "URnetwork không phải là ví. Để chuyển hoặc sử dụng SN25α của bạn, bạn nhập cụm từ sao lưu của khóa vào ví Bittensor hoặc btcli. Nếu bạn mất thiết bị này trước khi lưu cụm từ đó, sẽ không thể truy cập SN25α của bạn."
  zh: "URnetwork 不是钱包。要转移或使用您的 SN25α，您需要将该密钥的恢复短语输入 Bittensor 钱包或 btcli。如果您在保存恢复短语之前丢失这台设备，您的 SN25α 将无法访问。"
  zh-HK: "URnetwork 不是錢包。要轉移或使用你的 SN25α，你需要將此金鑰的復原短語輸入 Bittensor 錢包或 btcli。如果你在儲存復原短語之前遺失這部裝置，你的 SN25α 將無法存取。"
