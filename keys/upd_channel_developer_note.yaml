description: "Settings (Windows): the update channel row's note when this PC takes developer builds. {repo} is a GitHub repository as owner/name, for example Ryanmello07/urnetwork-windows; keep it as written."
source: "Developer builds from {repo}. Official releases are not offered while this is on."
