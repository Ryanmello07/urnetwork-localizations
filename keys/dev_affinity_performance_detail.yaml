description: "Developer tools screen: explanatory subtext under the performance-aware affinity control."
source: "Weight new TLS races by each provider's peak acknowledged-byte rate relative to its advertised bandwidth. With hard affinity enabled, low measured donors yield to the race. Existing connections and explicit pins stay fixed"
platforms:
  - android
localizations:
  ar: "يرجّح سباقات TLS الجديدة وفق ذروة معدل البايتات المؤكَّدة لكل مزود نسبةً إلى عرض النطاق المُعلَن لديه. عند تفعيل التقارب الصارم، يفسح المزودون ذوو القياسات المنخفضة المجال للسباق. تبقى الاتصالات الحالية والتثبيتات الصريحة دون تغيير"
  cs: "Váží nové závody TLS podle špičkové rychlosti potvrzených bajtů každého poskytovatele vzhledem k jeho inzerované šířce pásma. Se zapnutou pevnou afinitou ustupují poskytovatelé s nízkým naměřeným výkonem závodu. Stávající připojení a explicitní připnutí zůstávají beze změny"
  de: "Gewichtet neue TLS-Races nach der höchsten Rate bestätigter Bytes jedes Anbieters im Verhältnis zu seiner angegebenen Bandbreite. Bei aktivierter harter Affinität weichen Anbieter mit niedrigen Messwerten dem Race. Bestehende Verbindungen und explizite Pins bleiben unverändert"
  el: "Σταθμίζει τους νέους αγώνες TLS με βάση τον μέγιστο ρυθμό επιβεβαιωμένων byte κάθε παρόχου σε σχέση με το δηλωμένο εύρος ζώνης του. Με την αυστηρή συνάφεια ενεργή, οι πάροχοι με χαμηλές μετρήσεις υποχωρούν στον αγώνα. Οι υπάρχουσες συνδέσεις και οι ρητές καρφιτσώσεις μένουν σταθερές"
  en: "Weight new TLS races by each provider's peak acknowledged-byte rate relative to its advertised bandwidth. With hard affinity enabled, low measured donors yield to the race. Existing connections and explicit pins stay fixed"
  es: "Pondera las nuevas carreras TLS según la tasa máxima de bytes confirmados de cada proveedor en relación con su ancho de banda anunciado. Con la afinidad estricta activada, los proveedores con mediciones bajas ceden ante la carrera. Las conexiones existentes y las fijaciones explícitas no cambian"
  es-419: "Pondera las nuevas carreras TLS según la tasa máxima de bytes confirmados de cada proveedor en relación con su ancho de banda anunciado. Con la afinidad estricta activada, los proveedores con mediciones bajas ceden ante la carrera. Las conexiones existentes y las fijaciones explícitas no cambian"
  es-MX: "Pondera las nuevas carreras TLS según la tasa máxima de bytes confirmados de cada proveedor en relación con su ancho de banda anunciado. Con la afinidad estricta activada, los proveedores con mediciones bajas ceden ante la carrera. Las conexiones existentes y las fijaciones explícitas no cambian"
  fr: "Pondère les nouvelles courses TLS selon le débit maximal d’octets acquittés de chaque fournisseur par rapport à sa bande passante annoncée. Avec l’affinité stricte activée, les fournisseurs peu performants cèdent à la course. Les connexions existantes et les épinglages explicites restent fixes"
  he: "שקלול מרוצי TLS חדשים לפי קצב השיא של בתים שאושרו אצל כל ספק ביחס לרוחב הפס המוצהר שלו. כשזיקה קשיחה מופעלת, ספקים עם מדידות נמוכות מפנים את מקומם במרוץ. חיבורים קיימים והצמדות מפורשות נשארים קבועים"
  hi: "नई TLS रेस को हर प्रदाता की पुष्टि किए गए बाइट की अधिकतम दर के आधार पर, उसकी घोषित बैंडविड्थ के अनुपात में तौलें। हार्ड एफ़िनिटी चालू होने पर कम मापे गए प्रदाता रेस को रास्ता देते हैं। मौजूदा कनेक्शन और स्पष्ट पिन नहीं बदलते"
  id: "Beri bobot pada balapan TLS baru berdasarkan laju puncak byte yang dikonfirmasi setiap penyedia dibandingkan bandwidth yang diumumkan. Dengan afinitas ketat aktif, penyedia dengan hasil ukur rendah mengalah dalam balapan. Koneksi yang ada dan pin eksplisit tetap tidak berubah"
  it: "Pesa le nuove gare TLS in base alla velocità massima di byte confermati di ogni provider rispetto alla banda dichiarata. Con l’affinità rigida attiva, i provider con misure basse cedono alla gara. Le connessioni esistenti e i blocchi espliciti restano fissi"
  ja: "新しい TLS レースを、各プロバイダーの確認済みバイトのピーク速度と公表帯域幅の比で重み付けします。ハードアフィニティが有効な場合、測定値の低い提供元はレースで譲ります。既存の接続と明示的な固定は変わりません"
  ko: "새 TLS 경쟁에 각 제공자의 확인된 바이트 최대 속도를 공시 대역폭에 대비해 가중치로 반영합니다. 강제 선호도가 켜져 있으면 측정값이 낮은 제공자는 경쟁에서 양보합니다. 기존 연결과 명시적 고정은 그대로 유지됩니다"
  nl: "Weeg nieuwe TLS-races op de piekhoeveelheid bevestigde bytes per seconde van elke provider, afgezet tegen de opgegeven bandbreedte. Met harde affiniteit aan geven laag gemeten donors voorrang aan de race. Bestaande verbindingen en expliciete pins blijven vast"
  pl: "Waży nowe wyścigi TLS według szczytowej szybkości potwierdzonych bajtów każdego dostawcy względem jego deklarowanej przepustowości. Przy włączonym twardym powinowactwie dostawcy o niskich pomiarach ustępują w wyścigu. Istniejące połączenia i jawne przypięcia pozostają bez zmian"
  pt: "Pondera as novas corridas TLS pela taxa máxima de bytes confirmados de cada fornecedor em relação à largura de banda anunciada. Com a afinidade estrita ativada, os fornecedores com medições baixas cedem à corrida. As ligações existentes e as fixações explícitas não mudam"
  pt-BR: "Pondera as novas corridas TLS pela taxa máxima de bytes confirmados de cada provedor em relação à largura de banda anunciada. Com a afinidade estrita ativada, provedores com medições baixas cedem à corrida. Conexões existentes e fixações explícitas não mudam"
  pt-PT: "Pondera as novas corridas TLS pela taxa máxima de bytes confirmados de cada fornecedor em relação à largura de banda anunciada. Com a afinidade estrita ativada, os fornecedores com medições baixas cedem à corrida. As ligações existentes e as fixações explícitas não mudam"
  ru: "Взвешивает новые TLS-гонки по пиковой скорости подтверждённых байтов каждого провайдера относительно его заявленной пропускной способности. При включённой жёсткой привязке провайдеры с низкими замерами уступают гонке. Существующие соединения и явные закрепления остаются без изменений"
  sv: "Vikta nya TLS-lopp efter varje leverantörs högsta takt av kvitterade byte i förhållande till dess angivna bandbredd. Med hård affinitet påslagen viker lågt uppmätta givare för loppet. Befintliga anslutningar och uttryckliga fästningar ligger fast"
  sw: "Pima mashindano mapya ya TLS kwa kasi ya juu ya baiti zilizothibitishwa za kila mtoa huduma ikilinganishwa na kipimo data alichotangaza. Mshikamano mkali ukiwashwa, watoa huduma wenye vipimo vya chini hupisha mashindano. Miunganisho iliyopo na ubanaji uliowekwa wazi hubaki vilevile"
  th: "ถ่วงน้ำหนักการแข่ง TLS ใหม่ตามอัตราไบต์ที่ยืนยันแล้วสูงสุดของผู้ให้บริการแต่ละรายเทียบกับแบนด์วิดท์ที่ประกาศ เมื่อเปิดความผูกพันแบบเข้มงวด ผู้ให้บริการที่วัดได้ต่ำจะหลีกทางในการแข่ง การเชื่อมต่อที่มีอยู่และการปักหมุดที่ระบุไว้จะคงเดิม"
  uk: "Зважує нові перегони TLS за піковою швидкістю підтверджених байтів кожного провайдера відносно заявленої пропускної здатності. З увімкненою жорсткою прив’язкою провайдери з низькими вимірами поступаються в перегонах. Наявні з’єднання та явні закріплення не змінюються"
  vi: "Cân nhắc các cuộc đua TLS mới theo tốc độ byte được xác nhận cao nhất của từng nhà cung cấp so với băng thông họ công bố. Khi bật ưu tiên cứng, các nhà cung cấp có kết quả đo thấp sẽ nhường trong cuộc đua. Các kết nối hiện có và các ghim rõ ràng giữ nguyên"
  zh: "按各提供商的峰值已确认字节速率相对其宣称带宽的比例，为新的 TLS 竞速加权。启用强亲和性时，测量值低的提供商会让位于竞速。现有连接和显式固定保持不变"
  zh-HK: "按各供應商的峰值已確認位元組速率相對其聲稱頻寬的比例，為新的 TLS 競速加權。啟用強親和性時，量度值低的供應商會讓位於競速。現有連線和明確固定保持不變"
