description: "Developer page: the explanation under the 'Probe silence streak' setting."
source: "How many consecutive probe passes an exit may answer with total silence before it is warned out of new-flow placement. Placement only"
platforms:
  - linux
localizations:
  ar: "عدد جولات الفحص المتتالية التي يمكن للمخرج أن يقابلها بصمت تام قبل أن يُحذَّر ويُستبعد من توزيع التدفقات الجديدة. يؤثر في التوزيع فقط"
  cs: "Kolik po sobě jdoucích průchodů sond smí výstup nechat v úplném tichu, než dostane varování a bude vyřazen z umisťování nových toků. Jen umisťování"
  de: "Wie viele aufeinanderfolgende Prüfdurchläufe ein Exit mit völliger Stille beantworten darf, bevor er per Warnung aus der Platzierung neuer Flows genommen wird. Nur die Platzierung"
  el: "Πόσους διαδοχικούς γύρους ελέγχου μπορεί μια έξοδος να αφήσει χωρίς καμία απάντηση πριν λάβει προειδοποίηση και αποκλειστεί από την τοποθέτηση νέων ροών. Μόνο τοποθέτηση"
  en: "How many consecutive probe passes an exit may answer with total silence before it is warned out of new-flow placement. Placement only"
  es: "Cuántas pasadas de sondeo consecutivas puede responder una salida con silencio total antes de quedar advertida y fuera de la asignación de flujos nuevos. Solo afecta a la asignación"
  es-419: "Cuántas pasadas de sondeo consecutivas puede responder una salida con silencio total antes de quedar advertida y fuera de la asignación de flujos nuevos. Solo afecta la asignación"
  es-MX: "Cuántas pasadas de sondeo consecutivas puede responder una salida con silencio total antes de quedar advertida y fuera de la asignación de flujos nuevos. Solo afecta la asignación"
  fr: "Combien de passes de sondage consécutives une sortie peut laisser sans aucune réponse avant d’être avertie et exclue du placement des nouveaux flux. Placement uniquement"
  he: "כמה סבבי בדיקה רצופים יציאה יכולה לענות בשתיקה מוחלטת לפני שהיא מקבלת אזהרה ומוצאת מהקצאת זרימות חדשות. הקצאה בלבד"
  hi: "कोई एग्ज़िट लगातार कितने प्रोब पास का जवाब पूरी चुप्पी से दे सकता है, इससे पहले कि उसे चेतावनी देकर नए फ़्लो के प्लेसमेंट से बाहर किया जाए। सिर्फ़ प्लेसमेंट"
  id: "Berapa banyak putaran probe berturut-turut yang boleh dijawab sebuah exit dengan diam total sebelum exit itu diperingatkan dan dikeluarkan dari penempatan aliran baru. Hanya penempatan"
  it: "Quanti passaggi di sondaggio consecutivi un’uscita può lasciare in totale silenzio prima di essere avvisata ed esclusa dall’assegnazione dei nuovi flussi. Solo assegnazione"
  ja: "出口が完全な無応答を続けてもよい確認の連続回数。これを超えると警告され、新しいフローの割り当て対象から外されます。割り当てのみ"
  ko: "출구가 완전한 무응답으로 넘길 수 있는 연속 점검 횟수입니다. 이를 넘으면 경고를 받고 새 플로우 배치에서 제외됩니다. 배치에만 적용"
  nl: "Hoeveel opeenvolgende testrondes een exit volledig stil mag laten voordat hij een waarschuwing krijgt en buiten de plaatsing van nieuwe flows valt. Alleen plaatsing"
  pl: "Ile kolejnych przebiegów sondowania wyjście może zbyć całkowitym milczeniem, zanim dostanie ostrzeżenie i zostanie wyłączone z przydzielania nowych przepływów. Tylko przydzielanie"
  pt: "Quantas rondas de sondagem consecutivas uma saída pode deixar em silêncio total antes de ser avisada e excluída da atribuição de novos fluxos. Só atribuição"
  pt-BR: "Quantas rodadas de sondagem consecutivas uma saída pode deixar em silêncio total antes de ser avisada e retirada da alocação de novos fluxos. Só alocação"
  pt-PT: "Quantas rondas de sondagem consecutivas uma saída pode deixar em silêncio total antes de ser avisada e excluída da atribuição de novos fluxos. Só atribuição"
  ru: "Сколько проходов проб подряд выход может отвечать полной тишиной, прежде чем получит предупреждение и будет исключён из размещения новых потоков. Только размещение"
  sv: "Hur många sonderingsomgångar i rad en utgång får besvara med total tystnad innan den varnas och hålls utanför placeringen av nya flöden. Bara placering"
  sw: "Idadi ya mizunguko ya vipimo mfululizo ambayo njia ya kutoka inaweza kujibu kwa ukimya kamili kabla ya kuonywa na kuondolewa kwenye upangaji wa mitiririko mipya. Upangaji pekee"
  th: "ทางออกตอบรอบการทดสอบติดต่อกันด้วยความเงียบสนิทได้กี่รอบก่อนถูกเตือนและถูกนำออกจากการจัดวางโฟลว์ใหม่ เฉพาะการจัดวาง"
  uk: "Скільки проходів зондування поспіль вихід може відповідати повною тишею, перш ніж отримає попередження й буде виключений з розміщення нових потоків. Лише розміщення"
  vi: "Một điểm thoát có thể đáp lại bao nhiêu lượt thăm dò liên tiếp bằng sự im lặng hoàn toàn trước khi bị cảnh báo và loại khỏi việc xếp luồng mới. Chỉ ảnh hưởng việc xếp luồng"
  zh: "出口可以连续多少轮探测都完全无应答，之后会被警告并排除在新流分配之外。仅影响分配"
  zh-HK: "出口可以連續多少輪探測都完全沒有回應，之後會被警告並排除在新流分配之外。只影響分配"
