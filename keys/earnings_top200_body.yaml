description: "Earnings Top 200 tile: the explanation under the projected position, replacing top200_detail (\"ranks about #N of 200 head spots\"). The ranking is the Protocol leaderboard's, done the way the SN25 validator picks its Top 200 head miners, who earn SN25α every tempo (about every 72 minutes)."
source: "Ranked like the SN25 validator's Top 200, by the distinct IP prefixes your devices provide from. Head miners earn SN25α every tempo."
platforms:
  - apple
  - android
  - windows
  - site
localizations:
  ar: "مُرتَّب كترتيب أفضل 200 لدى مُدقِّق SN25، حسب بادئات IP المميزة التي توفّر منها أجهزتك. يكسب كبار المعدِّنين SN25α في كل tempo."
  cs: "Pořadí jako u Top 200 validátoru SN25, podle různých IP prefixů, ze kterých vaše zařízení poskytují. Přední těžaři získávají SN25α v každém tempu."
  de: "Gerankt wie die Top 200 des SN25-Validators, nach den verschiedenen IP-Präfixen, von denen deine Geräte bereitstellen. Head-Miner verdienen SN25α in jedem Tempo."
  el: "Κατάταξη όπως το Top 200 του επικυρωτή του SN25, με βάση τα διακριτά προθέματα IP από τα οποία παρέχουν οι συσκευές σας. Οι κορυφαίοι εξορύκτες κερδίζουν SN25α σε κάθε tempo."
  en: "Ranked like the SN25 validator's Top 200, by the distinct IP prefixes your devices provide from. Head miners earn SN25α every tempo."
  es: "Clasificación como la del Top 200 del validador de SN25, según los prefijos de IP distintos desde los que proveen tus dispositivos. Los mineros principales ganan SN25α en cada tempo."
  es-419: "Clasificación como la del Top 200 del validador de SN25, según los prefijos de IP distintos desde los que proveen tus dispositivos. Los mineros principales ganan SN25α en cada tempo."
  es-MX: "Clasificación como la del Top 200 del validador de SN25, según los prefijos de IP distintos desde los que proveen tus dispositivos. Los mineros principales ganan SN25α en cada tempo."
  fr: "Classement établi comme le Top 200 du validateur SN25, selon les préfixes IP distincts depuis lesquels vos appareils fournissent. Les mineurs de tête gagnent des SN25α à chaque tempo."
  he: "מדורג כמו ה-Top 200 של המאמת של SN25, לפי קידומות ה-IP הייחודיות שמהן המכשירים שלכם מספקים. הכורים המובילים מרוויחים SN25α בכל tempo."
  hi: "SN25 वैलिडेटर के टॉप 200 की तरह रैंक किया गया, उन अलग-अलग IP प्रीफ़िक्स के आधार पर जिनसे आपके डिवाइस प्रदान करते हैं। शीर्ष माइनर हर tempo में SN25α कमाते हैं।"
  id: "Diperingkat seperti Top 200 validator SN25, berdasarkan prefiks IP berbeda yang dipakai perangkat Anda untuk menyediakan. Penambang teratas mendapatkan SN25α setiap tempo."
  it: "Classifica come la Top 200 del validatore di SN25, in base ai prefissi IP distinti da cui forniscono i tuoi dispositivi. I miner di testa guadagnano SN25α a ogni tempo."
  ja: "SN25 のバリデーターのトップ 200 と同じく、お使いのデバイスが提供に使う異なる IP プレフィックスで順位を付けています。上位のマイナーは tempo ごとに SN25α を獲得します。"
  ko: "SN25 검증자의 Top 200처럼, 내 기기가 제공에 사용하는 고유 IP 프리픽스를 기준으로 순위를 매깁니다. 상위 채굴자는 tempo마다 SN25α를 받습니다."
  nl: "Gerangschikt zoals de Top 200 van de SN25-validator, op de verschillende IP-prefixen waarvandaan je apparaten leveren. Topminers verdienen SN25α elke tempo."
  pl: "Ranking jak w Top 200 walidatora SN25, według różnych prefiksów IP, z których udostępniają twoje urządzenia. Czołowi górnicy zarabiają SN25α w każdym tempie."
  pt: "Classificação como o Top 200 do validador da SN25, pelos prefixos de IP distintos a partir dos quais os seus dispositivos fornecem. Os mineradores principais ganham SN25α em cada tempo."
  pt-BR: "Ranking como o Top 200 do validador da SN25, pelos prefixos de IP distintos a partir dos quais seus dispositivos fornecem. Os mineradores principais ganham SN25α a cada tempo."
  pt-PT: "Classificação como o Top 200 do validador da SN25, pelos prefixos de IP distintos a partir dos quais os seus dispositivos fornecem. Os mineradores principais ganham SN25α em cada tempo."
  ru: "Рейтинг как у Топ-200 валидатора SN25: по уникальным IP-префиксам, с которых ваши устройства предоставляют подключение. Ведущие майнеры получают SN25α в каждом tempo."
  sv: "Rankat som SN25-validatorns Topp 200, efter de olika IP-prefix som dina enheter tillhandahåller från. Toppminers tjänar SN25α varje tempo."
  sw: "Imepangwa kama Top 200 ya mthibitishaji wa SN25, kwa viambishi awali vya IP tofauti ambavyo vifaa vyako vinatolea huduma. Wachimbaji wa juu hupata SN25α kila tempo."
  th: "จัดอันดับแบบเดียวกับ Top 200 ของผู้ตรวจสอบ SN25 ตามพรีฟิกซ์ IP ที่ไม่ซ้ำกันที่อุปกรณ์ของคุณใช้ให้บริการ นักขุดชั้นนำได้รับ SN25α ทุก tempo"
  uk: "Рейтинг як у Топ-200 валідатора SN25: за унікальними IP-префіксами, з яких ваші пристрої надають підключення. Провідні майнери заробляють SN25α кожне темпо."
  vi: "Xếp hạng như Top 200 của trình xác thực SN25, dựa trên các tiền tố IP khác nhau mà thiết bị của bạn dùng để cung cấp. Các thợ đào dẫn đầu kiếm SN25α mỗi tempo."
  zh: "排名方式与 SN25 验证者的前 200 名相同，按您的设备用于提供的不同 IP 前缀计算。头部矿工在每个 tempo 赚取 SN25α。"
  zh-HK: "排名方式與 SN25 驗證者的前 200 名相同，按你的裝置用於提供的不同 IP 前綴計算。頭部礦工在每個 tempo 賺取 SN25α。"
