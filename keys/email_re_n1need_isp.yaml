  th: "เมื่อคุณไม่อยากให้ผู้ให้บริการอินเทอร์เน็ตเห็นว่าคุณเข้าเว็บไซต์ไหนบ้าง"
  uk: "Коли не хочеться, щоб інтернет-провайдер бачив, які сайти ви відвідуєте."
