description: "Body text of the slow-internet details sheet (a flyout on Windows and Linux) while URnetwork is on a slower fallback (backup) connection. Its usual connection = the way URnetwork normally connects, which this network blocks or does not support."
source: "URnetwork is using a slower fallback connection because its usual connection isn't available on this network."
platforms:
  - apple
  - android
  - windows
  - linux
# the details went with the pill's redesign, variant A+ (apple/DELAY.md
# §5.2, §7.1, §9); windows still uses it outside the pill
deprecated:
  - apple
  - android
  - linux
