description: "Muted note under a selected provider row reached through an extender, in the Provider Locations sheet, above Stay on this exit: staying pins the extender as well as the exit (EXTENDER.md K10)."
source: "Keeps this provider's IP address and extender until either goes offline."
platforms:
  - apple
localizations:
  ar: "يحتفظ بعنوان IP لهذا المزوّد وبالموسّع حتى يصبح أيٌّ منهما غير متصل."
  cs: "Ponechá IP adresu tohoto poskytovatele i extender, dokud jeden z nich nepřejde do režimu offline."
  de: "Behält die IP-Adresse dieses Anbieters und den Extender, bis einer von beiden offline geht."
  el: "Διατηρεί τη διεύθυνση IP αυτού του παρόχου και τον επεκτατή μέχρι να αποσυνδεθεί κάποιος από τους δύο."
  en: "Keeps this provider's IP address and extender until either goes offline."
  es: "Mantiene la dirección IP de este proveedor y el extensor hasta que alguno de los dos se desconecte."
  es-419: "Mantiene la dirección IP de este proveedor y el extensor hasta que alguno de los dos se desconecte."
  es-MX: "Mantiene la dirección IP de este proveedor y el extensor hasta que alguno de los dos se desconecte."
  fr: "Conserve l'adresse IP de ce fournisseur et l'extendeur jusqu'à ce que l'un des deux se déconnecte."
  he: "שומר על כתובת ה-IP של הספק הזה ועל המרחיב עד שאחד מהם מתנתק."
  hi: "इस प्रदाता का IP पता और एक्सटेंडर तब तक बने रहते हैं जब तक इनमें से कोई ऑफ़लाइन न हो जाए।"
  id: "Mempertahankan alamat IP penyedia ini dan extender-nya sampai salah satunya offline."
  it: "Mantiene l'indirizzo IP di questo provider e l'extender finché uno dei due non va offline."
  ja: "このプロバイダーのIPアドレスとエクステンダーを、どちらかがオフラインになるまで使い続けます。"
  ko: "이 제공업체의 IP 주소와 익스텐더를 둘 중 하나가 오프라인이 될 때까지 유지합니다."
  nl: "Houdt het IP-adres van deze provider en de extender aan totdat een van beide offline gaat."
  pl: "Zachowuje adres IP tego dostawcy i extender, dopóki któryś z nich nie przejdzie w tryb offline."
  pt: "Mantém o endereço IP deste fornecedor e o extensor até um deles ficar offline."
  pt-BR: "Mantém o endereço IP deste provedor e o extensor até um deles ficar offline."
  pt-PT: "Mantém o endereço IP deste fornecedor e o extensor até um deles ficar offline."
  ru: "Сохраняет IP-адрес этого провайдера и экстендер, пока один из них не отключится."
  sv: "Behåller den här leverantörens IP-adress och extendern tills någon av dem går offline."
  sw: "Huhifadhi anwani ya IP ya mtoa huduma huyu na kipanuzi hadi kimojawapo kitakapokuwa nje ya mtandao."
  th: "คงที่อยู่ IP ของผู้ให้บริการนี้และตัวขยายไว้จนกว่าอย่างใดอย่างหนึ่งจะออฟไลน์"
  uk: "Зберігає IP-адресу цього провайдера й екстендер, доки один із них не вимкнеться."
  vi: "Giữ địa chỉ IP của nhà cung cấp này và bộ mở rộng cho đến khi một trong hai ngoại tuyến."
  zh: "保持使用此提供商的 IP 地址和扩展器，直到其中任一离线。"
  zh-HK: "保持使用此供應商的 IP 位址和擴展器，直到其中任一離線。"
