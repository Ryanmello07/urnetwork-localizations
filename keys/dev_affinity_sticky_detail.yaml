description: "Developer tools screen: explanatory subtext under the 'affinity sticky' control."
source: "A site's new connections stay on the exit its earlier ones already use, even past the flow cap, so a busy site keeps one egress IP. The cap still limits which exits collect new sites. Off restores the strict cap"
platforms:
  - android
  - apple
localizations:
  ar: "تبقى الاتصالات الجديدة للموقع على المخرج الذي تستخدمه اتصالاته السابقة، حتى بعد تجاوز حد التدفقات، ليحتفظ الموقع المزدحم بعنوان IP واحد للخروج. يظل الحد يقرر أي المخارج تستقبل مواقع جديدة. عند الإيقاف، يُستعاد الحد الصارم"
  cs: "Nová připojení webu zůstávají na výstupu, který už používají ta předchozí, i nad limit toků, takže vytížený web si ponechá jednu výstupní IP. Limit dál určuje, které výstupy přijímají nové weby. Vypnuto obnoví přísný limit"
  de: "Neue Verbindungen einer Website bleiben auf dem Exit, den ihre früheren bereits nutzen, auch über das Flow-Limit hinaus, sodass eine stark genutzte Website eine Egress-IP behält. Das Limit bestimmt weiterhin, welche Exits neue Websites aufnehmen. Aus: stellt das strikte Limit wieder her"
  el: "Οι νέες συνδέσεις ενός ιστότοπου μένουν στην έξοδο που ήδη χρησιμοποιούν οι προηγούμενες, ακόμη και πάνω από το όριο ροών, ώστε ένας πολυσύχναστος ιστότοπος να κρατά μία IP εξόδου. Το όριο εξακολουθεί να καθορίζει ποιες έξοδοι δέχονται νέους ιστότοπους. Η απενεργοποίηση επαναφέρει το αυστηρό όριο"
  en: "A site's new connections stay on the exit its earlier ones already use, even past the flow cap, so a busy site keeps one egress IP. The cap still limits which exits collect new sites. Off restores the strict cap"
  es: "Las conexiones nuevas de un sitio se quedan en la salida que ya usan las anteriores, incluso por encima del límite de flujos, para que un sitio con mucho tráfico conserve una sola IP de salida. El límite sigue decidiendo qué salidas aceptan sitios nuevos. Si está desactivado, se restablece el límite estricto"
  es-419: "Las conexiones nuevas de un sitio se quedan en la salida que ya usan las anteriores, incluso por encima del límite de flujos, para que un sitio con mucho tráfico conserve una sola IP de salida. El límite sigue decidiendo qué salidas aceptan sitios nuevos. Si está desactivado, se restablece el límite estricto"
  es-MX: "Las conexiones nuevas de un sitio se quedan en la salida que ya usan las anteriores, incluso por encima del límite de flujos, para que un sitio con mucho tráfico conserve una sola IP de salida. El límite sigue decidiendo qué salidas aceptan sitios nuevos. Si está desactivado, se restablece el límite estricto"
  fr: "Les nouvelles connexions d’un site restent sur la sortie que ses connexions précédentes utilisent déjà, même au-delà du plafond de flux, pour qu’un site chargé garde une seule IP de sortie. Le plafond limite toujours les sorties qui accueillent de nouveaux sites. Désactivé rétablit le plafond strict"
  he: "חיבורים חדשים של אתר נשארים ביציאה שבה כבר משתמשים החיבורים הקודמים שלו, גם מעבר למכסת הזרימות, כך שאתר עמוס שומר על כתובת IP יוצאת אחת. המכסה עדיין קובעת אילו יציאות מקבלות אתרים חדשים. כיבוי מחזיר את המכסה הקשיחה"
  hi: "किसी साइट के नए कनेक्शन उसी एग्ज़िट पर रहते हैं जिसे उसके पिछले कनेक्शन पहले से इस्तेमाल कर रहे हैं, फ़्लो सीमा से ऊपर भी, ताकि व्यस्त साइट का एक ही इग्रेस IP बना रहे। सीमा अब भी तय करती है कि कौन-से एग्ज़िट नई साइटें लेंगे। बंद करने पर सख़्त सीमा लौट आती है"
  id: "Koneksi baru sebuah situs tetap di exit yang sudah dipakai koneksi sebelumnya, bahkan melewati batas aliran, agar situs yang sibuk tetap memakai satu IP egress. Batas tetap menentukan exit mana yang menerima situs baru. Nonaktif mengembalikan batas ketat"
  it: "Le nuove connessioni di un sito restano sull’uscita già usata dalle precedenti, anche oltre il limite di flussi, così un sito molto attivo mantiene un solo IP di uscita. Il limite decide comunque quali uscite ricevono nuovi siti. Disattivato ripristina il limite rigido"
  ja: "サイトの新しい接続は、フロー上限を超えても、以前の接続が使っている出口にとどまります。これにより、混雑したサイトでも出口 IP がひとつに保たれます。新しいサイトをどの出口が受け入れるかは引き続き上限で決まります。オフにすると厳密な上限に戻ります"
  ko: "사이트의 새 연결은 플로우 한도를 넘더라도 이전 연결이 이미 쓰는 출구에 머물러, 바쁜 사이트가 하나의 송신 IP를 유지합니다. 어떤 출구가 새 사이트를 받을지는 여전히 한도가 정합니다. 끄면 엄격한 한도로 돌아갑니다"
  nl: "Nieuwe verbindingen van een site blijven op de exit die de eerdere al gebruiken, zelfs boven de flowlimiet, zodat een drukke site één egress-IP houdt. De limiet bepaalt nog steeds welke exits nieuwe sites krijgen. Uit herstelt de strikte limiet"
  pl: "Nowe połączenia witryny zostają na wyjściu, którego używają już wcześniejsze, nawet ponad limit przepływów, aby obciążona witryna zachowała jeden wyjściowy adres IP. Limit nadal decyduje, które wyjścia przyjmują nowe witryny. Wyłączenie przywraca ścisły limit"
  pt: "As novas ligações de um site ficam na saída que as anteriores já usam, mesmo acima do limite de fluxos, para que um site movimentado mantenha um único IP de saída. O limite continua a decidir que saídas recebem novos sites. Desativado repõe o limite estrito"
  pt-BR: "As novas conexões de um site ficam na saída que as anteriores já usam, mesmo acima do limite de fluxos, para que um site movimentado mantenha um único IP de saída. O limite ainda decide quais saídas recebem novos sites. Desativado restaura o limite estrito"
  pt-PT: "As novas ligações de um site ficam na saída que as anteriores já usam, mesmo acima do limite de fluxos, para que um site movimentado mantenha um único IP de saída. O limite continua a decidir que saídas recebem novos sites. Desativado repõe o limite estrito"
  ru: "Новые соединения сайта остаются на выходе, который уже используют его прежние соединения, даже сверх лимита потоков, чтобы загруженный сайт сохранял один исходящий IP. Лимит по-прежнему определяет, какие выходы принимают новые сайты. Если выключено, восстанавливается строгий лимит"
  sv: "En webbplats nya anslutningar stannar på den utgång som de tidigare redan använder, även över flödestaket, så att en upptagen webbplats behåller en egress-IP. Taket begränsar fortfarande vilka utgångar som tar emot nya webbplatser. Av återställer det strikta taket"
  sw: "Miunganisho mipya ya tovuti hubaki kwenye njia ya kutoka ambayo miunganisho yake ya awali tayari inatumia, hata kupita kikomo cha mitiririko, ili tovuti yenye shughuli nyingi ibaki na IP moja ya kutokea. Kikomo bado huamua njia zipi za kutoka zinapokea tovuti mpya. Kuzima kunarejesha kikomo kikali"
  th: "การเชื่อมต่อใหม่ของเว็บไซต์จะอยู่บนทางออกที่การเชื่อมต่อก่อนหน้าใช้อยู่แล้ว แม้จะเกินเพดานโฟลว์ เพื่อให้เว็บไซต์ที่มีทราฟฟิกมากใช้ IP ขาออกเดียว เพดานยังคงกำหนดว่าทางออกใดรับเว็บไซต์ใหม่ ปิดเพื่อกลับไปใช้เพดานแบบเข้มงวด"
  uk: "Нові з’єднання сайту залишаються на виході, який уже використовують попередні, навіть понад ліміт потоків, щоб завантажений сайт зберігав одну вихідну IP. Ліміт і далі визначає, які виходи приймають нові сайти. Вимкнення відновлює суворий ліміт"
  vi: "Các kết nối mới của một trang web ở lại điểm thoát mà các kết nối trước đó đã dùng, kể cả khi vượt giới hạn luồng, để một trang bận giữ một IP ra ngoài. Giới hạn vẫn quyết định điểm thoát nào nhận trang mới. Tắt sẽ khôi phục giới hạn nghiêm ngặt"
  zh: "站点的新连接会留在其早先连接已使用的出口上，即使超过流上限也是如此，从而让繁忙的站点保持同一个出口 IP。上限仍决定哪些出口可以接收新站点。关闭时恢复严格上限"
  zh-HK: "網站的新連線會留在其較早連線已使用的出口上，即使超過流上限亦然，讓繁忙的網站保持同一個出口 IP。上限仍決定哪些出口可接收新網站。關閉時恢復嚴格上限"
