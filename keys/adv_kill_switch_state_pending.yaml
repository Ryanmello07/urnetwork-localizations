description: "Kill switch status: nothing is blocked yet, takes effect on connect."
source: "Nothing is blocked yet — this takes effect the moment you connect."
platforms:
  - linux
localizations:
  ar: "لم يُحجب شيء بعد — يسري هذا لحظة اتصالك."
  cs: "Zatím nic není blokováno — začne to platit v okamžiku připojení."
  de: "Noch ist nichts blockiert — das gilt ab dem Moment, in dem du dich verbindest."
  el: "Τίποτα δεν έχει αποκλειστεί ακόμη — ισχύει τη στιγμή που θα συνδεθείτε."
  en: "Nothing is blocked yet — this takes effect the moment you connect."
  es: "Aún no se bloquea nada — entra en vigor en cuanto te conectes."
  es-419: "Todavía no se bloquea nada — entra en vigor en cuanto te conectes."
  es-MX: "Aún no se bloquea nada — entra en vigor en cuanto te conectes."
  fr: "Rien n’est encore bloqué — cela prend effet dès que vous vous connectez."
  he: "עדיין שום דבר לא חסום — זה נכנס לתוקף ברגע שתתחברו."
  hi: "अभी कुछ भी रोका नहीं गया है — यह आपके कनेक्ट करते ही प्रभावी होगा।"
  id: "Belum ada yang diblokir — berlaku begitu Anda terhubung."
  it: "Non è ancora bloccato nulla — ha effetto nel momento in cui ti connetti."
  ja: "まだ何も遮断されていません — 接続した瞬間に有効になります。"
  ko: "아직 아무것도 차단되지 않았습니다. 연결하는 순간 적용됩니다."
  nl: "Er is nog niets geblokkeerd — dit gaat in zodra je verbinding maakt."
  pl: "Nic nie jest jeszcze blokowane — zacznie obowiązywać w chwili połączenia."
  pt: "Nada está bloqueado ainda — passa a valer no momento em que você conectar."
  pt-BR: "Nada está bloqueado ainda — passa a valer no momento em que você conectar."
  pt-PT: "Ainda nada está bloqueado — entra em vigor no momento em que ligar."
  ru: "Пока ничего не заблокировано — это вступит в силу в момент подключения."
  sv: "Inget är blockerat ännu — det gäller från det ögonblick du ansluter."
  sw: "Bado hakuna kilichozuiwa — hii huanza kutumika wakati unapounganisha."
  th: "ยังไม่มีสิ่งใดถูกบล็อก — จะมีผลทันทีที่คุณเชื่อมต่อ"
  uk: "Поки нічого не заблоковано — це набуде чинності в момент підключення."
  vi: "Chưa có gì bị chặn — sẽ có hiệu lực ngay khi bạn kết nối."
  zh: "尚未阻断任何流量 — 将在你连接的那一刻生效。"
  zh-HK: "尚未封鎖任何流量 — 將在你連線的那一刻生效。"
