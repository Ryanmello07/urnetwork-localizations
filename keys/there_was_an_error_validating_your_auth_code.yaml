description: "Used in Authenticate/LoginInitial/AuthCodeLoginSheet.swift."
source: "There was an error validating your auth code. Please try again or generate a new one"
platforms:
  - apple
  - site
localizations:
  ar: "حدث خطأ أثناء التحقق من رمز المصادقة الخاص بك. يرجى المحاولة مرة أخرى أو إنشاء رمز جديد."
  cs: "Došlo k chybě při ověřování vašeho ověřovacího kódu. Zkuste to prosím znovu nebo vygenerujte nový kód."
  de: "Beim Validieren deines Auth-Codes ist ein Fehler aufgetreten. Bitte versuche es erneut oder generiere einen neuen."
  el: "Υπήρξε σφάλμα κατά την επικύρωση του κωδικού ταυτοποίησης. Παρακαλώ δοκιμάστε ξανά ή δημιουργήστε έναν νέο."
  en: "There was an error validating your auth code. Please try again or generate a new one"
  es: "Hubo un error al validar tu código de autenticación. Por favor, inténtalo de nuevo o genera uno nuevo."
  es-419: "Hubo un error al validar tu código de autenticación. Por favor, inténtalo de nuevo o genera uno nuevo."
  es-MX: "Hubo un error al validar tu código de autenticación. Por favor, inténtalo de nuevo o genera uno nuevo."
  fr: "Une erreur s’est produite lors de la validation de votre code d’authentification. Veuillez réessayer ou en générer un nouveau."
  he: "אירעה שגיאה באימות קוד האימות שלך. נסה שוב או צור קוד חדש."
  hi: "आपके ऑथ कोड को सत्यापित करने में त्रुटि हुई। कृपया फिर से प्रयास करें या नया कोड जनरेट करें।"
  id: "Terjadi kesalahan saat memvalidasi kode autentikasi Anda. Silakan coba lagi atau buat kode baru."
  it: "Si è verificato un errore durante la validazione del codice di autenticazione. Riprova o generane uno nuovo."
  ja: "認証コードの検証中にエラーが発生しました。もう一度お試しください、または新しいコードを生成してください。"
  ko: "인증 코드 확인 중 오류가 발생했습니다. 다시 시도하거나 새 코드를 생성하세요."
  nl: "Er is een fout opgetreden bij het valideren van uw auth-code. Probeer het opnieuw of genereer een nieuwe."
  pl: "Wystąpił błąd podczas weryfikacji kodu autoryzacyjnego. Proszę spróbować ponownie lub wygenerować nowy kod."
  pt: "Ocorreu um erro ao validar o seu código de autenticação. Tente novamente ou gere um novo."
  pt-BR: "Ocorreu um erro ao validar seu código de autenticação. Tente novamente ou gere um novo."
  pt-PT: "Ocorreu um erro ao validar o seu código de autenticação. Tente novamente ou gere um novo."
  ru: "Ошибка при проверке вашего кода аутентификации. Пожалуйста, попробуйте снова или сгенерируйте новый."
  sv: "Det uppstod ett fel när din autentiseringskod validerades. Försök igen eller generera en ny."
  sw: "Hitilafu imetokea wakati wa kuthibitisha nambari yako ya uthibitishaji. Tafadhali jaribu tena au tengeneza mpya"
  th: "เกิดข้อผิดพลาดในการตรวจสอบรหัสยืนยันของคุณ โปรดลองอีกครั้งหรือสร้างรหัสใหม่"
  uk: "Сталася помилка під час перевірки коду авторизації. Спробуйте ще раз або згенеруйте новий."
  vi: "Có lỗi khi xác thực mã của bạn. Vui lòng thử lại hoặc tạo mã mới."
  zh: "验证您的认证码时出错。请重试或生成新的认证码。"
  zh-HK: "驗證你的認證碼時發生錯誤。請再試一次或產生新的認證碼。"
