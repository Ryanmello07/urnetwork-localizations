description: "Protocol leaderboard (Leaderboard > Protocol): the paragraph under the own-status card (in the second pane on wide screens) that explains the ranking. The SN25 validator picks its Top 200 head miners by distinct IP prefixes; a prefix several networks provide from is split between them. The board updates once per tempo, about every 72 minutes."
source: "Ranked the way the SN25 validator picks its Top 200: by how many distinct IP prefixes your devices provide from, with shared prefixes split between the networks on them. Updated about every 72 minutes. These are projections until you claim."
platforms:
  - apple
  - android
  - site
  - linux
localizations:
  ar: "يُرتَّب كما يختار مُدقِّق SN25 أفضل 200 لديه: حسب عدد بادئات IP المميزة التي توفّر منها أجهزتك، مع تقسيم البادئات المشتركة بين الشبكات التي تستخدمها. يُحدَّث كل 72 دقيقة تقريبًا. هذه توقعات إلى أن تحجز مكانك."
  cs: "Pořadí odpovídá tomu, jak validátor SN25 vybírá svých Top 200: podle počtu různých IP prefixů, ze kterých vaše zařízení poskytují, přičemž sdílené prefixy se dělí mezi sítě, které je používají. Aktualizuje se zhruba každých 72 minut. Dokud si místo nezajistíte, jde o prognózy."
  de: "Gerankt wie der SN25-Validator seine Top 200 auswählt: nach der Zahl verschiedener IP-Präfixe, von denen deine Geräte bereitstellen. Geteilte Präfixe werden unter den Netzwerken darauf aufgeteilt. Wird etwa alle 72 Minuten aktualisiert. Bis du dir einen Platz sicherst, sind das Prognosen."
  el: "Η κατάταξη γίνεται όπως ο επικυρωτής του SN25 επιλέγει το Top 200 του: με βάση πόσα διακριτά προθέματα IP χρησιμοποιούν οι συσκευές σας για παροχή, ενώ τα κοινά προθέματα μοιράζονται στα δίκτυα που τα χρησιμοποιούν. Ενημερώνεται περίπου κάθε 72 λεπτά. Μέχρι να κλείσετε θέση, πρόκειται για προβλέψεις."
  en: "Ranked the way the SN25 validator picks its Top 200: by how many distinct IP prefixes your devices provide from, with shared prefixes split between the networks on them. Updated about every 72 minutes. These are projections until you claim."
  es: "Clasificación hecha como el validador de SN25 elige su Top 200: según cuántos prefijos de IP distintos usan tus dispositivos para proveer, y los prefijos compartidos se reparten entre las redes que los usan. Se actualiza cada 72 minutos aproximadamente. Son previsiones hasta que reclames tu puesto."
  es-419: "Clasificación hecha como el validador de SN25 elige su Top 200: según cuántos prefijos de IP distintos usan tus dispositivos para proveer, y los prefijos compartidos se reparten entre las redes que los usan. Se actualiza cada 72 minutos aproximadamente. Son previsiones hasta que reclames tu lugar."
  es-MX: "Clasificación hecha como el validador de SN25 elige su Top 200: según cuántos prefijos de IP distintos usan tus dispositivos para proveer, y los prefijos compartidos se reparten entre las redes que los usan. Se actualiza cada 72 minutos aproximadamente. Son previsiones hasta que reclames tu lugar."
  fr: "Classement établi comme le validateur SN25 choisit son Top 200 : selon le nombre de préfixes IP distincts depuis lesquels vos appareils fournissent, les préfixes partagés étant répartis entre les réseaux qui les utilisent. Mis à jour environ toutes les 72 minutes. Ce sont des prévisions tant que vous n’avez pas réservé votre place."
  he: "הדירוג נקבע כמו שהמאמת של SN25 בוחר את ה-Top 200 שלו: לפי מספר קידומות ה-IP הייחודיות שמהן המכשירים שלכם מספקים, כשקידומות משותפות מתחלקות בין הרשתות שמשתמשות בהן. מתעדכן בערך כל 72 דקות. אלה תחזיות עד שתתפסו מקום."
  hi: "रैंकिंग वैसे ही होती है जैसे SN25 वैलिडेटर अपने टॉप 200 चुनता है: इस आधार पर कि आपके डिवाइस कितने अलग-अलग IP प्रीफ़िक्स से प्रदान करते हैं, और साझा प्रीफ़िक्स उन्हें इस्तेमाल करने वाले नेटवर्क में बँट जाते हैं। यह लगभग हर 72 मिनट में अपडेट होती है। जगह पक्की करने तक ये अनुमान हैं।"
  id: "Diperingkat seperti cara validator SN25 memilih Top 200-nya: berdasarkan jumlah prefiks IP berbeda yang dipakai perangkat Anda untuk menyediakan, dengan prefiks bersama dibagi di antara jaringan yang memakainya. Diperbarui sekitar setiap 72 menit. Ini masih proyeksi sampai Anda mengamankan tempat."
  it: "La classifica segue il modo in cui il validatore di SN25 sceglie la sua Top 200: in base a quanti prefissi IP distinti usano i tuoi dispositivi per fornire, con i prefissi condivisi ripartiti tra le reti che li usano. Si aggiorna circa ogni 72 minuti. Sono previsioni finché non prendi il tuo posto."
  ja: "SN25 のバリデーターがトップ 200 を選ぶのと同じ基準で順位を付けています。お使いのデバイスが提供に使う異なる IP プレフィックスの数で決まり、共有されているプレフィックスは、それを使うネットワークの間で分け合います。約 72 分ごとに更新されます。枠を確保するまでは予測値です。"
  ko: "SN25 검증자가 Top 200을 고르는 방식대로 순위를 매깁니다. 내 기기가 제공에 사용하는 고유 IP 프리픽스 수를 기준으로 하며, 공유된 프리픽스는 이를 사용하는 네트워크끼리 나눕니다. 약 72분마다 업데이트됩니다. 자리를 확보하기 전까지는 예상치입니다."
  nl: "Gerangschikt zoals de SN25-validator zijn Top 200 kiest: op het aantal verschillende IP-prefixen waarvandaan je apparaten leveren, waarbij gedeelde prefixen worden verdeeld over de netwerken die ze gebruiken. Wordt ongeveer elke 72 minuten bijgewerkt. Tot je claimt, zijn dit verwachtingen."
  pl: "Ranking odpowiada temu, jak walidator SN25 wybiera swoje Top 200: według liczby różnych prefiksów IP, z których udostępniają twoje urządzenia, przy czym współdzielone prefiksy są dzielone między sieci, które z nich korzystają. Aktualizuje się mniej więcej co 72 minuty. Dopóki nie zajmiesz miejsca, to tylko prognozy."
  pt: "Classificação feita como o validador da SN25 escolhe o seu Top 200: pelo número de prefixos de IP distintos a partir dos quais os seus dispositivos fornecem, com os prefixos partilhados divididos entre as redes que os usam. Atualizada a cada 72 minutos, aproximadamente. São previsões até garantir o seu lugar."
  pt-BR: "Ranking feito do jeito que o validador da SN25 escolhe o Top 200: pelo número de prefixos de IP distintos a partir dos quais seus dispositivos fornecem, com os prefixos compartilhados divididos entre as redes que os usam. Atualizado a cada 72 minutos, aproximadamente. São previsões até você garantir sua vaga."
  pt-PT: "Classificação feita como o validador da SN25 escolhe o seu Top 200: pelo número de prefixos de IP distintos a partir dos quais os seus dispositivos fornecem, com os prefixos partilhados divididos entre as redes que os usam. Atualizada a cada 72 minutos, aproximadamente. São previsões até garantir o seu lugar."
  ru: "Рейтинг строится так же, как валидатор SN25 выбирает свой Топ-200: по числу уникальных IP-префиксов, с которых ваши устройства предоставляют подключение, а общие префиксы делятся между сетями, которые их используют. Обновляется примерно каждые 72 минуты. Пока вы не заняли место, это прогноз."
  sv: "Rankat på samma sätt som SN25-validatorn väljer sin Topp 200: efter hur många olika IP-prefix dina enheter tillhandahåller från, där delade prefix fördelas mellan nätverken som använder dem. Uppdateras ungefär var 72:e minut. Det här är prognoser tills du tar en plats."
  sw: "Imepangwa kama mthibitishaji wa SN25 anavyochagua Top 200 yake: kwa idadi ya viambishi awali vya IP tofauti ambavyo vifaa vyako vinatolea huduma, na viambishi awali vinavyoshirikiwa hugawanywa kati ya mitandao inayovitumia. Husasishwa takriban kila dakika 72. Haya ni makadirio hadi upate nafasi."
  th: "จัดอันดับแบบเดียวกับที่ผู้ตรวจสอบของ SN25 เลือก Top 200: ตามจำนวนพรีฟิกซ์ IP ที่ไม่ซ้ำกันที่อุปกรณ์ของคุณใช้ให้บริการ โดยพรีฟิกซ์ที่ใช้ร่วมกันจะแบ่งกันระหว่างเครือข่ายที่ใช้พรีฟิกซ์นั้น อัปเดตประมาณทุก 72 นาที ค่าเหล่านี้เป็นการคาดการณ์จนกว่าคุณจะจองที่"
  uk: "Рейтинг будується так само, як валідатор SN25 обирає свій Топ-200: за кількістю унікальних IP-префіксів, з яких ваші пристрої надають підключення, а спільні префікси діляться між мережами, які їх використовують. Оновлюється приблизно кожні 72 хвилини. Доки ви не зайняли місце, це прогноз."
  vi: "Xếp hạng theo cách trình xác thực SN25 chọn Top 200 của mình: dựa trên số tiền tố IP khác nhau mà thiết bị của bạn dùng để cung cấp, và các tiền tố dùng chung được chia cho các mạng dùng chúng. Cập nhật khoảng 72 phút một lần. Đây là dự kiến cho đến khi bạn giành chỗ."
  zh: "排名方式与 SN25 验证者选出其前 200 名的方式相同：按您的设备用于提供的不同 IP 前缀数量计算，共享的前缀由使用它的网络分摊。大约每 72 分钟更新一次。在您获取席位之前，这些都是预计结果。"
  zh-HK: "排名方式與 SN25 驗證者選出其前 200 名的方式相同：按你的裝置用於提供的不同 IP 前綴數量計算，共用的前綴由使用它的網絡分攤。大約每 72 分鐘更新一次。在你取得席位之前，這些都是預計結果。"
