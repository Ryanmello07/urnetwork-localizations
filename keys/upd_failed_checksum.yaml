description: "Update notice error (Linux Settings, Windows update banner): the downloaded file failed its integrity check and was deleted."
source: "The download didn't match the release's checksums, so it was discarded. Click to try again."
platforms:
  - linux
  - windows
localizations:
  ar: "لم يطابق الملف الذي تم تنزيله المجاميع الاختبارية للإصدار فتم تجاهله. انقر لإعادة المحاولة."
  cs: "Stažený soubor neodpovídal kontrolním součtům vydání a byl zahozen. Klikněte a zkuste to znovu."
  de: "Der Download stimmte nicht mit den Prüfsummen der Version überein und wurde verworfen. Klicke, um es erneut zu versuchen."
  el: "Η λήψη δεν ταίριαζε με τα αθροίσματα ελέγχου της έκδοσης και απορρίφθηκε. Κάντε κλικ για να δοκιμάσετε ξανά."
  en: "The download didn't match the release's checksums, so it was discarded. Click to try again."
  es: "La descarga no coincidía con las sumas de comprobación de la versión y se descartó. Haz clic para volver a intentarlo."
  es-419: "La descarga no coincidía con las sumas de verificación de la versión y se descartó. Haz clic para volver a intentarlo."
  es-MX: "La descarga no coincidía con las sumas de verificación de la versión y se descartó. Haz clic para volver a intentarlo."
  fr: "Le téléchargement ne correspondait pas aux sommes de contrôle de la version et a été supprimé. Cliquez pour réessayer."
  he: "ההורדה לא תאמה לסכומי הביקורת של הגרסה ולכן נמחקה. לחצו כדי לנסות שוב."
  hi: "डाउनलोड रिलीज़ के चेकसम से मेल नहीं खाया और उसे हटा दिया गया। फिर से कोशिश करने के लिए क्लिक करें।"
  id: "Unduhan tidak cocok dengan checksum rilis dan telah dibuang. Klik untuk mencoba lagi."
  it: "Il download non corrispondeva ai checksum della versione ed è stato eliminato. Fai clic per riprovare."
  ja: "ダウンロードがリリースのチェックサムと一致しなかったため、破棄されました。クリックして再試行してください。"
  ko: "다운로드가 릴리스 체크섬과 일치하지 않아 삭제되었습니다. 클릭하여 다시 시도하세요."
  nl: "De download kwam niet overeen met de controlesommen van de release en is verwijderd. Klik om het opnieuw te proberen."
  pl: "Pobrany plik nie zgadzał się z sumami kontrolnymi wydania i został odrzucony. Kliknij, aby spróbować ponownie."
  pt: "O download não correspondeu aos checksums da versão e foi descartado. Clique para tentar novamente."
  pt-BR: "O download não correspondeu aos checksums da versão e foi descartado. Clique para tentar novamente."
  pt-PT: "A transferência não correspondia às somas de verificação da versão e foi descartada. Clique para tentar novamente."
  ru: "Загруженный файл не совпал с контрольными суммами выпуска и был удалён. Нажмите, чтобы попробовать снова."
  sv: "Nedladdningen stämde inte med versionens kontrollsummor och kasserades. Klicka för att försöka igen."
  sw: "Faili lililopakuliwa halikulingana na checksum za toleo kwa hivyo limetupwa. Bofya ili ujaribu tena."
  th: "ไฟล์ที่ดาวน์โหลดไม่ตรงกับ checksum ของรุ่นนี้ จึงถูกทิ้งไป คลิกเพื่อลองอีกครั้ง"
  uk: "Завантажений файл не збігся з контрольними сумами випуску й був видалений. Натисніть, щоб спробувати ще раз."
  vi: "Tệp tải về không khớp với checksum của bản phát hành và đã bị loại bỏ. Nhấp để thử lại."
  zh: "下载的文件与该版本的校验和不符，已被丢弃。点击重试。"
  zh-HK: "下載的檔案與該版本的校驗碼不符，已被捨棄。按一下再試一次。"
