description: "Empty state of the unclaimed tile once a wallet is connected."
source: "Nothing to claim yet. Alpha accrues from the next finalized epoch."
platforms:
  - linux
localizations:
  ar: "لا يوجد ما يمكن المطالبة به بعد. يتراكم Alpha بدءًا من الفترة المكتملة التالية."
  cs: "Zatím není co vyzvednout. Alpha se začne připisovat od příští dokončené epochy."
  de: "Noch nichts einzulösen. Alpha sammelt sich ab der nächsten abgeschlossenen Epoche an."
  el: "Δεν υπάρχει ακόμη τίποτα για διεκδίκηση. Το Alpha συσσωρεύεται από την επόμενη οριστικοποιημένη εποχή."
  en: "Nothing to claim yet. Alpha accrues from the next finalized epoch."
  es: "Aún no hay nada que reclamar. El Alpha se acumula a partir de la próxima época finalizada."
  es-419: "Todavía no hay nada que reclamar. El Alpha se acumula a partir de la próxima época finalizada."
  es-MX: "Todavía no hay nada que reclamar. El Alpha se acumula a partir de la próxima época finalizada."
  fr: "Rien à réclamer pour l’instant. L’Alpha s’accumule à partir de la prochaine époque finalisée."
  he: "עדיין אין מה לממש. ה-Alpha מצטבר החל מהתקופה הבאה שתושלם."
  hi: "अभी दावा करने को कुछ नहीं है। Alpha अगले पूर्ण एपोक से जमा होता है।"
  id: "Belum ada yang bisa diklaim. Alpha terkumpul mulai epoch berikutnya yang sudah final."
  it: "Ancora niente da riscattare. L’Alpha matura a partire dalla prossima epoca finalizzata."
  ja: "受け取れるものはまだありません。Alpha は次に確定するエポックから貯まります。"
  ko: "아직 받을 것이 없습니다. Alpha는 다음에 확정되는 에포크부터 쌓입니다."
  nl: "Nog niets op te eisen. Alpha bouwt zich op vanaf de volgende afgeronde epoch."
  pl: "Na razie nie ma nic do odebrania. Alpha nalicza się od następnej sfinalizowanej epoki."
  pt: "Ainda não há nada para reivindicar. O Alpha acumula a partir da próxima época finalizada."
  pt-BR: "Nada para resgatar ainda. O Alpha se acumula a partir da próxima época finalizada."
  pt-PT: "Ainda não há nada para reivindicar. O Alpha acumula a partir da próxima época finalizada."
  ru: "Пока нечего получать. Alpha начисляется со следующей завершённой эпохи."
  sv: "Inget att hämta ut än. Alpha samlas från nästa slutförda epok."
  sw: "Bado hakuna cha kudai. Alpha hulimbikizwa kuanzia kipindi kijacho kitakachokamilika."
  th: "ยังไม่มีอะไรให้รับ Alpha จะเริ่มสะสมตั้งแต่อีพอคถัดไปที่สรุปแล้ว"
  uk: "Поки нічого отримувати. Alpha нараховується з наступної завершеної епохи."
  vi: "Chưa có gì để nhận. Alpha được tích lũy từ epoch hoàn tất tiếp theo."
  zh: "暂无可领取的内容。Alpha 将从下一个已确认的周期开始累积。"
  zh-HK: "暫時沒有可領取的內容。Alpha 會由下一個已確認的週期開始累積。"
