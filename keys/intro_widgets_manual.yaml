description: "Manual steps for adding widgets on launchers without the pin dialog."
source: "Long-press your home screen, choose Widgets, and pick URnetwork."
platforms:
  - android
  - apple
localizations:
  ar: "اضغط مطولًا على شاشتك الرئيسية، واختر «الأدوات»، ثم اختر URnetwork."
  cs: "Podržte prst na domovské obrazovce, vyberte Widgety a zvolte URnetwork."
  de: "Drücke lange auf deinen Startbildschirm, wähle „Widgets“ und dann URnetwork."
  el: "Πατήστε παρατεταμένα την αρχική οθόνη, επιλέξτε Γραφικά στοιχεία και διαλέξτε URnetwork."
  en: "Long-press your home screen, choose Widgets, and pick URnetwork."
  es: "Mantén pulsada tu pantalla de inicio, elige «Widgets» y selecciona URnetwork."
  es-419: "Mantén presionada tu pantalla de inicio, elige \"Widgets\" y selecciona URnetwork."
  es-MX: "Mantén presionada tu pantalla de inicio, elige \"Widgets\" y selecciona URnetwork."
  fr: "Appuyez de manière prolongée sur votre écran d’accueil, choisissez Widgets et sélectionnez URnetwork."
  he: "לחצו לחיצה ארוכה על מסך הבית, בחרו ״ווידג׳טים״ ובחרו URnetwork."
  hi: "होम स्क्रीन को दबाकर रखें, विजेट चुनें, और URnetwork चुनें।"
  id: "Tekan lama layar utama, pilih Widget, lalu pilih URnetwork."
  it: "Tieni premuto sulla schermata Home, scegli Widget e seleziona URnetwork."
  ja: "ホーム画面を長押しし、「ウィジェット」を選んで URnetwork を選択します。"
  ko: "홈 화면을 길게 누르고 위젯을 선택한 다음 URnetwork를 고르세요."
  nl: "Houd je startscherm ingedrukt, kies Widgets en selecteer URnetwork."
  pl: "Przytrzymaj ekran główny, wybierz Widżety i wskaż URnetwork."
  pt: "Mantenha premido o ecrã principal, escolha Widgets e selecione URnetwork."
  pt-BR: "Toque e segure a tela inicial, escolha Widgets e selecione URnetwork."
  pt-PT: "Mantenha premido o ecrã principal, escolha Widgets e selecione URnetwork."
  ru: "Нажмите и удерживайте главный экран, выберите «Виджеты» и найдите URnetwork."
  sv: "Tryck länge på hemskärmen, välj Widgetar och välj URnetwork."
  sw: "Bonyeza na ushikilie skrini ya kwanza, chagua Wijeti, na uchague URnetwork."
  th: "แตะหน้าจอหลักค้างไว้ เลือกวิดเจ็ต แล้วเลือก URnetwork"
  uk: "Утримуйте головний екран, виберіть «Віджети» й укажіть URnetwork."
  vi: "Nhấn giữ màn hình chính, chọn Tiện ích và chọn URnetwork."
  zh: "长按主屏幕，选择“小组件”，然后选择 URnetwork。"
  zh-HK: "長按主畫面，選擇「小工具」，然後選擇 URnetwork。"
