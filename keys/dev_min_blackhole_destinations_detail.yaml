description: "Developer tools screen: explanatory subtext under the 'min blackhole destinations' control."
source: "How many distinct destinations must be silent before an exit is convicted on no-receive, so one dead site cannot remove a working exit. Off lets a single destination convict"
platforms:
  - android
  - apple
localizations:
  ar: "عدد الوجهات المختلفة التي يجب أن تكون صامتة قبل إدانة مخرج بعدم الاستقبال، كي لا يتمكن موقع ميت واحد من إزالة مخرج يعمل. عند الإيقاف، تكفي وجهة واحدة للإدانة"
  cs: "Kolik různých cílů musí být tichých, než je výstup odsouzen za nepříjem, aby jediný mrtvý web nemohl odstranit fungující výstup. Vypnuto nechá odsoudit i jediný cíl"
  de: "Wie viele verschiedene Ziele still sein müssen, bevor ein Exit wegen fehlenden Empfangs verurteilt wird, damit eine einzelne tote Website keinen funktionierenden Exit entfernen kann. Aus: ein einzelnes Ziel reicht zur Verurteilung"
  el: "Πόσοι διαφορετικοί προορισμοί πρέπει να σιωπούν πριν καταδικαστεί μια έξοδος για μη λήψη, ώστε ένας μόνο νεκρός ιστότοπος να μην μπορεί να αφαιρέσει μια λειτουργική έξοδο. Η απενεργοποίηση αφήνει έναν μόνο προορισμό να καταδικάσει"
  en: "How many distinct destinations must be silent before an exit is convicted on no-receive, so one dead site cannot remove a working exit. Off lets a single destination convict"
  es: "Cuántos destinos distintos deben quedar en silencio antes de condenar una salida por no recibir, para que un solo sitio caído no pueda eliminar una salida que funciona. Si está desactivado, basta un único destino para condenar"
  es-419: "Cuántos destinos distintos deben quedar en silencio antes de condenar una salida por no recibir, para que un solo sitio caído no pueda eliminar una salida que funciona. Si está desactivado, basta un único destino para condenar"
  es-MX: "Cuántos destinos distintos deben quedar en silencio antes de condenar una salida por no recibir, para que un solo sitio caído no pueda eliminar una salida que funciona. Si está desactivado, basta un único destino para condenar"
  fr: "Combien de destinations distinctes doivent rester silencieuses avant qu’une sortie soit condamnée pour absence de réception, pour qu’un seul site en panne ne puisse pas retirer une sortie qui fonctionne. Désactivé laisse une seule destination condamner"
  he: "כמה יעדים שונים צריכים לשתוק לפני שיציאה מורשעת באי-קבלה, כדי שאתר מת אחד לא יוכל להסיר יציאה תקינה. כיבוי מאפשר ליעד יחיד להרשיע"
  hi: "किसी एग्ज़िट को कुछ न मिलने के आधार पर दोषी ठहराने से पहले कितने अलग गंतव्यों का शांत होना ज़रूरी है, ताकि एक बंद साइट काम करते एग्ज़िट को न हटा सके। बंद करने पर एक ही गंतव्य दोषी ठहरा सकता है"
  id: "Berapa banyak tujuan berbeda yang harus diam sebelum exit divonis tidak menerima, agar satu situs mati tidak bisa menghapus exit yang berfungsi. Nonaktif membiarkan satu tujuan memvonis"
  it: "Quante destinazioni distinte devono essere silenziose prima che un’uscita venga condannata per mancata ricezione, così un solo sito irraggiungibile non può rimuovere un’uscita funzionante. Disattivato lascia condannare a una sola destinazione"
  ja: "受信なしで出口を判定するまでに無応答でなければならない異なる宛先の数。1 つのサイトの停止で正常な出口が除外されることを防ぎます。オフにすると 1 つの宛先だけで判定します"
  ko: "수신 없음으로 출구를 판정하기 전에 무응답이어야 하는 서로 다른 대상 수로, 죽은 사이트 하나 때문에 정상 출구가 제외되지 않게 합니다. 끄면 대상 하나만으로 판정합니다"
  nl: "Hoeveel verschillende bestemmingen stil moeten zijn voordat een exit wordt veroordeeld voor geen ontvangst, zodat één dode site geen werkende exit kan verwijderen. Uit laat één bestemming veroordelen"
  pl: "Ile różnych celów musi milczeć, zanim wyjście zostanie skazane za brak odbioru, aby jedna martwa witryna nie mogła usunąć działającego wyjścia. Wyłączenie pozwala skazać na podstawie jednego celu"
  pt: "Quantos destinos distintos têm de ficar em silêncio antes de uma saída ser condenada por não receber, para que um único site em baixo não remova uma saída que funciona. Desativado deixa um único destino condenar"
  pt-BR: "Quantos destinos distintos precisam ficar em silêncio antes que uma saída seja condenada por não receber, para que um único site fora do ar não remova uma saída que funciona. Desativado deixa um único destino condenar"
  pt-PT: "Quantos destinos distintos têm de ficar em silêncio antes de uma saída ser condenada por não receber, para que um único site em baixo não remova uma saída que funciona. Desativado deixa um único destino condenar"
  ru: "Сколько разных адресатов должны молчать, прежде чем выход будет осуждён за отсутствие приёма, чтобы один мёртвый сайт не мог удалить рабочий выход. Если выключено, для осуждения достаточно одного адресата"
  sv: "Hur många olika destinationer som måste vara tysta innan en utgång fälls för utebliven mottagning, så att en enda död webbplats inte kan ta bort en fungerande utgång. Av låter en enda destination fälla"
  sw: "Idadi ya malengo tofauti yanayopaswa kuwa kimya kabla njia ya kutoka haijahukumiwa kwa kutopokea, ili tovuti moja iliyokufa isiweze kuondoa njia ya kutoka inayofanya kazi. Kuzima kunaruhusu lengo moja kuhukumu"
  th: "ต้องมีปลายทางต่างกันกี่แห่งที่เงียบก่อนตัดสินว่าทางออกไม่รับข้อมูล เพื่อไม่ให้เว็บไซต์ที่ตายเพียงแห่งเดียวลบทางออกที่ใช้งานได้ ปิดเพื่อให้ปลายทางเดียวตัดสินได้"
  uk: "Скільки різних цілей має мовчати, перш ніж вихід засудять за відсутність прийому, щоб один мертвий сайт не міг видалити робочий вихід. Вимкнення дозволяє засудити за однією ціллю"
  vi: "Cần bao nhiêu đích khác nhau im lặng trước khi một điểm thoát bị kết luận là không nhận, để một trang chết duy nhất không thể loại bỏ một điểm thoát đang hoạt động. Tắt cho phép một đích duy nhất kết luận"
  zh: "在因无接收而将出口定罪之前，必须有多少个不同的目标保持静默，以免单个失效站点导致正常出口被移除。关闭时单个目标即可定罪"
  zh-HK: "在因沒有接收而將出口判罪之前，必須有多少個不同的目標保持靜默，以免單一失效網站令正常出口被移除。關閉時單一目標即可判罪"
