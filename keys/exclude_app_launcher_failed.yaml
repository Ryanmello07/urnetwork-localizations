description: "Exclude apps from the VPN sheet: error when a launcher copy could not be written or removed in the user's applications folder."
source: "Couldn't change the launcher. Check that your applications folder can be written."
platforms:
  - linux
localizations:
  ar: "تعذّر تغيير المشغّل. تحقّق من إمكانية الكتابة في مجلد التطبيقات."
  cs: "Spouštěč se nepodařilo změnit. Zkontrolujte, zda lze zapisovat do složky aplikací."
  de: "Der Starter konnte nicht geändert werden. Prüfe, ob dein Anwendungsordner beschreibbar ist."
  el: "Δεν ήταν δυνατή η αλλαγή της εκκίνησης. Ελέγξτε ότι ο φάκελος εφαρμογών σας είναι εγγράψιμος."
  en: "Couldn't change the launcher. Check that your applications folder can be written."
  es: "No se pudo cambiar el lanzador. Comprueba que se puede escribir en tu carpeta de aplicaciones."
  es-419: "No se pudo cambiar el lanzador. Verifica que se pueda escribir en tu carpeta de aplicaciones."
  es-MX: "No se pudo cambiar el lanzador. Verifica que se pueda escribir en tu carpeta de aplicaciones."
  fr: "Impossible de modifier le lanceur. Vérifiez que votre dossier d’applications est accessible en écriture."
  he: "לא ניתן היה לשנות את המשגר. בדקו שאפשר לכתוב לתיקיית האפליקציות."
  hi: "लॉन्चर नहीं बदला जा सका। जांचें कि आपके ऐप्लिकेशन फ़ोल्डर में लिखा जा सकता है।"
  id: "Tidak dapat mengubah peluncur. Pastikan folder aplikasi Anda dapat ditulisi."
  it: "Impossibile modificare l'icona di avvio. Verifica che la cartella delle applicazioni sia scrivibile."
  ja: "ランチャーを変更できませんでした。アプリケーションフォルダーに書き込めるか確認してください。"
  ko: "실행기를 변경할 수 없습니다. 애플리케이션 폴더에 쓸 수 있는지 확인하세요."
  nl: "Kan de starter niet wijzigen. Controleer of je toepassingenmap beschrijfbaar is."
  pl: "Nie udało się zmienić skrótu. Sprawdź, czy folder aplikacji jest zapisywalny."
  pt: "Não foi possível alterar o atalho. Verifique se a pasta de aplicativos pode ser gravada."
  pt-BR: "Não foi possível alterar o atalho. Verifique se a pasta de aplicativos pode ser gravada."
  pt-PT: "Não foi possível alterar o atalho. Verifique se é possível escrever na pasta de aplicações."
  ru: "Не удалось изменить ярлык. Проверьте, что в папку приложений можно записывать."
  sv: "Det gick inte att ändra startaren. Kontrollera att din programmapp är skrivbar."
  sw: "Imeshindwa kubadilisha kizindua. Hakikisha folda yako ya programu inaweza kuandikwa."
  th: "เปลี่ยนตัวเปิดไม่ได้ ตรวจสอบว่าโฟลเดอร์แอปพลิเคชันของคุณเขียนได้"
  uk: "Не вдалося змінити ярлик. Перевірте, чи можна записувати в теку застосунків."
  vi: "Không thể thay đổi trình khởi chạy. Hãy kiểm tra rằng thư mục ứng dụng của bạn có thể ghi được."
  zh: "无法更改启动器。请检查你的应用程序文件夹是否可写。"
  zh-HK: "無法更改啟動器。請檢查你的應用程式資料夾是否可寫入。"
