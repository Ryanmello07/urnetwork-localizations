description: "Linux Settings > General: the sentence under upd_check_stale_title (\"Couldn't check for updates since {date}\"). The app checks again every six hours while automatic checks are on; \"the button\" is the row's Check now button."
source: "A newer release may be out. The app keeps trying every six hours, and the button tries now."
platforms:
  - linux
localizations:
  ar: "قد يكون هناك إصدار أحدث. يواصل التطبيق المحاولة كل ست ساعات، والزر يحاول الآن."
  cs: "Možná vyšlo novější vydání. Aplikace to dál zkouší každých šest hodin a tlačítko to zkusí hned."
  de: "Möglicherweise ist eine neuere Version erschienen. Die App versucht es weiter alle sechs Stunden, die Schaltfläche sofort."
  el: "Μπορεί να έχει κυκλοφορήσει νεότερη έκδοση. Η εφαρμογή συνεχίζει να προσπαθεί κάθε έξι ώρες και το κουμπί δοκιμάζει τώρα."
  en: "A newer release may be out. The app keeps trying every six hours, and the button tries now."
  es: "Puede que haya una versión más reciente. La app lo sigue intentando cada seis horas, y el botón lo intenta ahora."
  es-419: "Puede que haya una versión más reciente. La app lo sigue intentando cada seis horas, y el botón lo intenta ahora."
  es-MX: "Puede que haya una versión más reciente. La app lo sigue intentando cada seis horas, y el botón lo intenta ahora."
  fr: "Une version plus récente est peut-être disponible. L’app réessaie toutes les six heures, et le bouton essaie maintenant."
  he: "ייתכן שיצאה גרסה חדשה יותר. האפליקציה ממשיכה לנסות כל שש שעות, והכפתור מנסה עכשיו."
  hi: "हो सकता है कोई नया रिलीज़ आ गया हो। ऐप हर छह घंटे में कोशिश करता रहता है, और बटन अभी कोशिश करता है।"
  id: "Mungkin sudah ada rilis yang lebih baru. Aplikasi terus mencoba setiap enam jam, dan tombol ini mencoba sekarang."
  it: "Potrebbe essere uscita una versione più recente. L’app continua a riprovare ogni sei ore, e il pulsante riprova subito."
  ja: "新しいリリースが出ている可能性があります。アプリは6時間ごとに試行を続け、ボタンを押すと今すぐ試行します。"
  ko: "새 릴리스가 나왔을 수 있습니다. 앱은 6시간마다 계속 시도하며, 버튼을 누르면 지금 시도합니다."
  nl: "Er is misschien een nieuwere release. De app blijft het elke zes uur proberen, en de knop probeert het nu."
  pl: "Mogło pojawić się nowsze wydanie. Aplikacja próbuje dalej co sześć godzin, a przycisk próbuje teraz."
  pt: "Pode haver uma versão mais recente. A app continua a tentar a cada seis horas, e o botão tenta agora."
  pt-BR: "Pode haver uma versão mais recente. O app continua tentando a cada seis horas, e o botão tenta agora."
  pt-PT: "Pode haver uma versão mais recente. A app continua a tentar a cada seis horas, e o botão tenta agora."
  ru: "Возможно, вышел более новый выпуск. Приложение продолжает пытаться каждые шесть часов, а кнопка пробует сейчас."
  sv: "En nyare version kan ha kommit ut. Appen fortsätter att försöka var sjätte timme, och knappen försöker nu."
  sw: "Huenda toleo jipya zaidi limetoka. Programu inaendelea kujaribu kila saa sita, na kitufe kinajaribu sasa."
  th: "อาจมีรุ่นใหม่กว่าออกมาแล้ว แอปจะพยายามต่อไปทุกหกชั่วโมง และปุ่มจะลองทันที"
  uk: "Можливо, вийшов новіший випуск. Застосунок і далі пробує кожні шість годин, а кнопка пробує зараз."
  vi: "Có thể đã có bản phát hành mới hơn. Ứng dụng tiếp tục thử mỗi sáu giờ, và nút này thử ngay."
  zh: "可能已有更新的版本。应用会每六小时继续尝试，按钮可立即尝试。"
  zh-HK: "可能已有更新的版本。應用程式會每六小時繼續嘗試，按鈕可立即嘗試。"
