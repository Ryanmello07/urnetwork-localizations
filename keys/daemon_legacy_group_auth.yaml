description: "Linux notice when an older system service refuses the app's user. 'urnetwork' is the literal Linux group name; keep it as is."
source: "The URnetwork system service on this device is an older version that still requires group membership. Update the service, or add your user to the 'urnetwork' group and sign out and back in."
platforms:
  - linux
localizations:
  ar: "خدمة نظام URnetwork على هذا الجهاز إصدار أقدم ما زال يتطلب العضوية في مجموعة. حدّث الخدمة، أو أضف مستخدمك إلى المجموعة 'urnetwork' ثم سجّل الخروج وسجّل الدخول مجددًا."
  cs: "Systémová služba URnetwork na tomto zařízení je starší verze, která stále vyžaduje členství ve skupině. Aktualizujte službu nebo přidejte svého uživatele do skupiny 'urnetwork' a odhlaste se a znovu přihlaste."
  de: "Der URnetwork-Systemdienst auf diesem Gerät ist eine ältere Version, die noch eine Gruppenmitgliedschaft verlangt. Aktualisiere den Dienst oder füge deinen Benutzer zur Gruppe 'urnetwork' hinzu und melde dich ab und wieder an."
  el: "Η υπηρεσία συστήματος URnetwork σε αυτήν τη συσκευή είναι παλαιότερη έκδοση που απαιτεί ακόμη συμμετοχή σε ομάδα. Ενημερώστε την υπηρεσία ή προσθέστε τον χρήστη σας στην ομάδα 'urnetwork' και αποσυνδεθείτε και συνδεθείτε ξανά."
  en: "The URnetwork system service on this device is an older version that still requires group membership. Update the service, or add your user to the 'urnetwork' group and sign out and back in."
  es: "El servicio del sistema URnetwork de este dispositivo es una versión anterior que todavía exige pertenecer a un grupo. Actualiza el servicio, o añade tu usuario al grupo 'urnetwork' y cierra la sesión y vuelve a iniciarla."
  es-419: "El servicio del sistema URnetwork de este dispositivo es una versión anterior que todavía exige pertenecer a un grupo. Actualiza el servicio, o agrega tu usuario al grupo 'urnetwork' y cierra la sesión y vuelve a iniciarla."
  es-MX: "El servicio del sistema URnetwork de este dispositivo es una versión anterior que todavía exige pertenecer a un grupo. Actualiza el servicio, o agrega tu usuario al grupo 'urnetwork' y cierra la sesión y vuelve a iniciarla."
  fr: "Le service système URnetwork de cet appareil est une ancienne version qui exige encore l’appartenance à un groupe. Mettez à jour le service, ou ajoutez votre utilisateur au groupe 'urnetwork', puis déconnectez-vous de votre session et reconnectez-vous."
  he: "שירות המערכת של URnetwork במכשיר הזה הוא גרסה ישנה שעדיין דורשת חברות בקבוצה. עדכנו את השירות, או הוסיפו את המשתמש שלכם לקבוצה 'urnetwork' והתנתקו והתחברו שוב."
  hi: "इस डिवाइस पर URnetwork सिस्टम सेवा एक पुराना संस्करण है जिसे अब भी समूह सदस्यता चाहिए। सेवा अपडेट करें, या अपने उपयोगकर्ता को 'urnetwork' समूह में जोड़ें और साइन आउट करके फिर से साइन इन करें।"
  id: "Layanan sistem URnetwork di perangkat ini adalah versi lama yang masih mewajibkan keanggotaan grup. Perbarui layanan, atau tambahkan pengguna Anda ke grup 'urnetwork' lalu keluar dan masuk lagi."
  it: "Il servizio di sistema URnetwork su questo dispositivo è una versione precedente che richiede ancora l’appartenenza a un gruppo. Aggiorna il servizio, oppure aggiungi il tuo utente al gruppo 'urnetwork' ed esci e rientra nella sessione."
  ja: "このデバイスの URnetwork システムサービスは、まだグループのメンバーシップを必要とする古いバージョンです。サービスを更新するか、ユーザーを 'urnetwork' グループに追加してから、サインアウトして再度サインインしてください。"
  ko: "이 기기의 URnetwork 시스템 서비스는 아직 그룹 멤버십이 필요한 이전 버전입니다. 서비스를 업데이트하거나, 사용자를 'urnetwork' 그룹에 추가한 뒤 로그아웃했다가 다시 로그인하세요."
  nl: "De URnetwork-systeemservice op dit apparaat is een oudere versie die nog groepslidmaatschap vereist. Werk de service bij, of voeg je gebruiker toe aan de groep 'urnetwork' en meld je af en weer aan."
  pl: "Usługa systemowa URnetwork na tym urządzeniu to starsza wersja, która nadal wymaga członkostwa w grupie. Zaktualizuj usługę albo dodaj swojego użytkownika do grupy 'urnetwork', a następnie wyloguj się i zaloguj ponownie."
  pt: "O serviço de sistema URnetwork deste dispositivo é uma versão antiga que ainda exige participação em um grupo. Atualize o serviço ou adicione seu usuário ao grupo 'urnetwork' e saia e entre de novo na sessão."
  pt-BR: "O serviço de sistema URnetwork deste dispositivo é uma versão antiga que ainda exige participação em um grupo. Atualize o serviço ou adicione seu usuário ao grupo 'urnetwork' e saia e entre de novo na sessão."
  pt-PT: "O serviço de sistema URnetwork deste dispositivo é uma versão antiga que ainda exige pertencer a um grupo. Atualize o serviço ou adicione o seu utilizador ao grupo 'urnetwork' e termine a sessão e volte a iniciá-la."
  ru: "Системная служба URnetwork на этом устройстве — старая версия, которой всё ещё нужно членство в группе. Обновите службу или добавьте своего пользователя в группу 'urnetwork', затем выйдите из системы и войдите снова."
  sv: "Systemtjänsten URnetwork på den här enheten är en äldre version som fortfarande kräver gruppmedlemskap. Uppdatera tjänsten, eller lägg till din användare i gruppen 'urnetwork' och logga ut och in igen."
  sw: "Huduma ya mfumo ya URnetwork kwenye kifaa hiki ni toleo la zamani ambalo bado linahitaji uanachama wa kikundi. Sasisha huduma, au ongeza mtumiaji wako kwenye kikundi 'urnetwork' kisha utoke na uingie tena."
  th: "บริการระบบ URnetwork ในอุปกรณ์นี้เป็นเวอร์ชันเก่าที่ยังต้องเป็นสมาชิกกลุ่ม อัปเดตบริการ หรือเพิ่มผู้ใช้ของคุณลงในกลุ่ม 'urnetwork' แล้วออกจากระบบและลงชื่อเข้าใช้ใหม่"
  uk: "Системна служба URnetwork на цьому пристрої — стара версія, якій досі потрібне членство в групі. Оновіть службу або додайте свого користувача до групи 'urnetwork', а потім вийдіть із системи й увійдіть знову."
  vi: "Dịch vụ hệ thống URnetwork trên thiết bị này là phiên bản cũ vẫn yêu cầu là thành viên nhóm. Hãy cập nhật dịch vụ, hoặc thêm người dùng của bạn vào nhóm 'urnetwork' rồi đăng xuất và đăng nhập lại."
  zh: "此设备上的 URnetwork 系统服务是旧版本，仍要求加入用户组。请更新该服务，或将你的用户加入 'urnetwork' 组，然后注销并重新登录。"
  zh-HK: "此裝置上的 URnetwork 系統服務是舊版本，仍然要求加入群組。請更新服務，或將你的用戶加入 'urnetwork' 群組，然後登出再重新登入。"
