description: "Redeem balance code: the request never got a server answer (network failure). Must NOT be worded as 'bad code' -- the redeem may have committed server-side, so tell the user to check their balance before retrying."
source: "We couldn't reach the server — check your connection. If you were charged, the code may already be applied; check your balance before trying again."
platforms:
  - android
  - linux
  - windows
localizations:
  ar: "تعذّر الوصول إلى الخادم — تحقق من اتصالك. إذا تم تحصيل رسوم منك، فربما تم تطبيق الرمز بالفعل؛ تحقق من رصيدك قبل المحاولة مرة أخرى."
  cs: "Nepodařilo se spojit se serverem — zkontrolujte připojení. Pokud vám byla stržena platba, kód už možná byl uplatněn; než to zkusíte znovu, zkontrolujte zůstatek."
  de: "Wir konnten den Server nicht erreichen — überprüfe deine Verbindung. Falls dir etwas berechnet wurde, ist der Code möglicherweise schon angewendet; prüfe dein Guthaben, bevor du es erneut versuchst."
  el: "Δεν μπορέσαμε να επικοινωνήσουμε με τον διακομιστή — ελέγξτε τη σύνδεσή σας. Αν χρεωθήκατε, ο κωδικός ίσως έχει ήδη εφαρμοστεί· ελέγξτε το υπόλοιπό σας πριν δοκιμάσετε ξανά."
  en: "We couldn't reach the server — check your connection. If you were charged, the code may already be applied; check your balance before trying again."
  es: "No pudimos conectar con el servidor — revisa tu conexión. Si se te cobró, puede que el código ya se haya aplicado; revisa tu saldo antes de volver a intentarlo."
  es-419: "No pudimos comunicarnos con el servidor — revisa tu conexión. Si se te hizo un cargo, es posible que el código ya se haya aplicado; revisa tu saldo antes de volver a intentarlo."
  es-MX: "No pudimos comunicarnos con el servidor — revisa tu conexión. Si se te hizo un cargo, es posible que el código ya se haya aplicado; revisa tu saldo antes de volver a intentarlo."
  fr: "Impossible de joindre le serveur — vérifiez votre connexion. Si vous avez été débité, le code est peut-être déjà appliqué ; vérifiez votre solde avant de réessayer."
  he: "לא הצלחנו להגיע לשרת — בדקו את החיבור. אם חויבתם, ייתכן שהקוד כבר הוחל; בדקו את היתרה לפני שתנסו שוב."
  hi: "हम सर्वर तक नहीं पहुँच सके — अपना कनेक्शन जाँचें। अगर आपसे शुल्क लिया गया है, तो हो सकता है कोड पहले ही लागू हो चुका हो; दोबारा कोशिश करने से पहले अपना बैलेंस जाँचें।"
  id: "Kami tidak dapat menjangkau server — periksa koneksi Anda. Jika Anda sudah ditagih, kodenya mungkin sudah diterapkan; periksa saldo Anda sebelum mencoba lagi."
  it: "Non siamo riusciti a raggiungere il server — controlla la connessione. Se ti è stato addebitato, il codice potrebbe essere già applicato; controlla il saldo prima di riprovare."
  ja: "サーバーに接続できませんでした。接続を確認してください。請求済みの場合、コードはすでに適用されている可能性があります。もう一度試す前に残高を確認してください。"
  ko: "서버에 연결할 수 없습니다. 연결을 확인하세요. 요금이 청구되었다면 코드가 이미 적용되었을 수 있으니 다시 시도하기 전에 잔액을 확인하세요."
  nl: "We konden de server niet bereiken — controleer je verbinding. Als er geld is afgeschreven, is de code misschien al toegepast; controleer je tegoed voordat je het opnieuw probeert."
  pl: "Nie udało się połączyć z serwerem — sprawdź połączenie. Jeśli pobrano opłatę, kod mógł już zostać zastosowany; sprawdź saldo, zanim spróbujesz ponownie."
  pt: "Não conseguimos contactar o servidor — verifique a sua ligação. Se lhe foi cobrado, o código pode já ter sido aplicado; verifique o seu saldo antes de tentar novamente."
  pt-BR: "Não conseguimos acessar o servidor — verifique sua conexão. Se você foi cobrado, o código pode já ter sido aplicado; confira seu saldo antes de tentar novamente."
  pt-PT: "Não conseguimos contactar o servidor — verifique a sua ligação. Se lhe foi cobrado, o código pode já ter sido aplicado; verifique o seu saldo antes de tentar novamente."
  ru: "Не удалось связаться с сервером — проверьте подключение. Если с вас списали оплату, код, возможно, уже применён; проверьте баланс, прежде чем повторять попытку."
  sv: "Vi kunde inte nå servern — kontrollera din anslutning. Om du har debiterats kan koden redan vara tillämpad; kontrollera ditt saldo innan du försöker igen."
  sw: "Hatukuweza kufikia seva — kagua muunganisho wako. Ikiwa umetozwa, huenda msimbo umeshatumika; kagua salio lako kabla ya kujaribu tena."
  th: "เราติดต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบการเชื่อมต่อของคุณ หากคุณถูกเรียกเก็บเงินแล้ว รหัสอาจถูกใช้ไปแล้ว โปรดตรวจสอบยอดคงเหลือก่อนลองอีกครั้ง"
  uk: "Не вдалося зв’язатися із сервером — перевірте з’єднання. Якщо з вас списали кошти, код, можливо, уже застосовано; перевірте баланс, перш ніж пробувати знову."
  vi: "Không thể kết nối tới máy chủ — hãy kiểm tra kết nối của bạn. Nếu bạn đã bị tính phí, mã có thể đã được áp dụng; hãy kiểm tra số dư trước khi thử lại."
  zh: "无法连接到服务器，请检查网络连接。如果您已被扣款，该余额码可能已生效；请先查看余额再重试。"
  zh-HK: "無法連接伺服器，請檢查網絡連線。如果你已被扣款，餘額碼可能已經生效；請先查看餘額再試。"
