description: "Explains the deliberate IPv6 and SMTP exceptions to the VPN kill switch and the encrypted SMTP behavior."
source: "While the VPN is connected, IPv6 is not routed through URnetwork and may use your local network, even when the kill switch is on. Outbound SMTP on TCP port 25 also bypasses the VPN. These exceptions may expose your local public IP to those destinations. SMTP on ports 465 and 587 stays in the VPN and must establish TLS."
