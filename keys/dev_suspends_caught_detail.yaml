description: "Developer page: the explanation under the 'Suspends caught' setting."
source: "Host suspends the detector caught, each one a batch of verdicts held instead of executed on a just-resumed machine"
platforms:
  - linux
localizations:
  ar: "حالات تعليق المضيف التي رصدها الكاشف، وكل منها دفعة من الأحكام عُلّقت بدلًا من تنفيذها على جهاز استُؤنف للتو"
  cs: "Uspání hostitele, která detektor zachytil; každé je dávka verdiktů zadržených místo provedení na právě probuzeném počítači"
  de: "Vom Detektor erkannte Ruhezustände des Hosts; jeder davon ist ein Stapel Urteile, der auf einem gerade aufgewachten Rechner zurückgehalten statt vollstreckt wurde"
  el: "Αναστολές του κεντρικού υπολογιστή που εντόπισε ο ανιχνευτής, καθεμία μια παρτίδα ετυμηγοριών που κρατήθηκαν αντί να εκτελεστούν σε έναν υπολογιστή που μόλις ξύπνησε"
  en: "Host suspends the detector caught, each one a batch of verdicts held instead of executed on a just-resumed machine"
  es: "Suspensiones del host que captó el detector; cada una es un lote de veredictos retenidos en lugar de ejecutados en un equipo recién reanudado"
  es-419: "Suspensiones del host que detectó el detector; cada una es un lote de veredictos retenidos en lugar de ejecutados en un equipo recién reanudado"
  es-MX: "Suspensiones del host que detectó el detector; cada una es un lote de veredictos retenidos en lugar de ejecutados en un equipo recién reanudado"
  fr: "Mises en veille de l’hôte repérées par le détecteur, chacune étant un lot de verdicts retenus au lieu d’être exécutés sur un ordinateur tout juste réveillé"
  he: "השהיות של המארח שהגלאי תפס, כל אחת מהן אצווה של הכרעות שעוכבו במקום להתבצע במחשב שזה עתה התעורר"
  hi: "होस्ट के सस्पेंड जिन्हें डिटेक्टर ने पकड़ा; हर एक फ़ैसलों का एक बैच है जिसे अभी-अभी चालू हुई मशीन पर लागू करने के बजाय रोका गया"
  id: "Penangguhan host yang ditangkap detektor, masing-masing satu kelompok vonis yang ditahan alih-alih dijalankan di komputer yang baru aktif kembali"
  it: "Sospensioni dell’host colte dal rilevatore, ognuna un gruppo di verdetti trattenuti invece che eseguiti su un computer appena ripreso"
  ja: "検出されたホストのスリープ。それぞれ、復帰直後のコンピューターで実行せず保留した判定のまとまりです"
  ko: "감지기가 잡아낸 호스트 절전으로, 각각은 막 깨어난 컴퓨터에서 실행하지 않고 보류한 판정 묶음입니다"
  nl: "Slaapstanden van de host die de detector opmerkte, elk een partij oordelen die werd vastgehouden in plaats van uitgevoerd op een net ontwaakte computer"
  pl: "Uśpienia hosta wychwycone przez detektor; każde to partia werdyktów wstrzymanych zamiast wykonanych na świeżo wybudzonym komputerze"
  pt: "Suspensões do anfitrião que o detetor apanhou, cada uma um lote de veredictos retidos em vez de executados num computador acabado de retomar"
  pt-BR: "Suspensões do host que o detector captou, cada uma um lote de vereditos retidos em vez de executados em um computador recém-retomado"
  pt-PT: "Suspensões do anfitrião que o detetor apanhou, cada uma um lote de veredictos retidos em vez de executados num computador acabado de retomar"
  ru: "Приостановки хоста, обнаруженные детектором; каждая — это пакет вердиктов, отложенных, а не исполненных на только что проснувшемся компьютере"
  sv: "Vilolägen på värden som detektorn fångade, vart och ett en omgång domar som hölls kvar i stället för att verkställas på en nyss väckt dator"
  sw: "Usingizi wa mwenyeji uliogunduliwa na kigunduzi, kila mmoja ukiwa kundi la hukumu zilizozuiliwa badala ya kutekelezwa kwenye kompyuta iliyoamka hivi punde"
  th: "การพักเครื่องของโฮสต์ที่ตัวตรวจจับจับได้ แต่ละครั้งคือชุดคำตัดสินที่ถูกระงับแทนที่จะดำเนินการบนคอมพิวเตอร์ที่เพิ่งกลับมาทำงาน"
  uk: "Засинання хоста, які виявив детектор; кожне — це пакет вердиктів, утриманих замість виконання на щойно пробудженому комп’ютері"
  vi: "Các lần máy chủ tạm ngưng mà bộ phát hiện bắt được, mỗi lần là một loạt phán quyết được giữ lại thay vì thực thi trên máy tính vừa hoạt động lại"
  zh: "检测器捕获的主机挂起次数，每次都意味着在刚恢复的计算机上暂缓而非执行一批判定"
  zh-HK: "偵測器捕獲的主機休眠次數，每次都代表在剛恢復的電腦上暫緩而非執行一批判定"
