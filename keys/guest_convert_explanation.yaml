description: "Desktop: the first step of \"Create an account\" on a legacy guest network. The user adds an email and a password to the network they are on now, so they can sign in to it again; its plan and balance stay with it (nothing moves to a new account)."
source: "Add an email and a password to sign in to this network. Its plan and balance stay with it."
platforms:
  - linux
  - windows
localizations:
  ar: "أضف بريدًا إلكترونيًا وكلمة مرور لتسجيل الدخول إلى هذه الشبكة. تبقى خطتها ورصيدها معها."
  cs: "Přidejte e-mail a heslo, abyste se mohli k této síti přihlásit. Její tarif a zůstatek zůstanou u ní."
  de: "Füge eine E-Mail-Adresse und ein Passwort hinzu, um dich bei diesem Netzwerk anzumelden. Sein Tarif und sein Guthaben bleiben erhalten."
  el: "Προσθέστε ένα email και έναν κωδικό πρόσβασης για να συνδέεστε σε αυτό το δίκτυο. Το πρόγραμμα και το υπόλοιπό του μένουν σε αυτό."
  en: "Add an email and a password to sign in to this network. Its plan and balance stay with it."
  es: "Añade un correo electrónico y una contraseña para iniciar sesión en esta red. Su plan y su saldo se quedan con ella."
  es-419: "Agrega un correo electrónico y una contraseña para iniciar sesión en esta red. Su plan y su saldo se quedan con ella."
  es-MX: "Agrega un correo electrónico y una contraseña para iniciar sesión en esta red. Su plan y su saldo se quedan con ella."
  fr: "Ajoutez une adresse e-mail et un mot de passe pour vous connecter à ce réseau. Son forfait et son solde restent avec lui."
  he: "הוסיפו אימייל וסיסמה כדי להתחבר לרשת הזו. התוכנית והיתרה שלה נשארות איתה."
  hi: "इस नेटवर्क में साइन इन करने के लिए ईमेल और पासवर्ड जोड़ें। इसका प्लान और बैलेंस इसी के साथ रहते हैं।"
  id: "Tambahkan email dan kata sandi untuk masuk ke jaringan ini. Paket dan saldonya tetap bersamanya."
  it: "Aggiungi un’email e una password per accedere a questa rete. Il suo piano e il suo saldo restano con lei."
  ja: "このネットワークにサインインするためのメールアドレスとパスワードを追加します。プランと残高はこのネットワークに引き継がれます。"
  ko: "이 네트워크에 로그인할 이메일과 비밀번호를 추가하세요. 요금제와 잔액은 이 네트워크에 그대로 남습니다."
  nl: "Voeg een e-mailadres en een wachtwoord toe om bij dit netwerk in te loggen. Het abonnement en het tegoed blijven bij dit netwerk."
  pl: "Dodaj e-mail i hasło, aby logować się do tej sieci. Jej plan i saldo zostają przy niej."
  pt: "Adicione um e-mail e uma palavra-passe para iniciar sessão nesta rede. O plano e o saldo dela ficam com ela."
  pt-BR: "Adicione um e-mail e uma senha para entrar nesta rede. O plano e o saldo dela continuam com ela."
  pt-PT: "Adicione um e-mail e uma palavra-passe para iniciar sessão nesta rede. O plano e o saldo dela ficam com ela."
  ru: "Добавьте адрес электронной почты и пароль, чтобы входить в эту сеть. Её тариф и баланс сохранятся."
  sv: "Lägg till en e-postadress och ett lösenord för att logga in på det här nätverket. Dess abonnemang och saldo följer med det."
  sw: "Ongeza barua pepe na nenosiri ili kuingia kwenye mtandao huu. Mpango na salio lake hubaki nao."
  th: "เพิ่มอีเมลและรหัสผ่านเพื่อลงชื่อเข้าใช้เครือข่ายนี้ แพ็กเกจและยอดคงเหลือจะยังอยู่กับเครือข่ายนี้"
  uk: "Додайте ел. пошту й пароль, щоб входити в цю мережу. Її план і баланс залишаються з нею."
  vi: "Thêm email và mật khẩu để đăng nhập vào mạng này. Gói và số dư của mạng vẫn được giữ nguyên."
  zh: "添加电子邮件和密码即可登录此网络。其套餐和余额都会保留。"
  zh-HK: "加入電郵地址和密碼即可登入此網絡。其計劃和餘額都會保留。"
