description: "Second paragraph of the Solana connect sheet/card, and the body line under a connected Solana wallet."
source: "USDC payouts continue to this wallet until the migration to Bittensor is complete."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "تستمر مدفوعات USDC إلى هذه المحفظة حتى اكتمال الانتقال إلى Bittensor."
  cs: "Výplaty v USDC budou chodit do této peněženky, dokud se nedokončí přechod na Bittensor."
  de: "USDC-Auszahlungen gehen weiterhin an diese Wallet, bis die Migration zu Bittensor abgeschlossen ist."
  el: "Οι πληρωμές σε USDC συνεχίζουν σε αυτό το πορτοφόλι μέχρι να ολοκληρωθεί η μετάβαση στο Bittensor."
  en: "USDC payouts continue to this wallet until the migration to Bittensor is complete."
  es: "Los pagos en USDC seguirán llegando a esta billetera hasta que se complete la migración a Bittensor."
  es-419: "Los pagos en USDC seguirán llegando a esta billetera hasta que se complete la migración a Bittensor."
  es-MX: "Los pagos en USDC seguirán llegando a esta cartera hasta que se complete la migración a Bittensor."
  fr: "Les paiements en USDC continuent d’arriver sur ce portefeuille jusqu’à la fin de la migration vers Bittensor."
  he: "התשלומים ב-USDC ממשיכים להגיע לארנק הזה עד שהמעבר ל-Bittensor יושלם."
  hi: "Bittensor पर माइग्रेशन पूरा होने तक USDC भुगतान इसी वॉलेट में आते रहेंगे।"
  id: "Pembayaran USDC tetap masuk ke dompet ini sampai migrasi ke Bittensor selesai."
  it: "I pagamenti in USDC continuano ad arrivare su questo portafoglio fino al completamento della migrazione a Bittensor."
  ja: "Bittensor への移行が完了するまで、USDC の支払いは引き続きこのウォレットに送られます。"
  ko: "Bittensor로의 이전이 완료될 때까지 USDC 지급은 계속 이 지갑으로 갑니다."
  nl: "USDC-uitbetalingen gaan naar deze wallet tot de migratie naar Bittensor is afgerond."
  pl: "Wypłaty w USDC trafiają na ten portfel do czasu zakończenia migracji do Bittensor."
  pt: "Os pagamentos em USDC continuam a ir para esta carteira até a migração para a Bittensor estar concluída."
  pt-BR: "Os pagamentos em USDC continuam indo para esta carteira até a migração para a Bittensor ser concluída."
  pt-PT: "Os pagamentos em USDC continuam a ir para esta carteira até a migração para a Bittensor estar concluída."
  ru: "Выплаты в USDC будут поступать на этот кошелек, пока не завершится переход на Bittensor."
  sv: "USDC-utbetalningar fortsätter till den här plånboken tills migreringen till Bittensor är klar."
  sw: "Malipo ya USDC yataendelea kuingia kwenye pochi hii hadi uhamiaji kwenda Bittensor ukamilike."
  th: "การจ่าย USDC จะยังเข้ากระเป๋าเงินนี้จนกว่าการย้ายไปยัง Bittensor จะเสร็จสมบูรณ์"
  uk: "Виплати в USDC надходитимуть на цей гаманець, доки не завершиться перехід на Bittensor."
  vi: "Các khoản thanh toán USDC vẫn tiếp tục về ví này cho đến khi hoàn tất việc chuyển sang Bittensor."
  zh: "在迁移到 Bittensor 完成之前，USDC 支付将继续发送到此钱包。"
  zh-HK: "在遷移到 Bittensor 完成之前，USDC 款項會繼續發送到此錢包。"
