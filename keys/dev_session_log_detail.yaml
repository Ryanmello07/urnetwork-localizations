description: "Developer page: explanation of the session log."
source: "What the daemon has written since it started. The reliability lines ([rel] event=...) are how a knob below proves it changed something."
platforms:
  - linux
localizations:
  ar: "ما كتبته الخدمة منذ بدء تشغيلها. أسطر الموثوقية ([rel] event=...) هي الدليل على أن أحد الإعدادات أدناه غيّر شيئًا."
  cs: "Co služba zapsala od svého spuštění. Řádky spolehlivosti ([rel] event=...) dokazují, že nastavení níže něco změnilo."
  de: "Was der Dienst seit seinem Start geschrieben hat. An den Zuverlässigkeitszeilen ([rel] event=...) zeigt sich, ob eine Einstellung unten etwas verändert hat."
  el: "Ό,τι έχει γράψει η υπηρεσία από την εκκίνησή της. Οι γραμμές αξιοπιστίας ([rel] event=...) δείχνουν ότι μια ρύθμιση παρακάτω άλλαξε πράγματι κάτι."
  en: "What the daemon has written since it started. The reliability lines ([rel] event=...) are how a knob below proves it changed something."
  es: "Lo que el servicio ha escrito desde que se inició. Las líneas de fiabilidad ([rel] event=...) son la prueba de que un ajuste de abajo cambió algo."
  es-419: "Lo que el servicio ha escrito desde que se inició. Las líneas de fiabilidad ([rel] event=...) son la prueba de que un ajuste de abajo cambió algo."
  es-MX: "Lo que el servicio ha escrito desde que se inició. Las líneas de fiabilidad ([rel] event=...) son la prueba de que un ajuste de abajo cambió algo."
  fr: "Ce que le service a écrit depuis son démarrage. Les lignes de fiabilité ([rel] event=...) montrent qu’un réglage ci-dessous a bien changé quelque chose."
  he: "מה שהשירות כתב מאז שהופעל. שורות האמינות ([rel] event=...) הן ההוכחה לכך שהגדרה למטה שינתה משהו."
  hi: "सेवा ने शुरू होने के बाद से जो लिखा है। विश्वसनीयता वाली पंक्तियाँ ([rel] event=...) बताती हैं कि नीचे की किसी सेटिंग ने सच में कुछ बदला।"
  id: "Apa yang ditulis layanan sejak dimulai. Baris keandalan ([rel] event=...) adalah bukti bahwa sebuah pengaturan di bawah benar-benar mengubah sesuatu."
  it: "Ciò che il servizio ha scritto dall’avvio. Le righe di affidabilità ([rel] event=...) sono la prova che un’impostazione qui sotto ha cambiato qualcosa."
  ja: "サービスが起動してから書き込んだ内容です。信頼性の行（[rel] event=...）が、下の設定で何かが変わったことの証拠になります。"
  ko: "서비스가 시작된 뒤 기록한 내용입니다. 신뢰도 줄([rel] event=...)은 아래 설정이 실제로 무언가를 바꿨다는 증거입니다."
  nl: "Wat de dienst sinds de start heeft geschreven. De betrouwbaarheidsregels ([rel] event=...) laten zien dat een instelling hieronder iets heeft veranderd."
  pl: "Co usługa zapisała od uruchomienia. Wiersze niezawodności ([rel] event=...) pokazują, że ustawienie poniżej rzeczywiście coś zmieniło."
  pt: "O que o serviço escreveu desde que arrancou. As linhas de fiabilidade ([rel] event=...) são a prova de que uma definição abaixo mudou alguma coisa."
  pt-BR: "O que o serviço escreveu desde que iniciou. As linhas de confiabilidade ([rel] event=...) são a prova de que um ajuste abaixo mudou alguma coisa."
  pt-PT: "O que o serviço escreveu desde que arrancou. As linhas de fiabilidade ([rel] event=...) são a prova de que uma definição abaixo mudou alguma coisa."
  ru: "Что служба записала с момента запуска. Строки надёжности ([rel] event=...) показывают, что настройка ниже действительно что-то изменила."
  sv: "Vad tjänsten har skrivit sedan den startade. Tillförlitlighetsraderna ([rel] event=...) visar att en inställning nedan faktiskt ändrade något."
  sw: "Kile ambacho huduma imeandika tangu ilipoanza. Mistari ya uaminifu ([rel] event=...) ndiyo inayothibitisha kwamba mpangilio ulio hapa chini umebadilisha kitu."
  th: "สิ่งที่บริการเขียนไว้ตั้งแต่เริ่มทำงาน บรรทัดความน่าเชื่อถือ ([rel] event=...) คือหลักฐานว่าการตั้งค่าด้านล่างเปลี่ยนแปลงบางอย่างจริง"
  uk: "Що служба записала від запуску. Рядки надійності ([rel] event=...) показують, що налаштування нижче справді щось змінило."
  vi: "Những gì dịch vụ đã ghi kể từ khi khởi động. Các dòng độ tin cậy ([rel] event=...) là bằng chứng một cài đặt bên dưới đã thay đổi điều gì đó."
  zh: "服务自启动以来写入的内容。可靠性行（[rel] event=...）可以证明下方的某项设置确实改变了什么。"
  zh-HK: "服務自啟動以來寫入的內容。可靠性行（[rel] event=...）可證明下方的某項設定確實改變了什麼。"
