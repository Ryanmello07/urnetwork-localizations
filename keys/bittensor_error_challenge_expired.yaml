description: "Error: the single-use wallet challenge expired (5 minutes) before it was signed."
source: "This request expired. Start again to get a new message to sign."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "انتهت صلاحية هذا الطلب. ابدأ من جديد للحصول على رسالة جديدة للتوقيع."
  cs: "Platnost tohoto požadavku vypršela. Začněte znovu a získejte novou zprávu k podpisu."
  de: "Diese Anfrage ist abgelaufen. Starte erneut, um eine neue Nachricht zum Signieren zu erhalten."
  el: "Αυτό το αίτημα έληξε. Ξεκινήστε ξανά για να λάβετε νέο μήνυμα προς υπογραφή."
  en: "This request expired. Start again to get a new message to sign."
  es: "Esta solicitud caducó. Empieza de nuevo para obtener un mensaje nuevo para firmar."
  es-419: "Esta solicitud venció. Empieza de nuevo para obtener un mensaje nuevo para firmar."
  es-MX: "Esta solicitud venció. Empieza de nuevo para obtener un mensaje nuevo para firmar."
  fr: "Cette demande a expiré. Recommencez pour obtenir un nouveau message à signer."
  he: "תוקף הבקשה הזו פג. התחילו מחדש כדי לקבל הודעה חדשה לחתימה."
  hi: "यह अनुरोध समाप्त हो गया है। साइन करने के लिए नया संदेश पाने हेतु फिर से शुरू करें।"
  id: "Permintaan ini sudah kedaluwarsa. Mulai lagi untuk mendapatkan pesan baru untuk ditandatangani."
  it: "Questa richiesta è scaduta. Ricomincia per ottenere un nuovo messaggio da firmare."
  ja: "このリクエストは期限切れです。最初からやり直して、署名する新しいメッセージを取得してください。"
  ko: "이 요청이 만료되었습니다. 처음부터 다시 시작해 서명할 새 메시지를 받으세요."
  nl: "Dit verzoek is verlopen. Begin opnieuw om een nieuw bericht te krijgen om te ondertekenen."
  pl: "To żądanie wygasło. Zacznij od nowa, aby otrzymać nową wiadomość do podpisania."
  pt: "Este pedido expirou. Comece de novo para obter uma nova mensagem para assinar."
  pt-BR: "Esta solicitação expirou. Comece de novo para receber uma nova mensagem para assinar."
  pt-PT: "Este pedido expirou. Comece de novo para obter uma nova mensagem para assinar."
  ru: "Срок действия запроса истек. Начните заново, чтобы получить новое сообщение для подписи."
  sv: "Den här begäran har gått ut. Börja om för att få ett nytt meddelande att signera."
  sw: "Ombi hili limeisha muda. Anza upya ili upate ujumbe mpya wa kutia sahihi."
  th: "คำขอนี้หมดอายุแล้ว เริ่มใหม่เพื่อรับข้อความใหม่สำหรับลงนาม"
  uk: "Термін дії цього запиту минув. Почніть знову, щоб отримати нове повідомлення для підпису."
  vi: "Yêu cầu này đã hết hạn. Hãy bắt đầu lại để nhận tin nhắn mới cần ký."
  zh: "此请求已过期。请重新开始以获取新的待签名消息。"
  zh-HK: "此請求已過期。請重新開始以取得新的待簽署訊息。"
