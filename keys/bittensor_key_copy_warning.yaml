description: "Key screen: the screen that shows the Bittensor recovery phrase, a 12 word secret for a key this app made on the device. Next to the Copy button."
source: "Other apps may be able to read the clipboard. It's cleared after 60 seconds."
platforms:
  - apple
localizations:
  ar: "قد تتمكن تطبيقات أخرى من قراءة الحافظة. تُمسح بعد 60 ثانية."
  cs: "Jiné aplikace možná dokážou schránku přečíst. Po 60 sekundách se vymaže."
  de: "Andere Apps können die Zwischenablage möglicherweise lesen. Sie wird nach 60 Sekunden geleert."
  el: "Άλλες εφαρμογές ίσως μπορούν να διαβάσουν το πρόχειρο. Εκκαθαρίζεται μετά από 60 δευτερόλεπτα."
  en: "Other apps may be able to read the clipboard. It's cleared after 60 seconds."
  es: "Es posible que otras aplicaciones puedan leer el portapapeles. Se borra después de 60 segundos."
  es-419: "Es posible que otras aplicaciones puedan leer el portapapeles. Se borra después de 60 segundos."
  es-MX: "Es posible que otras aplicaciones puedan leer el portapapeles. Se borra después de 60 segundos."
  fr: "D’autres applications pourraient lire le presse-papiers. Il est vidé après 60 secondes."
  he: "ייתכן שאפליקציות אחרות יוכלו לקרוא את הלוח. הוא מתרוקן אחרי 60 שניות."
  hi: "हो सकता है कि दूसरे ऐप क्लिपबोर्ड पढ़ सकें। इसे 60 सेकंड बाद साफ़ कर दिया जाता है।"
  id: "Aplikasi lain mungkin dapat membaca papan klip. Papan klip dikosongkan setelah 60 detik."
  it: "Altre app potrebbero leggere gli appunti. Vengono cancellati dopo 60 secondi."
