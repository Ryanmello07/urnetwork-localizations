  ko: "다른 앱이 클립보드를 읽을 수도 있습니다. 클립보드는 60초 후에 지워집니다."
  nl: "Andere apps kunnen het klembord mogelijk lezen. Het wordt na 60 seconden gewist."
  pl: "Inne aplikacje mogą odczytać schowek. Jest czyszczony po 60 sekundach."
  pt: "Outras apps podem conseguir ler a área de transferência. É limpa após 60 segundos."
  pt-BR: "Outros apps podem conseguir ler a área de transferência. Ela é limpa após 60 segundos."
  pt-PT: "Outras apps podem conseguir ler a área de transferência. É limpa após 60 segundos."
  ru: "Другие приложения могут прочитать буфер обмена. Он очищается через 60 секунд."
  sv: "Andra appar kan kanske läsa urklippet. Det rensas efter 60 sekunder."
  sw: "Programu nyingine zinaweza kusoma ubao wa kunakili. Unafutwa baada ya sekunde 60."
  th: "แอปอื่นอาจอ่านคลิปบอร์ดได้ คลิปบอร์ดจะถูกล้างหลังจาก 60 วินาที"
  uk: "Інші застосунки можуть прочитати буфер обміну. Він очищується через 60 секунд."
  vi: "Các ứng dụng khác có thể đọc được bảng nhớ tạm. Bảng nhớ tạm sẽ được xóa sau 60 giây."
