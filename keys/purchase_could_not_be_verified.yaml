description: "Error dialog body when the server's verify answer for a Play purchase is terminal `invalid` — the proof will never verify (unknown token, disallowed product, canceled before completing). The purchase is still acknowledged with Play so a real charge is not auto-refunded; this dialog is how the failure reaches the user instead of a silent nothing (android google/PlanViewModel.kt report path)."
source: "This purchase could not be verified with Google Play, so it can't be applied to your account. If you were charged and your plan doesn't update, please contact support."
platforms:
  - android
localizations:
  ar: "تعذّر التحقق من عملية الشراء هذه عبر Google Play، لذا لا يمكن تطبيقها على حسابك. إذا تم تحصيل رسوم منك ولم تُحدَّث خطتك، يرجى التواصل مع الدعم."
  cs: "Tento nákup se nepodařilo ověřit přes Google Play, takže ho nelze použít na váš účet. Pokud vám byla stržena platba a váš tarif se neaktualizuje, kontaktujte podporu."
  de: "Dieser Kauf konnte bei Google Play nicht verifiziert werden und kann deshalb nicht auf dein Konto angewendet werden. Falls dir etwas berechnet wurde und dein Plan nicht aktualisiert wird, wende dich bitte an den Support."
  el: "Δεν ήταν δυνατή η επαλήθευση αυτής της αγοράς με το Google Play, οπότε δεν μπορεί να εφαρμοστεί στον λογαριασμό σας. Αν χρεωθήκατε και το πρόγραμμά σας δεν ενημερωθεί, επικοινωνήστε με την υποστήριξη."
  en: "This purchase could not be verified with Google Play, so it can't be applied to your account. If you were charged and your plan doesn't update, please contact support."
  es: "No se pudo verificar esta compra con Google Play, así que no se puede aplicar a tu cuenta. Si se te cobró y tu plan no se actualiza, contacta con el soporte."
  es-419: "No se pudo verificar esta compra con Google Play, así que no se puede aplicar a tu cuenta. Si se te hizo un cargo y tu plan no se actualiza, comunícate con soporte."
  es-MX: "No se pudo verificar esta compra con Google Play, así que no se puede aplicar a tu cuenta. Si se te hizo un cargo y tu plan no se actualiza, comunícate con soporte."
  fr: "Cet achat n’a pas pu être vérifié auprès de Google Play, il ne peut donc pas être appliqué à votre compte. Si vous avez été débité et que votre forfait ne se met pas à jour, contactez l’assistance."
  he: "לא ניתן היה לאמת את הרכישה הזו מול Google Play, ולכן אי אפשר להחיל אותה על החשבון שלכם. אם חויבתם והתוכנית שלכם לא מתעדכנת, פנו לתמיכה."
  hi: "इस खरीदारी को Google Play से सत्यापित नहीं किया जा सका, इसलिए इसे आपके खाते पर लागू नहीं किया जा सकता। अगर आपसे शुल्क लिया गया है और आपका प्लान अपडेट नहीं होता, तो कृपया सपोर्ट से संपर्क करें।"
  id: "Pembelian ini tidak dapat diverifikasi dengan Google Play, jadi tidak dapat diterapkan ke akun Anda. Jika Anda sudah ditagih dan paket Anda tidak diperbarui, hubungi dukungan."
  it: "Non è stato possibile verificare questo acquisto con Google Play, quindi non può essere applicato al tuo account. Se ti è stato addebitato e il piano non si aggiorna, contatta l’assistenza."
  ja: "この購入を Google Play で確認できなかったため、アカウントに適用できません。請求されたのにプランが更新されない場合は、サポートにお問い合わせください。"
  ko: "Google Play에서 이 구매를 확인할 수 없어 계정에 적용할 수 없습니다. 요금이 청구되었는데 요금제가 업데이트되지 않으면 지원팀에 문의하세요."
  nl: "Deze aankoop kon niet worden geverifieerd bij Google Play, dus kan hij niet op je account worden toegepast. Als er geld is afgeschreven en je abonnement niet wordt bijgewerkt, neem dan contact op met support."
  pl: "Nie udało się zweryfikować tego zakupu w Google Play, więc nie można go zastosować do twojego konta. Jeśli pobrano opłatę, a twój plan się nie aktualizuje, skontaktuj się z pomocą techniczną."
  pt: "Não foi possível verificar esta compra com o Google Play, por isso não pode ser aplicada à sua conta. Se lhe foi cobrado e o seu plano não for atualizado, contacte o suporte."
  pt-BR: "Não foi possível verificar esta compra com o Google Play, então ela não pode ser aplicada à sua conta. Se você foi cobrado e seu plano não for atualizado, entre em contato com o suporte."
  pt-PT: "Não foi possível verificar esta compra com o Google Play, por isso não pode ser aplicada à sua conta. Se lhe foi cobrado e o seu plano não for atualizado, contacte o suporte."
  ru: "Эту покупку не удалось подтвердить в Google Play, поэтому её нельзя применить к вашему аккаунту. Если с вас списали оплату, а тариф не обновился, обратитесь в поддержку."
  sv: "Det här köpet kunde inte verifieras med Google Play, så det kan inte tillämpas på ditt konto. Om du har debiterats och ditt abonnemang inte uppdateras, kontakta supporten."
  sw: "Ununuzi huu haukuweza kuthibitishwa na Google Play, kwa hiyo hauwezi kutumika kwenye akaunti yako. Ikiwa umetozwa na mpango wako hausasishwi, tafadhali wasiliana na usaidizi."
  th: "ไม่สามารถยืนยันการซื้อนี้กับ Google Play ได้ จึงนำไปใช้กับบัญชีของคุณไม่ได้ หากคุณถูกเรียกเก็บเงินและแพ็กเกจไม่อัปเดต โปรดติดต่อฝ่ายสนับสนุน"
  uk: "Не вдалося перевірити цю покупку в Google Play, тож її не можна застосувати до вашого облікового запису. Якщо з вас списали кошти, а ваш план не оновлюється, зверніться до підтримки."
  vi: "Không thể xác minh giao dịch mua này với Google Play nên không thể áp dụng cho tài khoản của bạn. Nếu bạn đã bị tính phí và gói không cập nhật, vui lòng liên hệ hỗ trợ."
  zh: "无法通过 Google Play 验证此次购买，因此无法将其应用到您的账户。如果您已被扣款但方案未更新，请联系支持团队。"
  zh-HK: "無法透過 Google Play 驗證此次購買，因此無法套用到你的帳戶。如果你已被扣款但計劃沒有更新，請聯絡支援團隊。"
