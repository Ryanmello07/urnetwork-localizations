description: "The one local notification of an unsaved Bittensor key: the body. Tapping it opens the Key screen."
source: "Back up your Bittensor recovery phrase now. If you lose this device before saving it, your SN25α can't be reached."
platforms:
  - apple
  - android
  - windows
localizations:
  ar: "احفظ عبارة النسخ الاحتياطي الخاصة بك لـ Bittensor الآن. إذا فقدت هذا الجهاز قبل حفظها، فلن يمكن الوصول إلى SN25α الخاص بك."
  cs: "Zálohujte teď svou obnovovací frázi Bittensor. Pokud toto zařízení ztratíte dřív, než ji uložíte, k vašemu SN25α se nebude možné dostat."
  de: "Sichere jetzt deine Bittensor-Wiederherstellungsphrase. Wenn du dieses Gerät verlierst, bevor du sie gespeichert hast, ist dein SN25α nicht mehr erreichbar."
  el: "Δημιουργήστε τώρα αντίγραφο ασφαλείας της φράσης επαναφοράς Bittensor σας. Αν χάσετε αυτή τη συσκευή πριν αποθηκεύσετε τη φράση, δεν θα είναι δυνατή η πρόσβαση στα SN25α σας."
  en: "Back up your Bittensor recovery phrase now. If you lose this device before saving it, your SN25α can't be reached."
  es: "Haz ahora una copia de seguridad de tu frase de recuperación de Bittensor. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-419: "Haz ahora una copia de seguridad de tu frase de recuperación de Bittensor. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-MX: "Haz ahora una copia de seguridad de tu frase de recuperación de Bittensor. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  fr: "Enregistrez dès maintenant votre phrase de sauvegarde Bittensor. Si vous perdez cet appareil avant de l’avoir enregistrée, vos SN25α seront inaccessibles."
  he: "גבו עכשיו את ביטוי השחזור של Bittensor שלכם. אם תאבדו את המכשיר הזה לפני שתשמרו את הביטוי, לא תהיה גישה ל-SN25α שלכם."
  hi: "अपने Bittensor रिकवरी फ़्रेज़ का अभी बैकअप लें। अगर आप फ़्रेज़ सहेजने से पहले यह डिवाइस खो देते हैं, तो आपके SN25α तक पहुँचा नहीं जा सकेगा।"
  id: "Simpan frasa cadangan Bittensor Anda sekarang. Jika Anda kehilangan perangkat ini sebelum menyimpan frasa tersebut, SN25α Anda tidak dapat diakses."
  it: "Fai ora il backup della tua frase di recupero Bittensor. Se perdi questo dispositivo prima di averla salvata, i tuoi SN25α non saranno più accessibili."
  ja: "今すぐ Bittensor の復元フレーズをバックアップしてください。復元フレーズを保存する前にこのデバイスをなくすと、SN25α にアクセスできなくなります。"
  ko: "지금 Bittensor 복구 문구를 백업하세요. 복구 문구를 저장하기 전에 이 기기를 잃어버리면 SN25α에 접근할 수 없습니다."
  nl: "Maak nu een back-up van je Bittensor-herstelzin. Als je dit apparaat kwijtraakt voordat je de herstelzin hebt opgeslagen, is je SN25α niet meer bereikbaar."
  pl: "Utwórz teraz kopię zapasową frazy odzyskiwania Bittensor. Jeśli stracisz to urządzenie, zanim ją zapiszesz, do twoich SN25α nie będzie można się dostać."
  pt: "Faça agora uma cópia de segurança da sua frase de recuperação Bittensor. Se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  pt-BR: "Faça agora o backup da sua frase de recuperação Bittensor. Se você perder este dispositivo antes de salvá-la, não será possível acessar seu SN25α."
  pt-PT: "Faça agora uma cópia de segurança da sua frase de recuperação Bittensor. Se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  ru: "Создайте сейчас резервную копию фразы восстановления Bittensor. Если вы потеряете это устройство, не сохранив её, получить доступ к вашим SN25α будет невозможно."
  sv: "Säkerhetskopiera din Bittensor-återställningsfras nu. Om du förlorar den här enheten innan du har sparat frasen går det inte att komma åt dina SN25α."
  sw: "Hifadhi nakala ya kifungu chako cha urejeshaji cha Bittensor sasa. Ukipoteza kifaa hiki kabla ya kuhifadhi kifungu hicho, SN25α yako haitaweza kufikiwa."
  th: "บันทึกวลีสำรอง Bittensor ของคุณตอนนี้ หากคุณทำอุปกรณ์นี้หายก่อนบันทึกวลีนี้ จะไม่สามารถเข้าถึง SN25α ของคุณได้"
  uk: "Створіть зараз резервну копію фрази відновлення Bittensor. Якщо ви втратите цей пристрій, не зберігши її, отримати доступ до ваших SN25α буде неможливо."
  vi: "Hãy lưu cụm từ sao lưu Bittensor của bạn ngay bây giờ. Nếu bạn mất thiết bị này trước khi lưu cụm từ đó, sẽ không thể truy cập SN25α của bạn."
  zh: "请立即备份您的 Bittensor 恢复短语。如果您在保存恢复短语之前丢失这台设备，您的 SN25α 将无法访问。"
  zh-HK: "請立即備份你的 Bittensor 復原短語。如果你在儲存復原短語之前遺失這部裝置，你的 SN25α 將無法存取。"
