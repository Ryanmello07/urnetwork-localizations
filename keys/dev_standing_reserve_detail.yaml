description: "Developer tools screen: explanatory subtext under the 'standing reserve' control."
source: "Size each window one exit beyond its target so a replacement is already connected. Off waits until a loss to backfill"
platforms:
  - android
localizations:
  ar: "يجعل حجم كل نافذة أكبر من هدفها بمخرج واحد ليكون البديل متصلًا مسبقًا. عند الإيقاف، ينتظر حدوث فقدان قبل التعويض"
  cs: "Každé okno má o jeden výstup víc, než je cíl, takže náhrada je už připojená. Vypnuto čeká s doplněním na ztrátu"
  de: "Bemisst jedes Fenster einen Exit über seinem Ziel, damit bereits ein Ersatz verbunden ist. Aus: füllt erst nach einem Verlust nach"
  el: "Κάθε παράθυρο έχει μία έξοδο πάνω από τον στόχο, ώστε μια αντικατάσταση να είναι ήδη συνδεδεμένη. Η απενεργοποίηση περιμένει μια απώλεια για να συμπληρώσει"
  en: "Size each window one exit beyond its target so a replacement is already connected. Off waits until a loss to backfill"
  es: "Dimensiona cada ventana con una salida más que su objetivo para que ya haya un reemplazo conectado. Si está desactivado, espera a que haya una pérdida para reponer"
  es-419: "Dimensiona cada ventana con una salida más que su objetivo para que ya haya un reemplazo conectado. Si está desactivado, espera a que haya una pérdida para reponer"
  es-MX: "Dimensiona cada ventana con una salida más que su objetivo para que ya haya un reemplazo conectado. Si está desactivado, espera a que haya una pérdida para reponer"
  fr: "Dimensionne chaque fenêtre avec une sortie de plus que sa cible pour qu’un remplaçant soit déjà connecté. Désactivé attend une perte pour compléter"
  he: "כל חלון מקבל יציאה אחת מעבר ליעד שלו, כך שמחליפה כבר מחוברת. כיבוי ממתין לאובדן כדי להשלים"
  hi: "हर विंडो को उसके लक्ष्य से एक एग्ज़िट बड़ा रखें, ताकि बदलने वाला पहले से कनेक्ट रहे। बंद करने पर कमी भरने के लिए नुकसान का इंतज़ार होता है"
  id: "Atur setiap jendela satu exit di atas targetnya agar pengganti sudah terhubung. Nonaktif menunggu ada yang hilang untuk mengisi kembali"
  it: "Dimensiona ogni finestra con un’uscita in più rispetto all’obiettivo, così un sostituto è già connesso. Disattivato attende una perdita per rimpiazzarla"
  ja: "各ウィンドウを目標より 1 つ多い出口で構成し、代わりの出口を接続済みにしておきます。オフにすると、失われてから補充します"
  ko: "각 창을 목표보다 출구 하나만큼 크게 잡아 대체 출구가 이미 연결되어 있게 합니다. 끄면 손실이 생긴 뒤에 보충합니다"
  nl: "Maak elk venster één exit groter dan het doel, zodat er al een vervanger verbonden is. Uit wacht tot er een wegvalt om aan te vullen"
  pl: "Każde okno ma o jedno wyjście więcej niż cel, więc zastępca jest już połączony. Wyłączenie czeka z uzupełnieniem na utratę"
  pt: "Dimensiona cada janela com uma saída a mais do que o objetivo para que um substituto já esteja ligado. Desativado espera por uma perda para repor"
  pt-BR: "Dimensiona cada janela com uma saída a mais que a meta para que um substituto já esteja conectado. Desativado espera uma perda para repor"
  pt-PT: "Dimensiona cada janela com uma saída a mais do que o objetivo para que um substituto já esteja ligado. Desativado espera por uma perda para repor"
  ru: "Делает каждое окно на один выход больше целевого размера, чтобы замена уже была подключена. Если выключено, пополнение происходит только после потери"
  sv: "Dimensionera varje fönster en utgång över målet så att en ersättare redan är ansluten. Av väntar på en förlust innan det fylls på"
  sw: "Panga kila dirisha liwe na njia moja ya kutoka zaidi ya lengo lake ili mbadala uwe tayari umeunganishwa. Kuzima kunasubiri hasara kabla ya kujaza"
  th: "กำหนดแต่ละหน้าต่างให้มีทางออกมากกว่าเป้าหมายหนึ่งแห่ง เพื่อให้มีตัวแทนเชื่อมต่อไว้แล้ว ปิดเพื่อรอให้เสียก่อนแล้วจึงเติม"
  uk: "Кожне вікно має на один вихід більше за ціль, тож заміна вже підключена. Вимкнення чекає втрати, щоб поповнити"
  vi: "Mỗi cửa sổ có thêm một điểm thoát so với mục tiêu để luôn có sẵn một điểm thay thế đã kết nối. Tắt sẽ chờ tới khi mất mới bổ sung"
  zh: "让每个窗口比目标多一个出口，以便替补已提前连接。关闭时等到出现损失后再补充"
  zh-HK: "讓每個視窗比目標多一個出口，以便替補已預先連接。關閉時等到出現損失後才補充"
