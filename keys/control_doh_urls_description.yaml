description: "Extender settings: explains the bootstrap DNS-over-HTTPS server list. It must say that URnetwork looks up its own server names through the added servers first, and that those servers can see these lookups."
source: "URnetwork looks up the names of its own servers over DNS-over-HTTPS. If the built-in servers are blocked on your network, add servers that work there. URnetwork tries them first, and they can see these lookups."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "يبحث URnetwork عن أسماء خوادمه عبر DNS-over-HTTPS. إذا كانت الخوادم المضمّنة محظورة على شبكتك، فأضف خوادم تعمل عليها. يجرّبها URnetwork أولًا، ويمكنها رؤية عمليات البحث هذه."
  cs: "URnetwork vyhledává názvy svých serverů přes DNS-over-HTTPS. Pokud jsou vestavěné servery ve vaší síti blokované, přidejte servery, které v ní fungují. URnetwork je použije jako první a tyto servery uvidí tato vyhledávání."
  de: "URnetwork löst die Namen seiner eigenen Server über DNS-over-HTTPS auf. Wenn die integrierten Server in deinem Netzwerk blockiert sind, füge Server hinzu, die dort funktionieren. URnetwork fragt sie zuerst, und sie können diese Anfragen sehen."
  el: "Το URnetwork αναζητά τα ονόματα των δικών του διακομιστών μέσω DNS-over-HTTPS. Αν οι ενσωματωμένοι διακομιστές είναι αποκλεισμένοι στο δίκτυό σας, προσθέστε διακομιστές που λειτουργούν εκεί. Το URnetwork τους δοκιμάζει πρώτους και αυτοί μπορούν να βλέπουν αυτές τις αναζητήσεις."
  en: "URnetwork looks up the names of its own servers over DNS-over-HTTPS. If the built-in servers are blocked on your network, add servers that work there. URnetwork tries them first, and they can see these lookups."
  es: "URnetwork busca los nombres de sus propios servidores mediante DNS-over-HTTPS. Si los servidores integrados están bloqueados en tu red, añade servidores que funcionen en ella. URnetwork los prueba primero, y estos pueden ver esas búsquedas."
  es-419: "URnetwork busca los nombres de sus propios servidores mediante DNS-over-HTTPS. Si los servidores integrados están bloqueados en tu red, agrega servidores que funcionen en ella. URnetwork los prueba primero, y estos pueden ver esas búsquedas."
  es-MX: "URnetwork busca los nombres de sus propios servidores mediante DNS-over-HTTPS. Si los servidores integrados están bloqueados en tu red, agrega servidores que funcionen en ella. URnetwork los prueba primero, y estos pueden ver esas búsquedas."
  fr: "URnetwork recherche les noms de ses propres serveurs via DNS-over-HTTPS. Si les serveurs intégrés sont bloqués sur votre réseau, ajoutez des serveurs qui y fonctionnent. URnetwork les essaie en premier, et ils peuvent voir ces recherches."
  he: "URnetwork מחפש את שמות השרתים שלו דרך DNS-over-HTTPS. אם השרתים המובנים חסומים ברשת שלכם, הוסיפו שרתים שעובדים בה. URnetwork מנסה אותם קודם, והם יכולים לראות את החיפושים האלה."
  hi: "URnetwork अपने सर्वरों के नाम DNS-over-HTTPS के ज़रिए खोजता है। अगर आपके नेटवर्क पर बिल्ट-इन सर्वर ब्लॉक हैं, तो ऐसे सर्वर जोड़ें जो वहाँ काम करते हों। URnetwork पहले उन्हें आज़माता है, और वे इन खोजों को देख सकते हैं।"
  id: "URnetwork mencari nama servernya sendiri melalui DNS-over-HTTPS. Jika server bawaan diblokir di jaringan Anda, tambahkan server yang berfungsi di sana. URnetwork mencobanya terlebih dahulu, dan server tersebut dapat melihat pencarian ini."
  it: "URnetwork cerca i nomi dei propri server tramite DNS-over-HTTPS. Se i server integrati sono bloccati sulla tua rete, aggiungi server che vi funzionano. URnetwork li prova per primi, e questi possono vedere queste ricerche."
  ja: "URnetwork は自身のサーバー名を DNS-over-HTTPS で検索します。お使いのネットワークで内蔵サーバーがブロックされている場合は、そのネットワークで使えるサーバーを追加してください。URnetwork はそれらを最初に試し、追加したサーバーはこれらの検索を見ることができます。"
  ko: "URnetwork는 자체 서버 이름을 DNS-over-HTTPS로 조회합니다. 네트워크에서 기본 서버가 차단된 경우 그 네트워크에서 작동하는 서버를 추가하세요. URnetwork는 추가한 서버를 먼저 사용하며, 해당 서버는 이 조회 내용을 볼 수 있습니다."
  nl: "URnetwork zoekt de namen van zijn eigen servers op via DNS-over-HTTPS. Als de ingebouwde servers op je netwerk worden geblokkeerd, voeg dan servers toe die daar werken. URnetwork probeert ze eerst, en zij kunnen deze opzoekingen zien."
  pl: "URnetwork wyszukuje nazwy własnych serwerów przez DNS-over-HTTPS. Jeśli wbudowane serwery są zablokowane w Twojej sieci, dodaj serwery, które w niej działają. URnetwork używa ich w pierwszej kolejności, a one widzą te zapytania."
  pt: "O URnetwork procura os nomes dos seus próprios servidores através de DNS-over-HTTPS. Se os servidores integrados estiverem bloqueados na sua rede, adicione servidores que funcionem nela. O URnetwork experimenta-os primeiro, e estes podem ver essas pesquisas."
  pt-BR: "O URnetwork procura os nomes dos próprios servidores via DNS-over-HTTPS. Se os servidores integrados estiverem bloqueados na sua rede, adicione servidores que funcionem nela. O URnetwork tenta usá-los primeiro, e eles podem ver essas consultas."
  pt-PT: "O URnetwork procura os nomes dos seus próprios servidores através de DNS-over-HTTPS. Se os servidores integrados estiverem bloqueados na sua rede, adicione servidores que funcionem nela. O URnetwork experimenta-os primeiro, e estes podem ver essas pesquisas."
  ru: "URnetwork ищет имена своих серверов через DNS-over-HTTPS. Если встроенные серверы заблокированы в вашей сети, добавьте серверы, которые в ней работают. URnetwork обращается к ним в первую очередь, и они видят эти запросы."
  sv: "URnetwork slår upp namnen på sina egna servrar via DNS-over-HTTPS. Om de inbyggda servrarna är blockerade i ditt nätverk kan du lägga till servrar som fungerar där. URnetwork provar dem först, och de kan se de här uppslagningarna."
  sw: "URnetwork hutafuta majina ya seva zake kupitia DNS-over-HTTPS. Ikiwa seva zilizojengewa ndani zimezuiwa kwenye mtandao wako, ongeza seva zinazofanya kazi huko. URnetwork huzijaribu kwanza, na seva hizo zinaweza kuona utafutaji huu."
  th: "URnetwork ค้นหาชื่อเซิร์ฟเวอร์ของตัวเองผ่าน DNS-over-HTTPS หากเซิร์ฟเวอร์ในตัวถูกบล็อกในเครือข่ายของคุณ ให้เพิ่มเซิร์ฟเวอร์ที่ใช้งานได้ในเครือข่ายนั้น URnetwork จะลองใช้เซิร์ฟเวอร์เหล่านี้ก่อน และเซิร์ฟเวอร์เหล่านี้จะเห็นการค้นหาดังกล่าว"
  uk: "URnetwork шукає імена власних серверів через DNS-over-HTTPS. Якщо вбудовані сервери заблоковано у вашій мережі, додайте сервери, які в ній працюють. URnetwork звертається до них першими, і вони бачать ці запити."
  vi: "URnetwork tra cứu tên các máy chủ của chính mình qua DNS-over-HTTPS. Nếu các máy chủ tích hợp bị chặn trên mạng của bạn, hãy thêm các máy chủ hoạt động được trên mạng đó. URnetwork thử chúng trước và chúng có thể thấy các lượt tra cứu này."
  zh: "URnetwork 通过 DNS-over-HTTPS 查找自身服务器的名称。如果内置服务器在您的网络上被封锁，请添加在该网络上可用的服务器。URnetwork 会优先使用它们，而这些服务器能够看到这些查询。"
  zh-HK: "URnetwork 會透過 DNS-over-HTTPS 查找其伺服器的名稱。如果內建伺服器在你的網絡上被封鎖，請加入在該網絡上可用的伺服器。URnetwork 會優先使用它們，而這些伺服器能夠看到這些查詢。"
