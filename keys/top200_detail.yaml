description: "Detail of the Top 200 tile when eligible."
source: "Your network's routable IP breadth ranks about #%lld of %lld head spots. Head miners earn SN25α natively, every tempo."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: rank
    type: int
  - name: cutoff
    type: int
localizations:
  ar: "يحتل تنوّع عناوين IP القابلة للتوجيه في شبكتك المرتبة #{rank} تقريبًا من بين {cutoff} من المقاعد الرئيسية. يكسب كبار المعدِّنين SN25α بشكل أصلي في كل tempo."
  cs: "Rozsah směrovatelných IP adres vaší sítě je zhruba na #{rank}. místě z {cutoff} předních míst. Přední těžaři získávají SN25α nativně, v každém tempu."
  de: "Die Vielfalt routbarer IPs deines Netzwerks liegt etwa auf Platz #{rank} von {cutoff} Head-Plätzen. Head-Miner verdienen SN25α nativ, in jedem Tempo."
  el: "Το εύρος δρομολογήσιμων IP του δικτύου σας κατατάσσεται περίπου στη θέση #{rank} από {cutoff} κορυφαίες θέσεις. Οι κορυφαίοι εξορύκτες κερδίζουν SN25α εγγενώς, σε κάθε tempo."
  en: "Your network's routable IP breadth ranks about #{rank} of {cutoff} head spots. Head miners earn SN25α natively, every tempo."
  es: "La variedad de IP enrutables de tu red ocupa aproximadamente el puesto #{rank} de {cutoff} puestos principales. Los mineros principales ganan SN25α de forma nativa en cada tempo."
  es-419: "La variedad de IP enrutables de tu red ocupa aproximadamente el puesto #{rank} de {cutoff} lugares principales. Los mineros principales ganan SN25α de forma nativa en cada tempo."
  es-MX: "La variedad de IP enrutables de tu red ocupa aproximadamente el puesto #{rank} de {cutoff} lugares principales. Los mineros principales ganan SN25α de forma nativa en cada tempo."
  fr: "La diversité d’IP routables de votre réseau se classe environ #{rank} sur {cutoff} places de tête. Les mineurs de tête gagnent des SN25α nativement, à chaque tempo."
  he: "מגוון כתובות ה-IP הניתנות לניתוב של הרשת שלכם מדורג בערך במקום #{rank} מתוך {cutoff} המקומות המובילים. הכורים המובילים מרוויחים SN25α באופן ישיר, בכל tempo."
  hi: "आपके नेटवर्क के रूट करने योग्य IP का दायरा {cutoff} शीर्ष स्थानों में लगभग #{rank} पर है। शीर्ष माइनर हर tempo में सीधे SN25α कमाते हैं।"
  id: "Keragaman IP yang dapat dirutekan di jaringan Anda berada di sekitar peringkat #{rank} dari {cutoff} tempat teratas. Penambang teratas mendapatkan SN25α secara langsung, setiap tempo."
  it: "La varietà di IP instradabili della tua rete si colloca circa al #{rank} su {cutoff} posti di testa. I miner di testa guadagnano SN25α in modo nativo, a ogni tempo."
  ja: "あなたのネットワークのルーティング可能な IP の幅は、上位 {cutoff} 枠のうち約 #{rank} 位です。上位のマイナーは tempo ごとに SN25α を直接獲得します。"
  ko: "내 네트워크의 라우팅 가능한 IP 범위는 상위 {cutoff}자리 중 약 #{rank}위입니다. 상위 채굴자는 tempo마다 SN25α를 직접 받습니다."
  nl: "De breedte aan routeerbare IP's van je netwerk staat ongeveer op plaats #{rank} van {cutoff} topplekken. Topminers verdienen SN25α rechtstreeks, elke tempo."
  pl: "Zasięg routowalnych adresów IP twojej sieci plasuje się mniej więcej na miejscu #{rank} z {cutoff} czołowych miejsc. Czołowi górnicy zarabiają SN25α natywnie, w każdym tempie."
  pt: "A variedade de IPs encaminháveis da sua rede está por volta da posição #{rank} de {cutoff} lugares principais. Os mineradores principais ganham SN25α nativamente, em cada tempo."
  pt-BR: "A variedade de IPs roteáveis da sua rede está em torno da posição #{rank} de {cutoff} vagas principais. Os mineradores principais ganham SN25α nativamente, a cada tempo."
  pt-PT: "A variedade de IPs encaminháveis da sua rede está por volta da posição #{rank} de {cutoff} lugares principais. Os mineradores principais ganham SN25α nativamente, em cada tempo."
  ru: "По разнообразию маршрутизируемых IP ваша сеть занимает примерно #{rank} место из {cutoff} ведущих мест. Ведущие майнеры нативно получают SN25α в каждом tempo."
  sv: "Ditt nätverks bredd av routbara IP-adresser placerar sig runt #{rank} av {cutoff} toppplatser. Toppminers tjänar SN25α direkt, varje tempo."
  sw: "Upana wa IP zinazoweza kupitishwa za mtandao wako uko karibu na nafasi #{rank} kati ya nafasi {cutoff} za juu. Wachimbaji wa juu hupata SN25α moja kwa moja, kila tempo."
  th: "ความหลากหลายของ IP ที่กำหนดเส้นทางได้ของเครือข่ายคุณอยู่ราวอันดับ #{rank} จาก {cutoff} ที่นั่งชั้นนำ นักขุดชั้นนำได้รับ SN25α โดยตรงทุก tempo"
  uk: "Широта маршрутизованих IP вашої мережі приблизно на місці #{rank} з {cutoff} провідних місць. Провідні майнери заробляють SN25α напряму, кожне темпо."
  vi: "Độ đa dạng IP có thể định tuyến của mạng bạn xếp khoảng hạng #{rank} trong {cutoff} vị trí dẫn đầu. Các thợ đào dẫn đầu kiếm SN25α trực tiếp, mỗi tempo."
  zh: "按可路由 IP 广度计算，您的网络在 {cutoff} 个头部席位中约排第 {rank} 名。头部矿工在每个 tempo 原生赚取 SN25α。"
  zh-HK: "按可路由 IP 廣度計算，你的網絡在 {cutoff} 個頭部席位中約排第 {rank} 名。頭部礦工在每個 tempo 原生賺取 SN25α。"
