description: "Title of the Android VPN notification while the VPN is connected. Samsung's Flip cover screen, the lock screen and other small screens show it in a narrow row and cut off what does not fit, so keep it short and keep the status first: a narrow screen then loses the end of the place, never the status. \"Protected\" means this device's internet traffic goes through URnetwork, the same word as the \"Protected\" row of the desktop apps' connection inspector. {location} is where the connection goes: a country, region or city name (for example Germany), or \"Best available provider\"."
source: "Protected · {location}"
