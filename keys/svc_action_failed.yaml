description: "Windows banner text when installing, starting or updating the VPN service failed."
source: "That didn't finish — the service is unchanged. Details are in the app log."
platforms:
  - windows
localizations:
  ar: "لم تكتمل العملية — لم تتغير الخدمة. التفاصيل في سجلات التطبيق."
  cs: "Akce se nedokončila – služba se nezměnila. Podrobnosti najdete v protokolu aplikace."
  de: "Das wurde nicht abgeschlossen – der Dienst ist unverändert. Details stehen im App-Protokoll."
  el: "Η ενέργεια δεν ολοκληρώθηκε — η υπηρεσία δεν άλλαξε. Λεπτομέρειες υπάρχουν στο αρχείο καταγραφής της εφαρμογής."
  en: "That didn't finish — the service is unchanged. Details are in the app log."
  es: "No se completó: el servicio no ha cambiado. Los detalles están en el registro de la app."
  es-419: "No se completó: el servicio no ha cambiado. Los detalles están en el registro de la app."
  es-MX: "No se completó: el servicio no ha cambiado. Los detalles están en el registro de la app."
  fr: "L’opération n’a pas abouti — le service est inchangé. Les détails se trouvent dans le journal de l’application."
  he: "הפעולה לא הושלמה — השירות לא השתנה. הפרטים נמצאים בלוג של האפליקציה."
  hi: "यह पूरा नहीं हुआ — सेवा में कोई बदलाव नहीं हुआ। विवरण ऐप लॉग में है।"
  id: "Itu tidak selesai — layanan tidak berubah. Detailnya ada di log aplikasi."
  it: "L’operazione non è stata completata — il servizio non è cambiato. I dettagli sono nel log dell’app."
  ja: "完了しませんでした — サービスは変更されていません。詳細はアプリのログにあります。"
  ko: "완료되지 않았습니다 — 서비스는 변경되지 않았습니다. 자세한 내용은 앱 로그에 있습니다."
  nl: "Dat is niet gelukt – de service is ongewijzigd. Details staan in het app-log."
  pl: "To się nie powiodło — usługa pozostała bez zmian. Szczegóły są w logach aplikacji."
  pt: "Isso não foi concluído — o serviço não mudou. Os detalhes estão no log do app."
  pt-BR: "Isso não foi concluído — o serviço não mudou. Os detalhes estão no log do app."
  pt-PT: "Não foi concluído — o serviço não foi alterado. Os detalhes estão nos logs da app."
  ru: "Действие не завершилось — служба не изменилась. Подробности — в логах приложения."
  sv: "Det slutfördes inte – tjänsten är oförändrad. Detaljer finns i appens logg."
  sw: "Hilo halikukamilika — huduma haijabadilika. Maelezo yako kwenye logi za programu."
  th: "การดำเนินการไม่เสร็จสิ้น — บริการไม่มีการเปลี่ยนแปลง ดูรายละเอียดได้ในบันทึกของแอป"
  uk: "Дію не завершено — службу не змінено. Подробиці — в логах застосунку."
  vi: "Thao tác chưa hoàn tất — dịch vụ không thay đổi. Chi tiết có trong nhật ký ứng dụng."
  zh: "操作未完成 — 服务未发生变化。详细信息见应用日志。"
  zh-HK: "操作未完成 — 服務沒有變更。詳細資料見應用程式記錄。"
