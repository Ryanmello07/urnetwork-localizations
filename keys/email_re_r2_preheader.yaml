description: "Re-engagement email R2 preheader."
source: "One tap. Your answer decides what I send next."
platforms:
  - email
localizations:
  en: "One tap. Your answer decides what I send next."
  ar: "ضغطة واحدة. إجابتك تحدد ما أرسله لاحقاً."
  cs: "Jedno klepnutí. Vaše odpověď rozhodne, co pošlu dál."
  de: "Einmal tippen. Deine Antwort entscheidet, was ich als Nächstes schicke."
  el: "Ένα πάτημα. Η απάντησή σου αποφασίζει τι θα στείλω μετά."
  es: "Un toque. Tu respuesta decide qué te envío después."
  es-419: "Un toque. Tu respuesta decide qué te envío después."
  es-MX: "Un toque. Tu respuesta decide qué te envío después."
  fr: "Un geste. Ta réponse décide de ce que je t'envoie ensuite."
  he: "הקשה אחת. התשובה שלכם תקבע מה אשלח בהמשך."
  hi: "एक टैप। आपका जवाब तय करेगा कि मैं आगे क्या भेजूँ।"
  id: "Satu ketukan. Jawabanmu menentukan apa yang saya kirim berikutnya."
  it: "Un tocco. La tua risposta decide cosa ti mando dopo."
  ja: "ワンタップで。お答えによって、次に送るものが決まります。"
  ko: "한 번만 누르세요. 답변에 따라 다음에 보낼 내용이 정해집니다."
  nl: "Eén tik. Jouw antwoord bepaalt wat ik hierna stuur."
  pl: "Jedno dotknięcie. Twoja odpowiedź zdecyduje, co wyślę dalej."
  pt: "Um toque. Sua resposta decide o que eu envio depois."
  pt-BR: "Um toque. Sua resposta decide o que eu envio depois."
  pt-PT: "Um toque. A sua resposta decide o que lhe envio a seguir."
  ru: "Одно касание. От вашего ответа зависит, что я пришлю дальше."
  sv: "Ett tryck. Ditt svar avgör vad jag skickar härnäst."
  sw: "Mguso mmoja. Jibu lako huamua nitakachotuma baadaye."
  th: "แตะครั้งเดียว คำตอบของคุณจะกำหนดว่าผมจะส่งอะไรต่อไป"
  uk: "Один дотик. Від вашої відповіді залежить, що я надішлю далі."
  vi: "Một chạm. Câu trả lời của bạn quyết định tôi sẽ gửi gì tiếp theo."
  zh: "点一下就行。你的回答决定我接下来发什么。"
  zh-HK: "點一下就行。你的回答決定我接下來發什麼。"
