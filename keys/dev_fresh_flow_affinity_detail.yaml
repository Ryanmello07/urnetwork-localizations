description: "Developer tools screen: explanatory subtext under the hard fresh-flow affinity control."
source: "Assign each new connection to the exit its IP or domain already uses. Off is the default: every ordinary fresh connection reaches the provider race. Existing connections and explicit pins always stay fixed"
platforms:
  - android
localizations:
  ar: "يُسند كل اتصال جديد إلى المخرج الذي يستخدمه عنوان IP أو النطاق الخاص به بالفعل. الإيقاف هو الإعداد الافتراضي: كل اتصال جديد عادي يدخل سباق المزودين. تبقى الاتصالات الحالية والتثبيتات الصريحة دون تغيير دائمًا"
  cs: "Přiřadí každé nové připojení výstupu, který už používá jeho IP nebo doména. Výchozí je vypnuto: každé běžné nové připojení se dostane do závodu poskytovatelů. Stávající připojení a explicitní připnutí zůstávají vždy beze změny"
  de: "Weist jede neue Verbindung dem Exit zu, den ihre IP oder Domain bereits nutzt. Aus ist die Voreinstellung: Jede gewöhnliche neue Verbindung geht in das Anbieter-Race. Bestehende Verbindungen und explizite Pins bleiben immer unverändert"
  el: "Αναθέτει κάθε νέα σύνδεση στην έξοδο που ήδη χρησιμοποιεί η IP ή ο τομέας της. Απενεργοποιημένο είναι το προεπιλεγμένο: κάθε συνηθισμένη νέα σύνδεση φτάνει στον αγώνα παρόχων. Οι υπάρχουσες συνδέσεις και οι ρητές καρφιτσώσεις μένουν πάντα σταθερές"
  en: "Assign each new connection to the exit its IP or domain already uses. Off is the default: every ordinary fresh connection reaches the provider race. Existing connections and explicit pins always stay fixed"
  es: "Asigna cada conexión nueva a la salida que ya usa su IP o dominio. Desactivado es el valor predeterminado: cada conexión nueva normal llega a la carrera de proveedores. Las conexiones existentes y las fijaciones explícitas nunca cambian"
  es-419: "Asigna cada conexión nueva a la salida que ya usa su IP o dominio. Desactivado es el valor predeterminado: cada conexión nueva normal llega a la carrera de proveedores. Las conexiones existentes y las fijaciones explícitas nunca cambian"
  es-MX: "Asigna cada conexión nueva a la salida que ya usa su IP o dominio. Desactivado es el valor predeterminado: cada conexión nueva normal llega a la carrera de proveedores. Las conexiones existentes y las fijaciones explícitas nunca cambian"
  fr: "Attribue chaque nouvelle connexion à la sortie que son IP ou son domaine utilise déjà. Désactivé par défaut : chaque nouvelle connexion ordinaire passe par la course des fournisseurs. Les connexions existantes et les épinglages explicites restent toujours fixes"
  he: "הקצאת כל חיבור חדש ליציאה שכבר משמשת את כתובת ה-IP או את הדומיין שלו. כבוי כברירת מחדל: כל חיבור חדש רגיל מגיע למרוץ הספקים. חיבורים קיימים והצמדות מפורשות נשארים תמיד קבועים"
  hi: "हर नए कनेक्शन को उसी एग्ज़िट पर लगाएँ जिसे उसका IP या डोमेन पहले से इस्तेमाल कर रहा है। डिफ़ॉल्ट रूप से बंद: हर सामान्य नया कनेक्शन प्रदाता रेस तक पहुँचता है। मौजूदा कनेक्शन और स्पष्ट पिन हमेशा वैसे ही रहते हैं"
  id: "Tetapkan setiap koneksi baru ke exit yang sudah dipakai IP atau domainnya. Nonaktif adalah default: setiap koneksi baru biasa masuk ke balapan penyedia. Koneksi yang ada dan pin eksplisit selalu tetap"
  it: "Assegna ogni nuova connessione all’uscita che il suo IP o dominio usa già. Disattivato è il valore predefinito: ogni nuova connessione normale arriva alla gara dei provider. Le connessioni esistenti e i blocchi espliciti restano sempre fissi"
  ja: "新しい接続を、その IP またはドメインがすでに使っている出口に割り当てます。デフォルトはオフで、通常の新しい接続はすべてプロバイダーのレースに参加します。既存の接続と明示的な固定は常にそのままです"
  ko: "각 새 연결을 그 IP나 도메인이 이미 쓰는 출구에 배정합니다. 기본값은 끔이며, 일반적인 새 연결은 모두 제공자 경쟁으로 갑니다. 기존 연결과 명시적 고정은 항상 그대로 유지됩니다"
  nl: "Wijs elke nieuwe verbinding toe aan de exit die het IP-adres of domein al gebruikt. Uit is de standaard: elke gewone nieuwe verbinding komt in de providerrace. Bestaande verbindingen en expliciete pins blijven altijd vast"
  pl: "Przypisuje każde nowe połączenie do wyjścia, którego już używa jego adres IP lub domena. Domyślnie wyłączone: każde zwykłe nowe połączenie trafia do wyścigu dostawców. Istniejące połączenia i jawne przypięcia zawsze pozostają bez zmian"
  pt: "Atribui cada nova ligação à saída que o seu IP ou domínio já usa. Desativado é a predefinição: todas as novas ligações comuns chegam à corrida de fornecedores. As ligações existentes e as fixações explícitas nunca mudam"
  pt-BR: "Atribui cada nova conexão à saída que seu IP ou domínio já usa. Desativado é o padrão: toda nova conexão comum chega à corrida de provedores. Conexões existentes e fixações explícitas nunca mudam"
  pt-PT: "Atribui cada nova ligação à saída que o seu IP ou domínio já usa. Desativado é a predefinição: todas as novas ligações comuns chegam à corrida de fornecedores. As ligações existentes e as fixações explícitas nunca mudam"
  ru: "Назначает каждое новое соединение на выход, который уже использует его IP или домен. По умолчанию выключено: каждое обычное новое соединение попадает в гонку провайдеров. Существующие соединения и явные закрепления всегда остаются без изменений"
  sv: "Tilldela varje ny anslutning den utgång som dess IP eller domän redan använder. Av är standard: varje vanlig ny anslutning går till leverantörsloppet. Befintliga anslutningar och uttryckliga fästningar ligger alltid fast"
  sw: "Panga kila muunganisho mpya kwenye njia ya kutoka ambayo IP au kikoa chake tayari kinatumia. Chaguomsingi ni kuzimwa: kila muunganisho mpya wa kawaida hufika kwenye mashindano ya watoa huduma. Miunganisho iliyopo na ubanaji uliowekwa wazi hubaki vilevile kila wakati"
  th: "กำหนดการเชื่อมต่อใหม่แต่ละรายการให้ทางออกที่ IP หรือโดเมนของมันใช้อยู่แล้ว ค่าเริ่มต้นคือปิด: การเชื่อมต่อใหม่ทั่วไปทุกรายการจะเข้าสู่การแข่งของผู้ให้บริการ การเชื่อมต่อที่มีอยู่และการปักหมุดที่ระบุไว้จะคงเดิมเสมอ"
  uk: "Призначає кожне нове з’єднання виходу, який уже використовують його IP або домен. За замовчуванням вимкнено: кожне звичайне нове з’єднання потрапляє в перегони провайдерів. Наявні з’єднання та явні закріплення завжди залишаються незмінними"
  vi: "Gán mỗi kết nối mới vào điểm thoát mà IP hoặc tên miền của nó đang dùng. Mặc định là tắt: mỗi kết nối mới thông thường đều vào cuộc đua nhà cung cấp. Các kết nối hiện có và các ghim rõ ràng luôn giữ nguyên"
  zh: "将每个新连接分配给其 IP 或域名已在使用的出口。默认关闭：每个普通的新连接都会进入提供商竞速。现有连接和显式固定始终保持不变"
  zh-HK: "將每個新連線分配給其 IP 或網域已在使用的出口。預設關閉：每個一般的新連線都會進入供應商競速。現有連線和明確固定一律保持不變"
