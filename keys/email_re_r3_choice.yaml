description: "Re-engagement email R3: the choice. Account and security emails are not affected, which is why it says 'these emails'."
source: "If you'd like a short note when something important changes, like a new version or a fix you asked for, tap the button. If not, there's nothing to do: this is the last of these emails."
platforms:
  - email
localizations:
  en: "If you'd like a short note when something important changes, like a new version or a fix you asked for, tap the button. If not, there's nothing to do: this is the last of these emails."
  ar: "إذا أردت رسالة قصيرة عندما يتغيّر شيء مهم، مثل إصدار جديد أو إصلاح طلبته، فاضغط على الزر. وإن لم ترغب في ذلك، فلا شيء عليك فعله: هذه آخر هذه الرسائل."
  cs: "Pokud chcete krátkou zprávu, když se změní něco důležitého, třeba vyjde nová verze nebo oprava, o kterou jste žádali, klepněte na tlačítko. Pokud ne, nemusíte nic dělat: tohle je poslední z těchto e-mailů."
  de: "Wenn du eine kurze Nachricht möchtest, sobald sich etwas Wichtiges ändert, etwa eine neue Version oder eine Korrektur, um die du gebeten hast, tippe auf den Button. Wenn nicht, musst du nichts tun: Das ist die letzte dieser E-Mails."
  el: "Αν θέλεις ένα σύντομο μήνυμα όταν αλλάζει κάτι σημαντικό, όπως μια νέα έκδοση ή μια διόρθωση που ζήτησες, πάτησε το κουμπί. Αν όχι, δεν χρειάζεται να κάνεις τίποτα: αυτό είναι το τελευταίο από αυτά τα email."
  es: "Si quieres recibir una nota breve cuando cambie algo importante, como una nueva versión o una corrección que pediste, toca el botón. Si no, no tienes que hacer nada: este es el último de estos correos."
  es-419: "Si quieres recibir una nota breve cuando cambie algo importante, como una nueva versión o una corrección que pediste, toca el botón. Si no, no tienes que hacer nada: este es el último de estos correos."
  es-MX: "Si quieres recibir una nota breve cuando cambie algo importante, como una nueva versión o una corrección que pediste, toca el botón. Si no, no tienes que hacer nada: este es el último de estos correos."
  fr: "Si tu veux recevoir un petit mot quand quelque chose d'important change, comme une nouvelle version ou un correctif que tu as demandé, appuie sur le bouton. Sinon, tu n'as rien à faire : c'est le dernier de ces e-mails."
  he: "אם תרצו הודעה קצרה כשמשהו חשוב משתנה, כמו גרסה חדשה או תיקון שביקשתם, הקישו על הכפתור. אם לא, אין צורך לעשות כלום: זה האחרון מבין המיילים האלה."
  hi: "अगर आप चाहते हैं कि कुछ अहम बदलने पर, जैसे नया संस्करण या आपका माँगा हुआ कोई सुधार, आपको एक छोटा-सा नोट मिले, तो बटन पर टैप करें। अगर नहीं, तो कुछ करने की ज़रूरत नहीं: यह इन ईमेल में से आख़िरी है।"
  id: "Kalau kamu ingin catatan singkat saat ada perubahan penting, seperti versi baru atau perbaikan yang kamu minta, ketuk tombolnya. Kalau tidak, kamu tidak perlu melakukan apa-apa: ini email terakhir dari rangkaian ini."
  it: "Se vuoi ricevere due righe quando cambia qualcosa di importante, come una nuova versione o una correzione che hai chiesto, tocca il pulsante. Altrimenti non devi fare nulla: questa è l'ultima di queste email."
  ja: "新しいバージョンや、ご要望いただいた修正など、大事な変更があったときに短いお知らせを受け取りたい場合は、ボタンをタップしてください。そうでなければ、何もする必要はありません。この種のメールはこれが最後です。"
  ko: "새 버전이나 요청하신 수정처럼 중요한 변화가 있을 때 짧은 소식을 받고 싶으시면 버튼을 눌러 주세요. 아니라면 아무것도 하지 않으셔도 됩니다. 이런 메일은 이번이 마지막입니다."
  nl: "Wil je een kort bericht als er iets belangrijks verandert, zoals een nieuwe versie of een oplossing waar je om hebt gevraagd, tik dan op de knop. Zo niet, dan hoef je niets te doen: dit is de laatste van deze e-mails."
  pl: "Jeśli chcesz dostać krótką wiadomość, gdy zmieni się coś ważnego, na przykład pojawi się nowa wersja albo poprawka, o którą prosiłeś, dotknij przycisku. Jeśli nie, nic nie musisz robić: to ostatni z tych e-maili."
  pt: "Se quiser receber um recado curto quando algo importante mudar, como uma nova versão ou uma correção que você pediu, toque no botão. Se não, não precisa fazer nada: este é o último desses e-mails."
  pt-BR: "Se quiser receber um recado curto quando algo importante mudar, como uma nova versão ou uma correção que você pediu, toque no botão. Se não, não precisa fazer nada: este é o último desses e-mails."
  pt-PT: "Se quiser receber uma nota curta quando algo importante mudar, como uma nova versão ou uma correção que pediu, toque no botão. Caso contrário, não precisa de fazer nada: este é o último destes e-mails."
  ru: "Если хотите получать короткое письмо, когда меняется что-то важное, например выходит новая версия или исправление, о котором вы просили, нажмите кнопку. Если нет, ничего делать не нужно: это последнее из этих писем."
  sv: "Om du vill ha ett kort meddelande när något viktigt ändras, som en ny version eller en rättning du har bett om, tryck på knappen. Om inte behöver du inte göra något: det här är det sista av de här mejlen."
  sw: "Ikiwa ungependa ujumbe mfupi kitu muhimu kinapobadilika, kama toleo jipya au marekebisho uliyoomba, gusa kitufe. Usipotaka, hakuna cha kufanya: hii ndiyo ya mwisho kati ya barua pepe hizi."
  th: "ถ้าคุณอยากได้ข้อความสั้นๆ เมื่อมีการเปลี่ยนแปลงสำคัญ เช่น เวอร์ชันใหม่หรือการแก้ไขที่คุณขอไว้ ให้แตะปุ่ม ถ้าไม่ ก็ไม่ต้องทำอะไร: นี่คืออีเมลฉบับสุดท้ายในชุดนี้"
  uk: "Якщо хочете отримувати короткий лист, коли змінюється щось важливе, як-от нова версія чи виправлення, про яке ви просили, натисніть кнопку. Якщо ні, нічого робити не треба: це останній із цих листів."
  vi: "Nếu bạn muốn nhận một lời nhắn ngắn khi có thay đổi quan trọng, như phiên bản mới hay bản sửa lỗi bạn đã yêu cầu, hãy chạm vào nút. Nếu không, bạn không cần làm gì cả: đây là email cuối cùng trong loạt email này."
  zh: "如果你希望在有重要变化时收到一封简短的邮件，比如新版本或你要求过的修复，请点按这个按钮。如果不需要，什么都不用做：这是这类邮件的最后一封。"
  zh-HK: "如果你希望在有重要變化時收到一封簡短的郵件，例如新版本或你要求過的修復，請點按這個按鈕。如果不需要，就什麼都不用做：這是這類郵件的最後一封。"
