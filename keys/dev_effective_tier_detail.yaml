description: "Developer tools screen: explanatory subtext under the 'effective tier' control."
source: "Failing dials and survived verdicts push a provider down the ranking within a second; promotion back needs clean minutes and a proven connect"
platforms:
  - android
  - linux
  - apple
localizations:
  ar: "تؤدي محاولات الاتصال الفاشلة والأحكام التي نجا منها المزود إلى خفض ترتيبه خلال ثانية؛ ويتطلب رفعه مجددًا دقائق خالية من الأخطاء واتصالًا مُثبتًا"
  cs: "Neúspěšná připojení a přežité verdikty posunou poskytovatele v pořadí dolů během sekundy; návrat vyžaduje minuty bez chyb a prokázané připojení"
  de: "Fehlgeschlagene Verbindungsversuche und überstandene Urteile stufen einen Anbieter innerhalb einer Sekunde im Ranking herab; die Rückkehr nach oben braucht fehlerfreie Minuten und einen nachweislich erfolgreichen Verbindungsaufbau"
  el: "Οι αποτυχημένες συνδέσεις και οι ετυμηγορίες που επιβιώθηκαν ρίχνουν έναν πάροχο στην κατάταξη μέσα σε ένα δευτερόλεπτο· η επάνοδος απαιτεί λεπτά χωρίς σφάλματα και μια αποδεδειγμένη σύνδεση"
  en: "Failing dials and survived verdicts push a provider down the ranking within a second; promotion back needs clean minutes and a proven connect"
  es: "Los intentos de conexión fallidos y los veredictos superados bajan a un proveedor en la clasificación en menos de un segundo; volver a subir requiere minutos sin fallos y una conexión comprobada"
  es-419: "Los intentos de conexión fallidos y los veredictos superados bajan a un proveedor en la clasificación en menos de un segundo; volver a subir requiere minutos sin fallas y una conexión comprobada"
  es-MX: "Los intentos de conexión fallidos y los veredictos superados bajan a un proveedor en la clasificación en menos de un segundo; volver a subir requiere minutos sin fallas y una conexión comprobada"
  fr: "Les échecs de connexion et les verdicts survécus font descendre un fournisseur dans le classement en moins d’une seconde ; remonter exige des minutes sans erreur et une connexion prouvée"
  he: "חיבורים שנכשלו והכרעות ששרדו מורידים ספק בדירוג בתוך שנייה; כדי לעלות בחזרה נדרשות דקות ללא תקלות וחיבור מוכח"
  hi: "विफल डायल और बच निकले फ़ैसले एक सेकंड के भीतर प्रदाता को रैंकिंग में नीचे कर देते हैं; वापस ऊपर आने के लिए बिना त्रुटि के कुछ मिनट और एक सिद्ध कनेक्शन चाहिए"
  id: "Dial yang gagal dan vonis yang lolos menurunkan peringkat penyedia dalam satu detik; naik kembali butuh beberapa menit tanpa masalah dan koneksi yang terbukti"
  it: "Connessioni non riuscite e verdetti superati fanno scendere un provider in classifica entro un secondo; per risalire servono minuti senza errori e una connessione comprovata"
  ja: "接続失敗や乗り越えた判定によって、プロバイダーは 1 秒以内にランキングを下げられます。元に戻るには、問題のない数分間と実証済みの接続が必要です"
  ko: "연결 실패와 버텨 낸 판정은 1초 안에 제공자의 순위를 낮춥니다. 다시 올라가려면 문제없는 몇 분과 검증된 연결이 필요합니다"
  nl: "Mislukte verbindingen en overleefde oordelen duwen een provider binnen een seconde omlaag in de rangschikking; weer stijgen vraagt minuten zonder fouten en een bewezen verbinding"
  pl: "Nieudane połączenia i przetrwane werdykty w ciągu sekundy spychają dostawcę w rankingu w dół; powrót wymaga minut bez błędów i potwierdzonego połączenia"
  pt: "Tentativas de ligação falhadas e veredictos sobrevividos baixam um fornecedor na classificação em menos de um segundo; voltar a subir exige minutos sem falhas e uma ligação comprovada"
  pt-BR: "Tentativas de conexão com falha e vereditos sobrevividos rebaixam um provedor no ranking em menos de um segundo; voltar a subir exige minutos sem falhas e uma conexão comprovada"
  pt-PT: "Tentativas de ligação falhadas e veredictos sobrevividos baixam um fornecedor na classificação em menos de um segundo; voltar a subir exige minutos sem falhas e uma ligação comprovada"
  ru: "Неудачные попытки соединения и пережитые вердикты опускают провайдера в рейтинге в течение секунды; для обратного повышения нужны минуты без сбоев и подтверждённое подключение"
  sv: "Misslyckade anslutningar och överlevda domar trycker ner en leverantör i rankningen inom en sekund; för att klättra tillbaka krävs felfria minuter och en bevisad anslutning"
  sw: "Miunganisho iliyoshindwa na hukumu zilizonusurika humshusha mtoa huduma kwenye orodha ndani ya sekunde moja; kupanda tena kunahitaji dakika kadhaa bila hitilafu na muunganisho uliothibitishwa"
  th: "การเชื่อมต่อที่ล้มเหลวและคำตัดสินที่รอดมาได้จะดันผู้ให้บริการลงในอันดับภายในหนึ่งวินาที การขึ้นกลับต้องใช้เวลาหลายนาทีที่ไม่มีปัญหาและการเชื่อมต่อที่พิสูจน์แล้ว"
  uk: "Невдалі з’єднання та пережиті вердикти опускають провайдера в рейтингу за секунду; щоб піднятися назад, потрібні хвилини без помилок і підтверджене з’єднання"
  vi: "Các lần kết nối thất bại và các phán quyết vượt qua được sẽ đẩy nhà cung cấp xuống bảng xếp hạng trong vòng một giây; để lên lại cần vài phút không lỗi và một kết nối đã được chứng minh"
  zh: "拨号失败和经受住的判定会在一秒内降低提供商的排名；恢复排名需要若干分钟无故障运行以及一次经验证的连接"
  zh-HK: "撥號失敗和經得起的判定會在一秒內降低供應商的排名；要回升需要數分鐘無故障運作以及一次經驗證的連線"
