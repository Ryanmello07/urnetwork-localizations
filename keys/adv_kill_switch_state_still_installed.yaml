description: "Kill switch status: the switch is off but the service still has a block installed, so traffic is blocked."
source: "The kill switch is off, but the URnetwork system service still has a block installed, so this device's traffic is being blocked."
platforms:
  - linux
localizations:
  ar: "مفتاح القتل متوقف، لكن خدمة نظام URnetwork لا يزال لديها حجب مثبّت، لذا تُحجب حركة هذا الجهاز."
  cs: "Kill switch je vypnutý, ale systémová služba URnetwork má stále nainstalované blokování, takže se provoz tohoto zařízení blokuje."
  de: "Der Kill switch ist aus, aber der URnetwork-Systemdienst hat noch eine Sperre installiert, sodass der Datenverkehr dieses Geräts blockiert wird."
  el: "Το Kill switch είναι απενεργοποιημένο, αλλά η υπηρεσία συστήματος URnetwork έχει ακόμη έναν εγκατεστημένο αποκλεισμό, οπότε η κίνηση αυτής της συσκευής αποκλείεται."
  en: "The kill switch is off, but the URnetwork system service still has a block installed, so this device's traffic is being blocked."
  es: "El Kill switch está desactivado, pero el servicio del sistema de URnetwork aún tiene un bloqueo instalado, así que el tráfico de este dispositivo se está bloqueando."
  es-419: "El Kill switch está desactivado, pero el servicio del sistema de URnetwork todavía tiene un bloqueo instalado, así que el tráfico de este dispositivo se está bloqueando."
  es-MX: "El Kill switch está desactivado, pero el servicio del sistema de URnetwork aún tiene un bloqueo instalado, así que el tráfico de este dispositivo se está bloqueando."
  fr: "Le Kill switch est désactivé, mais le service système URnetwork a encore un blocage installé, le trafic de cet appareil est donc bloqué."
  he: "הקיל סוויץ' כבוי, אבל לשירות המערכת של URnetwork עדיין מותקנת חסימה, ולכן התעבורה של המכשיר הזה נחסמת."
  hi: "किल स्विच बंद है, लेकिन URnetwork सिस्टम सेवा में अभी भी एक ब्लॉक इंस्टॉल है, इसलिए इस डिवाइस का ट्रैफ़िक रोका जा रहा है।"
  id: "Kill switch mati, tetapi layanan sistem URnetwork masih memiliki pemblokiran terpasang, jadi lalu lintas perangkat ini diblokir."
  it: "Il Kill switch è disattivato, ma il servizio di sistema URnetwork ha ancora un blocco installato, quindi il traffico di questo dispositivo viene bloccato."
  ja: "キルスイッチはオフですが、URnetwork のシステムサービスにはまだ遮断が残っているため、このデバイスの通信は遮断されています。"
  ko: "킬 스위치는 꺼져 있지만 URnetwork 시스템 서비스에 아직 차단이 설치되어 있어 이 기기의 트래픽이 차단되고 있습니다."
  nl: "De Kill switch staat uit, maar de URnetwork-systeemdienst heeft nog een blokkade ingesteld, dus het verkeer van dit apparaat wordt geblokkeerd."
  pl: "Kill switch jest wyłączony, ale usługa systemowa URnetwork nadal ma zainstalowaną blokadę, więc ruch tego urządzenia jest blokowany."
  pt: "O Kill switch está desligado, mas o serviço do sistema URnetwork ainda tem um bloqueio instalado, então o tráfego deste dispositivo está sendo bloqueado."
  pt-BR: "O Kill switch está desligado, mas o serviço do sistema URnetwork ainda tem um bloqueio instalado, então o tráfego deste dispositivo está sendo bloqueado."
  pt-PT: "O Kill switch está desligado, mas o serviço de sistema URnetwork ainda tem um bloqueio instalado, pelo que o tráfego deste dispositivo está a ser bloqueado."
  ru: "Kill switch выключен, но у системной службы URnetwork всё ещё установлена блокировка, поэтому трафик этого устройства блокируется."
  sv: "Kill switch är av, men URnetworks systemtjänst har fortfarande en spärr installerad, så den här enhetens trafik blockeras."
  sw: "Kill switch imezimwa, lakini huduma ya mfumo ya URnetwork bado ina kizuizi kilichosakinishwa, kwa hivyo trafiki ya kifaa hiki inazuiwa."
  th: "สวิตช์หยุดการเชื่อมต่อปิดอยู่ แต่บริการระบบของ URnetwork ยังคงมีการบล็อกติดตั้งอยู่ ทราฟฟิกของอุปกรณ์นี้จึงถูกบล็อก"
  uk: "Kill switch вимкнено, але системна служба URnetwork досі має встановлене блокування, тому трафік цього пристрою блокується."
  vi: "Kill switch đã tắt, nhưng dịch vụ hệ thống URnetwork vẫn còn một chặn được cài đặt, nên lưu lượng của thiết bị này đang bị chặn."
  zh: "断网保护已关闭，但 URnetwork 系统服务仍安装着一个阻断，因此此设备的流量正被阻断。"
  zh-HK: "斷線開關 (Kill switch) 已關閉，但 URnetwork 系統服務仍安裝著一個封鎖，因此此裝置的流量正被封鎖。"
