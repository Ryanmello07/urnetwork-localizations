description: "Shown in place of the unclaimed figure when the app has no device session to read the chain with."
source: "Claims load from the chain once the app has a session. Press Connect first."
platforms:
  - windows
localizations:
  ar: "تُحمَّل المطالبات من السلسلة بعد أن يصبح للتطبيق جلسة. اتصل أولًا."
  cs: "Nároky se načtou z řetězce, jakmile bude mít aplikace relaci. Nejprve stiskněte Připojit."
  de: "Einlösungen werden von der Chain geladen, sobald die App eine Sitzung hat. Verbinde dich zuerst."
  el: "Οι διεκδικήσεις φορτώνονται από την αλυσίδα μόλις η εφαρμογή αποκτήσει συνεδρία. Πατήστε πρώτα Σύνδεση."
  en: "Claims load from the chain once the app has a session. Press Connect first."
  es: "Las reclamaciones se cargan desde la cadena cuando la app tiene una sesión. Conéctate primero."
  es-419: "Las reclamaciones se cargan desde la cadena cuando la app tiene una sesión. Primero presiona Conectar."
  es-MX: "Las reclamaciones se cargan desde la cadena cuando la app tiene una sesión. Primero presiona Conectar."
  fr: "Les réclamations se chargent depuis la chaîne une fois que l’app a une session. Appuyez d’abord sur Connecter."
  he: "המימושים נטענים מהשרשרת ברגע שלאפליקציה יש סשן. הקישו קודם על התחבר."
  hi: "ऐप का सत्र होते ही दावे चेन से लोड होते हैं। पहले कनेक्ट दबाएँ।"
  id: "Klaim dimuat dari chain setelah aplikasi memiliki sesi. Tekan Hubungkan terlebih dahulu."
  it: "I riscatti si caricano dalla catena quando l’app ha una sessione. Prima premi Connetti."
  ja: "アプリにセッションがあると、受け取り情報がチェーンから読み込まれます。先に「接続」を押してください。"
  ko: "앱에 세션이 생기면 받기 정보를 체인에서 불러옵니다. 먼저 연결을 누르세요."
  nl: "Claims worden van de chain geladen zodra de app een sessie heeft. Druk eerst op Verbinden."
  pl: "Odbiory wczytują się z łańcucha, gdy aplikacja ma sesję. Najpierw naciśnij Połącz."
  pt: "As reivindicações são carregadas da cadeia quando a app tiver uma sessão. Toque primeiro em Ligar."
  pt-BR: "Os resgates são carregados da cadeia assim que o app tiver uma sessão. Toque em Conectar primeiro."
  pt-PT: "As reivindicações são carregadas da cadeia quando a app tiver uma sessão. Toque primeiro em Ligar."
  ru: "Данные для получения загружаются из блокчейна, когда у приложения есть сеанс. Сначала подключитесь."
  sv: "Uttag läses in från kedjan när appen har en session. Tryck på Anslut först."
  sw: "Madai hupakiwa kutoka kwenye mnyororo mara programu inapokuwa na kipindi cha matumizi. Bonyeza Unganisha kwanza."
  th: "รายการรับจะโหลดจากเชนเมื่อแอปมีเซสชันแล้ว กดเชื่อมต่อก่อน"
  uk: "Дані про отримання завантажуються з блокчейну, щойно застосунок має сеанс. Спершу натисніть «Підключитися»."
  vi: "Thông tin nhận được tải từ chuỗi khi ứng dụng có phiên. Hãy nhấn Kết nối trước."
  zh: "应用建立会话后，才会从链上加载领取信息。请先连接。"
  zh-HK: "應用程式建立工作階段後，才會從鏈上載入領取資料。請先按「連接」。"
