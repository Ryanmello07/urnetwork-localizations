  es-MX: "No se pudo iniciar URnetwork. Sus registros están en {dir}."
  fr: "Impossible de démarrer URnetwork. Ses journaux se trouvent dans {dir}."
  he: "לא ניתן היה להפעיל את URnetwork. הלוגים שלו נמצאים ב-{dir}."
  hi: "URnetwork शुरू नहीं हो सका। इसके लॉग {dir} में हैं।"
  id: "URnetwork tidak dapat dimulai. Lognya ada di {dir}."
  it: "Impossibile avviare URnetwork. I suoi log si trovano in {dir}."
  ja: "URnetwork を起動できませんでした。ログは {dir} にあります。"
