description: "Linux: the body of the dialog shown when the app cannot start (its SDK host failed to initialize, so there is no window and no tray), under the heading something_went_wrong. The argument is the folder that holds the app's log files. The raw error follows on its own lines, untranslated."
source: "URnetwork could not start. Its logs are in {dir}."
platforms:
  - linux
placeholders:
  - name: dir
    type: string
localizations:
