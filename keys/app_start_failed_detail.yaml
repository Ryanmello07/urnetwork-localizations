  pt-BR: "Não foi possível iniciar a URnetwork. Os logs estão em {dir}."
  pt-PT: "Não foi possível iniciar a URnetwork. Os logs estão em {dir}."
  ru: "Не удалось запустить URnetwork. Его логи находятся в {dir}."
