  cs: "URnetwork se nepodařilo spustit. Jeho protokoly jsou v {dir}."
  de: "URnetwork konnte nicht gestartet werden. Die Protokolle liegen in {dir}."
  el: "Δεν ήταν δυνατή η εκκίνηση του URnetwork. Τα αρχεία καταγραφής του βρίσκονται στο {dir}."
  en: "URnetwork could not start. Its logs are in {dir}."
