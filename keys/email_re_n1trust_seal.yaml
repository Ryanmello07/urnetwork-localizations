description: "Re-engagement email N1 (trust): the sealed session, stated in the public threat model (section 2.1). 'Post Quantum Encryption' is the switch's name in the app. Sent only once the post-quantum connection fix is live."
source: "With Post Quantum Encryption on (connection options on the Connect screen), your session is sealed between your device and the provider, so our servers relay it without reading it."
platforms:
  - email
localizations:
  en: "With Post Quantum Encryption on (connection options on the Connect screen), your session is sealed between your device and the provider, so our servers relay it without reading it."
  ar: "عند تفعيل «التشفير ما بعد الكمومي» (من خيارات الاتصال في شاشة «اربط»)، تكون جلستك محكمة الإغلاق بين جهازك والمزوّد، فتنقلها خوادمنا دون أن تقرأها."
  cs: "Když je zapnuté Postkvantové šifrování (možnosti připojení na obrazovce Připojit), je vaše relace zapečetěná mezi vaším zařízením a poskytovatelem, takže ji naše servery předávají, aniž by ji četly."
  de: "Wenn die „Post-Quanten-Verschlüsselung“ eingeschaltet ist (Verbindungsoptionen auf dem Bildschirm „Verbinde“), ist deine Sitzung zwischen deinem Gerät und dem Anbieter versiegelt, sodass unsere Server sie weiterleiten, ohne sie zu lesen."
  el: "Με τη Μετακβαντική κρυπτογράφηση ενεργή (επιλογές σύνδεσης στην οθόνη Σύνδεση), η συνεδρία σου είναι σφραγισμένη ανάμεσα στη συσκευή σου και τον πάροχο, οπότε οι διακομιστές μας την αναμεταδίδουν χωρίς να τη διαβάζουν."
  es: "Con el Cifrado poscuántico activado (opciones de conexión en la pantalla Conecta), tu sesión queda sellada entre tu dispositivo y el proveedor, así que nuestros servidores la retransmiten sin leerla."
  es-419: "Con el Cifrado poscuántico activado (opciones de conexión en la pantalla Conectar), tu sesión queda sellada entre tu dispositivo y el proveedor, así que nuestros servidores la retransmiten sin leerla."
  es-MX: "Con el Cifrado poscuántico activado (opciones de conexión en la pantalla Conecta), tu sesión queda sellada entre tu dispositivo y el proveedor, así que nuestros servidores la retransmiten sin leerla."
  fr: "Avec le Chiffrement post-quantique activé (options de connexion sur l'écran Connecte), ta session est scellée entre ton appareil et le fournisseur, donc nos serveurs la relaient sans la lire."
  he: "כשהמתג ״הצפנה פוסט-קוונטית״ מופעל (באפשרויות החיבור במסך ״התחבר״), הסשן שלכם אטום בין המכשיר שלכם לספק, כך שהשרתים שלנו מעבירים אותו בלי לקרוא אותו."
  hi: "“पोस्ट-क्वांटम एन्क्रिप्शन” चालू होने पर (“कनेक्ट करें” स्क्रीन पर कनेक्शन विकल्पों में), आपका सेशन आपके डिवाइस और प्रदाता के बीच सील रहता है, इसलिए हमारे सर्वर उसे पढ़े बिना आगे भेजते हैं।"
  id: "Dengan “Enkripsi pasca-kuantum” aktif (opsi koneksi di layar “Hubungkan”), sesimu tersegel antara perangkatmu dan penyedia, sehingga server kami meneruskannya tanpa membacanya."
  it: "Con la Crittografia post-quantistica attiva (opzioni di connessione nella schermata Connetti), la tua sessione è sigillata tra il tuo dispositivo e il provider, quindi i nostri server la inoltrano senza leggerla."
  ja: "「ポスト量子暗号」（「接続」画面の接続オプション）をオンにすると、セッションはお使いのデバイスとプロバイダーの間で密封されるため、私たちのサーバーは中身を読まずに中継します。"
  ko: "'포스트 양자 암호화'(연결 화면의 연결 옵션)를 켜면 세션이 기기와 제공자 사이에서 봉인되므로, 저희 서버는 내용을 읽지 않고 중계합니다."
  nl: "Met Post-quantumversleuteling aan (verbindingsopties op het scherm Verbinden) is je sessie verzegeld tussen je apparaat en de provider, zodat onze servers hem doorsturen zonder hem te lezen."
  pl: "Gdy włączone jest Szyfrowanie postkwantowe (opcje połączenia na ekranie Połącz), twoja sesja jest zapieczętowana między twoim urządzeniem a dostawcą, więc nasze serwery ją przekazują, nie odczytując jej."
  pt: "Com a Encriptação pós-quântica ativada (opções de conexão na tela Conecte), sua sessão fica selada entre seu dispositivo e o provedor, então nossos servidores a retransmitem sem lê-la."
  pt-BR: "Com a Criptografia pós-quântica ativada (opções de conexão na tela Conectar), sua sessão fica selada entre seu dispositivo e o provedor, então nossos servidores a retransmitem sem lê-la."
  pt-PT: "Com a Encriptação pós-quântica ativada (opções de conexão no ecrã Ligar), a sua sessão fica selada entre o seu dispositivo e o fornecedor, por isso os nossos servidores retransmitem-na sem a ler."
  ru: "Если включено «Постквантовое шифрование» (параметры подключения на экране «Подключить»), ваш сеанс запечатан между вашим устройством и провайдером, поэтому наши серверы передают его, не читая."
  sv: "Med Postkvantkryptering påslagen (anslutningsalternativen på skärmen Anslut) är din session förseglad mellan din enhet och leverantören, så våra servrar vidarebefordrar den utan att läsa den."
  sw: "“Usimbaji fiche wa baada ya kwantamu” ukiwa umewashwa (chaguo za kuunganisha kwenye skrini ya “Unganisha”), kikao chako hufungwa kwa muhuri kati ya kifaa chako na mtoa huduma, kwa hivyo seva zetu hukipitisha bila kukisoma."
  th: "เมื่อเปิด “การเข้ารหัสแบบโพสต์ควอนตัม” (ในตัวเลือกการเชื่อมต่อบนหน้าจอ “เชื่อมต่อ”) เซสชันของคุณจะถูกปิดผนึกระหว่างอุปกรณ์ของคุณกับผู้ให้บริการ เซิร์ฟเวอร์ของเราจึงส่งต่อเซสชันโดยไม่ได้อ่าน"
  uk: "Якщо увімкнено «Постквантове шифрування» (параметри підключення на екрані «Підключитися»), ваш сеанс запечатано між вашим пристроєм і провайдером, тож наші сервери передають його, не читаючи."
  vi: "Khi bật “Mã hóa hậu lượng tử” (trong tùy chọn kết nối trên màn hình “Kết nối”), phiên của bạn được niêm phong giữa thiết bị của bạn và nhà cung cấp, nên máy chủ của chúng tôi chuyển tiếp phiên mà không đọc nó."
  zh: "开启“后量子加密”（在“连接”页面的连接选项中）后，你的会话会在你的设备和提供者之间密封，因此我们的服务器在中继时不会读取它。"
  zh-HK: "開啟「後量子加密」（在「連接」頁面的連接選項中）後，你的會話會在你的裝置和提供者之間密封，因此我們的伺服器在中繼時不會讀取它。"
