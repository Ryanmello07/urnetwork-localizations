description: "Protocol leaderboard (Leaderboard > Protocol): the neutral one-line banner on top of the tab while claiming a Top 200 spot (binding a fleet to a miner UID on SN25) isn't open on mainnet. The board still shows where the network would rank if it claimed now."
source: "Claiming isn't open yet. You can see where you'd rank now."
platforms:
  - apple
  - android
  - site
localizations:
  ar: "حجز الأماكن غير متاح بعد. يمكنك الآن رؤية المرتبة التي ستحتلها."
  cs: "Zajištění míst zatím není otevřené. Už teď ale uvidíte, kde byste se umístili."
  de: "Plätze lassen sich noch nicht sichern. Du siehst aber schon jetzt, wo du landen würdest."
  el: "Δεν μπορείτε ακόμα να κλείσετε θέση. Μπορείτε ήδη να δείτε πού θα κατατασσόσασταν."
  en: "Claiming isn't open yet. You can see where you'd rank now."
  es: "Todavía no se pueden reclamar puestos. Ya puedes ver en qué posición quedarías."
  es-419: "Todavía no se pueden reclamar lugares. Ya puedes ver en qué posición quedarías."
  es-MX: "Todavía no se pueden reclamar lugares. Ya puedes ver en qué posición quedarías."
  fr: "La réservation des places n’est pas encore ouverte. Vous pouvez déjà voir votre classement."
  he: "עדיין אי אפשר לתפוס מקומות. כבר עכשיו אפשר לראות איפה הייתם מדורגים."
  hi: "जगह पक्की करना अभी शुरू नहीं हुआ है। आप अभी देख सकते हैं कि आपकी रैंक कहाँ होगी।"
  id: "Tempat belum bisa diamankan. Anda sudah bisa melihat peringkat Anda sekarang."
  it: "Non è ancora possibile prendere un posto. Puoi già vedere dove ti classificheresti."
  ja: "枠の確保はまだ受け付けていません。今の予想順位はここで確認できます。"
  ko: "아직 자리를 확보할 수 없습니다. 지금 예상 순위는 확인할 수 있습니다."
  nl: "Plekken claimen kan nog niet. Je ziet nu al waar je zou eindigen."
  pl: "Zajmowanie miejsc jeszcze nie ruszyło. Już teraz widać, gdzie znalazłaby się twoja sieć."
  pt: "Ainda não é possível garantir lugares. Já pode ver em que posição ficaria."
  pt-BR: "Ainda não é possível garantir vagas. Você já pode ver em que posição ficaria."
  pt-PT: "Ainda não é possível garantir lugares. Já pode ver em que posição ficaria."
  ru: "Занять место пока нельзя. Но уже сейчас видно, какое место заняла бы ваша сеть."
  sv: "Det går inte att ta platser än. Du kan redan nu se var du skulle hamna."
  sw: "Kupata nafasi bado hakujafunguliwa. Unaweza kuona sasa ungeshika nafasi gani."
  th: "ยังจองที่ไม่ได้ในตอนนี้ แต่คุณดูได้แล้วว่าจะอยู่อันดับไหน"
  uk: "Зайняти місце поки не можна. Але вже зараз видно, яке місце посіла б ваша мережа."
  vi: "Chưa thể giành chỗ. Bạn đã có thể xem mình sẽ xếp hạng thế nào."
  zh: "席位获取尚未开放。您现在已可查看自己的预计排名。"
  zh-HK: "席位取得尚未開放。你現在已可查看自己的預計排名。"
