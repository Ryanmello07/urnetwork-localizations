description: "Connect error: no polkit service, the daemon falls back to the urnetwork group."
source: "This device has no polkit authorization service, so the URnetwork system service falls back to the 'urnetwork' group. Add your user to it and sign out and back in."
platforms:
  - linux
localizations:
  ar: "لا توجد خدمة تفويض polkit على هذا الجهاز، لذا تعود خدمة نظام URnetwork إلى مجموعة 'urnetwork'. أضف مستخدمك إليها ثم سجّل الخروج وعُد للدخول."
  cs: "Toto zařízení nemá autorizační službu polkit, takže systémová služba URnetwork používá skupinu 'urnetwork'. Přidejte do ní svého uživatele a odhlaste se a znovu přihlaste."
  de: "Dieses Gerät hat keinen polkit-Autorisierungsdienst, deshalb greift der URnetwork-Systemdienst auf die Gruppe 'urnetwork' zurück. Füge deinen Benutzer hinzu und melde dich ab und wieder an."
  el: "Αυτή η συσκευή δεν έχει υπηρεσία εξουσιοδότησης polkit, οπότε η υπηρεσία συστήματος URnetwork χρησιμοποιεί την ομάδα 'urnetwork'. Προσθέστε τον χρήστη σας σε αυτήν και αποσυνδεθείτε και συνδεθείτε ξανά."
  en: "This device has no polkit authorization service, so the URnetwork system service falls back to the 'urnetwork' group. Add your user to it and sign out and back in."
  es: "Este dispositivo no tiene servicio de autorización polkit, así que el servicio del sistema de URnetwork recurre al grupo 'urnetwork'. Añade tu usuario a él y cierra y vuelve a iniciar sesión."
  es-419: "Este dispositivo no tiene servicio de autorización polkit, así que el servicio del sistema de URnetwork recurre al grupo 'urnetwork'. Agrega tu usuario a ese grupo y cierra sesión y vuelve a iniciarla."
  es-MX: "Este dispositivo no tiene servicio de autorización polkit, así que el servicio del sistema de URnetwork recurre al grupo 'urnetwork'. Agrega tu usuario a él y cierra y vuelve a iniciar sesión."
  fr: "Cet appareil n’a pas de service d’autorisation polkit, le service système URnetwork se rabat donc sur le groupe 'urnetwork'. Ajoutez-y votre utilisateur, puis déconnectez-vous et reconnectez-vous."
  he: "למכשיר הזה אין שירות הרשאות polkit, ולכן שירות המערכת של URnetwork משתמש בקבוצה 'urnetwork'. הוסיפו אליה את המשתמש שלכם, התנתקו והתחברו מחדש."
  hi: "इस डिवाइस पर polkit प्राधिकरण सेवा नहीं है, इसलिए URnetwork सिस्टम सेवा 'urnetwork' समूह का उपयोग करती है। अपने उपयोगकर्ता को उसमें जोड़ें और साइन आउट करके फिर साइन इन करें।"
  id: "Perangkat ini tidak memiliki layanan otorisasi polkit, jadi layanan sistem URnetwork kembali ke grup 'urnetwork'. Tambahkan pengguna Anda ke grup itu, lalu keluar dan masuk lagi."
  it: "Questo dispositivo non ha un servizio di autorizzazione polkit, quindi il servizio di sistema URnetwork ricorre al gruppo 'urnetwork'. Aggiungi il tuo utente al gruppo, poi esci e accedi di nuovo."
  ja: "このデバイスには polkit 認可サービスがないため、URnetwork のシステムサービスは 'urnetwork' グループにフォールバックします。自分のユーザーをそのグループに追加し、サインアウトして再度サインインしてください。"
  ko: "이 기기에는 polkit 인증 서비스가 없어 URnetwork 시스템 서비스가 'urnetwork' 그룹으로 대체합니다. 사용자를 그 그룹에 추가한 뒤 로그아웃했다가 다시 로그인하세요."
  nl: "Dit apparaat heeft geen polkit-autorisatiedienst, dus de URnetwork-systeemdienst valt terug op de groep 'urnetwork'. Voeg je gebruiker eraan toe en meld je af en weer aan."
  pl: "To urządzenie nie ma usługi autoryzacji polkit, więc usługa systemowa URnetwork korzysta z grupy 'urnetwork'. Dodaj do niej swojego użytkownika, a potem wyloguj się i zaloguj ponownie."
  pt: "Este dispositivo não tem serviço de autorização polkit, então o serviço do sistema URnetwork usa o grupo 'urnetwork'. Adicione seu usuário a ele e saia e entre de novo."
  pt-BR: "Este dispositivo não tem serviço de autorização polkit, então o serviço do sistema URnetwork usa o grupo 'urnetwork'. Adicione seu usuário a ele e saia e entre de novo."
  pt-PT: "Este dispositivo não tem serviço de autorização polkit, pelo que o serviço de sistema URnetwork recorre ao grupo 'urnetwork'. Adicione o seu utilizador ao grupo e termine e volte a iniciar sessão."
  ru: "На этом устройстве нет службы авторизации polkit, поэтому системная служба URnetwork использует группу 'urnetwork'. Добавьте в неё своего пользователя, затем выйдите из системы и войдите снова."
  sv: "Den här enheten saknar polkit-auktoriseringstjänst, så URnetworks systemtjänst faller tillbaka på gruppen 'urnetwork'. Lägg till din användare i den och logga ut och in igen."
  sw: "Kifaa hiki hakina huduma ya uidhinishaji ya polkit, kwa hivyo huduma ya mfumo ya URnetwork hutumia kikundi cha 'urnetwork'. Ongeza mtumiaji wako ndani yake kisha utoke na uingie tena."
  th: "อุปกรณ์นี้ไม่มีบริการอนุญาต polkit บริการระบบของ URnetwork จึงใช้กลุ่ม 'urnetwork' แทน เพิ่มผู้ใช้ของคุณเข้ากลุ่มนั้น แล้วออกจากระบบและเข้าสู่ระบบใหม่"
  uk: "На цьому пристрої немає служби авторизації polkit, тому системна служба URnetwork використовує групу 'urnetwork'. Додайте до неї свого користувача, потім вийдіть із системи та увійдіть знову."
  vi: "Thiết bị này không có dịch vụ ủy quyền polkit, nên dịch vụ hệ thống URnetwork dùng nhóm 'urnetwork' thay thế. Thêm người dùng của bạn vào nhóm đó rồi đăng xuất và đăng nhập lại."
  zh: "此设备没有 polkit 授权服务，因此 URnetwork 系统服务改用 'urnetwork' 用户组。将你的用户加入该组，然后注销并重新登录。"
  zh-HK: "此裝置沒有 polkit 授權服務，因此 URnetwork 系統服務改用 'urnetwork' 使用者群組。將你的使用者加入該群組，然後登出並重新登入。"
