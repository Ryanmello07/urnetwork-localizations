description: "Connect error: another user on the device holds the tunnel."
source: "Another user on this device is connected through URnetwork. Disconnect it from their session, or take it over with administrator permission."
platforms:
  - linux
localizations:
  ar: "مستخدم آخر على هذا الجهاز متصل عبر URnetwork. اقطع الاتصال من جلسته، أو استولِ عليه بإذن المسؤول."
  cs: "Jiný uživatel na tomto zařízení je připojen přes URnetwork. Odpojte ho z jeho relace, nebo připojení převezměte s oprávněním správce."
  de: "Ein anderer Benutzer auf diesem Gerät ist über URnetwork verbunden. Trenne es aus dessen Sitzung oder übernimm es mit Administratorberechtigung."
  el: "Ένας άλλος χρήστης σε αυτήν τη συσκευή είναι συνδεδεμένος μέσω URnetwork. Αποσυνδέστε το από τη συνεδρία του, ή αναλάβετέ το με άδεια διαχειριστή."
  en: "Another user on this device is connected through URnetwork. Disconnect it from their session, or take it over with administrator permission."
  es: "Otro usuario de este dispositivo está conectado a través de URnetwork. Desconéctalo desde su sesión, o tómalo con permiso de administrador."
  es-419: "Otro usuario de este dispositivo está conectado a través de URnetwork. Desconéctalo desde su sesión, o toma el control con permiso de administrador."
  es-MX: "Otro usuario de este dispositivo está conectado a través de URnetwork. Desconéctalo desde su sesión, o tómalo con permiso de administrador."
  fr: "Un autre utilisateur de cet appareil est connecté via URnetwork. Déconnectez-le depuis sa session, ou reprenez la connexion avec une autorisation d’administrateur."
  he: "משתמש אחר במכשיר הזה מחובר דרך URnetwork. נתקו אותו מההפעלה שלו, או השתלטו עליו בהרשאת מנהל."
  hi: "इस डिवाइस पर कोई अन्य उपयोगकर्ता URnetwork के ज़रिए कनेक्ट है। उसे उसके सत्र से डिस्कनेक्ट करें, या व्यवस्थापक अनुमति से उसे अपने नियंत्रण में लें।"
  id: "Pengguna lain di perangkat ini terhubung melalui URnetwork. Putuskan dari sesi mereka, atau ambil alih dengan izin administrator."
  it: "Un altro utente di questo dispositivo è connesso tramite URnetwork. Disconnettilo dalla sua sessione, oppure prendi il controllo con il permesso dell’amministratore."
  ja: "このデバイスの別のユーザーが URnetwork 経由で接続中です。そのユーザーのセッションで切断するか、管理者の許可で引き継いでください。"
  ko: "이 기기의 다른 사용자가 URnetwork를 통해 연결되어 있습니다. 해당 세션에서 연결을 해제하거나 관리자 권한으로 넘겨받으세요."
  nl: "Een andere gebruiker op dit apparaat is via URnetwork verbonden. Verbreek de verbinding vanuit diens sessie, of neem hem over met beheerdersrechten."
  pl: "Inny użytkownik tego urządzenia jest połączony przez URnetwork. Rozłącz go z jego sesji lub przejmij połączenie z uprawnieniami administratora."
  pt: "Outro usuário deste dispositivo está conectado pela URnetwork. Desconecte a partir da sessão dele, ou assuma a conexão com permissão de administrador."
  pt-BR: "Outro usuário deste dispositivo está conectado pela URnetwork. Desconecte a partir da sessão dele, ou assuma a conexão com permissão de administrador."
  pt-PT: "Outro utilizador deste dispositivo está ligado através da URnetwork. Desligue-o a partir da sessão dele, ou assuma a ligação com permissão de administrador."
  ru: "Другой пользователь этого устройства подключён через URnetwork. Отключите его из его сессии или перехватите подключение с разрешением администратора."
  sv: "En annan användare på den här enheten är ansluten via URnetwork. Koppla från den från dennes session, eller ta över den med administratörsbehörighet."
  sw: "Mtumiaji mwingine kwenye kifaa hiki ameunganishwa kupitia URnetwork. Tenganisha kutoka kipindi chake, au chukua udhibiti kwa ruhusa ya msimamizi."
  th: "ผู้ใช้อีกคนบนอุปกรณ์นี้กำลังเชื่อมต่อผ่าน URnetwork ให้ตัดการเชื่อมต่อจากเซสชันของเขา หรือเข้าควบคุมด้วยสิทธิ์ผู้ดูแลระบบ"
  uk: "Інший користувач цього пристрою підключений через URnetwork. Відключіть його з його сесії або перехопіть підключення з дозволом адміністратора."
  vi: "Một người dùng khác trên thiết bị này đang kết nối qua URnetwork. Hãy ngắt kết nối từ phiên của họ, hoặc tiếp quản bằng quyền quản trị viên."
  zh: "此设备上的另一位用户正通过 URnetwork 连接。请从其会话中断开连接，或使用管理员权限接管。"
  zh-HK: "此裝置上的另一位使用者正透過 URnetwork 連線。請從其工作階段中斷開連接，或使用管理員權限接管。"
