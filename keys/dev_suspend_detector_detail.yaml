description: "Developer page: the explanation under the 'Suspend detector' setting."
source: "How much timer overshoot reads as the machine being suspended rather than an exit stalling, in ms, so a resumed machine does not convict every exit at once. Off disables it"
platforms:
  - linux
localizations:
  ar: "مقدار تجاوز المؤقت الذي يُعدّ دليلًا على تعليق الجهاز لا على توقف مخرج، بالمللي ثانية، كي لا يُدين الجهاز بعد استئنافه كل المخارج دفعة واحدة. عند الإيقاف، يُعطَّل"
  cs: "Jak velké zpoždění časovače se vyloží jako uspaný počítač, a ne zaseknutý výstup, v ms, aby probuzený počítač neodsoudil všechny výstupy najednou. Vypnuto ho vypne"
  de: "Ab wie viel Timer-Überschreitung angenommen wird, dass der Rechner im Ruhezustand war und nicht ein Exit hängt, in ms, damit ein aufgeweckter Rechner nicht alle Exits auf einmal verurteilt. Aus: deaktiviert die Erkennung"
  el: "Πόση καθυστέρηση χρονομέτρου ερμηνεύεται ως αναστολή του υπολογιστή και όχι ως κόλλημα εξόδου, σε ms, ώστε ένας υπολογιστής που ξυπνά να μην καταδικάζει όλες τις εξόδους μαζί. Η απενεργοποίηση τον απενεργοποιεί"
  en: "How much timer overshoot reads as the machine being suspended rather than an exit stalling, in ms, so a resumed machine does not convict every exit at once. Off disables it"
  es: "Cuánto retraso del temporizador se interpreta como que el equipo estuvo suspendido y no como una salida bloqueada, en ms, para que un equipo reanudado no condene todas las salidas a la vez. Si está desactivado, no se aplica"
  es-419: "Cuánto retraso del temporizador se interpreta como que el equipo estuvo suspendido y no como una salida trabada, en ms, para que un equipo reanudado no condene todas las salidas a la vez. Si está desactivado, no se aplica"
  es-MX: "Cuánto retraso del temporizador se interpreta como que el equipo estuvo suspendido y no como una salida trabada, en ms, para que un equipo reanudado no condene todas las salidas a la vez. Si está desactivado, no se aplica"
  fr: "Quel dépassement de minuterie est interprété comme une mise en veille de l’ordinateur plutôt que comme une sortie figée, en ms, pour qu’un ordinateur qui se réveille ne condamne pas toutes les sorties d’un coup. Désactivé le coupe"
  he: "כמה חריגה של הטיימר, במילישניות, נחשבת להשהיית המחשב ולא לתקיעת יציאה, כדי שמחשב שהתעורר לא ירשיע את כל היציאות בבת אחת. כיבוי מבטל אותו"
  hi: "टाइमर की कितनी देरी को एग्ज़िट के अटकने के बजाय मशीन के सस्पेंड होने के रूप में पढ़ा जाता है, ms में, ताकि फिर से चालू हुई मशीन सभी एग्ज़िट को एक साथ दोषी न ठहराए। बंद करने पर यह बंद हो जाता है"
  id: "Seberapa besar keterlambatan timer yang dibaca sebagai komputer yang ditangguhkan, bukan exit yang macet, dalam ms, agar komputer yang baru aktif kembali tidak memvonis semua exit sekaligus. Nonaktif mematikannya"
  it: "Quanto ritardo del timer viene letto come computer sospeso anziché come uscita bloccata, in ms, così un computer che riprende non condanna tutte le uscite insieme. Disattivato lo spegne"
  ja: "どれだけのタイマーの遅れ（ミリ秒）を、出口の停止ではなくコンピューターのスリープとみなすか。復帰したコンピューターがすべての出口を一度に判定するのを防ぎます。オフにすると無効になります"
  ko: "타이머 지연이 어느 정도(밀리초)일 때 출구 멈춤이 아니라 컴퓨터 절전으로 볼지 정합니다. 절전에서 깨어난 컴퓨터가 모든 출구를 한꺼번에 판정하지 않게 합니다. 끄면 사용하지 않습니다"
  nl: "Hoeveel timervertraging wordt gelezen als een computer in slaapstand in plaats van een vastgelopen exit, in ms, zodat een ontwaakte computer niet alle exits tegelijk veroordeelt. Uit schakelt hem uit"
  pl: "Jakie opóźnienie zegara jest uznawane za uśpienie komputera, a nie za zablokowane wyjście, w ms, aby wybudzony komputer nie skazał wszystkich wyjść naraz. Wyłączenie je wyłącza"
  pt: "Quanto atraso do temporizador é interpretado como o computador suspenso, e não como uma saída bloqueada, em ms, para que um computador retomado não condene todas as saídas de uma vez. Desativado desliga-o"
  pt-BR: "Quanto atraso do timer é interpretado como o computador suspenso, e não como uma saída travada, em ms, para que um computador retomado não condene todas as saídas de uma vez. Desativado o desliga"
  pt-PT: "Quanto atraso do temporizador é interpretado como o computador suspenso, e não como uma saída bloqueada, em ms, para que um computador retomado não condene todas as saídas de uma vez. Desativado desliga-o"
  ru: "Какое превышение таймера считается приостановкой компьютера, а не зависанием выхода, в мс, чтобы после пробуждения компьютер не осудил сразу все выходы. Если выключено, детектор не работает"
  sv: "Hur mycket timerfördröjning som tolkas som att datorn var i viloläge snarare än att en utgång låst sig, i ms, så att en väckt dator inte fäller alla utgångar på en gång. Av stänger av den"
  sw: "Kiasi cha kuchelewa kwa kipima muda, kwa ms, kinachotafsiriwa kama kompyuta iliyolala badala ya njia ya kutoka iliyokwama, ili kompyuta iliyoamka isihukumu njia zote za kutoka kwa wakati mmoja. Kuzima kunakizima"
  th: "ความล่าช้าของตัวจับเวลาเท่าใด (มิลลิวินาที) จะถือว่าคอมพิวเตอร์พักเครื่อง ไม่ใช่ทางออกค้าง เพื่อไม่ให้คอมพิวเตอร์ที่เพิ่งกลับมาทำงานตัดสินทุกทางออกพร้อมกัน ปิดเพื่อยกเลิก"
  uk: "Яка затримка таймера вважається сном комп’ютера, а не зависанням виходу, у мс, щоб комп’ютер після пробудження не засудив усі виходи одразу. Вимкнення вимикає його"
  vi: "Mức trễ của bộ hẹn giờ, tính bằng ms, được hiểu là máy tính tạm ngưng thay vì điểm thoát bị kẹt, để máy tính vừa hoạt động lại không kết luận lỗi mọi điểm thoát cùng lúc. Tắt sẽ vô hiệu hóa nó"
  zh: "计时器超时多少（毫秒）会被视为计算机被挂起，而不是出口停滞，以免计算机恢复后一次性将所有出口定罪。关闭时停用"
  zh-HK: "計時器超時多少（毫秒）會被視為電腦進入休眠，而不是出口停滯，以免電腦恢復後一次過將所有出口判罪。關閉時停用"
