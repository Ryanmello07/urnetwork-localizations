description: "Linux desktop notification, shown once ever, the first time closing the window hides it to the system tray (only while a tray has the app's icon). Its title is the product name. Windows shows a tray balloon at the same moment under this key."
source: "Still running — URnetwork closed to the tray. Click its icon there to open it again."
platforms:
  - linux
localizations:
  ar: "لا يزال يعمل — أُغلق URnetwork إلى علبة النظام. انقر على أيقونته هناك لفتحه مرة أخرى."
  cs: "Stále běží — URnetwork se zavřel do systémové lišty. Znovu ho otevřete kliknutím na jeho ikonu v liště."
  de: "Läuft weiter — URnetwork wurde in den Infobereich geschlossen. Klicke dort auf das Symbol, um es wieder zu öffnen."
  el: "Εξακολουθεί να εκτελείται — Το URnetwork έκλεισε στην περιοχή ειδοποιήσεων. Κάντε κλικ στο εικονίδιό του εκεί για να το ανοίξετε ξανά."
  en: "Still running — URnetwork closed to the tray. Click its icon there to open it again."
  es: "Sigue en ejecución — URnetwork se cerró en la bandeja del sistema. Haz clic en su icono allí para volver a abrirlo."
  es-419: "Sigue en ejecución — URnetwork se cerró en la bandeja del sistema. Haz clic en su ícono allí para volver a abrirlo."
  es-MX: "Sigue en ejecución — URnetwork se cerró en la bandeja del sistema. Haz clic en su ícono allí para volver a abrirlo."
  fr: "Toujours actif — URnetwork a été fermé dans la zone de notification. Cliquez sur son icône à cet endroit pour le rouvrir."
  he: "עדיין פועל — URnetwork נסגר אל מגש המערכת. לחצו על הסמל שלו שם כדי לפתוח אותו שוב."
  hi: "अभी भी चल रहा है — URnetwork सिस्टम ट्रे में बंद हुआ है। इसे फिर से खोलने के लिए वहाँ इसके आइकन पर क्लिक करें।"
  id: "Masih berjalan — URnetwork ditutup ke baki sistem. Klik ikonnya di sana untuk membukanya lagi."
  it: "Ancora in esecuzione — URnetwork è stato chiuso nell’area di notifica. Fai clic sulla sua icona lì per riaprirlo."
  ja: "実行中です — URnetwork はトレイに格納されました。もう一度開くには、トレイのアイコンをクリックしてください。"
  ko: "계속 실행 중 — URnetwork가 트레이로 닫혔습니다. 다시 열려면 트레이에서 아이콘을 클릭하세요."
  nl: "Nog actief — URnetwork is naar het systeemvak gesloten. Klik daar op het pictogram om het weer te openen."
  pl: "Nadal działa — URnetwork został zamknięty do zasobnika systemowego. Kliknij tam jego ikonę, aby otworzyć go ponownie."
  pt: "Ainda em execução — a URnetwork foi fechada na bandeja do sistema. Clique no ícone dela ali para abri-la novamente."
  pt-BR: "Ainda em execução — a URnetwork foi fechada na bandeja do sistema. Clique no ícone dela ali para abri-la novamente."
  pt-PT: "Ainda em execução — a URnetwork foi fechada para a área de notificação. Clique no respetivo ícone para a abrir novamente."
  ru: "Продолжает работать — URnetwork свёрнут в системный трей. Нажмите на его значок там, чтобы открыть снова."
  sv: "Körs fortfarande — URnetwork stängdes till systemfältet. Klicka på ikonen där för att öppna det igen."
  sw: "Bado inafanya kazi — URnetwork imefungwa kwenye trei ya mfumo. Bofya aikoni yake hapo ili kuifungua tena."
  th: "ยังทำงานอยู่ — URnetwork ถูกปิดไปไว้ที่ถาดระบบ คลิกไอคอนที่นั่นเพื่อเปิดอีกครั้ง"
  uk: "Продовжує працювати — URnetwork згорнуто в системний трей. Натисніть його значок там, щоб відкрити знову."
  vi: "Vẫn đang chạy — URnetwork đã được đóng xuống khay hệ thống. Nhấp vào biểu tượng của nó ở đó để mở lại."
  zh: "仍在运行 — URnetwork 已关闭到托盘。点击托盘中的图标即可再次打开。"
  zh-HK: "仍在執行 — URnetwork 已關閉至系統匣。按一下系統匣中的圖示即可再次開啟。"
