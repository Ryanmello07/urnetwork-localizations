description: "Footer of every campaign email (onboarding and re-engagement), under the company and unsubscribe line: identifies the email as promotional (US CAN-SPAM requires this without affirmative consent) and says why the reader gets it. 'above' refers to the unsubscribe link in the line just before it."
source: "This is a promotional email from URnetwork. You're getting it because product updates are on for your account; the unsubscribe link above turns them off."
platforms:
  - email
localizations:
  en: "This is a promotional email from URnetwork. You're getting it because product updates are on for your account; the unsubscribe link above turns them off."
  ar: "هذه رسالة ترويجية من URnetwork. تصلك لأن تحديثات المنتج مفعّلة في حسابك؛ ويوقفها رابط إلغاء الاشتراك أعلاه."
  cs: "Toto je propagační e-mail od URnetwork. Dostáváte ho, protože máte u svého účtu zapnuté novinky o produktu; odkaz pro odhlášení odběru výše je vypne."
  de: "Dies ist eine Werbe-E-Mail von URnetwork. Du bekommst sie, weil Produkt-Updates für dein Konto eingeschaltet sind; der Abmeldelink oben schaltet sie aus."
  el: "Αυτό είναι ένα διαφημιστικό email από το URnetwork. Το λαμβάνεις επειδή οι ενημερώσεις προϊόντος είναι ενεργές για τον λογαριασμό σου. Ο σύνδεσμος διαγραφής παραπάνω τις απενεργοποιεί."
  es: "Este es un correo promocional de URnetwork. Lo recibes porque las actualizaciones de productos están activadas en tu cuenta; el enlace de arriba para cancelar la suscripción las desactiva."
  es-419: "Este es un correo promocional de URnetwork. Lo recibes porque las actualizaciones del producto están activadas en tu cuenta; el enlace de arriba para cancelar la suscripción las desactiva."
  es-MX: "Este es un correo promocional de URnetwork. Lo recibes porque las actualizaciones de productos están activadas en tu cuenta; el enlace de arriba para cancelar la suscripción las desactiva."
  fr: "Ceci est un e-mail promotionnel d'URnetwork. Tu le reçois parce que les mises à jour sur le produit sont activées sur ton compte ; le lien de désabonnement ci-dessus les désactive."
  he: "זהו מייל פרסומי מ-URnetwork. קיבלתם אותו כי עדכוני מוצר מופעלים בחשבון שלכם; הקישור להסרה מרשימת התפוצה שלמעלה מכבה אותם."
  hi: "यह URnetwork का एक प्रचार ईमेल है। आपको यह इसलिए मिल रहा है क्योंकि आपके खाते में उत्पाद अपडेट चालू हैं; ऊपर दिया गया सदस्यता छोड़ने का लिंक उन्हें बंद कर देता है।"
  id: "Ini email promosi dari URnetwork. Kamu menerimanya karena pembaruan produk aktif di akunmu; tautan berhenti berlangganan di atas akan menonaktifkannya."
  it: "Questa è un'email promozionale di URnetwork. La ricevi perché gli aggiornamenti sul prodotto sono attivi sul tuo account; il link qui sopra per annullare l'iscrizione li disattiva."
  ja: "これは URnetwork からのプロモーションメールです。アカウントで製品アップデートがオンになっているため、お送りしています。上の「配信停止」リンクからオフにできます。"
  ko: "이 메일은 URnetwork의 광고성 메일입니다. 계정에서 제품 업데이트가 켜져 있어 받고 계시며, 위의 수신 거부 링크로 끌 수 있습니다."
  nl: "Dit is een promotionele e-mail van URnetwork. Je ontvangt hem omdat productupdates voor je account aanstaan; de afmeldlink hierboven zet ze uit."
  pl: "To jest e-mail promocyjny od URnetwork. Dostajesz go, bo na twoim koncie są włączone aktualizacje produktu; link do wypisania się powyżej je wyłącza."
  pt: "Este é um e-mail promocional da URnetwork. Você está recebendo porque as atualizações de produtos estão ativadas na sua conta; o link acima para cancelar a inscrição as desativa."
  pt-BR: "Este é um e-mail promocional da URnetwork. Você está recebendo porque as atualizações de produtos estão ativadas na sua conta; o link acima para cancelar a inscrição as desativa."
  pt-PT: "Este é um e-mail promocional da URnetwork. Está a recebê-lo porque as atualizações do produto estão ativadas na sua conta; o link acima para cancelar a subscrição desativa-as."
  ru: "Это рекламное письмо от URnetwork. Вы получаете его, потому что для вашего аккаунта включены новости о продукте; ссылка для отписки выше их отключает."
  sv: "Det här är ett reklammejl från URnetwork. Du får det eftersom produktuppdateringar är påslagna för ditt konto; avregistreringslänken ovan stänger av dem."
  sw: "Hii ni barua pepe ya matangazo kutoka URnetwork. Unaipokea kwa sababu masasisho ya bidhaa yamewashwa kwenye akaunti yako; kiungo cha kujiondoa kilicho hapo juu huyazima."
  th: "นี่คืออีเมลส่งเสริมการขายจาก URnetwork คุณได้รับอีเมลนี้เพราะบัญชีของคุณเปิดรับข่าวสารผลิตภัณฑ์ไว้ ลิงก์ยกเลิกการรับอีเมลด้านบนจะปิดการรับข่าวสารนี้"
  uk: "Це рекламний лист від URnetwork. Ви отримуєте його, бо для вашого акаунта ввімкнено новини про продукт; посилання для відписки вище їх вимикає."
  vi: "Đây là email quảng cáo từ URnetwork. Bạn nhận được email này vì tài khoản của bạn đang bật cập nhật sản phẩm; liên kết hủy đăng ký ở trên sẽ tắt các cập nhật này."
  zh: "这是一封来自 URnetwork 的推广邮件。你会收到它，是因为你的账户开启了产品更新；上方的“退订”链接会将其关闭。"
  zh-HK: "這是一封來自 URnetwork 的推廣電郵。你會收到它，是因為你的帳戶開啟了產品更新；上方的「取消訂閱」連結會將其關閉。"
