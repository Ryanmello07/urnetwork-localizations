description: "Developer tools screen: explanatory subtext under the 'group follow' control."
source: "A quarantined exit keeps its own sites' new connections through the early bench, when the verdict is least proven, so a bench does not split the site's egress IP. New sites still avoid it. Off scatters them"
platforms:
  - android
localizations:
  ar: "يحتفظ المخرج المحجور بالاتصالات الجديدة لمواقعه خلال بداية الحجر، حين يكون الحكم في أضعف حالاته، كي لا يؤدي الحجر إلى تقسيم عنوان IP للخروج الخاص بالموقع. تظل المواقع الجديدة تتجنبه. عند الإيقاف، تُوزَّع تلك الاتصالات"
  cs: "Výstup v karanténě si ponechá nová připojení svých vlastních webů během začátku pobytu na lavičce, kdy je verdikt nejméně prokázaný, aby lavička nerozdělila výstupní IP webu. Nové weby se mu dál vyhýbají. Vypnuto je rozptýlí"
  de: "Ein Exit in Quarantäne behält in der frühen Ersatzbankphase, in der das Urteil am wenigsten gesichert ist, die neuen Verbindungen seiner eigenen Websites, damit die Ersatzbank die Egress-IP der Website nicht aufteilt. Neue Websites meiden ihn weiterhin. Aus: verteilt sie"
  el: "Μια έξοδος σε καραντίνα κρατά τις νέες συνδέσεις των δικών της ιστότοπων στην αρχή του πάγκου, όταν η ετυμηγορία είναι λιγότερο αποδεδειγμένη, ώστε ο πάγκος να μη διασπά την IP εξόδου του ιστότοπου. Οι νέοι ιστότοποι εξακολουθούν να την αποφεύγουν. Η απενεργοποίηση τις διασκορπίζει"
  en: "A quarantined exit keeps its own sites' new connections through the early bench, when the verdict is least proven, so a bench does not split the site's egress IP. New sites still avoid it. Off scatters them"
  es: "Una salida en cuarentena conserva las conexiones nuevas de sus propios sitios durante el inicio del banquillo, cuando el veredicto es menos seguro, para que el banquillo no divida la IP de salida del sitio. Los sitios nuevos la siguen evitando. Si está desactivado, se dispersan"
  es-419: "Una salida en cuarentena conserva las conexiones nuevas de sus propios sitios durante el inicio de la banca, cuando el veredicto es menos seguro, para que la banca no divida la IP de salida del sitio. Los sitios nuevos la siguen evitando. Si está desactivado, se dispersan"
  es-MX: "Una salida en cuarentena conserva las conexiones nuevas de sus propios sitios durante el inicio de la banca, cuando el veredicto es menos seguro, para que la banca no divida la IP de salida del sitio. Los sitios nuevos la siguen evitando. Si está desactivado, se dispersan"
  fr: "Une sortie en quarantaine garde les nouvelles connexions de ses propres sites au début de la mise sur la touche, quand le verdict est le moins établi, pour que la mise sur la touche ne divise pas l’IP de sortie du site. Les nouveaux sites l’évitent toujours. Désactivé les disperse"
  he: "יציאה בהסגר שומרת את החיבורים החדשים של האתרים שלה בתחילת השהייה על הספסל, כשההכרעה הכי פחות מוכחת, כדי שהספסל לא יפצל את כתובת ה-IP היוצאת של האתר. אתרים חדשים עדיין נמנעים ממנה. כיבוי מפזר אותם"
  hi: "क्वारंटीन में रखा एग्ज़िट बेंच के शुरुआती दौर में, जब फ़ैसला सबसे कम सिद्ध होता है, अपनी साइटों के नए कनेक्शन रखता है, ताकि बेंच साइट के इग्रेस IP को न बाँटे। नई साइटें अब भी उससे बचती हैं। बंद करने पर वे बिखर जाते हैं"
  id: "Exit yang dikarantina mempertahankan koneksi baru dari situsnya sendiri selama awal masa cadangan, saat vonis paling belum terbukti, agar masa cadangan tidak memecah IP egress situs. Situs baru tetap menghindarinya. Nonaktif menyebarkannya"
  it: "Un’uscita in quarantena mantiene le nuove connessioni dei propri siti all’inizio della panchina, quando il verdetto è meno provato, così la panchina non divide l’IP di uscita del sito. I nuovi siti continuano a evitarla. Disattivato li disperde"
  ja: "隔離された出口は、判定の裏付けが最も弱い待機の初期段階では、自分のサイトの新しい接続を保持します。これにより、待機によってサイトの出口 IP が分かれることを防ぎます。新しいサイトは引き続きその出口を避けます。オフにすると分散させます"
  ko: "격리된 출구는 판정의 근거가 가장 약한 대기 초기에 자기 사이트의 새 연결을 유지해, 대기 때문에 사이트의 송신 IP가 나뉘지 않게 합니다. 새 사이트는 여전히 그 출구를 피합니다. 끄면 흩어지게 합니다"
  nl: "Een exit in quarantaine houdt de nieuwe verbindingen van zijn eigen sites tijdens het begin van de bankperiode, wanneer het oordeel het minst bewezen is, zodat de bank het egress-IP van de site niet opsplitst. Nieuwe sites vermijden hem nog steeds. Uit verspreidt ze"
  pl: "Wyjście w kwarantannie zachowuje nowe połączenia swoich witryn na początku ławki, gdy werdykt jest najmniej pewny, aby ławka nie rozdzieliła wyjściowego IP witryny. Nowe witryny nadal go unikają. Wyłączenie je rozprasza"
  pt: "Uma saída em quarentena mantém as novas ligações dos seus próprios sites no início do banco, quando o veredicto está menos comprovado, para que o banco não divida o IP de saída do site. Os novos sites continuam a evitá-la. Desativado dispersa-as"
  pt-BR: "Uma saída em quarentena mantém as novas conexões dos seus próprios sites no início do banco, quando o veredito é menos comprovado, para que o banco não divida o IP de saída do site. Novos sites continuam evitando-a. Desativado os dispersa"
  pt-PT: "Uma saída em quarentena mantém as novas ligações dos seus próprios sites no início do banco, quando o veredicto está menos comprovado, para que o banco não divida o IP de saída do site. Os novos sites continuam a evitá-la. Desativado dispersa-as"
  ru: "Выход на карантине сохраняет новые соединения своих сайтов в начале отстранения, когда вердикт наименее обоснован, чтобы отстранение не разделяло исходящий IP сайта. Новые сайты по-прежнему его избегают. Если выключено, соединения распределяются по другим выходам"
  sv: "En utgång i karantän behåller sina egna webbplatsers nya anslutningar under början av avbänkningen, när domen är minst bevisad, så att avbänkningen inte delar webbplatsens egress-IP. Nya webbplatser undviker den fortfarande. Av sprider dem"
  sw: "Njia ya kutoka iliyotengwa huendelea kupokea miunganisho mipya ya tovuti zake mwanzoni mwa kukaa benchi, wakati hukumu bado haijathibitishwa sana, ili benchi lisigawanye IP ya kutokea ya tovuti. Tovuti mpya bado huiepuka. Kuzima kunazitawanya"
  th: "ทางออกที่ถูกกักกันจะเก็บการเชื่อมต่อใหม่ของเว็บไซต์ของตัวเองไว้ในช่วงต้นของการพัก ซึ่งเป็นช่วงที่คำตัดสินพิสูจน์ได้น้อยที่สุด เพื่อไม่ให้การพักแบ่ง IP ขาออกของเว็บไซต์ เว็บไซต์ใหม่ยังคงหลีกเลี่ยงทางออกนั้น ปิดเพื่อกระจายการเชื่อมต่อ"
  uk: "Вихід на карантині зберігає нові з’єднання своїх сайтів на початку перебування на лаві, коли вердикт найменш доведений, щоб лава не розділяла вихідну IP сайту. Нові сайти й далі його уникають. Вимкнення розсіює їх"
  vi: "Một điểm thoát bị cách ly vẫn giữ các kết nối mới của chính các trang web của nó trong giai đoạn đầu dự bị, khi phán quyết còn ít bằng chứng nhất, để việc dự bị không chia tách IP ra ngoài của trang. Các trang mới vẫn tránh nó. Tắt sẽ phân tán chúng"
  zh: "被隔离的出口在隔离初期（此时判定最不可靠）仍会承接其自身站点的新连接，以免隔离导致站点的出口 IP 分散。新站点仍会避开它。关闭时将这些连接分散出去"
  zh-HK: "被隔離的出口在隔離初期（此時判定最不可靠）仍會承接其自身網站的新連線，以免隔離令網站的出口 IP 分散。新網站仍會避開它。關閉時將這些連線分散出去"
