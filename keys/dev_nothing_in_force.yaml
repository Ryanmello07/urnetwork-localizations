description: "Developer page: note shown when no reliability override is in force."
source: "No reliability override is in force, so the settings sections are hidden rather than shown at zero. The measurements and exit readout below are live."
platforms:
  - linux
localizations:
  ar: "لا يوجد تجاوز موثوقية ساري المفعول، لذا تُخفى أقسام الإعدادات بدل عرضها بقيمة صفر. القياسات وقراءة المخارج أدناه حيّة."
  cs: "Neplatí žádné přepsání spolehlivosti, takže sekce nastavení jsou skryté místo toho, aby ukazovaly nuly. Měření a přehled výstupů níže jsou živé."
  de: "Kein Zuverlässigkeits-Override ist aktiv, daher sind die Einstellungsbereiche ausgeblendet statt mit null angezeigt. Die Messwerte und die Exit-Anzeige unten sind live."
  el: "Δεν ισχύει καμία παράκαμψη αξιοπιστίας, γι’ αυτό οι ενότητες ρυθμίσεων είναι κρυφές αντί να εμφανίζονται στο μηδέν. Οι μετρήσεις και η εικόνα των εξόδων παρακάτω είναι ζωντανές."
  en: "No reliability override is in force, so the settings sections are hidden rather than shown at zero. The measurements and exit readout below are live."
  es: "No hay ninguna anulación de fiabilidad activa, así que las secciones de ajustes se ocultan en lugar de mostrarse a cero. Las mediciones y la lectura de salidas de abajo están en directo."
  es-419: "No hay ninguna anulación de fiabilidad activa, así que las secciones de configuración se ocultan en lugar de mostrarse en cero. Las mediciones y la lectura de salidas de abajo están en vivo."
  es-MX: "No hay ninguna anulación de fiabilidad activa, así que las secciones de configuración se ocultan en lugar de mostrarse en cero. Las mediciones y la lectura de salidas de abajo están en vivo."
  fr: "Aucun remplacement de fiabilité n’est en vigueur : les sections de réglages sont donc masquées plutôt qu’affichées à zéro. Les mesures et l’état des sorties ci-dessous sont en direct."
  he: "אין עקיפת אמינות בתוקף, ולכן מקטעי ההגדרות מוסתרים במקום להופיע עם אפס. המדידות ותצוגת היציאות למטה מתעדכנות בזמן אמת."
  hi: "कोई विश्वसनीयता ओवरराइड लागू नहीं है, इसलिए सेटिंग सेक्शन शून्य पर दिखाने के बजाय छिपे हैं। नीचे के माप और एग्ज़िट रीडआउट लाइव हैं।"
  id: "Tidak ada penggantian keandalan yang berlaku, jadi bagian pengaturan disembunyikan alih-alih ditampilkan nol. Pengukuran dan tampilan exit di bawah bersifat langsung."
  it: "Nessun override di affidabilità è attivo, quindi le sezioni delle impostazioni sono nascoste invece di mostrare zero. Le misure e la lettura delle uscite qui sotto sono in tempo reale."
  ja: "信頼性のオーバーライドが有効になっていないため、設定のセクションは 0 で表示せずに非表示にしています。下の測定値と出口の表示はリアルタイムです。"
  ko: "적용 중인 신뢰도 재정의가 없어 설정 섹션을 0으로 표시하지 않고 숨겼습니다. 아래 측정값과 출구 현황은 실시간입니다."
  nl: "Er is geen betrouwbaarheids-override actief, dus de instellingssecties zijn verborgen in plaats van op nul getoond. De metingen en de exitweergave hieronder zijn live."
  pl: "Nie obowiązuje żadne nadpisanie niezawodności, więc sekcje ustawień są ukryte zamiast pokazywać zera. Pomiary i odczyt wyjść poniżej są na żywo."
  pt: "Não há nenhuma substituição de fiabilidade em vigor, por isso as secções de definições estão ocultas em vez de mostradas a zero. As medições e a leitura das saídas abaixo são em direto."
  pt-BR: "Nenhuma substituição de confiabilidade está ativa, então as seções de configurações ficam ocultas em vez de aparecer zeradas. As medições e a leitura das saídas abaixo são ao vivo."
  pt-PT: "Não há nenhuma substituição de fiabilidade em vigor, por isso as secções de definições estão ocultas em vez de mostradas a zero. As medições e a leitura das saídas abaixo são em direto."
  ru: "Переопределение надёжности не действует, поэтому разделы настроек скрыты, а не показаны с нулями. Измерения и сводка по выходам ниже обновляются в реальном времени."
  sv: "Ingen åsidosättning av tillförlitlighet är aktiv, så inställningsavsnitten döljs i stället för att visas med noll. Mätningarna och utgångsvisningen nedan är live."
  sw: "Hakuna ubatilishaji wa uaminifu unaotumika, kwa hiyo sehemu za mipangilio zimefichwa badala ya kuonyeshwa kwa sifuri. Vipimo na usomaji wa njia za kutoka hapa chini ni hai."
  th: "ไม่มีการแทนที่ความน่าเชื่อถือที่มีผลอยู่ ส่วนการตั้งค่าจึงถูกซ่อนแทนที่จะแสดงเป็นศูนย์ การวัดผลและข้อมูลทางออกด้านล่างเป็นข้อมูลสด"
  uk: "Перевизначення надійності не діє, тому розділи налаштувань приховано, а не показано з нулями. Вимірювання та зведення виходів нижче оновлюються в реальному часі."
  vi: "Không có ghi đè độ tin cậy nào đang có hiệu lực, nên các phần cài đặt bị ẩn thay vì hiển thị bằng 0. Số đo và phần hiển thị điểm thoát bên dưới là trực tiếp."
  zh: "当前没有生效的可靠性覆盖，因此设置部分会被隐藏，而不是显示为零。下方的测量数据和出口读数是实时的。"
  zh-HK: "目前沒有生效的可靠性覆寫，因此設定部分會隱藏，而不是顯示為零。下方的量度和出口讀數是即時的。"
