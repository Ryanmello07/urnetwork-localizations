description: "Developer tools screen (reliability surface): measure none control label."
source: "No provider failures yet. Stall an exit below to cause one."
platforms:
  - android
localizations:
  ar: "لا توجد أعطال في المزودين بعد. أوقف مخرجًا أدناه لإحداث عطل."
  cs: "Zatím žádná selhání poskytovatelů. Jedno vyvoláte zaseknutím výstupu níže."
  de: "Noch keine Anbieterausfälle. Lass unten einen Exit hängen, um einen auszulösen."
  el: "Δεν υπάρχουν ακόμη αστοχίες παρόχων. Κολλήστε μια έξοδο παρακάτω για να προκαλέσετε μία."
  en: "No provider failures yet. Stall an exit below to cause one."
  es: "Aún no hay fallos de proveedores. Bloquea una salida abajo para provocar uno."
  es-419: "Todavía no hay fallas de proveedores. Traba una salida abajo para provocar una."
  es-MX: "Todavía no hay fallas de proveedores. Traba una salida abajo para provocar una."
  fr: "Aucune panne de fournisseur pour l’instant. Figez une sortie ci-dessous pour en provoquer une."
  he: "עדיין אין כשלי ספקים. תקעו יציאה למטה כדי לגרום לכשל."
  hi: "अभी तक कोई प्रदाता विफलता नहीं। एक विफलता पैदा करने के लिए नीचे किसी एग्ज़िट को अटकाएँ।"
  id: "Belum ada kegagalan penyedia. Buat sebuah exit macet di bawah untuk memicu satu."
  it: "Ancora nessun guasto dei provider. Blocca un’uscita qui sotto per provocarne uno."
  ja: "プロバイダー障害はまだありません。下の出口を停止させると障害を発生させられます。"
  ko: "아직 제공자 장애가 없습니다. 아래에서 출구를 멈추게 해 장애를 일으켜 보세요."
  nl: "Nog geen providerstoringen. Laat hieronder een exit vastlopen om er een te veroorzaken."
  pl: "Jeszcze nie ma awarii dostawców. Zablokuj wyjście poniżej, aby ją wywołać."
  pt: "Ainda não há falhas de fornecedores. Bloqueie uma saída abaixo para provocar uma."
  pt-BR: "Ainda não há falhas de provedor. Trave uma saída abaixo para causar uma."
  pt-PT: "Ainda não há falhas de fornecedores. Bloqueie uma saída abaixo para provocar uma."
  ru: "Сбоев провайдеров пока нет. Заморозьте выход ниже, чтобы вызвать сбой."
  sv: "Inga leverantörsfel än. Lås en utgång nedan för att orsaka ett."
  sw: "Bado hakuna hitilafu za watoa huduma. Kwamisha njia ya kutoka hapa chini ili kusababisha moja."
  th: "ยังไม่มีความล้มเหลวของผู้ให้บริการ ทำให้ทางออกด้านล่างค้างเพื่อสร้างความล้มเหลวขึ้นมาหนึ่งครั้ง"
  uk: "Збоїв провайдерів поки немає. Заблокуйте вихід нижче, щоб спричинити збій."
  vi: "Chưa có sự cố nhà cung cấp nào. Làm kẹt một điểm thoát bên dưới để gây ra một sự cố."
  zh: "暂无提供商故障。在下方让某个出口停滞即可制造一次。"
  zh-HK: "暫時未有供應商故障。在下方讓某個出口停滯即可製造一次。"
