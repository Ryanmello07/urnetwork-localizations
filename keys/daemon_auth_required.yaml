description: "Connect error: administrator permission is needed from this session."
source: "Connecting from this session needs administrator permission. Press Connect again to be asked, or use the session at this device's screen."
platforms:
  - linux
localizations:
  ar: "الاتصال من هذه الجلسة يتطلب إذن المسؤول. اضغط اتصال مجددًا ليُطلب منك، أو استخدم الجلسة على شاشة هذا الجهاز."
  cs: "Připojení z této relace vyžaduje oprávnění správce. Stiskněte znovu Připojit, abyste byli dotázáni, nebo použijte relaci na obrazovce tohoto zařízení."
  de: "Zum Verbinden aus dieser Sitzung ist eine Administratorberechtigung nötig. Drücke erneut auf Verbinden, um gefragt zu werden, oder nutze die Sitzung am Bildschirm dieses Geräts."
  el: "Η σύνδεση από αυτήν τη συνεδρία χρειάζεται άδεια διαχειριστή. Πατήστε ξανά Σύνδεση για να ερωτηθείτε, ή χρησιμοποιήστε τη συνεδρία στην οθόνη αυτής της συσκευής."
  en: "Connecting from this session needs administrator permission. Press Connect again to be asked, or use the session at this device's screen."
  es: "Conectarse desde esta sesión necesita permiso de administrador. Pulsa Conectar de nuevo para que se te pida, o usa la sesión en la pantalla de este dispositivo."
  es-419: "Conectarse desde esta sesión requiere permiso de administrador. Presiona Conectar de nuevo para que se te pida, o usa la sesión en la pantalla de este dispositivo."
  es-MX: "Conectarse desde esta sesión necesita permiso de administrador. Pulsa Conectar de nuevo para que se te pida, o usa la sesión en la pantalla de este dispositivo."
  fr: "Se connecter depuis cette session nécessite une autorisation d’administrateur. Appuyez de nouveau sur Connecter pour qu’elle vous soit demandée, ou utilisez la session à l’écran de cet appareil."
  he: "התחברות מההפעלה הזו דורשת הרשאת מנהל. לחצו שוב על התחבר כדי להישאל, או השתמשו בהפעלה שעל מסך המכשיר הזה."
  hi: "इस सत्र से कनेक्ट करने के लिए व्यवस्थापक अनुमति चाहिए। पूछे जाने के लिए फिर से कनेक्ट दबाएँ, या इस डिवाइस की स्क्रीन वाले सत्र का उपयोग करें।"
  id: "Menghubungkan dari sesi ini memerlukan izin administrator. Tekan Hubungkan lagi untuk ditanya, atau gunakan sesi di layar perangkat ini."
  it: "Connettersi da questa sessione richiede il permesso dell’amministratore. Premi di nuovo Connetti per ricevere la richiesta, oppure usa la sessione sullo schermo di questo dispositivo."
  ja: "このセッションから接続するには管理者の許可が必要です。もう一度「接続」を押して確認を受けるか、このデバイスの画面のセッションを使用してください。"
  ko: "이 세션에서 연결하려면 관리자 권한이 필요합니다. 연결을 다시 눌러 요청을 받거나, 이 기기 화면의 세션을 사용하세요."
  nl: "Verbinden vanuit deze sessie vereist beheerdersrechten. Druk opnieuw op Verbinden om het te vragen, of gebruik de sessie op het scherm van dit apparaat."
  pl: "Łączenie z tej sesji wymaga uprawnień administratora. Naciśnij Połącz ponownie, aby zostać zapytanym, lub użyj sesji na ekranie tego urządzenia."
  pt: "Conectar a partir desta sessão precisa de permissão de administrador. Toque em Conectar de novo para ser perguntado, ou use a sessão na tela deste dispositivo."
  pt-BR: "Conectar a partir desta sessão precisa de permissão de administrador. Toque em Conectar de novo para ser perguntado, ou use a sessão na tela deste dispositivo."
  pt-PT: "Ligar a partir desta sessão precisa de permissão de administrador. Prima Ligar novamente para lhe ser pedida, ou use a sessão no ecrã deste dispositivo."
  ru: "Для подключения из этой сессии нужно разрешение администратора. Нажмите «Подключить» ещё раз, чтобы получить запрос, или используйте сессию на экране этого устройства."
  sv: "Att ansluta från den här sessionen kräver administratörsbehörighet. Tryck på Anslut igen för att bli tillfrågad, eller använd sessionen på den här enhetens skärm."
  sw: "Kuunganisha kutoka kipindi hiki kunahitaji ruhusa ya msimamizi. Bonyeza Unganisha tena ili uulizwe, au tumia kipindi kilicho kwenye skrini ya kifaa hiki."
  th: "การเชื่อมต่อจากเซสชันนี้ต้องได้รับอนุญาตจากผู้ดูแลระบบ กดเชื่อมต่ออีกครั้งเพื่อให้ระบบถาม หรือใช้เซสชันที่หน้าจอของอุปกรณ์นี้"
  uk: "Для підключення з цієї сесії потрібен дозвіл адміністратора. Натисніть «Підключитися» ще раз, щоб отримати запит, або скористайтеся сесією на екрані цього пристрою."
  vi: "Kết nối từ phiên này cần quyền quản trị viên. Nhấn Kết nối lần nữa để được hỏi, hoặc dùng phiên tại màn hình của thiết bị này."
  zh: "从此会话连接需要管理员权限。再次按下连接以获取提示，或使用此设备屏幕上的会话。"
  zh-HK: "從此工作階段連線需要管理員權限。再次按下連接以取得提示，或使用此裝置螢幕上的工作階段。"
