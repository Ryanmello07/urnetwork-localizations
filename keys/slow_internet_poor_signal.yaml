description: "Label in the small pill at the top right of the connect screen on iPhone, iPad, Mac, Android, Windows and Linux, shown while the user's own internet connection is slow or congested: URnetwork measured a long upload or download delay. It sits in amber beside a small tunnel icon and the delay numbers (for example ↑ 800 ms ↓ 1.9 s). It describes the user's network, Wi-Fi, cellular or wired alike, not a URnetwork fault. Use your language's usual short phrase for a poor connection signal, one or two words: the pill has very little room."
