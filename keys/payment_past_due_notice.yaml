description: "In-app notice while the renewal payment of a UR Pro subscription has failed (a declined card, for example) and the store is still retrying it. If no payment goes through before the retries end, the subscription is cancelled. Keep UR Pro and Pro (the plan's name) unchanged. Didn't go through = failed."
source: "Your UR Pro payment didn't go through. Update your payment method to keep Pro."
platforms:
  - android
  - apple
  - linux
localizations:
  ar: "لم تنجح عملية الدفع لاشتراك UR Pro. حدّث طريقة الدفع للاحتفاظ بـ Pro."
  cs: "Platba za UR Pro neproběhla. Aktualizujte způsob platby, abyste si Pro ponechali."
  de: "Deine Zahlung für UR Pro ist fehlgeschlagen. Aktualisiere deine Zahlungsmethode, um Pro zu behalten."
  el: "Η πληρωμή για το UR Pro δεν ολοκληρώθηκε. Ενημερώστε τον τρόπο πληρωμής σας για να διατηρήσετε το Pro."
  en: "Your UR Pro payment didn't go through. Update your payment method to keep Pro."
  es: "Tu pago de UR Pro no se ha completado. Actualiza tu método de pago para mantener Pro."
  es-419: "Tu pago de UR Pro no se completó. Actualiza tu método de pago para conservar Pro."
  es-MX: "Tu pago de UR Pro no se completó. Actualiza tu método de pago para conservar Pro."
  fr: "Votre paiement pour UR Pro n’a pas abouti. Mettez à jour votre moyen de paiement pour conserver Pro."
  he: "התשלום על UR Pro לא עבר. עדכנו את אמצעי התשלום כדי לשמור על Pro."
  hi: "आपका UR Pro भुगतान पूरा नहीं हो सका। Pro बनाए रखने के लिए अपना भुगतान का तरीका अपडेट करें।"
  id: "Pembayaran UR Pro Anda tidak berhasil. Perbarui metode pembayaran Anda agar tetap menggunakan Pro."
  it: "Il pagamento di UR Pro non è andato a buon fine. Aggiorna il metodo di pagamento per mantenere Pro."
  ja: "UR Pro のお支払いが完了しませんでした。Pro を継続するには、お支払い方法を更新してください。"
  ko: "UR Pro 결제가 처리되지 않았습니다. Pro를 계속 이용하려면 결제 수단을 업데이트하세요."
  nl: "Je betaling voor UR Pro is niet gelukt. Werk je betaalmethode bij om Pro te houden."
  pl: "Płatność za UR Pro nie powiodła się. Zaktualizuj metodę płatności, aby zachować Pro."
  pt: "O pagamento do UR Pro não foi concluído. Atualize o seu método de pagamento para manter o Pro."
  pt-BR: "O pagamento do UR Pro não foi concluído. Atualize sua forma de pagamento para continuar com o Pro."
  pt-PT: "O pagamento do UR Pro não foi concluído. Atualize o seu método de pagamento para manter o Pro."
  ru: "Платёж за UR Pro не прошёл. Обновите способ оплаты, чтобы сохранить Pro."
  sv: "Din betalning för UR Pro gick inte igenom. Uppdatera din betalningsmetod för att behålla Pro."
  sw: "Malipo yako ya UR Pro hayakufanikiwa. Sasisha njia yako ya malipo ili kuendelea na Pro."
  th: "การชำระเงินสำหรับ UR Pro ของคุณไม่สำเร็จ อัปเดตวิธีการชำระเงินเพื่อใช้ Pro ต่อ"
  uk: "Платіж за UR Pro не пройшов. Оновіть спосіб оплати, щоб зберегти Pro."
