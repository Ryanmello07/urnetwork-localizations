description: "Detail under the bound status."
source: "Emission is paid to your coldkey directly. Bindings renew per epoch."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "تُدفع مكافآت الإصدار مباشرةً إلى coldkey الخاص بك. تتجدد عمليات الربط في كل فترة."
  cs: "Emise se vyplácí přímo na váš coldkey. Vazby se obnovují každou epochu."
  de: "Die Emission wird direkt an deinen Coldkey ausgezahlt. Bindungen werden pro Epoche erneuert."
  el: "Η έκδοση καταβάλλεται απευθείας στο coldkey σας. Οι δεσμεύσεις ανανεώνονται σε κάθε εποχή."
  en: "Emission is paid to your coldkey directly. Bindings renew per epoch."
  es: "La emisión se paga directamente a tu coldkey. Las vinculaciones se renuevan en cada época."
  es-419: "La emisión se paga directamente a tu coldkey. Las vinculaciones se renuevan en cada época."
  es-MX: "La emisión se paga directamente a tu coldkey. Las vinculaciones se renuevan en cada época."
  fr: "L’émission est versée directement sur votre coldkey. Les liaisons se renouvellent à chaque époque."
  he: "ההנפקה משולמת ישירות ל-coldkey שלכם. הקישורים מתחדשים בכל תקופה."
  hi: "एमिशन का भुगतान सीधे आपकी coldkey पर होता है। बाइंडिंग हर एपोक में नवीनीकृत होती हैं।"
  id: "Emisi dibayarkan langsung ke coldkey Anda. Pengikatan diperbarui setiap epoch."
  it: "L’emissione viene pagata direttamente sulla tua coldkey. I vincoli si rinnovano a ogni epoca."
  ja: "エミッションは coldkey に直接支払われます。バインドはエポックごとに更新されます。"
  ko: "에미션은 coldkey로 직접 지급됩니다. 바인딩은 에포크마다 갱신됩니다."
  nl: "De emissie wordt rechtstreeks naar je coldkey uitbetaald. Koppelingen worden elke epoch verlengd."
  pl: "Emisja trafia bezpośrednio na twój coldkey. Powiązania odnawiają się w każdej epoce."
  pt: "A emissão é paga diretamente na sua coldkey. As associações renovam-se em cada época."
  pt-BR: "A emissão é paga diretamente na sua coldkey. Os vínculos são renovados a cada época."
  pt-PT: "A emissão é paga diretamente na sua coldkey. As associações renovam-se em cada época."
  ru: "Эмиссия выплачивается напрямую на ваш coldkey. Привязки обновляются каждую эпоху."
  sv: "Emissionen betalas direkt till din coldkey. Bindningar förnyas varje epok."
  sw: "Utoaji hulipwa moja kwa moja kwenye coldkey yako. Ufungaji husasishwa kila kipindi."
  th: "การปล่อยเหรียญจ่ายตรงเข้า coldkey ของคุณ การผูกจะต่ออายุทุกอีพอค"
  uk: "Емісія виплачується безпосередньо на ваш coldkey. Прив’язки оновлюються кожної епохи."
  vi: "Phần phát hành được trả trực tiếp vào coldkey của bạn. Các liên kết được gia hạn mỗi epoch."
  zh: "释放的奖励将直接支付到您的 coldkey。绑定每个周期续期一次。"
  zh-HK: "發放的獎勵會直接支付到你的 coldkey。綁定每個週期續期一次。"
