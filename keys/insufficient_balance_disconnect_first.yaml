description: "Out-of-balance alert, on the desktop builds whose checkout has to go through the tunnel (Windows, Linux), while the tunnel holds or blocks traffic. Their Disconnect lifts the kill switch too; apple and android say more (insufficient_balance_disconnect_first_kill_switch). Payment cannot reach the store until the user disconnects, and nothing disconnects for them; Disconnect is the button beside this line. Each translation names that button by its own label (the disconnect key)."
source: "To upgrade, press Disconnect first. Payment can't get through until you do."
platforms:
  - apple
  - linux
  - windows
deprecated:
  - apple
localizations:
  ar: "للترقية، اختر «قطع الاتصال» أولًا. لا يمكن إتمام الدفع قبل ذلك."
  cs: "Pro přechod na vyšší tarif nejprve zvolte „Odpojení“. Do té doby platba neprojde."
  de: "Wähle zum Upgraden zuerst „Trennen“. Vorher kommt die Zahlung nicht durch."
  el: "Για να αναβαθμίσετε, επιλέξτε πρώτα «Αποσύνδεση». Μέχρι τότε η πληρωμή δεν μπορεί να ολοκληρωθεί."
  en: "To upgrade, press Disconnect first. Payment can't get through until you do."
  es: "Para mejorar tu plan, elige primero «Desconectar». Hasta entonces, el pago no podrá completarse."
  es-419: "Para mejorar tu plan, elige primero \"Desconectar\". Hasta entonces, el pago no podrá completarse."
  es-MX: "Para mejorar tu plan, elige primero \"Desconectar\". Hasta entonces, el pago no podrá completarse."
  fr: "Pour passer à une offre supérieure, choisissez d’abord « Déconnecter ». Le paiement ne peut pas aboutir avant cela."
  he: "כדי לשדרג, בחר קודם \"התנתק\". עד אז התשלום לא יוכל לעבור."
  hi: "अपग्रेड करने के लिए पहले \"डिस्कनेक्ट करें\" चुनें। तब तक भुगतान पूरा नहीं हो पाएगा।"
  id: "Untuk meningkatkan paket, pilih “Putuskan” terlebih dahulu. Pembayaran tidak dapat diproses sebelum itu."
  it: "Per effettuare l’upgrade, scegli prima «Disconnetti». Fino ad allora il pagamento non può andare a buon fine."
  ja: "アップグレードするには、先に「切断する」を選択してください。それまでは支払いを完了できません。"
  ko: "업그레이드하려면 먼저 '연결 해제'를 선택하세요. 그 전에는 결제를 완료할 수 없습니다."
  nl: "Kies eerst ‘Verbinding verbreken’ om te upgraden. Tot die tijd kan de betaling niet doorgaan."
  pl: "Aby przejść na wyższy plan, najpierw wybierz „Rozłącz”. Do tego czasu płatność nie przejdzie."
  pt: "Para fazer upgrade, escolha primeiro \"Desconectar\". Até lá, o pagamento não será concluído."
  pt-BR: "Para fazer upgrade, escolha primeiro \"Desconectar\". Até lá, o pagamento não será concluído."
  pt-PT: "Para fazer upgrade, escolha primeiro \"Desligar\". Até lá, o pagamento não será concluído."
  ru: "Чтобы повысить тариф, сначала выберите «Отключить». До этого оплата не пройдёт."
  sv: "Välj först ”Koppla från” för att uppgradera. Innan dess går betalningen inte igenom."
  sw: "Ili kupandisha kiwango, chagua kwanza \"Tenganisha\". Malipo hayawezi kukamilika kabla ya hapo."
  th: "หากต้องการอัปเกรด ให้เลือก “ตัดการเชื่อมต่อ” ก่อน จนกว่าจะถึงตอนนั้น การชำระเงินจะไม่สำเร็จ"
  uk: "Щоб підвищити тариф, спочатку виберіть «Відключитися». Доти оплата не пройде."
  vi: "Để nâng cấp, trước tiên hãy chọn “Ngắt kết nối”. Cho đến lúc đó, thanh toán sẽ không thể hoàn tất."
  zh: "要升级，请先选择“断开连接”。在此之前，付款无法完成。"
  zh-HK: "要升級，請先選擇「斷開連接」。在此之前，付款無法完成。"
