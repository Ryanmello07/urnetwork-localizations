description: "One line description of the whodis pump (DNS pump) transport in the transport settings editor."
source: "Disguised as DNS traffic with a constant reply pump. Lowest bandwidth, highest availability."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "متخفٍّ في هيئة حركة DNS مع ضخ ثابت للردود. أدنى عرض نطاق، وأعلى توافر."
  cs: "Maskováno jako provoz DNS se stálou pumpou odpovědí. Nejnižší šířka pásma, nejvyšší dostupnost."
  de: "Als DNS-Verkehr getarnt, mit konstantem Antwortstrom. Geringste Bandbreite, höchste Verfügbarkeit."
  el: "Μεταμφιεσμένη σε κίνηση DNS με σταθερή άντληση απαντήσεων. Χαμηλότερο εύρος ζώνης, υψηλότερη διαθεσιμότητα."
  en: "Disguised as DNS traffic with a constant reply pump. Lowest bandwidth, highest availability."
  es: "Camuflado como tráfico DNS con un bombeo constante de respuestas. Menor ancho de banda, mayor disponibilidad."
  es-419: "Camuflado como tráfico DNS con un bombeo constante de respuestas. Menor ancho de banda, mayor disponibilidad."
  es-MX: "Camuflado como tráfico DNS con un bombeo constante de respuestas. Menor ancho de banda, mayor disponibilidad."
  fr: "Déguisé en trafic DNS avec une pompe de réponses constante. Bande passante la plus faible, disponibilité la plus élevée."
  he: "מוסווה כתעבורת DNS עם משאבת תשובות קבועה. רוחב הפס הנמוך ביותר, הזמינות הגבוהה ביותר."
  hi: "लगातार जवाब पंप के साथ DNS ट्रैफ़िक के रूप में छिपा हुआ। सबसे कम बैंडविड्थ, सबसे ज़्यादा उपलब्धता।"
  id: "Disamarkan sebagai lalu lintas DNS dengan pompa balasan konstan. Bandwidth terendah, ketersediaan tertinggi."
  it: "Camuffato da traffico DNS con un flusso costante di risposte. Banda minima, disponibilità massima."
  ja: "応答を常に送り続ける DNS トラフィックに偽装します。帯域幅は最も低く、可用性は最も高くなります。"
  ko: "응답을 계속 보내는 DNS 트래픽으로 위장합니다. 대역폭은 가장 낮고 가용성은 가장 높습니다."
  nl: "Vermomd als DNS-verkeer met een constante antwoordpomp. Laagste bandbreedte, hoogste beschikbaarheid."
  pl: "Udaje ruch DNS ze stałą pompą odpowiedzi. Najniższa przepustowość, najwyższa dostępność."
  pt: "Disfarçado de tráfego DNS com uma bomba constante de respostas. Menor largura de banda, maior disponibilidade."
  pt-BR: "Disfarçado de tráfego DNS com um bombeamento constante de respostas. Menor largura de banda, maior disponibilidade."
  pt-PT: "Disfarçado de tráfego DNS com uma bomba constante de respostas. Menor largura de banda, maior disponibilidade."
  ru: "Маскируется под DNS-трафик с постоянной подкачкой ответов. Минимальная пропускная способность, максимальная доступность."
  sv: "Förklädd till DNS-trafik med en konstant svarspump. Lägst bandbredd, högst tillgänglighet."
  sw: "Hujificha kama trafiki ya DNS yenye pampu ya majibu isiyokoma. Kipimo data cha chini zaidi, upatikanaji wa juu zaidi."
  th: "ปลอมตัวเป็นทราฟฟิก DNS พร้อมการปั๊มคำตอบอย่างต่อเนื่อง แบนด์วิดท์ต่ำที่สุด ความพร้อมใช้งานสูงที่สุด"
  uk: "Маскується під трафік DNS зі сталою помпою відповідей. Найнижча пропускна здатність, найвища доступність."
  vi: "Ngụy trang thành lưu lượng DNS với luồng phản hồi liên tục. Băng thông thấp nhất, khả dụng cao nhất."
  zh: "伪装成 DNS 流量，并持续泵送应答。带宽最低，可用性最高。"
  zh-HK: "偽裝成 DNS 流量，並持續泵送回應。頻寬最低，可用性最高。"
