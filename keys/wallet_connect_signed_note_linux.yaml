description: "Note under the manual address entry: the wallet only signs a proof of ownership."
source: "Your wallet signs a message to prove it is yours. Nothing is sent on chain."
platforms:
  - linux
localizations:
  ar: "توقّع محفظتك رسالة لإثبات أنها ملكك. لا يُرسل أي شيء على السلسلة."
  cs: "Vaše peněženka podepíše zprávu, aby prokázala, že je vaše. Na řetězec se nic neodesílá."
  de: "Deine Wallet signiert eine Nachricht, um zu beweisen, dass sie dir gehört. Es wird nichts an die Chain gesendet."
  el: "Το πορτοφόλι σας υπογράφει ένα μήνυμα για να αποδείξει ότι είναι δικό σας. Τίποτα δεν αποστέλλεται στην αλυσίδα."
  en: "Your wallet signs a message to prove it is yours. Nothing is sent on chain."
  es: "Tu billetera firma un mensaje para demostrar que es tuya. No se envía nada a la cadena."
  es-419: "Tu billetera firma un mensaje para demostrar que es tuya. No se envía nada a la cadena."
  es-MX: "Tu cartera firma un mensaje para demostrar que es tuya. No se envía nada a la cadena."
  fr: "Votre portefeuille signe un message pour prouver qu’il vous appartient. Rien n’est envoyé sur la chaîne."
  he: "הארנק שלכם חותם על הודעה כדי להוכיח שהוא שלכם. שום דבר לא נשלח לשרשרת."
  hi: "आपका वॉलेट यह साबित करने के लिए एक संदेश पर साइन करता है कि वह आपका है। चेन पर कुछ नहीं भेजा जाता।"
  id: "Dompet Anda menandatangani pesan untuk membuktikan bahwa dompet itu milik Anda. Tidak ada yang dikirim ke chain."
  it: "Il tuo portafoglio firma un messaggio per dimostrare che è tuo. Non viene inviato nulla sulla catena."
  ja: "ウォレットがメッセージに署名して、あなたのものであることを証明します。チェーンには何も送信されません。"
  ko: "지갑이 메시지에 서명해 내 것임을 증명합니다. 체인에는 아무것도 보내지 않습니다."
  nl: "Je wallet ondertekent een bericht om te bewijzen dat hij van jou is. Er wordt niets on-chain verstuurd."
  pl: "Twój portfel podpisuje wiadomość, aby udowodnić, że należy do ciebie. Nic nie jest wysyłane do łańcucha."
  pt: "A sua carteira assina uma mensagem para provar que é sua. Nada é enviado para a cadeia."
  pt-BR: "Sua carteira assina uma mensagem para provar que é sua. Nada é enviado à cadeia."
  pt-PT: "A sua carteira assina uma mensagem para provar que é sua. Nada é enviado para a cadeia."
  ru: "Ваш кошелек подписывает сообщение, чтобы подтвердить, что он ваш. В блокчейн ничего не отправляется."
  sv: "Din plånbok signerar ett meddelande för att bevisa att den är din. Inget skickas på kedjan."
  sw: "Pochi yako hutia sahihi ujumbe ili kuthibitisha kwamba ni yako. Hakuna kinachotumwa kwenye mnyororo."
  th: "กระเป๋าเงินของคุณลงนามข้อความเพื่อพิสูจน์ว่าเป็นของคุณ ไม่มีการส่งสิ่งใดขึ้นเชน"
  uk: "Ваш гаманець підписує повідомлення, щоб довести, що він ваш. У блокчейн нічого не надсилається."
  vi: "Ví của bạn ký một tin nhắn để chứng minh ví thuộc về bạn. Không có gì được gửi lên chuỗi."
  zh: "您的钱包会签署一条消息以证明其归您所有。不会在链上发送任何内容。"
  zh-HK: "你的錢包會簽署一則訊息以證明它屬於你。不會在鏈上傳送任何內容。"
