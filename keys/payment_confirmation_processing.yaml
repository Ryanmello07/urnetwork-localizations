description: "Body of the post-purchase overlay while the server has not yet confirmed the subscription. Replaces the optimistic 'You're premium.' claim until currentSubscription actually confirms."
source: "We're confirming your payment now. Your plan will update automatically — you don't need to do anything."
platforms:
  - android
localizations:
  ar: "نحن نؤكد دفعتك الآن. سيتم تحديث خطتك تلقائيًا — لا تحتاج إلى فعل أي شيء."
  cs: "Právě potvrzujeme vaši platbu. Váš tarif se aktualizuje automaticky — nemusíte nic dělat."
  de: "Wir bestätigen gerade deine Zahlung. Dein Plan wird automatisch aktualisiert — du musst nichts tun."
  el: "Επιβεβαιώνουμε τώρα την πληρωμή σας. Το πρόγραμμά σας θα ενημερωθεί αυτόματα — δεν χρειάζεται να κάνετε τίποτα."
  en: "We're confirming your payment now. Your plan will update automatically — you don't need to do anything."
  es: "Estamos confirmando tu pago. Tu plan se actualizará automáticamente — no tienes que hacer nada."
  es-419: "Estamos confirmando tu pago. Tu plan se actualizará automáticamente — no tienes que hacer nada."
  es-MX: "Estamos confirmando tu pago. Tu plan se actualizará automáticamente — no tienes que hacer nada."
  fr: "Nous confirmons votre paiement. Votre forfait se mettra à jour automatiquement — vous n’avez rien à faire."
  he: "אנחנו מאשרים עכשיו את התשלום שלכם. התוכנית שלכם תתעדכן אוטומטית — אין צורך לעשות דבר."
  hi: "हम अभी आपके भुगतान की पुष्टि कर रहे हैं। आपका प्लान अपने-आप अपडेट हो जाएगा — आपको कुछ करने की ज़रूरत नहीं है।"
  id: "Kami sedang mengonfirmasi pembayaran Anda. Paket Anda akan diperbarui otomatis — Anda tidak perlu melakukan apa pun."
  it: "Stiamo confermando il tuo pagamento. Il tuo piano si aggiornerà automaticamente — non devi fare nulla."
  ja: "お支払いを確認しています。プランは自動的に更新されます。何もする必要はありません。"
  ko: "지금 결제를 확인하고 있습니다. 요금제가 자동으로 업데이트되니 아무것도 하지 않으셔도 됩니다."
  nl: "We bevestigen nu je betaling. Je abonnement wordt automatisch bijgewerkt — je hoeft niets te doen."
  pl: "Właśnie potwierdzamy twoją płatność. Twój plan zaktualizuje się automatycznie — nie musisz nic robić."
  pt: "Estamos a confirmar o seu pagamento. O seu plano é atualizado automaticamente — não precisa de fazer nada."
  pt-BR: "Estamos confirmando seu pagamento agora. Seu plano será atualizado automaticamente — você não precisa fazer nada."
  pt-PT: "Estamos a confirmar o seu pagamento. O seu plano é atualizado automaticamente — não precisa de fazer nada."
  ru: "Мы подтверждаем ваш платёж. Ваш тариф обновится автоматически — ничего делать не нужно."
  sv: "Vi bekräftar din betalning nu. Ditt abonnemang uppdateras automatiskt — du behöver inte göra något."
  sw: "Tunathibitisha malipo yako sasa. Mpango wako utasasishwa kiotomatiki — huhitaji kufanya chochote."
  th: "เรากำลังยืนยันการชำระเงินของคุณ แพ็กเกจของคุณจะอัปเดตโดยอัตโนมัติ — คุณไม่ต้องทำอะไร"
  uk: "Ми зараз підтверджуємо ваш платіж. Ваш план оновиться автоматично — вам нічого не потрібно робити."
  vi: "Chúng tôi đang xác nhận thanh toán của bạn. Gói của bạn sẽ tự động cập nhật — bạn không cần làm gì cả."
  zh: "我们正在确认您的付款。您的方案会自动更新，您无需进行任何操作。"
  zh-HK: "我們正在確認你的付款。你的計劃會自動更新，你無需進行任何操作。"
