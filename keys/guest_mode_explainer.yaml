description: "Guest-mode sheet explainer: what guest mode is and that a full account can come later."
source: "Try URnetwork without creating an account. You can upgrade to a full account at any time."
platforms:
  - windows
deprecated:
  - windows
localizations:
  ar: "جرب URnetwork دون إنشاء حساب. يمكنك الترقية إلى حساب كامل في أي وقت."
  cs: "Vyzkoušejte URnetwork bez vytváření účtu. Na plný účet můžete přejít kdykoli."
  de: "Probiere URnetwork aus, ohne ein Konto zu erstellen. Du kannst jederzeit auf ein vollständiges Konto upgraden."
  el: "Δοκιμάστε το URnetwork χωρίς να δημιουργήσετε λογαριασμό. Μπορείτε να αναβαθμίσετε σε πλήρη λογαριασμό ανά πάσα στιγμή."
  en: "Try URnetwork without creating an account. You can upgrade to a full account at any time."
  es: "Prueba URnetwork sin crear una cuenta. Puedes pasar a una cuenta completa en cualquier momento."
  es-419: "Prueba URnetwork sin crear una cuenta. Puedes pasar a una cuenta completa en cualquier momento."
  es-MX: "Prueba URnetwork sin crear una cuenta. Puedes pasar a una cuenta completa en cualquier momento."
  fr: "Essayez URnetwork sans créer de compte. Vous pouvez passer à un compte complet à tout moment."
  he: "נסו את URnetwork בלי ליצור חשבון. תוכלו לשדרג לחשבון מלא בכל עת."
  hi: "बिना खाता बनाए URnetwork आज़माएँ। आप किसी भी समय पूर्ण खाते में अपग्रेड कर सकते हैं।"
  id: "Coba URnetwork tanpa membuat akun. Anda dapat meningkatkan ke akun penuh kapan saja."
  it: "Prova URnetwork senza creare un account. Puoi passare a un account completo in qualsiasi momento."
  ja: "アカウントを作成せずにURnetworkをお試しください。いつでもフルアカウントにアップグレードできます。"
  ko: "계정을 만들지 않고 URnetwork를 사용해 보세요. 언제든지 정식 계정으로 업그레이드할 수 있습니다."
  nl: "Probeer URnetwork zonder een account aan te maken. Je kunt op elk moment upgraden naar een volledig account."
  pl: "Wypróbuj URnetwork bez zakładania konta. W każdej chwili możesz przejść na pełne konto."
  pt: "Experimente a URnetwork sem criar uma conta. Pode fazer o upgrade para uma conta completa a qualquer momento."
  pt-BR: "Experimente a URnetwork sem criar uma conta. Você pode fazer upgrade para uma conta completa a qualquer momento."
  pt-PT: "Experimente a URnetwork sem criar uma conta. Pode fazer o upgrade para uma conta completa a qualquer momento."
  ru: "Попробуйте URnetwork без создания аккаунта. Вы можете перейти на полный аккаунт в любое время."
  sv: "Prova URnetwork utan att skapa ett konto. Du kan uppgradera till ett fullständigt konto när som helst."
  sw: "Jaribu URnetwork bila kufungua akaunti. Unaweza kupandisha hadhi hadi akaunti kamili wakati wowote."
  th: "ลองใช้ URnetwork โดยไม่ต้องสร้างบัญชี คุณสามารถอัปเกรดเป็นบัญชีเต็มรูปแบบได้ทุกเมื่อ"
  uk: "Спробуйте URnetwork без створення облікового запису. Ви можете перейти на повний обліковий запис у будь-який час."
  vi: "Dùng thử URnetwork mà không cần tạo tài khoản. Bạn có thể nâng cấp lên tài khoản đầy đủ bất cứ lúc nào."
  zh: "无需创建账户即可试用 URnetwork。您可以随时升级为完整账户。"
  zh-HK: "無需建立帳戶即可試用 URnetwork。您可以隨時升級為完整帳戶。"
