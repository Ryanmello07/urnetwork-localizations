description: "Compact relative-time label with an abbreviated minutes unit (\"7m ago\"), shown by the windows and linux stats formatters for events 1-59 minutes old. The argument is the elapsed minutes. Not a plural: the abbreviated unit does not inflect, but the word order and the unit abbreviation localize."
source: "{count}m ago"
platforms:
  - windows
  - linux
  - site
placeholders:
  - name: count
    type: int
