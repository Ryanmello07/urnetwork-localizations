description: "Developer tools screen: explanatory subtext under the 'probe sample hosts' control."
source: "How many health sites one qualification pass dials through an exit. 0 probes the entire embedded list; a smaller number rotates through it in blocks"
platforms:
  - android
  - linux
  - apple
localizations:
  ar: "عدد مواقع فحص السلامة التي تتصل بها جولة تأهيل واحدة عبر مخرج. القيمة 0 تفحص القائمة المضمّنة بأكملها؛ والعدد الأصغر يمر عليها على دفعات"
  cs: "Kolik kontrolních webů jeden kvalifikační průchod osloví přes výstup. 0 otestuje celý vestavěný seznam; menší číslo jím prochází po blocích"
  de: "Wie viele Health-Websites ein Qualifizierungsdurchlauf über einen Exit anwählt. 0 prüft die gesamte eingebettete Liste; eine kleinere Zahl arbeitet sie blockweise ab"
  el: "Πόσους ιστότοπους ελέγχου καλεί ένας γύρος πιστοποίησης μέσω μιας εξόδου. Το 0 ελέγχει ολόκληρη την ενσωματωμένη λίστα· μικρότερος αριθμός τη διατρέχει σε μπλοκ"
  en: "How many health sites one qualification pass dials through an exit. 0 probes the entire embedded list; a smaller number rotates through it in blocks"
  es: "Cuántos sitios de comprobación contacta una pasada de calificación a través de una salida. 0 sondea toda la lista integrada; un número menor la recorre por bloques"
  es-419: "Cuántos sitios de verificación contacta una pasada de calificación a través de una salida. 0 sondea toda la lista integrada; un número menor la recorre por bloques"
  es-MX: "Cuántos sitios de verificación contacta una pasada de calificación a través de una salida. 0 sondea toda la lista integrada; un número menor la recorre por bloques"
  fr: "Combien de sites de contrôle une passe de qualification joint à travers une sortie. 0 sonde toute la liste intégrée ; un nombre plus petit la parcourt par blocs"
  he: "לכמה אתרי בדיקה סבב הכשרה אחד מחייג דרך יציאה. 0 בודק את כל הרשימה המובנית; מספר קטן יותר עובר עליה בבלוקים"
  hi: "एक योग्यता पास किसी एग्ज़िट के ज़रिए कितनी हेल्थ साइटों को डायल करता है। 0 पूरी अंतर्निहित सूची जाँचता है; छोटी संख्या उसे ब्लॉकों में घुमाती है"
  id: "Berapa banyak situs pemeriksaan yang dihubungi satu putaran kualifikasi melalui sebuah exit. 0 menguji seluruh daftar bawaan; angka yang lebih kecil menelusurinya per blok"
  it: "Quanti siti di controllo contatta un passaggio di qualifica attraverso un’uscita. 0 sonda l’intero elenco integrato; un numero più piccolo lo scorre a blocchi"
  ja: "1 回の検証で出口経由で接続するヘルスチェック用サイトの数。0 は組み込みリスト全体を確認し、小さい数ではリストをブロックごとに巡回します"
  ko: "검증 1회차에 출구를 통해 연결하는 상태 확인용 사이트 수입니다. 0이면 내장 목록 전체를 점검하고, 더 작은 수는 목록을 블록 단위로 돌아가며 사용합니다"
  nl: "Hoeveel controlesites één kwalificatieronde via een exit belt. 0 test de hele ingebouwde lijst; een kleiner aantal loopt er in blokken doorheen"
  pl: "Z iloma witrynami kontrolnymi jeden przebieg kwalifikacji łączy się przez wyjście. 0 sprawdza całą wbudowaną listę; mniejsza liczba przechodzi przez nią blokami"
  pt: "Quantos sites de verificação uma ronda de qualificação contacta através de uma saída. 0 sonda toda a lista integrada; um número menor percorre-a por blocos"
  pt-BR: "Quantos sites de verificação uma rodada de qualificação contata por uma saída. 0 sonda a lista integrada inteira; um número menor a percorre em blocos"
  pt-PT: "Quantos sites de verificação uma ronda de qualificação contacta através de uma saída. 0 sonda toda a lista integrada; um número menor percorre-a por blocos"
  ru: "Сколько проверочных сайтов один проход квалификации вызывает через выход. 0 — проверять весь встроенный список; меньшее число перебирает его блоками"
  sv: "Hur många kontrollwebbplatser en kvalificeringsomgång ringer upp genom en utgång. 0 testar hela den inbyggda listan; ett mindre antal går igenom den i block"
  sw: "Idadi ya tovuti za ukaguzi ambazo mzunguko mmoja wa uthibitisho hupiga kupitia njia ya kutoka. 0 hupima orodha yote iliyojengewa ndani; idadi ndogo huipitia kwa vipande"
  th: "จำนวนเว็บไซต์ตรวจสุขภาพที่การรับรองหนึ่งรอบเชื่อมต่อผ่านทางออก 0 ทดสอบรายการในตัวทั้งหมด ตัวเลขที่น้อยกว่าจะวนผ่านรายการเป็นช่วงๆ"
  uk: "Скільки контрольних сайтів один кваліфікаційний прохід викликає через вихід. 0 перевіряє весь вбудований список; менше число проходить його блоками"
  vi: "Một lượt kiểm định kết nối tới bao nhiêu trang kiểm tra qua một điểm thoát. 0 thăm dò toàn bộ danh sách tích hợp; số nhỏ hơn sẽ duyệt danh sách theo từng khối"
  zh: "一轮验证通过某个出口拨号访问的健康检查站点数量。0 表示探测整个内置列表；较小的数值则分块轮流探测"
  zh-HK: "一輪驗證透過某個出口撥號連上的健康檢查網站數量。0 表示探測整個內置列表；較小的數值則分批輪流探測"
