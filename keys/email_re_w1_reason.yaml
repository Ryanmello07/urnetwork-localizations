description: "Win-back email W1 closing line."
source: "If something made you cancel, reply and tell me. I read every reply."
platforms:
  - email
localizations:
  en: "If something made you cancel, reply and tell me. I read every reply."
  ar: "إذا كان هناك ما جعلك تلغي، فردّ وأخبرني. أقرأ كل ردّ."
  cs: "Pokud vás něco přimělo zrušit předplatné, odpovězte a napište mi to. Čtu každou odpověď."
  de: "Wenn dich etwas zum Kündigen gebracht hat, antworte und sag es mir. Ich lese jede Antwort."
  el: "Αν κάτι σε έκανε να ακυρώσεις, απάντησε και πες μου. Διαβάζω κάθε απάντηση."
  es: "Si algo te hizo cancelar, responde y cuéntamelo. Leo todas las respuestas."
  es-419: "Si algo te hizo cancelar, responde y cuéntamelo. Leo todas las respuestas."
  es-MX: "Si algo te hizo cancelar, responde y cuéntamelo. Leo todas las respuestas."
  fr: "Si quelque chose t'a fait annuler, réponds et dis-le-moi. Je lis chaque réponse."
  he: "אם משהו גרם לכם לבטל, השיבו וספרו לי. אני קורא כל תשובה."
  hi: "अगर किसी वजह से आपने सदस्यता रद्द की, तो जवाब देकर मुझे बताएं। मैं हर जवाब पढ़ता हूँ।"
  id: "Kalau ada yang membuatmu membatalkan, balas dan ceritakan kepada saya. Saya membaca setiap balasan."
  it: "Se qualcosa ti ha fatto annullare, rispondi e dimmelo. Leggo ogni risposta."
  ja: "何かが理由でキャンセルしたのなら、返信して教えてください。返信はすべて読んでいます。"
  ko: "취소하시게 된 이유가 있다면, 답장으로 알려 주세요. 모든 답장을 읽습니다."
  nl: "Als je om een bepaalde reden hebt opgezegd, antwoord dan en vertel het me. Ik lees elk antwoord."
  pl: "Jeśli coś skłoniło cię do rezygnacji, odpowiedz i napisz mi. Czytam każdą odpowiedź."
  pt: "Se algo fez você cancelar, responda e me conte. Eu leio todas as respostas."
  pt-BR: "Se algo fez você cancelar, responda e me conte. Eu leio todas as respostas."
  pt-PT: "Se alguma coisa fez com que cancelasse, responda e diga-me. Leio todas as respostas."
  ru: "Если что-то заставило вас отменить подписку, ответьте и расскажите мне. Я читаю каждый ответ."
  sv: "Om något fick dig att avsluta, svara och berätta. Jag läser varje svar."
  sw: "Ikiwa kuna kitu kilichokufanya ughairi, jibu na uniambie. Ninasoma kila jibu."
  th: "ถ้ามีอะไรทำให้คุณยกเลิก ตอบกลับมาบอกผมได้เลย ผมอ่านทุกคำตอบ"
  uk: "Якщо щось змусило вас скасувати підписку, дайте відповідь і розкажіть мені. Я читаю кожну відповідь."
  vi: "Nếu có điều gì khiến bạn hủy, hãy trả lời và cho tôi biết. Tôi đọc mọi câu trả lời."
  zh: "如果有什么原因让你取消了订阅，回复告诉我。每一封回复我都会读。"
  zh-HK: "如果有什麼原因令你取消訂閱，回覆告訴我。每一封回覆我都會讀。"
