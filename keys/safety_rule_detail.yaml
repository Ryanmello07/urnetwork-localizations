description: "Explains a split-rule activity row that URnetwork safety rules kept off the network, and how a local split rule can use it outside the VPN."
source: "URnetwork safety rules keep this traffic off the network, for example an encrypted protocol it cannot recognize. A local split rule sends it outside the VPN from your own IP."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "تُبقي قواعد أمان URnetwork حركة المرور هذه خارج الشبكة، مثل بروتوكول مشفّر لا يمكنها التعرف عليه. تُرسلها قاعدة تقسيم محلية خارج VPN من عنوان IP الخاص بك."
  cs: "Bezpečnostní pravidla URnetwork drží tento provoz mimo síť, například šifrovaný protokol, který nedokážou rozpoznat. Místní pravidlo rozdělení ho pošle mimo VPN z vaší vlastní IP."
  de: "Die Sicherheitsregeln von URnetwork halten diesen Datenverkehr aus dem Netzwerk heraus, zum Beispiel ein verschlüsseltes Protokoll, das sie nicht erkennen. Eine lokale Split-Regel sendet ihn außerhalb des VPN über deine eigene IP."
  el: "Οι κανόνες ασφαλείας του URnetwork κρατούν αυτήν την κίνηση εκτός δικτύου, για παράδειγμα ένα κρυπτογραφημένο πρωτόκολλο που δεν μπορούν να αναγνωρίσουν. Ένας τοπικός κανόνας διαχωρισμού τη στέλνει έξω από το VPN από τη δική σας IP."
  en: "URnetwork safety rules keep this traffic off the network, for example an encrypted protocol it cannot recognize. A local split rule sends it outside the VPN from your own IP."
  es: "Las reglas de seguridad de URnetwork mantienen este tráfico fuera de la red, por ejemplo un protocolo cifrado que no pueden reconocer. Una regla de división local lo envía fuera de la VPN desde tu propia IP."
  es-419: "Las reglas de seguridad de URnetwork mantienen este tráfico fuera de la red, por ejemplo un protocolo cifrado que no pueden reconocer. Una regla de división local lo envía fuera de la VPN desde tu propia IP."
  es-MX: "Las reglas de seguridad de URnetwork mantienen este tráfico fuera de la red, por ejemplo un protocolo cifrado que no pueden reconocer. Una regla de división local lo envía fuera de la VPN desde tu propia IP."
  fr: "Les règles de sécurité d’URnetwork tiennent ce trafic hors du réseau, par exemple un protocole chiffré qu’elles ne reconnaissent pas. Une règle de séparation locale l’envoie hors du VPN depuis votre propre IP."
  he: "כללי הבטיחות של URnetwork מרחיקים את התעבורה הזו מהרשת, למשל פרוטוקול מוצפן שהם לא מצליחים לזהות. כלל פיצול מקומי שולח אותה מחוץ ל-VPN מכתובת ה-IP שלכם."
  hi: "URnetwork के सुरक्षा नियम इस ट्रैफ़िक को नेटवर्क से बाहर रखते हैं, जैसे कोई एन्क्रिप्टेड प्रोटोकॉल जिसे वे पहचान नहीं पाते। एक स्थानीय स्प्लिट नियम इसे आपके अपने IP से VPN के बाहर भेजता है।"
  id: "Aturan keamanan URnetwork menjauhkan lalu lintas ini dari jaringan, misalnya protokol terenkripsi yang tidak dapat dikenali. Aturan pemisahan lokal mengirimnya ke luar VPN dari IP Anda sendiri."
  it: "Le regole di sicurezza di URnetwork tengono questo traffico fuori dalla rete, ad esempio un protocollo cifrato che non riescono a riconoscere. Una regola di suddivisione locale lo invia fuori dalla VPN dal tuo IP."
  ja: "URnetwork の安全ルールにより、このトラフィックはネットワークから除外されています。たとえば、識別できない暗号化プロトコルなどです。ローカル分割ルールを使うと、あなた自身の IP から VPN の外へ送られます。"
  ko: "URnetwork 안전 규칙은 이 트래픽을 네트워크에서 차단합니다. 예를 들어 인식할 수 없는 암호화 프로토콜이 그렇습니다. 로컬 분할 규칙을 쓰면 내 IP로 VPN 밖으로 보냅니다."
  nl: "De veiligheidsregels van URnetwork houden dit verkeer van het netwerk, bijvoorbeeld een versleuteld protocol dat ze niet herkennen. Een lokale splitsregel stuurt het buiten de VPN om vanaf je eigen IP."
  pl: "Reguły bezpieczeństwa URnetwork trzymają ten ruch poza siecią, na przykład szyfrowany protokół, którego nie potrafią rozpoznać. Lokalna reguła podziału wysyła go poza VPN z twojego własnego adresu IP."
  pt: "As regras de segurança da URnetwork mantêm este tráfego fora da rede, por exemplo um protocolo encriptado que não conseguem reconhecer. Uma regra de divisão local envia-o para fora da VPN a partir do seu próprio IP."
  pt-BR: "As regras de segurança da URnetwork mantêm este tráfego fora da rede, por exemplo um protocolo criptografado que elas não conseguem reconhecer. Uma regra de divisão local o envia para fora da VPN a partir do seu próprio IP."
  pt-PT: "As regras de segurança da URnetwork mantêm este tráfego fora da rede, por exemplo um protocolo encriptado que não conseguem reconhecer. Uma regra de divisão local envia-o para fora da VPN a partir do seu próprio IP."
  ru: "Правила безопасности URnetwork не пропускают этот трафик в сеть, например зашифрованный протокол, который они не могут распознать. Локальное правило разделения отправит его в обход VPN с вашего собственного IP."
  sv: "URnetworks säkerhetsregler håller den här trafiken borta från nätverket, till exempel ett krypterat protokoll som de inte känner igen. En lokal delningsregel skickar den utanför VPN:en från din egen IP."
  sw: "Sheria za usalama za URnetwork huzuia trafiki hii nje ya mtandao, kwa mfano itifaki iliyosimbwa ambayo hazitambui. Sheria ya mgawanyo ya ndani huituma nje ya VPN kutoka kwenye IP yako mwenyewe."
  th: "กฎความปลอดภัยของ URnetwork กันทราฟฟิกนี้ไว้นอกเครือข่าย เช่น โปรโตคอลเข้ารหัสที่กฎไม่รู้จัก กฎแยกเส้นทางภายในเครื่องจะส่งทราฟฟิกนี้ออกนอก VPN จาก IP ของคุณเอง"
  uk: "Правила безпеки URnetwork тримають цей трафік поза мережею, наприклад зашифрований протокол, який вони не можуть розпізнати. Локальне правило розділення відправляє його поза VPN з вашої власної IP."
  vi: "Các quy tắc an toàn của URnetwork giữ lưu lượng này ngoài mạng, ví dụ một giao thức mã hóa mà chúng không nhận diện được. Một quy tắc tách luồng cục bộ sẽ gửi nó ra ngoài VPN từ IP của chính bạn."
  zh: "URnetwork 安全规则会将此流量挡在网络之外，例如它无法识别的加密协议。本地分流规则会通过您自己的 IP 在 VPN 之外发送它。"
  zh-HK: "URnetwork 安全規則會將此流量擋在網絡之外，例如它無法識別的加密協定。本地分流規則會透過你自己的 IP 在 VPN 以外傳送它。"
