description: "Earnings card, after sn_payout_schedule: when the current epoch ends, when its share can be claimed and when an unclaimed share expires. The three values are local date-times the app fills from the chain's epoch schedule (the coordinator's policy: the claim-open offset and the claim TTL), never fixed durations."
source: "This epoch ends %@. Claim your share from %@ until %@."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: epoch_end
    type: string
  - name: claim_open
    type: string
  - name: expiry
    type: string
