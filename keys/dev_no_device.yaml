description: "Developer page: shown when there is no session to act on."
source: "No session. Sign in and connect to use these tools."
platforms:
  - linux
localizations:
  ar: "لا توجد جلسة. سجّل الدخول واتصل لاستخدام هذه الأدوات."
  cs: "Žádná relace. Pro použití těchto nástrojů se přihlaste a připojte."
  de: "Keine Sitzung. Melde dich an und verbinde dich, um diese Werkzeuge zu nutzen."
  el: "Καμία συνεδρία. Συνδεθείτε στον λογαριασμό σας και στο δίκτυο για να χρησιμοποιήσετε αυτά τα εργαλεία."
  en: "No session. Sign in and connect to use these tools."
  es: "No hay sesión. Inicia sesión y conéctate para usar estas herramientas."
  es-419: "No hay sesión. Inicia sesión y conéctate para usar estas herramientas."
  es-MX: "No hay sesión. Inicia sesión y conéctate para usar estas herramientas."
  fr: "Aucune session. Connectez-vous à votre compte et au réseau pour utiliser ces outils."
  he: "אין סשן. היכנסו לחשבון והתחברו כדי להשתמש בכלים האלה."
  hi: "कोई सत्र नहीं। इन टूल का इस्तेमाल करने के लिए साइन इन करें और कनेक्ट करें।"
  id: "Tidak ada sesi. Masuk dan hubungkan untuk memakai alat ini."
  it: "Nessuna sessione. Accedi e connettiti per usare questi strumenti."
  ja: "セッションがありません。これらのツールを使うには、サインインして接続してください。"
  ko: "세션이 없습니다. 이 도구를 사용하려면 로그인하고 연결하세요."
  nl: "Geen sessie. Log in en maak verbinding om deze tools te gebruiken."
  pl: "Brak sesji. Zaloguj się i połącz, aby korzystać z tych narzędzi."
  pt: "Sem sessão. Inicie sessão e ligue-se para usar estas ferramentas."
  pt-BR: "Sem sessão. Entre e conecte-se para usar estas ferramentas."
  pt-PT: "Sem sessão. Inicie sessão e ligue-se para usar estas ferramentas."
  ru: "Нет сеанса. Войдите и подключитесь, чтобы пользоваться этими инструментами."
  sv: "Ingen session. Logga in och anslut för att använda de här verktygen."
  sw: "Hakuna kipindi. Ingia na uunganishe ili kutumia zana hizi."
  th: "ไม่มีเซสชัน ลงชื่อเข้าใช้และเชื่อมต่อเพื่อใช้เครื่องมือเหล่านี้"
  uk: "Немає сеансу. Увійдіть і підключіться, щоб користуватися цими інструментами."
  vi: "Không có phiên. Hãy đăng nhập và kết nối để dùng các công cụ này."
  zh: "没有会话。请登录并连接以使用这些工具。"
  zh-HK: "沒有工作階段。請登入並連線以使用這些工具。"
