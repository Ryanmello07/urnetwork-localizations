  he: "המהירות שנמדדה דרך המכשיר הזה. חיבורים מהירים יותר מוצעים לעיתים קרובות יותר."
  hi: "इस डिवाइस के ज़रिए मापी गई गति। तेज़ कनेक्शन अधिक बार पेश किए जाते हैं।"
