description: "Linux Settings update notice, AppImage installs: what the Install button does. The AppImage is the single-file Linux app; the VPN service is the separate system service package."
source: "One click downloads the release, verifies it against the release's checksum and replaces this AppImage. The VPN service updates separately."
platforms:
  - linux
localizations:
  ar: "بنقرة واحدة يُنزَّل الإصدار ويُتحقق منه باستخدام المجموع الاختباري للإصدار ويحل محل ملف AppImage هذا. تُحدَّث خدمة VPN بشكل منفصل."
  cs: "Jedno kliknutí stáhne vydání, ověří ho podle kontrolního součtu vydání a nahradí tento AppImage. Služba VPN se aktualizuje samostatně."
  de: "Ein Klick lädt die Version herunter, prüft sie anhand ihrer Prüfsumme und ersetzt dieses AppImage. Der VPN-Dienst wird separat aktualisiert."
  el: "Με ένα κλικ η έκδοση λαμβάνεται, επαληθεύεται με το άθροισμα ελέγχου της έκδοσης και αντικαθιστά αυτό το AppImage. Η υπηρεσία VPN ενημερώνεται ξεχωριστά."
  en: "One click downloads the release, verifies it against the release's checksum and replaces this AppImage. The VPN service updates separately."
  es: "Con un clic se descarga la versión, se verifica con la suma de comprobación de la versión y se sustituye esta AppImage. El servicio VPN se actualiza por separado."
  es-419: "Con un clic se descarga la versión, se verifica con la suma de verificación de la versión y se sustituye esta AppImage. El servicio VPN se actualiza por separado."
  es-MX: "Con un clic se descarga la versión, se verifica con la suma de verificación de la versión y se sustituye esta AppImage. El servicio VPN se actualiza por separado."
  fr: "Un clic télécharge la version, la vérifie avec la somme de contrôle de la version et remplace cette AppImage. Le service VPN se met à jour séparément."
  he: "בלחיצה אחת הגרסה מורדת, נבדקת מול סכום הביקורת של הגרסה ומחליפה את ה-AppImage הזה. שירות ה-VPN מתעדכן בנפרד."
  hi: "एक क्लिक से रिलीज़ डाउनलोड होता है, रिलीज़ के चेकसम से सत्यापित होता है और यह AppImage बदल दिया जाता है। VPN सेवा अलग से अपडेट होती है।"
  id: "Satu klik mengunduh rilis, memverifikasinya dengan checksum rilis, dan mengganti AppImage ini. Layanan VPN diperbarui secara terpisah."
  it: "Con un clic la versione viene scaricata, verificata con il suo checksum e sostituisce questa AppImage. Il servizio VPN si aggiorna separatamente."
  ja: "ワンクリックでリリースをダウンロードし、リリースのチェックサムで検証して、この AppImage を置き換えます。VPN サービスは別途更新されます。"
  ko: "한 번 클릭하면 릴리스를 다운로드하고 릴리스 체크섬으로 확인한 뒤 이 AppImage를 교체합니다. VPN 서비스는 별도로 업데이트됩니다."
  nl: "Met één klik wordt de release gedownload, gecontroleerd aan de hand van de controlesom van de release en wordt deze AppImage vervangen. De VPN-dienst wordt apart bijgewerkt."
  pl: "Jedno kliknięcie pobiera wydanie, weryfikuje je za pomocą sumy kontrolnej wydania i zastępuje ten plik AppImage. Usługa VPN aktualizuje się osobno."
  pt: "Um clique baixa a versão, verifica-a com o checksum da versão e substitui este AppImage. O serviço VPN é atualizado separadamente."
  pt-BR: "Um clique baixa a versão, verifica-a com o checksum da versão e substitui este AppImage. O serviço VPN é atualizado separadamente."
  pt-PT: "Um clique transfere a versão, verifica-a com a soma de verificação da versão e substitui esta AppImage. O serviço VPN é atualizado à parte."
  ru: "Одним щелчком выпуск загружается, проверяется по контрольной сумме выпуска и заменяет этот AppImage. Служба VPN обновляется отдельно."
  sv: "Ett klick hämtar versionen, verifierar den mot versionens kontrollsumma och ersätter den här AppImage-filen. VPN-tjänsten uppdateras separat."
  sw: "Kubofya mara moja kunapakua toleo, kulithibitisha dhidi ya checksum ya toleo na kubadilisha AppImage hii. Huduma ya VPN husasishwa kando."
  th: "คลิกครั้งเดียวจะดาวน์โหลดรุ่นนี้ ตรวจสอบกับ checksum ของรุ่น และแทนที่ AppImage นี้ บริการ VPN จะอัปเดตแยกต่างหาก"
  uk: "Одним клацанням випуск завантажується, перевіряється за контрольною сумою випуску й замінює цей AppImage. Служба VPN оновлюється окремо."
  vi: "Một cú nhấp sẽ tải bản phát hành, xác minh nó với checksum của bản phát hành và thay thế AppImage này. Dịch vụ VPN được cập nhật riêng."
  zh: "点击一下即可下载该版本，用该版本的校验和进行验证，并替换此 AppImage。VPN 服务会单独更新。"
  zh-HK: "按一下即可下載該版本，以該版本的校驗碼驗證，並取代此 AppImage。VPN 服務會另外更新。"
