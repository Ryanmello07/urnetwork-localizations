description: "Re-engagement emails: closing line inviting a reply to the sender (a real inbox)."
source: "If something made you stop, reply and tell me. I read every reply."
platforms:
  - email
localizations:
  en: "If something made you stop, reply and tell me. I read every reply."
  ar: "إذا كان هناك ما جعلك تتوقف، فردّ وأخبرني. أقرأ كل ردّ."
  cs: "Pokud vás něco přimělo přestat, odpovězte a napište mi to. Čtu každou odpověď."
  de: "Wenn dich etwas zum Aufhören gebracht hat, antworte und sag es mir. Ich lese jede Antwort."
  el: "Αν κάτι σε έκανε να σταματήσεις, απάντησε και πες μου. Διαβάζω κάθε απάντηση."
  es: "Si algo hizo que dejaras de conectarte, responde y cuéntamelo. Leo todas las respuestas."
  es-419: "Si algo hizo que dejaras de conectarte, responde y cuéntamelo. Leo todas las respuestas."
  es-MX: "Si algo hizo que dejaras de conectarte, responde y cuéntamelo. Leo todas las respuestas."
  fr: "Si quelque chose t'a fait arrêter, réponds et dis-le-moi. Je lis chaque réponse."
  he: "אם משהו גרם לכם להפסיק, השיבו וספרו לי. אני קורא כל תשובה."
  hi: "अगर किसी वजह से आपने इस्तेमाल बंद किया, तो जवाब देकर मुझे बताएं। मैं हर जवाब पढ़ता हूँ।"
  id: "Kalau ada yang membuatmu berhenti, balas dan ceritakan kepada saya. Saya membaca setiap balasan."
  it: "Se qualcosa ti ha fatto smettere, rispondi e dimmelo. Leggo ogni risposta."
  ja: "何かが理由で使わなくなったのなら、返信して教えてください。返信はすべて読んでいます。"
  ko: "그만 쓰시게 된 이유가 있다면, 답장으로 알려 주세요. 모든 답장을 읽습니다."
  nl: "Als je om een bepaalde reden bent gestopt, antwoord dan en vertel het me. Ik lees elk antwoord."
  pl: "Jeśli coś sprawiło, że przestałeś, odpowiedz i napisz mi. Czytam każdą odpowiedź."
  pt: "Se algo fez você parar, responda e me conte. Eu leio todas as respostas."
  pt-BR: "Se algo fez você parar, responda e me conte. Eu leio todas as respostas."
  pt-PT: "Se alguma coisa fez com que parasse, responda e diga-me. Leio todas as respostas."
  ru: "Если что-то заставило вас перестать, ответьте и расскажите мне. Я читаю каждый ответ."
  sv: "Om något fick dig att sluta, svara och berätta. Jag läser varje svar."
  sw: "Ikiwa kuna kitu kilichokufanya uache, jibu na uniambie. Ninasoma kila jibu."
  th: "ถ้ามีอะไรทำให้คุณเลิกใช้ ตอบกลับมาบอกผมได้เลย ผมอ่านทุกคำตอบ"
  uk: "Якщо щось змусило вас перестати, дайте відповідь і розкажіть мені. Я читаю кожну відповідь."
  vi: "Nếu có điều gì khiến bạn ngừng dùng, hãy trả lời và cho tôi biết. Tôi đọc mọi câu trả lời."
  zh: "如果有什么原因让你不再使用，回复告诉我。每一封回复我都会读。"
  zh-HK: "如果有什麼原因令你停用，回覆告訴我。每一封回覆我都會讀。"
