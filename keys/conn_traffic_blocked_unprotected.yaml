description: "Windows and Linux Connect page line while connected but no provider carries traffic, and leak protection (the Windows firewall policy, the Linux kill switch's block floor) is not in force."
source: "No working provider right now — traffic sent into the tunnel is going nowhere, and leak protection is off, so some traffic may bypass it. Disconnect to go back to your normal connection."
platforms:
  - windows
  - linux
localizations:
  ar: "لا يوجد مزود يعمل الآن — حركة البيانات المرسلة إلى النفق لا تصل إلى أي مكان، والحماية من التسرب معطّلة، لذا قد يتجاوزها جزء من حركة البيانات. اقطع الاتصال للعودة إلى اتصالك العادي."
  cs: "Teď není k dispozici žádný funkční poskytovatel – provoz odeslaný do tunelu nikam nedorazí a ochrana proti únikům je vypnutá, takže část provozu ji může obejít. Odpojte se, abyste se vrátili ke svému běžnému připojení."
  de: "Gerade kein funktionierender Anbieter – Datenverkehr, der in den Tunnel geht, kommt nirgends an, und der Leckschutz ist aus, sodass ein Teil des Datenverkehrs ihn umgehen kann. Trenne die Verbindung, um zu deiner normalen Verbindung zurückzukehren."
  el: "Κανένας πάροχος δεν λειτουργεί αυτή τη στιγμή — η κίνηση που στέλνεται στη σήραγγα δεν φτάνει πουθενά και η προστασία από διαρροές είναι ανενεργή, οπότε μέρος της κίνησης μπορεί να την παρακάμψει. Αποσυνδεθείτε για να επιστρέψετε στην κανονική σας σύνδεση."
  en: "No working provider right now — traffic sent into the tunnel is going nowhere, and leak protection is off, so some traffic may bypass it. Disconnect to go back to your normal connection."
  es: "No hay ningún proveedor que funcione ahora mismo: el tráfico que entra en el túnel no llega a ninguna parte y la protección contra fugas está desactivada, así que parte del tráfico puede saltársela. Desconéctate para volver a tu conexión normal."
  es-419: "No hay ningún proveedor que funcione en este momento: el tráfico que entra en el túnel no llega a ninguna parte y la protección contra fugas está desactivada, así que parte del tráfico puede evitarla. Desconéctate para volver a tu conexión normal."
  es-MX: "No hay ningún proveedor que funcione en este momento: el tráfico que entra en el túnel no llega a ninguna parte y la protección contra fugas está desactivada, así que parte del tráfico puede evitarla. Desconéctate para volver a tu conexión normal."
  fr: "Aucun fournisseur fonctionnel pour le moment — le trafic envoyé dans le tunnel n’aboutit nulle part, et la protection anti-fuite est désactivée, si bien qu’une partie du trafic peut le contourner. Déconnectez-vous pour revenir à votre connexion habituelle."
  he: "אין כרגע ספק שעובד — תעבורה שנשלחת למנהרה לא מגיעה לשום מקום, וההגנה מפני דליפות כבויה, כך שחלק מהתעבורה עלול לעקוף אותה. התנתקו כדי לחזור לחיבור הרגיל שלכם."
  hi: "अभी कोई काम करने वाला प्रदाता नहीं है — टनल में भेजा गया ट्रैफ़िक कहीं नहीं पहुँच रहा, और लीक सुरक्षा बंद है, इसलिए कुछ ट्रैफ़िक इसे बायपास कर सकता है। अपने सामान्य कनेक्शन पर लौटने के लिए डिस्कनेक्ट करें।"
  id: "Tidak ada penyedia yang berfungsi saat ini — lalu lintas yang dikirim ke terowongan tidak sampai ke mana pun, dan perlindungan kebocoran nonaktif, sehingga sebagian lalu lintas dapat melewatinya. Putuskan koneksi untuk kembali ke koneksi normal Anda."
  it: "Nessun provider funzionante al momento — il traffico inviato nel tunnel non arriva da nessuna parte e la protezione dalle perdite è disattivata, quindi parte del traffico potrebbe aggirarlo. Disconnettiti per tornare alla tua connessione normale."
  ja: "現在、機能しているプロバイダーがありません — トンネルに送られた通信はどこにも届かず、漏洩防止もオフのため、一部の通信がトンネルを迂回する可能性があります。通常の接続に戻るには切断してください。"
  ko: "지금은 작동하는 제공업체가 없습니다 — 터널로 보낸 트래픽은 어디에도 도달하지 못하고 유출 방지도 꺼져 있어 일부 트래픽이 터널을 우회할 수 있습니다. 평소 연결로 돌아가려면 연결을 해제하세요."
  nl: "Nu geen werkende provider – verkeer dat de tunnel in gaat, komt nergens aan, en de lekbeveiliging staat uit, dus een deel van het verkeer kan eromheen gaan. Verbreek de verbinding om terug te gaan naar je normale verbinding."
  pl: "Brak działającego dostawcy — ruch wysyłany do tunelu nigdzie nie trafia, a ochrona przed wyciekami jest wyłączona, więc część ruchu może go omijać. Rozłącz się, aby wrócić do zwykłego połączenia."
  pt: "Nenhum provedor funcionando agora — o tráfego enviado ao túnel não chega a lugar nenhum, e a proteção contra vazamentos está desativada, então parte do tráfego pode contorná-lo. Desconecte para voltar à sua conexão normal."
  pt-BR: "Nenhum provedor funcionando agora — o tráfego enviado ao túnel não chega a lugar nenhum, e a proteção contra vazamentos está desativada, então parte do tráfego pode contorná-lo. Desconecte para voltar à sua conexão normal."
  pt-PT: "Nenhum fornecedor a funcionar neste momento — o tráfego enviado para o túnel não chega a lado nenhum e a proteção contra fugas está desativada, por isso parte do tráfego pode contorná-la. Desligue para voltar à sua ligação normal."
  ru: "Сейчас нет работающего провайдера — трафик, отправленный в туннель, никуда не уходит, а защита от утечек выключена, поэтому часть трафика может идти в обход. Отключитесь, чтобы вернуться к обычному подключению."
  sv: "Ingen fungerande leverantör just nu – trafik som skickas in i tunneln kommer ingenstans, och läckskyddet är av, så viss trafik kan gå förbi den. Koppla från för att gå tillbaka till din vanliga anslutning."
  sw: "Hakuna mtoa huduma anayefanya kazi sasa hivi — trafiki inayotumwa kwenye handaki haifiki popote, na kinga ya uvujaji imezimwa, kwa hivyo baadhi ya trafiki inaweza kuikwepa. Tenganisha ili urudi kwenye muunganisho wako wa kawaida."
  th: "ขณะนี้ไม่มีผู้ให้บริการที่ใช้งานได้ — ทราฟฟิกที่ส่งเข้าอุโมงค์ไปไม่ถึงไหน และการป้องกันการรั่วไหลปิดอยู่ ทราฟฟิกบางส่วนจึงอาจเลี่ยงผ่านไปได้ ตัดการเชื่อมต่อเพื่อกลับไปใช้การเชื่อมต่อตามปกติ"
  uk: "Зараз немає робочого провайдера — трафік, надісланий у тунель, нікуди не йде, а захист від витоків вимкнено, тож частина трафіку може йти в обхід. Відключіться, щоб повернутися до звичайного з’єднання."
  vi: "Hiện không có nhà cung cấp nào hoạt động — lưu lượng gửi vào đường hầm không đi tới đâu, và bảo vệ rò rỉ đang tắt, nên một phần lưu lượng có thể đi vòng qua nó. Ngắt kết nối để quay lại kết nối thông thường."
  zh: "目前没有可用的提供商 — 发送到隧道的流量无处可去，而且防泄漏保护已关闭，因此部分流量可能会绕过它。断开连接即可恢复正常网络。"
  zh-HK: "目前沒有可用的供應商 — 傳送到隧道的流量無處可去，而且防洩漏保護已關閉，因此部分流量可能會繞過它。中斷連線即可回到正常網絡。"
