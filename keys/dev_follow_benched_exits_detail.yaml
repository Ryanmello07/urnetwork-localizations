description: "Developer page: the explanation under the 'Follow benched exits' setting."
source: "A quarantined exit keeps its own sites' new connections through the early bench, when the verdict is least proven. New sites still avoid it"
platforms:
  - linux
localizations:
  ar: "يحتفظ المخرج المحجور بالاتصالات الجديدة لمواقعه خلال بداية الحجر، حين يكون الحكم في أضعف حالاته. تظل المواقع الجديدة تتجنبه"
  cs: "Výstup v karanténě si ponechá nová připojení svých vlastních webů během začátku pobytu na lavičce, kdy je verdikt nejméně prokázaný. Nové weby se mu dál vyhýbají"
  de: "Ein Exit in Quarantäne behält in der frühen Ersatzbankphase, in der das Urteil am wenigsten gesichert ist, die neuen Verbindungen seiner eigenen Websites. Neue Websites meiden ihn weiterhin"
  el: "Μια έξοδος σε καραντίνα κρατά τις νέες συνδέσεις των δικών της ιστότοπων στην αρχή του πάγκου, όταν η ετυμηγορία είναι λιγότερο αποδεδειγμένη. Οι νέοι ιστότοποι εξακολουθούν να την αποφεύγουν"
  en: "A quarantined exit keeps its own sites' new connections through the early bench, when the verdict is least proven. New sites still avoid it"
  es: "Una salida en cuarentena conserva las conexiones nuevas de sus propios sitios durante el inicio del banquillo, cuando el veredicto es menos seguro. Los sitios nuevos la siguen evitando"
  es-419: "Una salida en cuarentena conserva las conexiones nuevas de sus propios sitios durante el inicio de la banca, cuando el veredicto es menos seguro. Los sitios nuevos la siguen evitando"
  es-MX: "Una salida en cuarentena conserva las conexiones nuevas de sus propios sitios durante el inicio de la banca, cuando el veredicto es menos seguro. Los sitios nuevos la siguen evitando"
  fr: "Une sortie en quarantaine garde les nouvelles connexions de ses propres sites au début de la mise sur la touche, quand le verdict est le moins établi. Les nouveaux sites l’évitent toujours"
  he: "יציאה בהסגר שומרת את החיבורים החדשים של האתרים שלה בתחילת השהייה על הספסל, כשההכרעה הכי פחות מוכחת. אתרים חדשים עדיין נמנעים ממנה"
  hi: "क्वारंटीन में रखा एग्ज़िट बेंच के शुरुआती दौर में, जब फ़ैसला सबसे कम सिद्ध होता है, अपनी साइटों के नए कनेक्शन रखता है। नई साइटें अब भी उससे बचती हैं"
  id: "Exit yang dikarantina mempertahankan koneksi baru dari situsnya sendiri selama awal masa cadangan, saat vonis paling belum terbukti. Situs baru tetap menghindarinya"
  it: "Un’uscita in quarantena mantiene le nuove connessioni dei propri siti all’inizio della panchina, quando il verdetto è meno provato. I nuovi siti continuano a evitarla"
  ja: "隔離された出口は、判定の裏付けが最も弱い待機の初期段階では、自分のサイトの新しい接続を保持します。新しいサイトは引き続きその出口を避けます"
  ko: "격리된 출구는 판정의 근거가 가장 약한 대기 초기에 자기 사이트의 새 연결을 유지합니다. 새 사이트는 여전히 그 출구를 피합니다"
  nl: "Een exit in quarantaine houdt de nieuwe verbindingen van zijn eigen sites tijdens het begin van de bankperiode, wanneer het oordeel het minst bewezen is. Nieuwe sites vermijden hem nog steeds"
  pl: "Wyjście w kwarantannie zachowuje nowe połączenia swoich witryn na początku ławki, gdy werdykt jest najmniej pewny. Nowe witryny nadal go unikają"
  pt: "Uma saída em quarentena mantém as novas ligações dos seus próprios sites no início do banco, quando o veredicto está menos comprovado. Os novos sites continuam a evitá-la"
  pt-BR: "Uma saída em quarentena mantém as novas conexões dos seus próprios sites no início do banco, quando o veredito é menos comprovado. Novos sites continuam evitando-a"
  pt-PT: "Uma saída em quarentena mantém as novas ligações dos seus próprios sites no início do banco, quando o veredicto está menos comprovado. Os novos sites continuam a evitá-la"
  ru: "Выход на карантине сохраняет новые соединения своих сайтов в начале отстранения, когда вердикт наименее обоснован. Новые сайты по-прежнему его избегают"
  sv: "En utgång i karantän behåller sina egna webbplatsers nya anslutningar under början av avbänkningen, när domen är minst bevisad. Nya webbplatser undviker den fortfarande"
  sw: "Njia ya kutoka iliyotengwa huendelea kupokea miunganisho mipya ya tovuti zake mwanzoni mwa kukaa benchi, wakati hukumu bado haijathibitishwa sana. Tovuti mpya bado huiepuka"
  th: "ทางออกที่ถูกกักกันจะเก็บการเชื่อมต่อใหม่ของเว็บไซต์ของตัวเองไว้ในช่วงต้นของการพัก ซึ่งเป็นช่วงที่คำตัดสินพิสูจน์ได้น้อยที่สุด เว็บไซต์ใหม่ยังคงหลีกเลี่ยงทางออกนั้น"
  uk: "Вихід на карантині зберігає нові з’єднання своїх сайтів на початку перебування на лаві, коли вердикт найменш доведений. Нові сайти й далі його уникають"
  vi: "Một điểm thoát bị cách ly vẫn giữ các kết nối mới của chính các trang web của nó trong giai đoạn đầu dự bị, khi phán quyết còn ít bằng chứng nhất. Các trang mới vẫn tránh nó"
  zh: "被隔离的出口在隔离初期（此时判定最不可靠）仍会承接其自身站点的新连接。新站点仍会避开它"
  zh-HK: "被隔離的出口在隔離初期（此時判定最不可靠）仍會承接其自身網站的新連線。新網站仍會避開它"
