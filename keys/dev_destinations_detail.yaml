description: "Developer page: explanation under the destinations table."
source: "Which exit each destination's flows are landing on. A site spread over several rows is a site that lost its single egress IP."
platforms:
  - linux
localizations:
  ar: "على أي مخرج تصل تدفقات كل وجهة. الموقع الموزّع على عدة صفوف هو موقع فقد عنوان IP الخروج الوحيد الخاص به."
  cs: "Na který výstup přicházejí toky jednotlivých cílů. Web rozložený do několika řádků je web, který přišel o svou jedinou výstupní IP."
  de: "Auf welchem Exit die Flows jedes Ziels landen. Eine Website, die sich über mehrere Zeilen verteilt, hat ihre einzige Egress-IP verloren."
  el: "Σε ποια έξοδο καταλήγουν οι ροές κάθε προορισμού. Ένας ιστότοπος που απλώνεται σε πολλές γραμμές είναι ιστότοπος που έχασε τη μοναδική IP εξόδου του."
  en: "Which exit each destination's flows are landing on. A site spread over several rows is a site that lost its single egress IP."
  es: "En qué salida terminan los flujos de cada destino. Un sitio repartido en varias filas es un sitio que perdió su única IP de salida."
  es-419: "En qué salida terminan los flujos de cada destino. Un sitio repartido en varias filas es un sitio que perdió su única IP de salida."
  es-MX: "En qué salida terminan los flujos de cada destino. Un sitio repartido en varias filas es un sitio que perdió su única IP de salida."
  fr: "Sur quelle sortie arrivent les flux de chaque destination. Un site réparti sur plusieurs lignes est un site qui a perdu son unique IP de sortie."
  he: "לאיזו יציאה מגיעות הזרימות של כל יעד. אתר שמפוזר על כמה שורות הוא אתר שאיבד את כתובת ה-IP היוצאת היחידה שלו."
  hi: "हर गंतव्य के फ़्लो किस एग्ज़िट पर पहुँच रहे हैं। कई पंक्तियों में बँटी साइट वह साइट है जिसने अपना इकलौता इग्रेस IP खो दिया है।"
  id: "Exit tempat aliran setiap tujuan mendarat. Situs yang tersebar di beberapa baris adalah situs yang kehilangan satu-satunya IP egress-nya."
  it: "Su quale uscita arrivano i flussi di ogni destinazione. Un sito distribuito su più righe è un sito che ha perso il suo unico IP di uscita."
  ja: "各宛先のフローがどの出口に届いているか。複数の行にまたがるサイトは、唯一の出口 IP を失ったサイトです。"
  ko: "각 대상의 플로우가 어느 출구에 도착하는지 보여 줍니다. 여러 행에 걸쳐 있는 사이트는 하나뿐인 송신 IP를 잃은 사이트입니다."
  nl: "Op welke exit de flows van elke bestemming uitkomen. Een site die over meerdere rijen verspreid is, is een site die zijn enige uitgaande IP kwijt is."
  pl: "Na które wyjście trafiają przepływy każdego miejsca docelowego. Witryna rozłożona na kilka wierszy to witryna, która straciła swój jedyny wyjściowy adres IP."
  pt: "Em que saída chegam os fluxos de cada destino. Um site espalhado por várias linhas é um site que perdeu o seu único IP de saída."
  pt-BR: "Em qual saída chegam os fluxos de cada destino. Um site espalhado por várias linhas é um site que perdeu seu único IP de saída."
  pt-PT: "Em que saída chegam os fluxos de cada destino. Um site espalhado por várias linhas é um site que perdeu o seu único IP de saída."
  ru: "На какой выход приходят потоки каждого адресата. Сайт, разбросанный по нескольким строкам, — это сайт, потерявший свой единственный исходящий IP."
  sv: "Vilken utgång varje destinations flöden hamnar på. En webbplats som är utspridd över flera rader har förlorat sin enda utgående IP."
  sw: "Njia ya kutoka ambayo mitiririko ya kila lengo inafikia. Tovuti iliyoenea kwenye safu kadhaa ni tovuti iliyopoteza IP yake pekee ya kutokea."
  th: "โฟลว์ของแต่ละปลายทางไปลงที่ทางออกใด เว็บไซต์ที่กระจายอยู่หลายแถวคือเว็บไซต์ที่เสีย IP ขาออกเพียงหนึ่งเดียวของตนไป"
  uk: "На який вихід потрапляють потоки кожного призначення. Сайт, розкиданий по кількох рядках, — це сайт, що втратив свою єдину вихідну IP."
  vi: "Luồng của mỗi đích đang đến điểm thoát nào. Một trang trải trên nhiều hàng là trang đã mất IP ra ngoài duy nhất của nó."
  zh: "每个目的地的流落在哪个出口上。分散在多行的站点，就是失去了其唯一出口 IP 的站点。"
  zh-HK: "每個目的地的流落在哪個出口上。分散在多行的網站，就是失去了其唯一出口 IP 的網站。"
