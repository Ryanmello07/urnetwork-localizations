description: "Re-engagement 'what changed' item: points to the public outage history page. Sent only to people who were using the app during the October 2026 outages. Keep the address ur.io/outages unchanged."
source: "October had outages. We published each one, what caused it and what we changed, at ur.io/outages."
platforms:
  - email
localizations:
  en: "October had outages. We published each one, what caused it and what we changed, at ur.io/outages."
  ar: "شهد شهر أكتوبر انقطاعات في الخدمة. نشرنا كل انقطاع منها، وما سبّبه وما غيّرناه، على ur.io/outages."
  cs: "V říjnu došlo k výpadkům. Ke každému z nich jsme na ur.io/outages zveřejnili, co ho způsobilo a co jsme změnili."
  de: "Im Oktober gab es Ausfälle. Wir haben jeden davon veröffentlicht, mit Ursache und dem, was wir geändert haben, unter ur.io/outages."
  el: "Τον Οκτώβριο υπήρξαν διακοπές λειτουργίας. Για την καθεμία δημοσιεύσαμε στο ur.io/outages τι την προκάλεσε και τι αλλάξαμε."
  es: "En octubre hubo caídas del servicio. Publicamos cada una, qué la causó y qué cambiamos, en ur.io/outages."
  es-419: "En octubre hubo caídas del servicio. Publicamos cada una, qué la causó y qué cambiamos, en ur.io/outages."
  es-MX: "En octubre hubo caídas del servicio. Publicamos cada una, qué la causó y qué cambiamos, en ur.io/outages."
  fr: "Il y a eu des pannes en octobre. On a publié chacune d'elles, avec sa cause et ce qu'on a changé, sur ur.io/outages."
  he: "באוקטובר היו השבתות. פרסמנו כל אחת מהן, מה גרם לה ומה שינינו, ב-ur.io/outages."
  hi: "अक्टूबर में सेवा में रुकावटें आईं। हमने हर एक को, उसकी वजह और हमारे किए बदलावों के साथ, ur.io/outages पर प्रकाशित किया है।"
  id: "Pada bulan Oktober terjadi gangguan layanan. Kami memublikasikan setiap gangguan, apa penyebabnya, dan apa yang kami ubah, di ur.io/outages."
  it: "A ottobre ci sono stati dei disservizi. Li abbiamo pubblicati tutti, con la causa di ciascuno e cosa abbiamo cambiato, su ur.io/outages."
  ja: "10月には障害が発生しました。それぞれの障害について、原因と私たちが変えたことを ur.io/outages で公開しました。"
  ko: "10월에 장애가 있었습니다. 각 장애와 그 원인, 그리고 저희가 바꾼 점을 ur.io/outages에 공개했습니다."
  nl: "In oktober waren er storingen. We hebben elke storing gepubliceerd, met de oorzaak en wat we hebben veranderd, op ur.io/outages."
  pl: "W październiku były awarie. Opis każdej z nich opublikowaliśmy na ur.io/outages: co ją spowodowało i co zmieniliśmy."
  pt: "Em outubro houve interrupções no serviço. Publicamos cada uma, o que a causou e o que mudamos, em ur.io/outages."
  pt-BR: "Em outubro houve interrupções no serviço. Publicamos cada uma, o que a causou e o que mudamos, em ur.io/outages."
  pt-PT: "Em outubro houve interrupções no serviço. Publicámos cada uma, o que a causou e o que mudámos, em ur.io/outages."
  ru: "В октябре были сбои. Мы опубликовали разбор каждого из них на ur.io/outages: что его вызвало и что мы изменили."
  sv: "I oktober hade vi avbrott. Vi har publicerat varje avbrott, vad som orsakade det och vad vi ändrade, på ur.io/outages."
  sw: "Mwezi Oktoba kulikuwa na matukio ya kukatika kwa huduma. Tulichapisha kila tukio, kilicholisababisha na tulichobadilisha, kwenye ur.io/outages."
  th: "เดือนตุลาคมมีเหตุระบบขัดข้องหลายครั้ง เราเผยแพร่รายละเอียดของแต่ละครั้ง ทั้งสาเหตุและสิ่งที่เราเปลี่ยน ไว้ที่ ur.io/outages"
  uk: "У жовтні були збої. Ми опублікували розбір кожного з них на ur.io/outages: що його спричинило і що ми змінили."
  vi: "Tháng 10 có những lần gián đoạn dịch vụ. Chúng tôi đã công bố từng lần, nguyên nhân và những gì chúng tôi đã thay đổi, tại ur.io/outages."
  zh: "10 月出现过服务中断。每一次中断、它的原因，以及我们做了哪些改变，都已公布在 ur.io/outages。"
  zh-HK: "10 月曾出現服務中斷。每一次中斷、它的原因，以及我們作出了哪些改變，都已公佈在 ur.io/outages。"
