description: "Hint under the Ignore battery optimizations row in builds that can ask for the exemption directly. Once the exemption is on, tapping the row opens Android's system battery optimization list, which by default shows only apps that are not optimized; the quoted labels are Android's own labels for the list filter and the per-app choice."
source: "To turn this off, tap the switch to open Android's battery optimization list, switch the filter to “All apps”, then choose URnetwork and “Optimize”."
platforms:
  - android
localizations:
  ar: "لإيقاف ذلك، اضغط على المفتاح لفتح قائمة تحسين البطارية في Android، وغيّر عامل التصفية إلى «كل التطبيقات»، ثم اختر URnetwork و«تحسين»."
  cs: "Chcete-li to vypnout, klepnutím na přepínač otevřete seznam optimalizace baterie v Androidu, přepněte filtr na „Všechny aplikace“ a pak vyberte URnetwork a „Optimalizovat“."
  de: "Zum Ausschalten tippe auf den Schalter, um die Akku-Optimierungsliste von Android zu öffnen, stelle den Filter auf „Alle Apps“ und wähle dann URnetwork und „Optimieren“."
  el: "Για να το απενεργοποιήσετε, πατήστε τον διακόπτη για να ανοίξει η λίστα βελτιστοποίησης μπαταρίας του Android, αλλάξτε το φίλτρο σε «Όλες οι εφαρμογές» και, στη συνέχεια, επιλέξτε το URnetwork και «Βελτιστοποίηση»."
  en: "To turn this off, tap the switch to open Android's battery optimization list, switch the filter to “All apps”, then choose URnetwork and “Optimize”."
  es: "Para desactivarlo, toca el interruptor para abrir la lista de optimización de batería de Android, cambia el filtro a «Todas las aplicaciones» y luego elige URnetwork y «Optimizar»."
  es-419: "Para desactivarlo, toca el interruptor para abrir la lista de optimización de batería de Android, cambia el filtro a \"Todas las apps\" y luego elige URnetwork y \"Optimizar\"."
  es-MX: "Para desactivarlo, toca el interruptor para abrir la lista de optimización de batería de Android, cambia el filtro a \"Todas las apps\" y luego elige URnetwork y \"Optimizar\"."
  fr: "Pour désactiver cette option, touchez l’interrupteur pour ouvrir la liste d’optimisation de la batterie d’Android, réglez le filtre sur « Toutes les applications », puis choisissez URnetwork et « Optimiser »."
  he: "כדי לכבות זאת, הקש על המתג כדי לפתוח את רשימת אופטימיזציית הסוללה של Android, שנה את המסנן ל\"כל האפליקציות\", ואז בחר ב-URnetwork וב\"אופטימיזציה\"."
  hi: "इसे बंद करने के लिए, Android की बैटरी ऑप्टिमाइज़ेशन सूची खोलने के लिए स्विच पर टैप करें, फ़िल्टर को \"सभी ऐप्लिकेशन\" पर बदलें, फिर URnetwork और \"ऑप्टिमाइज़ करें\" चुनें।"
  id: "Untuk menonaktifkannya, ketuk tombol untuk membuka daftar pengoptimalan baterai Android, ubah filter ke \"Semua aplikasi\", lalu pilih URnetwork dan \"Optimalkan\"."
  it: "Per disattivarla, tocca l'interruttore per aprire l'elenco di ottimizzazione della batteria di Android, imposta il filtro su \"Tutte le app\", quindi scegli URnetwork e \"Ottimizza\"."
  ja: "オフにするには、スイッチをタップして Android の電池の最適化リストを開き、フィルタを「すべてのアプリ」に切り替えてから、URnetwork を選んで「最適化」を選択してください。"
  ko: "끄려면 스위치를 탭하여 Android의 배터리 최적화 목록을 열고 필터를 '모든 앱'으로 바꾼 다음 URnetwork를 선택하고 '최적화'를 선택하세요."
  nl: "Tik om dit uit te zetten op de schakelaar om de lijst voor batterijoptimalisatie van Android te openen, zet het filter op ‘Alle apps’ en kies daarna URnetwork en ‘Optimaliseren’."
  pl: "Aby to wyłączyć, dotknij przełącznika, aby otworzyć listę optymalizacji baterii w Androidzie, zmień filtr na „Wszystkie aplikacje”, a następnie wybierz URnetwork i „Optymalizuj”."
  pt: "Para desativar, toque no interruptor para abrir a lista de otimização da bateria do Android, mude o filtro para \"Todas as apps\" e, em seguida, escolha URnetwork e \"Otimizar\"."
  pt-BR: "Para desativar, toque no botão para abrir a lista de otimização de bateria do Android, mude o filtro para \"Todos os apps\" e depois escolha URnetwork e \"Otimizar\"."
  pt-PT: "Para desativar, toque no interruptor para abrir a lista de otimização da bateria do Android, mude o filtro para \"Todas as apps\" e, em seguida, escolha URnetwork e \"Otimizar\"."
  ru: "Чтобы отключить, нажмите на переключатель, чтобы открыть список оптимизации батареи Android, переключите фильтр на «Все приложения», затем выберите URnetwork и «Экономить»."
  sv: "Om du vill stänga av detta trycker du på reglaget för att öppna Androids lista för batterioptimering, byter filtret till ”Alla appar” och väljer sedan URnetwork och ”Optimera”."
  sw: "Ili kuzima hili, gusa swichi ili kufungua orodha ya uboreshaji wa betri ya Android, badilisha kichujio kiwe \"Programu zote\", kisha uchague URnetwork na \"Boresha\"."
  th: "หากต้องการปิด ให้แตะสวิตช์เพื่อเปิดรายการการเพิ่มประสิทธิภาพแบตเตอรี่ของ Android เปลี่ยนตัวกรองเป็น \"แอปทั้งหมด\" แล้วเลือก URnetwork และ \"เพิ่มประสิทธิภาพ\""
  uk: "Щоб вимкнути, торкніться перемикача, щоб відкрити список оптимізації батареї Android, перемкніть фільтр на «Усі застосунки», а потім виберіть URnetwork і «Оптимізувати»."
  vi: "Để tắt, hãy nhấn vào nút gạt để mở danh sách tối ưu hóa pin của Android, chuyển bộ lọc sang \"Tất cả ứng dụng\", sau đó chọn URnetwork và \"Tối ưu hóa\"."
  zh: "如需关闭，请点按开关打开 Android 的电池优化列表，将筛选条件切换为“所有应用”，然后选择 URnetwork 并选择“优化”。"
  zh-HK: "如要關閉，請輕按開關以開啟 Android 的電池優化清單，將篩選條件切換為「所有應用程式」，然後選擇 URnetwork 並選擇「優化」。"
