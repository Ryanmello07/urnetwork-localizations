description: "ur.io checkout (the Pro upgrade sheet, the onboarding plan step, the offer screen, the free-trial panel): the server refused a new subscription because the network already has an active Pro subscription (error.code already_subscribed). Nothing was charged."
source: "You already have Pro, so nothing was charged. Manage your subscription from your account."
platforms:
  - site
localizations:
  ar: "لديك Pro بالفعل، لذا لم يتم تحصيل أي مبلغ. يمكنك إدارة اشتراكك من حسابك."
  de: "Du hast bereits Pro, es wurde nichts berechnet. Verwalte dein Abo in deinem Konto."
  en: "You already have Pro, so nothing was charged. Manage your subscription from your account."
  es: "Ya tienes Pro, así que no se te cobró nada. Gestiona tu suscripción desde tu cuenta."
  ru: "У вас уже есть Pro, поэтому оплата не списана. Управляйте подпиской в своём аккаунте."
  zh: "您已拥有 Pro，因此未扣款。请在您的账户中管理订阅。"
