description: "Refer overlay"
source: "Share your code. Friends enter it when they sign up."
platforms:
  - android
  - apple
  - linux
localizations:
  ar: "شارك رمزك. يدخله أصدقاؤك عند التسجيل."
  cs: "Sdílejte svůj kód. Přátelé ho zadají při registraci."
  de: "Teile deinen Code. Freunde geben ihn bei der Anmeldung ein."
  el: "Μοιραστείτε τον κωδικό σας. Οι φίλοι σας τον εισάγουν κατά την εγγραφή."
  en: "Share your code. Friends enter it when they sign up."
  es: "Comparte tu código. Tus amigos lo introducen al registrarse."
  es-419: "Comparte tu código. Tus amigos lo ingresan al registrarse."
  es-MX: "Comparte tu código. Tus amigos lo ingresan al registrarse."
  fr: "Partagez votre code. Vos amis le saisissent lors de leur inscription."
  he: "שתף את הקוד שלך. חברים מזינים אותו כשהם נרשמים."
  hi: "अपना कोड शेयर करें। दोस्त साइन अप करते समय इसे डालते हैं।"
  id: "Bagikan kode Anda. Teman memasukkannya saat mendaftar."
  it: "Condividi il tuo codice. Gli amici lo inseriscono quando si registrano."
  ja: "コードを共有しましょう。友達が登録時に入力します。"
  ko: "코드를 공유하세요. 친구가 가입할 때 입력하면 됩니다."
  nl: "Deel je code. Vrienden voeren hem in bij het aanmelden."
  pl: "Udostępnij swój kod. Znajomi wpisują go przy rejestracji."
  pt: "Partilhe o seu código. Os amigos introduzem-no ao criar a conta."
  pt-BR: "Compartilhe seu código. Seus amigos inserem o código ao criar a conta."
  pt-PT: "Partilhe o seu código. Os amigos introduzem-no ao criar a conta."
  ru: "Поделитесь своим кодом. Друзья вводят его при регистрации."
  sv: "Dela din kod. Vänner anger den när de registrerar sig."
  sw: "Shiriki msimbo wako. Marafiki wanauweka wanapojisajili."
  th: "แชร์โค้ดของคุณ เพื่อนกรอกโค้ดนี้ตอนสมัคร"
  uk: "Поділіться своїм кодом. Друзі вводять його під час реєстрації."
  vi: "Chia sẻ mã của bạn. Bạn bè nhập mã khi đăng ký."
  zh: "分享你的推荐码。朋友注册时输入即可。"
  zh-HK: "分享你的推薦碼。朋友註冊時輸入即可。"
