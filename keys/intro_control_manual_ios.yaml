description: "How to add the quick connect control on iOS (no add-control API)."
source: "Open Control Center, tap +, then Add a Control, and pick URnetwork."
platforms:
  - apple
localizations:
  ar: "افتح مركز التحكم، واضغط على +، ثم «إضافة عنصر تحكم»، واختر URnetwork."
  cs: "Otevřete Ovládací centrum, klepněte na +, potom na Přidat ovládací prvek a vyberte URnetwork."
  de: "Öffne das Kontrollzentrum, tippe auf +, dann auf „Steuerelement hinzufügen“ und wähle URnetwork."
  el: "Ανοίξτε το Κέντρο ελέγχου, πατήστε +, μετά Προσθήκη χειριστηρίου και επιλέξτε URnetwork."
  en: "Open Control Center, tap +, then Add a Control, and pick URnetwork."
  es: "Abre el Centro de control, toca +, luego «Añadir un control» y elige URnetwork."
  es-419: "Abre el Centro de control, toca +, luego \"Agregar un control\" y elige URnetwork."
  es-MX: "Abre el Centro de control, toca +, luego \"Agregar un control\" y elige URnetwork."
  fr: "Ouvrez le Centre de contrôle, touchez +, puis Ajouter une commande, et choisissez URnetwork."
  he: "פתחו את מרכז הבקרה, הקישו על +, אחר כך על ״הוספת פקד״, ובחרו URnetwork."
  hi: "कंट्रोल सेंटर खोलें, + पर टैप करें, फिर कंट्रोल जोड़ें, और URnetwork चुनें।"
  id: "Buka Pusat Kontrol, ketuk +, lalu Tambahkan Kontrol, dan pilih URnetwork."
  it: "Apri Centro di Controllo, tocca +, poi Aggiungi un controllo, e scegli URnetwork."
  ja: "コントロールセンターを開き、＋をタップし、「コントロールを追加」をタップして URnetwork を選びます。"
  ko: "제어 센터를 열고 +를 탭한 다음 제어 항목 추가를 탭하고 URnetwork를 선택하세요."
  nl: "Open het Bedieningspaneel, tik op +, dan op Voeg een regelaar toe, en kies URnetwork."
  pl: "Otwórz centrum sterowania, stuknij +, potem Dodaj narzędzie, i wybierz URnetwork."
  pt: "Abra a Central de controlo, toque em +, depois em Adicionar um controlo, e escolha URnetwork."
  pt-BR: "Abra a Central de Controle, toque em +, depois em Adicionar um Controle, e escolha URnetwork."
  pt-PT: "Abra a Central de controlo, toque em +, depois em Adicionar um controlo, e escolha URnetwork."
  ru: "Откройте Пункт управления, коснитесь +, затем «Добавить элемент управления» и выберите URnetwork."
  sv: "Öppna Kontrollcenter, tryck på +, sedan Lägg till en kontroll, och välj URnetwork."
  sw: "Fungua Kituo cha Udhibiti, gusa +, kisha Ongeza Kidhibiti, na uchague URnetwork."
  th: "เปิดศูนย์ควบคุม แตะ + จากนั้นแตะเพิ่มตัวควบคุม แล้วเลือก URnetwork"
  uk: "Відкрийте Центр керування, торкніться +, потім «Додати елемент керування» й виберіть URnetwork."
  vi: "Mở Trung tâm điều khiển, chạm +, rồi Thêm điều khiển, và chọn URnetwork."
  zh: "打开控制中心，轻点 +，然后轻点“添加控制”，并选择 URnetwork。"
  zh-HK: "開啟控制中心，點按 +，然後點按「加入控制項目」，並選擇 URnetwork。"
