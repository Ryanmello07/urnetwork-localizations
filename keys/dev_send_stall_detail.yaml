description: "Developer tools screen: explanatory subtext under the 'send stall' control."
source: "How long an exit may stop delivering before it is dropped. Off waits 30s"
platforms:
  - android
localizations:
  ar: "المدة التي يمكن فيها للمخرج التوقف عن التسليم قبل إسقاطه. عند الإيقاف، ينتظر 30 ثانية"
  cs: "Jak dlouho smí výstup přestat doručovat, než bude vyřazen. Vypnuto čeká 30 s"
  de: "Wie lange ein Exit nichts ausliefern darf, bevor er verworfen wird. Aus: wartet 30 s"
  el: "Για πόσο μπορεί μια έξοδος να σταματήσει να παραδίδει πριν απορριφθεί. Η απενεργοποίηση περιμένει 30 δ"
  en: "How long an exit may stop delivering before it is dropped. Off waits 30s"
  es: "Cuánto tiempo puede una salida dejar de entregar antes de descartarla. Si está desactivado, espera 30 s"
  es-419: "Cuánto tiempo puede una salida dejar de entregar antes de descartarla. Si está desactivado, espera 30 s"
  es-MX: "Cuánto tiempo puede una salida dejar de entregar antes de descartarla. Si está desactivado, espera 30 s"
  fr: "Combien de temps une sortie peut cesser de livrer avant d’être écartée. Désactivé attend 30 s"
  he: "כמה זמן יציאה יכולה להפסיק למסור לפני שהיא מוסרת. כיבוי ממתין 30 שניות"
  hi: "कोई एग्ज़िट हटाए जाने से पहले कितनी देर तक डिलीवरी रोक सकता है। बंद करने पर 30 सेकंड इंतज़ार होता है"
  id: "Berapa lama sebuah exit boleh berhenti mengirim sebelum dibuang. Nonaktif menunggu 30 dtk"
  it: "Per quanto tempo un’uscita può smettere di consegnare prima di essere scartata. Disattivato attende 30 s"
  ja: "出口が配信を止めてから除外されるまでの時間。オフにすると 30 秒待ちます"
  ko: "출구가 전달을 멈춘 뒤 제외되기까지 허용되는 시간입니다. 끄면 30초를 기다립니다"
  nl: "Hoe lang een exit mag stoppen met afleveren voordat hij wordt verwijderd. Uit wacht 30 s"
  pl: "Jak długo wyjście może przestać dostarczać, zanim zostanie odrzucone. Wyłączenie czeka 30 s"
  pt: "Durante quanto tempo uma saída pode deixar de entregar antes de ser descartada. Desativado espera 30 s"
  pt-BR: "Por quanto tempo uma saída pode parar de entregar antes de ser descartada. Desativado espera 30 s"
  pt-PT: "Durante quanto tempo uma saída pode deixar de entregar antes de ser descartada. Desativado espera 30 s"
  ru: "Как долго выход может ничего не доставлять, прежде чем его отключат. Если выключено, ожидание 30 с"
  sv: "Hur länge en utgång får sluta leverera innan den tas bort. Av väntar 30 s"
  sw: "Muda ambao njia ya kutoka inaweza kuacha kuwasilisha kabla ya kuondolewa. Kuzima kunasubiri sekunde 30"
  th: "ทางออกหยุดส่งข้อมูลได้นานเท่าใดก่อนถูกตัดทิ้ง ปิดเพื่อรอ 30 วินาที"
  uk: "Як довго вихід може не доставляти, перш ніж його буде відкинуто. Вимкнення чекає 30 с"
  vi: "Một điểm thoát có thể ngừng chuyển dữ liệu trong bao lâu trước khi bị loại. Tắt sẽ chờ 30 giây"
  zh: "出口停止传送多长时间后会被丢弃。关闭时等待 30 秒"
  zh-HK: "出口停止傳送多久後會被捨棄。關閉時等待 30 秒"
