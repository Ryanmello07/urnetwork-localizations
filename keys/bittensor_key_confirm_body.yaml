description: "Key screen, the confirmation before the key leaves the app, where the user enters two of its words. "
source: "URnetwork can't get this key back. Earnings keep going to this address, and only the recovery phrase can move them."
deprecated:
  - apple
platforms:
  - apple
localizations:
  ar: "لا يستطيع URnetwork استعادة هذا المفتاح. تستمر الأرباح في الوصول إلى هذا العنوان، ولا يمكن نقلها إلا بعبارة النسخ الاحتياطي."
  cs: "URnetwork tento klíč nedokáže získat zpět. Výdělky dál chodí na tuto adresu a přesunout je může jen obnovovací fráze."
  de: "URnetwork kann diesen Schlüssel nicht zurückholen. Einnahmen gehen weiter an diese Adresse, und nur die Wiederherstellungsphrase kann sie bewegen."
  el: "Το URnetwork δεν μπορεί να ανακτήσει αυτό το κλειδί. Τα κέρδη συνεχίζουν να πηγαίνουν σε αυτή τη διεύθυνση και μόνο η φράση επαναφοράς μπορεί να τα μετακινήσει."
  en: "URnetwork can't get this key back. Earnings keep going to this address, and only the recovery phrase can move them."
  es: "URnetwork no puede recuperar esta clave. Las ganancias siguen llegando a esta dirección, y solo la frase de recuperación puede moverlas."
  es-419: "URnetwork no puede recuperar esta clave. Las ganancias siguen llegando a esta dirección, y solo la frase de recuperación puede moverlas."
  es-MX: "URnetwork no puede recuperar esta clave. Las ganancias siguen llegando a esta dirección, y solo la frase de recuperación puede moverlas."
  fr: "URnetwork ne peut pas récupérer cette clé. Les gains continuent d’arriver à cette adresse, et seule la phrase de sauvegarde permet de les déplacer."
  he: "URnetwork לא יכול להחזיר את המפתח הזה. הרווחים ממשיכים להגיע לכתובת הזו, ורק ביטוי השחזור יכול להעביר אותם."
  hi: "URnetwork यह कुंजी वापस नहीं ला सकता। कमाई इसी पते पर आती रहेगी, और केवल रिकवरी फ़्रेज़ से ही उसे कहीं और ले जाया जा सकता है।"
  id: "URnetwork tidak dapat mengambil kembali kunci ini. Penghasilan tetap dikirim ke alamat ini, dan hanya frasa cadangan yang dapat memindahkannya."
  it: "URnetwork non può recuperare questa chiave. I guadagni continuano ad arrivare a questo indirizzo e solo la frase di recupero può spostarli."
  ja: "URnetwork はこのキーを取り戻すことができません。収益は引き続きこのアドレスに支払われ、移動できるのは復元フレーズだけです。"
  ko: "URnetwork는 이 키를 되찾을 수 없습니다. 수익은 계속 이 주소로 들어오며, 복구 문구로만 옮길 수 있습니다."
  nl: "URnetwork kan deze sleutel niet terugkrijgen. Verdiensten blijven naar dit adres gaan, en alleen de herstelzin kan ze verplaatsen."
  pl: "URnetwork nie może odzyskać tego klucza. Zarobki nadal trafiają na ten adres i tylko fraza odzyskiwania może je przenieść."
  pt: "O URnetwork não consegue recuperar esta chave. Os ganhos continuam a ir para este endereço e só a frase de recuperação os pode mover."
  pt-BR: "O URnetwork não consegue recuperar esta chave. Os ganhos continuam indo para este endereço, e só a frase de recuperação pode movê-los."
  pt-PT: "O URnetwork não consegue recuperar esta chave. Os ganhos continuam a ir para este endereço e só a frase de recuperação os pode mover."
  ru: "URnetwork не сможет вернуть этот ключ. Заработок продолжает поступать на этот адрес, и переместить его можно только с помощью фразы восстановления."
  sv: "URnetwork kan inte få tillbaka den här nyckeln. Intäkter fortsätter att gå till den här adressen, och bara återställningsfrasen kan flytta dem."
  sw: "URnetwork haiwezi kurudisha ufunguo huu. Mapato yanaendelea kwenda kwenye anwani hii, na kifungu cha urejeshaji pekee ndicho kinachoweza kuyahamisha."
  th: "URnetwork ไม่สามารถเอาคีย์นี้คืนมาได้ รายได้ยังคงเข้าที่อยู่นี้ และมีเพียงวลีสำรองเท่านั้นที่ย้ายรายได้เหล่านั้นได้"
  uk: "URnetwork не зможе повернути цей ключ. Заробіток і далі надходить на цю адресу, і перемістити його можна лише за допомогою фрази відновлення."
  vi: "URnetwork không thể lấy lại khóa này. Thu nhập vẫn tiếp tục được chuyển đến địa chỉ này và chỉ cụm từ sao lưu mới có thể chuyển số thu nhập đó đi."
  zh: "URnetwork 无法找回此密钥。收益会继续支付到此地址，只有恢复短语才能转移这些收益。"
  zh-HK: "URnetwork 無法取回此金鑰。收益會繼續支付到此地址，只有復原短語才能轉移這些收益。"
