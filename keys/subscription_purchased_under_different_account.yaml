description: "The store purchase belongs to a different network than the one logged in — crediting must not go to the wrong account, so tell the user which way out exists. Apple: restore-purchases outcome (Shared/ViewModels/AppStoreSubscriptionManager.swift). Android: terminal `wrong_network` answer from the Play purchase report (google/PlanViewModel.kt); the purchase is still acknowledged so Play does not auto-refund it."
source: "Your subscription was purchased under a different account. Log in to that account to use it."
platforms:
  - android
  - apple
localizations:
  ar: "تم شراء اشتراكك باستخدام حساب مختلف. سجّل الدخول إلى ذلك الحساب لاستخدامه."
  cs: "Vaše předplatné bylo zakoupeno pod jiným účtem. Chcete-li ho používat, přihlaste se k tomuto účtu."
  de: "Dein Abo wurde mit einem anderen Konto gekauft. Melde dich bei diesem Konto an, um es zu nutzen."
  el: "Η συνδρομή σας αγοράστηκε με άλλον λογαριασμό. Συνδεθείτε σε εκείνον τον λογαριασμό για να τη χρησιμοποιήσετε."
  en: "Your subscription was purchased under a different account. Log in to that account to use it."
  es: "Tu suscripción se compró con otra cuenta. Inicia sesión en esa cuenta para usarla."
  es-419: "Tu suscripción se compró con otra cuenta. Inicia sesión en esa cuenta para usarla."
  es-MX: "Tu suscripción se compró con otra cuenta. Inicia sesión en esa cuenta para usarla."
  fr: "Votre abonnement a été acheté avec un autre compte. Connectez-vous à ce compte pour l’utiliser."
  he: "המינוי שלכם נרכש בחשבון אחר. התחברו לחשבון ההוא כדי להשתמש בו."
  hi: "आपकी सदस्यता किसी दूसरे खाते से खरीदी गई थी। इसका इस्तेमाल करने के लिए उस खाते में लॉग इन करें।"
  id: "Langganan Anda dibeli dengan akun lain. Masuk ke akun tersebut untuk menggunakannya."
  it: "Il tuo abbonamento è stato acquistato con un altro account. Accedi a quell’account per usarlo."
  ja: "サブスクリプションは別のアカウントで購入されています。利用するにはそのアカウントでログインしてください。"
  ko: "구독이 다른 계정으로 구매되었습니다. 사용하려면 그 계정으로 로그인하세요."
  nl: "Je abonnement is gekocht met een ander account. Log in op dat account om het te gebruiken."
  pl: "Twoja subskrypcja została kupiona na innym koncie. Zaloguj się na tamto konto, aby z niej korzystać."
  pt: "A sua assinatura foi comprada com outra conta. Inicie sessão nessa conta para a usar."
  pt-BR: "Sua assinatura foi comprada com outra conta. Entre nessa conta para usá-la."
  pt-PT: "A sua assinatura foi comprada com outra conta. Inicie sessão nessa conta para a usar."
  ru: "Ваша подписка была оформлена в другом аккаунте. Войдите в этот аккаунт, чтобы пользоваться ею."
  sv: "Din prenumeration köptes med ett annat konto. Logga in på det kontot för att använda den."
  sw: "Usajili wako ulinunuliwa kwa akaunti tofauti. Ingia kwenye akaunti hiyo ili kuutumia."
  th: "การสมัครสมาชิกของคุณซื้อไว้ด้วยบัญชีอื่น เข้าสู่ระบบบัญชีนั้นเพื่อใช้งาน"
  uk: "Вашу підписку придбано в іншому обліковому записі. Увійдіть у той обліковий запис, щоб користуватися нею."
  vi: "Gói đăng ký của bạn được mua bằng tài khoản khác. Hãy đăng nhập vào tài khoản đó để sử dụng."
  zh: "您的订阅是通过另一个账户购买的。请登录该账户以使用订阅。"
  zh-HK: "你的訂閱是透過另一個帳戶購買的。請登入該帳戶以使用訂閱。"
