description: "Developer screen: detail line of the automatic IP family option."
source: "Uses whichever family connects first, and routes around one that fails after connecting."
platforms:
  - android
localizations:
  ar: "يستخدم عائلة العناوين التي تتصل أولًا، ويتجنّب العائلة التي تفشل بعد الاتصال."
  cs: "Použije rodinu adres, která se připojí první, a obejde tu, která po připojení selže."
  de: "Nutzt die Adressfamilie, die sich zuerst verbindet, und umgeht eine, die nach dem Verbinden ausfällt."
  el: "Χρησιμοποιεί την οικογένεια διευθύνσεων που συνδέεται πρώτη και παρακάμπτει όποια αποτυγχάνει μετά τη σύνδεση."
  en: "Uses whichever family connects first, and routes around one that fails after connecting."
  es: "Usa la familia que se conecta primero y esquiva la que falla después de conectarse."
  es-419: "Usa la familia que se conecta primero y esquiva la que falla después de conectarse."
  es-MX: "Usa la familia que se conecta primero y esquiva la que falla después de conectarse."
  fr: "Utilise la famille qui se connecte en premier et contourne celle qui échoue après la connexion."
  he: "משתמש במשפחת הכתובות שמתחברת ראשונה, ועוקף משפחה שנכשלת אחרי ההתחברות."
  hi: "जो फ़ैमिली पहले कनेक्ट होती है उसका इस्तेमाल करता है, और कनेक्ट होने के बाद विफल होने वाली फ़ैमिली से बचकर चलता है।"
  id: "Memakai keluarga alamat yang terhubung lebih dulu, dan menghindari keluarga yang gagal setelah terhubung."
  it: "Usa la famiglia che si connette per prima e aggira quella che fallisce dopo la connessione."
  ja: "先に接続できたアドレスファミリーを使い、接続後に失敗するファミリーは迂回します。"
  ko: "먼저 연결되는 주소 체계를 사용하고, 연결 후 실패하는 체계는 우회합니다."
  nl: "Gebruikt de familie die als eerste verbindt en omzeilt een familie die na het verbinden faalt."
  pl: "Używa rodziny adresów, która połączy się pierwsza, i omija tę, która zawodzi po połączeniu."
  pt: "Usa a família que liga primeiro e contorna a que falha depois de ligar."
  pt-BR: "Usa a família que conecta primeiro e contorna a que falha depois de conectar."
  pt-PT: "Usa a família que liga primeiro e contorna a que falha depois de ligar."
  ru: "Использует семейство адресов, которое подключится первым, и обходит то, что отказывает после подключения."
  sv: "Använder den adressfamilj som ansluter först och går runt en som slutar fungera efter anslutningen."
  sw: "Hutumia familia ya anwani inayounganika kwanza, na huepuka ile inayoshindwa baada ya kuunganika."
  th: "ใช้กลุ่มที่อยู่ที่เชื่อมต่อได้ก่อน และเลี่ยงกลุ่มที่ล้มเหลวหลังเชื่อมต่อแล้ว"
  uk: "Використовує сімейство адрес, яке підключиться першим, і обходить те, що відмовляє після підключення."
  vi: "Dùng họ địa chỉ nào kết nối trước, và đi vòng qua họ bị lỗi sau khi kết nối."
  zh: "使用最先连上的地址族，并绕开连接后出现故障的地址族。"
  zh-HK: "使用最先連上的地址族，並繞過連線後出現故障的地址族。"
