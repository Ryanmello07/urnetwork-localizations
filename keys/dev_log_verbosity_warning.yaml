description: "Developer tools screen: privacy warning shown when detailed traffic logging is enabled."
source: "At Verbose and above the logs contain the destination IP addresses and ports of the traffic you send. Use “Export redacted logs” to share them; the raw bundle should not leave this device."
platforms:
  - android
localizations:
  ar: "بدءًا من مستوى «مفصّل» وما فوقه، تحتوي السجلات على عناوين IP والمنافذ الخاصة بوجهات حركة البيانات التي ترسلها. استخدم «تصدير السجلات المنقّحة» لمشاركتها؛ ولا ينبغي أن تغادر الحزمة الخام هذا الجهاز."
  cs: "Od úrovně Podrobné výš obsahují logy cílové IP adresy a porty provozu, který odesíláte. Ke sdílení použijte „Exportovat anonymizované logy“; nezpracovaný balíček by neměl opustit toto zařízení."
  de: "Ab „Ausführlich“ enthalten die Logs die Ziel-IP-Adressen und Ports des Datenverkehrs, den du sendest. Verwende „Bereinigte Logs exportieren“, um sie zu teilen; das Rohpaket sollte dieses Gerät nicht verlassen."
  el: "Από το Αναλυτικό και πάνω, τα αρχεία καταγραφής περιέχουν τις διευθύνσεις IP και τις θύρες προορισμού της κίνησης που στέλνετε. Χρησιμοποιήστε την «Εξαγωγή ανωνυμοποιημένων αρχείων καταγραφής» για να τα κοινοποιήσετε· το ακατέργαστο πακέτο δεν πρέπει να φύγει από αυτήν τη συσκευή."
  en: "At Verbose and above the logs contain the destination IP addresses and ports of the traffic you send. Use “Export redacted logs” to share them; the raw bundle should not leave this device."
  es: "A partir de «Detallado», los registros contienen las direcciones IP y los puertos de destino del tráfico que envías. Usa «Exportar registros anonimizados» para compartirlos; el paquete sin procesar no debe salir de este dispositivo."
  es-419: "A partir de \"Detallado\", los registros contienen las direcciones IP y los puertos de destino del tráfico que envías. Usa \"Exportar registros anonimizados\" para compartirlos; el paquete sin procesar no debe salir de este dispositivo."
  es-MX: "A partir de \"Detallado\", los registros contienen las direcciones IP y los puertos de destino del tráfico que envías. Usa \"Exportar registros anonimizados\" para compartirlos; el paquete sin procesar no debe salir de este dispositivo."
  fr: "À partir de « Détaillé », les journaux contiennent les adresses IP et les ports de destination du trafic que vous envoyez. Utilisez « Exporter les journaux expurgés » pour les partager ; le paquet brut ne doit pas quitter cet appareil."
  he: "מרמת מפורט ומעלה, הלוגים מכילים את כתובות ה-IP והפורטים של יעדי התעבורה שאתם שולחים. השתמשו ב\"ייצוא לוגים מושחרים\" כדי לשתף אותם; אסור שהחבילה הגולמית תצא מהמכשיר הזה."
  hi: "विस्तृत और उससे ऊपर के स्तर पर लॉग में आपके भेजे गए ट्रैफ़िक के गंतव्य IP पते और पोर्ट होते हैं। उन्हें शेयर करने के लिए \"संपादित लॉग एक्सपोर्ट करें\" का इस्तेमाल करें; रॉ बंडल इस डिवाइस से बाहर नहीं जाना चाहिए।"
  id: "Mulai dari Verbose ke atas, log berisi alamat IP dan port tujuan lalu lintas yang Anda kirim. Gunakan “Ekspor log yang disamarkan” untuk membagikannya; paket mentah tidak boleh keluar dari perangkat ini."
  it: "Da «Dettagliato» in su, i log contengono gli indirizzi IP e le porte di destinazione del traffico che invii. Usa «Esporta log oscurati» per condividerli; il pacchetto grezzo non deve lasciare questo dispositivo."
  ja: "「詳細」以上では、送信するトラフィックの宛先 IP アドレスとポートがログに含まれます。共有するには「匿名化したログをエクスポート」を使ってください。未加工のバンドルはこのデバイスの外に出さないでください。"
  ko: "상세 이상에서는 보내는 트래픽의 대상 IP 주소와 포트가 로그에 포함됩니다. 공유하려면 '가린 로그 내보내기'를 사용하세요. 원본 번들은 이 기기 밖으로 내보내지 않는 것이 좋습니다."
  nl: "Vanaf Uitgebreid bevatten de logs de IP-adressen en poorten van de bestemmingen van het verkeer dat je verstuurt. Gebruik ‘Geanonimiseerde logs exporteren’ om ze te delen; het onbewerkte pakket mag dit apparaat niet verlaten."
  pl: "Od poziomu Szczegółowa w górę logi zawierają docelowe adresy IP i porty ruchu, który wysyłasz. Aby je udostępnić, użyj opcji „Eksportuj zanonimizowane logi”; surowy pakiet nie powinien opuszczać tego urządzenia."
  pt: "A partir de \"Detalhado\", os logs contêm os endereços IP e as portas de destino do tráfego que envia. Use \"Exportar logs anonimizados\" para os partilhar; o pacote em bruto não deve sair deste dispositivo."
  pt-BR: "A partir de \"Detalhado\", os logs contêm os endereços IP e as portas de destino do tráfego que você envia. Use \"Exportar logs anonimizados\" para compartilhá-los; o pacote bruto não deve sair deste dispositivo."
  pt-PT: "A partir de \"Detalhado\", os logs contêm os endereços IP e as portas de destino do tráfego que envia. Use \"Exportar logs anonimizados\" para os partilhar; o pacote em bruto não deve sair deste dispositivo."
  ru: "Начиная с уровня «Подробный», логи содержат IP-адреса и порты назначения отправляемого вами трафика. Чтобы поделиться ими, используйте «Экспортировать обезличенные логи»; необработанный пакет не должен покидать это устройство."
  sv: "Från Utförlig och uppåt innehåller loggarna destinationsadresser och portar för trafiken du skickar. Använd ”Exportera maskerade loggar” för att dela dem; det råa paketet bör inte lämna den här enheten."
  sw: "Kuanzia kiwango cha Kwa kina na zaidi, kumbukumbu zina anwani za IP na milango ya malengo ya trafiki unayotuma. Tumia \"Hamisha kumbukumbu zilizofichwa taarifa\" ili kuzishiriki; kifurushi ghafi hakipaswi kutoka kwenye kifaa hiki."
  th: "ตั้งแต่ระดับละเอียดขึ้นไป ล็อกจะมีที่อยู่ IP และพอร์ตปลายทางของทราฟฟิกที่คุณส่ง ใช้ “ส่งออกล็อกที่ปกปิดข้อมูล” เพื่อแชร์ ชุดข้อมูลดิบไม่ควรออกไปจากอุปกรณ์นี้"
  uk: "Починаючи з рівня «Детально», логи містять IP-адреси та порти призначення трафіку, який ви надсилаєте. Щоб поділитися ними, використовуйте «Експортувати знеособлені логи»; необроблений пакет не повинен залишати цей пристрій."
  vi: "Từ mức Chi tiết trở lên, nhật ký chứa địa chỉ IP và cổng đích của lưu lượng bạn gửi đi. Hãy dùng “Xuất nhật ký đã ẩn thông tin” để chia sẻ; gói thô không nên rời khỏi thiết bị này."
  zh: "在“详细”及以上级别，日志会包含您所发送流量的目标 IP 地址和端口。如需分享，请使用“导出脱敏日志”；原始诊断包不应离开此设备。"
  zh-HK: "在「詳細」或以上級別，日誌會包含你所傳送流量的目標 IP 地址和連接埠。如需分享，請使用「匯出已遮蔽的日誌」；原始套件不應離開此裝置。"
