description: "Developer tools screen: explanatory subtext under the 'flows rebound' control."
source: "Flows moved to a warm exit inside a removal; accepted means the server took the path change without a re-dial"
platforms:
  - android
  - linux
  - apple
localizations:
  ar: "تدفقات نُقلت إلى مخرج جاهز أثناء عملية إزالة؛ «مقبول» يعني أن الخادم قبل تغيير المسار دون إعادة اتصال"
  cs: "Toky přesunuté během odstranění na teplý výstup; přijaté znamená, že server změnu cesty přijal bez nového připojení"
  de: "Flows, die während einer Entfernung auf einen warmen Exit verschoben wurden; akzeptiert heißt, der Server hat den Pfadwechsel ohne neuen Verbindungsaufbau übernommen"
  el: "Ροές που μεταφέρθηκαν σε ζεστή έξοδο κατά τη διάρκεια μιας αφαίρεσης· «αποδεκτή» σημαίνει ότι ο διακομιστής δέχτηκε την αλλαγή διαδρομής χωρίς νέα σύνδεση"
  en: "Flows moved to a warm exit inside a removal; accepted means the server took the path change without a re-dial"
  es: "Flujos trasladados a una salida activa durante una eliminación; «aceptado» significa que el servidor asumió el cambio de ruta sin volver a conectar"
  es-419: "Flujos trasladados a una salida activa durante una eliminación; \"aceptado\" significa que el servidor asumió el cambio de ruta sin volver a conectar"
  es-MX: "Flujos trasladados a una salida activa durante una eliminación; \"aceptado\" significa que el servidor asumió el cambio de ruta sin volver a conectar"
  fr: "Flux déplacés vers une sortie active pendant un retrait ; « accepté » signifie que le serveur a accepté le changement de chemin sans nouvelle connexion"
  he: "זרימות שהועברו ליציאה חמה במהלך הסרה; התקבלו פירושו שהשרת קיבל את שינוי הנתיב בלי חיוג מחדש"
  hi: "निष्कासन के दौरान किसी तैयार एग्ज़िट पर ले जाए गए फ़्लो; स्वीकृत का मतलब है कि सर्वर ने बिना दोबारा डायल किए पथ बदलाव मान लिया"
  id: "Aliran yang dipindahkan ke exit siaga selama penghapusan; diterima berarti server menerima perubahan jalur tanpa dial ulang"
  it: "Flussi spostati su un’uscita attiva durante una rimozione; «accettato» significa che il server ha accettato il cambio di percorso senza riconnettersi"
  ja: "除外中にウォームな出口へ移されたフロー。「受理」は、サーバーが再接続なしで経路の変更を受け入れたことを意味します"
  ko: "제외 중에 준비된 출구로 옮겨진 플로우입니다. 수락됨은 서버가 다시 연결하지 않고 경로 변경을 받아들였다는 뜻입니다"
  nl: "Flows die tijdens een verwijdering naar een warme exit zijn verplaatst; geaccepteerd betekent dat de server de padwijziging zonder nieuwe verbinding accepteerde"
  pl: "Przepływy przeniesione na ciepłe wyjście w trakcie usuwania; zaakceptowane oznacza, że serwer przyjął zmianę ścieżki bez ponownego połączenia"
  pt: "Fluxos movidos para uma saída ativa durante uma remoção; \"aceite\" significa que o servidor aceitou a mudança de caminho sem voltar a ligar"
  pt-BR: "Fluxos movidos para uma saída ativa durante uma remoção; \"aceito\" significa que o servidor aceitou a mudança de caminho sem reconectar"
  pt-PT: "Fluxos movidos para uma saída ativa durante uma remoção; \"aceite\" significa que o servidor aceitou a mudança de caminho sem voltar a ligar"
  ru: "Потоки, перенесённые на «тёплый» выход во время удаления; «принято» означает, что сервер принял смену пути без повторного соединения"
  sv: "Flöden som flyttades till en varm utgång under en borttagning; accepterade betyder att servern tog sökvägsbytet utan ny uppringning"
  sw: "Mitiririko iliyohamishiwa njia ya kutoka iliyo tayari wakati wa uondoaji; iliyokubaliwa inamaanisha seva ilikubali mabadiliko ya njia bila kupiga upya"
  th: "โฟลว์ที่ย้ายไปยังทางออกที่พร้อมใช้งานระหว่างการลบ ยอมรับหมายถึงเซิร์ฟเวอร์ยอมรับการเปลี่ยนเส้นทางโดยไม่ต้องเชื่อมต่อใหม่"
  uk: "Потоки, перенесені на теплий вихід під час видалення; прийнято означає, що сервер прийняв зміну шляху без повторного з’єднання"
  vi: "Các luồng được chuyển sang một điểm thoát đang sẵn sàng trong lúc loại bỏ; được chấp nhận nghĩa là máy chủ đã chấp nhận thay đổi đường đi mà không cần quay số lại"
  zh: "在移除过程中转移到预热出口的流；“已接受”表示服务器在未重新拨号的情况下接受了路径变更"
  zh-HK: "在移除過程中轉移到預熱出口的流；「已接受」表示伺服器在沒有重新撥號的情況下接受了路徑變更"
