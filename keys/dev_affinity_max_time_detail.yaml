description: "Developer tools: strict healthy-donor age cap, disabled values, default and unaffected existing connections/pins."
source: "For ordinary new connections, reuse only a healthy IP/domain exit while the original connection's age since creation is below this limit. Default: 1 minute. Zero or negative disables reuse. Warned or unhealthy exits always race. Existing connections and explicit pins are unchanged."
platforms:
  - android
localizations:
  ar: "للاتصالات الجديدة العادية، أعد استخدام مخرج IP/النطاق السليم فقط إذا كان عمر اتصاله الأصلي منذ إنشائه أقل من هذا الحد. الافتراضي: دقيقة واحدة. الصفر أو القيمة السالبة يعطّلان إعادة الاستخدام. المخارج المحذّر منها أو غير السليمة تدخل السباق دائمًا. الاتصالات الحالية والتثبيتات الصريحة لا تتغير."
  cs: "U běžných nových připojení znovu použijte jen zdravý výstup IP/domény, pokud je stáří původního připojení od jeho vytvoření pod tímto limitem. Výchozí: 1 minuta. Nula nebo záporná hodnota opětovné použití vypne. Výstupy s varováním nebo nezdravé výstupy vždy přejdou do závodu. Stávající připojení a explicitní připnutí se nemění."
  de: "Für gewöhnliche neue Verbindungen nur einen gesunden IP-/Domain-Exit wiederverwenden, wenn seit der Erstellung der ursprünglichen Verbindung weniger Zeit als dieses Limit vergangen ist. Standard: 1 Minute. Null oder negative Werte deaktivieren die Wiederverwendung. Bei gewarnten oder ungesunden Exits wird immer ein Race gestartet. Bestehende Verbindungen und explizite Pins bleiben unverändert."
  el: "Για συνηθισμένες νέες συνδέσεις, χρησιμοποιήστε ξανά μόνο μια υγιή έξοδο IP/τομέα εφόσον ο χρόνος από τη δημιουργία της αρχικής σύνδεσης είναι μικρότερος από αυτό το όριο. Προεπιλογή: 1 λεπτό. Το μηδέν ή μια αρνητική τιμή απενεργοποιεί την επαναχρησιμοποίηση. Οι έξοδοι με προειδοποίηση ή κακή κατάσταση οδηγούν πάντα σε αγώνα. Οι υπάρχουσες συνδέσεις και οι ρητές καρφιτσώσεις δεν αλλάζουν."
  en: "For ordinary new connections, reuse only a healthy IP/domain exit while the original connection's age since creation is below this limit. Default: 1 minute. Zero or negative disables reuse. Warned or unhealthy exits always race. Existing connections and explicit pins are unchanged."
  es: "Para conexiones nuevas normales, reutiliza solo una salida de IP/dominio en buen estado si la edad de la conexión original desde su creación es menor que este límite. Predeterminado: 1 minuto. Cero o un valor negativo desactiva la reutilización. Las salidas con advertencias o en mal estado siempre pasan a la carrera. Las conexiones existentes y las fijaciones explícitas no cambian."
  es-419: "Para conexiones nuevas normales, reutiliza solo una salida de IP/dominio en buen estado si la edad de la conexión original desde su creación es menor que este límite. Predeterminado: 1 minuto. Cero o un valor negativo desactiva la reutilización. Las salidas con advertencias o en mal estado siempre pasan a la carrera. Las conexiones existentes y las fijaciones explícitas no cambian."
  es-MX: "Para conexiones nuevas normales, reutiliza solo una salida de IP/dominio en buen estado si la edad de la conexión original desde su creación es menor que este límite. Predeterminado: 1 minuto. Cero o un valor negativo desactiva la reutilización. Las salidas con advertencias o en mal estado siempre pasan a la carrera. Las conexiones existentes y las fijaciones explícitas no cambian."
  fr: "Pour les nouvelles connexions ordinaires, réutilise uniquement une sortie IP/domaine saine si le temps écoulé depuis la création de la connexion d’origine est inférieur à cette limite. Valeur par défaut : 1 minute. Zéro ou une valeur négative désactive la réutilisation. Une sortie avertie ou défaillante déclenche toujours une course. Les connexions existantes et les épinglages explicites ne changent pas."
  he: "בחיבורים חדשים רגילים, שימוש חוזר מותר רק ביציאת IP/דומיין תקינה אם הזמן מאז יצירת החיבור המקורי קצר ממגבלה זו. ברירת מחדל: דקה אחת. אפס או ערך שלילי משביתים שימוש חוזר. יציאות עם אזהרה או לא תקינות תמיד מובילות למרוץ. חיבורים קיימים והצמדות מפורשות אינם משתנים."
  hi: "सामान्य नए कनेक्शन के लिए केवल स्वस्थ IP/डोमेन एग्ज़िट का दोबारा उपयोग करें, यदि मूल कनेक्शन बनने के बाद बीता समय इस सीमा से कम हो। डिफ़ॉल्ट: 1 मिनट। शून्य या ऋणात्मक मान दोबारा उपयोग बंद करता है। चेतावनी वाले या अस्वस्थ एग्ज़िट हमेशा नई रेस करवाते हैं। मौजूदा कनेक्शन और स्पष्ट पिन नहीं बदलते।"
  id: "Untuk koneksi baru biasa, gunakan kembali hanya exit IP/domain yang sehat jika usia sejak pembuatan koneksi awal masih di bawah batas ini. Default: 1 menit. Nol atau nilai negatif menonaktifkan penggunaan kembali. Exit yang diperingatkan atau tidak sehat selalu memicu balapan. Koneksi yang ada dan pin eksplisit tidak berubah."
  it: "Per le nuove connessioni ordinarie, riutilizza solo un’uscita IP/dominio sana se il tempo dalla creazione della connessione originale è inferiore a questo limite. Predefinito: 1 minuto. Zero o un valore negativo disattiva il riutilizzo. Le uscite con avvisi o non sane avviano sempre una gara. Le connessioni esistenti e i blocchi espliciti non cambiano."
  ja: "通常の新しい接続では、元の接続の作成からの経過時間がこの上限未満の、正常な IP／ドメインの出口だけを再利用します。デフォルトは1分です。0または負の値で再利用を無効にします。警告のある出口や異常な出口では常にレースを行います。既存の接続と明示的な固定は変更しません。"
  ko: "일반적인 새 연결에서는 원래 연결 생성 후 경과 시간이 이 한도보다 짧은 정상 IP/도메인 출구만 재사용합니다. 기본값은 1분입니다. 0 또는 음수는 재사용을 끕니다. 경고가 있거나 비정상인 출구는 항상 새 경쟁을 시작합니다. 기존 연결과 명시적 고정은 변경하지 않습니다."
  nl: "Hergebruik voor gewone nieuwe verbindingen alleen een gezonde IP-/domeinexit als de tijd sinds het aanmaken van de oorspronkelijke verbinding korter is dan deze limiet. Standaard: 1 minuut. Nul of een negatieve waarde schakelt hergebruik uit. Gewaarschuwde of ongezonde exits leiden altijd tot een race. Bestaande verbindingen en expliciete pins blijven ongewijzigd."
  pl: "Dla zwykłych nowych połączeń używaj ponownie tylko zdrowego wyjścia IP/domeny, jeśli czas od utworzenia pierwotnego połączenia jest krótszy niż ten limit. Domyślnie: 1 minuta. Zero lub wartość ujemna wyłącza ponowne użycie. Wyjścia z ostrzeżeniem lub niesprawne zawsze uruchamiają wyścig. Istniejące połączenia i jawne przypięcia nie zmieniają się."
  pt: "Para novas ligações comuns, reutiliza apenas uma saída IP/domínio saudável se o tempo desde a criação da ligação original for inferior a este limite. Predefinição: 1 minuto. Zero ou um valor negativo desativa a reutilização. Saídas com avisos ou sem saúde iniciam sempre uma corrida. As ligações existentes e as fixações explícitas não mudam."
  pt-BR: "Para novas conexões comuns, reutilize apenas uma saída IP/domínio saudável se o tempo desde a criação da conexão original for inferior a este limite. Padrão: 1 minuto. Zero ou um valor negativo desativa a reutilização. Saídas com avisos ou sem saúde sempre iniciam uma corrida. Conexões existentes e fixações explícitas não mudam."
  pt-PT: "Para novas ligações comuns, reutiliza apenas uma saída IP/domínio saudável se o tempo desde a criação da ligação original for inferior a este limite. Predefinição: 1 minuto. Zero ou um valor negativo desativa a reutilização. Saídas com avisos ou sem saúde iniciam sempre uma corrida. As ligações existentes e as fixações explícitas não mudam."
  ru: "Для обычных новых соединений повторно используйте только исправный выход IP/домена, если с момента создания исходного соединения прошло меньше времени, чем этот предел. По умолчанию: 1 минута. Ноль или отрицательное значение отключает повторное использование. Выходы с предупреждением или неисправные выходы всегда запускают гонку. Существующие соединения и явные закрепления не меняются."
  sv: "För vanliga nya anslutningar återanvänds bara en frisk IP-/domänutgång om tiden sedan den ursprungliga anslutningen skapades är kortare än denna gräns. Standard: 1 minut. Noll eller ett negativt värde stänger av återanvändning. Varnade eller osunda utgångar leder alltid till ett lopp. Befintliga anslutningar och uttryckliga fästningar ändras inte."
  sw: "Kwa miunganisho mipya ya kawaida, tumia tena njia ya kutoka ya IP/kikoa iliyo salama tu ikiwa muda tangu kuundwa kwa muunganisho wa awali ni chini ya kikomo hiki. Chaguomsingi: dakika 1. Sifuri au thamani hasi huzima utumiaji tena. Njia zilizoonywa au zisizo salama daima huanzisha mashindano. Miunganisho iliyopo na ubanaji wazi havibadiliki."
  th: "สำหรับการเชื่อมต่อใหม่ทั่วไป ใช้ทางออก IP/โดเมนที่ปกติซ้ำได้เฉพาะเมื่อเวลาตั้งแต่สร้างการเชื่อมต่อดั้งเดิมยังน้อยกว่าขีดจำกัดนี้ ค่าเริ่มต้น: 1 นาที ค่าศูนย์หรือค่าลบปิดการใช้ซ้ำ ทางออกที่มีคำเตือนหรือไม่ปกติจะเริ่มการแข่งใหม่เสมอ การเชื่อมต่อที่มีอยู่และการปักหมุดที่ระบุไว้ไม่เปลี่ยนแปลง"
  uk: "Для звичайних нових з’єднань повторно використовуйте лише справний вихід IP/домену, якщо від створення початкового з’єднання минуло менше часу, ніж ця межа. Типово: 1 хвилина. Нуль або від’ємне значення вимикає повторне використання. Виходи з попередженням або несправні виходи завжди запускають перегони. Наявні з’єднання та явні закріплення не змінюються."
  vi: "Với kết nối mới thông thường, chỉ dùng lại điểm thoát IP/tên miền khỏe mạnh nếu thời gian kể từ khi tạo kết nối ban đầu còn nhỏ hơn giới hạn này. Mặc định: 1 phút. Số không hoặc giá trị âm tắt việc dùng lại. Điểm thoát có cảnh báo hoặc không khỏe luôn kích hoạt cuộc đua mới. Kết nối hiện có và các ghim rõ ràng không thay đổi."
  zh: "对于普通新连接，仅在原始连接创建至今的时间未达到此上限时，复用健康的 IP／域名出口。默认：1 分钟。零或负值禁用复用。出现警告或不健康的出口始终触发重新竞速。现有连接和显式固定不变。"
  zh-HK: "對於一般新連線，僅在原始連線建立至今的時間未達此上限時，重用健康的 IP／網域出口。預設：1 分鐘。零或負值停用重用。出現警告或不健康的出口一律觸發重新競速。現有連線和明確固定不變。"
