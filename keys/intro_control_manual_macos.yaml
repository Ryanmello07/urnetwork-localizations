description: "How to add the quick connect control on macOS."
source: "Open Control Center, choose Edit Controls, and add URnetwork."
platforms:
  - apple
localizations:
  ar: "افتح مركز التحكم، واختر «تعديل عناصر التحكم»، ثم أضف URnetwork."
  cs: "Otevřete Ovládací centrum, vyberte Upravit ovládací prvky a přidejte URnetwork."
  de: "Öffne das Kontrollzentrum, wähle „Steuerelemente bearbeiten“ und füge URnetwork hinzu."
  el: "Ανοίξτε το Κέντρο ελέγχου, επιλέξτε Επεξεργασία χειριστηρίων και προσθέστε το URnetwork."
  en: "Open Control Center, choose Edit Controls, and add URnetwork."
  es: "Abre el Centro de control, elige «Editar controles» y añade URnetwork."
  es-419: "Abre el Centro de control, elige \"Editar controles\" y agrega URnetwork."
  es-MX: "Abre el Centro de control, elige \"Editar controles\" y agrega URnetwork."
  fr: "Ouvrez le Centre de contrôle, choisissez Modifier les commandes et ajoutez URnetwork."
  he: "פתחו את מרכז הבקרה, בחרו ״עריכת פקדים״ והוסיפו את URnetwork."
  hi: "कंट्रोल सेंटर खोलें, कंट्रोल संपादित करें चुनें, और URnetwork जोड़ें।"
  id: "Buka Pusat Kontrol, pilih Edit Kontrol, dan tambahkan URnetwork."
  it: "Apri Centro di Controllo, scegli Modifica controlli e aggiungi URnetwork."
  ja: "コントロールセンターを開き、「コントロールを編集」を選んで URnetwork を追加します。"
  ko: "제어 센터를 열고 제어 항목 편집을 선택한 다음 URnetwork를 추가하세요."
  nl: "Open het Bedieningspaneel, kies Wijzig regelaars en voeg URnetwork toe."
  pl: "Otwórz centrum sterowania, wybierz Edytuj narzędzia i dodaj URnetwork."
  pt: "Abra a Central de controlo, escolha Editar controlos e adicione URnetwork."
  pt-BR: "Abra a Central de Controle, escolha Editar Controles e adicione URnetwork."
  pt-PT: "Abra a Central de controlo, escolha Editar controlos e adicione URnetwork."
  ru: "Откройте Пункт управления, выберите «Изменить элементы управления» и добавьте URnetwork."
  sv: "Öppna Kontrollcenter, välj Redigera kontroller och lägg till URnetwork."
  sw: "Fungua Kituo cha Udhibiti, chagua Hariri Vidhibiti, na uongeze URnetwork."
  th: "เปิดศูนย์ควบคุม เลือกแก้ไขตัวควบคุม แล้วเพิ่ม URnetwork"
  uk: "Відкрийте Центр керування, виберіть «Редагувати елементи керування» й додайте URnetwork."
  vi: "Mở Trung tâm điều khiển, chọn Sửa điều khiển và thêm URnetwork."
  zh: "打开控制中心，选择“编辑控制”，然后添加 URnetwork。"
  zh-HK: "開啟控制中心，選擇「編輯控制項目」，然後加入 URnetwork。"
