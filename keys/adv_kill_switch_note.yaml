description: "Settings: explanation under the kill switch switch."
source: "If the tunnel drops unexpectedly, block this device's traffic instead of letting it out unprotected."
platforms:
  - linux
  - windows
localizations:
  ar: "إذا انقطع النفق فجأة، فاحجب حركة هذا الجهاز بدلًا من تركها تخرج دون حماية."
  cs: "Pokud tunel nečekaně spadne, zablokovat provoz tohoto zařízení místo toho, aby odcházel nechráněný."
  de: "Wenn der Tunnel unerwartet abbricht, den Datenverkehr dieses Geräts blockieren, statt ihn ungeschützt hinauszulassen."
  el: "Αν η σήραγγα πέσει απροσδόκητα, αποκλείστε την κίνηση αυτής της συσκευής αντί να την αφήσετε να βγει απροστάτευτη."
  en: "If the tunnel drops unexpectedly, block this device's traffic instead of letting it out unprotected."
  es: "Si el túnel se cae de forma inesperada, bloquea el tráfico de este dispositivo en vez de dejarlo salir sin protección."
  es-MX: "Si el túnel se cae de forma inesperada, bloquea el tráfico de este dispositivo en vez de dejarlo salir sin protección."
  fr: "Si le tunnel tombe de façon inattendue, bloquer le trafic de cet appareil au lieu de le laisser sortir sans protection."
  he: "אם המנהרה נופלת במפתיע, חסום את התעבורה של המכשיר הזה במקום לתת לה לצאת ללא הגנה."
  hi: "यदि टनल अप्रत्याशित रूप से गिर जाए, तो ट्रैफ़िक को असुरक्षित बाहर जाने देने के बजाय इस डिवाइस का ट्रैफ़िक रोक दें।"
  id: "Jika terowongan putus tiba-tiba, blokir lalu lintas perangkat ini alih-alih membiarkannya keluar tanpa perlindungan."
  it: "Se il tunnel cade all’improvviso, blocca il traffico di questo dispositivo invece di lasciarlo uscire senza protezione."
  ja: "トンネルが予期せず切れた場合、保護なしで通信を外に出す代わりに、このデバイスの通信を遮断します。"
  ko: "터널이 예기치 않게 끊어지면 트래픽을 보호 없이 내보내는 대신 이 기기의 트래픽을 차단합니다."
  nl: "Als de tunnel onverwacht wegvalt, het verkeer van dit apparaat blokkeren in plaats van het onbeschermd naar buiten te laten."
  pl: "Jeśli tunel nieoczekiwanie się zerwie, zablokuj ruch tego urządzenia zamiast wypuszczać go bez ochrony."
  pt: "Se o túnel cair de forma inesperada, bloqueia o tráfego deste dispositivo em vez de deixá-lo sair sem proteção."
  pt-BR: "Se o túnel cair de forma inesperada, bloqueia o tráfego deste dispositivo em vez de deixá-lo sair sem proteção."
  pt-PT: "Se o túnel cair inesperadamente, bloqueia o tráfego deste dispositivo em vez de o deixar sair sem proteção."
  ru: "Если туннель неожиданно оборвётся, блокировать трафик этого устройства вместо того, чтобы выпускать его без защиты."
  sv: "Om tunneln faller oväntat, blockera den här enhetens trafik i stället för att släppa ut den oskyddad."
  sw: "Ikiwa handaki litakatika ghafla, zuia trafiki ya kifaa hiki badala ya kuiacha itoke bila ulinzi."
  th: "หากอุโมงค์หลุดโดยไม่คาดคิด ให้บล็อกทราฟฟิกของอุปกรณ์นี้แทนที่จะปล่อยให้ออกไปโดยไม่มีการป้องกัน"
  uk: "Якщо тунель несподівано обірветься, блокувати трафік цього пристрою замість того, щоб випускати його без захисту."
  vi: "Nếu đường hầm bị rớt bất ngờ, chặn lưu lượng của thiết bị này thay vì để nó thoát ra mà không được bảo vệ."
  zh: "如果隧道意外断开，则阻断此设备的流量，而不是让其在无保护的情况下流出。"
  zh-HK: "如果隧道意外中斷，則封鎖此裝置的流量，而不是讓其在無保護的情況下流出。"
