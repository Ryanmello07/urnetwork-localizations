description: "Earnings, the settlement v2 tile and the claim sheet, after the user tapped Claim now: the claim is in line and goes out before the automatic ones, as long as the day's gas budget lasts."
source: "Claim now is queued. URnetwork sends it first, within today's budget."
platforms:
  - apple
  - android
localizations:
  ar: "«المطالبة الآن» في قائمة الانتظار. سيرسلها URnetwork أولًا، ضمن ميزانية اليوم."
  cs: "„Vyzvednout hned“ je ve frontě. URnetwork ho odešle jako první, v rámci dnešního rozpočtu."
  de: "„Jetzt einlösen“ ist in der Warteschlange. URnetwork sendet es zuerst, im Rahmen des heutigen Budgets."
  el: "Το «Διεκδίκηση τώρα» είναι στην ουρά. Το URnetwork θα το στείλει πρώτο, εντός του σημερινού προϋπολογισμού."
  en: "Claim now is queued. URnetwork sends it first, within today's budget."
  es: "«Reclamar ahora» está en cola. URnetwork lo envía primero, dentro del presupuesto de hoy."
  es-419: "“Reclamar ahora” está en cola. URnetwork lo envía primero, dentro del presupuesto de hoy."
  es-MX: "“Reclamar ahora” está en cola. URnetwork lo envía primero, dentro del presupuesto de hoy."
  fr: "« Réclamer maintenant » est en file d’attente. URnetwork l’envoie en premier, dans la limite du budget du jour."
  he: "«מימוש עכשיו» נמצא בתור. URnetwork ישלח אותו ראשון, במסגרת התקציב של היום."
  hi: "“अभी दावा करें” कतार में है। URnetwork इसे आज के बजट के भीतर सबसे पहले भेजता है।"
  id: "“Klaim sekarang” sudah masuk antrean. URnetwork mengirimnya lebih dulu, dalam batas anggaran hari ini."
  it: "«Riscatta ora» è in coda. URnetwork lo invia per primo, nei limiti del budget di oggi."
  ja: "「今すぐ受け取る」は順番待ちです。URnetwork が本日の予算の範囲内で優先して送信します。"
  ko: "“지금 받기”가 대기열에 있습니다. URnetwork가 오늘 예산 범위 안에서 먼저 보냅니다."
  nl: "‘Nu opeisen’ staat in de wachtrij. URnetwork verstuurt het als eerste, binnen het budget van vandaag."
  pl: "„Odbierz teraz” jest w kolejce. URnetwork wyśle to jako pierwsze, w ramach dzisiejszego budżetu."
  pt: "«Reivindicar agora» está na fila. O URnetwork envia-o primeiro, dentro do orçamento de hoje."
  pt-BR: "“Resgatar agora” está na fila. O URnetwork o envia primeiro, dentro do orçamento de hoje."
  pt-PT: "«Reivindicar agora» está na fila. O URnetwork envia-o primeiro, dentro do orçamento de hoje."
  ru: "«Получить сейчас» в очереди. URnetwork отправит этот запрос первым, в пределах сегодняшнего бюджета."
  sv: "”Hämta ut nu” står i kö. URnetwork skickar det först, inom dagens budget."
  sw: "“Dai sasa” liko kwenye foleni. URnetwork italituma kwanza, ndani ya bajeti ya leo."
  th: "“รับตอนนี้” อยู่ในคิวแล้ว URnetwork จะส่งรายการนี้ก่อน ภายในงบประมาณของวันนี้"
  uk: "«Отримати зараз» у черзі. URnetwork надішле цей запит першим, у межах сьогоднішнього бюджету."
  vi: "“Nhận ngay” đã vào hàng chờ. URnetwork sẽ gửi yêu cầu này trước, trong phạm vi ngân sách hôm nay."
  zh: "“立即领取”已排队。URnetwork 会在今日预算内优先发送。"
  zh-HK: "「立即領取」已排隊。URnetwork 會在今日預算內優先傳送。"
