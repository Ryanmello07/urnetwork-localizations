description: "Error: the pasted or returned Bittensor signature is not a 64-byte hex signature."
source: "That is not a valid signature. Paste the full 0x signature from your wallet."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "هذا ليس توقيعًا صالحًا. الصق توقيع 0x الكامل من محفظتك."
  cs: "To není platný podpis. Vložte celý podpis 0x ze své peněženky."
  de: "Das ist keine gültige Signatur. Füge die vollständige 0x-Signatur aus deiner Wallet ein."
  el: "Αυτή δεν είναι έγκυρη υπογραφή. Επικολλήστε ολόκληρη την υπογραφή 0x από το πορτοφόλι σας."
  en: "That is not a valid signature. Paste the full 0x signature from your wallet."
  es: "No es una firma válida. Pega la firma 0x completa de tu billetera."
  es-419: "No es una firma válida. Pega la firma 0x completa de tu billetera."
  es-MX: "No es una firma válida. Pega la firma 0x completa de tu cartera."
  fr: "Ce n’est pas une signature valide. Collez la signature 0x complète de votre portefeuille."
  he: "זו אינה חתימה תקפה. הדביקו את חתימת ה-0x המלאה מהארנק שלכם."
  hi: "यह मान्य हस्ताक्षर नहीं है। अपने वॉलेट से पूरा 0x हस्ताक्षर पेस्ट करें।"
  id: "Itu bukan tanda tangan yang valid. Tempel tanda tangan 0x lengkap dari dompet Anda."
  it: "Questa non è una firma valida. Incolla la firma 0x completa dal tuo portafoglio."
  ja: "有効な署名ではありません。ウォレットの 0x 署名全体を貼り付けてください。"
  ko: "유효한 서명이 아닙니다. 지갑의 0x 서명 전체를 붙여 넣으세요."
  nl: "Dat is geen geldige handtekening. Plak de volledige 0x-handtekening uit je wallet."
  pl: "To nie jest prawidłowy podpis. Wklej pełny podpis 0x ze swojego portfela."
  pt: "Essa não é uma assinatura válida. Cole a assinatura 0x completa da sua carteira."
  pt-BR: "Essa não é uma assinatura válida. Cole a assinatura 0x completa da sua carteira."
  pt-PT: "Essa não é uma assinatura válida. Cole a assinatura 0x completa da sua carteira."
  ru: "Это недействительная подпись. Вставьте полную подпись 0x из вашего кошелька."
  sv: "Det är ingen giltig signatur. Klistra in hela 0x-signaturen från din plånbok."
  sw: "Hiyo si sahihi halali. Bandika sahihi kamili ya 0x kutoka kwenye pochi yako."
  th: "ลายเซ็นนี้ไม่ถูกต้อง วางลายเซ็น 0x แบบเต็มจากกระเป๋าเงินของคุณ"
  uk: "Це недійсний підпис. Вставте повний підпис 0x зі свого гаманця."
  vi: "Đó không phải là chữ ký hợp lệ. Hãy dán đầy đủ chữ ký 0x từ ví của bạn."
  zh: "这不是有效的签名。请粘贴钱包中完整的 0x 签名。"
  zh-HK: "這不是有效的簽名。請貼上錢包中完整的 0x 簽名。"
