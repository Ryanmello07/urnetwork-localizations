description: "Developer screen: detail line of the IPv6-only option."
source: "Control-plane connections use IPv6 only. Turn this off if the app cannot reach the server."
platforms:
  - android
localizations:
  ar: "تستخدم اتصالات التحكم IPv6 فقط. أوقف هذا الخيار إذا تعذّر على التطبيق الوصول إلى الخادم."
  cs: "Řídicí připojení používají jen IPv6. Vypněte tuto volbu, pokud se aplikace nedostane k serveru."
  de: "Steuerverbindungen nutzen nur IPv6. Schalte das aus, wenn die App den Server nicht erreicht."
  el: "Οι συνδέσεις ελέγχου χρησιμοποιούν μόνο IPv6. Απενεργοποιήστε το αν η εφαρμογή δεν φτάνει στον διακομιστή."
  en: "Control-plane connections use IPv6 only. Turn this off if the app cannot reach the server."
  es: "Las conexiones de control solo usan IPv6. Desactívalo si la app no llega al servidor."
  es-419: "Las conexiones de control solo usan IPv6. Desactívalo si la app no llega al servidor."
  es-MX: "Las conexiones de control solo usan IPv6. Desactívalo si la app no llega al servidor."
  fr: "Les connexions de contrôle n’utilisent qu’IPv6. Désactivez cette option si l’application ne joint pas le serveur."
  he: "חיבורי הבקרה משתמשים ב-IPv6 בלבד. כבו את זה אם האפליקציה לא מגיעה לשרת."
  hi: "कंट्रोल कनेक्शन केवल IPv6 का इस्तेमाल करते हैं। अगर ऐप सर्वर तक नहीं पहुँच पाता, तो इसे बंद करें।"
  id: "Koneksi kontrol hanya memakai IPv6. Matikan ini jika aplikasi tidak dapat menjangkau server."
  it: "Le connessioni di controllo usano solo IPv6. Disattivalo se l’app non raggiunge il server."
  ja: "制御用の接続は IPv6 のみを使います。アプリがサーバーに到達できない場合はオフにしてください。"
  ko: "제어 연결은 IPv6만 사용합니다. 앱이 서버에 연결되지 않으면 이 옵션을 끄세요."
  nl: "Besturingsverbindingen gebruiken alleen IPv6. Zet dit uit als de app de server niet bereikt."
  pl: "Połączenia sterujące używają tylko IPv6. Wyłącz to, jeśli aplikacja nie może połączyć się z serwerem."
  pt: "As ligações de controlo usam apenas IPv6. Desative isto se a app não chegar ao servidor."
  pt-BR: "As conexões de controle usam só IPv6. Desative isso se o app não alcançar o servidor."
  pt-PT: "As ligações de controlo usam apenas IPv6. Desative isto se a app não chegar ao servidor."
  ru: "Управляющие соединения используют только IPv6. Выключите это, если приложение не может связаться с сервером."
  sv: "Styranslutningar använder bara IPv6. Stäng av detta om appen inte når servern."
  sw: "Miunganisho ya udhibiti hutumia IPv6 pekee. Zima hii ikiwa programu haiwezi kufikia seva."
  th: "การเชื่อมต่อควบคุมใช้ IPv6 เท่านั้น ปิดตัวเลือกนี้หากแอปเข้าถึงเซิร์ฟเวอร์ไม่ได้"
  uk: "Керувальні з’єднання використовують лише IPv6. Вимкніть це, якщо застосунок не може зв’язатися із сервером."
  vi: "Kết nối điều khiển chỉ dùng IPv6. Hãy tắt tùy chọn này nếu ứng dụng không kết nối được tới máy chủ."
  zh: "控制连接仅使用 IPv6。如果应用无法连接服务器，请关闭此项。"
  zh-HK: "控制連線只使用 IPv6。如果應用程式無法連接伺服器，請關閉此項。"
