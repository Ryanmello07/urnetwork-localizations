description: "Earnings screen, the payout card for the network's payouts. Under: This app no longer has the key."
source: "Your earnings keep going to this address. To transfer or use your SN25α, enter your recovery phrase into a Bittensor wallet such as Talisman or Nova, or into btcli."
platforms:
  - apple
localizations:
  ar: "تستمر أرباحك في الوصول إلى هذا العنوان. لتحويل SN25α الخاص بك أو استخدامه، أدخل عبارة النسخ الاحتياطي الخاصة بك في محفظة Bittensor مثل Talisman أو Nova، أو في btcli."
  cs: "Vaše výdělky dál chodí na tuto adresu. Chcete-li své SN25α převést nebo použít, zadejte svou obnovovací frázi do peněženky Bittensor, například Talisman nebo Nova, nebo do btcli."
  de: "Deine Einnahmen gehen weiter an diese Adresse. Um dein SN25α zu übertragen oder zu verwenden, gib deine Wiederherstellungsphrase in eine Bittensor-Wallet wie Talisman oder Nova oder in btcli ein."
  el: "Τα κέρδη σας συνεχίζουν να πηγαίνουν σε αυτή τη διεύθυνση. Για να μεταφέρετε ή να χρησιμοποιήσετε τα SN25α σας, εισαγάγετε τη φράση επαναφοράς σας σε ένα πορτοφόλι Bittensor, όπως το Talisman ή το Nova, ή στο btcli."
  en: "Your earnings keep going to this address. To transfer or use your SN25α, enter your recovery phrase into a Bittensor wallet such as Talisman or Nova, or into btcli."
  es: "Tus ganancias siguen llegando a esta dirección. Para transferir o usar tu SN25α, introduce tu frase de recuperación en una billetera de Bittensor, como Talisman o Nova, o en btcli."
  es-419: "Tus ganancias siguen llegando a esta dirección. Para transferir o usar tu SN25α, ingresa tu frase de recuperación en una billetera de Bittensor, como Talisman o Nova, o en btcli."
  es-MX: "Tus ganancias siguen llegando a esta dirección. Para transferir o usar tu SN25α, ingresa tu frase de recuperación en una cartera de Bittensor, como Talisman o Nova, o en btcli."
  fr: "Vos gains continuent d’arriver à cette adresse. Pour transférer ou utiliser vos SN25α, saisissez votre phrase de sauvegarde dans un portefeuille Bittensor comme Talisman ou Nova, ou dans btcli."
  he: "הרווחים שלכם ממשיכים להגיע לכתובת הזו. כדי להעביר את ה-SN25α שלכם או להשתמש בו, הזינו את ביטוי השחזור שלכם בארנק Bittensor כמו Talisman או Nova, או ב-btcli."
  hi: "आपकी कमाई इसी पते पर आती रहेगी। अपने SN25α को ट्रांसफ़र करने या इस्तेमाल करने के लिए, अपना रिकवरी फ़्रेज़ Talisman या Nova जैसे किसी Bittensor वॉलेट में, या btcli में डालें।"
  id: "Penghasilan Anda tetap dikirim ke alamat ini. Untuk mentransfer atau menggunakan SN25α Anda, masukkan frasa cadangan Anda ke dompet Bittensor seperti Talisman atau Nova, atau ke btcli."
  it: "I tuoi guadagni continuano ad arrivare a questo indirizzo. Per trasferire o usare i tuoi SN25α, inserisci la tua frase di recupero in un portafoglio Bittensor come Talisman o Nova, oppure in btcli."
  ja: "収益は引き続きこのアドレスに支払われます。SN25α を送金または使用するには、復元フレーズを Talisman や Nova などの Bittensor ウォレット、または btcli に入力してください。"
  ko: "수익은 계속 이 주소로 들어옵니다. SN25α를 전송하거나 사용하려면 복구 문구를 Talisman이나 Nova 같은 Bittensor 지갑 또는 btcli에 입력하세요."
  nl: "Je verdiensten blijven naar dit adres gaan. Om je SN25α over te maken of te gebruiken, voer je je herstelzin in een Bittensor-wallet zoals Talisman of Nova in, of in btcli."
  pl: "Twoje zarobki nadal trafiają na ten adres. Aby przenieść swoje SN25α lub ich użyć, wpisz swoją frazę odzyskiwania do portfela Bittensor, takiego jak Talisman lub Nova, albo do btcli."
  pt: "Os seus ganhos continuam a ir para este endereço. Para transferir ou utilizar o seu SN25α, introduza a sua frase de recuperação numa carteira Bittensor, como a Talisman ou a Nova, ou no btcli."
  pt-BR: "Seus ganhos continuam indo para este endereço. Para transferir ou usar seu SN25α, insira sua frase de recuperação em uma carteira Bittensor, como Talisman ou Nova, ou no btcli."
  pt-PT: "Os seus ganhos continuam a ir para este endereço. Para transferir ou utilizar o seu SN25α, introduza a sua frase de recuperação numa carteira Bittensor, como a Talisman ou a Nova, ou no btcli."
  ru: "Ваш заработок продолжает поступать на этот адрес. Чтобы перевести или использовать свои SN25α, введите фразу восстановления в кошелек Bittensor, например Talisman или Nova, или в btcli."
  sv: "Dina intäkter fortsätter att gå till den här adressen. För att överföra eller använda dina SN25α anger du din återställningsfras i en Bittensor-plånbok som Talisman eller Nova, eller i btcli."
  sw: "Mapato yako yanaendelea kwenda kwenye anwani hii. Ili kuhamisha au kutumia SN25α yako, weka kifungu chako cha urejeshaji kwenye pochi ya Bittensor kama Talisman au Nova, au kwenye btcli."
  th: "รายได้ของคุณยังคงเข้าที่อยู่นี้ หากต้องการโอนหรือใช้ SN25α ของคุณ ให้ป้อนวลีสำรองของคุณลงในกระเป๋าเงิน Bittensor เช่น Talisman หรือ Nova หรือลงใน btcli"
  uk: "Ваш заробіток і далі надходить на цю адресу. Щоб переказати або використати свої SN25α, введіть фразу відновлення в гаманець Bittensor, наприклад Talisman або Nova, чи в btcli."
  vi: "Thu nhập của bạn vẫn tiếp tục được chuyển đến địa chỉ này. Để chuyển hoặc sử dụng SN25α của bạn, hãy nhập cụm từ sao lưu của bạn vào ví Bittensor như Talisman hoặc Nova, hoặc vào btcli."
  zh: "您的收益会继续支付到此地址。要转移或使用您的 SN25α，请将您的恢复短语输入 Talisman 或 Nova 等 Bittensor 钱包，或输入 btcli。"
  zh-HK: "你的收益會繼續支付到此地址。要轉移或使用你的 SN25α，請將你的復原短語輸入 Talisman 或 Nova 等 Bittensor 錢包，或輸入 btcli。"
