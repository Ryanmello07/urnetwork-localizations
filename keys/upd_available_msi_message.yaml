description: "Windows update banner: what the Update button does (downloads the MSI installer, checks it, runs it)."
source: "One click downloads the release, verifies it and runs its installer, which updates the app and the VPN service. The app closes while it installs."
platforms:
  - windows
localizations:
  ar: "بنقرة واحدة يُنزَّل الإصدار ويُتحقق منه ويُشغَّل مثبّته، الذي يحدّث التطبيق وخدمة VPN. يُغلق التطبيق أثناء التثبيت."
  cs: "Jedno kliknutí stáhne vydání, ověří ho a spustí jeho instalační program, který aktualizuje aplikaci i službu VPN. Během instalace se aplikace zavře."
  de: "Ein Klick lädt die Version herunter, prüft sie und startet ihr Installationsprogramm, das die App und den VPN-Dienst aktualisiert. Die App wird während der Installation geschlossen."
  el: "Με ένα κλικ η έκδοση λαμβάνεται, επαληθεύεται και εκτελείται το πρόγραμμα εγκατάστασής της, που ενημερώνει την εφαρμογή και την υπηρεσία VPN. Η εφαρμογή κλείνει όσο γίνεται η εγκατάσταση."
  en: "One click downloads the release, verifies it and runs its installer, which updates the app and the VPN service. The app closes while it installs."
  es: "Con un clic se descarga la versión, se verifica y se ejecuta su instalador, que actualiza la app y el servicio VPN. La app se cierra mientras se instala."
  es-419: "Con un clic se descarga la versión, se verifica y se ejecuta su instalador, que actualiza la app y el servicio VPN. La app se cierra mientras se instala."
  es-MX: "Con un clic se descarga la versión, se verifica y se ejecuta su instalador, que actualiza la app y el servicio VPN. La app se cierra mientras se instala."
  fr: "Un clic télécharge la version, la vérifie et lance son programme d’installation, qui met à jour l’application et le service VPN. L’application se ferme pendant l’installation."
  he: "בלחיצה אחת הגרסה מורדת, נבדקת ותוכנית ההתקנה שלה מופעלת ומעדכנת את האפליקציה ואת שירות ה-VPN. האפליקציה נסגרת בזמן ההתקנה."
  hi: "एक क्लिक से रिलीज़ डाउनलोड और सत्यापित होता है और उसका इंस्टॉलर चलता है, जो ऐप और VPN सेवा को अपडेट करता है। इंस्टॉल होने के दौरान ऐप बंद हो जाता है।"
  id: "Satu klik mengunduh rilis, memverifikasinya, dan menjalankan penginstalnya, yang memperbarui aplikasi dan layanan VPN. Aplikasi ditutup selama pemasangan."
  it: "Con un clic la versione viene scaricata, verificata e ne viene avviato il programma di installazione, che aggiorna l’app e il servizio VPN. L’app si chiude durante l’installazione."
  ja: "ワンクリックでリリースをダウンロードして検証し、そのインストーラーを実行してアプリと VPN サービスを更新します。インストール中はアプリが閉じます。"
  ko: "한 번 클릭하면 릴리스를 다운로드하고 확인한 뒤 설치 프로그램을 실행해 앱과 VPN 서비스를 업데이트합니다. 설치하는 동안 앱이 닫힙니다."
  nl: "Met één klik wordt de release gedownload, gecontroleerd en het installatieprogramma uitgevoerd, dat de app en de VPN-dienst bijwerkt. De app wordt gesloten tijdens de installatie."
  pl: "Jedno kliknięcie pobiera wydanie, weryfikuje je i uruchamia jego instalator, który aktualizuje aplikację i usługę VPN. Aplikacja zamyka się na czas instalacji."
  pt: "Um clique baixa a versão, verifica-a e executa o instalador dela, que atualiza o app e o serviço VPN. O app fecha durante a instalação."
  pt-BR: "Um clique baixa a versão, verifica-a e executa o instalador dela, que atualiza o app e o serviço VPN. O app fecha durante a instalação."
  pt-PT: "Um clique transfere a versão, verifica-a e executa o respetivo instalador, que atualiza a app e o serviço VPN. A app fecha durante a instalação."
  ru: "Одним щелчком выпуск загружается, проверяется и запускается его установщик, который обновляет приложение и службу VPN. На время установки приложение закроется."
  sv: "Ett klick hämtar versionen, verifierar den och kör dess installationsprogram, som uppdaterar appen och VPN-tjänsten. Appen stängs medan installationen pågår."
  sw: "Kubofya mara moja kunapakua toleo, kulithibitisha na kuendesha kisakinishi chake, ambacho husasisha programu na huduma ya VPN. Programu hufungwa wakati wa usakinishaji."
  th: "คลิกครั้งเดียวจะดาวน์โหลดรุ่นนี้ ตรวจสอบ และเรียกใช้ตัวติดตั้ง ซึ่งจะอัปเดตแอปและบริการ VPN แอปจะปิดระหว่างการติดตั้ง"
  uk: "Одним клацанням випуск завантажується, перевіряється й запускається його інсталятор, який оновлює застосунок і службу VPN. Під час установлення застосунок закриється."
  vi: "Một cú nhấp sẽ tải bản phát hành, xác minh nó và chạy trình cài đặt của nó để cập nhật ứng dụng và dịch vụ VPN. Ứng dụng sẽ đóng trong khi cài đặt."
  zh: "点击一下即可下载并验证该版本，然后运行其安装程序，更新应用和 VPN 服务。安装期间应用会关闭。"
  zh-HK: "按一下即可下載並驗證該版本，然後執行其安裝程式，更新應用程式和 VPN 服務。安裝期間應用程式會關閉。"
