description: "Developer page: the explanation under the 'Busy probe wait' setting."
source: "How long the stall probe waits for an answer before convicting, in ms. Off derives half the stall bar"
platforms:
  - linux
  - apple
localizations:
  ar: "المدة التي ينتظر فيها فحص التوقف ردًا قبل الإدانة، بالمللي ثانية. عند الإيقاف، تُستخدم نصف عتبة التوقف"
  cs: "Jak dlouho sonda zaseknutí čeká na odpověď, než odsoudí, v ms. Vypnuto použije polovinu prahu zaseknutí"
  de: "Wie lange die Hänger-Prüfung auf eine Antwort wartet, bevor verurteilt wird, in ms. Aus: nutzt die halbe Hänger-Schwelle"
  el: "Πόσο περιμένει ο ανιχνευτής κολλήματος απάντηση πριν καταδικάσει, σε ms. Η απενεργοποίηση χρησιμοποιεί το μισό του ορίου κολλήματος"
  en: "How long the stall probe waits for an answer before convicting, in ms. Off derives half the stall bar"
  es: "Cuánto espera la sonda de bloqueo una respuesta antes de condenar, en ms. Si está desactivado, se usa la mitad del umbral de bloqueo"
  es-419: "Cuánto espera la sonda de traba una respuesta antes de condenar, en ms. Si está desactivado, se usa la mitad del umbral de traba"
  es-MX: "Cuánto espera la sonda de traba una respuesta antes de condenar, en ms. Si está desactivado, se usa la mitad del umbral de traba"
  fr: "Combien de temps la sonde de blocage attend une réponse avant de condamner, en ms. Désactivé utilise la moitié du seuil de blocage"
  he: "כמה זמן בדיקת התקיעה ממתינה לתשובה לפני הרשעה, במילישניות. כיבוי משתמש בחצי מסף התקיעה"
  hi: "अटकाव प्रोब दोषी ठहराने से पहले जवाब के लिए कितनी देर रुकता है, ms में। बंद करने पर अटकाव सीमा का आधा इस्तेमाल होता है"
  id: "Berapa lama probe macet menunggu jawaban sebelum memvonis, dalam ms. Nonaktif memakai setengah dari ambang macet"
  it: "Quanto aspetta una risposta la sonda di blocco prima di condannare, in ms. Disattivato usa metà della soglia di blocco"
  ja: "停止確認が判定を下すまでに応答を待つ時間（ミリ秒）。オフにすると停止しきい値の半分を使います"
  ko: "멈춤 점검이 판정하기 전에 응답을 기다리는 시간(밀리초)입니다. 끄면 멈춤 기준의 절반을 사용합니다"
  nl: "Hoe lang de vastloop-test op een antwoord wacht voordat hij veroordeelt, in ms. Uit gebruikt de helft van de vastloopgrens"
  pl: "Jak długo sonda blokady czeka na odpowiedź, zanim wyda wyrok, w ms. Wyłączenie używa połowy progu blokady"
  pt: "Durante quanto tempo a sonda de bloqueio espera uma resposta antes de condenar, em ms. Desativado usa metade do limiar de bloqueio"
  pt-BR: "Por quanto tempo a sonda de travamento espera uma resposta antes de condenar, em ms. Desativado usa metade do limite de travamento"
  pt-PT: "Durante quanto tempo a sonda de bloqueio espera uma resposta antes de condenar, em ms. Desativado usa metade do limiar de bloqueio"
  ru: "Как долго проба зависания ждёт ответа, прежде чем осудить выход, в мс. Если выключено, берётся половина порога зависания"
  sv: "Hur länge låsningssonden väntar på svar innan den fäller, i ms. Av använder halva låsningsgränsen"
  sw: "Muda ambao kipimo cha kukwama husubiri jibu kabla ya kuhukumu, kwa ms. Kuzima kunatumia nusu ya kizingiti cha kukwama"
  th: "การทดสอบอาการค้างจะรอคำตอบนานเท่าใดก่อนตัดสิน (มิลลิวินาที) ปิดเพื่อใช้ครึ่งหนึ่งของเกณฑ์อาการค้าง"
  uk: "Скільки зонд зависання чекає на відповідь, перш ніж винести вирок, у мс. Вимкнення використовує половину порогу зависання"
  vi: "Thăm dò kẹt chờ phản hồi bao lâu trước khi kết luận lỗi, tính bằng ms. Tắt sẽ dùng một nửa ngưỡng kẹt"
  zh: "停滞探测在定罪前等待应答的时长（毫秒）。关闭时取停滞阈值的一半"
  zh-HK: "停滯探測在判罪前等待回應的時長（毫秒）。關閉時取停滯門檻的一半"
