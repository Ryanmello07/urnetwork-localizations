description: "Sessions screen (Account > Sessions): shown on a row when signing its session out failed."
source: "Couldn't sign out this session. Try again."
platforms:
  - apple
  - android
  - windows
  - linux
  - site
localizations:
  ar: "تعذّر تسجيل الخروج من هذه الجلسة. حاول مرة أخرى."
  cs: "Tuto relaci se nepodařilo odhlásit. Zkuste to znovu."
  de: "Diese Sitzung konnte nicht abgemeldet werden. Versuche es erneut."
  el: "Δεν ήταν δυνατή η αποσύνδεση αυτής της συνεδρίας. Δοκιμάστε ξανά."
  en: "Couldn't sign out this session. Try again."
  es: "No se pudo cerrar esta sesión. Inténtalo de nuevo."
  es-419: "No se pudo cerrar esta sesión. Inténtalo de nuevo."
  es-MX: "No se pudo cerrar esta sesión. Inténtalo de nuevo."
  fr: "Impossible de déconnecter cette session. Réessayez."
  he: "ההתנתקות מההפעלה הזו נכשלה. נסו שוב."
  hi: "इस सत्र से साइन आउट नहीं हो सका। पुनः प्रयास करें।"
  id: "Tidak dapat keluar dari sesi ini. Coba lagi."
  it: "Impossibile chiudere questa sessione. Riprova."
  ja: "このセッションからサインアウトできませんでした。もう一度お試しください。"
  ko: "이 세션에서 로그아웃할 수 없습니다. 다시 시도하세요."
  nl: "Kan deze sessie niet uitloggen. Probeer het opnieuw."
  pl: "Nie udało się wylogować tej sesji. Spróbuj ponownie."
  pt: "Não foi possível terminar esta sessão. Tente novamente."
  pt-BR: "Não foi possível encerrar esta sessão. Tente novamente."
  pt-PT: "Não foi possível terminar esta sessão. Tente novamente."
  ru: "Не удалось завершить этот сеанс. Попробуйте ещё раз."
  sv: "Det gick inte att logga ut den här sessionen. Försök igen."
  sw: "Imeshindwa kutoka kwenye kipindi hiki. Jaribu tena."
  th: "ออกจากระบบเซสชันนี้ไม่ได้ ลองอีกครั้ง"
  uk: "Не вдалося завершити цей сеанс. Спробуйте ще раз."
  vi: "Không thể đăng xuất phiên này. Hãy thử lại."
  zh: "无法退出此会话。请重试。"
  zh-HK: "無法登出此工作階段。請再試一次。"
