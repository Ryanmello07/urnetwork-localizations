description: "Snackbar shown when creating the user's network fails. Used in ContentView.swift, Main/Account/AccountRootView.swift and Main/Connect/ConnectView-iOS.swift."
source: "There was an error creating your network. Please try again later."
platforms:
  - apple
  - linux
localizations:
  ar: "حدث خطأ أثناء إنشاء شبكتك. يرجى المحاولة مرة أخرى لاحقًا."
  cs: "Při vytváření sítě došlo k chybě. Zkuste to prosím později."
  de: "Beim Erstellen deines Netzwerks ist ein Fehler aufgetreten. Bitte versuche es später erneut."
  el: "Παρουσιάστηκε σφάλμα κατά τη δημιουργία του δικτύου σας. Δοκιμάστε ξανά αργότερα."
  en: "There was an error creating your network. Please try again later."
  es: "Se ha producido un error al crear tu red. Inténtalo de nuevo más tarde."
  es-419: "Se produjo un error al crear tu red. Inténtalo de nuevo más tarde."
  es-MX: "Se produjo un error al crear tu red. Inténtalo de nuevo más tarde."
  fr: "Une erreur s'est produite lors de la création de votre réseau. Veuillez réessayer plus tard."
  he: "אירעה שגיאה ביצירת הרשת שלך. אנא נסה שוב מאוחר יותר."
  hi: "आपका नेटवर्क बनाते समय त्रुटि हुई। कृपया बाद में पुनः प्रयास करें।"
  id: "Terjadi kesalahan saat membuat jaringan Anda. Silakan coba lagi nanti."
  it: "Si è verificato un errore durante la creazione della tua rete. Riprova più tardi."
  ja: "ネットワークの作成中にエラーが発生しました。後でもう一度お試しください。"
  ko: "네트워크를 만드는 중 오류가 발생했습니다. 나중에 다시 시도해 주세요."
  nl: "Er is een fout opgetreden bij het aanmaken van je netwerk. Probeer het later opnieuw."
  pl: "Wystąpił błąd podczas tworzenia sieci. Spróbuj ponownie później."
  pt: "Ocorreu um erro ao criar a sua rede. Tente novamente mais tarde."
  pt-BR: "Ocorreu um erro ao criar sua rede. Tente novamente mais tarde."
  pt-PT: "Ocorreu um erro ao criar a sua rede. Tente novamente mais tarde."
  ru: "Произошла ошибка при создании вашей сети. Пожалуйста, попробуйте позже."
  sv: "Ett fel uppstod när ditt nätverk skulle skapas. Försök igen senare."
  sw: "Hitilafu imetokea wakati wa kuunda mtandao wako. Tafadhali jaribu tena baadaye."
  th: "เกิดข้อผิดพลาดในการสร้างเครือข่ายของคุณ กรุณาลองใหม่ภายหลัง"
  uk: "Сталася помилка під час створення вашої мережі. Будь ласка, спробуйте пізніше."
  vi: "Đã xảy ra lỗi khi tạo mạng của bạn. Vui lòng thử lại sau."
  zh: "创建网络时出错。请稍后再试。"
  zh-HK: "建立網絡時發生錯誤。請稍後再試。"
