description: "Feedback screen: support contacts. The first argument is the support email address, the second is the name of the community chat (Discord); both are links."
source: "Send us your feedback directly, email us at %1$s, or join our %2$s for direct support."
platforms:
  - android
placeholders:
  - name: email
    type: string
  - name: community
    type: string
localizations:
  ar: "أرسل إلينا ملاحظاتك مباشرة، أو راسلنا على {email}، أو انضم إلى {community} للحصول على دعم مباشر."
  cs: "Pošlete nám zpětnou vazbu přímo, napište nám na {email} nebo se pro přímou podporu připojte k našemu {community}."
  de: "Schick uns dein Feedback direkt, schreib uns an {email} oder tritt unserem {community} bei, um direkt Hilfe zu bekommen."
  el: "Στείλτε μας απευθείας τα σχόλιά σας, γράψτε μας στο {email} ή γίνετε μέλος του {community} μας για άμεση υποστήριξη."
  en: "Send us your feedback directly, email us at {email}, or join our {community} for direct support."
  es: "Envíanos tus comentarios directamente, escríbenos a {email} o únete a nuestro {community} para recibir ayuda directa."
  es-419: "Envíanos tus comentarios directamente, escríbenos a {email} o únete a nuestro {community} para recibir ayuda directa."
  es-MX: "Envíanos tus comentarios directamente, escríbenos a {email} o únete a nuestro {community} para recibir ayuda directa."
  fr: "Envoyez-nous votre avis directement, écrivez-nous à {email} ou rejoignez notre {community} pour une aide directe."
  he: "שלחו לנו משוב ישירות, כתבו לנו לכתובת {email} או הצטרפו ל-{community} שלנו לתמיכה ישירה."
  hi: "हमें सीधे अपना फ़ीडबैक भेजें, {email} पर ईमेल करें, या सीधी सहायता के लिए हमारे {community} से जुड़ें।"
  id: "Kirimkan masukan langsung kepada kami, email kami di {email}, atau bergabunglah dengan {community} kami untuk dukungan langsung."
  it: "Inviaci il tuo feedback direttamente, scrivici a {email} o unisciti al nostro {community} per ricevere assistenza diretta."
  ja: "フィードバックを直接お送りいただくか、{email} までメールするか、{community} に参加して直接サポートを受けてください。"
  ko: "피드백을 직접 보내 주시거나, {email}로 이메일을 보내 주시거나, {community}에 참여해 직접 지원을 받으세요."
  nl: "Stuur ons rechtstreeks je feedback, mail ons op {email} of word lid van onze {community} voor directe ondersteuning."
  pl: "Wyślij nam opinię bezpośrednio, napisz na {email} albo dołącz do naszego {community}, aby uzyskać bezpośrednie wsparcie."
  pt: "Envie-nos o seu feedback diretamente, escreva-nos para {email} ou junte-se ao nosso {community} para obter suporte direto."
  pt-BR: "Envie seu feedback diretamente, mande um e-mail para {email} ou entre no nosso {community} para receber suporte direto."
  pt-PT: "Envie-nos o seu feedback diretamente, escreva-nos para {email} ou junte-se ao nosso {community} para obter suporte direto."
  ru: "Отправьте нам отзыв напрямую, напишите на {email} или присоединяйтесь к нашему {community}, чтобы получить поддержку напрямую."
  sv: "Skicka din feedback direkt till oss, mejla oss på {email} eller gå med i vår {community} för direkt support."
  sw: "Tutumie maoni yako moja kwa moja, tutumie barua pepe kupitia {email}, au jiunge na {community} yetu kwa usaidizi wa moja kwa moja."
  th: "ส่งความคิดเห็นถึงเราโดยตรง ส่งอีเมลมาที่ {email} หรือเข้าร่วม {community} ของเราเพื่อรับความช่วยเหลือโดยตรง"
  uk: "Надсилайте відгуки нам напряму, пишіть на {email} або приєднуйтеся до нашого {community}, щоб отримати пряму підтримку."
  vi: "Gửi phản hồi trực tiếp cho chúng tôi, gửi email tới {email}, hoặc tham gia {community} của chúng tôi để được hỗ trợ trực tiếp."
  zh: "直接向我们发送反馈，发送电子邮件至 {email}，或加入我们的 {community} 获取直接支持。"
  zh-HK: "直接向我們發送意見、發電郵至 {email}，或加入我們的 {community} 以獲得直接支援。"
