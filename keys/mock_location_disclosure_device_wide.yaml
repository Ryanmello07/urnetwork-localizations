description: "Disclosure shown with the mock location toggle: the simulated location is reported to every app on the device, not only URnetwork."
source: "This changes the location reported to every app on your device, not just URnetwork."
platforms:
  - android
  - linux
localizations:
  ar: "يؤدي هذا إلى تغيير الموقع الذي يظهر لجميع التطبيقات على جهازك، وليس URnetwork فقط."
  cs: "Tím se změní poloha hlášená všem aplikacím ve vašem zařízení, nejen aplikaci URnetwork."
  de: "Dies ändert den Standort, der jeder App auf deinem Gerät gemeldet wird, nicht nur URnetwork."
  el: "Αυτό αλλάζει την τοποθεσία που αναφέρεται σε κάθε εφαρμογή στη συσκευή σας, όχι μόνο στο URnetwork."
  en: "This changes the location reported to every app on your device, not just URnetwork."
  es: "Esto cambia la ubicación que se comunica a todas las aplicaciones de tu dispositivo, no solo a URnetwork."
  es-419: "Esto cambia la ubicación que se informa a todas las apps de tu dispositivo, no solo a URnetwork."
  es-MX: "Esto cambia la ubicación que se informa a todas las apps de tu dispositivo, no solo a URnetwork."
  fr: "Cela modifie la position communiquée à toutes les applications de votre appareil, pas seulement à URnetwork."
  he: "פעולה זו משנה את המיקום שמדווח לכל אפליקציה במכשיר שלך, לא רק ל-URnetwork."
  hi: "इससे आपके डिवाइस के हर ऐप्लिकेशन को दिखने वाला स्थान बदल जाता है, सिर्फ़ URnetwork को नहीं।"
  id: "Ini mengubah lokasi yang dilaporkan ke semua aplikasi di perangkat Anda, bukan hanya URnetwork."
  it: "Questo cambia la posizione comunicata a tutte le app sul tuo dispositivo, non solo a URnetwork."
  ja: "これにより、URnetwork だけでなく、デバイス上のすべてのアプリに報告される位置情報が変わります。"
  ko: "이 설정은 URnetwork뿐만 아니라 기기의 모든 앱에 보고되는 위치를 변경합니다."
  nl: "Dit verandert de locatie die aan elke app op je apparaat wordt doorgegeven, niet alleen aan URnetwork."
  pl: "Zmienia to lokalizację przekazywaną wszystkim aplikacjom na Twoim urządzeniu, nie tylko URnetwork."
  pt: "Isto altera a localização comunicada a todas as aplicações no seu dispositivo, não apenas à URnetwork."
  pt-BR: "Isso altera a localização informada a todos os apps do seu dispositivo, não apenas ao URnetwork."
  pt-PT: "Isto altera a localização comunicada a todas as aplicações no seu dispositivo, não apenas à URnetwork."
  ru: "Это изменяет местоположение, которое видят все приложения на вашем устройстве, а не только URnetwork."
  sv: "Detta ändrar platsen som rapporteras till alla appar på din enhet, inte bara URnetwork."
  sw: "Hii hubadilisha mahali panaporipotiwa kwa kila programu kwenye kifaa chako, siyo URnetwork pekee."
  th: "การตั้งค่านี้จะเปลี่ยนตำแหน่งที่รายงานให้ทุกแอปในอุปกรณ์ของคุณ ไม่ใช่เฉพาะ URnetwork"
  uk: "Це змінює місцезнаходження, яке бачать усі додатки на вашому пристрої, а не лише URnetwork."
  vi: "Điều này thay đổi vị trí được báo cho mọi ứng dụng trên thiết bị của bạn, không chỉ URnetwork."
  zh: "这会更改设备上所有应用看到的位置，而不仅仅是 URnetwork。"
  zh-HK: "這會更改裝置上所有應用程式看到的位置，而不僅是 URnetwork。"
