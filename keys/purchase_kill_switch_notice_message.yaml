description: "Mac App Store alert body under purchase_kill_switch_notice_title. In \"while it's disconnected\", \"it\" is the VPN; in \"turn it back on\", \"it\" is the kill switch, which the user may turn back on after the purchase. Keep App Store and VPN as they are. Name the kill switch by the label of its setting (the kill_switch key)."
source: "App Store purchases need the VPN disconnected, and while it's disconnected, the kill switch blocks your internet traffic. Turn off the kill switch, then try again. You can turn it back on afterward."
platforms:
  - apple
localizations:
  ar: "تتطلب عمليات الشراء من App Store قطع اتصال VPN، وأثناء قطعه يحظر «مفتاح القتل» حركة الإنترنت لديك. أوقف «مفتاح القتل»، ثم حاول مرة أخرى. يمكنك تشغيله من جديد بعد ذلك."
  cs: "Nákupy v App Store vyžadují odpojenou VPN a Kill switch během odpojení blokuje váš internetový provoz. Vypněte Kill switch a zkuste to znovu. Potom ho můžete znovu zapnout."
  de: "Käufe im App Store brauchen ein getrenntes VPN, und solange es getrennt ist, blockiert der Kill switch deinen Internetverkehr. Schalte den Kill switch aus und versuche es dann erneut. Danach kannst du ihn wieder einschalten."
  el: "Οι αγορές από το App Store χρειάζονται αποσυνδεδεμένο VPN, και όσο είναι αποσυνδεδεμένο, το Kill switch μπλοκάρει την κίνηση του διαδικτύου σας. Απενεργοποιήστε το Kill switch και δοκιμάστε ξανά. Μπορείτε να το ενεργοποιήσετε ξανά μετά."
  en: "App Store purchases need the VPN disconnected, and while it's disconnected, the kill switch blocks your internet traffic. Turn off the kill switch, then try again. You can turn it back on afterward."
  es: "Las compras en el App Store requieren que la VPN esté desconectada, y mientras lo está, el Kill switch bloquea tu tráfico de internet. Desactiva el Kill switch y vuelve a intentarlo. Después puedes volver a activarlo."
  es-419: "Las compras en el App Store requieren que la VPN esté desconectada, y mientras lo está, el Kill switch bloquea tu tráfico de internet. Desactiva el Kill switch y vuelve a intentarlo. Después puedes volver a activarlo."
  es-MX: "Las compras en el App Store requieren que la VPN esté desconectada, y mientras lo está, el Kill switch bloquea tu tráfico de internet. Desactiva el Kill switch y vuelve a intentarlo. Después puedes volver a activarlo."
  fr: "Les achats sur l’App Store nécessitent que le VPN soit déconnecté, et tant qu’il l’est, le Kill switch bloque votre trafic Internet. Désactivez le Kill switch, puis réessayez. Vous pourrez le réactiver ensuite."
  he: "רכישות ב-App Store דורשות שה-VPN יהיה מנותק, ובזמן שהוא מנותק, הקיל סוויץ' חוסם את תעבורת האינטרנט שלכם. כבו את הקיל סוויץ' ונסו שוב. אפשר להפעיל אותו מחדש לאחר מכן."
  hi: "App Store से खरीदारी के लिए VPN का डिस्कनेक्ट होना ज़रूरी है, और डिस्कनेक्ट रहने के दौरान किल स्विच आपका इंटरनेट ट्रैफ़िक ब्लॉक करता है। किल स्विच बंद करें, फिर दोबारा कोशिश करें। बाद में आप इसे फिर से चालू कर सकते हैं।"
  id: "Pembelian di App Store memerlukan VPN dalam keadaan terputus, dan selama terputus, Kill switch memblokir lalu lintas internet Anda. Matikan Kill switch, lalu coba lagi. Anda dapat menyalakannya kembali setelahnya."
  it: "Gli acquisti su App Store richiedono che la VPN sia disconnessa e, finché lo è, il Kill switch blocca il tuo traffico Internet. Disattiva il Kill switch, poi riprova. Potrai riattivarlo in seguito."
  ja: "App Storeでの購入にはVPNの切断が必要ですが、切断中はキルスイッチがインターネット通信をブロックします。キルスイッチをオフにしてから、もう一度お試しください。購入後に再びオンにできます。"
  ko: "App Store에서 구매하려면 VPN 연결을 해제해야 하며, 연결이 해제된 동안에는 킬 스위치가 인터넷 트래픽을 차단합니다. 킬 스위치를 끈 다음 다시 시도하세요. 이후에 다시 켤 수 있습니다."
  nl: "Voor aankopen in de App Store moet de VPN-verbinding verbroken zijn, en zolang dat zo is, blokkeert de Kill switch je internetverkeer. Zet de Kill switch uit en probeer het opnieuw. Daarna kun je hem weer aanzetten."
  pl: "Zakupy w App Store wymagają rozłączenia VPN, a gdy VPN jest rozłączony, Kill switch blokuje Twój ruch internetowy. Wyłącz Kill switch i spróbuj ponownie. Później możesz go z powrotem włączyć."
  pt: "Compras na App Store exigem a VPN desconectada e, enquanto ela estiver desconectada, o Kill switch bloqueia seu tráfego de internet. Desative o Kill switch e tente novamente. Depois, você pode ativá-lo de novo."
  pt-BR: "Compras na App Store exigem a VPN desconectada e, enquanto ela estiver desconectada, o Kill switch bloqueia seu tráfego de internet. Desative o Kill switch e tente novamente. Depois, você pode ativá-lo de novo."
  pt-PT: "As compras na App Store exigem a VPN desligada e, enquanto estiver desligada, o Kill switch bloqueia o seu tráfego de internet. Desative o Kill switch e tente novamente. Depois, pode voltar a ativá-lo."
  ru: "Для покупок в App Store VPN должен быть отключён, а пока он отключён, Kill switch блокирует ваш интернет-трафик. Выключите Kill switch и повторите попытку. После этого его можно снова включить."
  sv: "Köp i App Store kräver att VPN är frånkopplat, och medan det är frånkopplat blockerar Kill switch din internettrafik. Stäng av Kill switch och försök igen. Du kan slå på den igen efteråt."
  sw: "Ununuzi kwenye App Store unahitaji VPN iwe imetenganishwa, na ikiwa imetenganishwa, Kill switch huzuia trafiki yako ya intaneti. Zima Kill switch, kisha ujaribu tena. Unaweza kuiwasha tena baadaye."
  th: "การซื้อใน App Store ต้องตัดการเชื่อมต่อ VPN และระหว่างที่ตัดการเชื่อมต่ออยู่ สวิตช์หยุดการเชื่อมต่อจะบล็อกทราฟฟิกอินเทอร์เน็ตของคุณ ปิดสวิตช์หยุดการเชื่อมต่อ แล้วลองอีกครั้ง คุณเปิดอีกครั้งได้ภายหลัง"
  uk: "Для покупок в App Store VPN має бути відключено, а поки його відключено, Kill switch блокує ваш інтернет-трафік. Вимкніть Kill switch і спробуйте ще раз. Потім його можна знову ввімкнути."
  vi: "Giao dịch mua trên App Store cần ngắt kết nối VPN, và trong lúc ngắt kết nối, Kill switch sẽ chặn lưu lượng internet của bạn. Hãy tắt Kill switch rồi thử lại. Sau đó, bạn có thể bật lại."
  zh: "在 App Store 购买需要断开 VPN，而断开期间，断网保护会阻止你的互联网流量。请关闭断网保护，然后重试。之后你可以再将其打开。"
  zh-HK: "在 App Store 購買需要斷開 VPN，而斷開期間，斷線開關 (Kill switch) 會阻擋你的互聯網流量。請關閉斷線開關 (Kill switch)，然後再試一次。之後你可以再將其開啟。"
