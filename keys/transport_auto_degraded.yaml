description: "Generic warning banner in the transport settings editor when the Auto policy is degraded for a constraint this app version does not recognize (the SDK may report new constraint kinds; \"memory\" has its own banner)."
source: "Auto is degraded because system constraints prevent some enabled transports from running."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "الوضع «تلقائي» متدهور لأن قيود النظام تمنع تشغيل بعض بروتوكولات النقل المفعّلة."
  cs: "Režim Auto je omezený, protože systémová omezení brání spuštění některých zapnutých transportů."
  de: "„Automatisch“ ist eingeschränkt, weil Systembeschränkungen verhindern, dass einige aktivierte Transporte laufen."
  el: "Η Αυτόματη λειτουργία είναι υποβαθμισμένη επειδή περιορισμοί του συστήματος εμποδίζουν την εκτέλεση ορισμένων ενεργών μεταφορών."
  en: "Auto is degraded because system constraints prevent some enabled transports from running."
  es: "«Automático» funciona con limitaciones porque las restricciones del sistema impiden que se ejecuten algunos transportes activados."
  es-419: "\"Automático\" funciona con limitaciones porque las restricciones del sistema impiden que se ejecuten algunos transportes activados."
  es-MX: "\"Automático\" funciona con limitaciones porque las restricciones del sistema impiden que se ejecuten algunos transportes activados."
  fr: "Le mode Auto est dégradé, car des contraintes système empêchent certains transports activés de fonctionner."
  he: "המצב האוטומטי פועל באופן מוגבל כי מגבלות מערכת מונעות הפעלה של חלק מפרוטוקולי ההעברה המופעלים."
  hi: "ऑटो सीमित रूप से चल रहा है, क्योंकि सिस्टम की सीमाएँ कुछ चालू ट्रांसपोर्ट को चलने से रोक रही हैं।"
  id: "Otomatis berjalan terbatas karena batasan sistem mencegah beberapa transport yang diaktifkan berjalan."
  it: "Automatico funziona in modo ridotto perché vincoli di sistema impediscono l’esecuzione di alcuni trasporti attivi."
  ja: "システムの制約により一部の有効なトランスポートを実行できないため、自動モードは制限付きで動作しています。"
  ko: "시스템 제약으로 일부 켜진 전송 방식을 실행할 수 없어 자동 모드가 제한된 상태로 동작합니다."
  nl: "Auto werkt beperkt omdat systeembeperkingen verhinderen dat sommige ingeschakelde transports draaien."
  pl: "Tryb Auto działa w ograniczonym zakresie, bo ograniczenia systemu nie pozwalają uruchomić niektórych włączonych transportów."
  pt: "O modo Automático está degradado porque restrições do sistema impedem a execução de alguns transportes ativados."
  pt-BR: "O modo Automático está degradado porque restrições do sistema impedem a execução de alguns transportes ativados."
  pt-PT: "O modo Automático está degradado porque restrições do sistema impedem a execução de alguns transportes ativados."
  ru: "Режим «Автоматически» работает с ограничениями: системные ограничения не позволяют запустить некоторые включённые транспорты."
  sv: "Auto är försämrat eftersom systembegränsningar hindrar vissa aktiverade transporter från att köras."
  sw: "Kiotomatiki kinafanya kazi kwa kiwango cha chini kwa sababu vikwazo vya mfumo vinazuia baadhi ya usafirishaji uliowashwa kufanya kazi."
  th: "โหมดอัตโนมัติทำงานได้จำกัด เพราะข้อจำกัดของระบบทำให้ทรานสปอร์ตที่เปิดไว้บางรายการทำงานไม่ได้"
  uk: "Режим «Авто» працює з обмеженнями, бо системні обмеження не дають запустити деякі ввімкнені транспорти."
  vi: "Chế độ Tự động đang bị giới hạn vì các ràng buộc hệ thống khiến một số phương thức truyền tải đã bật không thể chạy."
  zh: "“自动”模式已降级，因为系统限制导致部分已启用的传输方式无法运行。"
  zh-HK: "「自動」模式已降級，因為系統限制令部分已啟用的傳輸方式無法運作。"
