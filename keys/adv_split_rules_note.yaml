description: "Split rules sheet: the one-sentence explainer at the top, above the note on network clusters. A split rule sends the chosen sites directly from this device, outside the VPN; the sheet's Activity list shows how each connection was routed."
source: "Split rules let the sites you choose connect directly, outside the VPN, and the activity below shows how each connection was routed."
platforms:
  - linux
localizations:
  ar: "تتيح قواعد التقسيم للمواقع التي تختارها الاتصال مباشرةً خارج VPN، ويعرض النشاط أدناه كيف تم توجيه كل اتصال."
  cs: "Pravidla rozdělení umožní vybraným webům připojovat se přímo, mimo VPN, a aktivita níže ukazuje, jak bylo každé připojení směrováno."
  de: "Mit Split-Regeln verbinden sich die Websites, die du auswählst, direkt außerhalb des VPN, und die Aktivität unten zeigt, wie jede Verbindung geleitet wurde."
  el: "Οι κανόνες διαχωρισμού επιτρέπουν στους ιστότοπους που επιλέγετε να συνδέονται απευθείας, εκτός VPN, και η δραστηριότητα παρακάτω δείχνει πώς δρομολογήθηκε κάθε σύνδεση."
  en: "Split rules let the sites you choose connect directly, outside the VPN, and the activity below shows how each connection was routed."
  es: "Las reglas de división permiten que los sitios que elijas se conecten directamente, fuera de la VPN, y la actividad de abajo muestra cómo se enrutó cada conexión."
  es-419: "Las reglas de división permiten que los sitios que elijas se conecten directamente, fuera de la VPN, y la actividad de abajo muestra cómo se enrutó cada conexión."
  es-MX: "Las reglas de división permiten que los sitios que elijas se conecten directamente, fuera de la VPN, y la actividad de abajo muestra cómo se enrutó cada conexión."
  fr: "Les règles de séparation permettent aux sites que vous choisissez de se connecter directement, hors du VPN, et l'activité ci-dessous montre comment chaque connexion a été acheminée."
  he: "כללי פיצול מאפשרים לאתרים שתבחר להתחבר ישירות, מחוץ ל-VPN, והפעילות למטה מראה איך נותב כל חיבור."
  hi: "स्प्लिट नियम आपकी चुनी हुई साइटों को VPN के बाहर सीधे कनेक्ट होने देते हैं, और नीचे दी गई गतिविधि दिखाती है कि हर कनेक्शन कैसे रूट किया गया।"
  id: "Aturan pemisahan membuat situs yang Anda pilih terhubung langsung, di luar VPN, dan aktivitas di bawah menunjukkan bagaimana setiap koneksi dirutekan."
  it: "Le regole di suddivisione permettono ai siti che scegli di connettersi direttamente, fuori dalla VPN, e l'attività qui sotto mostra come è stata instradata ogni connessione."
  ja: "分割ルールを使うと、選んだサイトが VPN を通らずに直接接続します。下のアクティビティには、各接続がどう経路設定されたかが表示されます。"
  ko: "분할 규칙을 사용하면 선택한 사이트가 VPN 밖에서 직접 연결되며, 아래 활동에서 각 연결이 어떻게 라우팅되었는지 확인할 수 있습니다."
  nl: "Met splitsregels maken de sites die je kiest rechtstreeks verbinding, buiten de VPN om, en de activiteit hieronder laat zien hoe elke verbinding is gerouteerd."
  pl: "Reguły podziału pozwalają wybranym witrynom łączyć się bezpośrednio, poza VPN, a aktywność poniżej pokazuje, jak zostało przekierowane każde połączenie."
  pt: "As regras de divisão permitem que os sites que escolher se liguem diretamente, fora da VPN, e a atividade abaixo mostra como cada ligação foi encaminhada."
  pt-BR: "As regras de divisão permitem que os sites que você escolher se conectem diretamente, fora da VPN, e a atividade abaixo mostra como cada conexão foi roteada."
  pt-PT: "As regras de divisão permitem que os sites que escolher se liguem diretamente, fora da VPN, e a atividade abaixo mostra como cada ligação foi encaminhada."
  ru: "Правила разделения позволяют выбранным сайтам подключаться напрямую, вне VPN, а активность ниже показывает, как было направлено каждое подключение."
  sv: "Med delningsregler ansluter de webbplatser du väljer direkt, utanför VPN, och aktiviteten nedan visar hur varje anslutning dirigerades."
  sw: "Sheria za mgawanyo huruhusu tovuti unazochagua kuunganishwa moja kwa moja, nje ya VPN, na shughuli zilizo hapa chini zinaonyesha jinsi kila muunganisho ulivyoelekezwa."
  th: "กฎแยกเส้นทางช่วยให้เว็บไซต์ที่คุณเลือกเชื่อมต่อโดยตรงนอก VPN และกิจกรรมด้านล่างแสดงว่าการเชื่อมต่อแต่ละรายการถูกส่งไปทางใด"
  uk: "Правила розділення дають змогу вибраним сайтам підключатися напряму, поза VPN, а активність нижче показує, як було спрямовано кожне з’єднання."
  vi: "Quy tắc tách luồng cho phép các trang bạn chọn kết nối trực tiếp, bên ngoài VPN, và hoạt động bên dưới cho biết từng kết nối đã được định tuyến thế nào."
  zh: "分流规则可让你选择的网站绕过 VPN 直接连接，下方的活动显示每个连接是如何路由的。"
  zh-HK: "分流規則可讓你選擇的網站繞過 VPN 直接連線，下方的活動顯示每個連線是如何路由的。"
