description: "App top200: step 2"
source: "Device signing is not in the apps yet. On each provider device, run provider fleet sign with your fleet manifest, the device's client key seed (~/.urnetwork/.provider.key) and the validity epochs, and paste the JSON it prints here, one device at a time. It sends nothing and the seeds stay on the device. provider fleet bind instead signs and submits in one step from your own EVM key."
platforms:
  - site
localizations:
  ar: "لا تستطيع التطبيقات توقيع ربط الأجهزة بعد. على كل جهاز مزوّد، شغّل provider fleet sign مع بيان أسطولك وبذرة مفتاح العميل للجهاز (~/.urnetwork/.provider.key) وحقب الصلاحية، ثم الصق هنا JSON الذي يطبعه، جهازًا تلو الآخر. لا يرسل الأمر أي شيء وتبقى البذور على الجهاز. أما provider fleet bind فيوقّع ويرسل في خطوة واحدة من مفتاح EVM الخاص بك."
  de: "Die Apps können Gerätebindungen noch nicht signieren. Führe auf jedem Provider-Gerät provider fleet sign mit deinem Flotten-Manifest, dem Client-Key-Seed des Geräts (~/.urnetwork/.provider.key) und den Gültigkeitsepochen aus und füge das ausgegebene JSON hier ein, ein Gerät nach dem anderen. Der Befehl sendet nichts, und die Seeds bleiben auf dem Gerät. provider fleet bind signiert und sendet dagegen in einem Schritt von deinem eigenen EVM-Schlüssel."
  en: "Device signing is not in the apps yet. On each provider device, run provider fleet sign with your fleet manifest, the device's client key seed (~/.urnetwork/.provider.key) and the validity epochs, and paste the JSON it prints here, one device at a time. It sends nothing and the seeds stay on the device. provider fleet bind instead signs and submits in one step from your own EVM key."
  es: "Las apps aún no pueden firmar vinculaciones de dispositivos. En cada dispositivo proveedor, ejecuta provider fleet sign con tu manifiesto de flota, la semilla de la clave de cliente del dispositivo (~/.urnetwork/.provider.key) y las épocas de validez, y pega aquí el JSON que imprime, un dispositivo a la vez. No envía nada y las semillas se quedan en el dispositivo. En cambio, provider fleet bind firma y envía en un solo paso desde tu propia clave EVM."
  ru: "Приложения пока не умеют подписывать привязки устройств. На каждом устройстве-провайдере выполните provider fleet sign, указав манифест парка, seed клиентского ключа устройства (~/.urnetwork/.provider.key) и эпохи действия, и вставьте сюда выведенный JSON, по одному устройству. Команда ничего не отправляет, а seed остаются на устройстве. provider fleet bind, напротив, подписывает и отправляет за один шаг с вашего собственного EVM-ключа."
  zh: "应用暂时还不能为设备绑定签名。请在每台提供者设备上运行 provider fleet sign，并提供您的设备群清单、该设备的客户端密钥种子（~/.urnetwork/.provider.key）和有效纪元，然后将其输出的 JSON 逐台粘贴到此处。该命令不发送任何内容，种子始终留在设备上。provider fleet bind 则会一步完成签名，并从您自己的 EVM 密钥提交。"
