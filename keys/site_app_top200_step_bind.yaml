description: "App top200: step 2"
source: "Each provider device signs its own binding. Build the bindings below from your fleet manifest and copy each one to its device. In the URnetwork app, open Earnings › Top 200 › Sign fleet binding, paste the binding, check the fleet ID, hotkey and epochs, sign, and paste the payload the app shows here. On a CLI provider, run provider fleet sign with the fleet manifest, the device's client key seed (~/.urnetwork/.provider.key) and the validity epochs instead, and paste the JSON it prints. Neither sends anything and the seeds stay on the device. provider fleet bind instead signs and submits in one step from your own EVM key."
platforms:
  - site
localizations:
  ar: "يوقّع كل جهاز مزوّد ربطه الخاص. أنشئ الروابط أدناه من بيان أسطولك وانسخ كل ربط إلى جهازه. في تطبيق URnetwork، افتح الأرباح › أفضل 200 › توقيع ربط الأسطول، والصق الربط، وتحقّق من معرّف الأسطول والمفتاح الساخن والحِقَب، ثم وقّع والصق هنا البيانات التي يعرضها التطبيق. أما على مزوّد يعمل بسطر الأوامر، فشغّل بدلًا من ذلك provider fleet sign مع بيان الأسطول وبذرة مفتاح العميل للجهاز (~/.urnetwork/.provider.key) وحقب الصلاحية، والصق JSON الذي يطبعه. لا يرسل أيّ منهما شيئًا وتبقى البذور على الجهاز. أما provider fleet bind فيوقّع ويرسل في خطوة واحدة من مفتاح EVM الخاص بك."
  de: "Jedes Provider-Gerät signiert seine eigene Bindung. Erstelle unten die Bindungen aus deinem Flotten-Manifest und kopiere jede auf ihr Gerät. Öffne in der URnetwork-App Einnahmen › Top 200 › Flottenbindung signieren, füge die Bindung ein, prüfe Flotten-ID, Hotkey und Epochen, signiere und füge die Daten, die die App anzeigt, hier ein. Führe auf einem CLI-Provider stattdessen provider fleet sign mit dem Flotten-Manifest, dem Client-Key-Seed des Geräts (~/.urnetwork/.provider.key) und den Gültigkeitsepochen aus und füge das ausgegebene JSON ein. Beides sendet nichts, und die Seeds bleiben auf dem Gerät. provider fleet bind signiert und sendet dagegen in einem Schritt von deinem eigenen EVM-Schlüssel."
  en: "Each provider device signs its own binding. Build the bindings below from your fleet manifest and copy each one to its device. In the URnetwork app, open Earnings › Top 200 › Sign fleet binding, paste the binding, check the fleet ID, hotkey and epochs, sign, and paste the payload the app shows here. On a CLI provider, run provider fleet sign with the fleet manifest, the device's client key seed (~/.urnetwork/.provider.key) and the validity epochs instead, and paste the JSON it prints. Neither sends anything and the seeds stay on the device. provider fleet bind instead signs and submits in one step from your own EVM key."
  es: "Cada dispositivo proveedor firma su propia vinculación. Genera abajo las vinculaciones a partir de tu manifiesto de flota y copia cada una a su dispositivo. En la app URnetwork, abre Ganancias › Top 200 › Firmar vinculación de flota, pega la vinculación, comprueba el ID de flota, la hotkey y las épocas, fírmala y pega aquí los datos que muestra la app. En un proveedor de CLI, ejecuta en su lugar provider fleet sign con el manifiesto de flota, la semilla de la clave de cliente del dispositivo (~/.urnetwork/.provider.key) y las épocas de validez, y pega el JSON que imprime. Ninguno de los dos envía nada y las semillas se quedan en el dispositivo. En cambio, provider fleet bind firma y envía en un solo paso desde tu propia clave EVM."
  ru: "Каждое устройство-провайдер подписывает свою привязку. Создайте ниже привязки из манифеста парка и перенесите каждую на её устройство. В приложении URnetwork откройте Заработок › Топ-200 › Подписать привязку парка, вставьте привязку, проверьте ID парка, hotkey и эпохи, подпишите и вставьте сюда данные, которые покажет приложение. На провайдере с CLI вместо этого выполните provider fleet sign, указав манифест парка, seed клиентского ключа устройства (~/.urnetwork/.provider.key) и эпохи действия, и вставьте выведенный JSON. Ни один из способов ничего не отправляет, а seed остаются на устройстве. provider fleet bind, напротив, подписывает и отправляет за один шаг с вашего собственного EVM-ключа."
  zh: "每台提供者设备各自签署自己的绑定。请在下方根据您的设备群清单生成绑定，并将每个绑定复制到对应设备。在 URnetwork 应用中打开 收益 › 前 200 名 › 签署设备群绑定，粘贴绑定，核对设备群 ID、hotkey 和纪元后签名，再将应用显示的数据粘贴到此处。在 CLI 提供者上，请改为运行 provider fleet sign，并提供设备群清单、该设备的客户端密钥种子（~/.urnetwork/.provider.key）和有效纪元，然后粘贴其输出的 JSON。两种方式都不发送任何内容，种子始终留在设备上。provider fleet bind 则会一步完成签名，并从您自己的 EVM 密钥提交。"
