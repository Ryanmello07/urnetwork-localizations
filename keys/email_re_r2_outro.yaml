description: "Re-engagement email R2 closing line."
source: "Each one opens a short form where you can add a line, or reply to this email. Your answer decides what I send next, and it may well be nothing."
platforms:
  - email
localizations:
  en: "Each one opens a short form where you can add a line, or reply to this email. Your answer decides what I send next, and it may well be nothing."
  ar: "كل واحد منها يفتح نموذجاً قصيراً يمكنك أن تضيف فيه سطراً، أو ردّ على هذه الرسالة. إجابتك تحدد ما أرسله لاحقاً، وقد لا يكون شيئاً على الإطلاق."
  cs: "Každé otevře krátký formulář, kam můžete připsat řádek, nebo odpovězte na tento e-mail. Vaše odpověď rozhodne, co pošlu dál, a klidně to může být nic."
  de: "Jeder davon öffnet ein kurzes Formular, in dem du noch eine Zeile ergänzen kannst, oder antworte auf diese E-Mail. Deine Antwort entscheidet, was ich als Nächstes schicke, und das kann gut auch gar nichts sein."
  el: "Το καθένα ανοίγει μια σύντομη φόρμα όπου μπορείς να προσθέσεις μια γραμμή, ή απάντησε σε αυτό το email. Η απάντησή σου αποφασίζει τι θα στείλω μετά, και μπορεί κάλλιστα να είναι τίποτα."
  es: "Cada uno abre un formulario breve donde puedes añadir una línea, o responde a este correo. Tu respuesta decide qué te envío después, y bien puede que no te envíe nada."
  es-419: "Cada uno abre un formulario breve donde puedes agregar una línea, o responde a este correo. Tu respuesta decide qué te envío después, y bien puede que no te envíe nada."
  es-MX: "Cada uno abre un formulario breve donde puedes agregar una línea, o responde a este correo. Tu respuesta decide qué te envío después, y bien puede que no te envíe nada."
  fr: "Chacun ouvre un court formulaire où tu peux ajouter une ligne, ou réponds à cet e-mail. Ta réponse décide de ce que je t'envoie ensuite, et il se peut très bien que je ne t'envoie rien."
  he: "כל אחד מהם פותח טופס קצר שבו אפשר להוסיף שורה, או השיבו למייל הזה. התשובה שלכם תקבע מה אשלח בהמשך, ובהחלט ייתכן שלא אשלח כלום."
  hi: "हर बटन एक छोटा फ़ॉर्म खोलता है, जहाँ आप एक लाइन जोड़ सकते हैं, या इस ईमेल का जवाब दें। आपका जवाब तय करेगा कि मैं आगे क्या भेजूँ, और हो सकता है कि कुछ भी न भेजूँ।"
  id: "Masing-masing membuka formulir singkat tempat kamu bisa menambahkan sebaris, atau balas email ini. Jawabanmu menentukan apa yang saya kirim berikutnya, dan bisa jadi tidak ada sama sekali."
  it: "Ognuno apre un breve modulo dove puoi aggiungere una riga, oppure rispondi a questa email. La tua risposta decide cosa ti mando dopo, e potrebbe benissimo essere niente."
  ja: "どのボタンからも短いフォームが開き、ひとこと書き添えられます。このメールに返信していただいても構いません。お答えによって次に送るものが決まり、何も送らないことも十分ありえます。"
  ko: "어느 버튼을 누르든 짧은 양식이 열려 한 줄 덧붙일 수 있습니다. 이 메일에 답장하셔도 됩니다. 답변에 따라 다음에 무엇을 보낼지 정해지며, 아무것도 보내지 않을 가능성도 충분합니다."
  nl: "Elke knop opent een kort formulier waarin je een regel kunt toevoegen, of beantwoord deze e-mail. Jouw antwoord bepaalt wat ik hierna stuur, en dat kan best helemaal niets zijn."
  pl: "Każdy otwiera krótki formularz, w którym możesz dopisać zdanie, albo odpowiedz na ten e-mail. Twoja odpowiedź zdecyduje, co wyślę dalej, i równie dobrze może to być nic."
  pt: "Cada um abre um formulário curto onde você pode acrescentar uma linha, ou é só responder a este e-mail. Sua resposta decide o que eu envio depois, e pode muito bem ser nada."
  pt-BR: "Cada um abre um formulário curto onde você pode acrescentar uma linha, ou é só responder a este e-mail. Sua resposta decide o que eu envio depois, e pode muito bem ser nada."
  pt-PT: "Cada um abre um formulário curto onde pode acrescentar uma linha, ou responda a este e-mail. A sua resposta decide o que lhe envio a seguir, e pode muito bem ser nada."
  ru: "Каждая кнопка открывает короткую форму, где можно добавить пару слов, или ответьте на это письмо. От вашего ответа зависит, что я пришлю дальше, и вполне может быть, что ничего."
  sv: "Var och en öppnar ett kort formulär där du kan lägga till en rad, eller svara på det här mejlet. Ditt svar avgör vad jag skickar härnäst, och det kan mycket väl bli ingenting."
  sw: "Kila kimoja kinafungua fomu fupi ambapo unaweza kuongeza mstari, au jibu barua pepe hii. Jibu lako huamua nitakachotuma baadaye, na huenda kisiwe chochote."
  th: "แต่ละปุ่มจะเปิดแบบฟอร์มสั้นๆ ที่คุณเพิ่มข้อความได้หนึ่งบรรทัด หรือจะตอบกลับอีเมลนี้ก็ได้ คำตอบของคุณจะกำหนดว่าผมจะส่งอะไรต่อไป และอาจไม่ส่งอะไรเลยก็ได้"
  uk: "Кожна кнопка відкриває коротку форму, де можна додати рядок, або дайте відповідь на цей лист. Від вашої відповіді залежить, що я надішлю далі, і цілком можливо, що нічого."
  vi: "Mỗi nút mở một biểu mẫu ngắn, nơi bạn có thể thêm một dòng, hoặc bạn có thể trả lời email này. Câu trả lời của bạn quyết định tôi sẽ gửi gì tiếp theo, và rất có thể là không gửi gì cả."
  zh: "每一个都会打开一个简短的表单，你可以补充一句，也可以直接回复这封邮件。你的回答决定我接下来发什么，也完全可能什么都不发。"
  zh-HK: "每一個都會打開一份簡短的表格，你可以補充一句，也可以直接回覆這封郵件。你的回答決定我接下來發什麼，也很有可能什麼都不發。"
