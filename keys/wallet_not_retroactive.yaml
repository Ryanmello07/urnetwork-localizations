description: "Line on the wallet block before a wallet is connected."
source: "Connect a wallet to earn SN25α from the next epoch. Earlier epochs are not settled retroactively."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "اربط محفظة لتكسب SN25α بدءًا من الفترة التالية. لا تتم تسوية الفترات السابقة بأثر رجعي."
  cs: "Připojte peněženku a vydělávejte SN25α od příští epochy. Předchozí epochy se zpětně nevypořádávají."
  de: "Verbinde eine Wallet, um ab der nächsten Epoche SN25α zu verdienen. Frühere Epochen werden nicht rückwirkend abgerechnet."
  el: "Συνδέστε ένα πορτοφόλι για να κερδίζετε SN25α από την επόμενη εποχή. Οι προηγούμενες εποχές δεν εκκαθαρίζονται αναδρομικά."
  en: "Connect a wallet to earn SN25α from the next epoch. Earlier epochs are not settled retroactively."
  es: "Conecta una billetera para ganar SN25α a partir de la próxima época. Las épocas anteriores no se liquidan con carácter retroactivo."
  es-419: "Conecta una billetera para ganar SN25α a partir de la próxima época. Las épocas anteriores no se liquidan de forma retroactiva."
  es-MX: "Conecta una cartera para ganar SN25α a partir de la próxima época. Las épocas anteriores no se liquidan de forma retroactiva."
  fr: "Connectez un portefeuille pour gagner des SN25α à partir de la prochaine époque. Les époques précédentes ne sont pas réglées rétroactivement."
  he: "חברו ארנק כדי להרוויח SN25α החל מהתקופה הבאה. תקופות קודמות אינן מסולקות בדיעבד."
  hi: "अगले एपोक से SN25α कमाने के लिए वॉलेट कनेक्ट करें। पिछले एपोक पिछली तारीख से सेटल नहीं होते।"
  id: "Hubungkan dompet untuk mendapatkan SN25α mulai epoch berikutnya. Epoch sebelumnya tidak diselesaikan secara surut."
  it: "Collega un portafoglio per guadagnare SN25α dalla prossima epoca. Le epoche precedenti non vengono liquidate retroattivamente."
  ja: "ウォレットを接続すると、次のエポックから SN25α を獲得できます。以前のエポックはさかのぼって精算されません。"
  ko: "지갑을 연결하면 다음 에포크부터 SN25α를 받습니다. 이전 에포크는 소급해서 정산되지 않습니다."
  nl: "Koppel een wallet om vanaf de volgende epoch SN25α te verdienen. Eerdere epochs worden niet met terugwerkende kracht afgerekend."
  pl: "Połącz portfel, aby zarabiać SN25α od następnej epoki. Wcześniejsze epoki nie są rozliczane wstecz."
  pt: "Ligue uma carteira para ganhar SN25α a partir da próxima época. As épocas anteriores não são liquidadas retroativamente."
  pt-BR: "Conecte uma carteira para ganhar SN25α a partir da próxima época. Épocas anteriores não são liquidadas retroativamente."
  pt-PT: "Ligue uma carteira para ganhar SN25α a partir da próxima época. As épocas anteriores não são liquidadas retroativamente."
  ru: "Подключите кошелек, чтобы получать SN25α со следующей эпохи. Прошлые эпохи задним числом не рассчитываются."
  sv: "Anslut en plånbok för att tjäna SN25α från nästa epok. Tidigare epoker regleras inte i efterhand."
  sw: "Unganisha pochi ili upate SN25α kuanzia kipindi kijacho. Vipindi vya awali havilipwi kwa kurudi nyuma."
  th: "เชื่อมต่อกระเป๋าเงินเพื่อรับ SN25α ตั้งแต่อีพอคถัดไป อีพอคก่อนหน้าจะไม่ถูกชำระย้อนหลัง"
  uk: "Підключіть гаманець, щоб заробляти SN25α з наступної епохи. Попередні епохи заднім числом не розраховуються."
  vi: "Kết nối ví để kiếm SN25α từ epoch tiếp theo. Các epoch trước không được quyết toán hồi tố."
  zh: "连接钱包，即可从下一个周期开始赚取 SN25α。之前的周期不会追溯结算。"
  zh-HK: "連接錢包，即可由下一個週期開始賺取 SN25α。之前的週期不會追溯結算。"
