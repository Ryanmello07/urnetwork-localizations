description: "Help text under the manual extender list field."
source: "One hostname or IP address per line. These are added to the discovered extenders."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "اسم مضيف أو عنوان IP واحد في كل سطر. تُضاف هذه إلى الموسّعات المكتشفة."
  cs: "Jeden název hostitele nebo IP adresa na řádek. Přidají se k nalezeným extenderům."
  de: "Ein Hostname oder eine IP-Adresse pro Zeile. Diese werden zu den gefundenen Extendern hinzugefügt."
  el: "Ένα όνομα κεντρικού υπολογιστή ή μία διεύθυνση IP ανά γραμμή. Προστίθενται στους επεκτατές που εντοπίστηκαν."
  en: "One hostname or IP address per line. These are added to the discovered extenders."
  es: "Un nombre de host o una dirección IP por línea. Se añaden a los extensores descubiertos."
  es-419: "Un nombre de host o una dirección IP por línea. Se agregan a los extensores descubiertos."
  es-MX: "Un nombre de host o una dirección IP por línea. Se agregan a los extensores descubiertos."
  fr: "Un nom d’hôte ou une adresse IP par ligne. Ils s’ajoutent aux extendeurs découverts."
  he: "שם מארח אחד או כתובת IP אחת בכל שורה. הם יתווספו למרחיבים שהתגלו."
  hi: "हर पंक्ति में एक होस्टनेम या IP पता। इन्हें खोजे गए एक्सटेंडर में जोड़ा जाता है।"
  id: "Satu nama host atau alamat IP per baris. Ini ditambahkan ke extender yang ditemukan."
  it: "Un nome host o un indirizzo IP per riga. Vengono aggiunti agli extender rilevati."
  ja: "1 行に 1 つのホスト名または IP アドレス。検出されたエクステンダーに追加されます。"
  ko: "한 줄에 호스트 이름 또는 IP 주소 하나씩 입력하세요. 발견된 익스텐더에 추가됩니다."
  nl: "Eén hostnaam of IP-adres per regel. Deze worden toegevoegd aan de gevonden extenders."
  pl: "Jedna nazwa hosta lub adres IP w wierszu. Zostaną dodane do wykrytych extenderów."
  pt: "Um nome de anfitrião ou endereço IP por linha. São adicionados aos extensores descobertos."
  pt-BR: "Um nome de host ou endereço IP por linha. Eles são adicionados aos extensores descobertos."
  pt-PT: "Um nome de anfitrião ou endereço IP por linha. São adicionados aos extensores descobertos."
  ru: "Одно имя хоста или IP-адрес на строку. Они добавляются к найденным экстендерам."
  sv: "Ett värdnamn eller en IP-adress per rad. De läggs till de upptäckta extendrarna."
  sw: "Jina moja la seva au anwani moja ya IP kwa kila mstari. Hivi huongezwa kwenye vipanuzi vilivyogunduliwa."
  th: "ชื่อโฮสต์หรือที่อยู่ IP หนึ่งรายการต่อบรรทัด รายการเหล่านี้จะถูกเพิ่มเข้าไปในตัวขยายที่ค้นพบ"
  uk: "Одне ім’я хоста або IP-адреса в рядку. Їх буде додано до знайдених екстендерів."
  vi: "Mỗi dòng một tên máy chủ hoặc địa chỉ IP. Chúng sẽ được thêm vào các bộ mở rộng đã phát hiện."
  zh: "每行一个主机名或 IP 地址。这些将添加到已发现的扩展器中。"
  zh-HK: "每行一個主機名稱或 IP 地址。這些會加入已發現的擴展器。"
