description: "How to add a Home Screen widget on iOS (no pin-widget API)."
source: "Long-press the Home Screen, tap +, search URnetwork, and add a widget."
platforms:
  - apple
localizations:
  ar: "اضغط مطولًا على الشاشة الرئيسية، ثم اضغط على +، وابحث عن URnetwork، وأضف أداة."
  cs: "Podržte prst na ploše, klepněte na +, vyhledejte URnetwork a přidejte widget."
  de: "Drücke lange auf den Home-Bildschirm, tippe auf +, suche nach URnetwork und füge ein Widget hinzu."
  el: "Πατήστε παρατεταμένα την οθόνη Αφετηρίας, πατήστε +, αναζητήστε το URnetwork και προσθέστε ένα γραφικό στοιχείο."
  en: "Long-press the Home Screen, tap +, search URnetwork, and add a widget."
  es: "Mantén pulsada la pantalla de inicio, toca +, busca URnetwork y añade un widget."
  es-419: "Mantén presionada la pantalla de inicio, toca +, busca URnetwork y agrega un widget."
  es-MX: "Mantén presionada la pantalla de inicio, toca +, busca URnetwork y agrega un widget."
  fr: "Maintenez le doigt sur l’écran d’accueil, touchez +, recherchez URnetwork et ajoutez un widget."
  he: "לחצו לחיצה ארוכה על מסך הבית, הקישו על +, חפשו URnetwork והוסיפו ווידג׳ט."
  hi: "होम स्क्रीन को दबाकर रखें, + पर टैप करें, URnetwork खोजें, और एक विजेट जोड़ें।"
  id: "Tekan lama Layar Utama, ketuk +, cari URnetwork, dan tambahkan widget."
  it: "Tieni premuto sulla schermata Home, tocca +, cerca URnetwork e aggiungi un widget."
  ja: "ホーム画面を長押しし、＋をタップして URnetwork を検索し、ウィジェットを追加します。"
  ko: "홈 화면을 길게 누르고 +를 탭한 다음 URnetwork를 검색해 위젯을 추가하세요."
  nl: "Houd het beginscherm ingedrukt, tik op +, zoek URnetwork en voeg een widget toe."
  pl: "Przytrzymaj ekran początkowy, stuknij +, wyszukaj URnetwork i dodaj widżet."
  pt: "Mantenha premido o ecrã principal, toque em +, pesquise URnetwork e adicione um widget."
  pt-BR: "Toque e segure a Tela de Início, toque em +, busque URnetwork e adicione um widget."
  pt-PT: "Mantenha premido o ecrã principal, toque em +, pesquise URnetwork e adicione um widget."
  ru: "Нажмите и удерживайте экран «Домой», коснитесь +, найдите URnetwork и добавьте виджет."
  sv: "Tryck länge på hemskärmen, tryck på +, sök efter URnetwork och lägg till en widget."
  sw: "Bonyeza na ushikilie Skrini ya Kwanza, gusa +, tafuta URnetwork, na uongeze wijeti."
  th: "แตะหน้าจอโฮมค้างไว้ แตะ + ค้นหา URnetwork แล้วเพิ่มวิดเจ็ต"
  uk: "Утримуйте початковий екран, торкніться +, знайдіть URnetwork і додайте віджет."
  vi: "Nhấn giữ Màn hình chính, chạm +, tìm URnetwork và thêm một tiện ích."
  zh: "长按主屏幕，轻点 +，搜索 URnetwork，然后添加小组件。"
  zh-HK: "長按主畫面，點按 +，搜尋 URnetwork，然後加入小工具。"
