description: "Update channel (Windows): a local development build, which has release code 0 and never updates."
source: "A dev build (code 0) never updates itself, so it has no update channel."
platforms:
  - windows
localizations:
  ar: "إصدار التطوير (الرمز 0) لا يحدّث نفسه أبدًا، لذا ليست له قناة تحديث."
  cs: "Vývojové sestavení (kód 0) se nikdy samo neaktualizuje, takže nemá kanál aktualizací."
  de: "Ein Entwicklungs-Build (Code 0) aktualisiert sich nie selbst und hat daher keinen Update-Kanal."
  el: "Μια έκδοση ανάπτυξης (κωδικός 0) δεν ενημερώνεται ποτέ μόνη της, οπότε δεν έχει κανάλι ενημερώσεων."
  en: "A dev build (code 0) never updates itself, so it has no update channel."
  es: "Una compilación de desarrollo (código 0) nunca se actualiza sola, así que no tiene canal de actualizaciones."
  es-419: "Una compilación de desarrollo (código 0) nunca se actualiza sola, así que no tiene canal de actualizaciones."
  es-MX: "Una compilación de desarrollo (código 0) nunca se actualiza sola, así que no tiene canal de actualizaciones."
  fr: "Une version de développement (code 0) ne se met jamais à jour elle-même : elle n’a donc pas de canal de mise à jour."
  he: "גרסת פיתוח (קוד 0) אף פעם לא מעדכנת את עצמה, ולכן אין לה ערוץ עדכונים."
  hi: "डेवलपमेंट बिल्ड (कोड 0) कभी खुद अपडेट नहीं होता, इसलिए उसका कोई अपडेट चैनल नहीं है।"
  id: "Build pengembangan (kode 0) tidak pernah memperbarui dirinya sendiri, jadi tidak memiliki saluran pembaruan."
  it: "Una build di sviluppo (codice 0) non si aggiorna mai da sola, quindi non ha un canale di aggiornamento."
  ja: "開発ビルド（コード 0）は自動でアップデートされないため、アップデートチャンネルはありません。"
  ko: "개발 빌드(코드 0)는 스스로 업데이트되지 않으므로 업데이트 채널이 없습니다."
  nl: "Een ontwikkelversie (code 0) werkt zichzelf nooit bij en heeft dus geen updatekanaal."
  pl: "Wersja deweloperska (kod 0) nigdy nie aktualizuje się sama, więc nie ma kanału aktualizacji."
  pt: "Uma versão de desenvolvimento (código 0) nunca se atualiza sozinha, pelo que não tem canal de atualização."
  pt-BR: "Uma versão de desenvolvimento (código 0) nunca se atualiza sozinha, então não tem canal de atualização."
  pt-PT: "Uma versão de desenvolvimento (código 0) nunca se atualiza sozinha, pelo que não tem canal de atualização."
  ru: "Сборка для разработки (код 0) никогда не обновляется сама, поэтому у неё нет канала обновлений."
  sv: "En utvecklingsversion (kod 0) uppdaterar aldrig sig själv och har därför ingen uppdateringskanal."
  sw: "Toleo la uundaji (msimbo 0) halijisasishi kamwe, kwa hivyo halina chaneli ya masasisho."
  th: "บิลด์สำหรับพัฒนา (รหัส 0) ไม่อัปเดตตัวเอง จึงไม่มีช่องทางการอัปเดต"
  uk: "Збірка для розробки (код 0) ніколи не оновлюється сама, тому не має каналу оновлень."
  vi: "Bản phát triển (mã 0) không bao giờ tự cập nhật nên không có kênh cập nhật."
  zh: "开发版本（代码 0）永远不会自行更新，因此没有更新渠道。"
  zh-HK: "開發版本（代碼 0）永遠不會自行更新，因此沒有更新頻道。"
