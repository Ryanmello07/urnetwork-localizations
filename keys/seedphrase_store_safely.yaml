description: "Seedphrase sheet: advice to write the seedphrase down and store it safely."
source: "Write it down and store it somewhere safe. If you lose it, you'll lose access to your account."
platforms:
  - linux
  - windows
localizations:
  ar: "اكتبها واحفظها في مكان آمن. إذا فقدتها، ستفقد الوصول إلى حسابك."
  cs: "Zapište si ji a uložte na bezpečné místo. Když ji ztratíte, ztratíte přístup ke svému účtu."
  de: "Schreib sie auf und bewahre sie an einem sicheren Ort auf. Wenn du sie verlierst, verlierst du den Zugang zu deinem Konto."
  el: "Γράψτε την και φυλάξτε την κάπου ασφαλή. Αν τη χάσετε, θα χάσετε την πρόσβαση στον λογαριασμό σας."
  en: "Write it down and store it somewhere safe. If you lose it, you'll lose access to your account."
  es: "Anótala y guárdala en un lugar seguro. Si la pierdes, perderás el acceso a tu cuenta."
  es-419: "Anótala y guárdala en un lugar seguro. Si la pierdes, perderás el acceso a tu cuenta."
  es-MX: "Anótala y guárdala en un lugar seguro. Si la pierdes, perderás el acceso a tu cuenta."
  fr: "Notez-la et conservez-la en lieu sûr. Si vous la perdez, vous perdrez l’accès à votre compte."
  he: "כתבו אותו ושמרו אותו במקום בטוח. אם תאבדו אותו, תאבדו את הגישה לחשבון שלכם."
  hi: "इसे लिख लें और सुरक्षित जगह रखें। यदि आप इसे खो देते हैं, तो आप अपने खाते तक पहुँच खो देंगे।"
  id: "Tulis dan simpan di tempat yang aman. Jika hilang, Anda akan kehilangan akses ke akun Anda."
  it: "Scrivila e conservala in un luogo sicuro. Se la perdi, perderai l’accesso al tuo account."
  ja: "書き留めて安全な場所に保管してください。紛失するとアカウントにアクセスできなくなります。"
  ko: "적어서 안전한 곳에 보관하세요. 잃어버리면 계정에 접근할 수 없게 됩니다."
  nl: "Schrijf hem op en bewaar hem op een veilige plek. Als je hem verliest, verlies je de toegang tot je account."
  pl: "Zapisz ją i przechowuj w bezpiecznym miejscu. Jeśli ją zgubisz, stracisz dostęp do konta."
  pt: "Anote e guarde em um lugar seguro. Se você a perder, perderá o acesso à sua conta."
  pt-BR: "Anote e guarde em um lugar seguro. Se você a perder, perderá o acesso à sua conta."
  pt-PT: "Anote-a e guarde-a num local seguro. Se a perder, perderá o acesso à sua conta."
  ru: "Запишите её и храните в надёжном месте. Если потеряете, потеряете доступ к аккаунту."
  sv: "Skriv ned den och förvara den på ett säkert ställe. Om du förlorar den förlorar du åtkomsten till ditt konto."
  sw: "Kiandike na ukihifadhi mahali salama. Ukikipoteza, utapoteza ufikiaji wa akaunti yako."
  th: "จดไว้และเก็บในที่ปลอดภัย หากทำหาย คุณจะไม่สามารถเข้าถึงบัญชีของคุณได้"
  uk: "Запишіть її та зберігайте в надійному місці. Якщо втратите, втратите доступ до облікового запису."
  vi: "Hãy ghi lại và cất ở nơi an toàn. Nếu làm mất, bạn sẽ mất quyền truy cập vào tài khoản."
  zh: "请写下来并妥善保管。如果丢失，你将无法访问你的账户。"
  zh-HK: "請寫下來並妥善保管。如果遺失，你將無法存取你的帳戶。"
