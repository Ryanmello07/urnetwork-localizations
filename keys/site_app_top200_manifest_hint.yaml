description: "App top200: how to create and publish the fleet manifest and where an app shows its member entry"
source: "Write the fleet manifest on a provider device with provider fleet init (the command below, filled in for this deployment; add each other device with --member=<client_id>:<client_key>), then publish its commitment from your hotkey with provider fleet publish. Publishing on mainnet opens once the mainnet fleet runtime is approved. Paste the manifest here with the validity epochs to build each device's binding. The app shows its device's member entry for the manifest under Earnings › Top 200 › Sign fleet binding."
platforms:
  - site
localizations:
  ar: "اكتب بيان الأسطول على جهاز مزوّد باستخدام provider fleet init (الأمر أدناه، مملوءًا لهذا النشر؛ أضف كل جهاز آخر باستخدام --member=<client_id>:<client_key>)، ثم انشر التزامه من مفتاحك الساخن باستخدام provider fleet publish. يُفتح النشر على الشبكة الرئيسية بمجرد اعتماد بيئة تشغيل الأسطول على الشبكة الرئيسية. الصق البيان هنا مع حقب الصلاحية لإنشاء ربط كل جهاز. يعرض التطبيق إدخال العضو الخاص بجهازه للبيان في الأرباح › أفضل 200 › توقيع ربط الأسطول."
  de: "Erstelle das Flotten-Manifest auf einem Provider-Gerät mit provider fleet init (der Befehl unten, für dieses Deployment ausgefüllt; füge jedes weitere Gerät mit --member=<client_id>:<client_key> hinzu) und veröffentliche dann seine Commitment mit deinem Hotkey per provider fleet publish. Das Veröffentlichen im Mainnet ist möglich, sobald die Mainnet-Flotten-Runtime freigegeben ist. Füge das Manifest hier mit den Gültigkeitsepochen ein, um die Bindung jedes Geräts zu erstellen. Die App zeigt den Mitgliedseintrag ihres Geräts für das Manifest unter Einnahmen › Top 200 › Flottenbindung signieren."
  en: "Write the fleet manifest on a provider device with provider fleet init (the command below, filled in for this deployment; add each other device with --member=<client_id>:<client_key>), then publish its commitment from your hotkey with provider fleet publish. Publishing on mainnet opens once the mainnet fleet runtime is approved. Paste the manifest here with the validity epochs to build each device's binding. The app shows its device's member entry for the manifest under Earnings › Top 200 › Sign fleet binding."
  es: "Crea el manifiesto de flota en un dispositivo proveedor con provider fleet init (el comando de abajo, ya completado para este despliegue; añade cada otro dispositivo con --member=<client_id>:<client_key>) y luego publica su compromiso desde tu hotkey con provider fleet publish. La publicación en mainnet se abrirá cuando se apruebe el runtime de flota de mainnet. Pega aquí el manifiesto con las épocas de validez para generar la vinculación de cada dispositivo. La app muestra la entrada de miembro de su dispositivo para el manifiesto en Ganancias › Top 200 › Firmar vinculación de flota."
  ru: "Создайте манифест парка на устройстве провайдера командой provider fleet init (команда ниже, уже заполненная для этого развёртывания; каждое другое устройство добавьте через --member=<client_id>:<client_key>), затем опубликуйте его коммитмент со своего хоткея командой provider fleet publish. Публикация в mainnet откроется, когда будет одобрена среда выполнения парка для mainnet. Вставьте манифест сюда вместе с эпохами действия, чтобы создать привязку для каждого устройства. Приложение показывает запись участника своего устройства для манифеста в разделе Заработок › Топ-200 › Подписать привязку парка."
  zh: "在一台提供方设备上用 provider fleet init 生成设备群清单（即下方已为此部署填好的命令；其他每台设备用 --member=<client_id>:<client_key> 添加），然后用 provider fleet publish 从您的热键发布其承诺。主网的发布将在主网设备群运行时获批后开放。将清单与有效纪元一起粘贴到此处，即可为每台设备生成绑定。应用会在 收益 › 前 200 名 › 签署设备群绑定 中显示其设备用于清单的成员条目。"
