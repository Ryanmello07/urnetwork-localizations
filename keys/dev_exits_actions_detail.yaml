description: "Developer page: explanation of the drop, stall and shuffle actions."
source: "Drop, Stall and Shuffle degrade the live connection on purpose, immediately. Nothing here is queued or retried — an action that misses is reported, not replayed."
platforms:
  - linux
localizations:
  ar: "«إسقاط» و«إيقاف» و«الخلط» تُضعف الاتصال الحالي عمدًا وفورًا. لا شيء هنا يوضع في قائمة انتظار أو تُعاد محاولته: الإجراء الذي يفشل يُبلَّغ عنه ولا يُكرَّر."
  cs: "„Vyřadit“, „Zaseknout“ a „Zamíchat“ záměrně a okamžitě zhoršují aktivní připojení. Nic se tu neřadí do fronty ani neopakuje: akce, která se nepovede, se nahlásí, ne zopakuje."
  de: "„Verwerfen“, „Hängen lassen“ und „Neu mischen“ verschlechtern die aktive Verbindung absichtlich und sofort. Nichts hier wird eingereiht oder wiederholt – eine Aktion, die ins Leere geht, wird gemeldet, nicht nachgeholt."
  el: "Η Απόρριψη, το Κόλλημα και το Ανακάτεμα υποβαθμίζουν σκόπιμα και αμέσως την ενεργή σύνδεση. Τίποτα εδώ δεν μπαίνει σε ουρά ούτε επαναλαμβάνεται — μια ενέργεια που αποτυγχάνει αναφέρεται, δεν ξαναγίνεται."
  en: "Drop, Stall and Shuffle degrade the live connection on purpose, immediately. Nothing here is queued or retried — an action that misses is reported, not replayed."
  es: "Descartar, Bloquear y Reordenar degradan la conexión activa a propósito y al instante. Aquí nada se pone en cola ni se reintenta: una acción que falla se informa, no se repite."
  es-419: "Descartar, Trabar y Reordenar degradan la conexión activa a propósito y al instante. Aquí nada se pone en cola ni se reintenta: una acción que falla se informa, no se repite."
  es-MX: "Descartar, Trabar y Reordenar degradan la conexión activa a propósito y al instante. Aquí nada se pone en cola ni se reintenta: una acción que falla se informa, no se repite."
  fr: "Écarter, Figer et Mélanger dégradent la connexion en cours, volontairement et immédiatement. Rien n’est mis en file d’attente ni relancé ici : une action qui échoue est signalée, pas rejouée."
  he: "הסרה, תקיעה וערבוב פוגעים בחיבור הפעיל בכוונה ומיד. שום דבר כאן לא נכנס לתור ולא מנוסה שוב — פעולה שלא הצליחה מדווחת, לא מבוצעת מחדש."
  hi: "हटाएँ, अटकाएँ और फेंटें जानबूझकर और तुरंत लाइव कनेक्शन को खराब करते हैं। यहाँ कुछ भी कतार में नहीं जाता और न ही दोबारा आज़माया जाता है — जो कार्रवाई चूक जाती है, उसकी रिपोर्ट होती है, उसे दोहराया नहीं जाता।"
  id: "Buang, Buat macet, dan Acak sengaja menurunkan kualitas koneksi aktif, seketika. Tidak ada yang diantrekan atau dicoba ulang di sini — tindakan yang meleset dilaporkan, tidak diulang."
  it: "Scarta, Blocca e Mescola degradano la connessione attiva di proposito e subito. Qui nulla viene messo in coda o ritentato: un’azione che fallisce viene segnalata, non ripetuta."
  ja: "「除外」「停止させる」「シャッフル」は、稼働中の接続を意図的にただちに劣化させます。ここでは何もキューに入れず、再試行もしません。失敗した操作は報告されるだけで、やり直されません。"
  ko: "제외, 멈추기, 섞기는 활성 연결을 의도적으로 즉시 저하시킵니다. 여기서는 아무것도 대기열에 넣거나 재시도하지 않으며, 실패한 작업은 다시 실행하지 않고 보고만 합니다."
  nl: "Verwijderen, Laten vastlopen en Schudden verslechteren de actieve verbinding met opzet en meteen. Niets hier wordt in de wachtrij gezet of opnieuw geprobeerd: een actie die mislukt, wordt gemeld, niet herhaald."
  pl: "„Odrzuć”, „Zablokuj” i „Przetasuj” celowo i natychmiast pogarszają aktywne połączenie. Nic tutaj nie trafia do kolejki ani nie jest ponawiane: nieudana akcja jest zgłaszana, a nie powtarzana."
  pt: "Descartar, Bloquear e Baralhar degradam a ligação ativa de propósito e de imediato. Nada aqui fica em fila nem é repetido: uma ação que falha é comunicada, não refeita."
  pt-BR: "Descartar, Travar e Embaralhar degradam a conexão ativa de propósito e na hora. Nada aqui entra em fila nem é repetido: uma ação que falha é informada, não refeita."
  pt-PT: "Descartar, Bloquear e Baralhar degradam a ligação ativa de propósito e de imediato. Nada aqui fica em fila nem é repetido: uma ação que falha é comunicada, não refeita."
  ru: "«Отключить», «Заморозить» и «Перемешать» намеренно и сразу ухудшают активное соединение. Здесь ничего не ставится в очередь и не повторяется: неудачное действие отображается в отчёте, а не выполняется заново."
  sv: "Ta bort, Lås och Blanda försämrar den aktiva anslutningen avsiktligt och direkt. Inget här köas eller försöks igen – en åtgärd som missar rapporteras, den upprepas inte."
  sw: "Ondoa, Kwamisha na Changanya hudhoofisha muunganisho unaoendelea kwa makusudi, mara moja. Hakuna kitu hapa kinachowekwa kwenye foleni au kujaribiwa tena — kitendo kinachokosa huripotiwa, hakirudiwi."
  th: "ตัดทิ้ง ทำให้ค้าง และสับเปลี่ยน ตั้งใจทำให้การเชื่อมต่อที่ใช้งานอยู่แย่ลงทันที ไม่มีสิ่งใดที่นี่ถูกเข้าคิวหรือลองใหม่ — การดำเนินการที่พลาดจะถูกรายงาน ไม่ถูกทำซ้ำ"
  uk: "«Відкинути», «Заблокувати» й «Перемішати» навмисно й одразу погіршують активне з’єднання. Тут нічого не стає в чергу й не повторюється: невдала дія потрапляє у звіт, а не виконується знову."
  vi: "Loại, Làm kẹt và Xáo trộn cố ý làm suy giảm kết nối đang hoạt động, ngay lập tức. Không có gì ở đây được xếp hàng hay thử lại — thao tác nào trượt sẽ được báo cáo, không được làm lại."
  zh: "“丢弃”“使停滞”和“随机打乱”会立即、有意地降低当前连接的质量。这里不会排队或重试任何操作——未成功的操作只会报告，不会重放。"
  zh-HK: "「捨棄」、「令其停滯」和「隨機打亂」會刻意並即時降低目前連線的質素。這裡不會排隊或重試任何操作——未成功的操作只會報告，不會重做。"
