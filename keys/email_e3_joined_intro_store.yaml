description: "Onboarding email E3a, for networks billed by the App Store or Google Play: the opening paragraph WITHOUT a price (the store shows its own local price). Same text as email_e3_joined_intro minus its price sentence."
source: "When you joined, we set aside a welcome offer for you: a year of Pro with 3 months free."
platforms:
  - email
localizations:
  en: "When you joined, we set aside a welcome offer for you: a year of Pro with 3 months free."
  ar: "عندما انضممت، خصصنا لك عرض ترحيب: سنة من Pro مع 3 أشهر مجانية."
  cs: "Když jste se přidali, odložili jsme pro vás uvítací nabídku: rok Pro se 3 měsíci zdarma."
  de: "Als du dazugekommen bist, haben wir ein Willkommensangebot für dich beiseitegelegt: ein Jahr Pro mit 3 Gratis-Monaten."
  el: "Όταν μπήκες, κρατήσαμε μια προσφορά καλωσορίσματος για σένα: ένας χρόνος Pro με 3 μήνες δωρεάν."
  es: "Cuando te uniste, reservamos una oferta de bienvenida para ti: un año de Pro con 3 meses gratis."
  es-419: "Cuando te uniste, reservamos una oferta de bienvenida para ti: un año de Pro con 3 meses gratis."
  es-MX: "Cuando te uniste, reservamos una oferta de bienvenida para ti: un año de Pro con 3 meses gratis."
  fr: "Quand tu nous as rejoints, on t'a réservé une offre de bienvenue : un an de Pro avec 3 mois offerts."
  he: "כשהצטרפתם, שמרנו לכם מבצע ברוכים הבאים: שנה של Pro עם 3 חודשים בחינם."
  hi: "जब आप जुड़े, हमने आपके लिए एक स्वागत ऑफ़र रखा: Pro का एक साल, 3 महीने मुफ़्त।"
  id: "Saat kamu bergabung, kami menyiapkan penawaran sambutan untukmu: setahun Pro dengan 3 bulan gratis."
  it: "Quando ti sei iscritto, abbiamo messo da parte un'offerta di benvenuto per te: un anno di Pro con 3 mesi gratis."
  ja: "登録いただいたとき、ウェルカムオファーをご用意しました。Pro 1年分、3か月無料つき。"
  ko: "가입하셨을 때 환영 혜택을 준비해 두었습니다. Pro 1년에 3개월 무료."
  nl: "Toen je je aanmeldde, hebben we een welkomstaanbieding voor je klaargezet: een jaar Pro met 3 maanden gratis."
  pl: "Gdy dołączyłeś, odłożyliśmy dla ciebie ofertę powitalną: rok Pro z 3 miesiącami za darmo."
  pt: "Quando você entrou, separamos uma oferta de boas-vindas para você: um ano de Pro com 3 meses grátis."
  pt-BR: "Quando você entrou, separamos uma oferta de boas-vindas para você: um ano de Pro com 3 meses grátis."
  pt-PT: "Quando se juntou a nós, reservámos uma oferta de boas-vindas para si: um ano de Pro com 3 meses grátis."
  ru: "Когда вы присоединились, мы отложили для вас приветственное предложение: год Pro с 3 бесплатными месяцами."
  sv: "När du gick med lade vi undan ett välkomsterbjudande åt dig: ett år Pro med 3 månader gratis."
  sw: "Ulipojiunga, tulikuwekea ofa ya kukaribisha: mwaka mmoja wa Pro na miezi 3 bila malipo."
  th: "ตอนที่คุณเข้าร่วม เราเก็บข้อเสนอต้อนรับไว้ให้คุณ: Pro หนึ่งปี ฟรี 3 เดือน"
  uk: "Коли ви приєдналися, ми відклали для вас вітальну пропозицію: рік Pro з 3 безкоштовними місяцями."
  vi: "Khi bạn tham gia, chúng tôi đã dành sẵn một ưu đãi chào mừng cho bạn: một năm Pro với 3 tháng miễn phí."
  zh: "你加入时，我们为你预留了一份欢迎优惠：一年 Pro，免费 3 个月。"
  zh-HK: "你加入時，我們為你預留了一份歡迎優惠：一年 Pro，免費 3 個月。"
