description: "Shown once when the check for a Solana Pay payment (started when the app returns from the wallet) has run 20 seconds without the payment landing. The check keeps going for up to two minutes; the app cannot know whether the wallet actually sent anything, so do not say the payment was received."
source: "Still checking for your Solana payment. Confirmation on the network can take a minute or two."
platforms:
  - android
localizations:
  ar: "لا نزال نتحقق من دفعتك عبر Solana. قد يستغرق التأكيد على الشبكة دقيقة أو دقيقتين."
  cs: "Vaši platbu na síti Solana stále ověřujeme. Potvrzení v síti může trvat minutu nebo dvě."
  de: "Wir prüfen deine Solana-Zahlung noch. Die Bestätigung im Netzwerk kann ein bis zwei Minuten dauern."
  el: "Ελέγχουμε ακόμη την πληρωμή σας στο Solana. Η επιβεβαίωση στο δίκτυο μπορεί να διαρκέσει ένα ή δύο λεπτά."
  en: "Still checking for your Solana payment. Confirmation on the network can take a minute or two."
  es: "Seguimos comprobando tu pago de Solana. La confirmación en la red puede tardar uno o dos minutos."
  es-419: "Seguimos verificando tu pago de Solana. La confirmación en la red puede tardar uno o dos minutos."
  es-MX: "Seguimos verificando tu pago de Solana. La confirmación en la red puede tardar uno o dos minutos."
  fr: "Nous vérifions encore votre paiement Solana. La confirmation sur le réseau peut prendre une minute ou deux."
  he: "אנחנו עדיין בודקים את התשלום שלכם ברשת Solana. האישור ברשת עשוי לקחת דקה או שתיים."
  hi: "आपके Solana भुगतान की जाँच अभी जारी है। नेटवर्क पर पुष्टि में एक-दो मिनट लग सकते हैं।"
  id: "Masih memeriksa pembayaran Solana Anda. Konfirmasi di jaringan bisa memakan waktu satu atau dua menit."
  it: "Stiamo ancora verificando il tuo pagamento Solana. La conferma sulla rete può richiedere un paio di minuti."
  ja: "Solana での支払いをまだ確認しています。ネットワーク上の確認には 1～2 分かかることがあります。"
  ko: "Solana 결제를 아직 확인하고 있습니다. 네트워크에서 확인되기까지 1~2분 걸릴 수 있습니다."
  nl: "We controleren je Solana-betaling nog. Bevestiging op het netwerk kan een minuut of twee duren."
  pl: "Nadal sprawdzamy twoją płatność w sieci Solana. Potwierdzenie w sieci może potrwać minutę lub dwie."
  pt: "Ainda a verificar o seu pagamento Solana. A confirmação na rede pode demorar um ou dois minutos."
  pt-BR: "Ainda verificando seu pagamento Solana. A confirmação na rede pode levar um ou dois minutos."
  pt-PT: "Ainda a verificar o seu pagamento Solana. A confirmação na rede pode demorar um ou dois minutos."
  ru: "Всё ещё проверяем ваш платёж в Solana. Подтверждение в сети может занять минуту-две."
  sv: "Vi kontrollerar fortfarande din Solana-betalning. Bekräftelse på nätverket kan ta en minut eller två."
  sw: "Bado tunakagua malipo yako ya Solana. Uthibitishaji kwenye mtandao unaweza kuchukua dakika moja au mbili."
  th: "ยังคงตรวจสอบการชำระเงิน Solana ของคุณ การยืนยันบนเครือข่ายอาจใช้เวลาหนึ่งถึงสองนาที"
  uk: "Ми ще перевіряємо ваш платіж у мережі Solana. Підтвердження в мережі може тривати хвилину-дві."
  vi: "Vẫn đang kiểm tra khoản thanh toán Solana của bạn. Việc xác nhận trên mạng có thể mất một hai phút."
  zh: "仍在检查您的 Solana 付款。网络确认可能需要一两分钟。"
  zh-HK: "仍在檢查你的 Solana 付款。網絡確認可能需要一兩分鐘。"
