description: "Linux Settings update notice when the app cannot replace itself: the verified file's path is shown in the row below."
source: "This AppImage's folder is not writable, so the verified download was saved below. Replace the AppImage with it by hand."
platforms:
  - linux
localizations:
  ar: "مجلد ملف AppImage هذا غير قابل للكتابة، لذا حُفظ الملف الذي تم التحقق منه أدناه. استبدل به ملف AppImage يدويًا."
  cs: "Do složky tohoto AppImage nelze zapisovat, proto byl ověřený soubor uložen níže. Nahraďte jím AppImage ručně."
  de: "Der Ordner dieses AppImages ist nicht beschreibbar, daher wurde der geprüfte Download unten gespeichert. Ersetze das AppImage manuell damit."
  el: "Ο φάκελος αυτού του AppImage δεν είναι εγγράψιμος, οπότε η επαληθευμένη λήψη αποθηκεύτηκε παρακάτω. Αντικαταστήστε με αυτήν το AppImage χειροκίνητα."
  en: "This AppImage's folder is not writable, so the verified download was saved below. Replace the AppImage with it by hand."
  es: "La carpeta de esta AppImage no admite escritura, así que la descarga verificada se guardó abajo. Sustituye la AppImage por ella manualmente."
  es-419: "La carpeta de esta AppImage no admite escritura, así que la descarga verificada se guardó abajo. Sustituye la AppImage por ella manualmente."
  es-MX: "La carpeta de esta AppImage no admite escritura, así que la descarga verificada se guardó abajo. Sustituye la AppImage por ella manualmente."
  fr: "Le dossier de cette AppImage n’est pas accessible en écriture, le téléchargement vérifié a donc été enregistré ci-dessous. Remplacez l’AppImage par celui-ci manuellement."
  he: "אין הרשאת כתיבה לתיקייה של ה-AppImage הזה, ולכן ההורדה שאומתה נשמרה למטה. החליפו בה את ה-AppImage ידנית."
  hi: "इस AppImage के फ़ोल्डर में लिखा नहीं जा सकता, इसलिए सत्यापित डाउनलोड नीचे सहेजा गया है। AppImage को इससे मैन्युअल रूप से बदलें।"
  id: "Folder AppImage ini tidak dapat ditulisi, jadi unduhan yang sudah diverifikasi disimpan di bawah. Ganti AppImage dengannya secara manual."
  it: "La cartella di questa AppImage non è scrivibile, quindi il download verificato è stato salvato qui sotto. Sostituisci manualmente l’AppImage con questo file."
  ja: "この AppImage のフォルダに書き込めないため、検証済みのダウンロードを下に保存しました。手動で AppImage を置き換えてください。"
  ko: "이 AppImage의 폴더에 쓸 수 없어 확인된 다운로드를 아래에 저장했습니다. 직접 AppImage를 이 파일로 교체하세요."
  nl: "De map van deze AppImage is niet beschrijfbaar, dus de gecontroleerde download is hieronder opgeslagen. Vervang de AppImage er handmatig door."
  pl: "Folder tego pliku AppImage nie jest zapisywalny, więc zweryfikowany plik zapisano poniżej. Zastąp nim AppImage ręcznie."
  pt: "A pasta deste AppImage não permite gravação, então o download verificado foi salvo abaixo. Substitua o AppImage por ele manualmente."
  pt-BR: "A pasta deste AppImage não permite gravação, então o download verificado foi salvo abaixo. Substitua o AppImage por ele manualmente."
  pt-PT: "A pasta desta AppImage não permite escrita, por isso a transferência verificada foi guardada abaixo. Substitua a AppImage por ela manualmente."
  ru: "Папка этого AppImage недоступна для записи, поэтому проверенный файл сохранён ниже. Замените им AppImage вручную."
  sv: "Den här AppImage-filens mapp är inte skrivbar, så den verifierade nedladdningen sparades nedan. Ersätt AppImage-filen med den manuellt."
  sw: "Folda ya AppImage hii haiwezi kuandikwa, kwa hivyo faili lililothibitishwa limehifadhiwa hapa chini. Badilisha AppImage kwa faili hilo wewe mwenyewe."
  th: "โฟลเดอร์ของ AppImage นี้เขียนไม่ได้ จึงบันทึกไฟล์ที่ตรวจสอบแล้วไว้ด้านล่าง แทนที่ AppImage ด้วยไฟล์นี้ด้วยตนเอง"
  uk: "Папка цього AppImage недоступна для запису, тож перевірений файл збережено нижче. Замініть ним AppImage вручну."
  vi: "Không thể ghi vào thư mục của AppImage này, nên tệp tải về đã xác minh được lưu bên dưới. Hãy tự thay AppImage bằng tệp đó."
  zh: "此 AppImage 所在的文件夹不可写，因此已将验证过的下载文件保存在下方。请手动用它替换 AppImage。"
  zh-HK: "此 AppImage 所在的資料夾無法寫入，因此已將驗證過的下載檔案儲存在下方。請手動用它取代 AppImage。"
