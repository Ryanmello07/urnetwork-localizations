description: "Points leaderboard: the explanation under the list header."
source: "All-time points. A block is one finalized epoch; the streak counts consecutive blocks with points, ending at the latest one."
platforms:
  - android
  - apple
  - site
  - windows
  - linux
localizations:
  ar: "النقاط منذ البداية. الكتلة هي فترة مكتملة واحدة؛ وتحسب السلسلة الكتل المتتالية ذات النقاط حتى آخر كتلة."
  cs: "Body za celou dobu. Blok je jedna dokončená epocha; série počítá po sobě jdoucí bloky s body končící tím posledním."
  de: "Punkte seit Beginn. Ein Block ist eine abgeschlossene Epoche; die Serie zählt aufeinanderfolgende Blöcke mit Punkten bis zum letzten."
  el: "Πόντοι όλων των εποχών. Ένα μπλοκ είναι μία οριστικοποιημένη εποχή· το σερί μετρά διαδοχικά μπλοκ με πόντους έως το τελευταίο."
  en: "All-time points. A block is one finalized epoch; the streak counts consecutive blocks with points, ending at the latest one."
  es: "Puntos históricos. Un bloque es una época finalizada; la racha cuenta bloques consecutivos con puntos hasta el último."
  es-419: "Puntos históricos. Un bloque es una época finalizada; la racha cuenta bloques consecutivos con puntos hasta el último."
  es-MX: "Puntos históricos. Un bloque es una época finalizada; la racha cuenta bloques consecutivos con puntos hasta el último."
  fr: "Points cumulés. Un bloc est une époque finalisée ; la série compte les blocs consécutifs avec des points jusqu'au dernier."
  he: "נקודות מאז ומעולם. בלוק הוא תקופה שהושלמה; הרצף סופר בלוקים רצופים עם נקודות עד האחרון."
  hi: "अब तक के कुल पॉइंट। एक ब्लॉक एक पूर्ण एपोक है; स्ट्रीक पॉइंट वाले लगातार ब्लॉक गिनती है, जो नवीनतम पर समाप्त होती है।"
  id: "Poin sepanjang waktu. Satu blok adalah satu epoch yang difinalisasi; runtutan menghitung blok berturut-turut dengan poin hingga yang terakhir."
  it: "Punti complessivi. Un blocco è un'epoca finalizzata; la serie conta i blocchi consecutivi con punti fino all'ultimo."
  ja: "累計ポイント。ブロックは確定した1エポック。連続は最新ブロックまでポイントを獲得した連続ブロック数です。"
  ko: "누적 포인트입니다. 블록은 확정된 에포크 하나이며, 연속은 최신 블록까지 포인트를 얻은 연속 블록 수입니다."
  nl: "Punten aller tijden. Een blok is één afgeronde epoch; de reeks telt opeenvolgende blokken met punten tot het laatste."
  pl: "Punkty od początku. Blok to jedna sfinalizowana epoka; seria liczy kolejne bloki z punktami aż do ostatniego."
  pt: "Pontos de sempre. Um bloco é uma época finalizada; a sequência conta blocos consecutivos com pontos até ao último."
  pt-BR: "Pontos de todos os tempos. Um bloco é uma época finalizada; a sequência conta blocos consecutivos com pontos até o último."
  pt-PT: "Pontos de sempre. Um bloco é uma época finalizada; a sequência conta blocos consecutivos com pontos até ao último."
  ru: "Очки за всё время. Блок — одна завершённая эпоха; серия считает подряд идущие блоки с очками до последнего."
  sv: "Poäng genom tiderna. Ett block är en slutförd epok; sviten räknar på varandra följande block med poäng fram till det senaste."
  sw: "Pointi za wakati wote. Kitalu ni kipindi kimoja kilichokamilika; mfululizo huhesabu vitalu mfululizo vyenye pointi hadi cha mwisho."
  th: "คะแนนสะสมทั้งหมด บล็อกคือหนึ่งอีพอคที่สรุปแล้ว ต่อเนื่องนับบล็อกที่มีคะแนนติดต่อกันจนถึงบล็อกล่าสุด"
  uk: "Бали за весь час. Блок — одна завершена епоха; серія рахує послідовні блоки з балами до останнього."
  vi: "Điểm tích lũy. Một khối là một epoch đã hoàn tất; chuỗi đếm các khối liên tiếp có điểm cho đến khối mới nhất."
  zh: "历史累计积分。一个区块是一个已确认的周期；连续统计直到最新区块的连续得分区块数。"
  zh-HK: "歷史累計積分。一個區塊是一個已確認的週期；連續統計直到最新區塊的連續得分區塊數。"
