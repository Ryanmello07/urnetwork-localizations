description: "Developer page: shown when the system service is not attached."
source: "The URnetwork service is not attached, so the live connection cannot be read."
platforms:
  - linux
  - windows
localizations:
  ar: "خدمة URnetwork غير مرتبطة، لذا لا يمكن قراءة الاتصال الحالي."
  cs: "Služba URnetwork není připojena, takže aktivní připojení nelze přečíst."
  de: "Der URnetwork-Dienst ist nicht angebunden, daher lässt sich die aktive Verbindung nicht auslesen."
  el: "Η υπηρεσία URnetwork δεν είναι συνδεδεμένη, οπότε η ενεργή σύνδεση δεν μπορεί να διαβαστεί."
  en: "The URnetwork service is not attached, so the live connection cannot be read."
  es: "El servicio de URnetwork no está conectado, así que no se puede leer la conexión activa."
  es-419: "El servicio de URnetwork no está conectado, así que no se puede leer la conexión activa."
  es-MX: "El servicio de URnetwork no está conectado, así que no se puede leer la conexión activa."
  fr: "Le service URnetwork n’est pas rattaché : la connexion en cours ne peut donc pas être lue."
  he: "השירות של URnetwork לא מחובר, ולכן אי אפשר לקרוא את החיבור הפעיל."
  hi: "URnetwork सेवा जुड़ी नहीं है, इसलिए लाइव कनेक्शन पढ़ा नहीं जा सकता।"
  id: "Layanan URnetwork tidak terpasang, jadi koneksi aktif tidak dapat dibaca."
  it: "Il servizio URnetwork non è collegato, quindi non è possibile leggere la connessione attiva."
  ja: "URnetwork のサービスが接続されていないため、稼働中の接続を読み取れません。"
  ko: "URnetwork 서비스가 연결되어 있지 않아 활성 연결을 읽을 수 없습니다."
  nl: "De URnetwork-dienst is niet gekoppeld, dus de actieve verbinding kan niet worden uitgelezen."
  pl: "Usługa URnetwork nie jest podłączona, więc nie można odczytać aktywnego połączenia."
  pt: "O serviço URnetwork não está associado, por isso não é possível ler a ligação ativa."
  pt-BR: "O serviço URnetwork não está vinculado, então não é possível ler a conexão ativa."
  pt-PT: "O serviço URnetwork não está associado, por isso não é possível ler a ligação ativa."
  ru: "Служба URnetwork не подключена, поэтому прочитать активное соединение нельзя."
  sv: "URnetwork-tjänsten är inte ansluten, så den aktiva anslutningen kan inte läsas."
  sw: "Huduma ya URnetwork haijaunganishwa, kwa hiyo muunganisho unaoendelea hauwezi kusomwa."
  th: "บริการ URnetwork ไม่ได้เชื่อมต่ออยู่ จึงอ่านการเชื่อมต่อที่ใช้งานอยู่ไม่ได้"
  uk: "Служба URnetwork не підключена, тому прочитати активне з’єднання неможливо."
  vi: "Dịch vụ URnetwork chưa được gắn, nên không thể đọc kết nối đang hoạt động."
  zh: "URnetwork 服务未连接，因此无法读取当前连接。"
  zh-HK: "URnetwork 服務未連接，因此無法讀取目前的連線。"
