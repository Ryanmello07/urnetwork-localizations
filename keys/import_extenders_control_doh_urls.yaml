description: "Extender import: shown before the user takes the settings of a share code that also sets bootstrap DNS-over-HTTPS servers. The argument is the list of server URLs, comma separated."
source: "This code also sets bootstrap DNS-over-HTTPS servers. They will see URnetwork's server lookups: %@"
platforms:
