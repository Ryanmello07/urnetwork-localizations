description: "Windows banner text after the user closed the administrator permission (UAC) prompt without approving."
source: "Windows asked for permission and the prompt was closed. Click again whenever you're ready."
platforms:
  - windows
localizations:
  ar: "طلب Windows الإذن وتم إغلاق النافذة. انقر مجددًا عندما تكون جاهزًا."
  cs: "Windows požádal o oprávnění a výzva byla zavřena. Až budete připraveni, klikněte znovu."
  de: "Windows hat nach einer Berechtigung gefragt und die Abfrage wurde geschlossen. Klicke erneut, sobald du bereit bist."
  el: "Τα Windows ζήτησαν άδεια και το παράθυρο έκλεισε. Κάντε κλικ ξανά όταν είστε έτοιμοι."
  en: "Windows asked for permission and the prompt was closed. Click again whenever you're ready."
  es: "Windows pidió permiso y se cerró la solicitud. Haz clic de nuevo cuando estés listo."
  es-419: "Windows pidió permiso y se cerró la solicitud. Haz clic de nuevo cuando estés listo."
  es-MX: "Windows pidió permiso y se cerró la solicitud. Haz clic de nuevo cuando estés listo."
  fr: "Windows a demandé une autorisation et la fenêtre a été fermée. Cliquez à nouveau quand vous êtes prêt."
  he: "Windows ביקש הרשאה וחלון הבקשה נסגר. לחצו שוב כשתהיו מוכנים."
  hi: "Windows ने अनुमति माँगी थी और संकेत बंद कर दिया गया। जब तैयार हों, फिर से क्लिक करें।"
  id: "Windows meminta izin dan permintaan itu ditutup. Klik lagi kapan pun Anda siap."
  it: "Windows ha chiesto l’autorizzazione e la richiesta è stata chiusa. Fai di nuovo clic quando sei pronto."
  ja: "Windows が許可を求めましたが、確認画面が閉じられました。準備ができたらもう一度クリックしてください。"
  ko: "Windows에서 권한을 요청했지만 창이 닫혔습니다. 준비되면 다시 클릭하세요."
  nl: "Windows vroeg om toestemming en de melding is gesloten. Klik opnieuw wanneer je er klaar voor bent."
  pl: "Windows poprosił o zgodę, a okno zostało zamknięte. Kliknij ponownie, gdy będziesz gotowy."
  pt: "O Windows pediu permissão e o aviso foi fechado. Clique de novo quando estiver pronto."
  pt-BR: "O Windows pediu permissão e o aviso foi fechado. Clique de novo quando estiver pronto."
  pt-PT: "O Windows pediu permissão e o pedido foi fechado. Clique novamente quando estiver pronto."
  ru: "Windows запросила разрешение, и окно запроса было закрыто. Нажмите ещё раз, когда будете готовы."
  sv: "Windows bad om behörighet och frågan stängdes. Klicka igen när du är redo."
  sw: "Windows iliomba ruhusa na kidirisha kilifungwa. Bofya tena ukiwa tayari."
  th: "Windows ขอสิทธิ์และหน้าต่างขอสิทธิ์ถูกปิดไป คลิกอีกครั้งเมื่อคุณพร้อม"
  uk: "Windows попросила дозвіл, і вікно запиту було закрито. Натисніть ще раз, коли будете готові."
  vi: "Windows đã yêu cầu quyền và hộp thoại đã bị đóng. Hãy nhấp lại khi bạn sẵn sàng."
  zh: "Windows 请求了权限，但提示已被关闭。准备好后请再次点击。"
  zh-HK: "Windows 要求了權限，但提示已被關閉。準備好後請再按一下。"
