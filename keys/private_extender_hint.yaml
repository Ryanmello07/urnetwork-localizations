description: "Help text under the private extender fields."
source: "A private extender replaces every discovered extender. Leave it empty to use discovery."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "يحلّ الموسّع الخاص محل كل الموسّعات المكتشفة. اتركه فارغًا لاستخدام الاكتشاف التلقائي."
  cs: "Soukromý extender nahradí všechny nalezené extendery. Ponechte prázdné, chcete-li používat vyhledávání."
  de: "Ein privater Extender ersetzt alle gefundenen Extender. Lass das Feld leer, um die automatische Suche zu verwenden."
  el: "Ένας ιδιωτικός επεκτατής αντικαθιστά όλους τους επεκτατές που εντοπίστηκαν. Αφήστε το κενό για να χρησιμοποιηθεί ο εντοπισμός."
  en: "A private extender replaces every discovered extender. Leave it empty to use discovery."
  es: "Un extensor privado sustituye a todos los extensores descubiertos. Déjalo vacío para usar la detección."
  es-419: "Un extensor privado reemplaza a todos los extensores descubiertos. Déjalo vacío para usar la detección."
  es-MX: "Un extensor privado reemplaza a todos los extensores descubiertos. Déjalo vacío para usar la detección."
  fr: "Un extendeur privé remplace tous les extendeurs découverts. Laissez vide pour utiliser la découverte."
  he: "מרחיב פרטי מחליף את כל המרחיבים שהתגלו. השאירו ריק כדי להשתמש בגילוי."
  hi: "निजी एक्सटेंडर खोजे गए सभी एक्सटेंडर की जगह लेता है। खोज इस्तेमाल करने के लिए इसे खाली छोड़ें।"
  id: "Extender pribadi menggantikan semua extender yang ditemukan. Biarkan kosong untuk memakai penemuan."
  it: "Un extender privato sostituisce tutti gli extender rilevati. Lascialo vuoto per usare il rilevamento."
  ja: "プライベートエクステンダーは、検出されたすべてのエクステンダーの代わりに使われます。検出を使う場合は空欄のままにしてください。"
  ko: "비공개 익스텐더는 발견된 모든 익스텐더를 대신합니다. 자동 발견을 사용하려면 비워 두세요."
  nl: "Een privé-extender vervangt alle gevonden extenders. Laat leeg om automatisch te zoeken."
  pl: "Prywatny extender zastępuje wszystkie wykryte extendery. Zostaw puste, aby korzystać z wykrywania."
  pt: "Um extensor privado substitui todos os extensores descobertos. Deixe em branco para usar a descoberta."
  pt-BR: "Um extensor privado substitui todos os extensores descobertos. Deixe em branco para usar a descoberta."
  pt-PT: "Um extensor privado substitui todos os extensores descobertos. Deixe em branco para usar a descoberta."
  ru: "Частный экстендер заменяет все найденные экстендеры. Оставьте поле пустым, чтобы использовать автоматический поиск."
  sv: "En privat extender ersätter alla upptäckta extendrar. Lämna tomt för att använda upptäckt."
  sw: "Kipanuzi cha faragha huchukua nafasi ya kila kipanuzi kilichogunduliwa. Kiache wazi ili kutumia ugunduzi."
  th: "ตัวขยายส่วนตัวจะแทนที่ตัวขยายที่ค้นพบทั้งหมด เว้นว่างไว้เพื่อใช้การค้นหาอัตโนมัติ"
  uk: "Приватний екстендер замінює всі знайдені екстендери. Залиште порожнім, щоб використовувати пошук."
  vi: "Bộ mở rộng riêng sẽ thay thế mọi bộ mở rộng đã phát hiện. Để trống để dùng tính năng tự phát hiện."
  zh: "私有扩展器会替换所有已发现的扩展器。留空则使用自动发现。"
  zh-HK: "私人擴展器會取代所有已發現的擴展器。留空則使用自動發現。"
