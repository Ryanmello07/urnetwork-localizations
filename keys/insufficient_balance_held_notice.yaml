description: "Alert body shown in the app and in a local notification when the account enters the insufficient balance state. Connect stays requested and the VPN keeps holding traffic (nothing leaves outside the tunnel); the user can upgrade or disconnect."
source: "Your traffic is held in the tunnel until you upgrade or disconnect."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "تبقى حركة بياناتك محتجزة داخل النفق حتى تقوم بالترقية أو قطع الاتصال."
  cs: "Váš provoz zůstává zadržen v tunelu, dokud nepřejdete na vyšší tarif nebo se neodpojíte."
  de: "Dein Datenverkehr wird im Tunnel gehalten, bis du upgradest oder die Verbindung trennst."
  el: "Η κίνησή σας παραμένει στη σήραγγα μέχρι να αναβαθμίσετε ή να αποσυνδεθείτε."
  en: "Your traffic is held in the tunnel until you upgrade or disconnect."
  es: "Tu tráfico se mantiene en el túnel hasta que mejores tu plan o te desconectes."
  es-419: "Tu tráfico se mantiene en el túnel hasta que mejores tu plan o te desconectes."
  es-MX: "Tu tráfico se mantiene en el túnel hasta que mejores tu plan o te desconectes."
  fr: "Votre trafic est retenu dans le tunnel jusqu’à ce que vous passiez à une offre supérieure ou que vous vous déconnectiez."
  he: "התעבורה שלך מוחזקת במנהרה עד שתשדרג או תתנתק."
  hi: "जब तक आप अपग्रेड या डिस्कनेक्ट नहीं करते, आपका ट्रैफ़िक टनल में रोका रहता है।"
  id: "Lalu lintas Anda ditahan di terowongan sampai Anda meningkatkan paket atau memutuskan koneksi."
  it: "Il tuo traffico resta trattenuto nel tunnel finché non effettui l’upgrade o ti disconnetti."
  ja: "アップグレードするか切断するまで、通信はトンネル内に保持されます。"
  ko: "업그레이드하거나 연결을 해제할 때까지 트래픽이 터널 안에 보류됩니다."
  nl: "Je verkeer wordt in de tunnel vastgehouden totdat je upgradet of de verbinding verbreekt."
  pl: "Twój ruch jest zatrzymany w tunelu, dopóki nie przejdziesz na wyższy plan lub się nie rozłączysz."
  pt: "Seu tráfego fica retido no túnel até você fazer upgrade ou desconectar."
  pt-BR: "Seu tráfego fica retido no túnel até você fazer upgrade ou desconectar."
  pt-PT: "O seu tráfego fica retido no túnel até fazer upgrade ou desligar."
  ru: "Ваш трафик удерживается в туннеле, пока вы не повысите тариф или не отключитесь."
  sv: "Din trafik hålls kvar i tunneln tills du uppgraderar eller kopplar från."
  sw: "Trafiki yako imeshikiliwa ndani ya handaki hadi upandishe kiwango au utenganishe."
  th: "ทราฟฟิกของคุณถูกกักไว้ในอุโมงค์จนกว่าคุณจะอัปเกรดหรือตัดการเชื่อมต่อ"
  uk: "Ваш трафік утримується в тунелі, доки ви не підвищите тариф або не відключитеся."
  vi: "Lưu lượng của bạn được giữ trong đường hầm cho đến khi bạn nâng cấp hoặc ngắt kết nối."
  zh: "在你升级或断开连接之前，你的流量会保留在隧道中。"
  zh-HK: "在你升級或斷開連接之前，你的流量會保留在隧道中。"
