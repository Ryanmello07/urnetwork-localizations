description: "Points leaderboard: shown under the own-stats card while the name switch is off. The network is listed either way, as Anonymous until the switch is on."
source: "Your network appears as Anonymous until you turn this on."
platforms:
  - android
  - apple
  - site
  - windows
  - linux
localizations:
  ar: "تظهر شبكتك باسم «مجهول» حتى تفعّل هذا الخيار."
  cs: "Vaše síť se zobrazuje jako Anonymní, dokud to nezapnete."
  de: "Dein Netzwerk erscheint als Anonym, bis du das einschaltest."
  el: "Το δίκτυό σας εμφανίζεται ως Ανώνυμο μέχρι να το ενεργοποιήσετε."
  en: "Your network appears as Anonymous until you turn this on."
  es: "Tu red aparece como Anónimo hasta que actives esta opción."
  es-MX: "Tu red aparece como Anónimo hasta que actives esta opción."
  fr: "Votre réseau apparaît comme Anonyme tant que cette option est désactivée."
  he: "הרשת שלך מופיעה כאנונימי עד שתפעיל זאת."
  hi: "जब तक आप इसे चालू नहीं करते, आपका नेटवर्क अनाम के रूप में दिखता है।"
  id: "Jaringan Anda tampil sebagai Anonim sampai Anda mengaktifkan ini."
  it: "La tua rete compare come Anonimo finché non attivi questa opzione."
  ja: "オンにするまで、あなたのネットワークは匿名として表示されます。"
  ko: "이 옵션을 켜기 전까지 내 네트워크는 익명으로 표시됩니다."
  nl: "Je netwerk wordt als Anoniem getoond totdat je dit aanzet."
  pl: "Twoja sieć jest wyświetlana jako Anonimowy, dopóki tego nie włączysz."
  pt: "A sua rede aparece como Anónimo até ativar esta opção."
  pt-BR: "Sua rede aparece como Anônimo até você ativar esta opção."
  pt-PT: "A sua rede aparece como Anónimo até ativar esta opção."
  ru: "Ваша сеть отображается как «Анонимно», пока вы не включите этот параметр."
  sv: "Ditt nätverk visas som Anonym tills du slår på detta."
  sw: "Mtandao wako unaonekana kama Bila jina hadi uwashe hii."
  th: "เครือข่ายของคุณจะแสดงเป็นไม่ระบุชื่อจนกว่าคุณจะเปิดตัวเลือกนี้"
  uk: "Ваша мережа відображається як Анонімно, доки ви не ввімкнете це."
  vi: "Mạng của bạn hiển thị là Ẩn danh cho đến khi bạn bật tùy chọn này."
  zh: "在你开启此项之前，你的网络显示为匿名。"
  zh-HK: "在你開啟此項之前，你的網絡顯示為匿名。"
