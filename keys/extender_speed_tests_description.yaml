description: "Secondary text under the lag.dev speed tests switch: what turning it on allows, and its cost. lag.dev is a website name and stays as written."
source: "Let people testing their connection on lag.dev measure latency, download and upload to this device. Tests use some of your bandwidth while they run."
platforms:
  - apple
localizations:
  ar: "اسمح للأشخاص الذين يختبرون اتصالهم على lag.dev بقياس زمن الاستجابة والتنزيل والرفع إلى هذا الجهاز. تستخدم الاختبارات جزءًا من عرض النطاق الترددي لديك أثناء تشغيلها."
  cs: "Umožněte lidem, kteří na lag.dev testují své připojení, měřit latenci, stahování a nahrávání k tomuto zařízení. Testy během běhu využívají část vaší šířky pásma."
  de: "Lass Menschen, die auf lag.dev ihre Verbindung testen, Latenz, Download und Upload zu diesem Gerät messen. Während die Tests laufen, nutzen sie einen Teil deiner Bandbreite."
  el: "Επιτρέψτε σε όσους ελέγχουν τη σύνδεσή τους στο lag.dev να μετρούν την καθυστέρηση, τη λήψη και την αποστολή προς αυτή τη συσκευή. Οι δοκιμές χρησιμοποιούν μέρος του εύρους ζώνης σας όσο εκτελούνται."
  en: "Let people testing their connection on lag.dev measure latency, download and upload to this device. Tests use some of your bandwidth while they run."
  es: "Permite que quienes prueban su conexión en lag.dev midan la latencia, la descarga y la subida hacia este dispositivo. Las pruebas usan parte de tu ancho de banda mientras se ejecutan."
  es-419: "Permite que quienes prueban su conexión en lag.dev midan la latencia, la descarga y la carga hacia este dispositivo. Las pruebas usan parte de tu ancho de banda mientras se ejecutan."
  es-MX: "Permite que quienes prueban su conexión en lag.dev midan la latencia, la descarga y la subida hacia este dispositivo. Las pruebas usan parte de tu ancho de banda mientras se ejecutan."
  fr: "Autorisez les personnes qui testent leur connexion sur lag.dev à mesurer la latence, le téléchargement et l'envoi vers cet appareil. Les tests utilisent une partie de votre bande passante pendant leur exécution."
  he: "אפשרו לאנשים שבודקים את החיבור שלהם ב-lag.dev למדוד השהיה, הורדה והעלאה למכשיר הזה. הבדיקות משתמשות בחלק מרוחב הפס שלכם בזמן שהן פועלות."
  hi: "lag.dev पर अपने कनेक्शन की जाँच करने वाले लोगों को इस डिवाइस तक लेटेंसी, डाउनलोड और अपलोड मापने दें। चलते समय टेस्ट आपकी बैंडविड्थ का कुछ हिस्सा इस्तेमाल करते हैं।"
  id: "Izinkan orang yang menguji koneksi mereka di lag.dev mengukur latensi, unduhan, dan unggahan ke perangkat ini. Selama berjalan, tes menggunakan sebagian bandwidth Anda."
  it: "Consenti a chi prova la propria connessione su lag.dev di misurare latenza, download e upload verso questo dispositivo. Durante l'esecuzione, i test usano parte della tua larghezza di banda."
  ja: "lag.dev で接続をテストしている人が、このデバイスまでのレイテンシ、ダウンロード、アップロードを測定できるようにします。テストの実行中は帯域幅の一部を使用します。"
  ko: "lag.dev에서 연결을 테스트하는 사람들이 이 기기까지의 지연 시간, 다운로드, 업로드를 측정할 수 있도록 합니다. 테스트가 실행되는 동안 대역폭의 일부를 사용합니다."
  nl: "Laat mensen die op lag.dev hun verbinding testen de latentie, download en upload naar dit apparaat meten. Tijdens het testen wordt een deel van je bandbreedte gebruikt."
  pl: "Pozwól osobom testującym swoje połączenie na lag.dev mierzyć opóźnienie, pobieranie i wysyłanie do tego urządzenia. Podczas działania testy wykorzystują część Twojej przepustowości."
  pt: "Permita que quem testa a própria conexão no lag.dev meça a latência, o download e o upload até este dispositivo. Enquanto rodam, os testes usam parte da sua largura de banda."
  pt-BR: "Permita que quem testa a própria conexão no lag.dev meça a latência, o download e o upload até este dispositivo. Enquanto rodam, os testes usam parte da sua largura de banda."
  pt-PT: "Permita que quem testa a ligação no lag.dev meça a latência, a transferência e o envio até este dispositivo. Enquanto decorrem, os testes usam parte da sua largura de banda."
  ru: "Разрешите людям, проверяющим своё соединение на lag.dev, измерять задержку, скорость загрузки и выгрузки до этого устройства. Во время работы тесты используют часть вашей пропускной способности."
  sv: "Låt personer som testar sin anslutning på lag.dev mäta latens, nedladdning och uppladdning till den här enheten. Testerna använder en del av din bandbredd medan de pågår."
  sw: "Ruhusu watu wanaojaribu muunganisho wao kwenye lag.dev kupima muda wa kusubiri, upakuaji na upakiaji hadi kifaa hiki. Majaribio hutumia sehemu ya kipimo data chako yanapoendelea."
  th: "อนุญาตให้ผู้ที่ทดสอบการเชื่อมต่อบน lag.dev วัดความหน่วง การดาวน์โหลด และการอัปโหลดมายังอุปกรณ์นี้ การทดสอบจะใช้แบนด์วิดท์ส่วนหนึ่งของคุณขณะทำงาน"
  uk: "Дозвольте людям, які перевіряють своє з'єднання на lag.dev, вимірювати затримку, швидкість завантаження й вивантаження до цього пристрою. Під час роботи тести використовують частину вашої пропускної здатності."
  vi: "Cho phép những người đang kiểm tra kết nối trên lag.dev đo độ trễ, tốc độ tải xuống và tải lên tới thiết bị này. Trong khi chạy, các bài kiểm tra sẽ dùng một phần băng thông của bạn."
  zh: "允许在 lag.dev 上测试连接的人测量到此设备的延迟、下载和上传。测试运行时会占用你的部分带宽。"
  zh-HK: "允許在 lag.dev 上測試連線的人測量到此裝置的延遲、下載和上傳。測試運行時會佔用你的部分頻寬。"
