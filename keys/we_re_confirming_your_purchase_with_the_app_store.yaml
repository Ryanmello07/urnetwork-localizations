description: "Body of the post-purchase screen while the confirmation poll runs (Shared/Views/PurchaseSuccessView.swift). Processing-shaped, not premium-shaped: the server learns of the purchase by webhook and has not confirmed yet."
source: "We're confirming your purchase with the App Store. Your plan will update automatically."
platforms:
  - apple
localizations:
  ar: "نحن نؤكد عملية الشراء مع App Store. سيتم تحديث خطتك تلقائيًا."
  cs: "Potvrzujeme váš nákup u App Storu. Váš tarif se aktualizuje automaticky."
  de: "Wir bestätigen deinen Kauf beim App Store. Dein Plan wird automatisch aktualisiert."
  el: "Επιβεβαιώνουμε την αγορά σας με το App Store. Το πρόγραμμά σας θα ενημερωθεί αυτόματα."
  en: "We're confirming your purchase with the App Store. Your plan will update automatically."
  es: "Estamos confirmando tu compra con el App Store. Tu plan se actualizará automáticamente."
  es-419: "Estamos confirmando tu compra con el App Store. Tu plan se actualizará automáticamente."
  es-MX: "Estamos confirmando tu compra con el App Store. Tu plan se actualizará automáticamente."
  fr: "Nous confirmons votre achat auprès de l’App Store. Votre forfait se mettra à jour automatiquement."
  he: "אנחנו מאשרים את הרכישה שלכם מול ה-App Store. התוכנית שלכם תתעדכן אוטומטית."
  hi: "हम App Store से आपकी खरीदारी की पुष्टि कर रहे हैं। आपका प्लान अपने-आप अपडेट हो जाएगा।"
  id: "Kami sedang mengonfirmasi pembelian Anda dengan App Store. Paket Anda akan diperbarui otomatis."
  it: "Stiamo confermando il tuo acquisto con l’App Store. Il tuo piano si aggiornerà automaticamente."
  ja: "App Store で購入を確認しています。プランは自動的に更新されます。"
  ko: "App Store에서 구매를 확인하고 있습니다. 요금제가 자동으로 업데이트됩니다."
  nl: "We bevestigen je aankoop bij de App Store. Je abonnement wordt automatisch bijgewerkt."
  pl: "Potwierdzamy twój zakup w App Store. Twój plan zaktualizuje się automatycznie."
  pt: "Estamos a confirmar a sua compra com a App Store. O seu plano é atualizado automaticamente."
  pt-BR: "Estamos confirmando sua compra com a App Store. Seu plano será atualizado automaticamente."
  pt-PT: "Estamos a confirmar a sua compra com a App Store. O seu plano é atualizado automaticamente."
  ru: "Мы подтверждаем вашу покупку в App Store. Ваш тариф обновится автоматически."
  sv: "Vi bekräftar ditt köp med App Store. Ditt abonnemang uppdateras automatiskt."
  sw: "Tunathibitisha ununuzi wako na App Store. Mpango wako utasasishwa kiotomatiki."
  th: "เรากำลังยืนยันการซื้อของคุณกับ App Store แพ็กเกจของคุณจะอัปเดตโดยอัตโนมัติ"
  uk: "Ми підтверджуємо вашу покупку в App Store. Ваш план оновиться автоматично."
  vi: "Chúng tôi đang xác nhận giao dịch mua của bạn với App Store. Gói của bạn sẽ tự động cập nhật."
  zh: "我们正在通过 App Store 确认您的购买。您的方案将自动更新。"
  zh-HK: "我們正在透過 App Store 確認你的購買。你的計劃會自動更新。"
