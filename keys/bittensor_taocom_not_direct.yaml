description: "Note under ur.io's Bittensor wallet chooser: the TAO.com browser extension signs only when a website asks it to, and this page does not ask it yet, so its users choose another wallet or sign with btcli."
source: "The TAO.com extension can't sign on this page yet. Choose another wallet here, or sign manually with btcli."
platforms:
  - site
localizations:
  ar: "لا يمكن لإضافة TAO.com التوقيع في هذه الصفحة بعد. اختر محفظة أخرى هنا، أو وقّع يدويًا باستخدام btcli."
  de: "Die TAO.com-Erweiterung kann auf dieser Seite noch nicht signieren. Wähle hier eine andere Wallet oder signiere manuell mit btcli."
  en: "The TAO.com extension can't sign on this page yet. Choose another wallet here, or sign manually with btcli."
  es: "La extensión de TAO.com todavía no puede firmar en esta página. Elige aquí otra billetera o firma manualmente con btcli."
  ru: "Расширение TAO.com пока не может подписывать на этой странице. Выберите здесь другой кошелек или подпишите вручную с помощью btcli."
  zh: "TAO.com 扩展目前还无法在此页面上签名。请在此选择其他钱包，或使用 btcli 手动签名。"
