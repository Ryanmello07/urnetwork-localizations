description: "Explains that, with the kill switch off, traffic URnetwork safety rules keep off the network (such as unrecognized encrypted protocols) bypasses the VPN."
source: "When the kill switch is off, traffic that URnetwork safety rules keep off the network, such as unrecognized encrypted protocols, bypasses the VPN and uses your local public IP. With the kill switch on, that traffic is blocked."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "عند إيقاف مفتاح القتل، تتجاوز حركة المرور التي تُبقيها قواعد أمان URnetwork خارج الشبكة، مثل البروتوكولات المشفرة غير المعروفة، شبكة VPN وتستخدم عنوان IP العام المحلي لديك. عند تشغيل مفتاح القتل، تُحظر حركة المرور هذه."
  cs: "Když je kill switch vypnutý, provoz, který bezpečnostní pravidla URnetwork drží mimo síť, například nerozpoznané šifrované protokoly, obchází VPN a používá vaši místní veřejnou IP. Se zapnutým kill switchem je tento provoz blokován."
  de: "Wenn der Kill switch deaktiviert ist, umgeht Datenverkehr, den die Sicherheitsregeln von URnetwork aus dem Netzwerk heraushalten, etwa nicht erkannte verschlüsselte Protokolle, das VPN und nutzt deine lokale öffentliche IP. Bei aktiviertem Kill switch wird dieser Datenverkehr blockiert."
  el: "Όταν το Kill switch είναι ανενεργό, η κίνηση που οι κανόνες ασφαλείας του URnetwork κρατούν εκτός δικτύου, όπως μη αναγνωρισμένα κρυπτογραφημένα πρωτόκολλα, παρακάμπτει το VPN και χρησιμοποιεί την τοπική δημόσια IP σας. Με το Kill switch ενεργό, αυτή η κίνηση αποκλείεται."
  en: "When the kill switch is off, traffic that URnetwork safety rules keep off the network, such as unrecognized encrypted protocols, bypasses the VPN and uses your local public IP. With the kill switch on, that traffic is blocked."
  es: "Con el Kill switch desactivado, el tráfico que las reglas de seguridad de URnetwork mantienen fuera de la red, como protocolos cifrados no reconocidos, evita la VPN y usa tu IP pública local. Con el Kill switch activado, ese tráfico se bloquea."
  es-419: "Con el Kill switch desactivado, el tráfico que las reglas de seguridad de URnetwork mantienen fuera de la red, como protocolos cifrados no reconocidos, evita la VPN y usa tu IP pública local. Con el Kill switch activado, ese tráfico se bloquea."
  es-MX: "Con el Kill switch desactivado, el tráfico que las reglas de seguridad de URnetwork mantienen fuera de la red, como protocolos cifrados no reconocidos, evita la VPN y usa tu IP pública local. Con el Kill switch activado, ese tráfico se bloquea."
  fr: "Quand le Kill switch est désactivé, le trafic que les règles de sécurité d’URnetwork tiennent hors du réseau, comme les protocoles chiffrés non reconnus, contourne le VPN et utilise votre IP publique locale. Avec le Kill switch activé, ce trafic est bloqué."
  he: "כשהקיל סוויץ' כבוי, תעבורה שכללי הבטיחות של URnetwork מרחיקים מהרשת, כמו פרוטוקולים מוצפנים לא מזוהים, עוקפת את ה-VPN ומשתמשת בכתובת ה-IP הציבורית המקומית שלכם. כשהקיל סוויץ' מופעל, התעבורה הזו נחסמת."
  hi: "किल स्विच बंद होने पर, वह ट्रैफ़िक जिसे URnetwork के सुरक्षा नियम नेटवर्क से बाहर रखते हैं, जैसे अपरिचित एन्क्रिप्टेड प्रोटोकॉल, VPN को बायपास करता है और आपके स्थानीय सार्वजनिक IP का इस्तेमाल करता है। किल स्विच चालू होने पर वह ट्रैफ़िक ब्लॉक हो जाता है।"
  id: "Saat Kill switch nonaktif, lalu lintas yang dijauhkan dari jaringan oleh aturan keamanan URnetwork, seperti protokol terenkripsi yang tidak dikenali, melewati VPN dan memakai IP publik lokal Anda. Dengan Kill switch aktif, lalu lintas itu diblokir."
  it: "Con il Kill switch disattivato, il traffico che le regole di sicurezza di URnetwork tengono fuori dalla rete, come i protocolli cifrati non riconosciuti, aggira la VPN e usa il tuo IP pubblico locale. Con il Kill switch attivo, quel traffico viene bloccato."
  ja: "キルスイッチがオフのとき、URnetwork の安全ルールによってネットワークから除外されるトラフィック（認識できない暗号化プロトコルなど）は VPN を経由せず、あなたのローカルのパブリック IP を使います。キルスイッチがオンのときは、そのトラフィックはブロックされます。"
  ko: "킬 스위치가 꺼져 있으면, 인식할 수 없는 암호화 프로토콜처럼 URnetwork 안전 규칙이 네트워크에서 차단하는 트래픽은 VPN을 우회해 로컬 공인 IP를 사용합니다. 킬 스위치가 켜져 있으면 그 트래픽은 차단됩니다."
  nl: "Als de Kill switch uit staat, gaat verkeer dat de veiligheidsregels van URnetwork van het netwerk weren, zoals niet-herkende versleutelde protocollen, buiten de VPN om en gebruikt het je lokale openbare IP. Met de Kill switch aan wordt dat verkeer geblokkeerd."
  pl: "Gdy Kill switch jest wyłączony, ruch, który reguły bezpieczeństwa URnetwork trzymają poza siecią, na przykład nierozpoznane szyfrowane protokoły, omija VPN i używa twojego lokalnego publicznego adresu IP. Przy włączonym Kill switchu ten ruch jest blokowany."
  pt: "Com o Kill switch desativado, o tráfego que as regras de segurança da URnetwork mantêm fora da rede, como protocolos encriptados não reconhecidos, contorna a VPN e usa o seu IP público local. Com o Kill switch ativado, esse tráfego é bloqueado."
  pt-BR: "Com o Kill switch desativado, o tráfego que as regras de segurança da URnetwork mantêm fora da rede, como protocolos criptografados não reconhecidos, contorna a VPN e usa seu IP público local. Com o Kill switch ativado, esse tráfego é bloqueado."
  pt-PT: "Com o Kill switch desativado, o tráfego que as regras de segurança da URnetwork mantêm fora da rede, como protocolos encriptados não reconhecidos, contorna a VPN e usa o seu IP público local. Com o Kill switch ativado, esse tráfego é bloqueado."
  ru: "Когда Kill switch выключен, трафик, который правила безопасности URnetwork не пропускают в сеть, например нераспознанные зашифрованные протоколы, идёт в обход VPN и использует ваш локальный публичный IP. Когда Kill switch включён, такой трафик блокируется."
  sv: "När Kill switch är av går trafik som URnetworks säkerhetsregler håller borta från nätverket, som okända krypterade protokoll, förbi VPN:en och använder din lokala offentliga IP. Med Kill switch på blockeras den trafiken."
  sw: "Kill switch ikiwa imezimwa, trafiki ambayo sheria za usalama za URnetwork huizuia nje ya mtandao, kama itifaki zilizosimbwa ambazo hazitambuliki, hupita nje ya VPN na hutumia IP yako ya umma ya ndani. Kill switch ikiwa imewashwa, trafiki hiyo huzuiwa."
  th: "เมื่อปิดสวิตช์หยุดการเชื่อมต่อ ทราฟฟิกที่กฎความปลอดภัยของ URnetwork กันไว้นอกเครือข่าย เช่น โปรโตคอลเข้ารหัสที่ไม่รู้จัก จะข้าม VPN และใช้ IP สาธารณะในพื้นที่ของคุณ เมื่อเปิดสวิตช์หยุดการเชื่อมต่อ ทราฟฟิกนั้นจะถูกบล็อก"
  uk: "Коли Kill switch вимкнено, трафік, який правила безпеки URnetwork тримають поза мережею, як-от нерозпізнані зашифровані протоколи, оминає VPN і використовує вашу локальну публічну IP. Коли Kill switch увімкнено, цей трафік блокується."
  vi: "Khi Kill switch tắt, lưu lượng bị các quy tắc an toàn của URnetwork giữ ngoài mạng, chẳng hạn các giao thức mã hóa không nhận diện được, sẽ đi vòng qua VPN và dùng IP công khai cục bộ của bạn. Khi Kill switch bật, lưu lượng đó bị chặn."
  zh: "关闭断网保护时，被 URnetwork 安全规则挡在网络之外的流量（例如无法识别的加密协议）会绕过 VPN 并使用您本地的公网 IP。开启断网保护时，这些流量会被阻止。"
  zh-HK: "關閉斷線開關 (Kill switch) 時，被 URnetwork 安全規則擋在網絡之外的流量（例如無法識別的加密協定）會繞過 VPN 並使用你本地的公共 IP。開啟斷線開關時，這些流量會被封鎖。"
