description: "Detail line of the last onboarding page."
source: "Turn URnetwork on and off from Quick Settings, and keep an eye on it from your home screen."
platforms:
  - android
  - apple
localizations:
  ar: "شغّل URnetwork وأوقفه من الإعدادات السريعة، وتابعه من شاشتك الرئيسية."
  cs: "Zapínejte a vypínejte URnetwork z Rychlého nastavení a sledujte ho z domovské obrazovky."
  de: "Schalte URnetwork in den Schnelleinstellungen ein und aus und behalte es auf deinem Startbildschirm im Blick."
  el: "Ενεργοποιήστε και απενεργοποιήστε το URnetwork από τις Γρήγορες ρυθμίσεις και παρακολουθήστε το από την αρχική οθόνη σας."
  en: "Turn URnetwork on and off from Quick Settings, and keep an eye on it from your home screen."
  es: "Activa y desactiva URnetwork desde Ajustes rápidos y vigílalo desde tu pantalla de inicio."
  es-419: "Activa y desactiva URnetwork desde la Configuración rápida y vigílalo desde tu pantalla de inicio."
  es-MX: "Activa y desactiva URnetwork desde la Configuración rápida y vigílalo desde tu pantalla de inicio."
  fr: "Activez et désactivez URnetwork depuis les Réglages rapides, et gardez un œil dessus depuis votre écran d’accueil."
  he: "הפעילו וכבו את URnetwork מההגדרות המהירות, ועקבו אחריו ממסך הבית."
  hi: "क्विक सेटिंग से URnetwork चालू और बंद करें, और होम स्क्रीन से उस पर नज़र रखें।"
  id: "Nyalakan dan matikan URnetwork dari Setelan Cepat, dan pantau dari layar utama Anda."
  it: "Attiva e disattiva URnetwork dalle Impostazioni rapide e tienilo d’occhio dalla schermata Home."
  ja: "クイック設定から URnetwork のオンとオフを切り替え、ホーム画面から状態を確認できます。"
  ko: "빠른 설정에서 URnetwork를 켜고 끄고, 홈 화면에서 상태를 확인하세요."
  nl: "Zet URnetwork aan en uit vanuit Snelle instellingen en houd het in de gaten vanaf je startscherm."
  pl: "Włączaj i wyłączaj URnetwork z Szybkich ustawień i miej go na oku z ekranu głównego."
  pt: "Ligue e desligue a URnetwork nas Definições rápidas e acompanhe-a a partir do ecrã principal."
  pt-BR: "Ative e desative a URnetwork pelas Configurações rápidas e acompanhe tudo pela tela inicial."
  pt-PT: "Ligue e desligue a URnetwork nas Definições rápidas e acompanhe-a a partir do ecrã principal."
  ru: "Включайте и выключайте URnetwork в быстрых настройках и следите за ним с главного экрана."
  sv: "Slå på och av URnetwork från snabbinställningarna och håll koll på det från hemskärmen."
  sw: "Washa na uzime URnetwork kutoka kwenye Mipangilio ya Haraka, na uifuatilie kutoka kwenye skrini ya kwanza."
  th: "เปิดและปิด URnetwork จากการตั้งค่าด่วน และดูสถานะได้จากหน้าจอหลัก"
  uk: "Вмикайте й вимикайте URnetwork зі Швидких налаштувань і стежте за ним з головного екрана."
  vi: "Bật và tắt URnetwork từ Cài đặt nhanh, và theo dõi nó từ màn hình chính."
  zh: "在快捷设置中开关 URnetwork，并在主屏幕上随时查看其状态。"
  zh-HK: "在快速設定中開關 URnetwork，並在主畫面上隨時查看其狀態。"
