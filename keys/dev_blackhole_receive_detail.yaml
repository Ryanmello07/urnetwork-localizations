description: "Developer tools screen: explanatory subtext under the 'blackhole receive' control."
source: "How long a provider still acknowledging traffic may return nothing before it is dropped. Off keeps them until they stop acknowledging"
platforms:
  - android
localizations:
  ar: "المدة التي يمكن فيها لمزود لا يزال يؤكد حركة البيانات ألّا يُرجع شيئًا قبل إسقاطه. عند الإيقاف، يُحتفظ به حتى يتوقف عن التأكيد"
  cs: "Jak dlouho smí poskytovatel, který ještě potvrzuje provoz, nic nevracet, než bude vyřazen. Vypnuto je drží, dokud nepřestanou potvrzovat"
  de: "Wie lange ein Anbieter, der Datenverkehr noch bestätigt, nichts zurückliefern darf, bevor er verworfen wird. Aus: behält ihn, bis er keine Bestätigungen mehr sendet"
  el: "Πόσο καιρό μπορεί ένας πάροχος που ακόμη επιβεβαιώνει κίνηση να μην επιστρέφει τίποτα πριν απορριφθεί. Η απενεργοποίηση τους κρατά μέχρι να σταματήσουν να επιβεβαιώνουν"
  en: "How long a provider still acknowledging traffic may return nothing before it is dropped. Off keeps them until they stop acknowledging"
  es: "Cuánto tiempo puede un proveedor que aún confirma el tráfico no devolver nada antes de descartarlo. Si está desactivado, se mantiene hasta que deje de confirmar"
  es-419: "Cuánto tiempo puede un proveedor que todavía confirma el tráfico no devolver nada antes de descartarlo. Si está desactivado, se mantiene hasta que deje de confirmar"
  es-MX: "Cuánto tiempo puede un proveedor que todavía confirma el tráfico no devolver nada antes de descartarlo. Si está desactivado, se mantiene hasta que deje de confirmar"
  fr: "Combien de temps un fournisseur qui acquitte encore le trafic peut ne rien renvoyer avant d’être écarté. Désactivé les garde jusqu’à ce qu’ils cessent d’acquitter"
  he: "כמה זמן ספק שעדיין מאשר תעבורה יכול לא להחזיר דבר לפני שהוא מוסר. כיבוי שומר עליהם עד שיפסיקו לאשר"
  hi: "ट्रैफ़िक की पुष्टि करता प्रदाता कुछ भी लौटाए बिना कितनी देर रह सकता है, इससे पहले कि उसे हटाया जाए। बंद करने पर वे तब तक रहते हैं जब तक पुष्टि करना बंद न कर दें"
  id: "Berapa lama penyedia yang masih mengonfirmasi lalu lintas boleh tidak mengembalikan apa pun sebelum dibuang. Nonaktif mempertahankannya sampai berhenti mengonfirmasi"
  it: "Per quanto tempo un provider che conferma ancora il traffico può non restituire nulla prima di essere scartato. Disattivato li tiene finché non smettono di confermare"
  ja: "トラフィックへの確認応答を続けているプロバイダーが、何も返さないまま除外されるまでの時間。オフにすると、確認応答をやめるまで保持します"
  ko: "트래픽을 계속 확인 응답하는 제공자가 아무것도 돌려주지 않은 채 제외되기 전까지 허용되는 시간입니다. 끄면 확인 응답을 멈출 때까지 유지합니다"
  nl: "Hoe lang een provider die nog verkeer bevestigt niets mag terugsturen voordat hij wordt verwijderd. Uit houdt ze tot ze stoppen met bevestigen"
  pl: "Jak długo dostawca, który nadal potwierdza ruch, może niczego nie zwracać, zanim zostanie odrzucony. Wyłączenie trzyma ich, dopóki nie przestaną potwierdzać"
  pt: "Durante quanto tempo um fornecedor que ainda confirma o tráfego pode não devolver nada antes de ser descartado. Desativado mantém-nos até deixarem de confirmar"
  pt-BR: "Por quanto tempo um provedor que ainda confirma o tráfego pode não devolver nada antes de ser descartado. Desativado os mantém até pararem de confirmar"
  pt-PT: "Durante quanto tempo um fornecedor que ainda confirma o tráfego pode não devolver nada antes de ser descartado. Desativado mantém-nos até deixarem de confirmar"
  ru: "Как долго провайдер, который ещё подтверждает трафик, может ничего не возвращать, прежде чем его отключат. Если выключено, он сохраняется, пока не перестанет подтверждать"
  sv: "Hur länge en leverantör som fortfarande kvitterar trafik får låta bli att returnera något innan den tas bort. Av behåller dem tills de slutar kvittera"
  sw: "Muda ambao mtoa huduma ambaye bado anathibitisha trafiki anaweza kukaa bila kurudisha chochote kabla ya kuondolewa. Kuzima kunawaweka hadi watakapoacha kuthibitisha"
  th: "ผู้ให้บริการที่ยังยืนยันทราฟฟิกอยู่จะไม่ส่งอะไรกลับมาได้นานเท่าใดก่อนถูกตัดทิ้ง ปิดเพื่อเก็บไว้จนกว่าจะหยุดยืนยัน"
  uk: "Скільки часу провайдер, який ще підтверджує трафік, може нічого не повертати, перш ніж його буде відкинуто. Вимкнення тримає їх, доки вони не перестануть підтверджувати"
  vi: "Một nhà cung cấp vẫn còn xác nhận lưu lượng có thể không trả về gì trong bao lâu trước khi bị loại. Tắt sẽ giữ họ cho tới khi ngừng xác nhận"
  zh: "仍在确认流量的提供商在被丢弃前可以不返回任何数据的时长。关闭时会保留它们，直到它们停止确认"
  zh-HK: "仍在確認流量的供應商在被捨棄前可以不傳回任何數據的時長。關閉時會保留它們，直到它們停止確認"
