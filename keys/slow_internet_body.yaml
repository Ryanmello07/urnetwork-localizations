description: "Body text of the slow-internet details sheet (a flyout on Windows and Linux): the user's own network is adding delay to the traffic, so the slowness is not caused by URnetwork, and the VPN is still connected."
source: "Your network is delaying traffic. URnetwork is still connected."
platforms:
  - apple
  - android
  - windows
  - linux
# the details went with the pill's redesign, variant A+, in every app
# (apple/DELAY.md §5.2, §7.1, §8, §9)
deprecated:
  - apple
  - android
  - windows
  - linux
