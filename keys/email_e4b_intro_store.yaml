description: "Onboarding email E4b, for networks billed by the App Store or Google Play: the opening paragraph that introduces the welcome bonus WITHOUT a price (the store shows its own local price; App Store guideline 2.3.1(a)). Same text as email_e4b_intro minus its price sentence."
source: "You've had URnetwork for a week, so here is the welcome bonus we give new members: a year of Pro with 3 months free."
platforms:
  - email
localizations:
  en: "You've had URnetwork for a week, so here is the welcome bonus we give new members: a year of Pro with 3 months free."
  ar: "مضى أسبوع على استخدامك URnetwork، فإليك مكافأة الترحيب التي نقدمها للأعضاء الجدد: سنة من Pro مع 3 أشهر مجانية."
  cs: "URnetwork máte už týden, tak tady je uvítací bonus, který dáváme novým členům: rok Pro se 3 měsíci zdarma."
  de: "Du hast URnetwork jetzt seit einer Woche, deshalb hier der Willkommensbonus, den wir neuen Mitgliedern geben: ein Jahr Pro mit 3 Gratis-Monaten."
  el: "Έχεις το URnetwork μια εβδομάδα, οπότε να το μπόνους καλωσορίσματος που δίνουμε στα νέα μέλη: ένας χρόνος Pro με 3 μήνες δωρεάν."
  es: "Llevas una semana con URnetwork, así que aquí va el bono de bienvenida que damos a los nuevos miembros: un año de Pro con 3 meses gratis."
  es-419: "Llevas una semana con URnetwork, así que aquí va el bono de bienvenida que damos a los nuevos miembros: un año de Pro con 3 meses gratis."
  es-MX: "Llevas una semana con URnetwork, así que aquí va el bono de bienvenida que damos a los nuevos miembros: un año de Pro con 3 meses gratis."
  fr: "Ça fait une semaine que tu as URnetwork, alors voici le bonus de bienvenue qu'on offre aux nouveaux membres : un an de Pro avec 3 mois offerts."
  he: "עבר שבוע מאז שהצטרפתם ל-URnetwork, אז הנה בונוס הברוכים הבאים שאנחנו נותנים לחברים חדשים: שנה של Pro עם 3 חודשים בחינם."
  hi: "आपको URnetwork इस्तेमाल करते एक हफ़्ता हो गया, तो यह रहा वह स्वागत बोनस जो हम नए सदस्यों को देते हैं: Pro का एक साल, 3 महीने मुफ़्त।"
  id: "Sudah seminggu kamu memakai URnetwork, jadi ini bonus sambutan yang kami berikan untuk anggota baru: setahun Pro dengan 3 bulan gratis."
  it: "Hai URnetwork da una settimana, quindi ecco il bonus di benvenuto che diamo ai nuovi membri: un anno di Pro con 3 mesi gratis."
  ja: "URnetwork を使い始めて1週間ですね。新しいメンバーへのウェルカムボーナスをどうぞ。Pro 1年分、3か月無料つき。"
  ko: "URnetwork를 쓰신 지 일주일이 됐네요. 새 회원에게 드리는 환영 보너스입니다. Pro 1년에 3개월 무료."
  nl: "Je hebt URnetwork nu een week, dus hier is de welkomstbonus die we nieuwe leden geven: een jaar Pro met 3 maanden gratis."
  pl: "Masz URnetwork od tygodnia, więc oto bonus powitalny, który dajemy nowym członkom: rok Pro z 3 miesiącami za darmo."
  pt: "Você já tem a URnetwork há uma semana, então aqui vai o bônus de boas-vindas que damos aos novos membros: um ano de Pro com 3 meses grátis."
  pt-BR: "Você já tem a URnetwork há uma semana, então aqui vai o bônus de boas-vindas que damos aos novos membros: um ano de Pro com 3 meses grátis."
  pt-PT: "Tem a URnetwork há uma semana, por isso aqui fica o bónus de boas-vindas que damos aos novos membros: um ano de Pro com 3 meses grátis."
  ru: "Вы с URnetwork уже неделю, так что вот приветственный бонус, который мы даём новым участникам: год Pro с 3 бесплатными месяцами."
  sv: "Du har haft URnetwork i en vecka, så här är välkomstbonusen vi ger nya medlemmar: ett år Pro med 3 månader gratis."
  sw: "Umekuwa na URnetwork kwa wiki moja, kwa hivyo hii ndiyo bonasi ya kukaribisha tunayowapa wanachama wapya: mwaka mmoja wa Pro na miezi 3 bila malipo."
  th: "คุณใช้ URnetwork มาหนึ่งสัปดาห์แล้ว นี่คือโบนัสต้อนรับที่เรามอบให้สมาชิกใหม่: Pro หนึ่งปี ฟรี 3 เดือน"
  uk: "Ви з URnetwork уже тиждень, тож ось вітальний бонус, який ми даємо новим учасникам: рік Pro з 3 безкоштовними місяцями."
  vi: "Bạn đã dùng URnetwork được một tuần, nên đây là phần thưởng chào mừng chúng tôi dành cho thành viên mới: một năm Pro với 3 tháng miễn phí."
  zh: "你用 URnetwork 已经一周了，所以这是我们给新成员的欢迎奖励：一年 Pro，免费 3 个月。"
  zh-HK: "你用 URnetwork 已經一週了，所以這是我們給新成員的歡迎獎勵：一年 Pro，免費 3 個月。"
