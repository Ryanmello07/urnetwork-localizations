description: "Earnings, the settlement v2 tile and the claim sheet, under Below the automatic threshold. The placeholders are amounts: the threshold in TAO (0.0125), then the same in SN25α at today's price (3)."
source: "It's claimed for you once it's worth about %@ TAO, about %@ SN25α at today's price. Waiting costs nothing: this credit never expires."
platforms:
  - apple
  - android
  - windows
placeholders:
  - name: tao
    type: string
  - name: alpha
    type: string
localizations:
  ar: "تتم المطالبة به نيابةً عنك عندما تبلغ قيمته نحو {tao} TAO، أي نحو {alpha} SN25α بسعر اليوم. الانتظار لا يكلّف شيئًا: هذا الرصيد لا تنتهي صلاحيته أبدًا."
  cs: "Nárok se za vás odešle, jakmile bude mít hodnotu zhruba {tao} TAO, podle dnešní ceny zhruba {alpha} SN25α. Čekání nic nestojí: tento kredit nikdy nevyprší."
  de: "Es wird für dich eingelöst, sobald es etwa {tao} TAO wert ist, zum heutigen Kurs etwa {alpha} SN25α. Warten kostet nichts: Dieses Guthaben verfällt nie."
  el: "Θα διεκδικηθεί για εσάς μόλις αξίζει περίπου {tao} TAO, δηλαδή περίπου {alpha} SN25α με τη σημερινή τιμή. Η αναμονή δεν κοστίζει τίποτα: αυτή η πίστωση δεν λήγει ποτέ."
  en: "It's claimed for you once it's worth about {tao} TAO, about {alpha} SN25α at today's price. Waiting costs nothing: this credit never expires."
  es: "Se reclama en tu nombre en cuanto valga alrededor de {tao} TAO, unos {alpha} SN25α al precio de hoy. Esperar no cuesta nada: este saldo nunca caduca."
  es-419: "Se reclama en tu nombre en cuanto valga alrededor de {tao} TAO, unos {alpha} SN25α al precio de hoy. Esperar no cuesta nada: este saldo nunca vence."
  es-MX: "Se reclama en tu nombre en cuanto valga alrededor de {tao} TAO, unos {alpha} SN25α al precio de hoy. Esperar no cuesta nada: este saldo nunca vence."
  fr: "Il est réclamé pour vous dès qu’il vaut environ {tao} TAO, soit environ {alpha} SN25α au cours du jour. Attendre ne coûte rien : ce crédit n’expire jamais."
  he: "ימומש עבורכם ברגע שיהיה שווה כ-{tao} TAO, כלומר כ-{alpha} SN25α לפי המחיר של היום. ההמתנה לא עולה כלום: תוקף הזיכוי הזה לעולם לא פג."
  hi: "जब इसका मूल्य लगभग {tao} TAO, यानी आज की कीमत पर लगभग {alpha} SN25α हो जाएगा, तब आपकी ओर से इसका दावा कर दिया जाएगा। प्रतीक्षा करने में कोई खर्च नहीं लगता: यह क्रेडिट कभी समाप्त नहीं होता।"
  id: "Ini akan diklaim untuk Anda begitu nilainya mencapai sekitar {tao} TAO, sekitar {alpha} SN25α dengan harga hari ini. Menunggu tidak dikenai biaya apa pun: saldo ini tidak pernah kedaluwarsa."
  it: "Viene riscattato per te non appena vale circa {tao} TAO, circa {alpha} SN25α al prezzo di oggi. Aspettare non costa nulla: questo credito non scade mai."
  ja: "約 {tao} TAO（本日の価格で約 {alpha} SN25α）相当になると、あなたに代わって受け取りの手続きが行われます。待っても費用はかかりません。この残高に有効期限はありません。"
  ko: "약 {tao} TAO(오늘 가격으로 약 {alpha} SN25α) 상당이 되면 받기가 대신 처리됩니다. 기다려도 비용이 들지 않습니다. 이 잔액은 절대 만료되지 않습니다."
  nl: "Het wordt voor je opgeëist zodra het ongeveer {tao} TAO waard is, ongeveer {alpha} SN25α tegen de koers van vandaag. Wachten kost niets: dit tegoed verloopt nooit."
  pl: "Odbiór zostanie przeprowadzony w twoim imieniu, gdy saldo będzie warte około {tao} TAO, czyli około {alpha} SN25α po dzisiejszym kursie. Czekanie nic nie kosztuje: te środki nigdy nie wygasają."
  pt: "É reivindicado em seu nome assim que valer cerca de {tao} TAO, cerca de {alpha} SN25α ao preço de hoje. Esperar não custa nada: este saldo nunca expira."
  pt-BR: "É resgatado em seu nome assim que valer cerca de {tao} TAO, cerca de {alpha} SN25α pelo preço de hoje. Esperar não custa nada: este saldo nunca expira."
  pt-PT: "É reivindicado em seu nome assim que valer cerca de {tao} TAO, cerca de {alpha} SN25α ao preço de hoje. Esperar não custa nada: este saldo nunca expira."
  ru: "Запрос на получение будет отправлен за вас, как только сумма будет стоить примерно {tao} TAO, то есть примерно {alpha} SN25α по сегодняшнему курсу. Ожидание ничего не стоит: у этого начисления нет срока действия."
  sv: "Uttaget görs åt dig så snart beloppet är värt cirka {tao} TAO, cirka {alpha} SN25α till dagens kurs. Att vänta kostar ingenting: det här tillgodohavandet löper aldrig ut."
  sw: "Salio litadaiwa kwa niaba yako pindi litakapokuwa na thamani ya takriban {tao} TAO, yaani takriban {alpha} SN25α kwa bei ya leo. Kusubiri hakugharimu chochote: salio hili halitaisha muda kamwe."
  th: "เมื่อยอดนี้มีมูลค่าประมาณ {tao} TAO หรือประมาณ {alpha} SN25α ตามราคาวันนี้ จะมีการดำเนินการรับให้คุณ การรอไม่มีค่าใช้จ่าย ยอดนี้ไม่มีวันหมดอายุ"
  uk: "Запит на отримання буде надіслано за вас, щойно вартість суми сягне приблизно {tao} TAO, тобто приблизно {alpha} SN25α за сьогоднішнім курсом. Очікування нічого не коштує: це нарахування не має строку дії."
  vi: "Yêu cầu nhận sẽ được gửi thay bạn khi khoản này có giá trị khoảng {tao} TAO, tức khoảng {alpha} SN25α theo giá hôm nay. Chờ đợi không tốn gì: khoản này không bao giờ hết hạn."
  zh: "价值达到约 {tao} TAO（按今日价格约 {alpha} SN25α）时，将代您发起领取。等待不会产生任何费用：这笔余额永不过期。"
  zh-HK: "價值達到約 {tao} TAO（按今日價格約 {alpha} SN25α）時，將代你發起領取。等待不會產生任何費用：這筆餘額永不過期。"
