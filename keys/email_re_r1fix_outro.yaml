description: "Re-engagement email R1 (fix follow-up) closing line."
source: "If it still doesn't work, reply with what you see and roughly when it happened. That's enough for us to look into it."
platforms:
  - email
localizations:
  en: "If it still doesn't work, reply with what you see and roughly when it happened. That's enough for us to look into it."
  ar: "إذا ظلّ لا يعمل، فردّ بما تراه ومتى حدث ذلك تقريباً. هذا يكفينا لنتحقق من الأمر."
  cs: "Pokud to pořád nefunguje, odpovězte, co vidíte a zhruba kdy se to stalo. To nám stačí, abychom to prošetřili."
  de: "Wenn es immer noch nicht funktioniert, antworte mit dem, was du siehst, und ungefähr wann es passiert ist. Das reicht uns, um der Sache nachzugehen."
  el: "Αν ακόμα δεν δουλεύει, απάντησε με αυτό που βλέπεις και περίπου πότε συνέβη. Αυτό μας αρκεί για να το ψάξουμε."
  es: "Si sigue sin funcionar, responde contándome qué ves y más o menos cuándo pasó. Con eso nos basta para investigarlo."
  es-419: "Si sigue sin funcionar, responde contándome qué ves y más o menos cuándo pasó. Con eso nos basta para investigarlo."
  es-MX: "Si sigue sin funcionar, responde contándome qué ves y más o menos cuándo pasó. Con eso nos basta para investigarlo."
  fr: "Si ça ne marche toujours pas, réponds en me disant ce que tu vois et à peu près quand c'est arrivé. Ça nous suffit pour enquêter."
  he: "אם זה עדיין לא עובד, השיבו עם מה שאתם רואים ובערך מתי זה קרה. זה מספיק לנו כדי לבדוק את העניין."
  hi: "अगर यह अब भी काम नहीं करता, तो जवाब में बताएं कि आपको क्या दिखता है और यह लगभग कब हुआ। हमारे लिए इसकी जाँच करने को इतना काफ़ी है।"
  id: "Kalau masih tidak berfungsi, balas dengan apa yang kamu lihat dan kira-kira kapan itu terjadi. Itu sudah cukup bagi kami untuk menyelidikinya."
  it: "Se ancora non funziona, rispondi con quello che vedi e più o meno quando è successo. Ci basta per indagare."
  ja: "それでもうまく動かない場合は、何が表示されるかと、だいたいいつ起きたかを返信で教えてください。それだけあれば、私たちで調べられます。"
  ko: "그래도 작동하지 않는다면, 어떤 화면이 보이는지와 대략 언제 그랬는지 답장으로 알려 주세요. 그 정도면 저희가 살펴보기에 충분합니다."
  nl: "Als het nog steeds niet werkt, antwoord dan met wat je ziet en ongeveer wanneer het gebeurde. Dat is voor ons genoeg om het uit te zoeken."
  pl: "Jeśli nadal nie działa, odpowiedz, co widzisz i mniej więcej kiedy to się stało. To nam wystarczy, żeby się temu przyjrzeć."
  pt: "Se ainda não funcionar, responda com o que você vê e mais ou menos quando aconteceu. Isso basta para investigarmos."
  pt-BR: "Se ainda não funcionar, responda com o que você vê e mais ou menos quando aconteceu. Isso basta para investigarmos."
  pt-PT: "Se continuar a não funcionar, responda com o que vê e mais ou menos quando aconteceu. Isso chega para investigarmos."
  ru: "Если всё ещё не работает, ответьте, что вы видите и примерно когда это случилось. Этого нам хватит, чтобы разобраться."
  sv: "Om det fortfarande inte fungerar, svara med vad du ser och ungefär när det hände. Det räcker för att vi ska kunna undersöka det."
  sw: "Ikiwa bado haifanyi kazi, jibu ukieleza unachokiona na takribani lini kilitokea. Hiyo inatutosha kulichunguza."
  th: "ถ้ายังใช้งานไม่ได้ ตอบกลับมาบอกว่าคุณเห็นอะไร และเกิดขึ้นประมาณเมื่อไร แค่นั้นก็เพียงพอให้เราตรวจสอบแล้ว"
  uk: "Якщо досі не працює, дайте відповідь, що ви бачите і приблизно коли це сталося. Цього нам вистачить, щоб розібратися."
  vi: "Nếu vẫn không hoạt động, hãy trả lời kèm những gì bạn thấy và khoảng thời gian nó xảy ra. Như vậy là đủ để chúng tôi tìm hiểu."
  zh: "如果还是用不了，请回复告诉我你看到的情况，以及大概发生在什么时候。有这些就足够我们去排查了。"
  zh-HK: "如果還是用不了，請回覆告訴我你看到的情況，以及大概在什麼時候發生。有這些資料就足夠我們跟進了。"
