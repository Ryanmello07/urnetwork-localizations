description: "API keys screen (Account > API keys): the warning on the sheet that shows a newly created key. The key is shown only this once, and anyone who has it has full access to the account."
source: "Copy this key now. It won't be shown again, and anyone who has it can use your account."
platforms:
  - apple
  - android
  - site
  - linux
localizations:
  ar: "انسخ هذا المفتاح الآن. لن يظهر مرة أخرى، ويمكن لأي شخص يملكه استخدام حسابك."
  cs: "Zkopírujte si tento klíč hned teď. Znovu se už nezobrazí a kdokoli, kdo ho má, může používat váš účet."
  de: "Kopiere diesen Schlüssel jetzt. Er wird nicht noch einmal angezeigt, und jeder, der ihn hat, kann dein Konto verwenden."
  el: "Αντιγράψτε αυτό το κλειδί τώρα. Δεν θα εμφανιστεί ξανά και όποιος το έχει μπορεί να χρησιμοποιήσει τον λογαριασμό σας."
  en: "Copy this key now. It won't be shown again, and anyone who has it can use your account."
  es: "Copia esta clave ahora. No se volverá a mostrar y cualquiera que la tenga puede usar tu cuenta."
  es-419: "Copia esta clave ahora. No se volverá a mostrar y cualquiera que la tenga puede usar tu cuenta."
  es-MX: "Copia esta clave ahora. No se volverá a mostrar y cualquiera que la tenga puede usar tu cuenta."
  fr: "Copiez cette clé maintenant. Elle ne sera plus affichée, et toute personne qui la possède peut utiliser votre compte."
  he: "העתיקו את המפתח הזה עכשיו. הוא לא יוצג שוב, וכל מי שיש לו אותו יכול להשתמש בחשבון שלכם."
  hi: "यह कुंजी अभी कॉपी करें। यह दोबारा नहीं दिखाई जाएगी, और जिसके पास भी यह हो, वह आपके खाते का उपयोग कर सकता है।"
  id: "Salin kunci ini sekarang. Kunci ini tidak akan ditampilkan lagi, dan siapa pun yang memilikinya dapat menggunakan akun Anda."
  it: "Copia subito questa chiave. Non verrà più mostrata e chiunque la possieda può usare il tuo account."
  ja: "今すぐこのキーをコピーしてください。キーは二度と表示されません。また、キーを持っている人は誰でもアカウントを使用できます。"
  ko: "지금 이 키를 복사하세요. 다시 표시되지 않으며, 키를 가진 사람은 누구나 계정을 사용할 수 있습니다."
  nl: "Kopieer deze sleutel nu. Hij wordt niet opnieuw getoond en iedereen die hem heeft, kan je account gebruiken."
  pl: "Skopiuj ten klucz teraz. Nie zostanie pokazany ponownie, a każdy, kto go ma, może korzystać z Twojego konta."
  pt: "Copie esta chave agora. Não voltará a ser mostrada, e qualquer pessoa que a tenha pode utilizar a sua conta."
  pt-BR: "Copie esta chave agora. Ela não será exibida novamente, e qualquer pessoa que a tiver pode usar sua conta."
  pt-PT: "Copie esta chave agora. Não voltará a ser mostrada, e qualquer pessoa que a tenha pode utilizar a sua conta."
  ru: "Скопируйте этот ключ сейчас. Он больше не будет показан, и любой, у кого он есть, сможет пользоваться вашим аккаунтом."
  sv: "Kopiera nyckeln nu. Den visas inte igen, och alla som har den kan använda ditt konto."
  sw: "Nakili ufunguo huu sasa. Hautaonyeshwa tena, na mtu yeyote aliye nao anaweza kutumia akaunti yako."
  th: "คัดลอกคีย์นี้ตอนนี้ คีย์จะไม่แสดงอีก และใครก็ตามที่มีคีย์นี้จะใช้บัญชีของคุณได้"
  uk: "Скопіюйте цей ключ зараз. Його більше не буде показано, і будь-хто, хто його має, зможе користуватися вашим обліковим записом."
  vi: "Hãy sao chép khóa này ngay bây giờ. Khóa sẽ không được hiển thị lại và bất kỳ ai có khóa này đều có thể sử dụng tài khoản của bạn."
  zh: "请立即复制此密钥。它不会再次显示，任何持有它的人都可以使用您的账户。"
  zh-HK: "請立即複製此金鑰。金鑰不會再次顯示，任何持有它的人都可以使用你的帳戶。"
