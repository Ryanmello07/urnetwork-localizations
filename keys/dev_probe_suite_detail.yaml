description: "Developer page: explanation of the probe suite."
source: "Dials real targets through the live connection and times each stage. Runs with the SDK's own default configuration."
platforms:
  - linux
  - windows
localizations:
  ar: "تتصل بأهداف حقيقية عبر الاتصال الحالي وتقيس زمن كل مرحلة. تعمل بإعدادات SDK الافتراضية الخاصة به."
  cs: "Kontaktuje skutečné cíle přes aktivní připojení a měří čas každé fáze. Běží s vlastní výchozí konfigurací SDK."
  de: "Ruft echte Ziele über die aktive Verbindung auf und misst die Zeit jeder Phase. Läuft mit der eigenen Standardkonfiguration des SDK."
  el: "Καλεί πραγματικούς στόχους μέσω της ενεργής σύνδεσης και χρονομετρά κάθε στάδιο. Εκτελείται με την προεπιλεγμένη διαμόρφωση του ίδιου του SDK."
  en: "Dials real targets through the live connection and times each stage. Runs with the SDK's own default configuration."
  es: "Contacta objetivos reales a través de la conexión activa y mide el tiempo de cada etapa. Se ejecuta con la configuración predeterminada del propio SDK."
  es-419: "Contacta objetivos reales a través de la conexión activa y mide el tiempo de cada etapa. Se ejecuta con la configuración predeterminada del propio SDK."
  es-MX: "Contacta objetivos reales a través de la conexión activa y mide el tiempo de cada etapa. Se ejecuta con la configuración predeterminada del propio SDK."
  fr: "Contacte de vraies cibles via la connexion en cours et chronomètre chaque étape. S’exécute avec la configuration par défaut du SDK lui-même."
  he: "פונה ליעדים אמיתיים דרך החיבור הפעיל ומודדת את הזמן של כל שלב. רצה עם תצורת ברירת המחדל של ה-SDK עצמו."
  hi: "लाइव कनेक्शन से असली लक्ष्यों को डायल करता है और हर चरण का समय मापता है। SDK के अपने डिफ़ॉल्ट कॉन्फ़िगरेशन के साथ चलता है।"
  id: "Menghubungi target nyata melalui koneksi aktif dan mengukur waktu setiap tahap. Berjalan dengan konfigurasi bawaan SDK sendiri."
  it: "Contatta obiettivi reali tramite la connessione attiva e cronometra ogni fase. Usa la configurazione predefinita dell’SDK stesso."
  ja: "稼働中の接続を通じて実際の対象に接続し、各段階の時間を計測します。SDK 自体のデフォルト設定で実行されます。"
  ko: "활성 연결을 통해 실제 목표에 연결하고 각 단계의 시간을 잽니다. SDK 자체의 기본 구성으로 실행됩니다."
  nl: "Benadert echte doelen via de actieve verbinding en meet de tijd van elke fase. Draait met de eigen standaardconfiguratie van de SDK."
  pl: "Łączy się z prawdziwymi celami przez aktywne połączenie i mierzy czas każdego etapu. Działa z domyślną konfiguracją samego SDK."
  pt: "Contacta alvos reais através da ligação ativa e cronometra cada fase. Corre com a configuração predefinida do próprio SDK."
  pt-BR: "Contata alvos reais pela conexão ativa e cronometra cada etapa. Roda com a configuração padrão do próprio SDK."
  pt-PT: "Contacta alvos reais através da ligação ativa e cronometra cada fase. Corre com a configuração predefinida do próprio SDK."
  ru: "Обращается к реальным целям через активное соединение и замеряет время каждого этапа. Работает с собственной конфигурацией SDK по умолчанию."
  sv: "Kontaktar riktiga mål via den aktiva anslutningen och tar tid på varje steg. Körs med SDK:ns egen standardkonfiguration."
  sw: "Hupiga malengo halisi kupitia muunganisho unaoendelea na hupima muda wa kila hatua. Huendeshwa kwa usanidi chaguomsingi wa SDK yenyewe."
  th: "เชื่อมต่อเป้าหมายจริงผ่านการเชื่อมต่อที่ใช้งานอยู่และจับเวลาแต่ละขั้น ทำงานด้วยการกำหนดค่าเริ่มต้นของ SDK เอง"
  uk: "Звертається до реальних цілей через активне з’єднання й вимірює час кожного етапу. Працює з власною стандартною конфігурацією SDK."
  vi: "Quay số tới các mục tiêu thật qua kết nối đang hoạt động và đo thời gian từng giai đoạn. Chạy với cấu hình mặc định riêng của SDK."
  zh: "通过当前连接拨号真实目标，并为每个阶段计时。使用 SDK 自身的默认配置运行。"
  zh-HK: "透過目前的連線撥號到真實目標，並為每個階段計時。使用 SDK 本身的預設設定執行。"
