description: "Windows Connect page line after the service stopped a tunnel that carried nothing, while the kill switch keeps this computer blocked."
source: "The tunnel could not carry traffic, so URnetwork shut it down. The kill switch is on, so nothing leaves this machine until you connect again or turn the kill switch off — nothing is leaking."
platforms:
  - windows
localizations:
  ar: "لم يتمكن النفق من نقل حركة البيانات، لذا أوقفه URnetwork. مفتاح القتل مفعّل، لذا لا يغادر أي شيء هذا الكمبيوتر حتى تتصل مجددًا أو توقف مفتاح القتل — لا يوجد أي تسرب."
  cs: "Tunel nedokázal přenášet provoz, a tak ho URnetwork vypnul. Kill switch je zapnutý, takže z tohoto počítače nic neodchází, dokud se znovu nepřipojíte nebo kill switch nevypnete – nic neuniká."
  de: "Der Tunnel konnte keinen Datenverkehr übertragen, deshalb hat URnetwork ihn beendet. Der Kill switch ist an, daher verlässt nichts diesen Computer, bis du dich wieder verbindest oder den Kill switch ausschaltest – es dringt nichts nach außen."
  el: "Η σήραγγα δεν μπορούσε να μεταφέρει κίνηση, οπότε το URnetwork την τερμάτισε. Το Kill switch είναι ενεργό, οπότε τίποτα δεν φεύγει από αυτόν τον υπολογιστή μέχρι να συνδεθείτε ξανά ή να απενεργοποιήσετε το Kill switch — δεν υπάρχει καμία διαρροή."
  en: "The tunnel could not carry traffic, so URnetwork shut it down. The kill switch is on, so nothing leaves this machine until you connect again or turn the kill switch off — nothing is leaking."
  es: "El túnel no podía transportar tráfico, así que URnetwork lo cerró. El Kill switch está activado, así que nada sale de este ordenador hasta que vuelvas a conectarte o desactives el Kill switch: no hay ninguna fuga."
  es-419: "El túnel no podía transportar tráfico, así que URnetwork lo cerró. El Kill switch está activado, así que nada sale de esta computadora hasta que vuelvas a conectarte o desactives el Kill switch: no hay ninguna fuga."
  es-MX: "El túnel no podía transportar tráfico, así que URnetwork lo cerró. El Kill switch está activado, así que nada sale de esta computadora hasta que vuelvas a conectarte o desactives el Kill switch: no hay ninguna fuga."
  fr: "Le tunnel ne pouvait pas acheminer le trafic, URnetwork l’a donc arrêté. Le Kill switch est activé : rien ne quitte cet ordinateur tant que vous ne vous reconnectez pas ou ne désactivez pas le Kill switch — rien ne fuit."
  he: "המנהרה לא הצליחה להעביר תעבורה, ולכן URnetwork סגר אותה. הקיל סוויץ' פעיל, ולכן שום דבר לא יוצא מהמחשב הזה עד שתתחברו שוב או תכבו את הקיל סוויץ' — שום דבר לא דולף."
  hi: "टनल ट्रैफ़िक नहीं ले जा पा रहा था, इसलिए URnetwork ने उसे बंद कर दिया। किल स्विच चालू है, इसलिए जब तक आप फिर से कनेक्ट नहीं करते या किल स्विच बंद नहीं करते, इस कंप्यूटर से कुछ भी बाहर नहीं जाता — कुछ भी लीक नहीं हो रहा।"
  id: "Terowongan tidak dapat membawa lalu lintas, jadi URnetwork menghentikannya. Kill switch aktif, jadi tidak ada yang keluar dari komputer ini sampai Anda terhubung lagi atau mematikan Kill switch — tidak ada yang bocor."
  it: "Il tunnel non riusciva a trasportare il traffico, quindi URnetwork lo ha chiuso. Il Kill switch è attivo, quindi nulla lascia questo computer finché non ti riconnetti o non disattivi il Kill switch — non c’è alcuna perdita."
  ja: "トンネルが通信を運べなかったため、URnetwork がトンネルを終了しました。キルスイッチがオンのため、再接続するかキルスイッチをオフにするまで、このコンピューターからは何も出ていきません — 漏洩はありません。"
  ko: "터널이 트래픽을 전달하지 못해 URnetwork가 터널을 종료했습니다. 킬 스위치가 켜져 있어 다시 연결하거나 킬 스위치를 끌 때까지 이 컴퓨터에서 아무것도 나가지 않습니다 — 유출은 없습니다."
  nl: "De tunnel kon geen verkeer vervoeren, dus heeft URnetwork hem uitgeschakeld. De Kill switch staat aan, dus er verlaat niets deze computer totdat je opnieuw verbinding maakt of de Kill switch uitzet – er lekt niets."
  pl: "Tunel nie mógł przenosić ruchu, więc URnetwork go wyłączył. Kill switch jest włączony, więc nic nie opuszcza tego komputera, dopóki nie połączysz się ponownie lub nie wyłączysz Kill switch — nic nie wycieka."
  pt: "O túnel não conseguia transportar tráfego, então a URnetwork o encerrou. O Kill switch está ativado, então nada sai deste computador até você se conectar de novo ou desativar o Kill switch — nada está vazando."
  pt-BR: "O túnel não conseguia transportar tráfego, então a URnetwork o encerrou. O Kill switch está ativado, então nada sai deste computador até você se conectar de novo ou desativar o Kill switch — nada está vazando."
  pt-PT: "O túnel não conseguia transportar tráfego, por isso a URnetwork encerrou-o. O Kill switch está ativado, por isso nada sai deste computador até voltar a ligar ou desativar o Kill switch — não há fugas."
  ru: "Туннель не мог передавать трафик, поэтому URnetwork его отключил. Kill switch включён, поэтому ничто не покидает этот компьютер, пока вы снова не подключитесь или не выключите Kill switch, — утечек нет."
  sv: "Tunneln kunde inte föra trafik, så URnetwork stängde av den. Kill switch är på, så inget lämnar den här datorn förrän du ansluter igen eller stänger av Kill switch – inget läcker."
  sw: "Handaki halikuweza kubeba trafiki, kwa hivyo URnetwork ililizima. Kill switch imewashwa, kwa hivyo hakuna kinachotoka kwenye kompyuta hii hadi uunganishe tena au uzime Kill switch — hakuna kinachovuja."
  th: "อุโมงค์รับส่งทราฟฟิกไม่ได้ URnetwork จึงปิดอุโมงค์ไป สวิตช์หยุดการเชื่อมต่อเปิดอยู่ จึงไม่มีสิ่งใดออกจากคอมพิวเตอร์เครื่องนี้จนกว่าคุณจะเชื่อมต่ออีกครั้งหรือปิดสวิตช์หยุดการเชื่อมต่อ — ไม่มีข้อมูลรั่วไหล"
  uk: "Тунель не міг передавати трафік, тож URnetwork його вимкнув. Kill switch увімкнено, тож ніщо не залишає цей комп’ютер, доки ви знову не підключитеся або не вимкнете Kill switch, — витоків немає."
  vi: "Đường hầm không thể truyền lưu lượng nên URnetwork đã tắt nó. Kill switch đang bật, vì vậy không có gì rời khỏi máy tính này cho đến khi bạn kết nối lại hoặc tắt Kill switch — không có gì bị rò rỉ."
  zh: "隧道无法传输流量，因此 URnetwork 已将其关闭。断网保护已开启，因此在你重新连接或关闭断网保护之前，任何流量都不会离开这台电脑 — 没有发生任何泄漏。"
  zh-HK: "隧道無法傳輸流量，因此 URnetwork 已將其關閉。斷線開關已開啟，因此在你重新連線或關閉斷線開關之前，任何流量都不會離開這部電腦 — 沒有任何洩漏。"
