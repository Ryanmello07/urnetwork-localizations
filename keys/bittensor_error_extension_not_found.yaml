description: "Error: the wallet's browser extension is not installed in this browser (on ur.io, or in the apps when the ur.io bridge page returns extension_not_found). The argument is the wallet product name (Talisman)."
source: "The %@ extension was not found in this browser. Install it, then try again."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: wallet
    type: string
localizations:
  ar: "لم يتم العثور على إضافة {wallet} في هذا المتصفح. ثبّتها ثم حاول مرة أخرى."
  cs: "Rozšíření {wallet} nebylo v tomto prohlížeči nalezeno. Nainstalujte ho a zkuste to znovu."
  de: "Die {wallet}-Erweiterung wurde in diesem Browser nicht gefunden. Installiere sie und versuche es dann erneut."
  el: "Η επέκταση {wallet} δεν βρέθηκε σε αυτό το πρόγραμμα περιήγησης. Εγκαταστήστε την και δοκιμάστε ξανά."
  en: "The {wallet} extension was not found in this browser. Install it, then try again."
  es: "No se encontró la extensión de {wallet} en este navegador. Instálala y vuelve a intentarlo."
  es-419: "No se encontró la extensión de {wallet} en este navegador. Instálala y vuelve a intentarlo."
  es-MX: "No se encontró la extensión de {wallet} en este navegador. Instálala y vuelve a intentarlo."
  fr: "L'extension {wallet} est introuvable dans ce navigateur. Installez-la, puis réessayez."
  he: "התוסף {wallet} לא נמצא בדפדפן הזה. התקינו אותו ונסו שוב."
  hi: "इस ब्राउज़र में {wallet} एक्सटेंशन नहीं मिला। इसे इंस्टॉल करें, फिर दोबारा प्रयास करें।"
  id: "Ekstensi {wallet} tidak ditemukan di browser ini. Pasang ekstensi tersebut, lalu coba lagi."
  it: "L'estensione {wallet} non è stata trovata in questo browser. Installala, poi riprova."
  ja: "このブラウザーで{wallet}拡張機能が見つかりませんでした。インストールしてから、もう一度お試しください。"
  ko: "이 브라우저에서 {wallet} 확장 프로그램을 찾을 수 없습니다. 설치한 후 다시 시도하세요."
  nl: "De {wallet}-extensie is niet gevonden in deze browser. Installeer de extensie en probeer het opnieuw."
  pl: "Nie znaleziono rozszerzenia {wallet} w tej przeglądarce. Zainstaluj je, a potem spróbuj ponownie."
  pt: "A extensão {wallet} não foi encontrada neste navegador. Instale-a e tente novamente."
  pt-BR: "A extensão {wallet} não foi encontrada neste navegador. Instale-a e tente novamente."
  pt-PT: "A extensão {wallet} não foi encontrada neste navegador. Instale-a e tente novamente."
  ru: "Расширение {wallet} не найдено в этом браузере. Установите его и повторите попытку."
  sv: "Tillägget {wallet} hittades inte i den här webbläsaren. Installera det och försök sedan igen."
  sw: "Kiendelezi cha {wallet} hakikupatikana kwenye kivinjari hiki. Kisakinishe, kisha ujaribu tena."
  th: "ไม่พบส่วนขยาย {wallet} ในเบราว์เซอร์นี้ ติดตั้งส่วนขยาย แล้วลองอีกครั้ง"
