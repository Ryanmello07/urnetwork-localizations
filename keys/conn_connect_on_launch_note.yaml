description: "Settings: explanation under the connect-on-launch switch."
source: "Off by default. When on, URnetwork connects to your selected provider as soon as you open the app. This changes the next launch - it does not connect now."
platforms:
  - linux
localizations:
  ar: "متوقف افتراضيًا. عند التفعيل، يتصل URnetwork بالمزوّد الذي اخترته بمجرد فتح التطبيق. هذا يغيّر التشغيل التالي - ولا يتصل الآن."
  cs: "Ve výchozím nastavení vypnuto. Když je zapnuto, URnetwork se připojí k vybranému poskytovateli hned po otevření aplikace. Změna platí pro příští spuštění - teď se nepřipojí."
  de: "Standardmäßig aus. Wenn aktiv, verbindet sich URnetwork mit dem gewählten Anbieter, sobald du die App öffnest. Das gilt ab dem nächsten Start - jetzt wird nicht verbunden."
  el: "Απενεργοποιημένο από προεπιλογή. Όταν είναι ενεργό, το URnetwork συνδέεται στον επιλεγμένο πάροχο μόλις ανοίξετε την εφαρμογή. Αυτό αλλάζει την επόμενη εκκίνηση - δεν συνδέεται τώρα."
  en: "Off by default. When on, URnetwork connects to your selected provider as soon as you open the app. This changes the next launch - it does not connect now."
  es: "Desactivado por defecto. Cuando está activado, URnetwork se conecta a tu proveedor seleccionado en cuanto abres la app. Esto cambia el próximo inicio - no conecta ahora."
  es-419: "Desactivado de forma predeterminada. Cuando está activado, URnetwork se conecta a tu proveedor seleccionado en cuanto abres la app. Esto cambia el próximo inicio - no conecta ahora."
  es-MX: "Desactivado por defecto. Cuando está activado, URnetwork se conecta a tu proveedor seleccionado en cuanto abres la app. Esto cambia el próximo inicio - no conecta ahora."
  fr: "Désactivé par défaut. Une fois activé, URnetwork se connecte à votre fournisseur sélectionné dès que vous ouvrez l’application. Cela s’applique au prochain lancement - rien ne se connecte maintenant."
  he: "כבוי כברירת מחדל. כשמופעל, URnetwork מתחבר לספק שבחרתם ברגע שתפתחו את האפליקציה. זה משנה את ההפעלה הבאה - לא מתחבר עכשיו."
  hi: "डिफ़ॉल्ट रूप से बंद। चालू होने पर, ऐप खोलते ही URnetwork आपके चुने हुए प्रदाता से कनेक्ट हो जाता है। यह अगली बार खोलने पर लागू होता है - अभी कनेक्ट नहीं करता।"
  id: "Mati secara default. Saat aktif, URnetwork tersambung ke penyedia pilihan Anda begitu aplikasi dibuka. Ini berlaku pada peluncuran berikutnya - tidak menghubungkan sekarang."
  it: "Disattivato per impostazione predefinita. Quando è attivo, URnetwork si connette al provider selezionato appena apri l’app. Vale dal prossimo avvio - non connette adesso."
  ja: "デフォルトはオフ。オンにすると、アプリを開くとすぐに URnetwork が選択したプロバイダーに接続します。次回の起動から適用され、今は接続しません。"
  ko: "기본값은 꺼짐입니다. 켜면 앱을 열자마자 URnetwork가 선택한 제공자에 연결합니다. 다음 실행부터 적용되며 지금 연결하지는 않습니다."
  nl: "Standaard uit. Als dit aanstaat, verbindt URnetwork met je gekozen provider zodra je de app opent. Dit geldt vanaf de volgende start - het verbindt nu niet."
  pl: "Domyślnie wyłączone. Gdy włączone, URnetwork łączy się z wybranym dostawcą zaraz po otwarciu aplikacji. Zmiana dotyczy następnego uruchomienia - teraz nie łączy."
  pt: "Desligado por padrão. Quando ligado, a URnetwork conecta ao seu provedor selecionado assim que você abre o app. Isso vale para a próxima abertura - não conecta agora."
  pt-BR: "Desligado por padrão. Quando ligado, a URnetwork conecta ao seu provedor selecionado assim que você abre o app. Isso vale para a próxima abertura - não conecta agora."
  pt-PT: "Desligado por predefinição. Quando ligado, a URnetwork liga-se ao fornecedor selecionado assim que abre a app. Isto aplica-se ao próximo arranque - não liga agora."
  ru: "По умолчанию выключено. Когда включено, URnetwork подключается к выбранному провайдеру сразу после открытия приложения. Это действует со следующего запуска - сейчас подключения не будет."
  sv: "Av som standard. När det är på ansluter URnetwork till din valda leverantör så fort du öppnar appen. Det gäller nästa start - det ansluter inte nu."
  sw: "Imezimwa kwa chaguomsingi. Ikiwashwa, URnetwork huunganisha kwa mtoa huduma uliyemchagua mara tu unapofungua programu. Hii hubadilisha uzinduzi ujao - haiunganishi sasa."
  th: "ปิดไว้เป็นค่าเริ่มต้น เมื่อเปิด URnetwork จะเชื่อมต่อกับผู้ให้บริการที่คุณเลือกทันทีที่เปิดแอป มีผลในการเปิดครั้งถัดไป - ไม่ได้เชื่อมต่อตอนนี้"
  uk: "Типово вимкнено. Коли ввімкнено, URnetwork підключається до вибраного провайдера одразу після відкриття застосунку. Це діє з наступного запуску - зараз підключення не буде."
  vi: "Mặc định tắt. Khi bật, URnetwork sẽ kết nối với nhà cung cấp bạn đã chọn ngay khi mở ứng dụng. Áp dụng cho lần khởi động tiếp theo - không kết nối ngay bây giờ."
  zh: "默认关闭。开启后，URnetwork 会在你打开应用时立即连接到所选提供者。这会影响下次启动 - 现在不会连接。"
  zh-HK: "預設關閉。開啟後，URnetwork 會在你開啟應用程式時立即連線至所選提供者。這會影響下次啟動 - 現在不會連線。"
