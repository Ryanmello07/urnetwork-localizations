  th: "ช่วงเวลาที่ใช้นับขีดจำกัดการลบ ปิด (เหมือนขีดจำกัด 0) จะปิดตัวตัดวงจร"
  uk: "Вікно, за яке рахується ліміт видалень. Вимкнення (як ліміт 0) вимикає запобіжник"
