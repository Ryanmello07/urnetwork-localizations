  id: "Jendela tempat batas penghapusan dihitung. Nonaktif (seperti batas 0) mematikan pemutusnya"
  it: "La finestra su cui si conta il limite di rimozioni. Disattivato (come un limite di 0) spegne l’interruttore"
  ja: "除外の上限を数える期間。オフ（上限 0 と同じ）にするとブレーカーが無効になります"
  ko: "제외 한도를 세는 기간입니다. 끄면(한도 0과 같이) 차단기가 꺼집니다"
  nl: "Het venster waarover de verwijderingslimiet wordt geteld. Uit (net als een limiet van 0) zet de stroomonderbreker uit"
  pl: "Okno, w którym liczony jest limit usunięć. Wyłączenie (jak limit 0) wyłącza bezpiecznik"
  pt: "A janela em que o limite de remoções é contado. Desativado (como um limite de 0) desliga o disjuntor"
  pt-BR: "A janela em que o limite de remoções é contado. Desativado (como um limite de 0) desliga o disjuntor"
  pt-PT: "A janela em que o limite de remoções é contado. Desativado (como um limite de 0) desliga o disjuntor"
  ru: "Окно, за которое считается лимит удалений. Выключенное значение (как и лимит 0) отключает предохранитель"
  sv: "Fönstret som borttagningsgränsen räknas över. Av (som en gräns på 0) stänger av brytaren"
