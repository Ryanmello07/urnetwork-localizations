description: "Developer tools screen: explanatory subtext under the 'removal budget window' control."
source: "The window the removal limit is counted over. Off (like a limit of 0) turns the breaker off"
platforms:
  - android
localizations:
  ar: "النافذة التي يُحتسب عليها حد الإزالة. الإيقاف (مثل حد يساوي 0) يعطّل القاطع"
  cs: "Okno, za které se limit odstranění počítá. Vypnuto (stejně jako limit 0) vypne jistič"
  de: "Das Fenster, über das das Entfernungslimit gezählt wird. Aus (wie ein Limit von 0) schaltet den Schutzschalter ab"
  el: "Το παράθυρο στο οποίο μετριέται το όριο αφαιρέσεων. Η απενεργοποίηση (όπως ένα όριο 0) κλείνει τον διακόπτη"
  en: "The window the removal limit is counted over. Off (like a limit of 0) turns the breaker off"
  es: "La ventana en la que se cuenta el límite de eliminaciones. Desactivado (como un límite de 0) apaga el disyuntor"
  es-419: "La ventana en la que se cuenta el límite de eliminaciones. Desactivado (como un límite de 0) apaga el disyuntor"
  es-MX: "La ventana en la que se cuenta el límite de eliminaciones. Desactivado (como un límite de 0) apaga el disyuntor"
  fr: "La fenêtre sur laquelle la limite de retraits est comptée. Désactivé (comme une limite de 0) coupe le disjoncteur"
  he: "החלון שבו נספרת מגבלת ההסרות. כיבוי (כמו מגבלה של 0) מכבה את המפסק"
