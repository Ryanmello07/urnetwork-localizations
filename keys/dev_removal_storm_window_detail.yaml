description: "Developer page: the explanation under the 'Removal storm window' setting."
source: "The window the removal limit is counted over, in ms. Off (like a limit of 0) turns the breaker off"
platforms:
  - linux
  - apple
localizations:
  ar: "النافذة التي يُحتسب عليها حد الإزالة، بالمللي ثانية. الإيقاف (مثل حد يساوي 0) يعطّل القاطع"
  cs: "Okno, za které se limit odstranění počítá, v ms. Vypnuto (stejně jako limit 0) vypne jistič"
  de: "Das Fenster, über das das Entfernungslimit gezählt wird, in ms. Aus (wie ein Limit von 0) schaltet den Schutzschalter ab"
  el: "Το παράθυρο στο οποίο μετριέται το όριο αφαιρέσεων, σε ms. Η απενεργοποίηση (όπως ένα όριο 0) κλείνει τον διακόπτη"
  en: "The window the removal limit is counted over, in ms. Off (like a limit of 0) turns the breaker off"
  es: "La ventana en la que se cuenta el límite de eliminaciones, en ms. Desactivado (como un límite de 0) apaga el disyuntor"
  es-419: "La ventana en la que se cuenta el límite de eliminaciones, en ms. Desactivado (como un límite de 0) apaga el disyuntor"
  es-MX: "La ventana en la que se cuenta el límite de eliminaciones, en ms. Desactivado (como un límite de 0) apaga el disyuntor"
  fr: "La fenêtre sur laquelle la limite de retraits est comptée, en ms. Désactivé (comme une limite de 0) coupe le disjoncteur"
  he: "החלון שבו נספרת מגבלת ההסרות, במילישניות. כיבוי (כמו מגבלה של 0) מכבה את המפסק"
  hi: "वह विंडो जिसमें निष्कासन सीमा गिनी जाती है, ms में। बंद (0 की सीमा की तरह) ब्रेकर को बंद कर देता है"
  id: "Jendela tempat batas penghapusan dihitung, dalam ms. Nonaktif (seperti batas 0) mematikan pemutusnya"
  it: "La finestra su cui si conta il limite di rimozioni, in ms. Disattivato (come un limite di 0) spegne l’interruttore"
  ja: "除外の上限を数える期間（ミリ秒）。オフ（上限 0 と同じ）にするとブレーカーが無効になります"
  ko: "제외 한도를 세는 기간(밀리초)입니다. 끄면(한도 0과 같이) 차단기가 꺼집니다"
  nl: "Het venster waarover de verwijderingslimiet wordt geteld, in ms. Uit (net als een limiet van 0) zet de stroomonderbreker uit"
  pl: "Okno, w którym liczony jest limit usunięć, w ms. Wyłączenie (jak limit 0) wyłącza bezpiecznik"
  pt: "A janela em que o limite de remoções é contado, em ms. Desativado (como um limite de 0) desliga o disjuntor"
  pt-BR: "A janela em que o limite de remoções é contado, em ms. Desativado (como um limite de 0) desliga o disjuntor"
  pt-PT: "A janela em que o limite de remoções é contado, em ms. Desativado (como um limite de 0) desliga o disjuntor"
  ru: "Окно, за которое считается лимит удалений, в мс. Выключенное значение (как и лимит 0) отключает предохранитель"
  sv: "Fönstret som borttagningsgränsen räknas över, i ms. Av (som en gräns på 0) stänger av brytaren"
  sw: "Dirisha ambamo kikomo cha uondoaji kinahesabiwa, kwa ms. Kuzima (sawa na kikomo cha 0) kunazima kikatizi"
  th: "ช่วงเวลาที่ใช้นับขีดจำกัดการลบ (มิลลิวินาที) ปิด (เหมือนขีดจำกัด 0) จะปิดตัวตัดวงจร"
  uk: "Вікно, за яке рахується ліміт видалень, у мс. Вимкнення (як ліміт 0) вимикає запобіжник"
  vi: "Cửa sổ dùng để đếm giới hạn loại bỏ, tính bằng ms. Tắt (giống giới hạn 0) sẽ vô hiệu hóa bộ ngắt"
  zh: "计算移除上限所用的窗口（毫秒）。关闭（与上限为 0 相同）会停用熔断器"
  zh-HK: "計算移除上限所用的視窗（毫秒）。關閉（與上限為 0 相同）會停用斷路器"
