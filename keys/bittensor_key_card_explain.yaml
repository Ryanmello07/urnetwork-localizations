description: "Earnings screen, the payout card for the network's payouts. Explains the one tap, read before it. A miner is a device on the network that earns; this is the Bittensor sense of the word."
source: "URnetwork creates a Bittensor key on this device and pays every miner on your network to it, from the next epoch."
deprecated:
  - apple
platforms:
  - apple
localizations:
  ar: "ينشئ URnetwork مفتاح Bittensor على هذا الجهاز ويدفع إليه أرباح كل مُعدِّن في شبكتك، بدءًا من الفترة التالية."
  cs: "URnetwork vytvoří na tomto zařízení klíč Bittensor a od příští epochy na něj bude vyplácet každého těžaře ve vaší síti."
  de: "URnetwork erstellt auf diesem Gerät einen Bittensor-Schlüssel und zahlt ab der nächsten Epoche jeden Miner in deinem Netzwerk an diesen Schlüssel aus."
  el: "Το URnetwork δημιουργεί ένα κλειδί Bittensor σε αυτή τη συσκευή και, από την επόμενη εποχή, πληρώνει σε αυτό τα κέρδη κάθε εξορύκτη του δικτύου σας."
  en: "URnetwork creates a Bittensor key on this device and pays every miner on your network to it, from the next epoch."
  es: "URnetwork crea una clave de Bittensor en este dispositivo y, a partir de la próxima época, paga en ella a todos los mineros de tu red."
  es-419: "URnetwork crea una clave de Bittensor en este dispositivo y, a partir de la próxima época, paga en ella a todos los mineros de tu red."
  es-MX: "URnetwork crea una clave de Bittensor en este dispositivo y, a partir de la próxima época, paga en ella a todos los mineros de tu red."
  fr: "URnetwork crée une clé Bittensor sur cet appareil et y verse les gains de chaque mineur de votre réseau, à partir de la prochaine époque."
  he: "URnetwork יוצר מפתח Bittensor במכשיר הזה, ומשלם אליו עבור כל כורה ברשת שלכם, החל מהתקופה הבאה."
  hi: "URnetwork इस डिवाइस पर एक Bittensor कुंजी बनाता है और अगले एपोक से आपके नेटवर्क के हर माइनर का भुगतान उसी कुंजी पर करता है।"
  id: "URnetwork membuat kunci Bittensor di perangkat ini dan membayar setiap penambang di jaringan Anda ke kunci itu, mulai epoch berikutnya."
  it: "URnetwork crea una chiave Bittensor su questo dispositivo e dalla prossima epoca paga su di essa ogni miner della tua rete."
  ja: "URnetwork はこのデバイスに Bittensor キーを作成し、次のエポックから、ネットワーク内のすべてのマイナーの収益をそのキーに支払います。"
  ko: "URnetwork는 이 기기에 Bittensor 키를 만들고, 다음 에포크부터 네트워크의 모든 채굴자 수익을 이 키로 지급합니다."
  nl: "URnetwork maakt een Bittensor-sleutel op dit apparaat en betaalt vanaf de volgende epoch elke miner in je netwerk uit aan die sleutel."
  pl: "URnetwork tworzy klucz Bittensor na tym urządzeniu i od następnej epoki wypłaca na niego zarobki każdego górnika w twojej sieci."
  pt: "O URnetwork cria uma chave Bittensor neste dispositivo e, a partir da próxima época, paga nela todos os mineradores da sua rede."
  pt-BR: "O URnetwork cria uma chave Bittensor neste dispositivo e, a partir da próxima época, paga nela todos os mineradores da sua rede."
  pt-PT: "O URnetwork cria uma chave Bittensor neste dispositivo e, a partir da próxima época, paga nela todos os mineradores da sua rede."
  ru: "URnetwork создаёт ключ Bittensor на этом устройстве и со следующей эпохи выплачивает на него заработок всех майнеров вашей сети."
  sv: "URnetwork skapar en Bittensor-nyckel på den här enheten och betalar från nästa epok ut intäkterna från alla miners i ditt nätverk till den."
  sw: "URnetwork inaunda ufunguo wa Bittensor kwenye kifaa hiki na inalipa kila mchimbaji kwenye mtandao wako kwenye ufunguo huo, kuanzia kipindi kijacho."
  th: "URnetwork จะสร้างคีย์ Bittensor บนอุปกรณ์นี้ และจ่ายรายได้ของนักขุดทุกรายในเครือข่ายของคุณเข้าคีย์นี้ ตั้งแต่อีพอคถัดไป"
  uk: "URnetwork створює ключ Bittensor на цьому пристрої та з наступної епохи виплачує на нього заробіток усіх майнерів вашої мережі."
  vi: "URnetwork tạo một khóa Bittensor trên thiết bị này và trả thu nhập của mọi thợ đào trong mạng của bạn vào khóa đó, từ epoch tiếp theo."
  zh: "URnetwork 会在这台设备上创建一个 Bittensor 密钥，并从下一个周期开始将您网络中每个矿工的收益支付到该密钥。"
  zh-HK: "URnetwork 會在這部裝置上建立一個 Bittensor 金鑰，並由下一個週期開始將你網絡中每個礦工的收益支付到該金鑰。"
