description: "Update channel (Windows): this copy runs from a folder outside Program Files (a portable copy), so it has no channel to choose."
source: "This copy of URnetwork is not installed in Program Files. It follows official releases. Install URnetwork to choose a channel."
platforms:
  - windows
localizations:
  ar: "نسخة URnetwork هذه غير مثبّتة في Program Files. وهي تتبع الإصدارات الرسمية. ثبّت URnetwork لتختار قناة."
  cs: "Tato kopie URnetwork není nainstalovaná ve složce Program Files. Řídí se oficiálními vydáními. Chcete-li zvolit kanál, nainstalujte URnetwork."
  de: "Diese Kopie von URnetwork ist nicht unter „Program Files“ installiert. Sie folgt den offiziellen Versionen. Installiere URnetwork, um einen Kanal zu wählen."
  el: "Αυτό το αντίγραφο του URnetwork δεν είναι εγκατεστημένο στο Program Files. Ακολουθεί τις επίσημες εκδόσεις. Εγκαταστήστε το URnetwork για να επιλέξετε κανάλι."
  en: "This copy of URnetwork is not installed in Program Files. It follows official releases. Install URnetwork to choose a channel."
  es: "Esta copia de URnetwork no está instalada en Program Files. Sigue las versiones oficiales. Instala URnetwork para elegir un canal."
  es-419: "Esta copia de URnetwork no está instalada en Program Files. Sigue las versiones oficiales. Instala URnetwork para elegir un canal."
  es-MX: "Esta copia de URnetwork no está instalada en Program Files. Sigue las versiones oficiales. Instala URnetwork para elegir un canal."
  fr: "Cette copie de URnetwork n’est pas installée dans Program Files. Elle suit les versions officielles. Installez URnetwork pour choisir un canal."
  he: "העותק הזה של URnetwork אינו מותקן ב-Program Files. הוא עוקב אחר הגרסאות הרשמיות. התקן את URnetwork כדי לבחור ערוץ."
  hi: "URnetwork की यह कॉपी Program Files में इंस्टॉल नहीं है। यह आधिकारिक रिलीज़ का पालन करती है। चैनल चुनने के लिए URnetwork इंस्टॉल करें।"
  id: "Salinan URnetwork ini tidak terpasang di Program Files. Salinan ini mengikuti rilis resmi. Pasang URnetwork untuk memilih saluran."
  it: "Questa copia di URnetwork non è installata in Program Files. Segue le versioni ufficiali. Installa URnetwork per scegliere un canale."
  ja: "この URnetwork は Program Files にインストールされていません。公式リリースに従います。チャンネルを選ぶには URnetwork をインストールしてください。"
  ko: "이 URnetwork 사본은 Program Files에 설치되어 있지 않습니다. 공식 릴리스를 따릅니다. 채널을 선택하려면 URnetwork를 설치하세요."
  nl: "Deze kopie van URnetwork is niet geïnstalleerd in Program Files. Ze volgt de officiële releases. Installeer URnetwork om een kanaal te kiezen."
  pl: "Ta kopia URnetwork nie jest zainstalowana w folderze Program Files. Korzysta z oficjalnych wydań. Zainstaluj URnetwork, aby wybrać kanał."
  pt: "Esta cópia do URnetwork não está instalada em Program Files. Segue as versões oficiais. Instale o URnetwork para escolher um canal."
  pt-BR: "Esta cópia do URnetwork não está instalada em Program Files. Ela segue as versões oficiais. Instale o URnetwork para escolher um canal."
  pt-PT: "Esta cópia do URnetwork não está instalada em Program Files. Segue as versões oficiais. Instale o URnetwork para escolher um canal."
  ru: "Эта копия URnetwork не установлена в Program Files. Она получает официальные выпуски. Установите URnetwork, чтобы выбрать канал."
  sv: "Den här kopian av URnetwork är inte installerad i Program Files. Den följer officiella versioner. Installera URnetwork för att välja kanal."
  sw: "Nakala hii ya URnetwork haijasakinishwa katika Program Files. Inafuata matoleo rasmi. Sakinisha URnetwork ili kuchagua chaneli."
  th: "สำเนา URnetwork นี้ไม่ได้ติดตั้งไว้ใน Program Files จึงใช้รุ่นทางการ ติดตั้ง URnetwork เพื่อเลือกช่องทาง"
  uk: "Ця копія URnetwork не встановлена в Program Files. Вона отримує офіційні випуски. Установіть URnetwork, щоб вибрати канал."
  vi: "Bản URnetwork này không được cài trong Program Files. Bản này theo bản phát hành chính thức. Hãy cài đặt URnetwork để chọn kênh."
  zh: "此 URnetwork 副本未安装在 Program Files 中，会跟随正式版本。安装 URnetwork 后即可选择渠道。"
  zh-HK: "此 URnetwork 副本未有安裝在 Program Files 中，會跟隨正式版本。安裝 URnetwork 後即可選擇頻道。"
