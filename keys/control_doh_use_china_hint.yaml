description: "Extender settings: note under the Use China resolvers button naming the operators it fills in. AliDNS and DNSPod are product names and are not translated."
source: "Fills in the AliDNS and DNSPod servers, which are reachable in mainland China."
platforms:
  - android
  - apple
  - windows
  - linux
