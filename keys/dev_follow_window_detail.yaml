description: "Developer page: the explanation under the 'Follow window' setting."
source: "How long into a bench a site's new connections keep following their exit, in ms. Off scatters immediately"
platforms:
  - linux
localizations:
  ar: "المدة التي تستمر فيها الاتصالات الجديدة للموقع في متابعة مخرجها بعد بدء الحجر، بالمللي ثانية. عند الإيقاف، تُوزَّع فورًا"
  cs: "Jak dlouho od začátku pobytu na lavičce nová připojení webu dál sledují svůj výstup, v ms. Vypnuto rozptýlí okamžitě"
  de: "Wie lange während einer Ersatzbankphase die neuen Verbindungen einer Website ihrem Exit weiter folgen, in ms. Aus: verteilt sofort"
  el: "Για πόσο από την αρχή του πάγκου οι νέες συνδέσεις ενός ιστότοπου συνεχίζουν να ακολουθούν την έξοδό τους, σε ms. Η απενεργοποίηση διασκορπίζει αμέσως"
  en: "How long into a bench a site's new connections keep following their exit, in ms. Off scatters immediately"
  es: "Durante cuánto tiempo, ya en el banquillo, las conexiones nuevas de un sitio siguen a su salida, en ms. Si está desactivado, se dispersan de inmediato"
  es-419: "Durante cuánto tiempo, ya en la banca, las conexiones nuevas de un sitio siguen a su salida, en ms. Si está desactivado, se dispersan de inmediato"
  es-MX: "Durante cuánto tiempo, ya en la banca, las conexiones nuevas de un sitio siguen a su salida, en ms. Si está desactivado, se dispersan de inmediato"
  fr: "Combien de temps après une mise sur la touche les nouvelles connexions d’un site suivent encore leur sortie, en ms. Désactivé disperse immédiatement"
  he: "כמה זמן מתחילת השהייה על הספסל החיבורים החדשים של אתר ממשיכים לעקוב אחר היציאה שלהם, במילישניות. כיבוי מפזר מיד"
  hi: "बेंच की शुरुआत से कितनी देर तक किसी साइट के नए कनेक्शन अपने एग्ज़िट का पीछा करते रहते हैं, ms में। बंद करने पर तुरंत बिखराव होता है"
  id: "Berapa lama sejak awal masa cadangan koneksi baru sebuah situs terus mengikuti exit-nya, dalam ms. Nonaktif langsung menyebarkan"
  it: "Per quanto tempo dall’inizio della panchina le nuove connessioni di un sito continuano a seguire la loro uscita, in ms. Disattivato disperde subito"
  ja: "待機が始まってから、サイトの新しい接続が出口に追従し続ける時間（ミリ秒）。オフにするとすぐに分散させます"
  ko: "대기가 시작된 뒤 사이트의 새 연결이 출구를 계속 따라가는 시간(밀리초)입니다. 끄면 바로 흩어지게 합니다"
  nl: "Hoe lang na het begin van een bankperiode nieuwe verbindingen van een site hun exit blijven volgen, in ms. Uit verspreidt direct"
  pl: "Jak długo od początku ławki nowe połączenia witryny nadal podążają za swoim wyjściem, w ms. Wyłączenie rozprasza od razu"
  pt: "Durante quanto tempo, já no banco, as novas ligações de um site continuam a seguir a sua saída, em ms. Desativado dispersa de imediato"
  pt-BR: "Por quanto tempo, já no banco, as novas conexões de um site continuam seguindo sua saída, em ms. Desativado dispersa imediatamente"
  pt-PT: "Durante quanto tempo, já no banco, as novas ligações de um site continuam a seguir a sua saída, em ms. Desativado dispersa de imediato"
  ru: "Как долго после начала отстранения новые соединения сайта продолжают следовать за своим выходом, в мс. Если выключено, соединения сразу распределяются"
  sv: "Hur länge in i en avbänkning en webbplats nya anslutningar fortsätter att följa sin utgång, i ms. Av sprider direkt"
  sw: "Muda ambao miunganisho mipya ya tovuti huendelea kufuata njia yake ya kutoka tangu ianze kukaa benchi, kwa ms. Kuzima kunatawanya mara moja"
  th: "การเชื่อมต่อใหม่ของเว็บไซต์จะติดตามทางออกของตนต่อไปนานเท่าใดหลังเริ่มพัก (มิลลิวินาที) ปิดเพื่อกระจายทันที"
  uk: "Як довго після початку перебування на лаві нові з’єднання сайту й далі йдуть за своїм виходом, у мс. Вимкнення розсіює одразу"
  vi: "Trong bao lâu kể từ khi bắt đầu dự bị, các kết nối mới của một trang tiếp tục theo điểm thoát của chúng, tính bằng ms. Tắt sẽ phân tán ngay"
  zh: "隔离开始后，站点的新连接继续跟随其出口的时长（毫秒）。关闭时立即分散"
  zh-HK: "隔離開始後，網站的新連線繼續跟隨其出口的時長（毫秒）。關閉時立即分散"
