  uk: "Покупку знайдено. Підтверджуємо ваш план — він оновиться автоматично."
  vi: "Đã tìm thấy giao dịch mua. Đang xác nhận gói của bạn — gói sẽ tự động cập nhật."
  zh: "已找到购买记录。正在确认您的方案，方案将自动更新。"
  zh-HK: "已找到購買記錄。正在確認你的計劃，計劃會自動更新。"
