description: "Key screen, a banner at the top when the user chose to save the recovery phrase first: the key exists only in memory. The 12 words are the recovery phrase. Below are two choices: keep the key on this device, or set up payouts and delete it."
source: "This key isn't saved on this device. Write the 12 words down, then choose below. If you leave this screen, the key is discarded and nothing is paid to it."
platforms:
  - apple
localizations:
  ar: "هذا المفتاح غير محفوظ على هذا الجهاز. دوّن الكلمات الـ 12، ثم اختر أدناه. إذا غادرت هذه الشاشة، فسيتم التخلص من المفتاح ولن يُدفع إليه أي شيء."
  cs: "Tento klíč není na tomto zařízení uložený. Zapište si těch 12 slov a pak vyberte níže. Pokud tuto obrazovku opustíte, klíč se zahodí a nic se na něj nevyplatí."
  de: "Dieser Schlüssel ist nicht auf diesem Gerät gespeichert. Schreib die 12 Wörter auf und wähle dann unten aus. Wenn du diesen Bildschirm verlässt, wird der Schlüssel verworfen, und es wird nichts an ihn ausgezahlt."
  el: "Αυτό το κλειδί δεν είναι αποθηκευμένο σε αυτή τη συσκευή. Σημειώστε τις 12 λέξεις και μετά επιλέξτε παρακάτω. Αν φύγετε από αυτή την οθόνη, το κλειδί θα απορριφθεί και δεν θα πληρωθεί τίποτα σε αυτό."
  en: "This key isn't saved on this device. Write the 12 words down, then choose below. If you leave this screen, the key is discarded and nothing is paid to it."
  es: "Esta clave no está guardada en este dispositivo. Anota las 12 palabras y luego elige abajo. Si sales de esta pantalla, la clave se descartará y no se le pagará nada."
  es-419: "Esta clave no está guardada en este dispositivo. Anota las 12 palabras y luego elige abajo. Si sales de esta pantalla, la clave se descartará y no se le pagará nada."
  es-MX: "Esta clave no está guardada en este dispositivo. Anota las 12 palabras y luego elige abajo. Si sales de esta pantalla, la clave se descartará y no se le pagará nada."
  fr: "Cette clé n’est pas enregistrée sur cet appareil. Notez les 12 mots, puis choisissez ci-dessous. Si vous quittez cet écran, la clé sera supprimée et rien n’y sera versé."
  he: "המפתח הזה לא שמור במכשיר הזה. רשמו את 12 המילים, ואז בחרו למטה. אם תצאו מהמסך הזה, המפתח יימחק ושום דבר לא ישולם אליו."
  hi: "यह कुंजी इस डिवाइस पर सहेजी नहीं गई है। 12 शब्द लिख लें, फिर नीचे से चुनें। अगर आप यह स्क्रीन छोड़ते हैं, तो कुंजी हटा दी जाएगी और उस पर कोई भुगतान नहीं होगा।"
  id: "Kunci ini tidak disimpan di perangkat ini. Tuliskan 12 kata tersebut, lalu pilih di bawah. Jika Anda meninggalkan layar ini, kunci akan dibuang dan tidak akan ada yang dibayarkan ke kunci ini."
  it: "Questa chiave non è salvata su questo dispositivo. Annota le 12 parole, poi scegli qui sotto. Se esci da questa schermata, la chiave verrà scartata e non le verrà pagato nulla."
  ja: "このキーはこのデバイスに保存されていません。12 語を書き留めてから、下で選択してください。この画面を離れるとキーは破棄され、このキーには何も支払われません。"
  ko: "이 키는 이 기기에 저장되어 있지 않습니다. 단어 12개를 적어 둔 다음 아래에서 선택하세요. 이 화면을 나가면 키가 폐기되며 이 키로는 아무것도 지급되지 않습니다."
  nl: "Deze sleutel is niet op dit apparaat opgeslagen. Schrijf de 12 woorden op en kies dan hieronder. Als je dit scherm verlaat, wordt de sleutel weggegooid en wordt er niets aan uitbetaald."
  pl: "Ten klucz nie jest zapisany na tym urządzeniu. Zapisz 12 słów, a potem wybierz poniżej. Jeśli opuścisz ten ekran, klucz zostanie odrzucony i nic nie zostanie na niego wypłacone."
  pt: "Esta chave não está guardada neste dispositivo. Anote as 12 palavras e depois escolha abaixo. Se sair deste ecrã, a chave será descartada e nada lhe será pago."
  pt-BR: "Esta chave não está salva neste dispositivo. Anote as 12 palavras e depois escolha abaixo. Se você sair desta tela, a chave será descartada e nada será pago a ela."
  pt-PT: "Esta chave não está guardada neste dispositivo. Anote as 12 palavras e depois escolha abaixo. Se sair deste ecrã, a chave será descartada e nada lhe será pago."
  ru: "Этот ключ не сохранён на этом устройстве. Запишите 12 слов, затем выберите ниже. Если вы покинете этот экран, ключ будет удалён и на него ничего не будет выплачено."
  sv: "Den här nyckeln är inte sparad på den här enheten. Skriv ner de 12 orden och välj sedan nedan. Om du lämnar den här skärmen kasseras nyckeln och inget betalas ut till den."
  sw: "Ufunguo huu haujahifadhiwa kwenye kifaa hiki. Andika maneno 12, kisha uchague hapa chini. Ukiondoka kwenye skrini hii, ufunguo utatupwa na hakuna kitakacholipwa kwake."
  th: "คีย์นี้ไม่ได้บันทึกไว้บนอุปกรณ์นี้ จดคำทั้ง 12 คำไว้ แล้วเลือกด้านล่าง หากคุณออกจากหน้าจอนี้ คีย์จะถูกทิ้งและจะไม่มีการจ่ายใดๆ เข้าคีย์นี้"
  uk: "Цей ключ не збережено на цьому пристрої. Запишіть 12 слів, а потім виберіть нижче. Якщо ви покинете цей екран, ключ буде видалено, і на нього нічого не буде виплачено."
  vi: "Khóa này chưa được lưu trên thiết bị này. Hãy ghi lại 12 từ, rồi chọn bên dưới. Nếu bạn rời khỏi màn hình này, khóa sẽ bị hủy và sẽ không có khoản nào được trả vào khóa."
  zh: "此密钥未保存在这台设备上。请抄下这 12 个词，然后在下方选择。如果您离开此页面，该密钥将被丢弃，也不会向其支付任何款项。"
  zh-HK: "此金鑰未儲存在這部裝置上。請抄下這 12 個詞，然後在下方選擇。如果你離開此頁面，該金鑰將被捨棄，亦不會向其支付任何款項。"
