description: "Connect drawer: warning that DNS is resolving outside the tunnel."
source: "DNS is NOT going through the tunnel — names you look up are resolving outside it."
platforms:
  - linux
localizations:
  ar: "DNS لا يمر عبر النفق — الأسماء التي تبحث عنها تُحلّ خارجه."
  cs: "DNS NEJDE tunelem — názvy, které vyhledáváte, se překládají mimo něj."
  de: "DNS läuft NICHT durch den Tunnel — die Namen, die du nachschlägst, werden außerhalb aufgelöst."
  el: "Το DNS ΔΕΝ περνά από τη σήραγγα — τα ονόματα που αναζητάτε επιλύονται εκτός αυτής."
  en: "DNS is NOT going through the tunnel — names you look up are resolving outside it."
  es: "El DNS NO pasa por el túnel — los nombres que consultas se resuelven fuera de él."
  es-419: "El DNS NO pasa por el túnel — los nombres que consultas se resuelven fuera de él."
  es-MX: "El DNS NO pasa por el túnel — los nombres que consultas se resuelven fuera de él."
  fr: "Le DNS ne passe PAS par le tunnel — les noms que vous consultez sont résolus en dehors."
  he: "ה-DNS לא עובר במנהרה — השמות שאתם מחפשים נפתרים מחוץ לה."
  hi: "DNS टनल से नहीं जा रहा है — आप जो नाम खोजते हैं वे उसके बाहर हल हो रहे हैं।"
  id: "DNS TIDAK melewati terowongan — nama yang Anda cari diselesaikan di luarnya."
  it: "Il DNS NON passa dal tunnel — i nomi che cerchi vengono risolti al di fuori."
  ja: "DNS はトンネルを通っていません — 名前解決はトンネルの外で行われています。"
  ko: "DNS가 터널을 통과하지 않습니다 — 조회하는 이름이 터널 밖에서 해석되고 있습니다."
  nl: "DNS gaat NIET door de tunnel — de namen die je opzoekt worden erbuiten opgelost."
  pl: "DNS NIE przechodzi przez tunel — wyszukiwane nazwy są rozwiązywane poza nim."
  pt: "O DNS NÃO está passando pelo túnel — os nomes que você consulta são resolvidos fora dele."
  pt-BR: "O DNS NÃO está passando pelo túnel — os nomes que você consulta são resolvidos fora dele."
  pt-PT: "O DNS NÃO está a passar pelo túnel — os nomes que consulta são resolvidos fora dele."
  ru: "DNS НЕ идёт через туннель — запрашиваемые вами имена разрешаются вне его."
  sv: "DNS går INTE genom tunneln — namnen du slår upp löses upp utanför den."
  sw: "DNS HAIPITI kwenye handaki — majina unayotafuta yanatatuliwa nje yake."
  th: "DNS ไม่ได้ผ่านอุโมงค์ — ชื่อที่คุณค้นหากำลังถูกแปลงนอกอุโมงค์"
  uk: "DNS НЕ проходить через тунель — імена, які ви шукаєте, розв’язуються поза ним."
  vi: "DNS KHÔNG đi qua đường hầm — các tên bạn tra cứu đang được phân giải bên ngoài nó."
  zh: "DNS 未经过隧道 — 你查询的域名正在隧道外解析。"
  zh-HK: "DNS 未經過隧道 — 你查詢的網域正在隧道外解析。"
