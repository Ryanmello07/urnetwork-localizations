  el: "Καταδίκες που συγκρατήθηκαν επειδή σιωπούσε η ανερχόμενη ζεύξη αυτού του υπολογιστή, όχι ο πάροχος (ανερχόμενη ζεύξη / μεταφορά)"
  en: "Convictions withheld because this machine's own uplink, not the provider, was silent (uplink / transport)"
  es: "Condenas retenidas porque el enlace ascendente de este equipo, y no el proveedor, estaba en silencio (enlace ascendente / transporte)"
  es-419: "Condenas retenidas porque el enlace ascendente de este equipo, y no el proveedor, estaba en silencio (enlace ascendente / transporte)"
  es-MX: "Condenas retenidas porque el enlace ascendente de este equipo, y no el proveedor, estaba en silencio (enlace ascendente / transporte)"
  fr: "Condamnations retenues parce que la liaison montante de cet ordinateur, et non le fournisseur, était silencieuse (liaison montante / transport)"
