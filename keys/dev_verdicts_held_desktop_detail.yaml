  ko: "제공자가 아니라 이 컴퓨터 자체의 업링크가 무응답이어서 보류된 판정(업링크 / 전송)"
  nl: "Veroordelingen die zijn tegengehouden omdat de eigen uplink van deze computer stil was, niet de provider (uplink / transport)"
