description: "Developer page: the explanation under the 'Verdicts held' measurement (desktop wording)."
source: "Convictions withheld because this machine's own uplink, not the provider, was silent (uplink / transport)"
platforms:
  - linux
localizations:
  ar: "إدانات عُلّقت لأن الوصلة الصاعدة لهذا الجهاز نفسه، وليس المزود، كانت صامتة (الوصلة الصاعدة / بروتوكول النقل)"
  cs: "Odsouzení zadržená, protože ztichl vlastní uplink tohoto počítače, ne poskytovatel (uplink / transport)"
