  vi: "Các kết luận lỗi bị giữ lại vì đường lên của chính máy tính này im lặng, không phải nhà cung cấp (đường lên / truyền tải)"
  zh: "因本机自身上行（而非提供商）静默而暂缓的定罪（上行 / 传输方式）"
  zh-HK: "因本機本身的上行（而非供應商）靜默而暫緩的判罪（上行 / 傳輸方式）"
