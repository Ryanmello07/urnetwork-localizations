  hi: "सज़ाएँ जो इसलिए रोकी गईं क्योंकि प्रदाता नहीं, बल्कि इस मशीन का अपना अपलिंक चुप था (अपलिंक / ट्रांसपोर्ट)"
  id: "Vonis yang ditahan karena uplink komputer ini sendiri, bukan penyedia, sedang diam (uplink / transport)"
