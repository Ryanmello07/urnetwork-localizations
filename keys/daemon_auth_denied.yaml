description: "Connect error: the device policy does not allow this account to connect."
source: "This device's policy does not allow this account to connect through URnetwork. An administrator can change that."
platforms:
  - linux
localizations:
  ar: "سياسة هذا الجهاز لا تسمح لهذا الحساب بالاتصال عبر URnetwork. يمكن للمسؤول تغيير ذلك."
  cs: "Zásady tohoto zařízení tomuto účtu nedovolují připojit se přes URnetwork. Správce to může změnit."
  de: "Die Richtlinie dieses Geräts erlaubt diesem Konto nicht, sich über URnetwork zu verbinden. Ein Administrator kann das ändern."
  el: "Η πολιτική αυτής της συσκευής δεν επιτρέπει σε αυτόν τον λογαριασμό να συνδεθεί μέσω URnetwork. Ένας διαχειριστής μπορεί να το αλλάξει."
  en: "This device's policy does not allow this account to connect through URnetwork. An administrator can change that."
  es: "La política de este dispositivo no permite que esta cuenta se conecte a través de URnetwork. Un administrador puede cambiarlo."
  es-419: "La política de este dispositivo no permite que esta cuenta se conecte a través de URnetwork. Un administrador puede cambiarlo."
  es-MX: "La política de este dispositivo no permite que esta cuenta se conecte a través de URnetwork. Un administrador puede cambiarlo."
  fr: "La politique de cet appareil n’autorise pas ce compte à se connecter via URnetwork. Un administrateur peut changer cela."
  he: "מדיניות המכשיר הזה לא מאפשרת לחשבון הזה להתחבר דרך URnetwork. מנהל מערכת יכול לשנות זאת."
  hi: "इस डिवाइस की नीति इस खाते को URnetwork के ज़रिए कनेक्ट करने की अनुमति नहीं देती। कोई व्यवस्थापक इसे बदल सकता है।"
  id: "Kebijakan perangkat ini tidak mengizinkan akun ini terhubung melalui URnetwork. Administrator dapat mengubahnya."
  it: "I criteri di questo dispositivo non consentono a questo account di connettersi tramite URnetwork. Un amministratore può cambiarli."
  ja: "このデバイスのポリシーでは、このアカウントは URnetwork 経由で接続できません。管理者が変更できます。"
  ko: "이 기기의 정책이 이 계정의 URnetwork 연결을 허용하지 않습니다. 관리자가 변경할 수 있습니다."
  nl: "Het beleid van dit apparaat staat dit account niet toe om via URnetwork te verbinden. Een beheerder kan dat wijzigen."
  pl: "Zasady tego urządzenia nie pozwalają temu kontu łączyć się przez URnetwork. Administrator może to zmienić."
  pt: "A política deste dispositivo não permite que esta conta conecte pela URnetwork. Um administrador pode mudar isso."
  pt-BR: "A política deste dispositivo não permite que esta conta conecte pela URnetwork. Um administrador pode mudar isso."
  pt-PT: "A política deste dispositivo não permite que esta conta ligue através da URnetwork. Um administrador pode alterar isso."
  ru: "Политика этого устройства не разрешает этой учётной записи подключаться через URnetwork. Администратор может это изменить."
  sv: "Den här enhetens policy tillåter inte att det här kontot ansluter via URnetwork. En administratör kan ändra det."
  sw: "Sera ya kifaa hiki hairuhusu akaunti hii kuunganisha kupitia URnetwork. Msimamizi anaweza kubadilisha hilo."
  th: "นโยบายของอุปกรณ์นี้ไม่อนุญาตให้บัญชีนี้เชื่อมต่อผ่าน URnetwork ผู้ดูแลระบบสามารถเปลี่ยนได้"
  uk: "Політика цього пристрою не дозволяє цьому обліковому запису підключатися через URnetwork. Адміністратор може це змінити."
  vi: "Chính sách của thiết bị này không cho phép tài khoản này kết nối qua URnetwork. Quản trị viên có thể thay đổi điều đó."
  zh: "此设备的策略不允许此账户通过 URnetwork 连接。管理员可以更改。"
  zh-HK: "此裝置的政策不允許此帳戶透過 URnetwork 連線。管理員可以更改。"
