description: "Developer page: the explanation under the 'Sticky site affinity' setting."
source: "A site's new connections stay on the exit its earlier ones already use, even past the flow cap, so a busy site keeps one egress IP"
platforms:
  - linux
localizations:
  ar: "تبقى الاتصالات الجديدة للموقع على المخرج الذي تستخدمه اتصالاته السابقة، حتى بعد تجاوز حد التدفقات، ليحتفظ الموقع المزدحم بعنوان IP واحد للخروج"
  cs: "Nová připojení webu zůstávají na výstupu, který už používají ta předchozí, i nad limit toků, takže vytížený web si ponechá jednu výstupní IP"
  de: "Neue Verbindungen einer Website bleiben auf dem Exit, den ihre früheren bereits nutzen, auch über das Flow-Limit hinaus, sodass eine stark genutzte Website eine Egress-IP behält"
  el: "Οι νέες συνδέσεις ενός ιστότοπου μένουν στην έξοδο που ήδη χρησιμοποιούν οι προηγούμενες, ακόμη και πάνω από το όριο ροών, ώστε ένας πολυσύχναστος ιστότοπος να κρατά μία IP εξόδου"
  en: "A site's new connections stay on the exit its earlier ones already use, even past the flow cap, so a busy site keeps one egress IP"
  es: "Las conexiones nuevas de un sitio se quedan en la salida que ya usan las anteriores, incluso por encima del límite de flujos, para que un sitio con mucho tráfico conserve una sola IP de salida"
  es-419: "Las conexiones nuevas de un sitio se quedan en la salida que ya usan las anteriores, incluso por encima del límite de flujos, para que un sitio con mucho tráfico conserve una sola IP de salida"
  es-MX: "Las conexiones nuevas de un sitio se quedan en la salida que ya usan las anteriores, incluso por encima del límite de flujos, para que un sitio con mucho tráfico conserve una sola IP de salida"
  fr: "Les nouvelles connexions d’un site restent sur la sortie que ses connexions précédentes utilisent déjà, même au-delà du plafond de flux, pour qu’un site chargé garde une seule IP de sortie"
  he: "חיבורים חדשים של אתר נשארים ביציאה שבה כבר משתמשים החיבורים הקודמים שלו, גם מעבר למכסת הזרימות, כך שאתר עמוס שומר על כתובת IP יוצאת אחת"
  hi: "किसी साइट के नए कनेक्शन उसी एग्ज़िट पर रहते हैं जिसे उसके पिछले कनेक्शन पहले से इस्तेमाल कर रहे हैं, फ़्लो सीमा से ऊपर भी, ताकि व्यस्त साइट का एक ही इग्रेस IP बना रहे"
  id: "Koneksi baru sebuah situs tetap di exit yang sudah dipakai koneksi sebelumnya, bahkan melewati batas aliran, agar situs yang sibuk tetap memakai satu IP egress"
  it: "Le nuove connessioni di un sito restano sull’uscita già usata dalle precedenti, anche oltre il limite di flussi, così un sito molto attivo mantiene un solo IP di uscita"
  ja: "サイトの新しい接続は、フロー上限を超えても、以前の接続が使っている出口にとどまります。これにより、混雑したサイトでも出口 IP がひとつに保たれます"
  ko: "사이트의 새 연결은 플로우 한도를 넘더라도 이전 연결이 이미 쓰는 출구에 머물러, 바쁜 사이트가 하나의 송신 IP를 유지합니다"
  nl: "Nieuwe verbindingen van een site blijven op de exit die de eerdere al gebruiken, zelfs boven de flowlimiet, zodat een drukke site één egress-IP houdt"
  pl: "Nowe połączenia witryny zostają na wyjściu, którego używają już wcześniejsze, nawet ponad limit przepływów, aby obciążona witryna zachowała jeden wyjściowy adres IP"
  pt: "As novas ligações de um site ficam na saída que as anteriores já usam, mesmo acima do limite de fluxos, para que um site movimentado mantenha um único IP de saída"
  pt-BR: "As novas conexões de um site ficam na saída que as anteriores já usam, mesmo acima do limite de fluxos, para que um site movimentado mantenha um único IP de saída"
  pt-PT: "As novas ligações de um site ficam na saída que as anteriores já usam, mesmo acima do limite de fluxos, para que um site movimentado mantenha um único IP de saída"
  ru: "Новые соединения сайта остаются на выходе, который уже используют его прежние соединения, даже сверх лимита потоков, чтобы загруженный сайт сохранял один исходящий IP"
  sv: "En webbplats nya anslutningar stannar på den utgång som de tidigare redan använder, även över flödestaket, så att en upptagen webbplats behåller en egress-IP"
  sw: "Miunganisho mipya ya tovuti hubaki kwenye njia ya kutoka ambayo miunganisho yake ya awali tayari inatumia, hata kupita kikomo cha mitiririko, ili tovuti yenye shughuli nyingi ibaki na IP moja ya kutokea"
  th: "การเชื่อมต่อใหม่ของเว็บไซต์จะอยู่บนทางออกที่การเชื่อมต่อก่อนหน้าใช้อยู่แล้ว แม้จะเกินเพดานโฟลว์ เพื่อให้เว็บไซต์ที่มีทราฟฟิกมากใช้ IP ขาออกเดียว"
  uk: "Нові з’єднання сайту залишаються на виході, який уже використовують попередні, навіть понад ліміт потоків, щоб завантажений сайт зберігав одну вихідну IP"
  vi: "Các kết nối mới của một trang web ở lại điểm thoát mà các kết nối trước đó đã dùng, kể cả khi vượt giới hạn luồng, để một trang bận giữ một IP ra ngoài"
  zh: "站点的新连接会留在其早先连接已使用的出口上，即使超过流上限也是如此，从而让繁忙的站点保持同一个出口 IP"
  zh-HK: "網站的新連線會留在其較早連線已使用的出口上，即使超過流上限亦然，讓繁忙的網站保持同一個出口 IP"
