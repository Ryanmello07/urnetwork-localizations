description: "General UI string."
source: "A seedphrase lets you recover your account if you lose access."
platforms:
  - apple
  - android
localizations:
  ar: "تتيح لك عبارة الاسترداد استعادة حسابك إذا فقدت إمكانية الوصول."
  cs: "Seed fráze vám umožní obnovit účet, pokud k němu ztratíte přístup."
  de: "Mit einer Seedphrase kannst du dein Konto wiederherstellen, wenn du den Zugriff verlierst."
  el: "Μια φράση ανάκτησης σάς επιτρέπει να ανακτήσετε τον λογαριασμό σας αν χάσετε την πρόσβαση."
  en: "A seedphrase lets you recover your account if you lose access."
  es: "Una frase semilla te permite recuperar tu cuenta si pierdes el acceso."
  es-419: "Una frase semilla te permite recuperar tu cuenta si pierdes el acceso."
  es-MX: "Una frase semilla te permite recuperar tu cuenta si pierdes el acceso."
  fr: "Une phrase de récupération vous permet de récupérer votre compte si vous perdez l’accès."
  he: "ביטוי סיד מאפשר לך לשחזר את החשבון שלך אם תאבד את הגישה אליו."
  hi: "अगर आपकी पहुंच खो जाती है, तो सीड फ़्रेज़ से आप अपना खाता वापस पा सकते हैं।"
  id: "Frasa pemulihan memungkinkan Anda memulihkan akun jika kehilangan akses."
  it: "Una frase seed ti permette di recuperare il tuo account se perdi l’accesso."
  ja: "シードフレーズがあれば、アクセスできなくなってもアカウントを復元できます。"
  ko: "시드 문구가 있으면 접근 권한을 잃어도 계정을 복구할 수 있습니다."
  nl: "Met een seedphrase kun je je account herstellen als je de toegang kwijtraakt."
  pl: "Fraza seed pozwala odzyskać konto, jeśli stracisz do niego dostęp."
  pt: "Uma frase-semente permite recuperar a sua conta se perder o acesso."
  pt-BR: "Uma frase-semente permite recuperar sua conta se você perder o acesso."
  pt-PT: "Uma frase-semente permite recuperar a sua conta se perder o acesso."
  ru: "Сид-фраза позволяет восстановить аккаунт, если вы потеряете доступ."
  sv: "Med en seedfras kan du återställa ditt konto om du förlorar åtkomsten."
  sw: "Kifungu cha seed hukuwezesha kurejesha akaunti yako ukipoteza ufikiaji."
  th: "วลีกู้คืนช่วยให้คุณกู้บัญชีคืนได้หากเข้าถึงไม่ได้"
  uk: "Сід-фраза дозволяє відновити ваш обліковий запис, якщо ви втратите доступ."
  vi: "Cụm từ khôi phục giúp bạn khôi phục tài khoản nếu mất quyền truy cập."
  zh: "如果你无法访问帐户，助记词可以帮你恢复。"
  zh-HK: "如果你無法存取帳戶，助記詞可以幫你復原。"
