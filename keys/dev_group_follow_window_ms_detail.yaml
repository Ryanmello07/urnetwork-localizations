description: "Developer page (Apple): the explanation under the 'Follow window' setting, with its unit."
source: "How long into a bench a site's new connections keep following their exit, in ms — early benches are usually false alarms; one that lasts is trending toward removal and stops collecting flows. Off scatters immediately"
platforms:
  - apple
localizations:
  ar: "المدة التي تستمر فيها الاتصالات الجديدة للموقع في متابعة مخرجها بعد بدء الحجر، بالمللي ثانية — عادةً ما يكون الحجر المبكر إنذارًا كاذبًا؛ أما الحجر الذي يطول فيتجه نحو الإزالة ويتوقف عن استقبال التدفقات. عند الإيقاف، تُوزَّع فورًا"
  cs: "Jak dlouho od začátku pobytu na lavičce nová připojení webu dál sledují svůj výstup, v ms — rané lavičky bývají plané poplachy; ta, která trvá, směřuje k odstranění a přestane přijímat toky. Vypnuto rozptýlí okamžitě"
  de: "Wie lange während einer Ersatzbankphase die neuen Verbindungen einer Website ihrem Exit weiter folgen, in ms — frühe Ersatzbankphasen sind meist Fehlalarme; eine, die anhält, läuft auf eine Entfernung hinaus und nimmt keine Flows mehr auf. Aus: verteilt sofort"
  el: "Για πόσο από την αρχή του πάγκου οι νέες συνδέσεις ενός ιστότοπου συνεχίζουν να ακολουθούν την έξοδό τους, σε ms — οι πρώιμοι πάγκοι είναι συνήθως ψευδείς συναγερμοί· ένας που διαρκεί οδεύει προς αφαίρεση και σταματά να δέχεται ροές. Η απενεργοποίηση διασκορπίζει αμέσως"
  en: "How long into a bench a site's new connections keep following their exit, in ms — early benches are usually false alarms; one that lasts is trending toward removal and stops collecting flows. Off scatters immediately"
  es: "Durante cuánto tiempo, ya en el banquillo, las conexiones nuevas de un sitio siguen a su salida, en ms — los banquillos tempranos suelen ser falsas alarmas; uno que se prolonga tiende a la eliminación y deja de recibir flujos. Si está desactivado, se dispersan de inmediato"
  es-419: "Durante cuánto tiempo, ya en la banca, las conexiones nuevas de un sitio siguen a su salida, en ms — las bancas tempranas suelen ser falsas alarmas; una que se prolonga tiende a la eliminación y deja de recibir flujos. Si está desactivado, se dispersan de inmediato"
  es-MX: "Durante cuánto tiempo, ya en la banca, las conexiones nuevas de un sitio siguen a su salida, en ms — las bancas tempranas suelen ser falsas alarmas; una que se prolonga tiende a la eliminación y deja de recibir flujos. Si está desactivado, se dispersan de inmediato"
  fr: "Combien de temps après une mise sur la touche les nouvelles connexions d’un site suivent encore leur sortie, en ms — les mises sur la touche précoces sont souvent de fausses alertes ; une qui dure tend vers le retrait et cesse de recevoir des flux. Désactivé disperse immédiatement"
  he: "כמה זמן מתחילת השהייה על הספסל החיבורים החדשים של אתר ממשיכים לעקוב אחר היציאה שלהם, במילישניות — שהיות מוקדמות על הספסל הן בדרך כלל אזעקות שווא; שהייה שנמשכת מתקדמת להסרה ומפסיקה לקבל זרימות. כיבוי מפזר מיד"
  hi: "बेंच की शुरुआत से कितनी देर तक किसी साइट के नए कनेक्शन अपने एग्ज़िट का पीछा करते रहते हैं, ms में — शुरुआती बेंच अक्सर झूठे अलार्म होते हैं; जो बेंच लंबी चलती है वह निष्कासन की ओर बढ़ती है और फ़्लो लेना बंद कर देती है। बंद करने पर तुरंत बिखराव होता है"
  id: "Berapa lama sejak awal masa cadangan koneksi baru sebuah situs terus mengikuti exit-nya, dalam ms — masa cadangan awal biasanya alarm palsu; yang berlangsung lama mengarah ke penghapusan dan berhenti menerima aliran. Nonaktif langsung menyebarkan"
  it: "Per quanto tempo dall’inizio della panchina le nuove connessioni di un sito continuano a seguire la loro uscita, in ms — le panchine iniziali sono di solito falsi allarmi; una che dura tende alla rimozione e smette di ricevere flussi. Disattivato disperde subito"
  ja: "待機が始まってから、サイトの新しい接続が出口に追従し続ける時間（ミリ秒）。初期の待機はたいてい誤検知ですが、長引く待機は除外に向かい、フローを受け付けなくなります。オフにするとすぐに分散させます"
  ko: "대기가 시작된 뒤 사이트의 새 연결이 출구를 계속 따라가는 시간(밀리초)입니다. 초기 대기는 대개 오경보이며, 오래 이어지는 대기는 제외로 향하고 플로우를 더 받지 않습니다. 끄면 바로 흩어지게 합니다"
  nl: "Hoe lang na het begin van een bankperiode nieuwe verbindingen van een site hun exit blijven volgen, in ms — vroege bankperiodes zijn meestal vals alarm; een die aanhoudt koerst af op verwijdering en krijgt geen flows meer. Uit verspreidt direct"
  pl: "Jak długo od początku ławki nowe połączenia witryny nadal podążają za swoim wyjściem, w ms — wczesne ławki to zwykle fałszywe alarmy; ta, która trwa, zmierza do usunięcia i przestaje przyjmować przepływy. Wyłączenie rozprasza od razu"
  pt: "Durante quanto tempo, já no banco, as novas ligações de um site continuam a seguir a sua saída, em ms — os bancos iniciais costumam ser falsos alarmes; um que se prolonga tende para a remoção e deixa de receber fluxos. Desativado dispersa de imediato"
  pt-BR: "Por quanto tempo, já no banco, as novas conexões de um site continuam seguindo sua saída, em ms — bancos iniciais costumam ser alarmes falsos; um que se prolonga tende à remoção e deixa de receber fluxos. Desativado dispersa imediatamente"
  pt-PT: "Durante quanto tempo, já no banco, as novas ligações de um site continuam a seguir a sua saída, em ms — os bancos iniciais costumam ser falsos alarmes; um que se prolonga tende para a remoção e deixa de receber fluxos. Desativado dispersa de imediato"
  ru: "Как долго после начала отстранения новые соединения сайта продолжают следовать за своим выходом, в мс — ранние отстранения обычно оказываются ложными тревогами; затянувшееся ведёт к удалению, и выход перестаёт принимать потоки. Если выключено, соединения сразу распределяются"
  sv: "Hur länge in i en avbänkning en webbplats nya anslutningar fortsätter att följa sin utgång, i ms — tidiga avbänkningar är oftast falsklarm; en som varar är på väg mot borttagning och slutar ta emot flöden. Av sprider direkt"
  sw: "Muda ambao miunganisho mipya ya tovuti huendelea kufuata njia yake ya kutoka tangu ianze kukaa benchi, kwa ms — benchi za mapema mara nyingi ni kengele za uongo; inayodumu huelekea kuondolewa na huacha kupokea mitiririko. Kuzima kunatawanya mara moja"
  th: "การเชื่อมต่อใหม่ของเว็บไซต์จะติดตามทางออกของตนต่อไปนานเท่าใดหลังเริ่มพัก (มิลลิวินาที) — การพักช่วงแรกมักเป็นสัญญาณเตือนผิดพลาด การพักที่ยืดเยื้อจะมุ่งสู่การลบและหยุดรับโฟลว์ ปิดเพื่อกระจายทันที"
  uk: "Як довго після початку перебування на лаві нові з’єднання сайту й далі йдуть за своїм виходом, у мс — ранні лави зазвичай хибні тривоги; та, що триває, веде до видалення й перестає приймати потоки. Вимкнення розсіює одразу"
  vi: "Trong bao lâu kể từ khi bắt đầu dự bị, các kết nối mới của một trang tiếp tục theo điểm thoát của chúng, tính bằng ms — dự bị sớm thường là báo động giả; dự bị kéo dài sẽ dẫn tới loại bỏ và ngừng nhận luồng. Tắt sẽ phân tán ngay"
  zh: "隔离开始后，站点的新连接继续跟随其出口的时长（毫秒）——早期隔离通常是误报；持续的隔离则趋向于移除，并停止接收新流。关闭时立即分散"
  zh-HK: "隔離開始後，網站的新連線繼續跟隨其出口的時長（毫秒）——早期隔離通常是誤報；持續的隔離則趨向移除，並停止接收新流。關閉時立即分散"
