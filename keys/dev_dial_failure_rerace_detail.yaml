description: "Developer tools screen: explanatory subtext under the 'dial failure rerace' control."
source: "When a provider can't reach a site, move the connection to another exit instead of letting it hang"
platforms:
  - android
  - linux
  - apple
localizations:
  ar: "عندما يتعذّر على المزود الوصول إلى موقع، يُنقل الاتصال إلى مخرج آخر بدلًا من تركه معلّقًا"
  cs: "Když poskytovatel nedosáhne na web, přesune připojení na jiný výstup, místo aby zůstalo viset"
  de: "Wenn ein Anbieter eine Website nicht erreicht, wird die Verbindung auf einen anderen Exit verlegt, statt sie hängen zu lassen"
  el: "Όταν ένας πάροχος δεν μπορεί να φτάσει σε έναν ιστότοπο, μετακινεί τη σύνδεση σε άλλη έξοδο αντί να την αφήνει να κρέμεται"
  en: "When a provider can't reach a site, move the connection to another exit instead of letting it hang"
  es: "Cuando un proveedor no puede llegar a un sitio, mueve la conexión a otra salida en lugar de dejarla colgada"
  es-419: "Cuando un proveedor no puede llegar a un sitio, mueve la conexión a otra salida en lugar de dejarla colgada"
  es-MX: "Cuando un proveedor no puede llegar a un sitio, mueve la conexión a otra salida en lugar de dejarla colgada"
  fr: "Quand un fournisseur ne peut pas joindre un site, déplace la connexion vers une autre sortie au lieu de la laisser en suspens"
  he: "כשספק לא מצליח להגיע לאתר, החיבור מועבר ליציאה אחרת במקום להישאר תלוי"
  hi: "जब कोई प्रदाता किसी साइट तक नहीं पहुँच पाता, तो कनेक्शन को लटकने देने के बजाय दूसरे एग्ज़िट पर ले जाएँ"
  id: "Saat penyedia tidak dapat menjangkau situs, pindahkan koneksi ke exit lain alih-alih membiarkannya menggantung"
  it: "Quando un provider non riesce a raggiungere un sito, sposta la connessione su un’altra uscita invece di lasciarla in sospeso"
  ja: "プロバイダーがサイトに到達できない場合、接続を放置せず別の出口に移します"
  ko: "제공자가 사이트에 연결하지 못하면 연결을 멈춰 두지 않고 다른 출구로 옮깁니다"
  nl: "Als een provider een site niet kan bereiken, wordt de verbinding naar een andere exit verplaatst in plaats van te blijven hangen"
  pl: "Gdy dostawca nie może dotrzeć do witryny, przenosi połączenie na inne wyjście, zamiast zostawiać je zawieszone"
  pt: "Quando um fornecedor não consegue chegar a um site, move a ligação para outra saída em vez de a deixar pendurada"
  pt-BR: "Quando um provedor não consegue alcançar um site, move a conexão para outra saída em vez de deixá-la travada"
  pt-PT: "Quando um fornecedor não consegue chegar a um site, move a ligação para outra saída em vez de a deixar pendurada"
  ru: "Когда провайдер не может достучаться до сайта, соединение переносится на другой выход, а не зависает"
  sv: "När en leverantör inte kan nå en webbplats flyttas anslutningen till en annan utgång i stället för att bli hängande"
  sw: "Mtoa huduma asipoweza kufikia tovuti, hamisha muunganisho kwenda njia nyingine ya kutoka badala ya kuuacha ukining'inia"
  th: "เมื่อผู้ให้บริการเข้าถึงเว็บไซต์ไม่ได้ ให้ย้ายการเชื่อมต่อไปยังทางออกอื่นแทนการปล่อยค้างไว้"
  uk: "Коли провайдер не може дістатися сайту, з’єднання переноситься на інший вихід, а не зависає"
  vi: "Khi nhà cung cấp không thể kết nối tới một trang web, chuyển kết nối sang điểm thoát khác thay vì để treo"
  zh: "当提供商无法访问某个站点时，将连接转移到其他出口，而不是让其挂起"
  zh-HK: "當供應商無法連上某個網站時，將連線轉移到其他出口，而不是讓它停在那裡"
