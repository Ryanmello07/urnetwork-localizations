description: "Out-of-balance notice (and the Upgrade screen when a blocked connect opened it), shown when the data is used up and almost nothing is held by open connections, so nothing meaningful will come back on its own. It follows the \"Free data refreshes in {time}.\" line, which says when the free refresh is."
source: "You're out of data until the free refresh or an upgrade."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "نفدت بياناتك حتى التجديد المجاني أو الترقية."
  cs: "Došla vám data až do bezplatného obnovení nebo přechodu na vyšší tarif."
  de: "Deine Daten sind bis zur kostenlosen Erneuerung oder einem Upgrade aufgebraucht."
  el: "Τα δεδομένα σας έχουν τελειώσει μέχρι τη δωρεάν ανανέωση ή μια αναβάθμιση."
