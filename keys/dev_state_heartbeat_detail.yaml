description: "Developer page: the explanation under the 'State heartbeat' setting."
source: "How often one line summarizing live state is written to the log for later forensics, in ms. Off silences it"
platforms:
  - linux
localizations:
  ar: "عدد مرات كتابة سطر يلخّص الحالة الحية في السجل لأغراض التحليل لاحقًا، بالمللي ثانية. عند الإيقاف، يتوقف"
  cs: "Jak často se do logu zapíše jeden řádek se shrnutím aktuálního stavu pro pozdější analýzu, v ms. Vypnuto ho ztiší"
  de: "Wie oft eine Zeile mit einer Zusammenfassung des aktuellen Zustands für spätere Analysen ins Log geschrieben wird, in ms. Aus: schaltet sie stumm"
  el: "Πόσο συχνά γράφεται στο αρχείο καταγραφής μία γραμμή που συνοψίζει την τρέχουσα κατάσταση για μεταγενέστερη ανάλυση, σε ms. Η απενεργοποίηση τη σιωπά"
  en: "How often one line summarizing live state is written to the log for later forensics, in ms. Off silences it"
  es: "Con qué frecuencia se escribe en el registro una línea que resume el estado actual para un análisis forense posterior, en ms. Si está desactivado, se silencia"
  es-419: "Con qué frecuencia se escribe en el registro una línea que resume el estado actual para un análisis forense posterior, en ms. Si está desactivado, se silencia"
  es-MX: "Con qué frecuencia se escribe en el registro una línea que resume el estado actual para un análisis forense posterior, en ms. Si está desactivado, se silencia"
  fr: "Fréquence à laquelle une ligne résumant l’état en direct est écrite dans le journal pour une analyse ultérieure, en ms. Désactivé la coupe"
  he: "באיזו תדירות נכתבת ללוג שורה אחת שמסכמת את המצב הנוכחי לצורך ניתוח מאוחר, במילישניות. כיבוי משתיק אותה"
  hi: "बाद की जाँच के लिए लाइव स्थिति का सार बताने वाली एक पंक्ति लॉग में कितनी बार लिखी जाती है, ms में। बंद करने पर यह बंद हो जाती है"
  id: "Seberapa sering satu baris ringkasan status terkini ditulis ke log untuk analisis nanti, dalam ms. Nonaktif membungkamnya"
  it: "Ogni quanto viene scritta nel log una riga che riassume lo stato attuale, per un’analisi successiva, in ms. Disattivato la silenzia"
  ja: "後で調査するために、現在の状態を要約した 1 行をログに書き込む間隔（ミリ秒）。オフにすると停止します"
  ko: "나중에 분석할 수 있도록 현재 상태를 요약한 한 줄을 로그에 기록하는 간격(밀리초)입니다. 끄면 기록하지 않습니다"
  nl: "Hoe vaak één regel met de huidige status naar de log wordt geschreven voor later onderzoek, in ms. Uit zet hem stil"
  pl: "Jak często do logu trafia jeden wiersz podsumowujący bieżący stan, do późniejszej analizy, w ms. Wyłączenie go wycisza"
  pt: "Com que frequência uma linha que resume o estado atual é escrita no log para análise posterior, em ms. Desativado silencia-a"
  pt-BR: "Com que frequência uma linha que resume o estado atual é gravada no log para análise posterior, em ms. Desativado a silencia"
  pt-PT: "Com que frequência uma linha que resume o estado atual é escrita no log para análise posterior, em ms. Desativado silencia-a"
  ru: "Как часто в лог записывается строка со сводкой текущего состояния для последующего анализа, в мс. Если выключено, запись отключается"
  sv: "Hur ofta en rad som sammanfattar aktuell status skrivs till loggen för senare analys, i ms. Av tystar den"
  sw: "Mara ngapi mstari mmoja unaofupisha hali ya sasa huandikwa kwenye kumbukumbu kwa uchunguzi wa baadaye, kwa ms. Kuzima kunaunyamazisha"
  th: "ความถี่ในการเขียนหนึ่งบรรทัดที่สรุปสถานะปัจจุบันลงล็อกเพื่อการวิเคราะห์ภายหลัง (มิลลิวินาที) ปิดเพื่อหยุดเขียน"
  uk: "Як часто в лог записується рядок із підсумком поточного стану для подальшого аналізу, у мс. Вимкнення приглушує його"
  vi: "Tần suất ghi vào nhật ký một dòng tóm tắt trạng thái hiện tại để phân tích sau này, tính bằng ms. Tắt sẽ ngừng ghi"
  zh: "将一行实时状态摘要写入日志以供事后排查的频率（毫秒）。关闭时不写入"
  zh-HK: "將一行即時狀態摘要寫入日誌以供事後排查的頻率（毫秒）。關閉時不寫入"
