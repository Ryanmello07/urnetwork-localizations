  de: "Deine Seedphrase brauchst du hier nie. Füge sie weder auf dieser Seite noch anderswo ein."
  en: "You never need your recovery phrase here. Don't paste it on this page or anywhere else."
  es: "Aquí nunca necesitas tu frase semilla. No la pegues en esta página ni en ningún otro sitio."
