description: "One-line explanation of the Auto provide mode in the onboarding Contribute bandwidth picker: public providing only while connected, same-network peers otherwise."
source: "Provides to everyone while you're connected, otherwise only to your own devices."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "يوفّر للجميع أثناء اتصالك، وإلا فلأجهزتك فقط."
  cs: "Poskytuje všem, když jste připojeni, jinak jen vašim vlastním zařízením."
  de: "Stellt allen bereit, während du verbunden bist, sonst nur deinen eigenen Geräten."
  el: "Παρέχει σε όλους όσο είστε συνδεδεμένοι, αλλιώς μόνο στις δικές σας συσκευές."
  en: "Provides to everyone while you're connected, otherwise only to your own devices."
  es: "Proporciona a todos mientras estás conectado; si no, solo a tus propios dispositivos."
  es-419: "Proporciona a todos mientras estás conectado; si no, solo a tus propios dispositivos."
  es-MX: "Proporciona a todos mientras estás conectado; si no, solo a tus propios dispositivos."
  fr: "Fournit à tout le monde pendant que vous êtes connecté, sinon uniquement à vos propres appareils."
  he: "מספק לכולם בזמן שאתם מחוברים, ואחרת רק למכשירים שלכם."
  hi: "जब आप कनेक्ट हों तब सभी को प्रदान करता है, वरना सिर्फ़ आपके अपने डिवाइस को।"
  id: "Menyediakan untuk semua orang saat Anda terhubung, selain itu hanya untuk perangkat Anda sendiri."
  it: "Fornisce a tutti mentre sei connesso, altrimenti solo ai tuoi dispositivi."
  ja: "接続中はすべての人に提供し、それ以外は自分のデバイスにのみ提供します。"
  ko: "연결되어 있는 동안 모두에게 제공하고, 그 외에는 내 기기에만 제공합니다."
  nl: "Levert aan iedereen terwijl je verbonden bent, anders alleen aan je eigen apparaten."
  pl: "Udostępnia wszystkim, gdy masz połączenie, a w przeciwnym razie tylko twoim urządzeniom."
  pt: "Fornece a todos enquanto está ligado; caso contrário, apenas aos seus próprios dispositivos."
  pt-BR: "Fornece para todos enquanto você está conectado; caso contrário, só para os seus próprios dispositivos."
  pt-PT: "Fornece a todos enquanto está ligado; caso contrário, apenas aos seus próprios dispositivos."
  ru: "Предоставляет доступ всем, пока вы подключены, а в остальное время — только вашим устройствам."
  sv: "Tillhandahåller åt alla medan du är ansluten, annars bara åt dina egna enheter."
  sw: "Hutoa huduma kwa kila mtu ukiwa umeunganishwa, vinginevyo kwa vifaa vyako tu."
  th: "ให้บริการแก่ทุกคนขณะที่คุณเชื่อมต่ออยู่ นอกนั้นให้บริการเฉพาะอุปกรณ์ของคุณเอง"
  uk: "Надає доступ усім, поки ви підключені, інакше — лише вашим власним пристроям."
  vi: "Cung cấp cho mọi người khi bạn đang kết nối, còn lại chỉ cho thiết bị của chính bạn."
  zh: "连接期间向所有人提供，否则仅向您自己的设备提供。"
  zh-HK: "連接期間向所有人提供，否則只向你自己的裝置提供。"
