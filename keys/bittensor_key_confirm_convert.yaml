description: "Key screen, the confirmation before the key leaves the app, where the user enters two of its words. "
source: "This app also can't convert your SN25α to TAO after this. A Bittensor wallet or btcli can, with this recovery phrase."
platforms:
  - apple
localizations:
  ar: "بعد ذلك، لن يتمكن هذا التطبيق أيضًا من تحويل SN25α الخاص بك إلى TAO. يمكن لمحفظة Bittensor أو btcli فعل ذلك باستخدام عبارة النسخ الاحتياطي هذه."
  cs: "Tato aplikace potom také nedokáže převést vaše SN25α na TAO. Peněženka Bittensor nebo btcli to dokáže s touto obnovovací frází."
  de: "Diese App kann dein SN25α danach auch nicht mehr in TAO umwandeln. Eine Bittensor-Wallet oder btcli kann das, mit dieser Wiederherstellungsphrase."
  el: "Μετά από αυτό, αυτή η εφαρμογή δεν θα μπορεί επίσης να μετατρέψει τα SN25α σας σε TAO. Ένα πορτοφόλι Bittensor ή το btcli μπορεί, με αυτή τη φράση επαναφοράς."
  en: "This app also can't convert your SN25α to TAO after this. A Bittensor wallet or btcli can, with this recovery phrase."
  es: "Después de esto, esta aplicación tampoco podrá convertir tu SN25α a TAO. Una billetera de Bittensor o btcli sí pueden, con esta frase de recuperación."
  es-419: "Después de esto, esta aplicación tampoco podrá convertir tu SN25α a TAO. Una billetera de Bittensor o btcli sí pueden, con esta frase de recuperación."
  es-MX: "Después de esto, esta aplicación tampoco podrá convertir tu SN25α a TAO. Una cartera de Bittensor o btcli sí pueden, con esta frase de recuperación."
  fr: "Après cela, cette application ne pourra pas non plus convertir vos SN25α en TAO. Un portefeuille Bittensor ou btcli le peut, avec cette phrase de sauvegarde."
  he: "אחרי זה, גם האפליקציה הזו לא תוכל להמיר את ה-SN25α שלכם ל-TAO. ארנק Bittensor או btcli יכולים לעשות זאת, עם ביטוי השחזור הזה."
  hi: "इसके बाद यह ऐप भी आपके SN25α को TAO में नहीं बदल सकेगा। कोई Bittensor वॉलेट या btcli इस रिकवरी फ़्रेज़ से ऐसा कर सकता है।"
  id: "Setelah ini, aplikasi ini juga tidak dapat mengonversi SN25α Anda ke TAO. Dompet Bittensor atau btcli dapat melakukannya, dengan frasa cadangan ini."
  it: "Dopo questa operazione, questa app non potrà nemmeno convertire i tuoi SN25α in TAO. Un portafoglio Bittensor o btcli può farlo, con questa frase di recupero."
  ja: "この操作の後は、このアプリで SN25α を TAO に変換することもできなくなります。Bittensor ウォレットまたは btcli なら、この復元フレーズを使って変換できます。"
  ko: "이후에는 이 앱에서 SN25α를 TAO로 전환할 수도 없습니다. Bittensor 지갑이나 btcli에서는 이 복구 문구로 전환할 수 있습니다."
  nl: "Hierna kan deze app je SN25α ook niet meer omzetten naar TAO. Een Bittensor-wallet of btcli kan dat wel, met deze herstelzin."
  pl: "Po tym ta aplikacja nie będzie też mogła zamienić twoich SN25α na TAO. Może to zrobić portfel Bittensor lub btcli, z użyciem tej frazy odzyskiwania."
  pt: "Depois disto, esta app também não consegue converter o seu SN25α em TAO. Uma carteira Bittensor ou o btcli conseguem, com esta frase de recuperação."
  pt-BR: "Depois disso, este app também não consegue converter seu SN25α em TAO. Uma carteira Bittensor ou o btcli conseguem, com esta frase de recuperação."
  pt-PT: "Depois disto, esta app também não consegue converter o seu SN25α em TAO. Uma carteira Bittensor ou o btcli conseguem, com esta frase de recuperação."
  ru: "После этого приложение также не сможет конвертировать ваши SN25α в TAO. Это можно сделать в кошельке Bittensor или в btcli с помощью этой фразы восстановления."
  sv: "Efter detta kan den här appen inte heller konvertera dina SN25α till TAO. En Bittensor-plånbok eller btcli kan göra det, med den här återställningsfrasen."
  sw: "Baada ya hili, programu hii pia haiwezi kubadilisha SN25α yako kuwa TAO. Pochi ya Bittensor au btcli inaweza, kwa kutumia kifungu hiki cha urejeshaji."
  th: "หลังจากนี้ แอปนี้จะแปลง SN25α ของคุณเป็น TAO ไม่ได้เช่นกัน กระเป๋าเงิน Bittensor หรือ btcli ทำได้ โดยใช้วลีสำรองนี้"
  uk: "Після цього застосунок також не зможе конвертувати ваші SN25α у TAO. Це можна зробити в гаманці Bittensor або в btcli за допомогою цієї фрази відновлення."
  vi: "Sau bước này, ứng dụng này cũng không thể chuyển đổi SN25α của bạn sang TAO. Ví Bittensor hoặc btcli có thể làm việc đó, với cụm từ sao lưu này."
  zh: "此后，此应用也无法将您的 SN25α 转换为 TAO。Bittensor 钱包或 btcli 可以使用此恢复短语进行转换。"
  zh-HK: "此後，此應用程式亦無法將你的 SN25α 轉換為 TAO。Bittensor 錢包或 btcli 可使用此復原短語進行轉換。"
