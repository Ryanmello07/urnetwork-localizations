description: "Protocol leaderboard (Leaderboard > Protocol): own-status card, added to the claim prompt when the network is within 20% of the Top 200 line. The rankings are recomputed once per tempo (about every 72 minutes)."
source: "You're close to the line, and rankings change every tempo."
platforms:
  - apple
  - android
  - windows
  - site
localizations:
