  cs: "Jste blízko hranice a pořadí se mění v každém tempu."
  de: "Du bist nah an der Linie, und die Rangliste ändert sich in jedem Tempo."
  el: "Είστε κοντά στο όριο και η κατάταξη αλλάζει σε κάθε tempo."
  en: "You're close to the line, and rankings change every tempo."
