  fr: "Vous êtes proche de la ligne, et le classement change à chaque tempo."
  he: "אתם קרובים לקו, והדירוג משתנה בכל tempo."
  hi: "आप सीमा के करीब हैं, और रैंकिंग हर tempo में बदलती है।"
  id: "Anda dekat dengan batas, dan peringkat berubah setiap tempo."
