description: "ur.io Manage subscription: the past-due notice under its title. Stripe retries the failed renewal for about two weeks, then cancels the subscription. The notice's two actions are \"Update payment method\" and \"Pay invoice\" (the failing invoice, paid with another card). Keep UR Pro and Pro (the plan's name) unchanged."
source: "We couldn't renew UR Pro with your payment method. Update your payment method, or pay the invoice with another card, to keep Pro."
platforms:
  - site
localizations:
  ar: "تعذّر علينا تجديد UR Pro باستخدام طريقة الدفع الخاصة بك. حدّث طريقة الدفع، أو ادفع الفاتورة ببطاقة أخرى، للاحتفاظ بـ Pro."
  cs: "UR Pro se nám s vaším způsobem platby nepodařilo obnovit. Aktualizujte způsob platby nebo zaplaťte fakturu jinou kartou, abyste si Pro ponechali."
  de: "Wir konnten UR Pro mit deiner Zahlungsmethode nicht verlängern. Aktualisiere deine Zahlungsmethode oder bezahle die Rechnung mit einer anderen Karte, um Pro zu behalten."
  el: "Δεν μπορέσαμε να ανανεώσουμε το UR Pro με τον τρόπο πληρωμής σας. Ενημερώστε τον τρόπο πληρωμής σας ή πληρώστε το τιμολόγιο με άλλη κάρτα για να διατηρήσετε το Pro."
  en: "We couldn't renew UR Pro with your payment method. Update your payment method, or pay the invoice with another card, to keep Pro."
  es: "No hemos podido renovar UR Pro con tu método de pago. Actualiza tu método de pago o paga la factura con otra tarjeta para mantener Pro."
  es-419: "No pudimos renovar UR Pro con tu método de pago. Actualiza tu método de pago o paga la factura con otra tarjeta para conservar Pro."
  es-MX: "No pudimos renovar UR Pro con tu método de pago. Actualiza tu método de pago o paga la factura con otra tarjeta para conservar Pro."
  fr: "Nous n’avons pas pu renouveler UR Pro avec votre moyen de paiement. Mettez à jour votre moyen de paiement, ou payez la facture avec une autre carte, pour conserver Pro."
  he: "לא הצלחנו לחדש את UR Pro באמצעי התשלום הנוכחי. עדכנו את אמצעי התשלום, או שלמו את החשבונית בכרטיס אחר, כדי לשמור על Pro."
  hi: "हम आपके भुगतान के तरीके से UR Pro का नवीनीकरण नहीं कर सके। Pro बनाए रखने के लिए अपना भुगतान का तरीका अपडेट करें, या किसी दूसरे कार्ड से इनवॉइस का भुगतान करें।"
  id: "Kami tidak dapat memperpanjang UR Pro dengan metode pembayaran Anda. Perbarui metode pembayaran Anda, atau bayar tagihan dengan kartu lain, agar tetap menggunakan Pro."
  it: "Non siamo riusciti a rinnovare UR Pro con il tuo metodo di pagamento. Aggiorna il metodo di pagamento, oppure paga la fattura con un’altra carta, per mantenere Pro."
  ja: "ご登録のお支払い方法で UR Pro を更新できませんでした。Pro を継続するには、お支払い方法を更新するか、別のカードで請求書をお支払いください。"
  ko: "등록된 결제 수단으로 UR Pro를 갱신하지 못했습니다. Pro를 계속 이용하려면 결제 수단을 업데이트하거나 다른 카드로 청구서를 결제하세요."
  nl: "We konden UR Pro niet verlengen met je betaalmethode. Werk je betaalmethode bij, of betaal de factuur met een andere kaart, om Pro te houden."
  pl: "Nie udało nam się odnowić UR Pro przy użyciu Twojej metody płatności. Zaktualizuj metodę płatności lub opłać fakturę inną kartą, aby zachować Pro."
  pt: "Não foi possível renovar o UR Pro com o seu método de pagamento. Atualize o seu método de pagamento, ou pague a fatura com outro cartão, para manter o Pro."
  pt-BR: "Não conseguimos renovar o UR Pro com sua forma de pagamento. Atualize sua forma de pagamento ou pague a fatura com outro cartão para continuar com o Pro."
  pt-PT: "Não foi possível renovar o UR Pro com o seu método de pagamento. Atualize o seu método de pagamento, ou pague a fatura com outro cartão, para manter o Pro."
  ru: "Нам не удалось продлить UR Pro с помощью вашего способа оплаты. Обновите способ оплаты или оплатите счёт другой картой, чтобы сохранить Pro."
  sv: "Vi kunde inte förnya UR Pro med din betalningsmetod. Uppdatera din betalningsmetod, eller betala fakturan med ett annat kort, för att behålla Pro."
  sw: "Hatukuweza kusasisha UR Pro kwa njia yako ya malipo. Sasisha njia yako ya malipo, au lipa ankara kwa kadi nyingine, ili kuendelea na Pro."
  th: "เราไม่สามารถต่ออายุ UR Pro ด้วยวิธีการชำระเงินของคุณได้ อัปเดตวิธีการชำระเงิน หรือชำระใบแจ้งหนี้ด้วยบัตรอื่น เพื่อใช้ Pro ต่อ"
  uk: "Нам не вдалося продовжити UR Pro за допомогою вашого способу оплати. Оновіть спосіб оплати або оплатіть рахунок іншою карткою, щоб зберегти Pro."
  vi: "Chúng tôi không thể gia hạn UR Pro bằng phương thức thanh toán của bạn. Hãy cập nhật phương thức thanh toán, hoặc thanh toán hóa đơn bằng thẻ khác, để giữ Pro."
  zh: "我们无法使用您的支付方式续订 UR Pro。请更新支付方式，或使用其他卡支付账单，以保留 Pro。"
  zh-HK: "我們未能使用你的付款方式續訂 UR Pro。請更新付款方式，或使用另一張卡繳付帳單，以保留 Pro。"
