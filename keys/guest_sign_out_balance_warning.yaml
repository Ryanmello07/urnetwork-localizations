description: "Guest sign-out confirmation (desktop), shown for every create-account and purchase action on a legacy guest network. Must say plainly that the guest balance is not carried over and that the guest network cannot be signed back into, since it has no login."
source: "To create an account, sign out of this guest network first. Its balance stays on the guest network and does not move to your new account. A guest network has no login, so you can't sign back in to it after signing out."
platforms:
  - linux
  - windows
deprecated:
  - linux
  - windows
localizations:
  ar: "لإنشاء حساب، سجّل الخروج من شبكة الضيف هذه أولًا. يبقى رصيدها في شبكة الضيف ولا يُنقل إلى حسابك الجديد. لا تملك شبكة الضيف وسيلة لتسجيل الدخول، لذا لن تتمكن من العودة إليها بعد تسجيل الخروج."
  de: "Um ein Konto zu erstellen, melde dich zuerst von diesem Gastnetzwerk ab. Sein Guthaben bleibt im Gastnetzwerk und wird nicht auf dein neues Konto übertragen. Ein Gastnetzwerk hat keine Anmeldedaten, daher kannst du dich nach dem Abmelden nicht wieder dort anmelden."
  en: "To create an account, sign out of this guest network first. Its balance stays on the guest network and does not move to your new account. A guest network has no login, so you can't sign back in to it after signing out."
  es: "Para crear una cuenta, primero cierra la sesión de esta red de invitado. Su saldo se queda en la red de invitado y no pasa a tu nueva cuenta. Una red de invitado no tiene inicio de sesión, así que no podrás volver a entrar en ella después de cerrar la sesión."
  ru: "Чтобы создать аккаунт, сначала выйдите из этой гостевой сети. Её баланс останется в гостевой сети и не перейдёт в новый аккаунт. У гостевой сети нет данных для входа, поэтому после выхода вернуться в неё будет нельзя."
  zh: "要创建账户，请先退出此访客网络。其余额会保留在访客网络中，不会转入您的新账户。访客网络没有登录方式，退出后您将无法再次登录该网络。"
