description: "Guidance for someone who has no code yet. Deliberately PLAIN TEXT with no link and no button: app store rules forbid steering a user to an external purchase, but nothing stops us saying where codes come from. Without this, the sheet asks for a code and gives no way to obtain one."
source: "Don't have a code? Data codes can be purchased at ur.io and emailed to you."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "ليس لديك رمز؟ يمكن شراء رموز البيانات من ur.io وإرسالها إلى بريدك الإلكتروني."
  cs: "Nemáte kód? Datové kódy si můžete koupit na ur.io a přijdou vám e-mailem."
  de: "Noch keinen Code? Datencodes kannst du auf ur.io kaufen und dir per E-Mail schicken lassen."
  el: "Δεν έχετε κωδικό; Οι κωδικοί δεδομένων αγοράζονται στο ur.io και αποστέλλονται με email."
  en: "Don't have a code? Data codes can be purchased at ur.io and emailed to you."
  es: "¿No tienes un código? Puedes comprar códigos de datos en ur.io y te llegarán por correo electrónico."
  es-419: "¿No tienes un código? Puedes comprar códigos de datos en ur.io y te llegarán por correo electrónico."
  es-MX: "¿No tienes un código? Puedes comprar códigos de datos en ur.io y te llegarán por correo electrónico."
  fr: "Pas de code ? Les codes de données s'achètent sur ur.io et vous sont envoyés par e-mail."
  he: "אין לך קוד? אפשר לרכוש קודי נתונים ב-ur.io ולקבל אותם במייל."
  hi: "कोड नहीं है? डेटा कोड ur.io पर खरीदे जा सकते हैं और आपको ईमेल कर दिए जाते हैं।"
  id: "Belum punya kode? Kode data bisa dibeli di ur.io dan dikirim ke email Anda."
  it: "Non hai un codice? I codici dati si acquistano su ur.io e ti vengono inviati via email."
  ja: "コードをお持ちでない方は、ur.ioでデータコードを購入すると、メールで届きます。"
  ko: "코드가 없으신가요? 데이터 코드는 ur.io에서 구매할 수 있으며 이메일로 전송됩니다."
  nl: "Nog geen code? Datacodes koop je op ur.io en krijg je per e-mail toegestuurd."
  pl: "Nie masz kodu? Kody danych można kupić na ur.io i otrzymać e-mailem."
  pt: "Não tem um código? Pode comprar códigos de dados em ur.io e recebê-los por e-mail."
  pt-BR: "Não tem um código? Você pode comprar códigos de dados em ur.io e recebê-los por e-mail."
  pt-PT: "Não tem um código? Pode comprar códigos de dados em ur.io e recebê-los por e-mail."
  ru: "Нет кода? Коды данных можно купить на ur.io — их пришлют вам на почту."
  sv: "Har du ingen kod? Datakoder kan köpas på ur.io och skickas till din e-post."
  sw: "Huna msimbo? Misimbo ya data inaweza kununuliwa kwenye ur.io na kutumwa kwako kwa barua pepe."
  th: "ยังไม่มีโค้ด? ซื้อรหัสข้อมูลได้ที่ ur.io แล้วระบบจะส่งให้ทางอีเมล"
  uk: "Немає коду? Коди даних можна придбати на ur.io — їх надішлють вам на пошту."
  vi: "Chưa có mã? Bạn có thể mua mã dữ liệu tại ur.io và nhận qua email."
  zh: "没有余额码？可在 ur.io 购买，购买后会通过电子邮件发送给你。"
  zh-HK: "沒有餘額碼？可在 ur.io 購買，購買後會透過電郵發送給你。"
