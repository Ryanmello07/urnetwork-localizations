description: "Update channel (Windows): the stored choice of developer builds failed its checks, so it is ignored."
source: "The saved update channel is not trusted, so official releases are used. Switching to official releases removes it."
platforms:
  - windows
localizations:
  ar: "قناة التحديث المحفوظة غير موثوقة، لذا تُستخدم الإصدارات الرسمية. التبديل إلى الإصدارات الرسمية يزيلها."
  cs: "Uloženému kanálu aktualizací nelze důvěřovat, proto se používají oficiální vydání. Přepnutí na oficiální vydání ho odstraní."
  de: "Dem gespeicherten Update-Kanal wird nicht vertraut, deshalb werden offizielle Versionen verwendet. Ein Wechsel zu offiziellen Versionen entfernt ihn."
  el: "Το αποθηκευμένο κανάλι ενημερώσεων δεν είναι αξιόπιστο, γι’ αυτό χρησιμοποιούνται οι επίσημες εκδόσεις. Η μετάβαση στις επίσημες εκδόσεις το αφαιρεί."
  en: "The saved update channel is not trusted, so official releases are used. Switching to official releases removes it."
  es: "El canal de actualizaciones guardado no es de confianza, así que se usan las versiones oficiales. Cambiar a las versiones oficiales lo elimina."
  es-419: "El canal de actualizaciones guardado no es de confianza, así que se usan las versiones oficiales. Cambiar a las versiones oficiales lo elimina."
  es-MX: "El canal de actualizaciones guardado no es de confianza, así que se usan las versiones oficiales. Cambiar a las versiones oficiales lo elimina."
  fr: "Le canal de mise à jour enregistré n’est pas fiable, donc les versions officielles sont utilisées. Passer aux versions officielles le supprime."
  he: "ערוץ העדכונים השמור אינו מהימן, ולכן נעשה שימוש בגרסאות הרשמיות. מעבר לגרסאות הרשמיות מסיר אותו."
  hi: "सहेजा गया अपडेट चैनल भरोसेमंद नहीं है, इसलिए आधिकारिक रिलीज़ उपयोग की जाती हैं। आधिकारिक रिलीज़ पर स्विच करने से यह हट जाता है।"
  id: "Saluran pembaruan yang tersimpan tidak tepercaya, jadi rilis resmi yang digunakan. Beralih ke rilis resmi akan menghapusnya."
  it: "Il canale di aggiornamento salvato non è attendibile, quindi vengono usate le versioni ufficiali. Il passaggio alle versioni ufficiali lo rimuove."
  ja: "保存されているアップデートチャンネルは信頼できないため、公式リリースを使用します。公式リリースに切り替えると削除されます。"
  ko: "저장된 업데이트 채널을 신뢰할 수 없어 공식 릴리스를 사용합니다. 공식 릴리스로 전환하면 삭제됩니다."
  nl: "Het opgeslagen updatekanaal wordt niet vertrouwd, dus worden officiële releases gebruikt. Overschakelen naar officiële releases verwijdert het."
  pl: "Zapisany kanał aktualizacji nie jest zaufany, więc używane są oficjalne wydania. Przełączenie na oficjalne wydania go usuwa."
  pt: "O canal de atualização salvo não é confiável, então são usadas as versões oficiais. Mudar para as versões oficiais o remove."
  pt-BR: "O canal de atualização salvo não é confiável, então são usadas as versões oficiais. Mudar para as versões oficiais o remove."
  pt-PT: "O canal de atualização guardado não é fidedigno, pelo que são usadas as versões oficiais. Mudar para as versões oficiais remove-o."
  ru: "Сохранённому каналу обновлений нельзя доверять, поэтому используются официальные выпуски. Переход на официальные выпуски удалит его."
  sv: "Den sparade uppdateringskanalen är inte betrodd, så officiella versioner används. Om du byter till officiella versioner tas den bort."
  sw: "Chaneli ya masasisho iliyohifadhiwa haiaminiki, kwa hivyo matoleo rasmi yanatumika. Kubadilisha hadi matoleo rasmi kunaiondoa."
  th: "ช่องทางการอัปเดตที่บันทึกไว้เชื่อถือไม่ได้ จึงใช้รุ่นทางการ การเปลี่ยนไปใช้รุ่นทางการจะลบช่องทางนี้"
  uk: "Збереженому каналу оновлень не можна довіряти, тому використовуються офіційні випуски. Перехід на офіційні випуски видалить його."
  vi: "Kênh cập nhật đã lưu không đáng tin cậy, nên bản phát hành chính thức sẽ được dùng. Chuyển sang bản phát hành chính thức sẽ xóa kênh này."
  zh: "已保存的更新渠道不可信，因此将使用正式版本。切换到正式版本会将其移除。"
  zh-HK: "已儲存的更新頻道不可信，因此會使用正式版本。切換到正式版本會將其移除。"
