description: "macOS alert body under purchase_disconnect_notice_title. The app reconnects the VPN by itself after the purchase; \"it\" is the VPN. Until then the user's internet traffic does not go through the VPN."
source: "URnetwork reconnects it afterward. Until it does, your internet traffic won't go through the VPN."
platforms:
  - apple
localizations:
  ar: "سيعيد URnetwork الاتصال بها بعد ذلك. وحتى يحدث ذلك، لن تمر حركة الإنترنت لديك عبر VPN."
  cs: "URnetwork ji poté znovu připojí. Do té doby nebude váš internetový provoz procházet přes VPN."
  de: "URnetwork verbindet es danach wieder. Bis dahin läuft dein Internetverkehr nicht über das VPN."
  el: "Το URnetwork θα το επανασυνδέσει μετά. Μέχρι τότε, η κίνηση του διαδικτύου σας δεν θα περνά μέσα από το VPN."
  en: "URnetwork reconnects it afterward. Until it does, your internet traffic won't go through the VPN."
  es: "URnetwork la volverá a conectar después. Hasta entonces, tu tráfico de internet no pasará por la VPN."
  es-419: "URnetwork la volverá a conectar después. Hasta entonces, tu tráfico de internet no pasará por la VPN."
  es-MX: "URnetwork la volverá a conectar después. Hasta entonces, tu tráfico de internet no pasará por la VPN."
  fr: "URnetwork le reconnectera ensuite. D’ici là, votre trafic Internet ne passera pas par le VPN."
  he: "URnetwork יחבר אותו מחדש לאחר מכן. עד אז, תעבורת האינטרנט שלכם לא תעבור דרך ה-VPN."
  hi: "URnetwork इसके बाद इसे फिर से कनेक्ट कर देगा। तब तक आपका इंटरनेट ट्रैफ़िक VPN से होकर नहीं जाएगा।"
  id: "URnetwork akan menyambungkannya kembali setelah itu. Sampai saat itu, lalu lintas internet Anda tidak akan melewati VPN."
  it: "URnetwork la ricollegherà in seguito. Fino ad allora, il tuo traffico Internet non passerà attraverso la VPN."
  ja: "URnetworkはその後に再接続します。再接続されるまで、インターネット通信はVPNを経由しません。"
  ko: "URnetwork가 이후 다시 연결합니다. 그때까지 인터넷 트래픽은 VPN을 거치지 않습니다."
  nl: "URnetwork maakt daarna opnieuw verbinding. Tot die tijd gaat je internetverkeer niet via de VPN."
  pl: "URnetwork połączy go ponownie później. Do tego czasu Twój ruch internetowy nie będzie przechodził przez VPN."
  pt: "O URnetwork reconecta a VPN depois. Até lá, seu tráfego de internet não passará pela VPN."
  pt-BR: "O URnetwork reconecta a VPN depois. Até lá, seu tráfego de internet não passará pela VPN."
  pt-PT: "O URnetwork volta a ligar a VPN depois. Até lá, o seu tráfego de internet não passará pela VPN."
  ru: "После этого URnetwork подключит его снова. До этого момента ваш интернет-трафик не будет проходить через VPN."
  sv: "URnetwork ansluter den igen efteråt. Tills dess går din internettrafik inte via VPN."
  sw: "URnetwork itaiunganisha tena baadaye. Hadi wakati huo, trafiki yako ya intaneti haitapitia VPN."
  th: "URnetwork จะเชื่อมต่อใหม่ภายหลัง ระหว่างนี้ทราฟฟิกอินเทอร์เน็ตของคุณจะไม่ผ่าน VPN"
  uk: "Після цього URnetwork підключить його знову. До того часу ваш інтернет-трафік не проходитиме через VPN."
  vi: "URnetwork sẽ kết nối lại sau đó. Cho đến lúc đó, lưu lượng internet của bạn sẽ không đi qua VPN."
  zh: "URnetwork 稍后会重新连接。在此之前，你的互联网流量不会通过 VPN。"
  zh-HK: "URnetwork 稍後會重新連接。在此之前，你的互聯網流量不會通過 VPN。"
