description: "Network page, selected provider pane: note under the best available explanation, saying how to connect to a chosen location instead."
source: "Pick a country, region, city or device in the list to connect there instead."
platforms:
  - linux
localizations:
  ar: "اختر دولة أو منطقة أو مدينة أو جهازًا من القائمة للاتصال بها بدلًا من ذلك."
  cs: "Chcete-li se místo toho připojit jinam, vyberte v seznamu zemi, region, město nebo zařízení."
  de: "Wähle in der Liste ein Land, eine Region, eine Stadt oder ein Gerät, um dich stattdessen dorthin zu verbinden."
  el: "Επιλέξτε μια χώρα, περιοχή, πόλη ή συσκευή από τη λίστα για να συνδεθείτε εκεί."
  en: "Pick a country, region, city or device in the list to connect there instead."
  es: "Elige un país, una región, una ciudad o un dispositivo de la lista para conectarte allí."
  es-419: "Elige un país, una región, una ciudad o un dispositivo de la lista para conectarte allí."
  es-MX: "Elige un país, una región, una ciudad o un dispositivo de la lista para conectarte allí."
  fr: "Choisissez un pays, une région, une ville ou un appareil dans la liste pour vous y connecter à la place."
  he: "בחר מדינה, אזור, עיר או מכשיר ברשימה כדי להתחבר לשם במקום זאת."
  hi: "इसके बजाय वहाँ कनेक्ट करने के लिए सूची में कोई देश, क्षेत्र, शहर या डिवाइस चुनें।"
  id: "Pilih negara, wilayah, kota, atau perangkat di daftar untuk terhubung ke sana."
  it: "Scegli un paese, una regione, una città o un dispositivo nell'elenco per connetterti lì."
  ja: "代わりに特定の場所に接続するには、リストから国、地域、都市、またはデバイスを選択してください。"
  ko: "대신 특정 위치에 연결하려면 목록에서 국가, 지역, 도시 또는 기기를 선택하세요."
  nl: "Kies een land, regio, stad of apparaat in de lijst om daar verbinding mee te maken."
  pl: "Wybierz z listy kraj, region, miasto lub urządzenie, aby połączyć się tam."
  pt: "Escolha um país, região, cidade ou dispositivo na lista para se conectar a ele."
  pt-BR: "Escolha um país, região, cidade ou dispositivo na lista para se conectar a ele."
  pt-PT: "Escolha um país, região, cidade ou dispositivo na lista para se ligar a esse local."
  ru: "Чтобы подключиться в другом месте, выберите в списке страну, регион, город или устройство."
  sv: "Välj ett land, en region, en stad eller en enhet i listan för att ansluta dit i stället."
  sw: "Chagua nchi, mkoa, mji au kifaa kwenye orodha ili uunganishe huko badala yake."
  th: "เลือกประเทศ ภูมิภาค เมือง หรืออุปกรณ์ในรายการเพื่อเชื่อมต่อที่นั่นแทน"
  uk: "Щоб натомість підключитися в іншому місці, виберіть у списку країну, регіон, місто або пристрій."
  vi: "Chọn một quốc gia, khu vực, thành phố hoặc thiết bị trong danh sách để kết nối tới đó."
  zh: "如需改为连接到特定位置，请在列表中选择国家、地区、城市或设备。"
  zh-HK: "如需改為連接到特定位置，請在列表中選擇國家、地區、城市或裝置。"
