description: "Refer overlay"
source: "More connections help our community stay anonymous (and help you earn!)"
platforms:
  - android
  - apple
  - linux
localizations:
  ar: "المزيد من الاتصالات يساعد مجتمعنا على البقاء مجهول الهوية (ويساعدك على كسب المال!)"
  cs: "Více připojení pomáhá naší komunitě zůstat anonymní (a pomáhá vám vydělávat!)"
  de: "Mehr Verbindungen helfen unserer Community, anonym zu bleiben (und helfen dir, Geld zu verdienen!)"
  el: "Περισσότερες συνδέσεις βοηθούν την κοινότητά μας να παραμένει ανώνυμη (και σας βοηθούν να κερδίσετε χρήματα!)"
  en: "More connections help our community stay anonymous (and help you earn!)"
  es: "Más conexiones ayudan a nuestra comunidad a mantenerse anónima (¡y te ayudan a ganar dinero!)"
  es-419: "Más conexiones ayudan a nuestra comunidad a mantenerse anónima (¡y te ayudan a ganar dinero!)"
  es-MX: "Más conexiones ayudan a nuestra comunidad a mantenerse anónima (¡y te ayudan a ganar dinero!)"
  fr: "Plus de connexions aident notre communauté à rester anonyme (et vous aident à gagner de l'argent !)"
  he: "יותר חיבורים עוזרים לקהילה שלנו להישאר אנונימית (ועוזרים לך להרוויח!)"
  hi: "अधिक कनेक्शन हमारे समुदाय को गुमनाम रहने में मदद करते हैं (और आपको पैसे कमाने में मदद करते हैं!)"
  id: "Lebih banyak koneksi membantu komunitas kami tetap anonim (dan membantu Anda menghasilkan!)"
  it: "Più connessioni aiutano la nostra community a rimanere anonima (e aiutano te a guadagnare!)"
  ja: "より多くの接続はコミュニティの匿名性を保つのに役立ちます（そしてあなたの収益にも！）"
  ko: "더 많은 연결은 우리 커뮤니티가 익명성을 유지하는 데 도움이 됩니다 (그리고 당신의 수익에도 도움이 됩니다!)"
  nl: "Meer verbindingen helpen onze community anoniem te blijven (en helpen je verdienen!)"
  pl: "Więcej połączeń pomaga naszej społeczności zachować anonimowość (i pomaga ci zarabiać!)"
  pt: "Mais conexões ajudam nossa comunidade a permanecer anônima (e ajudam você a ganhar!)"
  pt-BR: "Mais conexões ajudam nossa comunidade a permanecer anônima (e ajudam você a ganhar!)"
  pt-PT: "Mais ligações ajudam a nossa comunidade a permanecer anónima (e ajudam-no a ganhar!)"
  ru: "Больше подключений помогает нашему сообществу оставаться анонимным (и помогает вам зарабатывать!)"
  sv: "Fler anslutningar hjälper vår community att förbli anonym (och hjälper dig att tjäna!)"
  sw: "Miunganisho zaidi husaidia jumuiya yetu kubaki bila majina (na kukusaidia kupata!)"
  th: "การเชื่อมต่อที่เยอะขึ้น จะช่วยขับเคลื่อนชุมชนของพวกเราให้มีความเป็นส่วนตัวมากขึ้น (และยังทำให้คุณมีรายได้ด้วย!)"
  uk: "Більше підключень допомагає нашій спільноті залишатися анонімною (і допомагає вам заробляти!)"
  vi: "Nhiều kết nối hơn giúp cộng đồng của chúng ta ẩn danh (và giúp bạn kiếm tiền!)"
  zh: "更多连接可以帮助我们的社区保持匿名（并帮助您赚钱！）"
  zh-HK: "更多連接有助我們的社區保持匿名（並幫助你賺取！）"
