description: "Windows split tunnel, App split rules sheet: the line at the top that says what including and excluding an app do."
source: "Including an app sends its traffic through the VPN, while excluding it keeps that app's traffic off the VPN."
platforms:
  - windows
localizations:
  ar: "تضمين تطبيق يرسل حركة مروره عبر VPN، بينما استثناؤه يُبقي حركة مرور ذلك التطبيق خارج VPN."
  cs: "Když aplikaci zahrnete, její provoz jde přes VPN; když ji vyloučíte, provoz této aplikace zůstane mimo VPN."
  de: "Wenn du eine App einschließt, läuft ihr Datenverkehr über das VPN; schließt du sie aus, bleibt der Datenverkehr dieser App außerhalb des VPN."
  el: "Η συμπερίληψη μιας εφαρμογής στέλνει την κίνησή της μέσω του VPN, ενώ η εξαίρεσή της κρατά την κίνηση αυτής της εφαρμογής εκτός VPN."
  en: "Including an app sends its traffic through the VPN, while excluding it keeps that app's traffic off the VPN."
  es: "Incluir una app envía su tráfico a través de la VPN, mientras que excluirla mantiene el tráfico de esa app fuera de la VPN."
  es-419: "Incluir una app envía su tráfico a través de la VPN, mientras que excluirla mantiene el tráfico de esa app fuera de la VPN."
  es-MX: "Incluir una app envía su tráfico a través de la VPN, mientras que excluirla mantiene el tráfico de esa app fuera de la VPN."
  fr: "Inclure une application fait passer son trafic par le VPN, tandis que l’exclure maintient le trafic de cette application hors du VPN."
  he: "הכללת אפליקציה שולחת את התעבורה שלה דרך ה-VPN, ואילו החרגתה משאירה את התעבורה של אותה אפליקציה מחוץ ל-VPN."
  hi: "किसी ऐप को शामिल करने पर उसका ट्रैफ़िक VPN से होकर जाता है, जबकि उसे बाहर रखने पर उस ऐप का ट्रैफ़िक VPN से बाहर रहता है।"
  id: "Menyertakan aplikasi akan mengirim lalu lintasnya melalui VPN, sedangkan mengecualikannya membuat lalu lintas aplikasi itu tetap di luar VPN."
  it: "Includere un’app ne fa passare il traffico attraverso la VPN, mentre escluderla tiene il traffico di quell’app fuori dalla VPN."
  ja: "アプリを含めるとそのトラフィックは VPN を経由し、除外するとそのアプリのトラフィックは VPN を経由しなくなります。"
  ko: "앱을 포함하면 해당 앱의 트래픽이 VPN을 거치고, 제외하면 그 앱의 트래픽은 VPN을 거치지 않습니다."
  nl: "Als je een app opneemt, gaat het verkeer ervan via de VPN; als je hem uitsluit, blijft het verkeer van die app buiten de VPN."
  pl: "Uwzględnienie aplikacji kieruje jej ruch przez VPN, a jej wykluczenie sprawia, że ruch tej aplikacji omija VPN."
  pt: "Incluir uma aplicação envia o tráfego dela pela VPN, enquanto excluí-la mantém o tráfego dessa aplicação fora da VPN."
  pt-BR: "Incluir um app envia o tráfego dele pela VPN, enquanto excluí-lo mantém o tráfego desse app fora da VPN."
  pt-PT: "Incluir uma aplicação envia o tráfego dela pela VPN, enquanto excluí-la mantém o tráfego dessa aplicação fora da VPN."
  ru: "Если включить приложение, его трафик пойдёт через VPN, а если исключить — трафик этого приложения будет идти в обход VPN."
  sv: "När du inkluderar en app går dess trafik genom VPN, och när du exkluderar den hålls appens trafik utanför VPN."
  sw: "Kujumuisha programu hupitisha trafiki yake kupitia VPN, huku kuitenga huiweka trafiki ya programu hiyo nje ya VPN."
  th: "การรวมแอปไว้จะส่งทราฟฟิกของแอปนั้นผ่าน VPN ส่วนการยกเว้นจะทำให้ทราฟฟิกของแอปนั้นไม่ผ่าน VPN"
  uk: "Якщо включити застосунок, його трафік іде через VPN, а якщо виключити — трафік цього застосунку йде в обхід VPN."
  vi: "Bao gồm một ứng dụng sẽ gửi lưu lượng của ứng dụng đó qua VPN, còn loại trừ sẽ giữ lưu lượng của ứng dụng đó ngoài VPN."
  zh: "包含某个应用会让它的流量经过 VPN，排除它则会让该应用的流量不经过 VPN。"
  zh-HK: "包含某個應用程式會讓它的流量經過 VPN，排除它則會讓該應用程式的流量不經過 VPN。"
