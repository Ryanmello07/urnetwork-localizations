  es-MX: "Error al autenticar el código. Por favor, inténtalo de nuevo o genera un nuevo código."
  fr: "Erreur lors de l’authentification du code. Veuillez réessayer ou générer un nouveau code."
  he: "שגיאה באימות הקוד. נסה שוב או צור קוד חדש."
  hi: "कोड प्रमाणित करने में त्रुटि। कृपया पुनः प्रयास करें या नया कोड जनरेट करें।"
  id: "Terjadi kesalahan saat mengautentikasi kode. Silakan coba lagi atau buat kode baru."
  it: "Errore durante l'autenticazione del codice. Riprova o genera un nuovo codice."
  ja: "コードの認証中にエラーが発生しました。もう一度お試しいただくか、新しいコードを生成してください。"
  ko: "코드 인증 오류입니다. 다시 시도하거나 새 코드를 생성하세요."
  nl: "Fout bij het verifiëren van de code. Probeer het opnieuw of genereer een nieuwe code."
  pl: "Błąd podczas uwierzytelniania kodu. Spróbuj ponownie lub wygeneruj nowy kod."
  pt: "Erro ao autenticar o código. Por favor, tente novamente ou gere um novo código."
  pt-BR: "Erro ao autenticar o código. Por favor, tente novamente ou gere um novo código."
  pt-PT: "Erro ao autenticar o código. Por favor, tente novamente ou gere um novo código."
  ru: "Ошибка при аутентификации кода. Пожалуйста, попробуйте снова или сгенерируйте новый код."
  sv: "Fel vid autentisering av koden. Försök igen eller generera en ny kod."
  sw: "Hitilafu katika kuthibitisha nambari. Tafadhali jaribu tena au tengeneza nambari mpya."
  th: "เกิดข้อผิดพลาดในการยืนยันรหัส กรุณาลองใหม่อีกครั้งหรือสร้างรหัสใหม่"
  uk: "Помилка автентифікації коду. Будь ласка, спробуйте ще раз або згенеруйте новий код."
  vi: "Lỗi xác thực mã. Vui lòng thử lại hoặc tạo mã mới."
