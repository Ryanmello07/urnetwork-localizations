description: "Guidance for someone who has no code yet. Deliberately PLAIN TEXT with no link and no button: app store rules forbid steering a user to an external purchase, but nothing stops us saying where codes come from. Without this, the sheet asks for a code and gives no way to obtain one."
source: "Error authenticating code. Please try again or generate a new code."
platforms:
  - android
  - linux
  - windows
localizations:
