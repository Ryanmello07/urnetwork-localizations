description: "Update channel (Windows): this PC's policy elevates only signed programs, and the updater is unsigned, so the channel cannot be changed from the app."
source: "Windows here runs only signed programs as administrator, and URnetwork's update helper is not signed, so the update channel cannot be changed from the app on this PC. Uninstalling URnetwork and installing an official release puts this PC on official releases."
platforms:
  - windows
localizations:
  ar: "لا يشغّل Windows هنا بصلاحيات المسؤول إلا البرامج الموقّعة، وأداة التحديث في URnetwork غير موقّعة، لذا لا يمكن تغيير قناة التحديث من التطبيق على هذا الكمبيوتر. إلغاء تثبيت URnetwork ثم تثبيت إصدار رسمي يعيد هذا الكمبيوتر إلى الإصدارات الرسمية."
  cs: "Windows zde jako správce spouští jen podepsané programy a pomocník aktualizací URnetwork podepsaný není, takže kanál aktualizací nelze na tomto počítači změnit z aplikace. Odinstalace URnetwork a instalace oficiálního vydání převede tento počítač na oficiální vydání."
  de: "Windows führt hier nur signierte Programme als Administrator aus, und das Update-Hilfsprogramm von URnetwork ist nicht signiert. Deshalb lässt sich der Update-Kanal auf diesem PC nicht in der App ändern. Wenn du URnetwork deinstallierst und eine offizielle Version installierst, erhält dieser PC wieder offizielle Versionen."
  el: "Εδώ τα Windows εκτελούν ως διαχειριστή μόνο υπογεγραμμένα προγράμματα, και το βοηθητικό πρόγραμμα ενημέρωσης του URnetwork δεν είναι υπογεγραμμένο, οπότε το κανάλι ενημερώσεων δεν μπορεί να αλλάξει από την εφαρμογή σε αυτόν τον υπολογιστή. Η απεγκατάσταση του URnetwork και η εγκατάσταση μιας επίσημης έκδοσης επαναφέρει αυτόν τον υπολογιστή στις επίσημες εκδόσεις."
  en: "Windows here runs only signed programs as administrator, and URnetwork's update helper is not signed, so the update channel cannot be changed from the app on this PC. Uninstalling URnetwork and installing an official release puts this PC on official releases."
  es: "Aquí Windows solo ejecuta como administrador programas firmados, y el asistente de actualización de URnetwork no está firmado, así que el canal de actualizaciones no se puede cambiar desde la app en este equipo. Si desinstalas URnetwork e instalas una versión oficial, este equipo vuelve a las versiones oficiales."
  es-419: "Aquí Windows solo ejecuta como administrador programas firmados, y el asistente de actualización de URnetwork no está firmado, así que el canal de actualizaciones no se puede cambiar desde la app en este equipo. Si desinstalas URnetwork e instalas una versión oficial, este equipo vuelve a las versiones oficiales."
  es-MX: "Aquí Windows solo ejecuta como administrador programas firmados, y el asistente de actualización de URnetwork no está firmado, así que el canal de actualizaciones no se puede cambiar desde la app en este equipo. Si desinstalas URnetwork e instalas una versión oficial, este equipo vuelve a las versiones oficiales."
  fr: "Ici, Windows n’exécute en tant qu’administrateur que des programmes signés, et l’assistant de mise à jour de URnetwork n’est pas signé : le canal de mise à jour ne peut donc pas être modifié depuis l’application sur ce PC. Désinstaller URnetwork puis installer une version officielle remet ce PC sur les versions officielles."
  he: "כאן Windows מפעיל כמנהל רק תוכניות חתומות, ותוכנית העזר לעדכון של URnetwork אינה חתומה, ולכן אי אפשר לשנות את ערוץ העדכונים מהאפליקציה במחשב הזה. הסרת URnetwork והתקנת גרסה רשמית מחזירות את המחשב הזה לגרסאות הרשמיות."
  hi: "यहाँ Windows व्यवस्थापक के रूप में केवल हस्ताक्षरित प्रोग्राम चलाता है, और URnetwork का अपडेट हेल्पर हस्ताक्षरित नहीं है, इसलिए इस PC पर ऐप से अपडेट चैनल नहीं बदला जा सकता। URnetwork को अनइंस्टॉल करके कोई आधिकारिक रिलीज़ इंस्टॉल करने से यह PC आधिकारिक रिलीज़ पर आ जाता है।"
  id: "Di sini Windows hanya menjalankan program bertanda tangan sebagai administrator, dan pembantu pembaruan URnetwork tidak bertanda tangan, jadi saluran pembaruan tidak dapat diubah dari aplikasi di PC ini. Menghapus instalan URnetwork lalu memasang rilis resmi akan mengembalikan PC ini ke rilis resmi."
  it: "Qui Windows esegue come amministratore solo programmi firmati, e l’helper di aggiornamento di URnetwork non è firmato, quindi su questo PC il canale di aggiornamento non può essere cambiato dall’app. Disinstallando URnetwork e installando una versione ufficiale, questo PC torna alle versioni ufficiali."
  ja: "この Windows では管理者として実行できるのは署名済みのプログラムだけですが、URnetwork のアップデートヘルパーは署名されていないため、この PC ではアプリからアップデートチャンネルを変更できません。URnetwork をアンインストールして公式リリースをインストールすると、この PC は公式リリースに戻ります。"
  ko: "이 Windows는 서명된 프로그램만 관리자 권한으로 실행하는데 URnetwork의 업데이트 도우미는 서명되지 않았으므로, 이 PC에서는 앱에서 업데이트 채널을 변경할 수 없습니다. URnetwork를 제거하고 공식 릴리스를 설치하면 이 PC가 공식 릴리스로 돌아갑니다."
  nl: "Windows voert hier alleen ondertekende programma’s als beheerder uit, en het updatehulpprogramma van URnetwork is niet ondertekend, dus het updatekanaal kan op deze pc niet vanuit de app worden gewijzigd. Door URnetwork te verwijderen en een officiële release te installeren, krijgt deze pc weer officiële releases."
  pl: "Tutaj system Windows uruchamia jako administrator tylko podpisane programy, a pomocnik aktualizacji URnetwork nie jest podpisany, więc na tym komputerze nie można zmienić kanału aktualizacji z poziomu aplikacji. Odinstalowanie URnetwork i zainstalowanie oficjalnego wydania przywraca na tym komputerze oficjalne wydania."
  pt: "Aqui o Windows só executa como administrador programas assinados, e o auxiliar de atualização do URnetwork não está assinado, pelo que o canal de atualização não pode ser alterado a partir da app neste computador. Desinstalar o URnetwork e instalar uma versão oficial coloca este computador nas versões oficiais."
  pt-BR: "Aqui o Windows só executa como administrador programas assinados, e o auxiliar de atualização do URnetwork não é assinado, então o canal de atualização não pode ser alterado pelo app neste PC. Desinstalar o URnetwork e instalar uma versão oficial coloca este PC nas versões oficiais."
  pt-PT: "Aqui o Windows só executa como administrador programas assinados, e o auxiliar de atualização do URnetwork não está assinado, pelo que o canal de atualização não pode ser alterado a partir da app neste computador. Desinstalar o URnetwork e instalar uma versão oficial coloca este computador nas versões oficiais."
  ru: "Здесь Windows запускает от имени администратора только подписанные программы, а помощник обновления URnetwork не подписан, поэтому на этом компьютере канал обновлений нельзя изменить из приложения. Если удалить URnetwork и установить официальный выпуск, этот компьютер снова будет получать официальные выпуски."
  sv: "Här kör Windows bara signerade program som administratör, och uppdateringshjälpen för URnetwork är inte signerad, så uppdateringskanalen kan inte ändras från appen på den här datorn. Om du avinstallerar URnetwork och installerar en officiell version får den här datorn officiella versioner igen."
  sw: "Hapa Windows huendesha kama msimamizi programu zilizosainiwa pekee, na kisaidizi cha masasisho cha URnetwork hakijasainiwa, kwa hivyo chaneli ya masasisho haiwezi kubadilishwa kutoka kwenye programu kwenye kompyuta hii. Kuondoa URnetwork na kusakinisha toleo rasmi kunairudisha kompyuta hii kwenye matoleo rasmi."
  th: "ที่นี่ Windows จะเรียกใช้ในฐานะผู้ดูแลระบบได้เฉพาะโปรแกรมที่มีการลงนาม และตัวช่วยอัปเดตของ URnetwork ไม่ได้ลงนาม จึงเปลี่ยนช่องทางการอัปเดตจากแอปบนพีซีเครื่องนี้ไม่ได้ การถอนการติดตั้ง URnetwork แล้วติดตั้งรุ่นทางการจะทำให้พีซีเครื่องนี้กลับไปใช้รุ่นทางการ"
  uk: "Тут Windows запускає від імені адміністратора лише підписані програми, а помічник оновлення URnetwork не підписаний, тому на цьому комп’ютері канал оновлень не можна змінити із застосунку. Якщо видалити URnetwork і встановити офіційний випуск, цей комп’ютер знову отримуватиме офіційні випуски."
  vi: "Tại đây, Windows chỉ chạy với quyền quản trị viên các chương trình đã được ký, mà trình hỗ trợ cập nhật của URnetwork chưa được ký, nên không thể đổi kênh cập nhật từ ứng dụng trên máy tính này. Gỡ cài đặt URnetwork rồi cài một bản phát hành chính thức sẽ đưa máy tính này về bản phát hành chính thức."
  zh: "此处的 Windows 只以管理员身份运行已签名的程序，而 URnetwork 的更新助手未签名，因此无法在这台电脑上通过应用更改更新渠道。卸载 URnetwork 并安装正式版本，即可让这台电脑改用正式版本。"
  zh-HK: "此處的 Windows 只以管理員身分執行已簽署的程式，而 URnetwork 的更新輔助程式未有簽署，因此無法在這部電腦上透過應用程式更改更新頻道。解除安裝 URnetwork 並安裝正式版本，即可讓這部電腦改用正式版本。"
