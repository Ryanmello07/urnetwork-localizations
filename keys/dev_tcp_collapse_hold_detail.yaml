description: "Developer tools screen: explanatory subtext under the 'tcp collapse hold' control."
source: "How long retransmits are held before one is released. Off waits 30s"
platforms:
  - android
localizations:
  ar: "المدة التي تُحتجز فيها عمليات إعادة الإرسال قبل تحرير إحداها. عند الإيقاف، ينتظر 30 ثانية"
  cs: "Jak dlouho se opakovaná odeslání zadržují, než se jedno uvolní. Vypnuto čeká 30 s"
  de: "Wie lange Neuübertragungen zurückgehalten werden, bevor eine freigegeben wird. Aus: wartet 30 s"
  el: "Για πόσο συγκρατούνται οι αναμεταδόσεις πριν αποδεσμευτεί μία. Η απενεργοποίηση περιμένει 30 δ"
  en: "How long retransmits are held before one is released. Off waits 30s"
  es: "Cuánto tiempo se retienen las retransmisiones antes de liberar una. Si está desactivado, espera 30 s"
  es-419: "Cuánto tiempo se retienen las retransmisiones antes de liberar una. Si está desactivado, espera 30 s"
  es-MX: "Cuánto tiempo se retienen las retransmisiones antes de liberar una. Si está desactivado, espera 30 s"
  fr: "Combien de temps les retransmissions sont retenues avant d’en libérer une. Désactivé attend 30 s"
  he: "כמה זמן שידורים חוזרים מעוכבים לפני שאחד מהם משוחרר. כיבוי ממתין 30 שניות"
  hi: "किसी एक को छोड़ने से पहले रीट्रांसमिट कितनी देर रोके जाते हैं। बंद करने पर 30 सेकंड इंतज़ार होता है"
  id: "Berapa lama transmisi ulang ditahan sebelum satu dilepaskan. Nonaktif menunggu 30 dtk"
  it: "Per quanto tempo le ritrasmissioni restano trattenute prima di rilasciarne una. Disattivato attende 30 s"
  ja: "再送を保留してから 1 つ解放するまでの時間。オフにすると 30 秒待ちます"
  ko: "재전송을 보류했다가 하나를 풀어 주기까지의 시간입니다. 끄면 30초를 기다립니다"
  nl: "Hoe lang hertransmissies worden vastgehouden voordat er één wordt vrijgegeven. Uit wacht 30 s"
  pl: "Jak długo retransmisje są wstrzymywane, zanim jedna zostanie zwolniona. Wyłączenie czeka 30 s"
  pt: "Durante quanto tempo as retransmissões ficam retidas antes de uma ser libertada. Desativado espera 30 s"
  pt-BR: "Por quanto tempo as retransmissões ficam retidas antes de uma ser liberada. Desativado espera 30 s"
  pt-PT: "Durante quanto tempo as retransmissões ficam retidas antes de uma ser libertada. Desativado espera 30 s"
  ru: "Как долго удерживаются повторные передачи, прежде чем одна будет отпущена. Если выключено, ожидание 30 с"
  sv: "Hur länge omsändningar hålls kvar innan en släpps. Av väntar 30 s"
  sw: "Muda ambao utumaji upya huzuiliwa kabla ya mmoja kuachiliwa. Kuzima kunasubiri sekunde 30"
  th: "การส่งซ้ำถูกระงับไว้นานเท่าใดก่อนปล่อยหนึ่งรายการ ปิดเพื่อรอ 30 วินาที"
  uk: "Як довго повторні передачі утримуються, перш ніж одну буде відпущено. Вимкнення чекає 30 с"
  vi: "Các gói truyền lại bị giữ bao lâu trước khi một gói được giải phóng. Tắt sẽ chờ 30 giây"
  zh: "重传在释放其中一个之前被保留的时长。关闭时等待 30 秒"
  zh-HK: "重傳在釋放其中一個之前被保留的時長。關閉時等待 30 秒"
