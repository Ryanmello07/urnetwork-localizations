description: "Re-engagement 'what changed' item. Sent only once a store release with the connection fixes has reached the reader's platform."
source: "Steadier connections. The new version of the app fixes many of the drops and reconnects people wrote to us about."
platforms:
  - email
localizations:
  en: "Steadier connections. The new version of the app fixes many of the drops and reconnects people wrote to us about."
  ar: "اتصالات أكثر ثباتاً. يُصلح الإصدار الجديد من التطبيق كثيراً من حالات الانقطاع وإعادة الاتصال التي كتب إلينا الناس عنها."
  cs: "Stabilnější připojení. Nová verze aplikace opravuje mnoho z výpadků a opětovných připojení, o kterých nám lidé psali."
  de: "Stabilere Verbindungen. Die neue Version der App behebt viele der Abbrüche und Neuverbindungen, von denen uns Leute geschrieben haben."
  el: "Πιο σταθερές συνδέσεις. Η νέα έκδοση της εφαρμογής διορθώνει πολλές από τις αποσυνδέσεις και τις επανασυνδέσεις για τις οποίες μας έγραψε ο κόσμος."
  es: "Conexiones más estables. La nueva versión de la app corrige muchos de los cortes y reconexiones sobre los que nos escribió la gente."
  es-419: "Conexiones más estables. La nueva versión de la app corrige muchos de los cortes y reconexiones sobre los que nos escribió la gente."
  es-MX: "Conexiones más estables. La nueva versión de la app corrige muchos de los cortes y reconexiones sobre los que nos escribió la gente."
  fr: "Des connexions plus stables. La nouvelle version de l'app corrige bon nombre des coupures et des reconnexions que les gens nous ont signalées."
  he: "חיבורים יציבים יותר. הגרסה החדשה של האפליקציה מתקנת רבים מהניתוקים ומהחיבורים מחדש שאנשים כתבו לנו עליהם."
  hi: "ज़्यादा स्थिर कनेक्शन। ऐप का नया संस्करण कनेक्शन टूटने और दोबारा कनेक्ट होने की उन समस्याओं में से कई को ठीक करता है, जिनके बारे में लोगों ने हमें लिखा था।"
  id: "Koneksi lebih stabil. Versi baru aplikasi memperbaiki banyak di antara masalah koneksi putus dan tersambung ulang yang dilaporkan orang kepada kami."
  it: "Connessioni più stabili. La nuova versione dell'app risolve molte delle disconnessioni e riconnessioni di cui le persone ci hanno scritto."
  ja: "接続がより安定しました。アプリの新しいバージョンでは、皆さんからご連絡いただいた切断や再接続の問題の多くを修正しています。"
  ko: "더 안정적인 연결. 새 버전 앱은 사용자분들이 알려 주신 연결 끊김과 재연결 문제 중 상당수를 고쳤습니다."
  nl: "Stabielere verbindingen. De nieuwe versie van de app verhelpt veel van de onderbrekingen en herverbindingen waarover mensen ons schreven."
  pl: "Stabilniejsze połączenia. Nowa wersja aplikacji naprawia wiele z rozłączeń i ponownych połączeń, o których ludzie do nas pisali."
  pt: "Conexões mais estáveis. A nova versão do app corrige muitas das quedas e reconexões sobre as quais as pessoas nos escreveram."
  pt-BR: "Conexões mais estáveis. A nova versão do app corrige muitas das quedas e reconexões sobre as quais as pessoas nos escreveram."
  pt-PT: "Ligações mais estáveis. A nova versão da app corrige muitas das quedas e reconexões sobre as quais as pessoas nos escreveram."
  ru: "Более стабильные подключения. Новая версия приложения устраняет многие обрывы и переподключения, о которых нам писали."
  sv: "Stabilare anslutningar. Den nya versionen av appen åtgärdar många av de avbrott och återanslutningar som folk har skrivit till oss om."
  sw: "Miunganisho thabiti zaidi. Toleo jipya la programu linarekebisha mengi ya matatizo ya kukatika na kuunganisha upya ambayo watu walituandikia."
  th: "การเชื่อมต่อเสถียรขึ้น แอปเวอร์ชันใหม่แก้ปัญหาการเชื่อมต่อหลุดและต้องเชื่อมต่อใหม่ได้หลายกรณีจากที่ผู้ใช้เขียนมาบอกเรา"
  uk: "Стабільніші підключення. Нова версія застосунку усуває багато обривів і перепідключень, про які нам писали."
  vi: "Kết nối ổn định hơn. Phiên bản mới của ứng dụng khắc phục nhiều trong số các trường hợp rớt kết nối và phải kết nối lại mà mọi người đã báo với chúng tôi."
  zh: "连接更稳定了。大家来信反映的断线和重连问题，新版应用修复了其中的许多。"
  zh-HK: "連接更穩定了。大家來信反映的斷線和重新連接問題，新版本的應用程式修復了其中許多。"
