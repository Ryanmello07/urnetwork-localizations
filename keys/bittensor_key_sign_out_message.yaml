description: "The confirmation of Sign out, the message."
source: "Your Bittensor recovery phrase isn't saved yet. The key stays on this device and comes back when this network signs in again. If you lose this device before saving it, your SN25α can't be reached."
platforms:
  - apple
  - android
localizations:
  ar: "لم يتم حفظ عبارة النسخ الاحتياطي الخاصة بك لـ Bittensor بعد. يبقى المفتاح على هذا الجهاز ويعود عندما تسجّل هذه الشبكة الدخول مرة أخرى. إذا فقدت هذا الجهاز قبل حفظها، فلن يمكن الوصول إلى SN25α الخاص بك."
  cs: "Vaše obnovovací fráze Bittensor ještě není uložená. Klíč zůstane na tomto zařízení a vrátí se, až se tato síť znovu přihlásí. Pokud toto zařízení ztratíte dřív, než ji uložíte, k vašemu SN25α se nebude možné dostat."
  de: "Deine Bittensor-Wiederherstellungsphrase ist noch nicht gespeichert. Der Schlüssel bleibt auf diesem Gerät und kommt zurück, wenn sich dieses Netzwerk wieder anmeldet. Wenn du dieses Gerät verlierst, bevor du sie gespeichert hast, ist dein SN25α nicht mehr erreichbar."
  el: "Η φράση επαναφοράς Bittensor σας δεν έχει αποθηκευτεί ακόμη. Το κλειδί παραμένει σε αυτή τη συσκευή και επιστρέφει όταν αυτό το δίκτυο συνδεθεί ξανά. Αν χάσετε αυτή τη συσκευή πριν αποθηκεύσετε τη φράση, δεν θα είναι δυνατή η πρόσβαση στα SN25α σας."
  en: "Your Bittensor recovery phrase isn't saved yet. The key stays on this device and comes back when this network signs in again. If you lose this device before saving it, your SN25α can't be reached."
  es: "Tu frase de recuperación de Bittensor aún no está guardada. La clave se queda en este dispositivo y vuelve cuando esta red inicie sesión de nuevo. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-419: "Tu frase de recuperación de Bittensor todavía no está guardada. La clave se queda en este dispositivo y vuelve cuando esta red inicie sesión de nuevo. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-MX: "Tu frase de recuperación de Bittensor todavía no está guardada. La clave se queda en este dispositivo y vuelve cuando esta red inicie sesión de nuevo. Si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  fr: "Votre phrase de sauvegarde Bittensor n’est pas encore enregistrée. La clé reste sur cet appareil et revient lorsque ce réseau se reconnecte. Si vous perdez cet appareil avant de l’avoir enregistrée, vos SN25α seront inaccessibles."
  he: "ביטוי השחזור של Bittensor שלכם עדיין לא נשמר. המפתח נשאר במכשיר הזה וחוזר כשהרשת הזו מתחברת שוב. אם תאבדו את המכשיר הזה לפני שתשמרו את הביטוי, לא תהיה גישה ל-SN25α שלכם."
  hi: "आपका Bittensor रिकवरी फ़्रेज़ अभी सहेजा नहीं गया है। कुंजी इसी डिवाइस पर रहती है और जब यह नेटवर्क फिर से साइन इन करता है तो वापस आ जाती है। अगर आप फ़्रेज़ सहेजने से पहले यह डिवाइस खो देते हैं, तो आपके SN25α तक पहुँचा नहीं जा सकेगा।"
  id: "Frasa cadangan Bittensor Anda belum disimpan. Kunci tetap ada di perangkat ini dan kembali saat jaringan ini masuk lagi. Jika Anda kehilangan perangkat ini sebelum menyimpan frasa tersebut, SN25α Anda tidak dapat diakses."
  it: "La tua frase di recupero Bittensor non è ancora salvata. La chiave resta su questo dispositivo e torna quando questa rete accede di nuovo. Se perdi questo dispositivo prima di averla salvata, i tuoi SN25α non saranno più accessibili."
  ja: "Bittensor の復元フレーズはまだ保存されていません。キーはこのデバイスに残り、このネットワークが再度サインインすると戻ります。復元フレーズを保存する前にこのデバイスをなくすと、SN25α にアクセスできなくなります。"
  ko: "Bittensor 복구 문구가 아직 저장되지 않았습니다. 키는 이 기기에 남아 있으며 이 네트워크가 다시 로그인하면 돌아옵니다. 복구 문구를 저장하기 전에 이 기기를 잃어버리면 SN25α에 접근할 수 없습니다."
  nl: "Je Bittensor-herstelzin is nog niet opgeslagen. De sleutel blijft op dit apparaat staan en komt terug wanneer dit netwerk opnieuw inlogt. Als je dit apparaat kwijtraakt voordat je de herstelzin hebt opgeslagen, is je SN25α niet meer bereikbaar."
  pl: "Twoja fraza odzyskiwania Bittensor nie jest jeszcze zapisana. Klucz pozostaje na tym urządzeniu i wróci, gdy ta sieć zaloguje się ponownie. Jeśli stracisz to urządzenie, zanim ją zapiszesz, do twoich SN25α nie będzie można się dostać."
  pt: "A sua frase de recuperação Bittensor ainda não está guardada. A chave fica neste dispositivo e volta quando esta rede iniciar sessão novamente. Se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  pt-BR: "Sua frase de recuperação Bittensor ainda não está salva. A chave fica neste dispositivo e volta quando esta rede entrar novamente. Se você perder este dispositivo antes de salvá-la, não será possível acessar seu SN25α."
  pt-PT: "A sua frase de recuperação Bittensor ainda não está guardada. A chave fica neste dispositivo e volta quando esta rede iniciar sessão novamente. Se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  ru: "Ваша фраза восстановления Bittensor ещё не сохранена. Ключ останется на этом устройстве и вернётся, когда эта сеть снова войдёт в систему. Если вы потеряете это устройство, не сохранив её, получить доступ к вашим SN25α будет невозможно."
  sv: "Din Bittensor-återställningsfras är inte sparad än. Nyckeln stannar på den här enheten och kommer tillbaka när det här nätverket loggar in igen. Om du förlorar den här enheten innan du har sparat frasen går det inte att komma åt dina SN25α."
  sw: "Kifungu chako cha urejeshaji cha Bittensor bado hakijahifadhiwa. Ufunguo unabaki kwenye kifaa hiki na unarudi mtandao huu unapoingia tena. Ukipoteza kifaa hiki kabla ya kuhifadhi kifungu hicho, SN25α yako haitaweza kufikiwa."
  th: "ยังไม่ได้บันทึกวลีสำรอง Bittensor ของคุณ คีย์จะยังอยู่บนอุปกรณ์นี้และจะกลับมาเมื่อเครือข่ายนี้ลงชื่อเข้าใช้อีกครั้ง หากคุณทำอุปกรณ์นี้หายก่อนบันทึกวลีนี้ จะไม่สามารถเข้าถึง SN25α ของคุณได้"
  uk: "Вашу фразу відновлення Bittensor ще не збережено. Ключ залишиться на цьому пристрої та повернеться, коли ця мережа знову ввійде в систему. Якщо ви втратите цей пристрій, не зберігши її, отримати доступ до ваших SN25α буде неможливо."
  vi: "Cụm từ sao lưu Bittensor của bạn chưa được lưu. Khóa vẫn ở trên thiết bị này và sẽ trở lại khi mạng này đăng nhập lại. Nếu bạn mất thiết bị này trước khi lưu cụm từ đó, sẽ không thể truy cập SN25α của bạn."
  zh: "您的 Bittensor 恢复短语尚未保存。密钥会保留在这台设备上，并在此网络再次登录时重新出现。如果您在保存恢复短语之前丢失这台设备，您的 SN25α 将无法访问。"
  zh-HK: "你的 Bittensor 復原短語尚未儲存。金鑰會保留在這部裝置上，並在此網絡再次登入時重新出現。如果你在儲存復原短語之前遺失這部裝置，你的 SN25α 將無法存取。"
