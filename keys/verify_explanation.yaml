description: "Sub header text explaining why verification is needed."
source: "Tell us who you really are. Enter the code we sent you to verify your identity."
platforms:
  - apple
  - web
  - site
localizations:
  ar: "أخبرنا من أنت حقاً. أدخل الرمز الذي أرسلناه إليك للتحقق من هويتك."
  cs: "Řekněte nám, kdo skutečně jste. Zadejte kód, který jsme vám zaslali k ověření vaší totožnosti."
  de: "Sag uns, wer du wirklich bist. Gib den Code ein, den wir dir zur Identitätsprüfung gesendet haben."
  el: "Πείτε μας ποιοι είστε πραγματικά. Εισάγετε τον κωδικό που σας στείλαμε για να επιβεβαιώσετε την ταυτότητά σας."
  en: "Tell us who you really are. Enter the code we sent you to verify your identity."
  es: "Dinos quién eres realmente. Introduce el código que te enviamos para verificar tu identidad."
  es-419: "Dinos quién eres realmente. Ingresa el código que te enviamos para verificar tu identidad."
  es-MX: "Dinos quién eres realmente. Ingresa el código que te enviamos para verificar tu identidad."
  fr: "Dites-nous qui vous êtes vraiment. Saisissez le code que nous vous avons envoyé pour vérifier votre identité."
  he: "ספר לנו מי אתה באמת. הזן את הקוד ששלחנו לך כדי לאמת את זהותך."
  hi: "हमें बताएं कि आप वास्तव में कौन हैं। अपनी पहचान सत्यापित करने के लिए हमारे द्वारा भेजा गया कोड दर्ज करें।"
  id: "Beri tahu kami siapa Anda sebenarnya. Masukkan kode yang kami kirimkan untuk memverifikasi identitas Anda."
  it: "Dicci chi sei veramente. Inserisci il codice che ti abbiamo inviato per verificare la tua identità."
  ja: "本人確認をお願いします。送信した認証コードを入力して本人確認を完了してください。"
  ko: "실제 신원을 알려주세요. 본인 확인을 위해 보내드린 코드를 입력해주세요."
  nl: "Vertel ons wie je echt bent. Voer de code in die we je hebben verstuurd om je identiteit te verifiëren "
  pl: "Powiedz nam, kim naprawdę jesteś. Wprowadź kod, który wysłaliśmy, aby zweryfikować Twoją tożsamość."
  pt: "Conte-nos quem você realmente é. Digite o código que enviamos para verificar sua identidade."
  pt-BR: "Diga-nos quem você realmente é. Digite o código que enviamos para verificar sua identidade."
  pt-PT: "Diga-nos quem é realmente. Introduza o código que enviámos para verificar a sua identidade."
  ru: "Скажите нам, кто вы на самом деле. Введите код, который мы отправили для подтверждения вашей личности."
  sv: "Berätta för oss vem du verkligen är. Ange koden vi skickade för att verifiera din identitet."
  sw: "Tuambie wewe ni nani hasa. Ingiza msimbo tuliokutumia kuthibitisha utambulisho wako."
  th: "บอกเราว่าคุณคือใคร ป้อนรหัสที่เราส่งให้คุณเพื่อยืนยันตัวตนของคุณ"
  uk: "Скажіть нам, хто ви насправді. Введіть код, який ми надіслали для підтвердження вашої особи."
  vi: "Hãy cho chúng tôi biết bạn là ai. Nhập mã chúng tôi đã gửi để xác minh danh tính của bạn."
  zh: "告诉我们你是谁。输入我们发送给你的验证码以验证你的身份。"
  zh-HK: "告訴我們你是誰。輸入我們發送給你的驗證碼以驗證你的身份。"
