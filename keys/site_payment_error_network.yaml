description: "Pay page (/app/pay-sheet) and the Pro upgrade sheet on ur.io: Stripe or URnetwork's server could not be reached (offline, timed out, or blocked by the network)."
source: "Could not connect. Check your internet connection and try again."
platforms:
  - site
localizations:
  ar: "تعذّر الاتصال. تحقق من اتصالك بالإنترنت وحاول مرة أخرى."
  de: "Keine Verbindung möglich. Prüfe deine Internetverbindung und versuche es erneut."
  en: "Could not connect. Check your internet connection and try again."
  es: "No se pudo conectar. Comprueba tu conexión a internet e inténtalo de nuevo."
  ru: "Не удалось подключиться. Проверьте подключение к интернету и попробуйте снова."
  zh: "无法连接。请检查您的网络连接后重试。"
