description: "Split rules screen: note that a rule matches every host in the same network cluster (related hosts of one site or service), whatever the rule's mode."
source: "Rules apply to the whole co-associated network cluster, so related traffic is caught together."
platforms:
  - apple
localizations:
  ar: "تنطبق القواعد على مجموعة الشبكة المرتبطة بالكامل، لذا تُشمل حركة المرور ذات الصلة معًا."
  cs: "Pravidla platí pro celý propojený síťový cluster, takže související provoz je zachycen společně."
  de: "Regeln gelten für den gesamten zusammengehörigen Netzwerk-Cluster, sodass verwandter Datenverkehr gemeinsam erfasst wird."
  el: "Οι κανόνες ισχύουν για ολόκληρο το συσχετισμένο σύμπλεγμα δικτύων, ώστε η σχετική κίνηση να καλύπτεται μαζί."
  en: "Rules apply to the whole co-associated network cluster, so related traffic is caught together."
  es: "Las reglas se aplican a todo el clúster de red asociado, así que el tráfico relacionado queda cubierto en conjunto."
  es-419: "Las reglas se aplican a todo el clúster de red asociado, así que el tráfico relacionado queda cubierto en conjunto."
  es-MX: "Las reglas se aplican a todo el clúster de red asociado, así que el tráfico relacionado queda cubierto en conjunto."
  fr: "Les règles s’appliquent à tout le groupe de réseaux associés, afin que le trafic lié soit pris en compte ensemble."
  he: "הכללים חלים על כל אשכול הרשת המשויך, כך שתעבורה קשורה נתפסת יחד."
  hi: "नियम पूरे संबद्ध नेटवर्क क्लस्टर पर लागू होते हैं, इसलिए संबंधित ट्रैफ़िक एक साथ शामिल हो जाता है।"
  id: "Aturan berlaku untuk seluruh klaster jaringan terkait, sehingga lalu lintas yang berhubungan tercakup bersama."
  it: "Le regole si applicano all’intero gruppo di reti associate, così il traffico correlato viene gestito insieme."
  ja: "ルールは関連するネットワーククラスタ全体に適用されるため、関連するトラフィックもまとめて対象になります。"
  ko: "규칙은 연관된 네트워크 클러스터 전체에 적용되므로 관련 트래픽이 함께 처리됩니다."
  nl: "Regels gelden voor het hele samenhangende netwerkcluster, zodat gerelateerd verkeer samen wordt meegenomen."
  pl: "Reguły dotyczą całego powiązanego klastra sieciowego, więc pokrewny ruch jest obejmowany razem."
  pt: "As regras se aplicam a todo o cluster de rede coassociado, para que o tráfego relacionado seja capturado em conjunto."
  pt-BR: "As regras se aplicam a todo o cluster de rede coassociado, para que o tráfego relacionado seja capturado em conjunto."
  pt-PT: "As regras aplicam-se a todo o cluster de rede coassociado, para que o tráfego relacionado seja abrangido em conjunto."
  ru: "Правила применяются ко всему связанному сетевому кластеру, поэтому сопутствующий трафик учитывается вместе."
  sv: "Regler gäller hela det sammankopplade nätverksklustret, så relaterad trafik fångas upp tillsammans."
  sw: "Sheria hutumika kwa kundi zima la mtandao linalohusiana, hivyo trafiki inayohusiana hunaswa pamoja."
  th: "กฎจะใช้กับคลัสเตอร์เครือข่ายที่เกี่ยวข้องทั้งหมด ทราฟฟิกที่เกี่ยวข้องจึงถูกจัดการไปพร้อมกัน"
  uk: "Правила застосовуються до всього пов’язаного мережевого кластера, тому супутній трафік враховується разом."
  vi: "Quy tắc áp dụng cho toàn bộ cụm mạng liên quan, nên lưu lượng liên quan được gộp chung."
  zh: "规则会应用到整个关联网络集群，因此相关流量会被一并处理。"
  zh-HK: "規則會套用至整個關聯網絡叢集，因此相關流量會一併處理。"
