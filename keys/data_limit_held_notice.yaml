description: "Alert body shown in the app and in a local notification when a paying account is refused at a data limit while the tunnel is capturing traffic. Connect stays requested and the VPN keeps holding traffic until the limit allows more data or the user disconnects. The paying counterpart of insufficient_balance_held_notice, with no upgrade to offer."
source: "Your traffic is held in the tunnel until more data is available or you disconnect."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "تبقى حركة بياناتك محتجزة داخل النفق حتى تتوفر بيانات إضافية أو تقوم بقطع الاتصال."
  cs: "Váš provoz zůstává zadržen v tunelu, dokud nebudou k dispozici další data nebo se neodpojíte."
  de: "Dein Datenverkehr wird im Tunnel gehalten, bis wieder Daten verfügbar sind oder du die Verbindung trennst."
  el: "Η κίνησή σας παραμένει στη σήραγγα μέχρι να υπάρξουν περισσότερα δεδομένα ή να αποσυνδεθείτε."
  en: "Your traffic is held in the tunnel until more data is available or you disconnect."
  es: "Tu tráfico se mantiene en el túnel hasta que haya más datos disponibles o te desconectes."
  es-419: "Tu tráfico se mantiene en el túnel hasta que haya más datos disponibles o te desconectes."
  es-MX: "Tu tráfico se mantiene en el túnel hasta que haya más datos disponibles o te desconectes."
  fr: "Votre trafic est retenu dans le tunnel jusqu’à ce que davantage de données soient disponibles ou que vous vous déconnectiez."
  he: "התעבורה שלך מוחזקת במנהרה עד שיהיו עוד נתונים זמינים או עד שתתנתק."
  hi: "जब तक और डेटा उपलब्ध नहीं होता या आप डिस्कनेक्ट नहीं करते, आपका ट्रैफ़िक टनल में रोका रहता है।"
  id: "Lalu lintas Anda ditahan di terowongan sampai ada lebih banyak data atau Anda memutuskan koneksi."
  it: "Il tuo traffico resta trattenuto nel tunnel finché non saranno disponibili altri dati o non ti disconnetti."
  ja: "追加のデータが利用可能になるか切断するまで、通信はトンネル内に保持されます。"
  ko: "추가 데이터를 사용할 수 있게 되거나 연결을 해제할 때까지 트래픽이 터널 안에 보류됩니다."
  nl: "Je verkeer wordt in de tunnel vastgehouden totdat er meer data beschikbaar is of je de verbinding verbreekt."
  pl: "Twój ruch jest zatrzymany w tunelu, dopóki nie będzie dostępnych więcej danych lub się nie rozłączysz."
  pt: "Seu tráfego fica retido no túnel até haver mais dados disponíveis ou você desconectar."
  pt-BR: "Seu tráfego fica retido no túnel até haver mais dados disponíveis ou você desconectar."
  pt-PT: "O seu tráfego fica retido no túnel até haver mais dados disponíveis ou até desligar."
  ru: "Ваш трафик удерживается в туннеле, пока не появятся дополнительные данные или вы не отключитесь."
  sv: "Din trafik hålls kvar i tunneln tills mer data finns tillgänglig eller du kopplar från."
  sw: "Trafiki yako imeshikiliwa ndani ya handaki hadi data zaidi ipatikane au utenganishe."
  th: "ทราฟฟิกของคุณถูกกักไว้ในอุโมงค์จนกว่าจะมีข้อมูลเพิ่มหรือคุณตัดการเชื่อมต่อ"
  uk: "Ваш трафік утримується в тунелі, доки не з’являться додаткові дані або ви не відключитеся."
  vi: "Lưu lượng của bạn được giữ trong đường hầm cho đến khi có thêm dữ liệu hoặc bạn ngắt kết nối."
  zh: "在有更多可用数据或你断开连接之前，你的流量会保留在隧道中。"
  zh-HK: "在有更多可用數據或你斷開連接之前，你的流量會保留在隧道中。"
