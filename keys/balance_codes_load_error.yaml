description: "Linux redeem-code sheet: shown in place of the redeemed-codes history when getNetworkRedeemedBalanceCodes FAILS (transport error, no response, or a server-side error) — distinct from the empty state's \"No balance codes found\", which is only for a successful fetch with no codes."
source: "Couldn't load your balance codes. Check your connection and try again."
platforms:
  - linux
localizations:
  ar: "تعذّر تحميل رموز الرصيد الخاصة بك. تحقق من اتصالك وحاول مرة أخرى."
  cs: "Kódy zůstatku se nepodařilo načíst. Zkontrolujte připojení a zkuste to znovu."
  de: "Deine Guthabencodes konnten nicht geladen werden. Überprüfe deine Verbindung und versuche es erneut."
  el: "Δεν ήταν δυνατή η φόρτωση των κωδικών υπολοίπου. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά."
  en: "Couldn't load your balance codes. Check your connection and try again."
  es: "No se pudieron cargar tus códigos de saldo. Revisa tu conexión e inténtalo de nuevo."
  es-419: "No se pudieron cargar tus códigos de saldo. Revisa tu conexión e inténtalo de nuevo."
  es-MX: "No se pudieron cargar tus códigos de saldo. Revisa tu conexión e inténtalo de nuevo."
  fr: "Impossible de charger vos codes de solde. Vérifiez votre connexion et réessayez."
  he: "לא ניתן היה לטעון את קודי היתרה שלכם. בדקו את החיבור ונסו שוב."
  hi: "आपके बैलेंस कोड लोड नहीं हो सके। अपना कनेक्शन जाँचें और दोबारा कोशिश करें।"
  id: "Tidak dapat memuat kode saldo Anda. Periksa koneksi Anda dan coba lagi."
  it: "Impossibile caricare i tuoi codici saldo. Controlla la connessione e riprova."
  ja: "残高コードを読み込めませんでした。接続を確認してもう一度お試しください。"
  ko: "잔액 코드를 불러올 수 없습니다. 연결을 확인한 후 다시 시도하세요."
  nl: "Je tegoedcodes konden niet worden geladen. Controleer je verbinding en probeer het opnieuw."
  pl: "Nie udało się wczytać kodów salda. Sprawdź połączenie i spróbuj ponownie."
  pt: "Não foi possível carregar os seus códigos de saldo. Verifique a sua ligação e tente novamente."
  pt-BR: "Não foi possível carregar seus códigos de saldo. Verifique sua conexão e tente novamente."
  pt-PT: "Não foi possível carregar os seus códigos de saldo. Verifique a sua ligação e tente novamente."
  ru: "Не удалось загрузить ваши коды баланса. Проверьте подключение и попробуйте снова."
  sv: "Det gick inte att läsa in dina saldokoder. Kontrollera din anslutning och försök igen."
  sw: "Imeshindwa kupakia misimbo yako ya salio. Kagua muunganisho wako kisha ujaribu tena."
  th: "โหลดรหัสยอดคงเหลือของคุณไม่ได้ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง"
  uk: "Не вдалося завантажити ваші коди балансу. Перевірте з’єднання і спробуйте ще раз."
  vi: "Không thể tải các mã số dư của bạn. Hãy kiểm tra kết nối và thử lại."
  zh: "无法加载您的余额码。请检查网络连接后重试。"
  zh-HK: "無法載入你的餘額碼。請檢查網絡連線後再試。"
