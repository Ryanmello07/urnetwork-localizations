description: "Windows sign-in screen, browser sign-in sheet: the text above the auth code field that says how the sheet works. ur.io, Google and Apple are names. The Google or Apple sessions are the sign-ins the browser already holds. 'Account → Create auth code' is the way to the Create auth code button on a signed-in device: use this language's labels of Account (account) and Create auth code (site_app_create_auth_code); right-to-left languages point the arrow the other way."
source: "Sign in at ur.io in your browser — your password manager and existing Google or Apple sessions work there. Then paste a one-time auth code from any signed-in device (Account → Create auth code)."
platforms:
  - windows
  - linux
localizations:
  ar: "سجّل الدخول إلى ur.io في متصفحك — يعمل هناك مدير كلمات المرور لديك وجلسات Google أو Apple الحالية. ثم الصق رمز مصادقة لمرة واحدة من أي جهاز مسجَّل الدخول (الحساب ← إنشاء رمز مصادقة)."
  cs: "Přihlaste se na ur.io v prohlížeči — funguje tam váš správce hesel i stávající relace Google nebo Apple. Potom vložte jednorázový ověřovací kód z libovolného přihlášeného zařízení (Účet → Vytvořit ověřovací kód)."
  de: "Melde dich in deinem Browser bei ur.io an – dort funktionieren dein Passwort-Manager und bestehende Google- oder Apple-Sitzungen. Füge dann einen einmaligen Authentifizierungscode von einem beliebigen angemeldeten Gerät ein (Konto → Auth-Code erstellen)."
  el: "Συνδεθείτε στο ur.io στο πρόγραμμα περιήγησης — εκεί λειτουργούν ο διαχειριστής κωδικών πρόσβασής σας και οι υπάρχουσες συνεδρίες Google ή Apple. Στη συνέχεια, επικολλήστε έναν κωδικό ταυτοποίησης μίας χρήσης από οποιαδήποτε συνδεδεμένη συσκευή (Λογαριασμός → Δημιουργία κωδικού ταυτοποίησης)."
  en: "Sign in at ur.io in your browser — your password manager and existing Google or Apple sessions work there. Then paste a one-time auth code from any signed-in device (Account → Create auth code)."
  es: "Inicia sesión en ur.io en tu navegador: allí funcionan tu gestor de contraseñas y tus sesiones abiertas de Google o Apple. Después, pega un código de autenticación de un solo uso de cualquier dispositivo con la sesión iniciada (Cuenta → Crear código de autenticación)."
  es-419: "Inicia sesión en ur.io en tu navegador: allí funcionan tu administrador de contraseñas y tus sesiones abiertas de Google o Apple. Después, pega un código de autenticación de un solo uso de cualquier dispositivo con la sesión iniciada (Cuenta → Crear código de autenticación)."
  es-MX: "Inicia sesión en ur.io en tu navegador: allí funcionan tu administrador de contraseñas y tus sesiones abiertas de Google o Apple. Después, pega un código de autenticación de un solo uso de cualquier dispositivo con la sesión iniciada (Cuenta → Crear código de autenticación)."
  fr: "Connectez-vous à ur.io dans votre navigateur — votre gestionnaire de mots de passe et vos sessions Google ou Apple existantes y fonctionnent. Collez ensuite un code d’authentification à usage unique obtenu sur n’importe quel appareil connecté (Compte → Créer un code d’authentification)."
  he: "התחברו ל-ur.io בדפדפן — מנהל הסיסמאות שלכם וההתחברויות הקיימות שלכם ל-Google או ל-Apple עובדים שם. לאחר מכן הדביקו קוד אימות חד-פעמי מכל מכשיר מחובר (חשבון ← יצירת קוד אימות)."
  hi: "अपने ब्राउज़र में ur.io पर साइन इन करें — वहाँ आपका पासवर्ड मैनेजर और Google या Apple के मौजूदा सत्र काम करते हैं। फिर किसी भी साइन इन किए हुए डिवाइस से एक बार इस्तेमाल होने वाला ऑथ कोड पेस्ट करें (खाता → ऑथ कोड बनाएँ)।"
  id: "Masuk ke ur.io di browser Anda — pengelola kata sandi dan sesi Google atau Apple yang sudah ada berfungsi di sana. Lalu tempel kode otentikasi sekali pakai dari perangkat mana pun yang sudah masuk (Akun → Buat kode otentikasi)."
  it: "Accedi a ur.io nel browser — lì funzionano il tuo gestore di password e le sessioni Google o Apple già aperte. Poi incolla un codice di autenticazione monouso da qualsiasi dispositivo su cui hai effettuato l’accesso (Account → Crea codice di autenticazione)."
  ja: "ブラウザで ur.io にサインインしてください。パスワードマネージャーや、既存の Google または Apple のセッションをそのまま使えます。その後、サインイン済みの任意のデバイスで発行したワンタイム認証コードを貼り付けてください（アカウント → 認証コードを作成）。"
  ko: "브라우저에서 ur.io에 로그인하세요. 비밀번호 관리자와 기존 Google 또는 Apple 세션을 그대로 사용할 수 있습니다. 그런 다음 로그인된 아무 기기에서나 발급한 일회용 인증 코드를 붙여넣으세요(계정 → 인증 코드 만들기)."
  nl: "Log in op ur.io in je browser — daar werken je wachtwoordmanager en bestaande Google- of Apple-sessies. Plak daarna een eenmalige auth-code van een ingelogd apparaat naar keuze (Account → Auth-code aanmaken)."
  pl: "Zaloguj się na ur.io w przeglądarce — działają tam Twój menedżer haseł i istniejące sesje Google lub Apple. Następnie wklej jednorazowy kod uwierzytelniający z dowolnego zalogowanego urządzenia (Konto → Utwórz kod uwierzytelniający)."
  pt: "Inicie sessão no ur.io no seu navegador — o seu gestor de palavras-passe e as sessões Google ou Apple já abertas funcionam lá. Depois, cole um código de autenticação de utilização única de qualquer dispositivo com sessão iniciada (Conta → Criar código de autenticação)."
  pt-BR: "Entre no ur.io pelo navegador — seu gerenciador de senhas e as sessões do Google ou da Apple já abertas funcionam lá. Depois, cole um código de autenticação de uso único de qualquer dispositivo conectado (Conta → Criar código de autenticação)."
  pt-PT: "Inicie sessão no ur.io no seu navegador — o seu gestor de palavras-passe e as sessões Google ou Apple já abertas funcionam lá. Depois, cole um código de autenticação de utilização única de qualquer dispositivo com sessão iniciada (Conta → Criar código de autenticação)."
  ru: "Войдите на ur.io в браузере — там работают ваш менеджер паролей и уже открытые сеансы Google или Apple. Затем вставьте одноразовый код аутентификации с любого устройства, на котором выполнен вход (Аккаунт → Создать код аутентификации)."
  sv: "Logga in på ur.io i webbläsaren – där fungerar din lösenordshanterare och befintliga Google- eller Apple-sessioner. Klistra sedan in en autentiseringskod för engångsbruk från valfri inloggad enhet (Konto → Skapa autentiseringskod)."
  sw: "Ingia kwenye ur.io katika kivinjari chako — kidhibiti chako cha manenosiri na vipindi vya Google au Apple ulivyonavyo tayari hufanya kazi huko. Kisha bandika nambari ya uthibitishaji ya matumizi ya mara moja kutoka kwenye kifaa chochote kilichoingia (Akaunti → Tengeneza nambari ya uthibitishaji)."
  th: "ลงชื่อเข้าใช้ ur.io ในเบราว์เซอร์ของคุณ ซึ่งใช้ตัวจัดการรหัสผ่านและเซสชัน Google หรือ Apple ที่มีอยู่ได้ จากนั้นวางรหัสยืนยันแบบใช้ครั้งเดียวจากอุปกรณ์ใดก็ได้ที่ลงชื่อเข้าใช้อยู่ (บัญชี → สร้างรหัสยืนยัน)"
  uk: "Увійдіть на ur.io у браузері — там працюють ваш менеджер паролів і вже відкриті сеанси Google або Apple. Потім вставте одноразовий код автентифікації з будь-якого пристрою, на якому виконано вхід (Обліковий запис → Створити код автентифікації)."
  vi: "Đăng nhập ur.io trong trình duyệt của bạn — trình quản lý mật khẩu và các phiên Google hoặc Apple hiện có đều dùng được ở đó. Sau đó dán mã xác thực dùng một lần từ bất kỳ thiết bị nào đã đăng nhập (Tài khoản → Tạo mã xác thực)."
  zh: "请在浏览器中登录 ur.io——您的密码管理器和已登录的 Google 或 Apple 会话都能在那里使用。然后粘贴在任一已登录设备上生成的一次性验证码（帐户 → 创建授权码）。"
  zh-HK: "請在瀏覽器中登入 ur.io——你的密碼管理器和已登入的 Google 或 Apple 工作階段都可在那裡使用。然後貼上在任何已登入裝置上產生的一次性認證碼（帳戶 → 建立認證碼）。"
