description: "Windows tray notification after the service stopped a tunnel that carried nothing, while the kill switch keeps this computer blocked. \"This menu\" is the tray icon's menu."
source: "The tunnel could not carry traffic, so URnetwork shut it down. The kill switch is on, so this machine stays blocked and nothing is leaking. Reconnect, or turn off the kill switch from this menu."
platforms:
  - windows
localizations:
  ar: "لم يتمكن النفق من نقل حركة البيانات، لذا أوقفه URnetwork. مفتاح القتل مفعّل، لذا يبقى هذا الكمبيوتر محجوبًا ولا يوجد أي تسرب. أعد الاتصال، أو أوقف مفتاح القتل من هذه القائمة."
  cs: "Tunel nedokázal přenášet provoz, a tak ho URnetwork vypnul. Kill switch je zapnutý, takže tento počítač zůstává zablokovaný a nic neuniká. Připojte se znovu nebo vypněte kill switch v této nabídce."
  de: "Der Tunnel konnte keinen Datenverkehr übertragen, deshalb hat URnetwork ihn beendet. Der Kill switch ist an, daher bleibt dieser Computer blockiert und es dringt nichts nach außen. Verbinde dich erneut oder schalte den Kill switch über dieses Menü aus."
  el: "Η σήραγγα δεν μπορούσε να μεταφέρει κίνηση, οπότε το URnetwork την τερμάτισε. Το Kill switch είναι ενεργό, οπότε αυτός ο υπολογιστής παραμένει αποκλεισμένος και δεν υπάρχει καμία διαρροή. Συνδεθείτε ξανά ή απενεργοποιήστε το Kill switch από αυτό το μενού."
  en: "The tunnel could not carry traffic, so URnetwork shut it down. The kill switch is on, so this machine stays blocked and nothing is leaking. Reconnect, or turn off the kill switch from this menu."
  es: "El túnel no podía transportar tráfico, así que URnetwork lo cerró. El Kill switch está activado, así que este ordenador sigue bloqueado y no hay ninguna fuga. Vuelve a conectarte o desactiva el Kill switch desde este menú."
  es-419: "El túnel no podía transportar tráfico, así que URnetwork lo cerró. El Kill switch está activado, así que esta computadora sigue bloqueado y no hay ninguna fuga. Vuelve a conectarte o desactiva el Kill switch desde este menú."
  es-MX: "El túnel no podía transportar tráfico, así que URnetwork lo cerró. El Kill switch está activado, así que esta computadora sigue bloqueado y no hay ninguna fuga. Vuelve a conectarte o desactiva el Kill switch desde este menú."
  fr: "Le tunnel ne pouvait pas acheminer le trafic, URnetwork l’a donc arrêté. Le Kill switch est activé : cet ordinateur reste bloqué et rien ne fuit. Reconnectez-vous ou désactivez le Kill switch depuis ce menu."
  he: "המנהרה לא הצליחה להעביר תעבורה, ולכן URnetwork סגר אותה. הקיל סוויץ' פעיל, ולכן המחשב הזה נשאר חסום ושום דבר לא דולף. התחברו מחדש, או כבו את הקיל סוויץ' מהתפריט הזה."
  hi: "टनल ट्रैफ़िक नहीं ले जा पा रहा था, इसलिए URnetwork ने उसे बंद कर दिया। किल स्विच चालू है, इसलिए यह कंप्यूटर अवरुद्ध रहता है और कुछ भी लीक नहीं हो रहा। फिर से कनेक्ट करें, या इस मेनू से किल स्विच बंद करें।"
  id: "Terowongan tidak dapat membawa lalu lintas, jadi URnetwork menghentikannya. Kill switch aktif, jadi komputer ini tetap diblokir dan tidak ada yang bocor. Hubungkan lagi, atau matikan Kill switch dari menu ini."
  it: "Il tunnel non riusciva a trasportare il traffico, quindi URnetwork lo ha chiuso. Il Kill switch è attivo, quindi questo computer resta bloccato e non c’è alcuna perdita. Riconnettiti oppure disattiva il Kill switch da questo menu."
  ja: "トンネルが通信を運べなかったため、URnetwork がトンネルを終了しました。キルスイッチがオンのため、このコンピューターはブロックされたままで、漏洩はありません。再接続するか、このメニューからキルスイッチをオフにしてください。"
  ko: "터널이 트래픽을 전달하지 못해 URnetwork가 터널을 종료했습니다. 킬 스위치가 켜져 있어 이 컴퓨터는 계속 차단되며 유출은 없습니다. 다시 연결하거나 이 메뉴에서 킬 스위치를 끄세요."
  nl: "De tunnel kon geen verkeer vervoeren, dus heeft URnetwork hem uitgeschakeld. De Kill switch staat aan, dus deze computer blijft geblokkeerd en er lekt niets. Maak opnieuw verbinding of zet de Kill switch uit via dit menu."
  pl: "Tunel nie mógł przenosić ruchu, więc URnetwork go wyłączył. Kill switch jest włączony, więc ten komputer pozostaje zablokowany i nic nie wycieka. Połącz się ponownie albo wyłącz Kill switch w tym menu."
  pt: "O túnel não conseguia transportar tráfego, então a URnetwork o encerrou. O Kill switch está ativado, então este computador continua bloqueado e nada está vazando. Conecte-se de novo ou desative o Kill switch neste menu."
  pt-BR: "O túnel não conseguia transportar tráfego, então a URnetwork o encerrou. O Kill switch está ativado, então este computador continua bloqueado e nada está vazando. Conecte-se de novo ou desative o Kill switch neste menu."
  pt-PT: "O túnel não conseguia transportar tráfego, por isso a URnetwork encerrou-o. O Kill switch está ativado, por isso este computador continua bloqueado e não há fugas. Volte a ligar ou desative o Kill switch neste menu."
  ru: "Туннель не мог передавать трафик, поэтому URnetwork его отключил. Kill switch включён, поэтому этот компьютер остаётся заблокированным и утечек нет. Подключитесь снова или выключите Kill switch в этом меню."
  sv: "Tunneln kunde inte föra trafik, så URnetwork stängde av den. Kill switch är på, så den här datorn förblir blockerad och inget läcker. Anslut igen, eller stäng av Kill switch i den här menyn."
  sw: "Handaki halikuweza kubeba trafiki, kwa hivyo URnetwork ililizima. Kill switch imewashwa, kwa hivyo kompyuta hii inabaki imezuiwa na hakuna kinachovuja. Unganisha tena, au zima Kill switch kutoka kwenye menyu hii."
  th: "อุโมงค์รับส่งทราฟฟิกไม่ได้ URnetwork จึงปิดอุโมงค์ไป สวิตช์หยุดการเชื่อมต่อเปิดอยู่ คอมพิวเตอร์เครื่องนี้จึงยังถูกบล็อกและไม่มีข้อมูลรั่วไหล เชื่อมต่อใหม่ หรือปิดสวิตช์หยุดการเชื่อมต่อจากเมนูนี้"
  uk: "Тунель не міг передавати трафік, тож URnetwork його вимкнув. Kill switch увімкнено, тож цей комп’ютер залишається заблокованим і витоків немає. Підключіться знову або вимкніть Kill switch у цьому меню."
  vi: "Đường hầm không thể truyền lưu lượng nên URnetwork đã tắt nó. Kill switch đang bật, vì vậy máy tính này vẫn bị chặn và không có gì bị rò rỉ. Hãy kết nối lại, hoặc tắt Kill switch trong menu này."
  zh: "隧道无法传输流量，因此 URnetwork 已将其关闭。断网保护已开启，因此这台电脑仍处于阻断状态，没有发生任何泄漏。请重新连接，或在此菜单中关闭断网保护。"
  zh-HK: "隧道無法傳輸流量，因此 URnetwork 已將其關閉。斷線開關已開啟，因此這部電腦仍然被封鎖，沒有任何洩漏。請重新連線，或在此選單中關閉斷線開關。"
