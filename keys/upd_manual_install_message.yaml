description: "Windows update banner when the installer could not be started: the user runs it by hand. Explorer is the Windows file manager."
source: "The installer didn't start (it needs administrator approval). The verified download was shown in Explorer — quit the app and run it."
platforms:
  - windows
localizations:
  ar: "لم يبدأ المثبّت (يحتاج إلى موافقة المسؤول). عُرض الملف الذي تم التحقق منه في مستكشف الملفات — أغلق التطبيق وشغّله."
  cs: "Instalační program se nespustil (vyžaduje schválení správcem). Ověřený soubor se zobrazil v Průzkumníku souborů – ukončete aplikaci a spusťte ho."
  de: "Das Installationsprogramm wurde nicht gestartet (es braucht eine Administratorfreigabe). Der geprüfte Download wurde im Explorer angezeigt – beende die App und führe es aus."
  el: "Το πρόγραμμα εγκατάστασης δεν ξεκίνησε (χρειάζεται έγκριση διαχειριστή). Η επαληθευμένη λήψη εμφανίστηκε στην Εξερεύνηση αρχείων — κλείστε την εφαρμογή και εκτελέστε το."
  en: "The installer didn't start (it needs administrator approval). The verified download was shown in Explorer — quit the app and run it."
  es: "El instalador no se inició (necesita la aprobación de un administrador). La descarga verificada se mostró en el Explorador de archivos: cierra la app y ejecútalo."
  es-419: "El instalador no se inició (necesita la aprobación de un administrador). La descarga verificada se mostró en el Explorador de archivos: cierra la app y ejecútalo."
  es-MX: "El instalador no se inició (necesita la aprobación de un administrador). La descarga verificada se mostró en el Explorador de archivos: cierra la app y ejecútalo."
  fr: "Le programme d’installation n’a pas démarré (il nécessite l’approbation d’un administrateur). Le téléchargement vérifié a été affiché dans l’Explorateur de fichiers — quittez l’application et lancez-le."
  he: "תוכנית ההתקנה לא הופעלה (היא צריכה אישור של מנהל). ההורדה שאומתה הוצגה בסייר הקבצים — צאו מהאפליקציה והריצו אותה."
  hi: "इंस्टॉलर शुरू नहीं हुआ (इसे व्यवस्थापक की मंज़ूरी चाहिए)। सत्यापित डाउनलोड फ़ाइल एक्सप्लोरर में दिखाया गया — ऐप बंद करें और उसे चलाएँ।"
  id: "Penginstal tidak berjalan (perlu persetujuan administrator). Unduhan yang sudah diverifikasi ditampilkan di File Explorer — tutup aplikasi dan jalankan penginstal itu."
  it: "Il programma di installazione non è partito (serve l’approvazione di un amministratore). Il download verificato è stato mostrato in Esplora file — chiudi l’app ed eseguilo."
  ja: "インストーラーが起動しませんでした(管理者の承認が必要です)。検証済みのダウンロードをエクスプローラーで表示しました — アプリを終了してから実行してください。"
  ko: "설치 프로그램이 시작되지 않았습니다(관리자 승인이 필요합니다). 확인된 다운로드를 파일 탐색기에 표시했습니다 — 앱을 종료한 뒤 실행하세요."
  nl: "Het installatieprogramma is niet gestart (het heeft goedkeuring van een beheerder nodig). De gecontroleerde download is getoond in Verkenner – sluit de app af en voer het uit."
  pl: "Instalator się nie uruchomił (wymaga zgody administratora). Zweryfikowany plik został pokazany w Eksploratorze plików — zamknij aplikację i uruchom go."
  pt: "O instalador não foi iniciado (ele precisa da aprovação de um administrador). O download verificado foi mostrado no Explorador de Arquivos — feche o app e execute-o."
  pt-BR: "O instalador não foi iniciado (ele precisa da aprovação de um administrador). O download verificado foi mostrado no Explorador de Arquivos — feche o app e execute-o."
  pt-PT: "O instalador não foi iniciado (precisa da aprovação de um administrador). A transferência verificada foi mostrada no Explorador de Ficheiros — feche a app e execute-o."
  ru: "Установщик не запустился (нужно одобрение администратора). Проверенный файл показан в Проводнике — закройте приложение и запустите его."
  sv: "Installationsprogrammet startade inte (det kräver administratörsgodkännande). Den verifierade nedladdningen visades i Utforskaren – avsluta appen och kör den."
  sw: "Kisakinishi hakikuanza (kinahitaji idhini ya msimamizi). Faili lililothibitishwa lilionyeshwa kwenye File Explorer — funga programu kisha ukiendeshe."
  th: "ตัวติดตั้งไม่เริ่มทำงาน (ต้องได้รับการอนุมัติจากผู้ดูแลระบบ) แสดงไฟล์ที่ตรวจสอบแล้วใน File Explorer แล้ว — ปิดแอปแล้วเรียกใช้ไฟล์นั้น"
  uk: "Інсталятор не запустився (потрібне схвалення адміністратора). Перевірений файл показано в Провіднику — закрийте застосунок і запустіть його."
  vi: "Trình cài đặt không khởi chạy (cần quản trị viên phê duyệt). Tệp tải về đã xác minh đã được hiển thị trong File Explorer — hãy thoát ứng dụng và chạy nó."
  zh: "安装程序未能启动（需要管理员批准）。已在文件资源管理器中显示验证过的下载文件 — 请退出应用后运行它。"
  zh-HK: "安裝程式未能啟動（需要管理員批准）。已在檔案總管中顯示驗證過的下載檔案 — 請結束應用程式後執行它。"
