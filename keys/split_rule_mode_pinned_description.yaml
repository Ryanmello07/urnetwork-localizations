description: "Split rule editor: description of the Keep on one provider mode."
source: "Selected hosts hold their provider longer instead of being moved at the first sign of trouble, so the site changes IP addresses less often mid-session."
platforms:
  - apple
localizations:
  ar: "يحتفظ المضيفون المحددون بمزودهم مدة أطول بدلًا من نقلهم عند أول بادرة مشكلة، فيقل تغيّر عنوان IP للموقع أثناء الجلسة."
  cs: "Vybraní hostitelé si svého poskytovatele drží déle, místo aby byli přesunuti při prvních potížích, takže web během relace méně často mění IP adresu."
  de: "Ausgewählte Hosts behalten ihren Anbieter länger, statt beim ersten Anzeichen von Problemen verschoben zu werden, sodass die Website während einer Sitzung seltener die IP-Adresse wechselt."
  el: "Οι επιλεγμένοι hosts κρατούν τον πάροχό τους περισσότερο αντί να μετακινούνται με το πρώτο σημάδι προβλήματος, ώστε ο ιστότοπος να αλλάζει διεύθυνση IP λιγότερο συχνά κατά τη συνεδρία."
  en: "Selected hosts hold their provider longer instead of being moved at the first sign of trouble, so the site changes IP addresses less often mid-session."
  es: "Los hosts seleccionados mantienen su proveedor durante más tiempo en vez de moverse a la primera señal de problemas, así el sitio cambia de dirección IP con menos frecuencia durante la sesión."
  es-419: "Los hosts seleccionados mantienen su proveedor durante más tiempo en vez de moverse a la primera señal de problemas, así el sitio cambia de dirección IP con menos frecuencia durante la sesión."
  es-MX: "Los hosts seleccionados mantienen su proveedor durante más tiempo en vez de moverse a la primera señal de problemas, así el sitio cambia de dirección IP con menos frecuencia durante la sesión."
  fr: "Les hôtes sélectionnés gardent leur fournisseur plus longtemps au lieu d’être déplacés au premier signe de problème, de sorte que le site change moins souvent d’adresse IP en cours de session."
  he: "המארחים שנבחרו נשארים אצל הספק שלהם זמן רב יותר במקום לעבור בסימן הראשון לבעיה, כך שהאתר מחליף כתובת IP לעיתים רחוקות יותר במהלך ההפעלה."
  hi: "चयनित होस्ट समस्या के पहले संकेत पर हटाए जाने के बजाय अपने प्रदाता को ज़्यादा देर तक बनाए रखते हैं, ताकि सत्र के दौरान साइट कम बार IP पता बदले।"
  id: "Host yang dipilih mempertahankan penyedianya lebih lama alih-alih dipindahkan saat muncul tanda masalah pertama, sehingga situs lebih jarang berganti alamat IP selama sesi."
  it: "Gli host selezionati mantengono il loro provider più a lungo invece di essere spostati al primo segno di problemi, così il sito cambia indirizzo IP meno spesso durante la sessione."
  ja: "選択したホストは、問題の兆候が出た時点ですぐに移されるのではなく、同じプロバイダーをより長く使い続けるため、セッション中にサイトの IP アドレスが変わる頻度が下がります。"
  ko: "선택한 호스트는 문제의 첫 징후에 바로 옮겨지는 대신 제공업체를 더 오래 유지하므로, 세션 중에 사이트의 IP 주소가 덜 자주 바뀝니다."
  nl: "Geselecteerde hosts houden hun provider langer vast in plaats van bij het eerste teken van problemen te worden verplaatst, zodat de site tijdens een sessie minder vaak van IP-adres wisselt."
  pl: "Wybrane hosty dłużej zostają przy swoim dostawcy, zamiast być przenoszone przy pierwszych oznakach problemów, więc witryna rzadziej zmienia adres IP w trakcie sesji."
  pt: "Os hosts selecionados mantêm seu provedor por mais tempo em vez de serem movidos ao primeiro sinal de problema, para que o site troque de endereço IP com menos frequência durante a sessão."
  pt-BR: "Os hosts selecionados mantêm seu provedor por mais tempo em vez de serem movidos ao primeiro sinal de problema, para que o site troque de endereço IP com menos frequência durante a sessão."
  pt-PT: "Os hosts selecionados mantêm o seu fornecedor durante mais tempo em vez de serem movidos ao primeiro sinal de problemas, para que o site mude de endereço IP com menos frequência durante a sessão."
  ru: "Выбранные хосты дольше остаются у своего провайдера, а не переносятся при первых признаках проблем, поэтому сайт реже меняет IP-адрес во время сессии."
  sv: "Valda värdar behåller sin leverantör längre i stället för att flyttas vid första tecken på problem, så att webbplatsen byter IP-adress mer sällan under en session."
  sw: "Vikoa vilivyochaguliwa hukaa na mtoa huduma wake kwa muda mrefu zaidi badala ya kuhamishwa kwenye ishara ya kwanza ya tatizo, kwa hivyo tovuti hubadilisha anwani ya IP mara chache wakati wa kipindi."
  th: "โฮสต์ที่เลือกจะคงผู้ให้บริการเดิมไว้นานขึ้นแทนที่จะถูกย้ายทันทีที่มีสัญญาณปัญหาแรก เว็บไซต์จึงเปลี่ยนที่อยู่ IP น้อยลงระหว่างเซสชัน"
  uk: "Вибрані хости довше залишаються у свого провайдера замість переносу за перших ознак проблем, тож сайт рідше змінює IP-адресу під час сесії."
  vi: "Các host đã chọn giữ nhà cung cấp của chúng lâu hơn thay vì bị chuyển đi ngay khi có dấu hiệu sự cố đầu tiên, nhờ đó trang web ít đổi địa chỉ IP hơn trong phiên."
  zh: "所选主机会更长时间保留其提供商，而不是一出现问题迹象就被迁移，因此网站在会话中更换 IP 地址的频率更低。"
  zh-HK: "已選主機會更長時間保留其供應商，而不是一出現問題跡象就被轉移，因此網站在工作階段中更換 IP 位址的次數會較少。"
