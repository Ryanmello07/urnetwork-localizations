description: "Earnings screen, the payout card before setup, under its title and above the Set up payouts button. Read before the one tap: what the tap does and the one risk. Set up payouts is the button's label; keep it recognizable as that label."
source: "URnetwork is not a wallet. Set up payouts creates a Bittensor key on this device, and your whole network's SN25α is paid to it. Back up its recovery phrase: if you lose this device before saving it, your SN25α can't be reached."
platforms:
  - apple
  - android
localizations:
  ar: "URnetwork ليس محفظة. يُنشئ «إعداد المدفوعات» مفتاح Bittensor على هذا الجهاز، ويُدفع إليه SN25α الخاص بشبكتك بأكملها. احفظ عبارة النسخ الاحتياطي الخاصة بالمفتاح: إذا فقدت هذا الجهاز قبل حفظها، فلن يمكن الوصول إلى SN25α الخاص بك."
  cs: "URnetwork není peněženka. „Nastavit výplaty“ vytvoří na tomto zařízení klíč Bittensor a na něj se bude vyplácet SN25α celé vaší sítě. Zálohujte obnovovací frázi klíče: pokud toto zařízení ztratíte dřív, než ji uložíte, k vašemu SN25α se nebude možné dostat."
  de: "URnetwork ist keine Wallet. „Auszahlungen einrichten“ erstellt auf diesem Gerät einen Bittensor-Schlüssel, und das SN25α deines gesamten Netzwerks wird an diesen Schlüssel ausgezahlt. Sichere die Wiederherstellungsphrase des Schlüssels: Wenn du dieses Gerät verlierst, bevor du sie gespeichert hast, ist dein SN25α nicht mehr erreichbar."
  el: "Το URnetwork δεν είναι πορτοφόλι. Η «Ρύθμιση πληρωμών» δημιουργεί ένα κλειδί Bittensor σε αυτή τη συσκευή, και τα SN25α ολόκληρου του δικτύου σας πληρώνονται σε αυτό. Δημιουργήστε αντίγραφο ασφαλείας της φράσης επαναφοράς του κλειδιού: αν χάσετε αυτή τη συσκευή πριν αποθηκεύσετε τη φράση, δεν θα είναι δυνατή η πρόσβαση στα SN25α σας."
  en: "URnetwork is not a wallet. Set up payouts creates a Bittensor key on this device, and your whole network's SN25α is paid to it. Back up its recovery phrase: if you lose this device before saving it, your SN25α can't be reached."
  es: "URnetwork no es una billetera. «Configurar pagos» crea una clave de Bittensor en este dispositivo, y el SN25α de toda tu red se paga en ella. Haz una copia de seguridad de la frase de recuperación de la clave: si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-419: "URnetwork no es una billetera. \"Configurar pagos\" crea una clave de Bittensor en este dispositivo, y el SN25α de toda tu red se paga en ella. Haz una copia de seguridad de la frase de recuperación de la clave: si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  es-MX: "URnetwork no es una cartera. \"Configurar pagos\" crea una clave de Bittensor en este dispositivo, y el SN25α de toda tu red se paga en ella. Haz una copia de seguridad de la frase de recuperación de la clave: si pierdes este dispositivo antes de guardarla, no se podrá acceder a tu SN25α."
  fr: "URnetwork n’est pas un portefeuille. « Configurer les paiements » crée une clé Bittensor sur cet appareil, et les SN25α de tout votre réseau y sont versés. Gardez une copie de la phrase de sauvegarde de la clé : si vous perdez cet appareil avant de l’avoir enregistrée, vos SN25α seront inaccessibles."
  he: "URnetwork אינו ארנק. \"הגדרת תשלומים\" יוצרת מפתח Bittensor במכשיר הזה, וה-SN25α של כל הרשת שלכם משולם אליו. גבו את ביטוי השחזור של המפתח: אם תאבדו את המכשיר הזה לפני שתשמרו את הביטוי, לא תהיה גישה ל-SN25α שלכם."
  hi: "URnetwork वॉलेट नहीं है। “भुगतान सेट करें” इस डिवाइस पर एक Bittensor कुंजी बनाता है, और आपके पूरे नेटवर्क के SN25α का भुगतान उसी कुंजी पर होता है। कुंजी के रिकवरी फ़्रेज़ का बैकअप लें: अगर आप फ़्रेज़ सहेजने से पहले यह डिवाइस खो देते हैं, तो आपके SN25α तक पहुँचा नहीं जा सकेगा।"
  id: "URnetwork bukan dompet. “Siapkan pembayaran” membuat kunci Bittensor di perangkat ini, dan SN25α seluruh jaringan Anda dibayarkan ke kunci itu. Simpan frasa cadangan kunci itu: jika Anda kehilangan perangkat ini sebelum menyimpan frasa tersebut, SN25α Anda tidak dapat diakses."
  it: "URnetwork non è un portafoglio. «Configura i pagamenti» crea una chiave Bittensor su questo dispositivo, e gli SN25α di tutta la tua rete vengono pagati su di essa. Fai il backup della frase di recupero della chiave: se perdi questo dispositivo prima di averla salvata, i tuoi SN25α non saranno più accessibili."
  ja: "URnetwork はウォレットではありません。「支払いを設定」で、このデバイスに Bittensor キーが作成され、ネットワーク全体の SN25α がそのキーに支払われます。キーの復元フレーズをバックアップしてください。復元フレーズを保存する前にこのデバイスをなくすと、SN25α にアクセスできなくなります。"
  ko: "URnetwork는 지갑이 아닙니다. '지급 설정'은 이 기기에 Bittensor 키를 만들며, 네트워크 전체의 SN25α는 이 키로 지급됩니다. 키의 복구 문구를 백업하세요. 복구 문구를 저장하기 전에 이 기기를 잃어버리면 SN25α에 접근할 수 없습니다."
  nl: "URnetwork is geen wallet. ‘Uitbetalingen instellen’ maakt een Bittensor-sleutel op dit apparaat, en de SN25α van je hele netwerk wordt aan die sleutel uitbetaald. Maak een back-up van de herstelzin van de sleutel: als je dit apparaat kwijtraakt voordat je de herstelzin hebt opgeslagen, is je SN25α niet meer bereikbaar."
  pl: "URnetwork nie jest portfelem. „Skonfiguruj wypłaty” tworzy na tym urządzeniu klucz Bittensor, a SN25α całej twojej sieci są na niego wypłacane. Utwórz kopię zapasową frazy odzyskiwania klucza: jeśli stracisz to urządzenie, zanim ją zapiszesz, do twoich SN25α nie będzie można się dostać."
  pt: "O URnetwork não é uma carteira. \"Configurar pagamentos\" cria uma chave Bittensor neste dispositivo, e o SN25α de toda a sua rede é pago nela. Faça uma cópia de segurança da frase de recuperação da chave: se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  pt-BR: "O URnetwork não é uma carteira. \"Configurar pagamentos\" cria uma chave Bittensor neste dispositivo, e o SN25α de toda a sua rede é pago nela. Faça backup da frase de recuperação da chave: se você perder este dispositivo antes de salvá-la, não será possível acessar seu SN25α."
  pt-PT: "O URnetwork não é uma carteira. \"Configurar pagamentos\" cria uma chave Bittensor neste dispositivo, e o SN25α de toda a sua rede é pago nela. Faça uma cópia de segurança da frase de recuperação da chave: se perder este dispositivo antes de a guardar, não será possível aceder ao seu SN25α."
  ru: "URnetwork не является кошельком. «Настроить выплаты» создаёт на этом устройстве ключ Bittensor, и на него выплачиваются SN25α всей вашей сети. Создайте резервную копию фразы восстановления ключа: если вы потеряете это устройство, не сохранив её, получить доступ к вашим SN25α будет невозможно."
  sv: "URnetwork är inte en plånbok. ”Konfigurera utbetalningar” skapar en Bittensor-nyckel på den här enheten, och hela ditt nätverks SN25α betalas ut till den. Säkerhetskopiera nyckelns återställningsfras: om du förlorar den här enheten innan du har sparat frasen går det inte att komma åt dina SN25α."
  sw: "URnetwork si pochi. “Sanidi malipo” inaunda ufunguo wa Bittensor kwenye kifaa hiki, na SN25α ya mtandao wako wote inalipwa kwenye ufunguo huo. Hifadhi nakala ya kifungu cha urejeshaji cha ufunguo huo: ukipoteza kifaa hiki kabla ya kuhifadhi kifungu hicho, SN25α yako haitaweza kufikiwa."
  th: "URnetwork ไม่ใช่กระเป๋าเงิน “ตั้งค่าการจ่าย” จะสร้างคีย์ Bittensor บนอุปกรณ์นี้ และ SN25α ของทั้งเครือข่ายของคุณจะจ่ายเข้าคีย์นี้ บันทึกวลีสำรองของคีย์นี้เก็บไว้ หากคุณทำอุปกรณ์นี้หายก่อนบันทึกวลีนี้ จะไม่สามารถเข้าถึง SN25α ของคุณได้"
  uk: "URnetwork не є гаманцем. «Налаштувати виплати» створює на цьому пристрої ключ Bittensor, і на нього виплачуються SN25α всієї вашої мережі. Створіть резервну копію фрази відновлення ключа: якщо ви втратите цей пристрій, не зберігши її, отримати доступ до ваших SN25α буде неможливо."
  vi: "URnetwork không phải là ví. “Thiết lập thanh toán” sẽ tạo một khóa Bittensor trên thiết bị này, và SN25α của toàn bộ mạng của bạn được trả vào khóa đó. Hãy lưu lại cụm từ sao lưu của khóa: nếu bạn mất thiết bị này trước khi lưu cụm từ đó, sẽ không thể truy cập SN25α của bạn."
  zh: "URnetwork 不是钱包。“设置支付”会在这台设备上创建一个 Bittensor 密钥，您整个网络的 SN25α 都会支付到该密钥。请备份该密钥的恢复短语：如果您在保存恢复短语之前丢失这台设备，您的 SN25α 将无法访问。"
  zh-HK: "URnetwork 不是錢包。「設定支付」會在這部裝置上建立一個 Bittensor 金鑰，你整個網絡的 SN25α 都會支付到該金鑰。請備份此金鑰的復原短語：如果你在儲存復原短語之前遺失這部裝置，你的 SN25α 將無法存取。"
