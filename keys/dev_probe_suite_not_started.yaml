description: "Developer page: report line when the probe suite could not start."
source: "Probe suite did not start: no live session, or one is already running."
platforms:
  - linux
localizations:
  ar: "لم تبدأ مجموعة الفحوص: لا توجد جلسة حيّة، أو هناك مجموعة قيد التشغيل بالفعل."
  cs: "Sada sond se nespustila: žádná aktivní relace, nebo už jedna běží."
  de: "Prüfreihe nicht gestartet: keine aktive Sitzung, oder es läuft bereits eine."
  el: "Η σειρά ελέγχων δεν ξεκίνησε: δεν υπάρχει ενεργή συνεδρία ή εκτελείται ήδη μία."
  en: "Probe suite did not start: no live session, or one is already running."
  es: "El conjunto de sondeos no se inició: no hay sesión activa o ya hay uno en ejecución."
  es-419: "El conjunto de sondeos no se inició: no hay sesión activa o ya hay uno en ejecución."
  es-MX: "El conjunto de sondeos no se inició: no hay sesión activa o ya hay uno en ejecución."
  fr: "La série de sondages n’a pas démarré : aucune session en cours, ou une série est déjà en cours."
  he: "סדרת הבדיקות לא התחילה: אין סשן פעיל, או שסדרה אחת כבר רצה."
  hi: "प्रोब सूट शुरू नहीं हुआ: कोई लाइव सत्र नहीं है, या एक पहले से चल रहा है।"
  id: "Rangkaian uji tidak dimulai: tidak ada sesi aktif, atau satu rangkaian sudah berjalan."
  it: "La batteria di sonde non è partita: nessuna sessione attiva, oppure ce n’è già una in esecuzione."
  ja: "確認スイートを開始できませんでした: 稼働中のセッションがないか、すでに 1 つ実行中です。"
  ko: "점검 세트를 시작하지 못했습니다: 활성 세션이 없거나 이미 하나가 실행 중입니다."
  nl: "Testreeks niet gestart: geen actieve sessie, of er loopt er al een."
  pl: "Zestaw sond się nie uruchomił: brak aktywnej sesji albo jeden już działa."
  pt: "A bateria de sondagens não arrancou: não há sessão ativa ou já há uma a correr."
  pt-BR: "A bateria de sondagens não começou: não há sessão ativa ou já existe uma em execução."
  pt-PT: "A bateria de sondagens não arrancou: não há sessão ativa ou já há uma a correr."
  ru: "Набор проверок не запущен: нет активного сеанса или один уже выполняется."
  sv: "Testsviten startade inte: ingen aktiv session, eller så körs redan en."
  sw: "Seti ya vipimo haikuanza: hakuna kipindi kinachoendelea, au moja tayari inaendeshwa."
  th: "ชุดการทดสอบไม่เริ่ม: ไม่มีเซสชันที่ใช้งานอยู่ หรือมีชุดหนึ่งทำงานอยู่แล้ว"
  uk: "Набір перевірок не запущено: немає активного сеансу або один уже виконується."
  vi: "Bộ thăm dò không khởi động: không có phiên đang hoạt động, hoặc đã có một bộ đang chạy."
  zh: "探测套件未启动：没有活动会话，或已有一个正在运行。"
  zh-HK: "探測套件未啟動：沒有使用中的工作階段，或已有一個正在執行。"
