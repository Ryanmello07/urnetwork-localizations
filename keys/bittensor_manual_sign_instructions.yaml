description: "Manual Bittensor wallet proof: how to sign the shown challenge message. The argument is the wallet product name (Talisman or TAO.com)."
source: "Sign this message with the %@ wallet that holds your coldkey, then paste the address and the signature below."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
placeholders:
  - name: wallet
    type: string
localizations:
  ar: "وقّع هذه الرسالة باستخدام محفظة {wallet} التي تملك مفتاحك البارد (coldkey)، ثم الصق العنوان والتوقيع أدناه."
  cs: "Podepište tuto zprávu peněženkou {wallet}, ve které máte svůj coldkey, a pak níže vložte adresu a podpis."
  de: "Signiere diese Nachricht mit der {wallet}-Wallet, die deinen Coldkey enthält, und füge dann unten die Adresse und die Signatur ein."
  el: "Υπογράψτε αυτό το μήνυμα με το πορτοφόλι {wallet} που περιέχει το coldkey σας και, στη συνέχεια, επικολλήστε παρακάτω τη διεύθυνση και την υπογραφή."
  en: "Sign this message with the {wallet} wallet that holds your coldkey, then paste the address and the signature below."
  es: "Firma este mensaje con la billetera {wallet} que contiene tu coldkey y luego pega abajo la dirección y la firma."
  es-419: "Firma este mensaje con la billetera {wallet} que tiene tu coldkey y luego pega abajo la dirección y la firma."
  es-MX: "Firma este mensaje con la cartera {wallet} que tiene tu coldkey y luego pega abajo la dirección y la firma."
  fr: "Signez ce message avec le portefeuille {wallet} qui détient votre coldkey, puis collez l’adresse et la signature ci-dessous."
  he: "חתמו על ההודעה הזו בארנק {wallet} שמחזיק את ה-coldkey שלכם, ואז הדביקו למטה את הכתובת ואת החתימה."
  hi: "इस संदेश पर उस {wallet} वॉलेट से साइन करें जिसमें आपकी coldkey है, फिर नीचे पता और हस्ताक्षर पेस्ट करें।"
  id: "Tanda tangani pesan ini dengan dompet {wallet} yang menyimpan coldkey Anda, lalu tempel alamat dan tanda tangannya di bawah."
  it: "Firma questo messaggio con il portafoglio {wallet} che contiene la tua coldkey, poi incolla qui sotto l’indirizzo e la firma."
  ja: "coldkey を保管している {wallet} ウォレットでこのメッセージに署名し、アドレスと署名を下に貼り付けてください。"
  ko: "coldkey가 있는 {wallet} 지갑으로 이 메시지에 서명한 다음, 아래에 주소와 서명을 붙여 넣으세요."
  nl: "Onderteken dit bericht met de {wallet}-wallet die je coldkey bevat en plak daarna hieronder het adres en de handtekening."
  pl: "Podpisz tę wiadomość portfelem {wallet}, w którym jest twój coldkey, a potem wklej poniżej adres i podpis."
  pt: "Assine esta mensagem com a carteira {wallet} que guarda a sua coldkey e, em seguida, cole o endereço e a assinatura abaixo."
  pt-BR: "Assine esta mensagem com a carteira {wallet} que guarda sua coldkey e depois cole o endereço e a assinatura abaixo."
  pt-PT: "Assine esta mensagem com a carteira {wallet} que guarda a sua coldkey e, em seguida, cole o endereço e a assinatura abaixo."
  ru: "Подпишите это сообщение в кошельке {wallet}, где хранится ваш coldkey, затем вставьте ниже адрес и подпись."
  sv: "Signera det här meddelandet med {wallet}-plånboken som innehåller din coldkey och klistra sedan in adressen och signaturen nedan."
  sw: "Tia sahihi ujumbe huu kwa pochi ya {wallet} inayoshikilia coldkey yako, kisha bandika anwani na sahihi hapa chini."
  th: "ลงนามข้อความนี้ด้วยกระเป๋าเงิน {wallet} ที่เก็บ coldkey ของคุณ แล้ววางที่อยู่และลายเซ็นด้านล่าง"
  uk: "Підпишіть це повідомлення гаманцем {wallet}, у якому зберігається ваш coldkey, а потім вставте нижче адресу й підпис."
  vi: "Hãy ký tin nhắn này bằng ví {wallet} đang giữ coldkey của bạn, rồi dán địa chỉ và chữ ký vào bên dưới."
  zh: "请使用持有您 coldkey 的 {wallet} 钱包签署此消息，然后在下方粘贴地址和签名。"
  zh-HK: "請使用存有你 coldkey 的 {wallet} 錢包簽署此訊息，然後在下方貼上地址和簽名。"
