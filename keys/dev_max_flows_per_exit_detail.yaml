description: "Developer tools screen: explanatory subtext under the 'max flows per exit' control."
source: "Losing an exit kills every connection on it. Lower spreads the damage; a site may then use more than one exit IP"
platforms:
  - android
  - linux
  - apple
localizations:
  ar: "فقدان مخرج يقطع كل الاتصالات عليه. القيمة الأقل توزّع الضرر؛ وقد يستخدم الموقع حينها أكثر من عنوان IP للخروج"
  cs: "Ztráta výstupu ukončí každé připojení na něm. Nižší hodnota rozloží škody; web pak může použít víc než jednu výstupní IP"
  de: "Fällt ein Exit weg, brechen alle Verbindungen darauf ab. Ein niedrigerer Wert verteilt den Schaden; eine Website nutzt dann womöglich mehr als eine Exit-IP"
  el: "Η απώλεια μιας εξόδου τερματίζει κάθε σύνδεση σε αυτήν. Χαμηλότερη τιμή μοιράζει τη ζημιά· ένας ιστότοπος μπορεί τότε να χρησιμοποιεί περισσότερες από μία IP εξόδου"
  en: "Losing an exit kills every connection on it. Lower spreads the damage; a site may then use more than one exit IP"
  es: "Perder una salida corta todas sus conexiones. Un valor más bajo reparte el daño; entonces un sitio puede usar más de una IP de salida"
  es-419: "Perder una salida corta todas sus conexiones. Un valor más bajo reparte el daño; entonces un sitio puede usar más de una IP de salida"
  es-MX: "Perder una salida corta todas sus conexiones. Un valor más bajo reparte el daño; entonces un sitio puede usar más de una IP de salida"
  fr: "Perdre une sortie coupe toutes ses connexions. Plus bas répartit les dégâts ; un site peut alors utiliser plusieurs IP de sortie"
  he: "אובדן של יציאה מנתק כל חיבור שעליה. ערך נמוך יותר מפזר את הנזק; אז אתר עשוי להשתמש ביותר מכתובת IP יוצאת אחת"
  hi: "एक एग्ज़िट खोने से उस पर का हर कनेक्शन खत्म हो जाता है। कम मान नुकसान को फैलाता है; तब कोई साइट एक से ज़्यादा एग्ज़िट IP इस्तेमाल कर सकती है"
  id: "Kehilangan satu exit memutus setiap koneksi di dalamnya. Nilai lebih rendah menyebarkan kerusakan; sebuah situs lalu bisa memakai lebih dari satu IP exit"
  it: "Perdere un’uscita interrompe tutte le connessioni su di essa. Un valore più basso distribuisce il danno; un sito può allora usare più di un IP di uscita"
  ja: "出口を失うと、その上の接続はすべて切れます。値を小さくすると被害が分散されますが、サイトが複数の出口 IP を使うことがあります"
  ko: "출구 하나를 잃으면 그 위의 모든 연결이 끊깁니다. 값이 낮을수록 피해가 분산되며, 이때 사이트가 출구 IP를 둘 이상 쓸 수 있습니다"
  nl: "Als een exit wegvalt, verbreekt dat elke verbinding erop. Lager spreidt de schade; een site kan dan meer dan één exit-IP gebruiken"
  pl: "Utrata wyjścia zrywa każde połączenie na nim. Niższa wartość rozkłada szkody; witryna może wtedy używać więcej niż jednego wyjściowego IP"
  pt: "Perder uma saída corta todas as ligações nela. Um valor mais baixo espalha o dano; um site pode então usar mais do que um IP de saída"
  pt-BR: "Perder uma saída derruba todas as conexões nela. Um valor menor espalha o dano; um site pode então usar mais de um IP de saída"
  pt-PT: "Perder uma saída corta todas as ligações nela. Um valor mais baixo espalha o dano; um site pode então usar mais do que um IP de saída"
  ru: "Потеря выхода обрывает все его соединения. Меньшее значение распределяет ущерб; тогда сайт может использовать больше одного IP выхода"
  sv: "Att förlora en utgång dödar varje anslutning på den. Lägre sprider skadan; en webbplats kan då använda mer än en utgångs-IP"
  sw: "Kupoteza njia ya kutoka kunaua kila muunganisho ulio juu yake. Thamani ndogo hutawanya madhara; kisha tovuti inaweza kutumia zaidi ya IP moja ya kutokea"
  th: "การเสียทางออกหนึ่งแห่งจะตัดทุกการเชื่อมต่อบนทางออกนั้น ค่าที่ต่ำกว่าช่วยกระจายความเสียหาย แต่เว็บไซต์อาจใช้ IP ทางออกมากกว่าหนึ่งรายการ"
  uk: "Втрата виходу обриває всі з’єднання на ньому. Менше значення розподіляє шкоду; тоді сайт може використовувати більше ніж одну вихідну IP"
  vi: "Mất một điểm thoát sẽ cắt mọi kết nối trên đó. Giá trị thấp hơn sẽ dàn trải thiệt hại; khi đó một trang có thể dùng nhiều hơn một IP thoát"
  zh: "失去一个出口会中断其上的所有连接。数值越低，损失越分散；但站点可能因此使用多个出口 IP"
  zh-HK: "失去一個出口會中斷其上的所有連線。數值越低，損失越分散；但網站可能因此使用多於一個出口 IP"
