description: "Extender status when the operator's required test could not reach this device from the internet on TCP port 443, usually because a firewall rejects it or a router doesn't forward the port, and no family is active. The extender is an optional extra on top of providing, so this tells the user what it needs and that they can turn it off. 'Extender' names the Extender switch; use its label. The argument is the operator's technical reason."
source: "The internet can't reach this device on TCP port 443. Allow or forward TCP 443 (and UDP 443 and 4053), or turn Extender off: %@"
platforms:
  - apple
  - linux
  - windows
placeholders:
  - name: error
    type: string
localizations:
  ar: "لا يمكن الوصول إلى هذا الجهاز من الإنترنت عبر منفذ TCP رقم 443. اسمح بمنفذ TCP 443 أو وجّهه (وكذلك UDP 443 و4053)، أو أوقف الموسّع: {error}"
  cs: "Z internetu se k tomuto zařízení nelze dostat přes port TCP 443. Povolte nebo přesměrujte TCP 443 (a UDP 443 a 4053), nebo Extender vypněte: {error}"
  de: "Dieses Gerät ist aus dem Internet nicht über TCP-Port 443 erreichbar. Gib TCP 443 (und UDP 443 und 4053) frei oder leite sie weiter, oder schalte den Extender aus: {error}"
  el: "Η συσκευή δεν είναι προσβάσιμη από το διαδίκτυο στη θύρα TCP 443. Επιτρέψτε ή προωθήστε την TCP 443 (και τις UDP 443 και 4053) ή απενεργοποιήστε το «Επεκτατής»: {error}"
  en: "The internet can't reach this device on TCP port 443. Allow or forward TCP 443 (and UDP 443 and 4053), or turn Extender off: {error}"
  es: "Internet no puede llegar a este dispositivo por el puerto TCP 443. Permite o redirige TCP 443 (y UDP 443 y 4053), o desactiva el Extensor: {error}"
  es-419: "Internet no puede llegar a este dispositivo por el puerto TCP 443. Permite o redirige TCP 443 (y UDP 443 y 4053), o desactiva el Extensor: {error}"
  es-MX: "Internet no puede llegar a este dispositivo por el puerto TCP 443. Permite o redirige TCP 443 (y UDP 443 y 4053), o desactiva el Extensor: {error}"
  fr: "Internet ne peut pas joindre cet appareil sur le port TCP 443. Autorisez ou redirigez TCP 443 (ainsi qu'UDP 443 et 4053), ou désactivez l'Extendeur : {error}"
  he: "לא ניתן להגיע למכשיר הזה מהאינטרנט דרך פורט TCP 443. אפשרו או העבירו את TCP 443 (וגם UDP 443 ו-4053), או כבו את המרחיב: {error}"
  hi: "इंटरनेट से इस डिवाइस तक TCP पोर्ट 443 पर नहीं पहुँचा जा सकता। TCP 443 (और UDP 443 व 4053) की अनुमति दें या उन्हें फ़ॉरवर्ड करें, या एक्सटेंडर बंद करें: {error}"
  id: "Internet tidak dapat menjangkau perangkat ini di port TCP 443. Izinkan atau teruskan TCP 443 (serta UDP 443 dan 4053), atau matikan Extender: {error}"
  it: "Internet non riesce a raggiungere questo dispositivo sulla porta TCP 443. Consenti o inoltra TCP 443 (e UDP 443 e 4053), oppure disattiva l'Extender: {error}"
  ja: "インターネットからこのデバイスの TCP ポート 443 に接続できません。TCP 443（および UDP 443 と 4053）を許可または転送するか、エクステンダーをオフにしてください：{error}"
  ko: "인터넷에서 이 기기의 TCP 포트 443에 연결할 수 없습니다. TCP 443(및 UDP 443, 4053)을 허용하거나 포워딩하거나, 익스텐더를 끄세요: {error}"
  nl: "Dit apparaat is vanaf internet niet bereikbaar op TCP-poort 443. Sta TCP 443 (en UDP 443 en 4053) toe of stuur ze door, of zet de Extender uit: {error}"
  pl: "To urządzenie jest nieosiągalne z internetu na porcie TCP 443. Zezwól na TCP 443 (oraz UDP 443 i 4053) lub je przekieruj albo wyłącz Extender: {error}"
  pt: "A Internet não consegue chegar a este dispositivo na porta TCP 443. Permita ou encaminhe TCP 443 (e UDP 443 e 4053), ou desative o Extensor: {error}"
  pt-BR: "A internet não consegue alcançar este dispositivo na porta TCP 443. Permita ou encaminhe TCP 443 (e UDP 443 e 4053), ou desative o Extensor: {error}"
  pt-PT: "A Internet não consegue chegar a este dispositivo na porta TCP 443. Permita ou encaminhe TCP 443 (e UDP 443 e 4053), ou desative o Extensor: {error}"
  ru: "Из интернета нельзя подключиться к этому устройству через TCP-порт 443. Разрешите или перенаправьте TCP 443 (а также UDP 443 и 4053) либо выключите Экстендер: {error}"
  sv: "Internet kan inte nå den här enheten på TCP-port 443. Tillåt eller vidarebefordra TCP 443 (och UDP 443 och 4053), eller stäng av Extender: {error}"
  sw: "Intaneti haiwezi kufikia kifaa hiki kupitia mlango wa TCP 443. Ruhusu au elekeza TCP 443 (na UDP 443 na 4053), au zima Kipanuzi: {error}"
  th: "อินเทอร์เน็ตเข้าถึงอุปกรณ์นี้ผ่านพอร์ต TCP 443 ไม่ได้ อนุญาตหรือส่งต่อ TCP 443 (รวมถึง UDP 443 และ 4053) หรือปิดตัวขยาย: {error}"
  uk: "З інтернету неможливо під'єднатися до цього пристрою через TCP-порт 443. Дозвольте або перенаправте TCP 443 (а також UDP 443 і 4053) чи вимкніть Екстендер: {error}"
  vi: "Internet không thể kết nối tới thiết bị này qua cổng TCP 443. Hãy cho phép hoặc chuyển tiếp TCP 443 (cùng UDP 443 và 4053), hoặc tắt Bộ mở rộng: {error}"
  zh: "无法从互联网通过 TCP 端口 443 访问此设备。请允许或转发 TCP 443（以及 UDP 443 和 4053），或关闭扩展器：{error}"
  zh-HK: "無法從互聯網透過 TCP 連接埠 443 存取此裝置。請允許或轉發 TCP 443（以及 UDP 443 和 4053），或關閉擴展器：{error}"
