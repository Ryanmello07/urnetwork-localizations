description: "Connect error: the system service could not check whether the account may connect."
source: "The URnetwork system service could not check whether this account is allowed to connect, so it did not connect. Try again."
platforms:
  - linux
localizations:
  ar: "تعذّر على خدمة نظام URnetwork التحقق مما إذا كان هذا الحساب مسموحًا له بالاتصال، لذا لم تتصل. حاول مجددًا."
  cs: "Systémová služba URnetwork nemohla ověřit, zda se tento účet smí připojit, a tak se nepřipojila. Zkuste to znovu."
  de: "Der URnetwork-Systemdienst konnte nicht prüfen, ob dieses Konto sich verbinden darf, und hat deshalb nicht verbunden. Versuche es erneut."
  el: "Η υπηρεσία συστήματος URnetwork δεν μπόρεσε να ελέγξει αν αυτός ο λογαριασμός επιτρέπεται να συνδεθεί, οπότε δεν συνδέθηκε. Δοκιμάστε ξανά."
  en: "The URnetwork system service could not check whether this account is allowed to connect, so it did not connect. Try again."
  es: "El servicio del sistema de URnetwork no pudo comprobar si esta cuenta puede conectarse, así que no se conectó. Inténtalo de nuevo."
  es-419: "El servicio del sistema de URnetwork no pudo verificar si esta cuenta puede conectarse, así que no se conectó. Inténtalo de nuevo."
  es-MX: "El servicio del sistema de URnetwork no pudo comprobar si esta cuenta puede conectarse, así que no se conectó. Inténtalo de nuevo."
  fr: "Le service système URnetwork n’a pas pu vérifier si ce compte est autorisé à se connecter, il ne s’est donc pas connecté. Réessayez."
  he: "שירות המערכת של URnetwork לא הצליח לבדוק אם החשבון הזה רשאי להתחבר, ולכן לא התחבר. נסו שוב."
  hi: "URnetwork सिस्टम सेवा यह जाँच नहीं सकी कि इस खाते को कनेक्ट करने की अनुमति है या नहीं, इसलिए कनेक्ट नहीं हुआ। फिर से कोशिश करें।"
  id: "Layanan sistem URnetwork tidak dapat memeriksa apakah akun ini boleh terhubung, jadi tidak terhubung. Coba lagi."
  it: "Il servizio di sistema URnetwork non è riuscito a verificare se questo account può connettersi, quindi non si è connesso. Riprova."
  ja: "URnetwork のシステムサービスがこのアカウントの接続許可を確認できなかったため、接続しませんでした。もう一度お試しください。"
  ko: "URnetwork 시스템 서비스가 이 계정의 연결 허용 여부를 확인하지 못해 연결하지 않았습니다. 다시 시도하세요."
  nl: "De URnetwork-systeemdienst kon niet controleren of dit account mag verbinden en heeft daarom niet verbonden. Probeer het opnieuw."
  pl: "Usługa systemowa URnetwork nie mogła sprawdzić, czy to konto może się łączyć, więc nie połączyła. Spróbuj ponownie."
  pt: "O serviço do sistema URnetwork não conseguiu verificar se esta conta pode conectar, então não conectou. Tente de novo."
  pt-BR: "O serviço do sistema URnetwork não conseguiu verificar se esta conta pode conectar, então não conectou. Tente de novo."
  pt-PT: "O serviço de sistema URnetwork não conseguiu verificar se esta conta pode ligar, pelo que não ligou. Tente novamente."
  ru: "Системная служба URnetwork не смогла проверить, разрешено ли этой учётной записи подключаться, поэтому подключения не было. Попробуйте ещё раз."
  sv: "URnetworks systemtjänst kunde inte kontrollera om det här kontot får ansluta, så den anslöt inte. Försök igen."
  sw: "Huduma ya mfumo ya URnetwork haikuweza kuangalia ikiwa akaunti hii inaruhusiwa kuunganisha, kwa hivyo haikuunganisha. Jaribu tena."
  th: "บริการระบบของ URnetwork ตรวจสอบไม่ได้ว่าบัญชีนี้ได้รับอนุญาตให้เชื่อมต่อหรือไม่ จึงไม่ได้เชื่อมต่อ ลองอีกครั้ง"
  uk: "Системна служба URnetwork не змогла перевірити, чи дозволено цьому обліковому запису підключатися, тому підключення не було. Спробуйте ще раз."
  vi: "Dịch vụ hệ thống URnetwork không thể kiểm tra tài khoản này có được phép kết nối hay không, nên đã không kết nối. Hãy thử lại."
  zh: "URnetwork 系统服务无法检查此账户是否允许连接，因此未连接。请重试。"
  zh-HK: "URnetwork 系統服務無法檢查此帳戶是否允許連線，因此未連線。請重試。"
