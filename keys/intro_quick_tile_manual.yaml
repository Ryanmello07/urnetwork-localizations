description: "Manual steps for adding the quick connect tile on Android versions without the system add-tile request (before Android 13)."
source: "Open Quick Settings, tap the pencil, and drag URnetwork into place."
platforms:
  - android
  - apple
localizations:
  ar: "افتح الإعدادات السريعة، واضغط على رمز القلم، ثم اسحب URnetwork إلى مكانه."
  cs: "Otevřete Rychlé nastavení, klepněte na tužku a přetáhněte URnetwork na místo."
  de: "Öffne die Schnelleinstellungen, tippe auf den Stift und ziehe URnetwork an die gewünschte Stelle."
  el: "Ανοίξτε τις Γρήγορες ρυθμίσεις, πατήστε το μολύβι και σύρετε το URnetwork στη θέση του."
  en: "Open Quick Settings, tap the pencil, and drag URnetwork into place."
  es: "Abre Ajustes rápidos, toca el lápiz y arrastra URnetwork a su sitio."
  es-419: "Abre la Configuración rápida, toca el lápiz y arrastra URnetwork a su lugar."
  es-MX: "Abre la Configuración rápida, toca el lápiz y arrastra URnetwork a su lugar."
  fr: "Ouvrez les Réglages rapides, touchez le crayon et faites glisser URnetwork à sa place."
  he: "פתחו את ההגדרות המהירות, הקישו על העיפרון וגררו את URnetwork למקומו."
  hi: "क्विक सेटिंग खोलें, पेंसिल पर टैप करें, और URnetwork को उसकी जगह खींचें।"
  id: "Buka Setelan Cepat, ketuk pensil, lalu seret URnetwork ke tempatnya."
  it: "Apri le Impostazioni rapide, tocca la matita e trascina URnetwork al suo posto."
  ja: "クイック設定を開き、鉛筆アイコンをタップして、URnetwork を配置したい場所にドラッグします。"
  ko: "빠른 설정을 열고 연필 아이콘을 탭한 다음 URnetwork를 원하는 위치로 끌어다 놓으세요."
  nl: "Open Snelle instellingen, tik op het potlood en sleep URnetwork op zijn plek."
  pl: "Otwórz Szybkie ustawienia, dotknij ołówka i przeciągnij URnetwork na miejsce."
  pt: "Abra as Definições rápidas, toque no lápis e arraste a URnetwork para o lugar."
  pt-BR: "Abra as Configurações rápidas, toque no lápis e arraste a URnetwork para o lugar."
  pt-PT: "Abra as Definições rápidas, toque no lápis e arraste a URnetwork para o lugar."
  ru: "Откройте быстрые настройки, нажмите на значок карандаша и перетащите URnetwork на нужное место."
  sv: "Öppna snabbinställningarna, tryck på pennan och dra URnetwork på plats."
  sw: "Fungua Mipangilio ya Haraka, gusa penseli, na uburute URnetwork hadi mahali pake."
  th: "เปิดการตั้งค่าด่วน แตะรูปดินสอ แล้วลาก URnetwork ไปวางในตำแหน่ง"
  uk: "Відкрийте Швидкі налаштування, торкніться олівця й перетягніть URnetwork на місце."
  vi: "Mở Cài đặt nhanh, chạm vào biểu tượng bút chì và kéo URnetwork vào vị trí."
  zh: "打开快捷设置，点按铅笔图标，然后将 URnetwork 拖到所需位置。"
  zh-HK: "開啟快速設定，點按鉛筆圖示，然後將 URnetwork 拖到所需位置。"
