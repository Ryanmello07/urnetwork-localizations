description: "Footer of the client transport mode section."
source: "The transport this device uses to reach providers. Auto tries the enabled transports in preference order and keeps every healthy transport of the same tier connected in parallel."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "بروتوكول النقل الذي يستخدمه هذا الجهاز للوصول إلى المزودين. يجرّب الوضع «تلقائي» بروتوكولات النقل المفعّلة حسب ترتيب الأفضلية، ويُبقي كل بروتوكولات النقل السليمة من الفئة نفسها متصلة بالتوازي."
  cs: "Transport, kterým se toto zařízení dostává k poskytovatelům. Auto zkouší zapnuté transporty podle priority a drží paralelně připojené všechny funkční transporty stejné úrovně."
  de: "Der Transport, über den dieses Gerät Anbieter erreicht. „Automatisch“ probiert die aktivierten Transporte in der Reihenfolge der Präferenz aus und hält alle funktionierenden Transporte derselben Stufe parallel verbunden."
  el: "Η μεταφορά που χρησιμοποιεί αυτή η συσκευή για να φτάσει στους παρόχους. Η Αυτόματη λειτουργία δοκιμάζει τις ενεργές μεταφορές με σειρά προτίμησης και κρατά παράλληλα συνδεδεμένες όλες τις υγιείς μεταφορές της ίδιας βαθμίδας."
  en: "The transport this device uses to reach providers. Auto tries the enabled transports in preference order and keeps every healthy transport of the same tier connected in parallel."
  es: "El transporte que usa este dispositivo para llegar a los proveedores. «Automático» prueba los transportes activados por orden de preferencia y mantiene conectados en paralelo todos los transportes en buen estado del mismo nivel."
  es-419: "El transporte que usa este dispositivo para llegar a los proveedores. \"Automático\" prueba los transportes activados por orden de preferencia y mantiene conectados en paralelo todos los transportes en buen estado del mismo nivel."
  es-MX: "El transporte que usa este dispositivo para llegar a los proveedores. \"Automático\" prueba los transportes activados por orden de preferencia y mantiene conectados en paralelo todos los transportes en buen estado del mismo nivel."
  fr: "Le transport que cet appareil utilise pour joindre les fournisseurs. Le mode Auto essaie les transports activés par ordre de préférence et garde connectés en parallèle tous les transports en bon état du même niveau."
  he: "פרוטוקול ההעברה שבו המכשיר הזה משתמש כדי להגיע לספקים. המצב האוטומטי מנסה את פרוטוקולי ההעברה המופעלים לפי סדר עדיפות ושומר במקביל על חיבור של כל פרוטוקולי ההעברה התקינים מאותה דרגה."
  hi: "वह ट्रांसपोर्ट जिससे यह डिवाइस प्रदाताओं तक पहुँचता है। ऑटो चालू ट्रांसपोर्ट को पसंद के क्रम में आज़माता है और एक ही स्तर के हर सही ट्रांसपोर्ट को समानांतर रूप से कनेक्ट रखता है।"
  id: "Transport yang dipakai perangkat ini untuk menjangkau penyedia. Otomatis mencoba transport yang diaktifkan sesuai urutan preferensi dan menjaga setiap transport sehat di tingkat yang sama tetap terhubung secara paralel."
  it: "Il trasporto che questo dispositivo usa per raggiungere i provider. Automatico prova i trasporti attivi in ordine di preferenza e mantiene connessi in parallelo tutti i trasporti funzionanti dello stesso livello."
  ja: "このデバイスがプロバイダーに接続するときに使うトランスポート。自動モードでは、有効なトランスポートを優先順に試し、同じ階層の正常なトランスポートをすべて並行して接続しておきます。"
  ko: "이 기기가 제공자에 연결할 때 사용하는 전송 방식입니다. 자동 모드는 켜진 전송 방식을 우선순위대로 시도하고, 같은 등급의 정상 전송 방식을 모두 병렬로 연결해 둡니다."
  nl: "Het transport dat dit apparaat gebruikt om providers te bereiken. Auto probeert de ingeschakelde transports op volgorde van voorkeur en houdt alle gezonde transports van hetzelfde niveau parallel verbonden."
  pl: "Transport, którego to urządzenie używa, aby docierać do dostawców. Auto próbuje włączonych transportów w kolejności preferencji i utrzymuje równolegle połączone wszystkie sprawne transporty z tego samego poziomu."
  pt: "O transporte que este dispositivo usa para chegar aos fornecedores. O modo Automático tenta os transportes ativados por ordem de preferência e mantém ligados em paralelo todos os transportes em bom estado do mesmo nível."
  pt-BR: "O transporte que este dispositivo usa para alcançar os provedores. O modo Automático tenta os transportes ativados por ordem de preferência e mantém conectados em paralelo todos os transportes saudáveis do mesmo nível."
  pt-PT: "O transporte que este dispositivo usa para chegar aos fornecedores. O modo Automático tenta os transportes ativados por ordem de preferência e mantém ligados em paralelo todos os transportes em bom estado do mesmo nível."
  ru: "Транспорт, через который это устройство подключается к провайдерам. Режим «Автоматически» перебирает включённые транспорты в порядке предпочтения и держит все исправные транспорты одного уровня подключёнными параллельно."
  sv: "Den transport som den här enheten använder för att nå leverantörer. Auto provar de aktiverade transporterna i prioritetsordning och håller alla fungerande transporter på samma nivå anslutna parallellt."
  sw: "Usafirishaji ambao kifaa hiki hutumia kufikia watoa huduma. Kiotomatiki hujaribu usafirishaji uliowashwa kwa mpangilio wa upendeleo na hudumisha kila usafirishaji wenye afya wa daraja moja ukiwa umeunganishwa sambamba."
  th: "ทรานสปอร์ตที่อุปกรณ์นี้ใช้เพื่อเข้าถึงผู้ให้บริการ โหมดอัตโนมัติจะลองทรานสปอร์ตที่เปิดไว้ตามลำดับความสำคัญ และคงการเชื่อมต่อทรานสปอร์ตที่ทำงานปกติทุกรายการในระดับเดียวกันไว้พร้อมกัน"
  uk: "Транспорт, яким цей пристрій досягає провайдерів. «Авто» пробує ввімкнені транспорти в порядку пріоритету й тримає паралельно підключеними всі справні транспорти того самого рівня."
  vi: "Phương thức truyền tải mà thiết bị này dùng để kết nối tới nhà cung cấp. Chế độ Tự động thử các phương thức đã bật theo thứ tự ưu tiên và giữ kết nối song song mọi phương thức hoạt động tốt cùng cấp."
  zh: "此设备用于连接提供商的传输方式。“自动”模式会按优先顺序尝试已启用的传输方式，并让同一层级中所有正常的传输方式保持并行连接。"
  zh-HK: "此裝置用來連接供應商的傳輸方式。「自動」模式會按優先次序嘗試已啟用的傳輸方式，並讓同一層級中所有正常的傳輸方式保持並行連接。"
