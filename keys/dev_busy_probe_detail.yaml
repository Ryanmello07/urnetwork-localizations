description: "Developer tools screen: explanatory subtext under the 'busy probe' control."
source: "When an exit stalls, ping it once before convicting. A congested but alive exit answers and keeps its flows; a dead one is still dropped. Off convicts on the stall bar"
platforms:
  - android
  - apple
localizations:
  ar: "عندما يتوقف مخرج، يُرسل إليه ping مرة واحدة قبل إدانته. المخرج المزدحم لكنه حي يرد ويحتفظ بتدفقاته؛ أما الميت فيُسقط على أي حال. عند الإيقاف، تتم الإدانة بناءً على عتبة التوقف"
  cs: "Když se výstup zasekne, dostane před odsouzením jeden ping. Přetížený, ale živý výstup odpoví a své toky si ponechá; mrtvý je vyřazen tak jako tak. Vypnuto odsuzuje podle prahu zaseknutí"
  de: "Wenn ein Exit hängt, wird er vor dem Verurteilen einmal angepingt. Ein überlasteter, aber lebendiger Exit antwortet und behält seine Flows; ein toter wird trotzdem verworfen. Aus: verurteilt allein nach der Hänger-Schwelle"
  el: "Όταν μια έξοδος κολλάει, λαμβάνει ένα ping πριν καταδικαστεί. Μια συμφορημένη αλλά ζωντανή έξοδος απαντά και κρατά τις ροές της· μια νεκρή απορρίπτεται ούτως ή άλλως. Η απενεργοποίηση καταδικάζει στο όριο κολλήματος"
  en: "When an exit stalls, ping it once before convicting. A congested but alive exit answers and keeps its flows; a dead one is still dropped. Off convicts on the stall bar"
  es: "Cuando una salida se bloquea, se le hace ping una vez antes de condenarla. Una salida congestionada pero viva responde y conserva sus flujos; una muerta se descarta igualmente. Si está desactivado, se condena al alcanzar el umbral de bloqueo"
  es-419: "Cuando una salida se traba, se le hace ping una vez antes de condenarla. Una salida congestionada pero viva responde y conserva sus flujos; una muerta se descarta de todos modos. Si está desactivado, se condena al alcanzar el umbral de traba"
  es-MX: "Cuando una salida se traba, se le hace ping una vez antes de condenarla. Una salida congestionada pero viva responde y conserva sus flujos; una muerta se descarta de todos modos. Si está desactivado, se condena al alcanzar el umbral de traba"
  fr: "Quand une sortie se fige, elle reçoit un ping avant d’être condamnée. Une sortie congestionnée mais vivante répond et garde ses flux ; une sortie morte est quand même écartée. Désactivé condamne au seuil de blocage"
  he: "כשיציאה נתקעת, נשלח אליה פינג אחד לפני ההרשעה. יציאה עמוסה אך חיה עונה ושומרת על הזרימות שלה; יציאה מתה מוסרת בכל מקרה. כיבוי מרשיע לפי סף התקיעה"
  hi: "जब कोई एग्ज़िट अटकता है, तो दोषी ठहराने से पहले उसे एक बार पिंग किया जाता है। भीड़भाड़ वाला लेकिन चालू एग्ज़िट जवाब देता है और अपने फ़्लो रखता है; बंद पड़ा एग्ज़िट फिर भी हटाया जाता है। बंद करने पर अटकाव सीमा पर ही दोषी ठहराया जाता है"
  id: "Saat exit macet, exit itu di-ping sekali sebelum divonis. Exit yang padat tetapi hidup menjawab dan mempertahankan alirannya; exit yang mati tetap dibuang. Nonaktif memvonis pada ambang macet"
  it: "Quando un’uscita si blocca, riceve un ping prima di essere condannata. Un’uscita congestionata ma viva risponde e mantiene i suoi flussi; una morta viene comunque scartata. Disattivato condanna alla soglia di blocco"
  ja: "出口が停止すると、判定の前に一度 ping を送ります。混雑していても生きている出口は応答してフローを維持し、停止した出口はそのまま除外されます。オフにすると停止しきい値で判定します"
  ko: "출구가 멈추면 판정 전에 한 번 ping을 보냅니다. 혼잡하지만 살아 있는 출구는 응답하고 플로우를 유지하며, 죽은 출구는 그대로 제외됩니다. 끄면 멈춤 기준에서 판정합니다"
  nl: "Als een exit vastloopt, krijgt hij eerst één ping voordat hij wordt veroordeeld. Een overbelaste maar levende exit antwoordt en houdt zijn flows; een dode wordt alsnog verwijderd. Uit veroordeelt op de vastloopgrens"
  pl: "Gdy wyjście się zablokuje, przed wyrokiem dostaje jeden ping. Przeciążone, ale żywe wyjście odpowiada i zachowuje swoje przepływy; martwe i tak zostaje odrzucone. Wyłączenie skazuje po przekroczeniu progu blokady"
  pt: "Quando uma saída bloqueia, recebe um ping antes de ser condenada. Uma saída congestionada mas viva responde e mantém os seus fluxos; uma morta é descartada na mesma. Desativado condena pelo limiar de bloqueio"
  pt-BR: "Quando uma saída trava, ela recebe um ping antes de ser condenada. Uma saída congestionada mas viva responde e mantém seus fluxos; uma morta é descartada mesmo assim. Desativado condena pelo limite de travamento"
  pt-PT: "Quando uma saída bloqueia, recebe um ping antes de ser condenada. Uma saída congestionada mas viva responde e mantém os seus fluxos; uma morta é descartada na mesma. Desativado condena pelo limiar de bloqueio"
  ru: "Когда выход зависает, его один раз пингуют, прежде чем осудить. Перегруженный, но живой выход отвечает и сохраняет свои потоки; мёртвый всё равно отключается. Если выключено, выход осуждается по порогу зависания"
  sv: "När en utgång låser sig pingas den en gång innan den fälls. En överbelastad men levande utgång svarar och behåller sina flöden; en död tas bort ändå. Av fäller vid låsningsgränsen"
  sw: "Njia ya kutoka inapokwama, inapigiwa ping mara moja kabla ya kuhukumiwa. Njia yenye msongamano lakini iliyo hai hujibu na kubaki na mitiririko yake; iliyokufa huondolewa vilevile. Kuzima kunahukumu kwenye kizingiti cha kukwama"
  th: "เมื่อทางออกค้าง จะส่ง ping ไปหนึ่งครั้งก่อนตัดสิน ทางออกที่หนาแน่นแต่ยังทำงานจะตอบกลับและเก็บโฟลว์ไว้ ทางออกที่ตายแล้วจะถูกตัดทิ้งตามเดิม ปิดเพื่อตัดสินตามเกณฑ์อาการค้าง"
  uk: "Коли вихід зависає, перед вироком йому надсилається один пінг. Перевантажений, але живий вихід відповідає і зберігає свої потоки; мертвий однаково відкидається. Вимкнення виносить вирок за порогом зависання"
  vi: "Khi một điểm thoát bị kẹt, nó được ping một lần trước khi bị kết luận lỗi. Điểm thoát nghẽn nhưng còn sống sẽ trả lời và giữ các luồng của nó; điểm thoát đã chết vẫn bị loại. Tắt sẽ kết luận lỗi theo ngưỡng kẹt"
  zh: "出口停滞时，先 ping 一次再定罪。拥塞但仍存活的出口会应答并保留其流；已失效的出口仍会被丢弃。关闭时按停滞阈值直接定罪"
  zh-HK: "出口停滯時，先 ping 一次再判罪。擠塞但仍運作的出口會回應並保留其流；已失效的出口仍會被捨棄。關閉時按停滯門檻直接判罪"
