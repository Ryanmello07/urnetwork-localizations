description: "Detail line of the last onboarding page on iOS/macOS (Control Center instead of Quick Settings)."
source: "Turn URnetwork on and off from Control Center, and keep an eye on it from your Home Screen."
platforms:
  - apple
localizations:
  ar: "شغّل URnetwork وأوقفه من مركز التحكم، وتابعه من شاشتك الرئيسية."
  cs: "Zapínejte a vypínejte URnetwork z Ovládacího centra a sledujte ho z plochy."
  de: "Schalte URnetwork im Kontrollzentrum ein und aus und behalte es auf deinem Home-Bildschirm im Blick."
  el: "Ενεργοποιήστε και απενεργοποιήστε το URnetwork από το Κέντρο ελέγχου και παρακολουθήστε το από την οθόνη Αφετηρίας."
  en: "Turn URnetwork on and off from Control Center, and keep an eye on it from your Home Screen."
  es: "Activa y desactiva URnetwork desde el Centro de control y vigílalo desde tu pantalla de inicio."
  es-419: "Activa y desactiva URnetwork desde el Centro de control y vigílalo desde tu pantalla de inicio."
  es-MX: "Activa y desactiva URnetwork desde el Centro de control y vigílalo desde tu pantalla de inicio."
  fr: "Activez et désactivez URnetwork depuis le Centre de contrôle, et gardez un œil dessus depuis votre écran d’accueil."
  he: "הפעילו וכבו את URnetwork ממרכז הבקרה, ועקבו אחריו ממסך הבית."
  hi: "कंट्रोल सेंटर से URnetwork चालू और बंद करें, और होम स्क्रीन से उस पर नज़र रखें।"
  id: "Nyalakan dan matikan URnetwork dari Pusat Kontrol, dan pantau dari Layar Utama Anda."
  it: "Attiva e disattiva URnetwork da Centro di Controllo e tienilo d’occhio dalla schermata Home."
  ja: "コントロールセンターから URnetwork のオンとオフを切り替え、ホーム画面から状態を確認できます。"
  ko: "제어 센터에서 URnetwork를 켜고 끄고, 홈 화면에서 상태를 확인하세요."
  nl: "Zet URnetwork aan en uit vanuit het Bedieningspaneel en houd het in de gaten vanaf je beginscherm."
  pl: "Włączaj i wyłączaj URnetwork z centrum sterowania i miej go na oku z ekranu początkowego."
  pt: "Ligue e desligue a URnetwork na Central de controlo e acompanhe-a a partir do ecrã principal."
  pt-BR: "Ative e desative a URnetwork pela Central de Controle e acompanhe tudo pela Tela de Início."
  pt-PT: "Ligue e desligue a URnetwork na Central de controlo e acompanhe-a a partir do ecrã principal."
  ru: "Включайте и выключайте URnetwork в Пункте управления и следите за ним с экрана «Домой»."
  sv: "Slå på och av URnetwork från Kontrollcenter och håll koll på det från hemskärmen."
  sw: "Washa na uzime URnetwork kutoka kwenye Kituo cha Udhibiti, na uifuatilie kutoka kwenye Skrini ya Kwanza."
  th: "เปิดและปิด URnetwork จากศูนย์ควบคุม และดูสถานะได้จากหน้าจอโฮม"
  uk: "Вмикайте й вимикайте URnetwork із Центру керування і стежте за ним з початкового екрана."
  vi: "Bật và tắt URnetwork từ Trung tâm điều khiển, và theo dõi nó từ Màn hình chính."
  zh: "在控制中心开关 URnetwork，并在主屏幕上随时查看其状态。"
  zh-HK: "在控制中心開關 URnetwork，並在主畫面上隨時查看其狀態。"
