description: "A local notification, the body."
source: "Your first epoch of earnings can now be claimed. If you lose this device before saving your recovery phrase, your SN25α can't be reached."
platforms:
  - apple
localizations:
  ar: "يمكنك الآن المطالبة بأرباح فترتك الأولى. إذا فقدت هذا الجهاز قبل حفظ عبارة النسخ الاحتياطي الخاصة بك، فلن يمكن الوصول إلى SN25α الخاص بك."
  cs: "Výdělky z vaší první epochy si teď můžete vyzvednout. Pokud toto zařízení ztratíte dřív, než si uložíte obnovovací frázi, k vašemu SN25α se nebude možné dostat."
  de: "Die Einnahmen deiner ersten Epoche können jetzt eingelöst werden. Wenn du dieses Gerät verlierst, bevor du deine Wiederherstellungsphrase gespeichert hast, ist dein SN25α nicht mehr erreichbar."
  el: "Τα κέρδη της πρώτης σας εποχής μπορούν πλέον να διεκδικηθούν. Αν χάσετε αυτή τη συσκευή πριν αποθηκεύσετε τη φράση επαναφοράς σας, δεν θα είναι δυνατή η πρόσβαση στα SN25α σας."
  en: "Your first epoch of earnings can now be claimed. If you lose this device before saving your recovery phrase, your SN25α can't be reached."
  es: "Ya puedes reclamar las ganancias de tu primera época. Si pierdes este dispositivo antes de guardar tu frase de recuperación, no se podrá acceder a tu SN25α."
  es-419: "Ya puedes reclamar las ganancias de tu primera época. Si pierdes este dispositivo antes de guardar tu frase de recuperación, no se podrá acceder a tu SN25α."
  es-MX: "Ya puedes reclamar las ganancias de tu primera época. Si pierdes este dispositivo antes de guardar tu frase de recuperación, no se podrá acceder a tu SN25α."
  fr: "Les gains de votre première époque peuvent maintenant être réclamés. Si vous perdez cet appareil avant d’avoir enregistré votre phrase de sauvegarde, vos SN25α seront inaccessibles."
  he: "אפשר עכשיו לממש את הרווחים מהתקופה הראשונה שלכם. אם תאבדו את המכשיר הזה לפני שתשמרו את ביטוי השחזור שלכם, לא תהיה גישה ל-SN25α שלכם."
  hi: "अब आप अपने पहले एपोक की कमाई पर दावा कर सकते हैं। अगर आप अपना रिकवरी फ़्रेज़ सहेजने से पहले यह डिवाइस खो देते हैं, तो आपके SN25α तक पहुँचा नहीं जा सकेगा।"
  id: "Penghasilan epoch pertama Anda kini dapat diklaim. Jika Anda kehilangan perangkat ini sebelum menyimpan frasa cadangan Anda, SN25α Anda tidak dapat diakses."
  it: "I guadagni della tua prima epoca ora si possono riscattare. Se perdi questo dispositivo prima di aver salvato la tua frase di recupero, i tuoi SN25α non saranno più accessibili."
  ja: "最初のエポックの収益を受け取れるようになりました。復元フレーズを保存する前にこのデバイスをなくすと、SN25α にアクセスできなくなります。"
  ko: "첫 에포크의 수익을 이제 받을 수 있습니다. 복구 문구를 저장하기 전에 이 기기를 잃어버리면 SN25α에 접근할 수 없습니다."
  nl: "De verdiensten van je eerste epoch kunnen nu worden opgeëist. Als je dit apparaat kwijtraakt voordat je je herstelzin hebt opgeslagen, is je SN25α niet meer bereikbaar."
  pl: "Zarobki z twojej pierwszej epoki można już odebrać. Jeśli stracisz to urządzenie, zanim zapiszesz frazę odzyskiwania, do twoich SN25α nie będzie można się dostać."
  pt: "Os ganhos da sua primeira época já podem ser reivindicados. Se perder este dispositivo antes de guardar a sua frase de recuperação, não será possível aceder ao seu SN25α."
  pt-BR: "Os ganhos da sua primeira época já podem ser resgatados. Se você perder este dispositivo antes de salvar sua frase de recuperação, não será possível acessar seu SN25α."
  pt-PT: "Os ganhos da sua primeira época já podem ser reivindicados. Se perder este dispositivo antes de guardar a sua frase de recuperação, não será possível aceder ao seu SN25α."
  ru: "Заработок за вашу первую эпоху теперь можно получить. Если вы потеряете это устройство, не сохранив фразу восстановления, получить доступ к вашим SN25α будет невозможно."
  sv: "Intäkterna från din första epok kan nu hämtas ut. Om du förlorar den här enheten innan du har sparat din återställningsfras går det inte att komma åt dina SN25α."
  sw: "Mapato ya kipindi chako cha kwanza sasa yanaweza kudaiwa. Ukipoteza kifaa hiki kabla ya kuhifadhi kifungu chako cha urejeshaji, SN25α yako haitaweza kufikiwa."
  th: "ตอนนี้คุณรับรายได้จากอีพอคแรกได้แล้ว หากคุณทำอุปกรณ์นี้หายก่อนบันทึกวลีสำรองของคุณ จะไม่สามารถเข้าถึง SN25α ของคุณได้"
  uk: "Заробіток за вашу першу епоху тепер можна отримати. Якщо ви втратите цей пристрій, не зберігши фразу відновлення, отримати доступ до ваших SN25α буде неможливо."
  vi: "Giờ bạn có thể nhận thu nhập của epoch đầu tiên. Nếu bạn mất thiết bị này trước khi lưu cụm từ sao lưu, sẽ không thể truy cập SN25α của bạn."
  zh: "您第一个周期的收益现在可以领取了。如果您在保存恢复短语之前丢失这台设备，您的 SN25α 将无法访问。"
  zh-HK: "你第一個週期的收益現在可以領取了。如果你在儲存復原短語之前遺失這部裝置，你的 SN25α 將無法存取。"
