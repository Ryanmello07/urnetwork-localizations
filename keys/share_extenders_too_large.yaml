description: "Shown on the share screen when the share payload exceeds what a QR code can hold; the text form is still offered."
source: "The share code is too large for a QR code. Copy the share text instead."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "رمز المشاركة كبير جدًا بالنسبة لرمز QR. انسخ نص المشاركة بدلًا من ذلك."
  cs: "Kód ke sdílení je na QR kód příliš velký. Místo toho zkopírujte text ke sdílení."
  de: "Der Freigabecode ist zu groß für einen QR-Code. Kopiere stattdessen den Freigabetext."
  el: "Ο κωδικός κοινοποίησης είναι πολύ μεγάλος για κωδικό QR. Αντιγράψτε το κείμενο κοινοποίησης αντί γι' αυτό."
  en: "The share code is too large for a QR code. Copy the share text instead."
  es: "El código para compartir es demasiado grande para un código QR. Copia el texto para compartir en su lugar."
  es-419: "El código para compartir es demasiado grande para un código QR. Copia el texto para compartir en su lugar."
  es-MX: "El código para compartir es demasiado grande para un código QR. Copia el texto para compartir en su lugar."
  fr: "Le code de partage est trop volumineux pour un code QR. Copiez plutôt le texte de partage."
  he: "קוד השיתוף גדול מדי לקוד QR. העתיקו במקום זאת את טקסט השיתוף."
  hi: "शेयर कोड QR कोड के लिए बहुत बड़ा है। इसके बजाय शेयर टेक्स्ट कॉपी करें।"
  id: "Kode berbagi terlalu besar untuk kode QR. Salin teks berbaginya saja."
  it: "Il codice di condivisione è troppo grande per un codice QR. Copia invece il testo di condivisione."
  ja: "共有コードが大きすぎて QR コードにできません。代わりに共有テキストをコピーしてください。"
  ko: "공유 코드가 너무 커서 QR 코드로 만들 수 없습니다. 대신 공유 텍스트를 복사하세요."
  nl: "De deelcode is te groot voor een QR-code. Kopieer in plaats daarvan de deeltekst."
  pl: "Kod udostępnienia jest za duży na kod QR. Zamiast tego skopiuj tekst udostępnienia."
  pt: "O código de partilha é demasiado grande para um código QR. Copie antes o texto de partilha."
  pt-BR: "O código de compartilhamento é grande demais para um código QR. Copie o texto de compartilhamento."
  pt-PT: "O código de partilha é demasiado grande para um código QR. Copie antes o texto de partilha."
  ru: "Код слишком велик для QR-кода. Вместо этого скопируйте текст кода."
  sv: "Delningskoden är för stor för en QR-kod. Kopiera delningstexten i stället."
  sw: "Msimbo wa kushiriki ni mkubwa mno kwa msimbo wa QR. Badala yake nakili maandishi ya kushiriki."
  th: "รหัสแชร์มีขนาดใหญ่เกินกว่าจะเป็นรหัส QR คัดลอกข้อความแชร์แทน"
  uk: "Код обміну завеликий для QR-коду. Скопіюйте натомість текст обміну."
  vi: "Mã chia sẻ quá lớn để làm mã QR. Hãy sao chép văn bản chia sẻ thay thế."
  zh: "分享码过大，无法生成二维码。请改为复制分享文本。"
  zh-HK: "分享碼太大，無法產生 QR 碼。請改為複製分享文字。"
