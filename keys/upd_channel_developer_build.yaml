description: "Update channel (Windows): the running app is a developer build, but this PC takes official releases."
source: "This is a developer build, so it is offered nothing until a newer official release has been out for a day."
platforms:
  - windows
localizations:
  ar: "هذا إصدار مطوّر، لذا لن يُعرض عليه شيء حتى يمضي يوم على صدور إصدار رسمي أحدث."
  cs: "Toto je vývojářské sestavení, takže se mu nic nenabídne, dokud nebude novější oficiální vydání venku jeden den."
  de: "Dies ist ein Entwickler-Build, daher bekommt er nichts angeboten, bis eine neuere offizielle Version einen Tag lang verfügbar ist."
  el: "Αυτή είναι έκδοση προγραμματιστή, οπότε δεν της προσφέρεται τίποτα μέχρι να κυκλοφορεί μια νεότερη επίσημη έκδοση για μία ημέρα."
  en: "This is a developer build, so it is offered nothing until a newer official release has been out for a day."
  es: "Esta es una compilación de desarrollador, así que no se le ofrece nada hasta que una versión oficial más reciente lleve un día publicada."
  es-419: "Esta es una compilación de desarrollador, así que no se le ofrece nada hasta que una versión oficial más reciente lleve un día publicada."
  es-MX: "Esta es una compilación de desarrollador, así que no se le ofrece nada hasta que una versión oficial más reciente lleve un día publicada."
  fr: "Ceci est une version de développeur, donc rien ne lui est proposé tant qu’une version officielle plus récente n’est pas sortie depuis un jour."
  he: "זוהי גרסת מפתחים, ולכן לא יוצע לה דבר עד שגרסה רשמית חדשה יותר תהיה זמינה במשך יום."
  hi: "यह एक डेवलपर बिल्ड है, इसलिए जब तक कोई नई आधिकारिक रिलीज़ एक दिन तक उपलब्ध न रहे, इसे कुछ भी पेश नहीं किया जाता।"
  id: "Ini adalah build pengembang, jadi tidak ada yang ditawarkan sampai rilis resmi yang lebih baru sudah tersedia selama satu hari."
  it: "Questa è una build per sviluppatori, quindi non le viene proposto nulla finché una versione ufficiale più recente non è disponibile da un giorno."
  ja: "これは開発者ビルドのため、新しい公式リリースが公開から 1 日経つまでは何も提供されません。"
  ko: "이 빌드는 개발자 빌드이므로, 더 새로운 공식 릴리스가 나온 지 하루가 지나기 전에는 아무것도 제공되지 않습니다."
  nl: "Dit is een ontwikkelaarsversie, dus deze krijgt niets aangeboden totdat een nieuwere officiële release een dag beschikbaar is."
  pl: "To jest kompilacja deweloperska, więc nic nie zostanie jej zaoferowane, dopóki nowsze oficjalne wydanie nie będzie dostępne od jednego dnia."
  pt: "Esta é uma versão de programador, pelo que nada lhe é oferecido até que uma versão oficial mais recente esteja disponível há um dia."
  pt-BR: "Esta é uma versão de desenvolvedor, então nada é oferecido a ela até que uma versão oficial mais nova esteja disponível há um dia."
  pt-PT: "Esta é uma versão de programador, pelo que nada lhe é oferecido até que uma versão oficial mais recente esteja disponível há um dia."
  ru: "Это сборка разработчика, поэтому ей ничего не предлагается, пока более новый официальный выпуск не будет доступен в течение суток."
  sv: "Det här är en utvecklarversion, så den erbjuds inget förrän en nyare officiell version har funnits ute i en dag."
  sw: "Hili ni toleo la msanidi, kwa hivyo halipewi chochote hadi toleo rasmi jipya zaidi liwe limetoka kwa siku moja."
  th: "นี่คือบิลด์สำหรับนักพัฒนา จึงจะไม่มีการเสนออะไรจนกว่ารุ่นทางการที่ใหม่กว่าจะเผยแพร่มาแล้วหนึ่งวัน"
  uk: "Це збірка розробника, тому їй нічого не пропонується, доки новіший офіційний випуск не буде доступний протягом доби."
  vi: "Đây là bản dành cho nhà phát triển nên sẽ không được cung cấp gì cho đến khi một bản phát hành chính thức mới hơn đã ra mắt được một ngày."
  zh: "这是开发者版本，因此在更新的正式版本发布满一天之前，不会提供任何更新。"
  zh-HK: "這是開發者版本，因此在較新的正式版本發布滿一天之前，不會提供任何更新。"
