description: "Update channel (Windows): the running app is a developer build, but this PC takes official releases."
source: "This is a developer build. It follows official releases, so it is offered nothing until a newer official release has been out for a day."
platforms:
  - windows
localizations:
  ar: "هذا إصدار مطوّر. وهو يتبع الإصدارات الرسمية، لذا لن يُعرض عليه شيء حتى يمضي يوم على صدور إصدار رسمي أحدث."
  cs: "Toto je vývojářské sestavení. Řídí se oficiálními vydáními, takže se mu nic nenabídne, dokud nebude novější oficiální vydání venku jeden den."
  de: "Dies ist ein Entwickler-Build. Er folgt den offiziellen Versionen und bekommt daher nichts angeboten, bis eine neuere offizielle Version einen Tag lang verfügbar ist."
  el: "Αυτή είναι έκδοση προγραμματιστή. Ακολουθεί τις επίσημες εκδόσεις, οπότε δεν της προσφέρεται τίποτα μέχρι να κυκλοφορεί μια νεότερη επίσημη έκδοση για μία ημέρα."
  en: "This is a developer build. It follows official releases, so it is offered nothing until a newer official release has been out for a day."
  es: "Esta es una compilación de desarrollador. Sigue las versiones oficiales, así que no se le ofrece nada hasta que una versión oficial más reciente lleve un día publicada."
  es-419: "Esta es una compilación de desarrollador. Sigue las versiones oficiales, así que no se le ofrece nada hasta que una versión oficial más reciente lleve un día publicada."
  es-MX: "Esta es una compilación de desarrollador. Sigue las versiones oficiales, así que no se le ofrece nada hasta que una versión oficial más reciente lleve un día publicada."
  fr: "Ceci est une version de développeur. Elle suit les versions officielles : rien ne lui est donc proposé tant qu’une version officielle plus récente n’est pas sortie depuis un jour."
  he: "זוהי גרסת מפתחים. היא עוקבת אחר הגרסאות הרשמיות, ולכן לא יוצע לה דבר עד שגרסה רשמית חדשה יותר תהיה זמינה במשך יום."
  hi: "यह एक डेवलपर बिल्ड है। यह आधिकारिक रिलीज़ का पालन करता है, इसलिए जब तक कोई नई आधिकारिक रिलीज़ एक दिन तक उपलब्ध न रहे, इसे कुछ भी पेश नहीं किया जाता।"
  id: "Ini adalah build pengembang. Build ini mengikuti rilis resmi, jadi tidak ada yang ditawarkan sampai rilis resmi yang lebih baru sudah tersedia selama satu hari."
  it: "Questa è una build per sviluppatori. Segue le versioni ufficiali, quindi non le viene proposto nulla finché una versione ufficiale più recente non è disponibile da un giorno."
  ja: "これは開発者ビルドです。公式リリースに従うため、新しい公式リリースが公開から 1 日経つまでは何も提供されません。"
  ko: "이 빌드는 개발자 빌드입니다. 공식 릴리스를 따르므로, 더 새로운 공식 릴리스가 나온 지 하루가 지나기 전에는 아무것도 제공되지 않습니다."
  nl: "Dit is een ontwikkelaarsversie. Deze volgt de officiële releases en krijgt dus niets aangeboden totdat een nieuwere officiële release een dag beschikbaar is."
  pl: "To jest kompilacja deweloperska. Korzysta z oficjalnych wydań, więc nic nie zostanie jej zaoferowane, dopóki nowsze oficjalne wydanie nie będzie dostępne od jednego dnia."
  pt: "Esta é uma versão de desenvolvedor. Ela segue as versões oficiais, então nada é oferecido até que uma versão oficial mais nova esteja disponível há um dia."
  pt-BR: "Esta é uma versão de desenvolvedor. Ela segue as versões oficiais, então nada é oferecido até que uma versão oficial mais nova esteja disponível há um dia."
  pt-PT: "Esta é uma versão de programador. Segue as versões oficiais, pelo que nada lhe é oferecido até que uma versão oficial mais recente esteja disponível há um dia."
  ru: "Это сборка разработчика. Она получает официальные выпуски, поэтому ей ничего не предлагается, пока более новый официальный выпуск не будет доступен в течение суток."
  sv: "Det här är en utvecklarversion. Den följer officiella versioner, så den erbjuds inget förrän en nyare officiell version har funnits ute i en dag."
  sw: "Hili ni toleo la msanidi. Linafuata matoleo rasmi, kwa hivyo halipewi chochote hadi toleo rasmi jipya zaidi liwe limetoka kwa siku moja."
  th: "นี่คือบิลด์สำหรับนักพัฒนา ซึ่งใช้รุ่นทางการ จึงจะไม่มีการเสนออะไรจนกว่ารุ่นทางการที่ใหม่กว่าจะเผยแพร่มาแล้วหนึ่งวัน"
  uk: "Це збірка розробника. Вона отримує офіційні випуски, тому їй нічого не пропонується, доки новіший офіційний випуск не буде доступний протягом доби."
  vi: "Đây là bản dành cho nhà phát triển. Bản này theo bản phát hành chính thức nên sẽ không được cung cấp gì cho đến khi một bản phát hành chính thức mới hơn đã ra mắt được một ngày."
  zh: "这是开发者版本。它跟随正式版本，因此在更新的正式版本发布满一天之前，不会提供任何更新。"
  zh-HK: "這是開發者版本。它跟隨正式版本，因此在較新的正式版本發布滿一天之前，不會提供任何更新。"
