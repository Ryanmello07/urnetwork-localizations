description: "General UI string."
source: "A seedphrase lets you recover your account if you lose access. Store it safely."
platforms:
  - apple
  - android
localizations:
  ar: "تتيح لك عبارة الاسترداد استعادة حسابك إذا فقدت إمكانية الوصول. احفظها في مكان آمن."
  cs: "Seed fráze vám umožní obnovit účet, pokud k němu ztratíte přístup. Uložte ji na bezpečné místo."
  de: "Mit einer Seedphrase kannst du dein Konto wiederherstellen, wenn du den Zugriff verlierst. Bewahre sie sicher auf."
  el: "Μια φράση ανάκτησης σάς επιτρέπει να ανακτήσετε τον λογαριασμό σας αν χάσετε την πρόσβαση. Φυλάξτε την με ασφάλεια."
  en: "A seedphrase lets you recover your account if you lose access. Store it safely."
  es: "Una frase semilla te permite recuperar tu cuenta si pierdes el acceso. Guárdala en un lugar seguro."
  es-419: "Una frase semilla te permite recuperar tu cuenta si pierdes el acceso. Guárdala en un lugar seguro."
  es-MX: "Una frase semilla te permite recuperar tu cuenta si pierdes el acceso. Guárdala en un lugar seguro."
  fr: "Une phrase de récupération vous permet de récupérer votre compte si vous perdez l’accès. Conservez-la en lieu sûr."
  he: "ביטוי סיד מאפשר לך לשחזר את החשבון שלך אם תאבד את הגישה אליו. שמור אותו במקום בטוח."
  hi: "अगर आपकी पहुंच खो जाती है, तो सीड फ़्रेज़ से आप अपना खाता वापस पा सकते हैं। इसे किसी सुरक्षित जगह पर रखें।"
  id: "Frasa pemulihan memungkinkan Anda memulihkan akun jika kehilangan akses. Simpan di tempat yang aman."
  it: "Una frase seed ti permette di recuperare il tuo account se perdi l’accesso. Conservala in un luogo sicuro."
  ja: "シードフレーズがあれば、アクセスできなくなってもアカウントを復元できます。安全な場所に保管してください。"
  ko: "시드 문구가 있으면 접근 권한을 잃어도 계정을 복구할 수 있습니다. 안전한 곳에 보관하세요."
  nl: "Met een seedphrase kun je je account herstellen als je de toegang kwijtraakt. Bewaar hem veilig."
  pl: "Fraza seed pozwala odzyskać konto, jeśli stracisz do niego dostęp. Przechowuj ją w bezpiecznym miejscu."
  pt: "Uma frase-semente permite recuperar a sua conta se perder o acesso. Guarde-a num local seguro."
  pt-BR: "Uma frase-semente permite recuperar sua conta se você perder o acesso. Guarde-a em um local seguro."
  pt-PT: "Uma frase-semente permite recuperar a sua conta se perder o acesso. Guarde-a num local seguro."
  ru: "Сид-фраза позволяет восстановить аккаунт, если вы потеряете доступ. Храните её в безопасном месте."
  sv: "Med en seedfras kan du återställa ditt konto om du förlorar åtkomsten. Förvara den säkert."
  sw: "Kifungu cha seed hukuwezesha kurejesha akaunti yako ukipoteza ufikiaji. Kihifadhi mahali salama."
  th: "วลีกู้คืนช่วยให้คุณกู้บัญชีคืนได้หากเข้าถึงไม่ได้ เก็บไว้ในที่ปลอดภัย"
  uk: "Сід-фраза дозволяє відновити ваш обліковий запис, якщо ви втратите доступ. Зберігайте її в безпечному місці."
  vi: "Cụm từ khôi phục giúp bạn khôi phục tài khoản nếu mất quyền truy cập. Hãy cất giữ ở nơi an toàn."
  zh: "如果你无法访问帐户，助记词可以帮你恢复。请妥善保管。"
  zh-HK: "如果你無法存取帳戶，助記詞可以幫你復原。請妥善保管。"
