description: "App support: intro line"
source: "Send us your feedback directly, or join the community for direct support."
platforms:
  - site
  - linux
  - windows
localizations:
  ar: "أرسل لنا ملاحظاتك مباشرةً، أو انضم إلى المجتمع للحصول على دعم مباشر."
  cs: "Pošlete nám svůj názor přímo, nebo se připojte ke komunitě a získejte přímou podporu."
  de: "Sende uns dein Feedback direkt oder tritt der Community für direkten Support bei."
  el: "Στείλτε μας τα σχόλιά σας απευθείας ή μπείτε στην κοινότητα για άμεση υποστήριξη."
  en: "Send us your feedback directly, or join the community for direct support."
  es: "Envíanos tus comentarios directamente o únete a la comunidad para recibir soporte directo."
  es-419: "Envíanos tus comentarios directamente o únete a la comunidad para recibir soporte directo."
  es-MX: "Envíanos tus comentarios directamente o únete a la comunidad para recibir soporte directo."
  fr: "Envoyez-nous directement vos retours ou rejoignez la communauté pour un support direct."
  he: "שלחו לנו משוב ישירות, או הצטרפו לקהילה לתמיכה ישירה."
  hi: "हमें सीधे अपनी प्रतिक्रिया भेजें, या सीधी सहायता के लिए समुदाय से जुड़ें।"
  id: "Kirimkan masukan Anda langsung, atau bergabunglah dengan komunitas untuk dukungan langsung."
  it: "Inviaci direttamente il tuo feedback o unisciti alla community per un supporto diretto."
  ja: "ご意見を直接お送りいただくか、コミュニティに参加して直接サポートを受けてください。"
  ko: "피드백을 직접 보내거나, 커뮤니티에 참여해 직접 지원을 받으세요."
  nl: "Stuur ons rechtstreeks je feedback of sluit je aan bij de community voor directe hulp."
  pl: "Prześlij nam swoją opinię bezpośrednio lub dołącz do społeczności, aby uzyskać bezpośrednie wsparcie."
  pt: "Envie-nos o seu feedback diretamente ou junte-se à comunidade para obter suporte direto."
  pt-BR: "Envie seu feedback diretamente ou entre na comunidade para receber suporte direto."
  pt-PT: "Envie-nos o seu feedback diretamente ou junte-se à comunidade para obter suporte direto."
  ru: "Отправьте нам отзыв напрямую или присоединяйтесь к сообществу для поддержки."
  sv: "Skicka din feedback direkt till oss, eller gå med i communityn för direkt support."
  sw: "Tutumie maoni yako moja kwa moja, au jiunge na jumuiya kwa msaada wa moja kwa moja."
  th: "ส่งความคิดเห็นถึงเราโดยตรง หรือเข้าร่วมชุมชนเพื่อรับการช่วยเหลือโดยตรง"
  uk: "Надішліть нам відгук безпосередньо або приєднайтеся до спільноти, щоб отримати пряму підтримку."
  vi: "Gửi phản hồi trực tiếp cho chúng tôi, hoặc tham gia cộng đồng để được hỗ trợ trực tiếp."
  zh: "直接向我们发送反馈，或加入社区获取直接支持。"
  zh-HK: "直接向我們發送意見，或加入社群獲取直接支援。"
