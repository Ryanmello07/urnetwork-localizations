description: "Footer of the Auto transports section explaining the fixed preference order."
source: "Listed in preference order: H3 and H1 first, then whodis, then whodis pump. The order is fixed. At least one transport stays enabled."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "مرتبة حسب الأفضلية: H3 و H1 أولًا، ثم whodis، ثم whodis pump. الترتيب ثابت. يبقى بروتوكول نقل واحد على الأقل مفعّلًا."
  cs: "Seřazeno podle priority: nejprve H3 a H1, potom whodis, potom whodis pump. Pořadí je pevné. Alespoň jeden transport zůstává zapnutý."
  de: "In der Reihenfolge der Präferenz aufgeführt: zuerst H3 und H1, dann whodis, dann whodis pump. Die Reihenfolge ist fest. Mindestens ein Transport bleibt aktiviert."
  el: "Με σειρά προτίμησης: πρώτα H3 και H1, μετά whodis και μετά whodis pump. Η σειρά είναι σταθερή. Τουλάχιστον ένας τρόπος μεταφοράς παραμένει ενεργός."
  en: "Listed in preference order: H3 and H1 first, then whodis, then whodis pump. The order is fixed. At least one transport stays enabled."
  es: "Ordenados por preferencia: primero H3 y H1, luego whodis y después whodis pump. El orden es fijo. Al menos un transporte permanece activado."
  es-419: "Ordenados por preferencia: primero H3 y H1, luego whodis y después whodis pump. El orden es fijo. Al menos un transporte permanece activado."
  es-MX: "Ordenados por preferencia: primero H3 y H1, luego whodis y después whodis pump. El orden es fijo. Al menos un transporte permanece activado."
  fr: "Classés par ordre de préférence : H3 et H1 d’abord, puis whodis, puis whodis pump. L’ordre est fixe. Au moins un transport reste activé."
  he: "לפי סדר עדיפות: קודם H3 ו-H1, אחר כך whodis ואחר כך whodis pump. הסדר קבוע. לפחות פרוטוקול העברה אחד נשאר מופעל."
  hi: "पसंद के क्रम में सूचीबद्ध: पहले H3 और H1, फिर whodis, फिर whodis pump। क्रम तय है। कम से कम एक ट्रांसपोर्ट चालू रहता है।"
  id: "Diurutkan berdasarkan preferensi: H3 dan H1 lebih dulu, lalu whodis, lalu whodis pump. Urutannya tetap. Setidaknya satu transport tetap aktif."
  it: "In ordine di preferenza: prima H3 e H1, poi whodis, poi whodis pump. L’ordine è fisso. Almeno un trasporto resta attivo."
  ja: "優先順に表示：まず H3 と H1、次に whodis、その次に whodis pump。順序は固定です。少なくとも 1 つのトランスポートは常に有効です。"
  ko: "우선순위 순서: 먼저 H3와 H1, 그다음 whodis, 그다음 whodis pump. 순서는 고정되어 있습니다. 하나 이상의 전송 방식은 항상 켜져 있습니다."
  nl: "Op volgorde van voorkeur: eerst H3 en H1, dan whodis, dan whodis pump. De volgorde ligt vast. Er blijft altijd minstens één transport ingeschakeld."
  pl: "W kolejności preferencji: najpierw H3 i H1, potem whodis, potem whodis pump. Kolejność jest stała. Co najmniej jeden transport pozostaje włączony."
  pt: "Listados por ordem de preferência: primeiro H3 e H1, depois whodis e depois whodis pump. A ordem é fixa. Pelo menos um transporte fica ativado."
  pt-BR: "Listados por ordem de preferência: primeiro H3 e H1, depois whodis e depois whodis pump. A ordem é fixa. Pelo menos um transporte continua ativado."
  pt-PT: "Listados por ordem de preferência: primeiro H3 e H1, depois whodis e depois whodis pump. A ordem é fixa. Pelo menos um transporte fica ativado."
  ru: "Указаны в порядке предпочтения: сначала H3 и H1, затем whodis, затем whodis pump. Порядок фиксирован. Хотя бы один транспорт всегда остаётся включённым."
  sv: "I prioritetsordning: först H3 och H1, sedan whodis, sedan whodis pump. Ordningen är fast. Minst en transport förblir aktiverad."
  sw: "Zimeorodheshwa kwa mpangilio wa upendeleo: H3 na H1 kwanza, kisha whodis, kisha whodis pump. Mpangilio ni wa kudumu. Angalau usafirishaji mmoja hubaki umewashwa."
  th: "เรียงตามลำดับความสำคัญ: H3 และ H1 ก่อน จากนั้น whodis แล้วจึง whodis pump ลำดับนี้ตายตัว จะมีทรานสปอร์ตอย่างน้อยหนึ่งรายการเปิดอยู่เสมอ"
  uk: "У порядку пріоритету: спершу H3 і H1, потім whodis, потім whodis pump. Порядок фіксований. Принаймні один транспорт завжди залишається ввімкненим."
  vi: "Liệt kê theo thứ tự ưu tiên: H3 và H1 trước, rồi whodis, rồi whodis pump. Thứ tự là cố định. Luôn có ít nhất một phương thức truyền tải được bật."
  zh: "按优先顺序列出：先是 H3 和 H1，然后是 whodis，最后是 whodis pump。顺序固定。至少会有一种传输方式保持启用。"
  zh-HK: "按優先次序列出：先是 H3 和 H1，然後是 whodis，最後是 whodis pump。次序固定。至少會有一種傳輸方式保持啟用。"
