description: "Footer of the Auto transports section explaining the fixed preference order."
source: "Listed in preference order: H1 first, then H3, whodis, and whodis pump. The order is fixed. At least one transport stays enabled."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "مرتبة حسب الأفضلية: H1 أولًا، ثم H3 وwhodis وwhodis pump. الترتيب ثابت. يبقى بروتوكول نقل واحد على الأقل مفعّلًا."
  cs: "Seřazeno podle priority: nejprve H1, potom H3, whodis a whodis pump. Pořadí je pevné. Alespoň jeden transport zůstává zapnutý."
  de: "In der Reihenfolge der Präferenz aufgeführt: zuerst H1, dann H3, whodis und whodis pump. Die Reihenfolge ist fest. Mindestens ein Transport bleibt aktiviert."
  el: "Με σειρά προτίμησης: πρώτα H1, μετά H3, whodis και whodis pump. Η σειρά είναι σταθερή. Τουλάχιστον ένας τρόπος μεταφοράς παραμένει ενεργός."
  en: "Listed in preference order: H1 first, then H3, whodis, and whodis pump. The order is fixed. At least one transport stays enabled."
  es: "Ordenados por preferencia: primero H1, luego H3, whodis y whodis pump. El orden es fijo. Al menos un transporte permanece activado."
  es-419: "Ordenados por preferencia: primero H1, luego H3, whodis y whodis pump. El orden es fijo. Al menos un transporte permanece activado."
  es-MX: "Ordenados por preferencia: primero H1, luego H3, whodis y whodis pump. El orden es fijo. Al menos un transporte permanece activado."
  fr: "Classés par ordre de préférence : H1 d’abord, puis H3, whodis et whodis pump. L’ordre est fixe. Au moins un transport reste activé."
  he: "לפי סדר עדיפות: קודם H1, אחר כך H3, whodis ו-whodis pump. הסדר קבוע. לפחות פרוטוקול העברה אחד נשאר מופעל."
  hi: "पसंद के क्रम में सूचीबद्ध: पहले H1, फिर H3, whodis और whodis pump। क्रम तय है। कम से कम एक ट्रांसपोर्ट चालू रहता है।"
  id: "Diurutkan berdasarkan preferensi: H1 lebih dulu, lalu H3, whodis, dan whodis pump. Urutannya tetap. Setidaknya satu transport tetap aktif."
  it: "Elencati in ordine di preferenza: prima H1, poi H3, whodis e whodis pump. L’ordine è fisso. Almeno un trasporto resta attivo."
  ja: "優先順に表示: まず H1、次に H3、whodis、whodis pump。順序は固定です。少なくとも 1 つのトランスポートは常に有効です。"
  ko: "우선순위 순서: 먼저 H1, 그다음 H3, whodis, whodis pump. 순서는 고정되어 있습니다. 하나 이상의 전송 방식은 항상 켜져 있습니다."
  nl: "Op volgorde van voorkeur: eerst H1, dan H3, whodis en whodis pump. De volgorde ligt vast. Er blijft altijd minstens één transport ingeschakeld."
  pl: "Wymienione w kolejności preferencji: najpierw H1, potem H3, whodis i whodis pump. Kolejność jest stała. Co najmniej jeden transport pozostaje włączony."
  pt: "Listados em ordem de preferência: primeiro H1, depois H3, whodis e whodis pump. A ordem é fixa. Pelo menos um transporte fica ativado."
  pt-BR: "Listados em ordem de preferência: primeiro H1, depois H3, whodis e whodis pump. A ordem é fixa. Pelo menos um transporte fica ativado."
  pt-PT: "Listados por ordem de preferência: primeiro H1, depois H3, whodis e whodis pump. A ordem é fixa. Pelo menos um transporte fica ativado."
  ru: "Указаны в порядке предпочтения: сначала H1, затем H3, whodis и whodis pump. Порядок фиксирован. Хотя бы один транспорт всегда остаётся включённым."
  sv: "Listade i prioritetsordning: H1 först, sedan H3, whodis och whodis pump. Ordningen är fast. Minst en transport förblir aktiverad."
  sw: "Zimeorodheshwa kwa mpangilio wa upendeleo: H1 kwanza, kisha H3, whodis na whodis pump. Mpangilio ni wa kudumu. Angalau usafirishaji mmoja hubaki umewashwa."
  th: "เรียงตามลำดับความสำคัญ: H1 ก่อน จากนั้น H3, whodis และ whodis pump ลำดับนี้ตายตัว จะมีทรานสปอร์ตอย่างน้อยหนึ่งรายการเปิดอยู่เสมอ"
  uk: "Указано в порядку пріоритету: спершу H1, потім H3, whodis і whodis pump. Порядок фіксований. Принаймні один транспорт завжди залишається ввімкненим."
  vi: "Liệt kê theo thứ tự ưu tiên: H1 trước, rồi H3, whodis và whodis pump. Thứ tự là cố định. Luôn có ít nhất một phương thức truyền tải được bật."
  zh: "按优先顺序列出：先是 H1，然后是 H3、whodis 和 whodis pump。顺序固定。至少会有一种传输方式保持启用。"
  zh-HK: "按優先次序列出：先是 H1，然後是 H3、whodis 和 whodis pump。次序固定。至少會有一種傳輸方式保持啟用。"
