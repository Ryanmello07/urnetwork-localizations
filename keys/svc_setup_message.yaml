description: "Windows banner text under 'Set up the VPN service'."
source: "URnetwork uses a Windows service to carry traffic. One click — Windows will ask for administrator permission."
platforms:
  - windows
localizations:
  ar: "يستخدم URnetwork خدمة Windows لنقل حركة البيانات. نقرة واحدة — سيطلب Windows إذن المسؤول."
  cs: "URnetwork používá k přenosu provozu službu Windows. Jedno kliknutí – Windows požádá o oprávnění správce."
  de: "URnetwork nutzt einen Windows-Dienst, um den Datenverkehr zu übertragen. Ein Klick – Windows fragt nach einer Administratorberechtigung."
  el: "Το URnetwork χρησιμοποιεί μια υπηρεσία των Windows για τη μεταφορά της κίνησης. Ένα κλικ — τα Windows θα ζητήσουν άδεια διαχειριστή."
  en: "URnetwork uses a Windows service to carry traffic. One click — Windows will ask for administrator permission."
  es: "URnetwork usa un servicio de Windows para transportar el tráfico. Un clic: Windows pedirá permiso de administrador."
  es-419: "URnetwork usa un servicio de Windows para transportar el tráfico. Un clic: Windows pedirá permiso de administrador."
  es-MX: "URnetwork usa un servicio de Windows para transportar el tráfico. Un clic: Windows pedirá permiso de administrador."
  fr: "URnetwork utilise un service Windows pour acheminer le trafic. Un clic — Windows demandera une autorisation d’administrateur."
  he: "URnetwork משתמש בשירות של Windows כדי להעביר תעבורה. לחיצה אחת — Windows יבקש הרשאת מנהל."
  hi: "URnetwork ट्रैफ़िक ले जाने के लिए एक Windows सेवा का उपयोग करता है। एक क्लिक — Windows व्यवस्थापक अनुमति माँगेगा।"
  id: "URnetwork menggunakan layanan Windows untuk membawa lalu lintas. Satu klik — Windows akan meminta izin administrator."
  it: "URnetwork usa un servizio di Windows per trasportare il traffico. Un clic — Windows chiederà il permesso dell’amministratore."
  ja: "URnetwork は Windows サービスを使って通信を運びます。ワンクリック — Windows が管理者の許可を求めます。"
  ko: "URnetwork는 Windows 서비스를 사용해 트래픽을 전달합니다. 한 번 클릭 — Windows에서 관리자 권한을 요청합니다."
  nl: "URnetwork gebruikt een Windows-service om verkeer te vervoeren. Eén klik – Windows vraagt om beheerdersrechten."
  pl: "URnetwork używa usługi Windows do przenoszenia ruchu. Jedno kliknięcie — Windows poprosi o uprawnienia administratora."
  pt: "A URnetwork usa um serviço do Windows para transportar o tráfego. Um clique — o Windows vai pedir permissão de administrador."
  pt-BR: "A URnetwork usa um serviço do Windows para transportar o tráfego. Um clique — o Windows vai pedir permissão de administrador."
  pt-PT: "A URnetwork usa um serviço do Windows para transportar o tráfego. Um clique — o Windows vai pedir permissão de administrador."
  ru: "URnetwork использует службу Windows для передачи трафика. Один щелчок — Windows запросит разрешение администратора."
  sv: "URnetwork använder en Windows-tjänst för att transportera trafik. Ett klick – Windows ber om administratörsbehörighet."
  sw: "URnetwork hutumia huduma ya Windows kubeba trafiki. Bofya mara moja — Windows itaomba ruhusa ya msimamizi."
  th: "URnetwork ใช้บริการของ Windows ในการรับส่งทราฟฟิก คลิกครั้งเดียว — Windows จะขอสิทธิ์ผู้ดูแลระบบ"
  uk: "URnetwork використовує службу Windows для передавання трафіку. Одне клацання — Windows попросить дозвіл адміністратора."
  vi: "URnetwork dùng một dịch vụ Windows để truyền lưu lượng. Một cú nhấp — Windows sẽ yêu cầu quyền quản trị viên."
  zh: "URnetwork 使用一个 Windows 服务来传输流量。只需点击一下 — Windows 会请求管理员权限。"
  zh-HK: "URnetwork 使用一項 Windows 服務來傳輸流量。只需按一下 — Windows 會要求管理員權限。"
