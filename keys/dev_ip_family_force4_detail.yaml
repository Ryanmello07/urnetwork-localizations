description: "Developer screen: detail line of the IPv4-only option."
source: "Control-plane connections use IPv4 only. Turn this off on an IPv6-only network."
platforms:
  - android
localizations:
  ar: "تستخدم اتصالات التحكم IPv4 فقط. أوقف هذا الخيار على شبكة تدعم IPv6 فقط."
  cs: "Řídicí připojení používají jen IPv4. V síti jen s IPv6 tuto volbu vypněte."
  de: "Steuerverbindungen nutzen nur IPv4. Schalte das in einem reinen IPv6-Netz aus."
  el: "Οι συνδέσεις ελέγχου χρησιμοποιούν μόνο IPv4. Απενεργοποιήστε το σε δίκτυο μόνο IPv6."
  en: "Control-plane connections use IPv4 only. Turn this off on an IPv6-only network."
  es: "Las conexiones de control solo usan IPv4. Desactívalo en una red solo IPv6."
  es-419: "Las conexiones de control solo usan IPv4. Desactívalo en una red solo IPv6."
  es-MX: "Las conexiones de control solo usan IPv4. Desactívalo en una red solo IPv6."
  fr: "Les connexions de contrôle n’utilisent qu’IPv4. Désactivez cette option sur un réseau uniquement IPv6."
  he: "חיבורי הבקרה משתמשים ב-IPv4 בלבד. כבו את זה ברשת שיש בה IPv6 בלבד."
  hi: "कंट्रोल कनेक्शन केवल IPv4 का इस्तेमाल करते हैं। केवल-IPv6 नेटवर्क पर इसे बंद करें।"
  id: "Koneksi kontrol hanya memakai IPv4. Matikan ini di jaringan khusus IPv6."
  it: "Le connessioni di controllo usano solo IPv4. Disattivalo su una rete solo IPv6."
  ja: "制御用の接続は IPv4 のみを使います。IPv6 のみのネットワークではオフにしてください。"
  ko: "제어 연결은 IPv4만 사용합니다. IPv6 전용 네트워크에서는 이 옵션을 끄세요."
  nl: "Besturingsverbindingen gebruiken alleen IPv4. Zet dit uit op een netwerk met alleen IPv6."
  pl: "Połączenia sterujące używają tylko IPv4. Wyłącz to w sieci obsługującej tylko IPv6."
  pt: "As ligações de controlo usam apenas IPv4. Desative isto numa rede só IPv6."
  pt-BR: "As conexões de controle usam só IPv4. Desative isso em uma rede somente IPv6."
  pt-PT: "As ligações de controlo usam apenas IPv4. Desative isto numa rede só IPv6."
  ru: "Управляющие соединения используют только IPv4. Выключите это в сети только с IPv6."
  sv: "Styranslutningar använder bara IPv4. Stäng av detta i ett nätverk med bara IPv6."
  sw: "Miunganisho ya udhibiti hutumia IPv4 pekee. Zima hii kwenye mtandao wa IPv6 pekee."
  th: "การเชื่อมต่อควบคุมใช้ IPv4 เท่านั้น ปิดตัวเลือกนี้บนเครือข่ายที่มีแค่ IPv6"
  uk: "Керувальні з’єднання використовують лише IPv4. Вимкніть це в мережі лише з IPv6."
  vi: "Kết nối điều khiển chỉ dùng IPv4. Hãy tắt tùy chọn này trên mạng chỉ có IPv6."
  zh: "控制连接仅使用 IPv4。在仅支持 IPv6 的网络上请关闭此项。"
  zh-HK: "控制連線只使用 IPv4。在只支援 IPv6 的網絡上請關閉此項。"
