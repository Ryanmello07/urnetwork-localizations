description: "Feedback screen: the feedback could not be sent. The text stays in the field so the user can send it again."
source: "Your feedback wasn't sent. Check your connection and try again."
platforms:
  - android
localizations:
  ar: "لم تُرسَل ملاحظاتك. تحقّق من اتصالك وحاول مرة أخرى."
  cs: "Vaše zpětná vazba nebyla odeslána. Zkontrolujte připojení a zkuste to znovu."
  de: "Dein Feedback wurde nicht gesendet. Prüfe deine Verbindung und versuche es erneut."
  el: "Τα σχόλιά σας δεν στάλθηκαν. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά."
  en: "Your feedback wasn't sent. Check your connection and try again."
  es: "No se envió tu comentario. Revisa tu conexión e inténtalo de nuevo."
  es-419: "No se envió tu comentario. Revisa tu conexión e inténtalo de nuevo."
  es-MX: "No se envió tu comentario. Revisa tu conexión e inténtalo de nuevo."
  fr: "Votre avis n’a pas été envoyé. Vérifiez votre connexion et réessayez."
  he: "המשוב שלכם לא נשלח. בדקו את החיבור ונסו שוב."
  hi: "आपका फ़ीडबैक नहीं भेजा गया। अपना कनेक्शन जाँचें और दोबारा कोशिश करें।"
  id: "Masukan Anda tidak terkirim. Periksa koneksi Anda dan coba lagi."
  it: "Il tuo feedback non è stato inviato. Controlla la connessione e riprova."
  ja: "フィードバックを送信できませんでした。接続を確認してもう一度お試しください。"
  ko: "피드백을 보내지 못했습니다. 연결을 확인한 후 다시 시도하세요."
  nl: "Je feedback is niet verstuurd. Controleer je verbinding en probeer het opnieuw."
  pl: "Twoja opinia nie została wysłana. Sprawdź połączenie i spróbuj ponownie."
  pt: "O seu feedback não foi enviado. Verifique a sua ligação e tente novamente."
  pt-BR: "Seu feedback não foi enviado. Verifique sua conexão e tente novamente."
  pt-PT: "O seu feedback não foi enviado. Verifique a sua ligação e tente novamente."
  ru: "Ваш отзыв не отправлен. Проверьте подключение и попробуйте ещё раз."
  sv: "Din feedback skickades inte. Kontrollera din anslutning och försök igen."
  sw: "Maoni yako hayakutumwa. Kagua muunganisho wako kisha ujaribu tena."
  th: "ส่งความคิดเห็นของคุณไม่สำเร็จ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง"
  uk: "Ваш відгук не надіслано. Перевірте з’єднання і спробуйте ще раз."
  vi: "Phản hồi của bạn chưa được gửi. Hãy kiểm tra kết nối và thử lại."
  zh: "您的反馈未发送。请检查网络连接后重试。"
  zh-HK: "你的意見未能傳送。請檢查網絡連線後再試。"
