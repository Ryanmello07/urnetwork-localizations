description: "Windows Connect page: sentence appended to the line above when the service will stop a tunnel that carries nothing."
source: "If nothing gets through shortly, URnetwork will turn the tunnel off automatically so you keep your internet."
platforms:
  - windows
localizations:
  ar: "إذا لم يمر أي شيء قريبًا، فسيوقف URnetwork النفق تلقائيًا كي يبقى اتصالك بالإنترنت قائمًا."
  cs: "Pokud brzy nic neprojde, URnetwork tunel automaticky vypne, abyste nepřišli o internet."
  de: "Wenn in Kürze nichts durchkommt, schaltet URnetwork den Tunnel automatisch ab, damit deine Internetverbindung erhalten bleibt."
  el: "Αν δεν περάσει τίποτα σύντομα, το URnetwork θα απενεργοποιήσει αυτόματα τη σήραγγα ώστε να μη μείνετε χωρίς internet."
  en: "If nothing gets through shortly, URnetwork will turn the tunnel off automatically so you keep your internet."
  es: "Si nada consigue pasar en breve, URnetwork desactivará el túnel automáticamente para que no te quedes sin internet."
  es-419: "Si nada consigue pasar en breve, URnetwork desactivará el túnel automáticamente para que no te quedes sin internet."
  es-MX: "Si nada consigue pasar en breve, URnetwork desactivará el túnel automáticamente para que no te quedes sin internet."
  fr: "Si rien ne passe très bientôt, URnetwork désactivera automatiquement le tunnel pour que vous gardiez votre connexion Internet."
  he: "אם שום דבר לא יעבור בקרוב, URnetwork יכבה את המנהרה אוטומטית כדי שהאינטרנט שלכם ימשיך לעבוד."
  hi: "अगर जल्द ही कुछ नहीं पहुँचता, तो URnetwork टनल को अपने आप बंद कर देगा ताकि आपका इंटरनेट चलता रहे।"
  id: "Jika tidak ada yang tembus dalam waktu dekat, URnetwork akan mematikan terowongan secara otomatis agar internet Anda tetap berjalan."
  it: "Se a breve non passa nulla, URnetwork disattiverà automaticamente il tunnel così non perdi la connessione a Internet."
  ja: "まもなく何も通らない場合、インターネットを使い続けられるよう URnetwork が自動的にトンネルをオフにします。"
  ko: "곧 아무것도 통과하지 못하면 인터넷을 계속 사용할 수 있도록 URnetwork가 터널을 자동으로 끕니다."
  nl: "Als er binnenkort niets doorkomt, schakelt URnetwork de tunnel automatisch uit zodat je internet blijft werken."
  pl: "Jeśli wkrótce nic nie przejdzie, URnetwork automatycznie wyłączy tunel, żebyś nie stracił dostępu do internetu."
  pt: "Se nada passar em breve, a URnetwork vai desligar o túnel automaticamente para você não ficar sem internet."
  pt-BR: "Se nada passar em breve, a URnetwork vai desligar o túnel automaticamente para você não ficar sem internet."
  pt-PT: "Se nada passar em breve, a URnetwork desliga o túnel automaticamente para que não fique sem internet."
  ru: "Если в ближайшее время ничего не пройдёт, URnetwork автоматически отключит туннель, чтобы вы не остались без интернета."
  sv: "Om inget kommer igenom inom kort stänger URnetwork av tunneln automatiskt så att du behåller ditt internet."
  sw: "Ikiwa hakuna kitakachopita hivi karibuni, URnetwork itazima handaki kiotomatiki ili uendelee kuwa na intaneti."
  th: "หากยังไม่มีสิ่งใดผ่านไปได้ในเร็วๆ นี้ URnetwork จะปิดอุโมงค์โดยอัตโนมัติเพื่อให้คุณยังใช้อินเทอร์เน็ตได้"
  uk: "Якщо найближчим часом нічого не пройде, URnetwork автоматично вимкне тунель, щоб ви не залишилися без інтернету."
  vi: "Nếu không có gì đi qua trong chốc lát, URnetwork sẽ tự động tắt đường hầm để bạn vẫn có internet."
  zh: "如果很快仍没有任何流量通过，URnetwork 会自动关闭隧道，让你保持联网。"
  zh-HK: "如果很快仍沒有任何流量通過，URnetwork 會自動關閉隧道，讓你保持上網。"
