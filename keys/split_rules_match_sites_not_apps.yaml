description: "Split rules screen (iOS/macOS): why the rules match sites and addresses rather than apps. Apple's per-app VPN (NEAppRule) is available only on devices an organization manages (MDM). Points to host rules and presets, and notes that local network addresses already bypass the VPN. Keep Apple, VPN and MDM unchanged."
source: "Split rules match sites and addresses, not apps: Apple allows per-app VPN only on devices managed by an organization (MDM). To keep an app off the VPN, route the sites it uses locally, or start from a preset. Local network addresses already bypass the VPN."
platforms:
  - apple
localizations:
  ar: "تطابق قواعد التقسيم المواقع والعناوين، وليس التطبيقات: تسمح Apple بشبكة VPN لكل تطبيق فقط على الأجهزة التي تديرها مؤسسة (MDM). لإبقاء تطبيق خارج VPN، وجّه المواقع التي يستخدمها محليًا، أو ابدأ من إعداد مسبق. عناوين الشبكة المحلية تتجاوز VPN بالفعل."
  cs: "Pravidla rozdělení se vztahují na weby a adresy, ne na aplikace: Apple povoluje VPN pro jednotlivé aplikace jen na zařízeních spravovaných organizací (MDM). Chcete-li aplikaci ponechat mimo VPN, směrujte weby, které používá, lokálně, nebo začněte od předvolby. Adresy místní sítě už VPN obcházejí."
  de: "Split-Regeln gelten für Websites und Adressen, nicht für Apps: Apple erlaubt VPN pro App nur auf Geräten, die von einer Organisation verwaltet werden (MDM). Um eine App vom VPN auszunehmen, leite die Websites, die sie nutzt, lokal oder beginne mit einer Vorlage. Adressen im lokalen Netzwerk umgehen das VPN bereits."
  el: "Οι κανόνες διαχωρισμού ισχύουν για ιστότοπους και διευθύνσεις, όχι για εφαρμογές: η Apple επιτρέπει VPN ανά εφαρμογή μόνο σε συσκευές που διαχειρίζεται κάποιος οργανισμός (MDM). Για να κρατήσετε μια εφαρμογή εκτός VPN, δρομολογήστε τοπικά τους ιστότοπους που χρησιμοποιεί ή ξεκινήστε από μια προεπιλογή. Οι διευθύνσεις του τοπικού δικτύου παρακάμπτουν ήδη το VPN."
  en: "Split rules match sites and addresses, not apps: Apple allows per-app VPN only on devices managed by an organization (MDM). To keep an app off the VPN, route the sites it uses locally, or start from a preset. Local network addresses already bypass the VPN."
  es: "Las reglas de división se aplican a sitios y direcciones, no a apps: Apple solo permite la VPN por app en dispositivos administrados por una organización (MDM). Para dejar una app fuera de la VPN, enruta localmente los sitios que usa o empieza con una plantilla. Las direcciones de la red local ya omiten la VPN."
  es-419: "Las reglas de división se aplican a sitios y direcciones, no a apps: Apple solo permite la VPN por app en dispositivos administrados por una organización (MDM). Para dejar una app fuera de la VPN, enruta localmente los sitios que usa o comienza con una plantilla. Las direcciones de la red local ya omiten la VPN."
  es-MX: "Las reglas de división se aplican a sitios y direcciones, no a apps: Apple solo permite la VPN por app en dispositivos administrados por una organización (MDM). Para dejar una app fuera de la VPN, enruta localmente los sitios que usa o comienza con una plantilla. Las direcciones de la red local ya omiten la VPN."
  fr: "Les règles de séparation s’appliquent aux sites et aux adresses, pas aux apps : Apple n’autorise le VPN par app que sur les appareils gérés par une organisation (MDM). Pour garder une app hors du VPN, acheminez localement les sites qu’elle utilise, ou partez d’un modèle. Les adresses du réseau local contournent déjà le VPN."
  he: "כללי פיצול חלים על אתרים וכתובות, לא על אפליקציות: Apple מאפשרת VPN לפי אפליקציה רק במכשירים שמנוהלים על ידי ארגון (MDM). כדי להשאיר אפליקציה מחוץ ל-VPN, נתב מקומית את האתרים שהיא משתמשת בהם, או התחל מתבנית. כתובות ברשת המקומית כבר עוקפות את ה-VPN."
  hi: "स्प्लिट नियम साइटों और पतों पर लागू होते हैं, ऐप्स पर नहीं: Apple प्रति-ऐप VPN की अनुमति केवल उन डिवाइस पर देता है जिन्हें कोई संगठन प्रबंधित करता है (MDM)। किसी ऐप को VPN से बाहर रखने के लिए, वह जिन साइटों का उपयोग करता है उन्हें लोकल रूट करें, या किसी प्रीसेट से शुरू करें। लोकल नेटवर्क के पते पहले से VPN को बायपास करते हैं।"
  id: "Aturan pemisahan berlaku untuk situs dan alamat, bukan aplikasi: Apple hanya mengizinkan VPN per aplikasi di perangkat yang dikelola organisasi (MDM). Agar aplikasi tidak melalui VPN, rutekan situs yang digunakannya secara lokal, atau mulai dari preset. Alamat jaringan lokal sudah tidak melalui VPN."
  it: "Le regole di suddivisione si applicano a siti e indirizzi, non alle app: Apple consente la VPN per singola app solo sui dispositivi gestiti da un’organizzazione (MDM). Per tenere un’app fuori dalla VPN, instrada localmente i siti che usa, oppure inizia da una preimpostazione. Gli indirizzi della rete locale aggirano già la VPN."
  ja: "分割ルールが対象にするのはアプリではなく、サイトとアドレスです。Appleはアプリ単位のVPNを、組織が管理するデバイス（MDM）でのみ許可しています。アプリをVPNの対象外にするには、そのアプリが使うサイトをローカルにルーティングするか、プリセットから始めてください。ローカルネットワークのアドレスは、すでにVPNを経由しません。"
  ko: "분할 규칙은 앱이 아니라 사이트와 주소에 적용됩니다. Apple은 조직이 관리하는 기기(MDM)에서만 앱별 VPN을 허용합니다. 앱을 VPN에서 제외하려면 해당 앱이 사용하는 사이트를 로컬로 라우팅하거나 프리셋으로 시작하세요. 로컬 네트워크 주소는 이미 VPN을 우회합니다."
  nl: "Splitsregels gelden voor sites en adressen, niet voor apps: Apple staat VPN per app alleen toe op apparaten die door een organisatie worden beheerd (MDM). Om een app buiten de VPN te houden, routeer je de sites die de app gebruikt lokaal, of begin je met een voorinstelling. Adressen in het lokale netwerk omzeilen de VPN al."
  pl: "Reguły podziału dotyczą witryn i adresów, a nie aplikacji: Apple zezwala na VPN dla poszczególnych aplikacji tylko na urządzeniach zarządzanych przez organizację (MDM). Aby wyłączyć aplikację z VPN, kieruj lokalnie witryny, z których korzysta, albo zacznij od szablonu. Adresy sieci lokalnej już omijają VPN."
  pt: "As regras de divisão se aplicam a sites e endereços, não a apps: a Apple só permite VPN por app em dispositivos gerenciados por uma organização (MDM). Para manter um app fora da VPN, roteie localmente os sites que ele usa ou comece com uma predefinição. Os endereços da rede local já ignoram a VPN."
  pt-BR: "As regras de divisão se aplicam a sites e endereços, não a apps: a Apple só permite VPN por app em dispositivos gerenciados por uma organização (MDM). Para manter um app fora da VPN, roteie localmente os sites que ele usa ou comece com uma predefinição. Os endereços da rede local já ignoram a VPN."
  pt-PT: "As regras de divisão aplicam-se a sites e endereços, não a aplicações: a Apple só permite VPN por aplicação em dispositivos geridos por uma organização (MDM). Para manter uma aplicação fora da VPN, encaminhe localmente os sites que ela utiliza ou comece a partir de uma predefinição. Os endereços da rede local já ignoram a VPN."
  ru: "Правила разделения применяются к сайтам и адресам, а не к приложениям: Apple разрешает VPN для отдельных приложений только на устройствах, которыми управляет организация (MDM). Чтобы приложение работало вне VPN, направьте сайты, которые оно использует, локально или начните с шаблона. Адреса локальной сети уже идут в обход VPN."
  sv: "Delningsregler gäller webbplatser och adresser, inte appar: Apple tillåter VPN per app bara på enheter som hanteras av en organisation (MDM). Om du vill hålla en app utanför VPN:et dirigerar du de webbplatser den använder lokalt, eller börjar från en förinställning. Adresser i det lokala nätverket kringgår redan VPN:et."
  sw: "Sheria za mgawanyo zinahusu tovuti na anwani, si programu: Apple inaruhusu VPN ya kila programu kwenye vifaa vinavyosimamiwa na shirika (MDM) pekee. Ili kuweka programu nje ya VPN, elekeza tovuti inazotumia kupitia mtandao wa ndani, au anza kutoka kwa mpangilio uliowekwa tayari. Anwani za mtandao wa ndani tayari zinapita nje ya VPN."
  th: "กฎแยกเส้นทางใช้กับเว็บไซต์และที่อยู่ ไม่ใช่แอป: Apple อนุญาต VPN แยกตามแอปเฉพาะบนอุปกรณ์ที่องค์กรจัดการ (MDM) เท่านั้น หากต้องการให้แอปไม่ผ่าน VPN ให้กำหนดเส้นทางเว็บไซต์ที่แอปนั้นใช้ให้ออกทางเครือข่ายภายใน หรือเริ่มจากพรีเซ็ต ที่อยู่ในเครือข่ายภายในข้าม VPN อยู่แล้ว"
  uk: "Правила розділення застосовуються до сайтів і адрес, а не до застосунків: Apple дозволяє VPN для окремих застосунків лише на пристроях, якими керує організація (MDM). Щоб застосунок працював поза VPN, спрямуйте сайти, які він використовує, локально або почніть із шаблону. Адреси локальної мережі вже оминають VPN."
  vi: "Quy tắc tách luồng áp dụng cho trang web và địa chỉ, không phải ứng dụng: Apple chỉ cho phép VPN theo ứng dụng trên thiết bị do tổ chức quản lý (MDM). Để giữ một ứng dụng ngoài VPN, hãy định tuyến cục bộ các trang web mà ứng dụng đó dùng, hoặc bắt đầu từ cài đặt sẵn. Địa chỉ mạng cục bộ vốn đã bỏ qua VPN."
  zh: "分流规则针对的是网站和地址，而不是应用：Apple 仅允许在由组织管理的设备（MDM）上使用按应用 VPN。要让某个应用不走 VPN，请将它使用的网站设为本地路由，或从预设开始。本地网络地址本来就不经过 VPN。"
  zh-HK: "分流規則針對的是網站和地址，而不是應用程式：Apple 只允許在由機構管理的裝置（MDM）上使用按應用程式 VPN。如要讓某個應用程式不經 VPN，請將它使用的網站設為本地路由，或從預設開始。本地網絡地址本來就不經過 VPN。"
