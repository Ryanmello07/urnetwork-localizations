  he: "כמה זמן כל המנהרה יכולה לשתוק לפני שהכרעות על ספקים מעוכבות כבלתי קבילות, במילישניות. 0 מרשיע כמו קודם"
  hi: "प्रदाता फ़ैसलों को अस्वीकार्य मानकर रोके जाने से पहले पूरी टनल कितनी देर चुप रह सकती है, ms में। 0 पहले की तरह दोषी ठहराता है"
  id: "Berapa lama seluruh tunnel boleh diam sebelum vonis terhadap penyedia ditahan karena tidak dapat diterima, dalam ms. 0 memvonis seperti sebelumnya"
