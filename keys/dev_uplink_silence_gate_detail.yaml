  uk: "Як довго весь тунель може мовчати, перш ніж вердикти щодо провайдерів утримуються як неприйнятні, у мс. 0 засуджує, як раніше"
  vi: "Toàn bộ đường hầm có thể im lặng bao lâu trước khi các phán quyết về nhà cung cấp bị giữ lại vì không đủ căn cứ, tính bằng ms. 0 kết luận lỗi như trước"
  zh: "整个隧道静默多长时间（毫秒）后，针对提供商的判定将被视为不可采信而暂缓。0 表示照旧定罪"
