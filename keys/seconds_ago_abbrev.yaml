description: "Compact relative-time label with an abbreviated seconds unit (\"42s ago\"), shown by the windows and linux stats formatters for events 5-59 seconds old (younger events show the `now` key). The argument is the elapsed seconds. Not a plural: the abbreviated unit does not inflect, but the word order and the unit letter localize."
source: "{count}s ago"
platforms:
  - windows
  - linux
  - site
placeholders:
  - name: count
    type: int
