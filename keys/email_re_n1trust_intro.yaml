description: "Re-engagement email N1 (trust) opening."
source: "You told me you weren't sure you could trust a VPN. That's the right question to ask of any VPN, including us, so here are specifics instead of reassurance."
platforms:
  - email
localizations:
  en: "You told me you weren't sure you could trust a VPN. That's the right question to ask of any VPN, including us, so here are specifics instead of reassurance."
  ar: "أخبرتني أنك لست متأكداً من أنك تستطيع الوثوق بـ VPN. وهذا هو السؤال الصحيح الذي ينبغي طرحه على أي VPN، بما في ذلك نحن، لذا إليك تفاصيل محددة بدلاً من كلمات مطمئنة."
  cs: "Dali jste mi vědět, že si nejste jistí, jestli můžete VPN věřit. To je správná otázka pro každou VPN, včetně nás, takže tady jsou konkrétní fakta místo uklidňování."
  de: "Du hast mir gesagt, dass du nicht sicher bist, ob du einem VPN vertrauen kannst. Das ist die richtige Frage an jedes VPN, auch an uns, deshalb hier Konkretes statt beruhigender Worte."
  el: "Μου είπες ότι είχες αμφιβολίες για το αν μπορείς να εμπιστευτείς ένα VPN. Αυτή είναι η σωστή ερώτηση για κάθε VPN, και για εμάς, οπότε ορίστε συγκεκριμένα στοιχεία αντί για καθησυχαστικά λόγια."
  es: "Me dijiste que no sabías si podías confiar en una VPN. Es la pregunta correcta para hacerle a cualquier VPN, nosotros incluidos, así que aquí van datos concretos en lugar de palabras tranquilizadoras."
  es-419: "Me dijiste que no sabías si podías confiar en una VPN. Es la pregunta correcta para hacerle a cualquier VPN, nosotros incluidos, así que aquí van datos concretos en lugar de palabras tranquilizadoras."
  es-MX: "Me dijiste que no sabías si podías confiar en una VPN. Es la pregunta correcta para hacerle a cualquier VPN, nosotros incluidos, así que aquí van datos concretos en lugar de palabras tranquilizadoras."
  fr: "Tu m'as dit que tu ne savais pas si tu pouvais faire confiance à un VPN. C'est la bonne question à poser à n'importe quel VPN, nous compris, alors voici du concret plutôt que des paroles rassurantes."
  he: "סיפרתם לי שאתם לא בטוחים שאפשר לסמוך על VPN. זו השאלה הנכונה לשאול על כל VPN, כולל עלינו, אז הנה פרטים מדויקים במקום מילים מרגיעות."
  hi: "आपने मुझे बताया था कि आपको यकीन नहीं है कि आप किसी VPN पर भरोसा कर सकते हैं। किसी भी VPN से, हमसे भी, यही सवाल पूछना सही है, इसलिए तसल्ली देने के बजाय यहाँ ठोस जानकारी है।"
  id: "Kamu memberi tahu saya bahwa kamu tidak yakin bisa memercayai VPN. Itu pertanyaan yang tepat untuk diajukan kepada VPN mana pun, termasuk kami, jadi inilah rinciannya, bukan sekadar kata-kata penenang."
  it: "Mi hai detto che non sapevi se poterti fidare di una VPN. È la domanda giusta da fare a qualsiasi VPN, noi compresi, quindi ecco fatti concreti invece di rassicurazioni."
  ja: "VPN を信用していいか分からない、と教えていただきました。それは私たちを含め、どの VPN にも向けるべき正しい問いです。なので、安心してくださいと言う代わりに、具体的なことをお伝えします。"
  ko: "VPN을 믿어도 될지 모르겠다고 하셨죠. 저희를 포함해 어떤 VPN에든 물어야 할 올바른 질문입니다. 그래서 안심하라는 말 대신 구체적인 내용을 말씀드리겠습니다."
  nl: "Je vertelde me dat je niet zeker wist of je een VPN kon vertrouwen. Dat is de juiste vraag voor elke VPN, ook voor ons, dus hier zijn concrete feiten in plaats van geruststellende woorden."
  pl: "Dałeś mi znać, że nie masz pewności, czy możesz zaufać VPN-owi. To właściwe pytanie wobec każdego VPN-a, także wobec nas, więc zamiast zapewnień podaję konkrety."
  pt: "Você me disse que não sabia se podia confiar em uma VPN. Essa é a pergunta certa a fazer a qualquer VPN, inclusive a nós, então aqui vão fatos concretos em vez de palavras tranquilizadoras."
  pt-BR: "Você me disse que não sabia se podia confiar em uma VPN. Essa é a pergunta certa a fazer a qualquer VPN, inclusive a nós, então aqui vão fatos concretos em vez de palavras tranquilizadoras."
  pt-PT: "Disse-me que não sabia se podia confiar numa VPN. É a pergunta certa a fazer a qualquer VPN, incluindo a nós, por isso aqui ficam factos concretos em vez de palavras tranquilizadoras."
  ru: "Вы сказали, что не уверены, можно ли доверять VPN. Это правильный вопрос к любому VPN, включая нас, поэтому вот конкретные факты вместо заверений."
  sv: "Du sa att du inte var säker på om du kunde lita på en VPN. Det är rätt fråga att ställa till vilken VPN som helst, även till oss, så här kommer konkreta fakta i stället för lugnande ord."
  sw: "Uliniambia kuwa huna uhakika kama unaweza kuamini VPN. Hilo ndilo swali sahihi la kuuliza kuhusu VPN yoyote, ikiwemo sisi, kwa hivyo haya ni mambo mahususi badala ya maneno ya kukutuliza."
  th: "คุณบอกผมว่าไม่แน่ใจว่าจะไว้ใจ VPN ได้หรือไม่ นั่นเป็นคำถามที่ถูกต้องที่ควรถาม VPN ทุกเจ้า รวมถึงเราด้วย นี่จึงเป็นข้อมูลที่เจาะจงแทนคำปลอบใจ"
  uk: "Ви сказали, що не впевнені, чи можна довіряти VPN. Це правильне питання до будь-якого VPN, зокрема й до нас, тож ось конкретні факти замість заспокійливих слів."
  vi: "Bạn đã nói với tôi rằng bạn không chắc có thể tin một VPN. Đó là câu hỏi đúng đắn cần đặt ra với bất kỳ VPN nào, kể cả chúng tôi, nên đây là những điều cụ thể thay vì lời trấn an."
  zh: "你告诉我，你不确定能不能信任 VPN。这是对任何 VPN 都该问的问题，包括我们。所以我不说“请放心”，而是给你具体的细节。"
  zh-HK: "你告訴我，你不確定能不能信任 VPN。這是對任何 VPN 都應該問的問題，包括我們。所以我不說「請放心」，而是給你具體的細節。"
