description: "Earnings screen, the payout card for the network's payouts. An error under the Set up payouts button: the new key could not be written to the device's secure storage."
source: "Couldn't save the key on this device, so nothing was signed. Try again, or save the recovery phrase first."
platforms:
  - linux
  - apple
  - android
  - windows
localizations:
  ar: "تعذّر حفظ المفتاح على هذا الجهاز، لذا لم يُوقَّع أي شيء. حاول مرة أخرى، أو احفظ عبارة النسخ الاحتياطي أولًا."
  cs: "Klíč se na tomto zařízení nepodařilo uložit, takže nebylo nic podepsáno. Zkuste to znovu, nebo si nejdřív uložte obnovovací frázi."
  de: "Der Schlüssel konnte auf diesem Gerät nicht gespeichert werden, daher wurde nichts signiert. Versuche es erneut oder speichere zuerst die Wiederherstellungsphrase."
  el: "Δεν ήταν δυνατή η αποθήκευση του κλειδιού σε αυτή τη συσκευή, οπότε δεν υπογράφηκε τίποτα. Δοκιμάστε ξανά ή αποθηκεύστε πρώτα τη φράση επαναφοράς."
  en: "Couldn't save the key on this device, so nothing was signed. Try again, or save the recovery phrase first."
  es: "No se pudo guardar la clave en este dispositivo, así que no se firmó nada. Vuelve a intentarlo o guarda primero la frase de recuperación."
  es-419: "No se pudo guardar la clave en este dispositivo, así que no se firmó nada. Vuelve a intentarlo o guarda primero la frase de recuperación."
  es-MX: "No se pudo guardar la clave en este dispositivo, así que no se firmó nada. Vuelve a intentarlo o guarda primero la frase de recuperación."
  fr: "Impossible d’enregistrer la clé sur cet appareil, donc rien n’a été signé. Réessayez ou enregistrez d’abord la phrase de sauvegarde."
  he: "לא ניתן היה לשמור את המפתח במכשיר הזה, ולכן שום דבר לא נחתם. נסו שוב, או שמרו קודם את ביטוי השחזור."
  hi: "इस डिवाइस पर कुंजी सहेजी नहीं जा सकी, इसलिए कुछ भी साइन नहीं हुआ। दोबारा कोशिश करें, या पहले रिकवरी फ़्रेज़ सहेजें।"
  id: "Tidak dapat menyimpan kunci di perangkat ini, jadi tidak ada yang ditandatangani. Coba lagi, atau simpan frasa cadangan terlebih dahulu."
  it: "Impossibile salvare la chiave su questo dispositivo, quindi non è stato firmato nulla. Riprova oppure salva prima la frase di recupero."
  ja: "このデバイスにキーを保存できなかったため、何も署名されていません。もう一度お試しいただくか、先に復元フレーズを保存してください。"
  ko: "이 기기에 키를 저장하지 못해 아무것도 서명되지 않았습니다. 다시 시도하거나 복구 문구를 먼저 저장하세요."
  nl: "De sleutel kon niet op dit apparaat worden opgeslagen, dus er is niets ondertekend. Probeer het opnieuw of sla eerst de herstelzin op."
  pl: "Nie udało się zapisać klucza na tym urządzeniu, więc nic nie zostało podpisane. Spróbuj ponownie lub najpierw zapisz frazę odzyskiwania."
  pt: "Não foi possível guardar a chave neste dispositivo, por isso nada foi assinado. Tente novamente ou guarde primeiro a frase de recuperação."
  pt-BR: "Não foi possível salvar a chave neste dispositivo, então nada foi assinado. Tente novamente ou salve primeiro a frase de recuperação."
  pt-PT: "Não foi possível guardar a chave neste dispositivo, por isso nada foi assinado. Tente novamente ou guarde primeiro a frase de recuperação."
  ru: "Не удалось сохранить ключ на этом устройстве, поэтому ничего не подписано. Повторите попытку или сначала сохраните фразу восстановления."
  sv: "Det gick inte att spara nyckeln på den här enheten, så inget har signerats. Försök igen eller spara återställningsfrasen först."
  sw: "Imeshindwa kuhifadhi ufunguo kwenye kifaa hiki, kwa hivyo hakuna kilichotiwa sahihi. Jaribu tena, au hifadhi kifungu cha urejeshaji kwanza."
  th: "ไม่สามารถบันทึกคีย์บนอุปกรณ์นี้ได้ จึงไม่มีการลงนามใดๆ ลองอีกครั้ง หรือบันทึกวลีสำรองก่อน"
  uk: "Не вдалося зберегти ключ на цьому пристрої, тому нічого не підписано. Спробуйте ще раз або спершу збережіть фразу відновлення."
  vi: "Không thể lưu khóa trên thiết bị này nên không có gì được ký. Hãy thử lại hoặc lưu cụm từ sao lưu trước."
  zh: "无法在这台设备上保存密钥，因此未进行任何签名。请重试，或先保存恢复短语。"
  zh-HK: "無法在這部裝置上儲存金鑰，因此沒有簽署任何內容。請再試一次，或先儲存復原短語。"
