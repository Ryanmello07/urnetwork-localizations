description: "Kill switch status: in force and armed, only local traffic leaves until connected."
source: "In force: nothing but local network traffic leaves this device until you connect."
platforms:
  - linux
localizations:
  ar: "ساري المفعول: لا يغادر هذا الجهاز سوى حركة الشبكة المحلية حتى تتصل."
  cs: "V platnosti: z tohoto zařízení neodchází nic kromě provozu v místní síti, dokud se nepřipojíte."
  de: "In Kraft: Bis du dich verbindest, verlässt nur lokaler Netzwerkverkehr dieses Gerät."
  el: "Σε ισχύ: μόνο η κίνηση τοπικού δικτύου φεύγει από αυτήν τη συσκευή μέχρι να συνδεθείτε."
  en: "In force: nothing but local network traffic leaves this device until you connect."
  es: "En vigor: solo el tráfico de la red local sale de este dispositivo hasta que te conectes."
  es-419: "En vigor: solo el tráfico de la red local sale de este dispositivo hasta que te conectes."
  es-MX: "En vigor: solo el tráfico de la red local sale de este dispositivo hasta que te conectes."
  fr: "En vigueur : seul le trafic du réseau local quitte cet appareil jusqu’à ce que vous vous connectiez."
  he: "בתוקף: שום דבר מלבד תעבורת הרשת המקומית לא יוצא מהמכשיר הזה עד שתתחברו."
  hi: "प्रभावी: जब तक आप कनेक्ट नहीं करते, स्थानीय नेटवर्क ट्रैफ़िक के अलावा कुछ भी इस डिवाइस से बाहर नहीं जाता।"
  id: "Berlaku: tidak ada yang keluar dari perangkat ini selain lalu lintas jaringan lokal sampai Anda terhubung."
  it: "In vigore: dal dispositivo esce solo il traffico della rete locale finché non ti connetti."
  ja: "有効：接続するまで、ローカルネットワークの通信以外はこのデバイスから出ていきません。"
  ko: "적용 중: 연결할 때까지 로컬 네트워크 트래픽 외에는 아무것도 이 기기에서 나가지 않습니다."
  nl: "Van kracht: tot je verbinding maakt verlaat alleen lokaal netwerkverkeer dit apparaat."
  pl: "Obowiązuje: dopóki się nie połączysz, z tego urządzenia wychodzi tylko ruch w sieci lokalnej."
  pt: "Em vigor: nada além do tráfego da rede local sai deste dispositivo até você conectar."
  pt-BR: "Em vigor: nada além do tráfego da rede local sai deste dispositivo até você conectar."
  pt-PT: "Em vigor: nada além do tráfego da rede local sai deste dispositivo até ligar."
  ru: "Действует: пока вы не подключитесь, с этого устройства уходит только трафик локальной сети."
  sv: "Gäller: bara lokal nätverkstrafik lämnar den här enheten tills du ansluter."
  sw: "Inatumika: hakuna kinachotoka kwenye kifaa hiki isipokuwa trafiki ya mtandao wa ndani hadi uunganishe."
  th: "มีผลอยู่: จนกว่าคุณจะเชื่อมต่อ จะไม่มีสิ่งใดออกจากอุปกรณ์นี้นอกจากทราฟฟิกในเครือข่ายท้องถิ่น"
  uk: "Діє: доки ви не підключитеся, із цього пристрою виходить лише трафік локальної мережі."
  vi: "Đang có hiệu lực: chỉ lưu lượng mạng cục bộ rời khỏi thiết bị này cho đến khi bạn kết nối."
  zh: "生效中：在你连接之前，只有本地网络流量会离开此设备。"
  zh-HK: "生效中：在你連線之前，只有本地網絡流量會離開此裝置。"
