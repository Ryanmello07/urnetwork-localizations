description: "ur.io: notice over the page when another tab signs in to another network; this page stops its work until the visitor refreshes it."
source: "This browser was signed in to another network in another tab. Refresh this page to continue."
platforms:
  - site
localizations:
  ar: "تم تسجيل الدخول في هذا المتصفح إلى شبكة أخرى من علامة تبويب أخرى. حدّث هذه الصفحة للمتابعة."
  de: "Dieser Browser wurde in einem anderen Tab bei einem anderen Netzwerk angemeldet. Aktualisiere diese Seite, um fortzufahren."
  en: "This browser was signed in to another network in another tab. Refresh this page to continue."
  es: "Este navegador inició sesión en otra red desde otra pestaña. Actualiza esta página para continuar."
  ru: "В этом браузере выполнен вход в другую сеть на другой вкладке. Обновите эту страницу, чтобы продолжить."
  zh: "此浏览器已在另一个标签页中登录了其他网络。请刷新此页面以继续。"
