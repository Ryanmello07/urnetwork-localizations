description: "Re-engagement email R3 opening. Sent both to people who stopped connecting and to people who never connected, so it must not claim either."
source: "I'd rather not fill your inbox with emails you don't need, so before I send anything else, I'm checking with you."
platforms:
  - email
localizations:
  en: "I'd rather not fill your inbox with emails you don't need, so before I send anything else, I'm checking with you."
  ar: "أفضّل ألا أملأ صندوق بريدك برسائل لا تحتاج إليها، لذا قبل أن أرسل أي شيء آخر، أسألك أولاً."
  cs: "Nerad bych vám zaplňoval schránku e-maily, které nepotřebujete, takže než pošlu cokoli dalšího, ptám se vás."
  de: "Ich möchte dein Postfach lieber nicht mit E-Mails füllen, die du nicht brauchst, deshalb frage ich dich, bevor ich noch etwas schicke."
  el: "Προτιμώ να μη γεμίζω τα εισερχόμενά σου με email που δεν χρειάζεσαι, οπότε πριν στείλω οτιδήποτε άλλο, σε ρωτάω."
  es: "Prefiero no llenar tu bandeja de entrada con correos que no necesitas, así que antes de enviarte nada más, te lo pregunto."
  es-419: "Prefiero no llenar tu bandeja de entrada con correos que no necesitas, así que antes de enviarte nada más, te lo pregunto."
  es-MX: "Prefiero no llenar tu bandeja de entrada con correos que no necesitas, así que antes de enviarte nada más, te lo pregunto."
  fr: "Je préfère ne pas remplir ta boîte de réception d'e-mails dont tu n'as pas besoin, alors avant de t'envoyer quoi que ce soit d'autre, je te pose la question."
  he: "אני מעדיף לא למלא לכם את תיבת הדואר במיילים שאתם לא צריכים, אז לפני שאשלח משהו נוסף, אני בודק איתכם."
  hi: "मैं आपका इनबॉक्स ऐसे ईमेल से नहीं भरना चाहता जिनकी आपको ज़रूरत नहीं है, इसलिए कुछ और भेजने से पहले मैं आपसे पूछ रहा हूँ।"
  id: "Saya tidak ingin memenuhi kotak masukmu dengan email yang tidak kamu perlukan, jadi sebelum mengirim apa pun lagi, saya bertanya dulu kepadamu."
  it: "Preferisco non riempirti la casella di posta con email che non ti servono, quindi prima di mandarti altro te lo chiedo."
  ja: "必要のないメールで受信箱をいっぱいにしたくないので、これ以上何かをお送りする前に、確認させてください。"
  ko: "필요 없는 메일로 받은편지함을 채우고 싶지 않아서, 무언가를 더 보내기 전에 먼저 여쭤봅니다."
  nl: "Ik vul je inbox liever niet met e-mails die je niet nodig hebt, dus voordat ik nog iets stuur, vraag ik het eerst aan jou."
  pl: "Wolałbym nie zapychać ci skrzynki e-mailami, których nie potrzebujesz, więc zanim wyślę coś jeszcze, pytam cię o zdanie."
  pt: "Prefiro não encher sua caixa de entrada com e-mails de que você não precisa, então, antes de enviar qualquer outra coisa, quero confirmar com você."
  pt-BR: "Prefiro não encher sua caixa de entrada com e-mails de que você não precisa, então, antes de enviar qualquer outra coisa, quero confirmar com você."
  pt-PT: "Prefiro não encher a sua caixa de entrada com e-mails de que não precisa, por isso, antes de enviar mais alguma coisa, quero confirmar consigo."
  ru: "Мне не хотелось бы забивать ваш ящик письмами, которые вам не нужны, поэтому, прежде чем отправить что-то ещё, я спрашиваю вас."
  sv: "Jag vill helst inte fylla din inkorg med mejl du inte behöver, så innan jag skickar något mer frågar jag dig."
  sw: "Ningependa nisijaze kikasha chako barua pepe usizohitaji, kwa hivyo kabla sijatuma kitu kingine chochote, ninakuuliza kwanza."
  th: "ผมไม่อยากให้กล่องจดหมายของคุณเต็มไปด้วยอีเมลที่คุณไม่ต้องการ ก่อนจะส่งอะไรเพิ่ม ผมจึงขอถามคุณก่อน"
  uk: "Мені не хотілося б засмічувати вашу скриньку листами, які вам не потрібні, тому, перш ніж надіслати щось іще, я питаю вас."
  vi: "Tôi không muốn làm đầy hộp thư của bạn bằng những email bạn không cần, nên trước khi gửi thêm bất cứ điều gì, tôi muốn hỏi ý bạn."
  zh: "我不想用你不需要的邮件塞满你的收件箱，所以在发其他任何东西之前，先问问你。"
  zh-HK: "我不想用你不需要的郵件塞滿你的收件匣，所以在發其他任何東西之前，先問問你。"
