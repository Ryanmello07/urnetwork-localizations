description: "Line under the connected coldkey."
source: "Connected to the UR protocol. Claims land here. Alpha accrues from the next epoch after connecting."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "متصل ببروتوكول UR. يصل ما تطالب به إلى هنا. يتراكم Alpha بدءًا من الفترة التالية بعد الاتصال."
  cs: "Připojeno k protokolu UR. Vyzvednuté nároky přicházejí sem. Alpha se připisuje od epochy následující po připojení."
  de: "Mit dem UR-Protokoll verbunden. Einlösungen landen hier. Alpha sammelt sich ab der nächsten Epoche nach dem Verbinden an."
  el: "Συνδέθηκε στο πρωτόκολλο UR. Οι διεκδικήσεις καταλήγουν εδώ. Το Alpha συσσωρεύεται από την εποχή μετά τη σύνδεση."
  en: "Connected to the UR protocol. Claims land here. Alpha accrues from the next epoch after connecting."
  es: "Conectado al protocolo UR. Lo que reclames llega aquí. El Alpha se acumula a partir de la siguiente época tras conectarte."
  es-419: "Conectado al protocolo UR. Lo que reclames llega aquí. El Alpha se acumula a partir de la siguiente época después de conectarte."
  es-MX: "Conectado al protocolo UR. Lo que reclames llega aquí. El Alpha se acumula a partir de la siguiente época después de conectarte."
  fr: "Connecté au protocole UR. Les réclamations arrivent ici. L’Alpha s’accumule à partir de l’époque qui suit la connexion."
  he: "מחובר לפרוטוקול UR. המימושים מגיעים לכאן. ה-Alpha מצטבר החל מהתקופה שאחרי החיבור."
  hi: "UR प्रोटोकॉल से कनेक्टेड। दावे यहीं आते हैं। Alpha कनेक्ट करने के बाद वाले एपोक से जमा होता है।"
  id: "Terhubung ke protokol UR. Klaim masuk ke sini. Alpha terkumpul mulai epoch setelah terhubung."
  it: "Collegato al protocollo UR. I riscatti arrivano qui. L’Alpha matura dall’epoca successiva al collegamento."
  ja: "UR プロトコルに接続済みです。受け取りはここに届きます。Alpha は接続後の次のエポックから貯まります。"
  ko: "UR 프로토콜에 연결되었습니다. 받은 보상은 여기로 들어옵니다. Alpha는 연결 후 다음 에포크부터 쌓입니다."
  nl: "Verbonden met het UR-protocol. Claims komen hier terecht. Alpha bouwt zich op vanaf de epoch na het koppelen."
  pl: "Połączono z protokołem UR. Odbiory trafiają tutaj. Alpha nalicza się od epoki następującej po połączeniu."
  pt: "Ligada ao protocolo UR. As reivindicações chegam aqui. O Alpha acumula a partir da época seguinte à ligação."
  pt-BR: "Conectada ao protocolo UR. Os resgates chegam aqui. O Alpha se acumula a partir da época seguinte à conexão."
  pt-PT: "Ligada ao protocolo UR. As reivindicações chegam aqui. O Alpha acumula a partir da época seguinte à ligação."
  ru: "Подключено к протоколу UR. Полученные средства поступают сюда. Alpha начисляется со следующей эпохи после подключения."
  sv: "Ansluten till UR-protokollet. Uttag hamnar här. Alpha samlas från epoken efter anslutningen."
  sw: "Imeunganishwa na itifaki ya UR. Madai huingia hapa. Alpha hulimbikizwa kuanzia kipindi kinachofuata baada ya kuunganisha."
  th: "เชื่อมต่อกับโปรโตคอล UR แล้ว รายการที่รับจะเข้ามาที่นี่ Alpha เริ่มสะสมตั้งแต่อีพอคถัดจากที่เชื่อมต่อ"
  uk: "Підключено до протоколу UR. Отримані кошти надходять сюди. Alpha нараховується з епохи, що настає після підключення."
  vi: "Đã kết nối với giao thức UR. Các khoản nhận sẽ về đây. Alpha được tích lũy từ epoch sau khi kết nối."
  zh: "已连接到 UR 协议。领取的收益将存入此处。Alpha 从连接后的下一个周期开始累积。"
  zh-HK: "已連接 UR 協定。領取的收益會存入此處。Alpha 由連接後的下一個週期開始累積。"
