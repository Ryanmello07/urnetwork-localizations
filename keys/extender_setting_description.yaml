description: "Secondary text under the Extender setting: what turning it on does, and the ports the extender listens on."
source: "While you are providing, this device also relays for people whose access to the network is blocked, on TCP and UDP 443 and UDP 4053."
platforms:
  - apple
  - linux
  - windows
localizations:
  ar: "أثناء التوفير، يعمل هذا الجهاز أيضًا كمُرحِّل للأشخاص الذين حُجب وصولهم إلى الشبكة، عبر TCP و UDP 443 و UDP 4053."
  cs: "Když poskytujete, toto zařízení také přenáší provoz pro lidi, jejichž přístup k síti je blokovaný, na TCP a UDP 443 a UDP 4053."
  de: "Während du bereitstellst, leitet dieses Gerät auch Verkehr für Menschen weiter, deren Zugang zum Netzwerk blockiert ist, über TCP und UDP 443 sowie UDP 4053."
  el: "Όσο παρέχετε, αυτή η συσκευή αναμεταδίδει επίσης για άτομα των οποίων η πρόσβαση στο δίκτυο είναι αποκλεισμένη, σε TCP και UDP 443 και UDP 4053."
  en: "While you are providing, this device also relays for people whose access to the network is blocked, on TCP and UDP 443 and UDP 4053."
  es: "Mientras proporcionas, este dispositivo también retransmite para las personas cuyo acceso a la red está bloqueado, en TCP y UDP 443 y UDP 4053."
  es-419: "Mientras proporcionas, este dispositivo también retransmite para las personas cuyo acceso a la red está bloqueado, en TCP y UDP 443 y UDP 4053."
  es-MX: "Mientras proporcionas, este dispositivo también retransmite para las personas cuyo acceso a la red está bloqueado, en TCP y UDP 443 y UDP 4053."
  fr: "Pendant que vous fournissez, cet appareil relaie aussi pour les personnes dont l’accès au réseau est bloqué, en TCP et UDP 443 et en UDP 4053."
  he: "בזמן שאתם מספקים, המכשיר הזה גם מעביר תעבורה עבור אנשים שהגישה שלהם לרשת חסומה, ב-TCP וב-UDP 443 וב-UDP 4053."
  hi: "जब आप प्रदान कर रहे होते हैं, तब यह डिवाइस उन लोगों के लिए भी रिले करता है जिनकी नेटवर्क तक पहुँच अवरुद्ध है, TCP और UDP 443 और UDP 4053 पर।"
  id: "Saat Anda menyediakan, perangkat ini juga merelai untuk orang-orang yang aksesnya ke jaringan diblokir, di TCP dan UDP 443 serta UDP 4053."
  it: "Mentre fornisci, questo dispositivo fa anche da relay per le persone il cui accesso alla rete è bloccato, su TCP e UDP 443 e UDP 4053."
  ja: "提供中は、ネットワークへのアクセスがブロックされている人のために、このデバイスが TCP と UDP 443、UDP 4053 で中継も行います。"
  ko: "제공하는 동안 이 기기는 네트워크 접근이 차단된 사람들을 위해 TCP 및 UDP 443, UDP 4053에서 중계도 합니다."
  nl: "Terwijl je levert, relayt dit apparaat ook voor mensen bij wie de toegang tot het netwerk geblokkeerd is, via TCP en UDP 443 en UDP 4053."
  pl: "Gdy udostępniasz, to urządzenie przekazuje też ruch osób, których dostęp do sieci jest zablokowany, na TCP i UDP 443 oraz UDP 4053."
  pt: "Enquanto fornece, este dispositivo também retransmite para pessoas cujo acesso à rede está bloqueado, em TCP e UDP 443 e UDP 4053."
  pt-BR: "Enquanto você fornece, este dispositivo também retransmite para pessoas cujo acesso à rede está bloqueado, em TCP e UDP 443 e UDP 4053."
  pt-PT: "Enquanto fornece, este dispositivo também retransmite para pessoas cujo acesso à rede está bloqueado, em TCP e UDP 443 e UDP 4053."
  ru: "Пока вы предоставляете доступ, это устройство также ретранслирует трафик для людей, чей доступ к сети заблокирован, через TCP и UDP 443 и UDP 4053."
  sv: "Medan du tillhandahåller vidarebefordrar den här enheten också åt personer vars åtkomst till nätverket är blockerad, på TCP och UDP 443 och UDP 4053."
  sw: "Unapotoa huduma, kifaa hiki pia hupitisha trafiki kwa watu ambao ufikiaji wao wa mtandao umezuiwa, kupitia TCP na UDP 443 na UDP 4053."
  th: "ขณะที่คุณให้บริการ อุปกรณ์นี้จะส่งต่อข้อมูลให้ผู้ที่ถูกบล็อกการเข้าถึงเครือข่ายด้วย ผ่าน TCP และ UDP 443 และ UDP 4053"
  uk: "Поки ви надаєте доступ, цей пристрій також ретранслює трафік для людей, чий доступ до мережі заблоковано, через TCP і UDP 443 та UDP 4053."
  vi: "Khi bạn đang cung cấp, thiết bị này cũng chuyển tiếp cho những người bị chặn truy cập vào mạng, trên TCP và UDP 443 và UDP 4053."
  zh: "在您提供期间，此设备还会通过 TCP 和 UDP 443 以及 UDP 4053，为网络访问被封锁的人提供中继。"
  zh-HK: "在你提供期間，此裝置亦會透過 TCP 和 UDP 443 以及 UDP 4053，為網絡存取被封鎖的人提供中繼。"
