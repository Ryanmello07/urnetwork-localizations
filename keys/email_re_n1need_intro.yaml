description: "Re-engagement email N1 (not needed yet) opening; three short use cases follow."
source: "A few weeks ago you told me you didn't need URnetwork yet. Fair enough. These are the moments people tell me they turn it on:"
platforms:
  - email
localizations:
  en: "A few weeks ago you told me you didn't need URnetwork yet. Fair enough. These are the moments people tell me they turn it on:"
  ar: "قبل بضعة أسابيع أخبرتني أنك لا تحتاج إلى URnetwork بعد. هذا مفهوم. هذه هي اللحظات التي يخبرني الناس أنهم يشغّلونه فيها:"
  cs: "Před pár týdny jste mi dali vědět, že URnetwork zatím nepotřebujete. Chápu. Tohle jsou chvíle, kdy si ho lidé podle svých slov zapínají:"
  de: "Vor ein paar Wochen hast du mir gesagt, dass du URnetwork noch nicht brauchst. Verständlich. Das sind die Momente, in denen Leute es einschalten, wie sie mir erzählen:"
  el: "Μου είπες πριν από μερικές εβδομάδες ότι δεν χρειαζόσουν ακόμα το URnetwork. Λογικό. Αυτές είναι οι στιγμές που, όπως μου λέει ο κόσμος, το ενεργοποιεί:"
  es: "Hace unas semanas me dijiste que todavía no necesitabas URnetwork. Tiene sentido. Estos son los momentos en los que la gente me cuenta que lo activa:"
  es-419: "Hace unas semanas me dijiste que todavía no necesitabas URnetwork. Tiene sentido. Estos son los momentos en los que la gente me cuenta que lo activa:"
  es-MX: "Hace unas semanas me dijiste que todavía no necesitabas URnetwork. Tiene sentido. Estos son los momentos en los que la gente me cuenta que lo activa:"
  fr: "Il y a quelques semaines, tu m'as dit que tu n'avais pas encore besoin d'URnetwork. Ça se comprend. Voici les moments où les gens me disent qu'ils l'activent :"
  he: "לפני כמה שבועות סיפרתם לי שעדיין אין לכם צורך ב-URnetwork. בסדר גמור. אלה הרגעים שבהם אנשים מספרים לי שהם מפעילים אותו:"
  hi: "कुछ हफ़्ते पहले आपने मुझे बताया था कि आपको अभी URnetwork की ज़रूरत नहीं है। ठीक बात है। लोग मुझे बताते हैं कि वे इन मौकों पर इसे चालू करते हैं:"
  id: "Beberapa minggu lalu kamu memberi tahu saya bahwa kamu belum butuh URnetwork. Wajar saja. Orang-orang bercerita kepada saya bahwa mereka menyalakannya di saat-saat seperti ini:"
  it: "Qualche settimana fa mi hai detto che URnetwork non ti serviva ancora. Ha senso. Ecco i momenti in cui le persone mi dicono che l'attivano:"
  ja: "数週間前、まだ URnetwork は必要ないと教えていただきましたね。もっともです。オンにするのはこんなとき、と皆さんから聞いています："
  ko: "몇 주 전에 아직은 URnetwork가 필요 없다고 하셨죠. 충분히 그럴 수 있습니다. 사람들이 이걸 켠다고 말하는 순간은 이렇습니다:"
  nl: "Een paar weken geleden vertelde je me dat je URnetwork nog niet nodig had. Begrijpelijk. Dit zijn de momenten waarop mensen me vertellen dat ze het aanzetten:"
  pl: "Kilka tygodni temu dałeś mi znać, że jeszcze nie potrzebujesz URnetwork. Rozumiem. Oto momenty, w których ludzie, jak mi mówią, go włączają:"
  pt: "Há algumas semanas você me disse que ainda não precisava da URnetwork. Faz sentido. Estes são os momentos em que as pessoas me contam que a ativam:"
  pt-BR: "Há algumas semanas você me disse que ainda não precisava da URnetwork. Faz sentido. Estes são os momentos em que as pessoas me contam que a ativam:"
  pt-PT: "Há algumas semanas disse-me que ainda não precisava da URnetwork. Faz sentido. Estes são os momentos em que as pessoas me dizem que a ativam:"
  ru: "Несколько недель назад вы сказали мне, что URnetwork вам пока не нужна. Понимаю. Вот моменты, когда люди, по их словам, её включают:"
  sv: "För några veckor sedan sa du att du inte behövde URnetwork än. Fullt rimligt. Det här är tillfällena då folk berättar att de slår på det:"
  sw: "Wiki chache zilizopita uliniambia kuwa bado huhitaji URnetwork. Sawa kabisa. Hizi ndizo nyakati ambazo watu huniambia kuwa wanaiwasha:"
  th: "เมื่อไม่กี่สัปดาห์ก่อน คุณบอกผมว่ายังไม่ต้องใช้ URnetwork ก็เข้าใจได้ นี่คือช่วงเวลาที่ผู้คนบอกผมว่าพวกเขาเปิดใช้งาน:"
  uk: "Кілька тижнів тому ви сказали мені, що URnetwork вам поки не потрібна. Розумію. Ось моменти, коли люди, за їхніми словами, її вмикають:"
  vi: "Vài tuần trước bạn cho tôi biết bạn chưa cần URnetwork. Cũng hợp lý thôi. Đây là những lúc mọi người kể với tôi rằng họ bật nó lên:"
  zh: "几周前你告诉我，你暂时还不需要 URnetwork。可以理解。大家告诉我，他们会在这些时候开启它："
  zh-HK: "幾星期前你告訴我，你暫時還不需要 URnetwork。可以理解。大家告訴我，他們會在這些時候開啟它："
