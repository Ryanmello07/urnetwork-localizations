description: "Developer tools: both legacy group-follow controls are not ordinary fresh-flow health overrides."
source: "Legacy compatibility setting, not a health override. Ordinary new connections never reuse warned or unhealthy exits; they always enter a fresh provider race. Existing connections and explicit pins are unchanged."
platforms:
  - android
localizations:
  ar: "إعداد توافق قديم، وليس تجاوزًا لفحص السلامة. الاتصالات الجديدة العادية لا تعيد استخدام المخارج المحذّر منها أو غير السليمة؛ بل تدخل دائمًا سباق مزودين جديدًا. الاتصالات الحالية والتثبيتات الصريحة لا تتغير."
  cs: "Starší nastavení kompatibility, nikoli obejití kontroly zdraví. Běžná nová připojení nikdy znovu nepoužijí výstupy s varováním nebo nezdravé výstupy; vždy zahájí nový závod poskytovatelů. Stávající připojení a explicitní připnutí se nemění."
  de: "Alte Kompatibilitätseinstellung, keine Ausnahme von der Zustandsprüfung. Gewöhnliche neue Verbindungen verwenden gewarnte oder ungesunde Exits nie wieder, sondern starten immer ein neues Anbieter-Race. Bestehende Verbindungen und explizite Pins bleiben unverändert."
  el: "Παλαιά ρύθμιση συμβατότητας, όχι παράκαμψη ελέγχου υγείας. Οι συνηθισμένες νέες συνδέσεις δεν επαναχρησιμοποιούν ποτέ εξόδους με προειδοποίηση ή κακή κατάσταση· ξεκινούν πάντα νέο αγώνα παρόχων. Οι υπάρχουσες συνδέσεις και οι ρητές καρφιτσώσεις δεν αλλάζουν."
  en: "Legacy compatibility setting, not a health override. Ordinary new connections never reuse warned or unhealthy exits; they always enter a fresh provider race. Existing connections and explicit pins are unchanged."
  es: "Ajuste de compatibilidad heredado, no una excepción al estado de salud. Las conexiones nuevas normales nunca reutilizan salidas con advertencias o en mal estado; siempre inician una nueva carrera de proveedores. Las conexiones existentes y las fijaciones explícitas no cambian."
  es-419: "Ajuste de compatibilidad heredado, no una excepción al estado de salud. Las conexiones nuevas normales nunca reutilizan salidas con advertencias o en mal estado; siempre inician una nueva carrera de proveedores. Las conexiones existentes y las fijaciones explícitas no cambian."
  es-MX: "Ajuste de compatibilidad heredado, no una excepción al estado de salud. Las conexiones nuevas normales nunca reutilizan salidas con advertencias o en mal estado; siempre inician una nueva carrera de proveedores. Las conexiones existentes y las fijaciones explícitas no cambian."
  fr: "Ancien réglage de compatibilité, sans dérogation au contrôle de santé. Les nouvelles connexions ordinaires ne réutilisent jamais une sortie avertie ou défaillante ; elles lancent toujours une nouvelle course de fournisseurs. Les connexions existantes et les épinglages explicites ne changent pas."
  he: "הגדרת תאימות ישנה, לא עקיפה של בדיקת תקינות. חיבורים חדשים רגילים לעולם אינם משתמשים שוב ביציאות עם אזהרה או לא תקינות; הם תמיד מתחילים מרוץ ספקים חדש. חיבורים קיימים והצמדות מפורשות אינם משתנים."
  hi: "पुरानी संगतता सेटिंग, स्वास्थ्य जाँच को दरकिनार करने का विकल्प नहीं। सामान्य नए कनेक्शन चेतावनी वाले या अस्वस्थ एग्ज़िट का दोबारा उपयोग कभी नहीं करते; वे हमेशा नई प्रदाता रेस शुरू करते हैं। मौजूदा कनेक्शन और स्पष्ट पिन नहीं बदलते।"
  id: "Pengaturan kompatibilitas lama, bukan pengabaian pemeriksaan kesehatan. Koneksi baru biasa tidak pernah memakai ulang exit yang diperingatkan atau tidak sehat; koneksi itu selalu memulai balapan penyedia baru. Koneksi yang ada dan pin eksplisit tidak berubah."
  it: "Impostazione di compatibilità precedente, non un’eccezione ai controlli di salute. Le nuove connessioni ordinarie non riutilizzano mai uscite con avvisi o non sane; avviano sempre una nuova gara tra provider. Le connessioni esistenti e i blocchi espliciti non cambiano."
  ja: "互換性のために残された設定であり、正常性チェックを無視するものではありません。通常の新しい接続は、警告のある出口や異常な出口を再利用せず、常に新しいプロバイダーレースを行います。既存の接続と明示的な固定は変更しません。"
  ko: "이전 호환성 설정이며 상태 검사를 무시하는 옵션이 아닙니다. 일반적인 새 연결은 경고가 있거나 비정상인 출구를 재사용하지 않으며 항상 새 제공자 경쟁을 시작합니다. 기존 연결과 명시적 고정은 변경하지 않습니다."
  nl: "Oude compatibiliteitsinstelling, geen uitzondering op de gezondheidscontrole. Gewone nieuwe verbindingen hergebruiken nooit gewaarschuwde of ongezonde exits; ze starten altijd een nieuwe providerrace. Bestaande verbindingen en expliciete pins blijven ongewijzigd."
  pl: "Starsze ustawienie zgodności, nie obejście kontroli stanu. Zwykłe nowe połączenia nigdy nie używają ponownie wyjść z ostrzeżeniem lub niesprawnych; zawsze rozpoczynają nowy wyścig dostawców. Istniejące połączenia i jawne przypięcia nie zmieniają się."
  pt: "Definição de compatibilidade antiga, não uma exceção à verificação de saúde. As novas ligações comuns nunca reutilizam saídas com avisos ou sem saúde; iniciam sempre uma nova corrida de fornecedores. As ligações existentes e as fixações explícitas não mudam."
  pt-BR: "Configuração de compatibilidade antiga, não uma exceção à verificação de saúde. Novas conexões comuns nunca reutilizam saídas com avisos ou sem saúde; sempre iniciam uma nova corrida de provedores. Conexões existentes e fixações explícitas não mudam."
  pt-PT: "Definição de compatibilidade antiga, não uma exceção à verificação de saúde. As novas ligações comuns nunca reutilizam saídas com avisos ou sem saúde; iniciam sempre uma nova corrida de fornecedores. As ligações existentes e as fixações explícitas não mudam."
  ru: "Устаревшая настройка совместимости, не отменяющая проверку исправности. Обычные новые соединения никогда не используют повторно выходы с предупреждением или неисправные выходы; они всегда запускают новую гонку провайдеров. Существующие соединения и явные закрепления не меняются."
  sv: "Äldre kompatibilitetsinställning, inget undantag från hälsokontrollen. Vanliga nya anslutningar återanvänder aldrig varnade eller osunda utgångar; de startar alltid ett nytt leverantörslopp. Befintliga anslutningar och uttryckliga fästningar ändras inte."
  sw: "Mpangilio wa zamani wa uoanifu, si kupuuza ukaguzi wa afya. Miunganisho mipya ya kawaida haitumii tena njia zilizoonywa au zisizo salama; daima huanza mashindano mapya ya watoa huduma. Miunganisho iliyopo na ubanaji wazi havibadiliki."
  th: "การตั้งค่าความเข้ากันได้แบบเก่า ไม่ใช่การข้ามการตรวจสอบสถานะ การเชื่อมต่อใหม่ทั่วไปจะไม่ใช้ทางออกที่มีคำเตือนหรือไม่ปกติซ้ำ แต่จะเริ่มการแข่งของผู้ให้บริการใหม่เสมอ การเชื่อมต่อที่มีอยู่และการปักหมุดที่ระบุไว้ไม่เปลี่ยนแปลง"
  uk: "Застаріле налаштування сумісності, що не скасовує перевірку справності. Звичайні нові з’єднання ніколи не використовують повторно виходи з попередженням або несправні виходи; вони завжди запускають нові перегони провайдерів. Наявні з’єднання та явні закріплення не змінюються."
  vi: "Cài đặt tương thích cũ, không bỏ qua kiểm tra sức khỏe. Kết nối mới thông thường không bao giờ dùng lại điểm thoát có cảnh báo hoặc không khỏe; chúng luôn bắt đầu cuộc đua nhà cung cấp mới. Kết nối hiện có và các ghim rõ ràng không thay đổi."
  zh: "此为旧版兼容设置，不会绕过健康检查。普通新连接绝不复用出现警告或不健康的出口，而是始终启动新的提供商竞速。现有连接和显式固定不变。"
  zh-HK: "此為舊版相容設定，不會繞過健康檢查。一般新連線絕不重用出現警告或不健康的出口，而是一律啟動新的供應商競速。現有連線和明確固定不變。"
