  es-MX: "Lo sentimos, se produjo un error al eliminar tu cuenta."
  fr: "Désolé, une erreur s'est produite lors de la suppression de votre compte."
  he: "מצטערים, אירעה שגיאה במחיקת החשבון שלך."
