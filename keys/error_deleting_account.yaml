  pt: "Lamentamos, ocorreu um erro ao eliminar a sua conta."
  pt-BR: "Desculpe, ocorreu um erro ao excluir sua conta."
  pt-PT: "Lamentamos, ocorreu um erro ao eliminar a sua conta."
  ru: "К сожалению, произошла ошибка при удалении вашего аккаунта."
