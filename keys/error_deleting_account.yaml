description: "Shown when deleting the account fails, including when the server refuses the deletion (its reason follows on the next line). Apple Settings snackbar, android Settings, windows and linux delete-account sheet, web account settings."
source: "Sorry, there was an error deleting your account."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
