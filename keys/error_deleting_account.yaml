  cs: "Omlouváme se, při mazání účtu došlo k chybě."
  de: "Entschuldigung, beim Löschen deines Kontos ist ein Fehler aufgetreten."
  el: "Λυπούμαστε, παρουσιάστηκε σφάλμα κατά τη διαγραφή του λογαριασμού σας."
  en: "Sorry, there was an error deleting your account."
  es: "Lo sentimos, se ha producido un error al eliminar tu cuenta."
