description: "Developer tools screen: explanatory subtext under the 'scheduler pause recovery' control."
source: "How long verdicts stay held after a detected suspend, giving transports time to re-register. Off uses the built-in 5s"
platforms:
  - android
localizations:
  ar: "المدة التي تبقى فيها الأحكام معلّقة بعد رصد تعليق، لإتاحة الوقت لبروتوكولات النقل لإعادة التسجيل. عند الإيقاف، تُستخدم المهلة المدمجة البالغة 5 ثوانٍ"
  cs: "Jak dlouho zůstávají verdikty zadržené po zjištěném uspání, aby se transporty stihly znovu zaregistrovat. Vypnuto použije vestavěných 5 s"
  de: "Wie lange Urteile nach einem erkannten Ruhezustand zurückgehalten werden, damit sich Transporte neu registrieren können. Aus: nutzt die eingebauten 5 s"
  el: "Για πόσο οι ετυμηγορίες μένουν σε αναμονή μετά από ανιχνευμένη αναστολή, ώστε οι μεταφορές να προλάβουν να επανεγγραφούν. Η απενεργοποίηση χρησιμοποιεί τα ενσωματωμένα 5 δ"
  en: "How long verdicts stay held after a detected suspend, giving transports time to re-register. Off uses the built-in 5s"
  es: "Cuánto tiempo se retienen los veredictos tras detectar una suspensión, para dar tiempo a los transportes a volver a registrarse. Si está desactivado, se usan los 5 s integrados"
  es-419: "Cuánto tiempo se retienen los veredictos después de detectar una suspensión, para dar tiempo a los transportes a volver a registrarse. Si está desactivado, se usan los 5 s integrados"
  es-MX: "Cuánto tiempo se retienen los veredictos después de detectar una suspensión, para dar tiempo a los transportes a volver a registrarse. Si está desactivado, se usan los 5 s integrados"
  fr: "Combien de temps les verdicts restent retenus après une mise en veille détectée, le temps que les transports se réenregistrent. Désactivé utilise les 5 s intégrées"
  he: "כמה זמן הכרעות נשארות מעוכבות אחרי השהיה שזוהתה, כדי לתת לתעבורות זמן להירשם מחדש. כיבוי משתמש ב-5 השניות המובנות"
  hi: "पता चले सस्पेंड के बाद फ़ैसले कितनी देर रोके रहते हैं, ताकि ट्रांसपोर्ट को दोबारा रजिस्टर होने का समय मिले। बंद करने पर अंतर्निहित 5 सेकंड इस्तेमाल होते हैं"
  id: "Berapa lama vonis ditahan setelah penangguhan terdeteksi, memberi waktu bagi transport untuk mendaftar ulang. Nonaktif memakai 5 dtk bawaan"
  it: "Per quanto tempo i verdetti restano trattenuti dopo una sospensione rilevata, per dare ai trasporti il tempo di registrarsi di nuovo. Disattivato usa i 5 s integrati"
  ja: "スリープを検出した後に判定を保留する時間。トランスポートが再登録する時間を確保します。オフにすると組み込みの 5 秒を使います"
  ko: "절전이 감지된 뒤 판정을 보류하는 시간으로, 전송이 다시 등록될 시간을 줍니다. 끄면 내장된 5초를 사용합니다"
  nl: "Hoe lang oordelen worden vastgehouden na een gedetecteerde slaapstand, zodat transports zich opnieuw kunnen registreren. Uit gebruikt de ingebouwde 5 s"
  pl: "Jak długo werdykty są wstrzymane po wykrytym uśpieniu, by transporty zdążyły się ponownie zarejestrować. Wyłączenie używa wbudowanych 5 s"
  pt: "Durante quanto tempo os veredictos ficam retidos após uma suspensão detetada, dando aos transportes tempo para voltarem a registar-se. Desativado usa os 5 s integrados"
  pt-BR: "Por quanto tempo os vereditos ficam retidos após uma suspensão detectada, dando aos transportes tempo para se registrarem de novo. Desativado usa os 5 s integrados"
  pt-PT: "Durante quanto tempo os veredictos ficam retidos após uma suspensão detetada, dando aos transportes tempo para voltarem a registar-se. Desativado usa os 5 s integrados"
  ru: "Как долго вердикты удерживаются после обнаруженной приостановки, чтобы транспорты успели перерегистрироваться. Если выключено, используются встроенные 5 с"
  sv: "Hur länge domar hålls kvar efter ett upptäckt viloläge, så att transporterna hinner registrera sig igen. Av använder de inbyggda 5 s"
  sw: "Muda ambao hukumu huzuiliwa baada ya usingizi kugunduliwa, ili usafirishaji upate muda wa kujisajili upya. Kuzima kunatumia sekunde 5 zilizojengewa ndani"
  th: "คำตัดสินจะถูกระงับไว้นานเท่าใดหลังตรวจพบการพักเครื่อง เพื่อให้การส่งข้อมูลมีเวลาลงทะเบียนใหม่ ปิดเพื่อใช้ค่าในตัว 5 วินาที"
  uk: "Як довго вердикти утримуються після виявленого сну, щоб транспорти встигли перереєструватися. Вимкнення використовує вбудовані 5 с"
  vi: "Các phán quyết được giữ lại bao lâu sau khi phát hiện tạm ngưng, để các kiểu truyền tải có thời gian đăng ký lại. Tắt sẽ dùng 5 giây tích hợp"
  zh: "检测到挂起后判定保持暂缓的时长，让传输方式有时间重新注册。关闭时使用内置的 5 秒"
  zh-HK: "偵測到休眠後判定保持暫緩的時長，讓傳輸方式有時間重新登記。關閉時使用內置的 5 秒"
