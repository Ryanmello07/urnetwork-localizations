description: "Snackbar shown when sending feedback fails. Used in Main/Feedback/FeedbackView.swift."
source: "There was an error sending your feedback. Please try again later."
platforms:
  - apple
  - linux
  - windows
localizations:
  ar: "حدث خطأ أثناء إرسال ملاحظاتك. يرجى المحاولة مرة أخرى لاحقًا."
  cs: "Při odesílání zpětné vazby došlo k chybě. Zkuste to prosím později."
  de: "Beim Senden deines Feedbacks ist ein Fehler aufgetreten. Bitte versuche es später erneut."
  el: "Παρουσιάστηκε σφάλμα κατά την αποστολή των σχολίων σας. Δοκιμάστε ξανά αργότερα."
  en: "There was an error sending your feedback. Please try again later."
  es: "Se ha producido un error al enviar tus comentarios. Inténtalo de nuevo más tarde."
  es-419: "Se produjo un error al enviar tus comentarios. Inténtalo de nuevo más tarde."
  es-MX: "Se produjo un error al enviar tus comentarios. Inténtalo de nuevo más tarde."
  fr: "Une erreur s'est produite lors de l'envoi de votre retour. Veuillez réessayer plus tard."
  he: "אירעה שגיאה בשליחת המשוב שלך. אנא נסה שוב מאוחר יותר."
  hi: "आपकी प्रतिक्रिया भेजते समय त्रुटि हुई। कृपया बाद में पुनः प्रयास करें।"
  id: "Terjadi kesalahan saat mengirim umpan balik Anda. Silakan coba lagi nanti."
  it: "Si è verificato un errore durante l'invio del feedback. Riprova più tardi."
  ja: "フィードバックの送信中にエラーが発生しました。後でもう一度お試しください。"
  ko: "피드백을 보내는 중 오류가 발생했습니다. 나중에 다시 시도해 주세요."
  nl: "Er is een fout opgetreden bij het verzenden van je feedback. Probeer het later opnieuw."
  pl: "Wystąpił błąd podczas wysyłania opinii. Spróbuj ponownie później."
  pt: "Ocorreu um erro ao enviar o seu feedback. Tente novamente mais tarde."
  pt-BR: "Ocorreu um erro ao enviar seu feedback. Tente novamente mais tarde."
  pt-PT: "Ocorreu um erro ao enviar o seu feedback. Tente novamente mais tarde."
  ru: "Произошла ошибка при отправке отзыва. Пожалуйста, попробуйте позже."
  sv: "Ett fel uppstod när din feedback skulle skickas. Försök igen senare."
  sw: "Hitilafu imetokea wakati wa kutuma maoni yako. Tafadhali jaribu tena baadaye."
  th: "เกิดข้อผิดพลาดในการส่งข้อเสนอแนะของคุณ กรุณาลองใหม่ภายหลัง"
  uk: "Сталася помилка під час надсилання відгуку. Будь ласка, спробуйте пізніше."
  vi: "Đã xảy ra lỗi khi gửi phản hồi của bạn. Vui lòng thử lại sau."
  zh: "发送反馈时出错。请稍后再试。"
  zh-HK: "發送反饋時發生錯誤。請稍後再試。"
