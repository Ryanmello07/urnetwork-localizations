description: "Status label while the user's own network is slowing traffic (URnetwork measured a high upload or download delay). Shown in the amber pill at the top of the connect screen (also the Mac toolbar and menu bar, and the Windows and Linux connect page), as the title of the details sheet that pill opens, as the Live Activity title on the iPhone Lock Screen and expanded Dynamic Island, and as the Android VPN notification title. It describes the user's internet connection, not a URnetwork fault. Keep it short: it sits in a small pill beside an icon."
