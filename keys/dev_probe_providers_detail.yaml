description: "Developer tools screen: explanatory subtext under the 'probe providers' control."
source: "Qualify exits by dialing real sites through them. An answer proves the exit; silence never counts against it"
platforms:
  - android
  - apple
localizations:
  ar: "يؤهّل المخارج عبر الاتصال بمواقع حقيقية من خلالها. الرد يُثبت صلاحية المخرج؛ والصمت لا يُحتسب ضده أبدًا"
  cs: "Kvalifikuje výstupy připojováním ke skutečným webům přes ně. Odpověď výstup prokáže; ticho se proti němu nikdy nepočítá"
  de: "Qualifiziert Exits, indem echte Websites über sie angewählt werden. Eine Antwort bestätigt den Exit; Stille wird nie gegen ihn gewertet"
  el: "Πιστοποιεί τις εξόδους καλώντας πραγματικούς ιστότοπους μέσω αυτών. Μια απάντηση αποδεικνύει την έξοδο· η σιωπή δεν μετρά ποτέ εναντίον της"
  en: "Qualify exits by dialing real sites through them. An answer proves the exit; silence never counts against it"
  es: "Califica las salidas conectando con sitios reales a través de ellas. Una respuesta valida la salida; el silencio nunca cuenta en su contra"
  es-419: "Califica las salidas conectándose a sitios reales a través de ellas. Una respuesta valida la salida; el silencio nunca cuenta en su contra"
  es-MX: "Califica las salidas conectándose a sitios reales a través de ellas. Una respuesta valida la salida; el silencio nunca cuenta en su contra"
  fr: "Qualifie les sorties en joignant de vrais sites à travers elles. Une réponse prouve la sortie ; le silence ne compte jamais contre elle"
  he: "הכשרת יציאות באמצעות חיוג לאתרים אמיתיים דרכן. תשובה מוכיחה את היציאה; שתיקה אף פעם לא נספרת נגדה"
  hi: "एग्ज़िट के ज़रिए असली साइटों को डायल करके उन्हें योग्य ठहराएँ। जवाब एग्ज़िट को सिद्ध करता है; चुप्पी कभी उसके ख़िलाफ़ नहीं गिनी जाती"
  id: "Kualifikasi exit dengan menghubungi situs nyata melaluinya. Jawaban membuktikan exit; diam tidak pernah dihitung merugikannya"
  it: "Qualifica le uscite contattando siti reali attraverso di esse. Una risposta dimostra l’uscita; il silenzio non conta mai contro di essa"
  ja: "実際のサイトに出口経由で接続して、出口を検証します。応答があれば出口が実証され、無応答が不利に数えられることはありません"
  ko: "출구를 통해 실제 사이트에 연결해 출구를 검증합니다. 응답이 있으면 출구가 입증되며, 무응답은 절대 불리하게 계산되지 않습니다"
  nl: "Keur exits goed door er echte sites via te bellen. Een antwoord bewijst de exit; stilte telt nooit tegen hem"
  pl: "Kwalifikuje wyjścia, łącząc się przez nie z prawdziwymi witrynami. Odpowiedź potwierdza wyjście; cisza nigdy nie działa na jego niekorzyść"
  pt: "Qualifica as saídas ligando-se a sites reais através delas. Uma resposta comprova a saída; o silêncio nunca conta contra ela"
  pt-BR: "Qualifica as saídas conectando-se a sites reais por meio delas. Uma resposta comprova a saída; o silêncio nunca conta contra ela"
  pt-PT: "Qualifica as saídas ligando-se a sites reais através delas. Uma resposta comprova a saída; o silêncio nunca conta contra ela"
  ru: "Проверяет пригодность выходов, подключаясь через них к реальным сайтам. Ответ подтверждает выход; молчание никогда не засчитывается против него"
  sv: "Kvalificera utgångar genom att ringa upp riktiga webbplatser genom dem. Ett svar bevisar utgången; tystnad räknas aldrig emot den"
  sw: "Thibitisha njia za kutoka kwa kupiga tovuti halisi kupitia njia hizo. Jibu huthibitisha njia ya kutoka; ukimya hauhesabiwi dhidi yake kamwe"
  th: "รับรองทางออกโดยเชื่อมต่อไปยังเว็บไซต์จริงผ่านทางออกนั้น คำตอบเป็นการพิสูจน์ทางออก ส่วนความเงียบจะไม่ถูกนับเป็นผลเสีย"
  uk: "Кваліфікує виходи, звертаючись через них до справжніх сайтів. Відповідь підтверджує вихід; мовчання ніколи не враховується проти нього"
  vi: "Kiểm định điểm thoát bằng cách kết nối tới các trang thật thông qua chúng. Một phản hồi chứng minh điểm thoát; im lặng không bao giờ bị tính là bất lợi"
  zh: "通过出口拨号访问真实站点来验证出口。收到应答即证明该出口可用；无应答绝不会被计为不利"
  zh-HK: "透過出口撥號連上真實網站來驗證出口。收到回應即證明該出口可用；沒有回應絕不會被計為不利"
