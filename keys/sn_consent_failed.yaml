description: "Payout consent section, beside the settlement v2 tile and claim: the error when the server refused the signature because it does not verify for the wallet's coldkey (SnErrorCodeSignatureMismatch)."
source: "The signature didn't match this wallet. Try again."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
