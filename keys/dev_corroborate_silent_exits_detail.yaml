description: "Developer page: the explanation under the 'Corroborate silent exits' setting."
source: "How many distinct destinations must be silent before an exit is convicted on no-receive, so one dead site cannot remove a working exit"
platforms:
  - linux
localizations:
  ar: "عدد الوجهات المختلفة التي يجب أن تكون صامتة قبل إدانة مخرج بعدم الاستقبال، كي لا يتمكن موقع ميت واحد من إزالة مخرج يعمل"
  cs: "Kolik různých cílů musí být tichých, než je výstup odsouzen za nepříjem, aby jediný mrtvý web nemohl odstranit fungující výstup"
  de: "Wie viele verschiedene Ziele still sein müssen, bevor ein Exit wegen fehlenden Empfangs verurteilt wird, damit eine einzelne tote Website keinen funktionierenden Exit entfernen kann"
  el: "Πόσοι διαφορετικοί προορισμοί πρέπει να σιωπούν πριν καταδικαστεί μια έξοδος για μη λήψη, ώστε ένας μόνο νεκρός ιστότοπος να μην μπορεί να αφαιρέσει μια λειτουργική έξοδο"
  en: "How many distinct destinations must be silent before an exit is convicted on no-receive, so one dead site cannot remove a working exit"
  es: "Cuántos destinos distintos deben quedar en silencio antes de condenar una salida por no recibir, para que un solo sitio caído no pueda eliminar una salida que funciona"
  es-419: "Cuántos destinos distintos deben quedar en silencio antes de condenar una salida por no recibir, para que un solo sitio caído no pueda eliminar una salida que funciona"
  es-MX: "Cuántos destinos distintos deben quedar en silencio antes de condenar una salida por no recibir, para que un solo sitio caído no pueda eliminar una salida que funciona"
  fr: "Combien de destinations distinctes doivent rester silencieuses avant qu’une sortie soit condamnée pour absence de réception, pour qu’un seul site en panne ne puisse pas retirer une sortie qui fonctionne"
  he: "כמה יעדים שונים צריכים לשתוק לפני שיציאה מורשעת באי-קבלה, כדי שאתר מת אחד לא יוכל להסיר יציאה תקינה"
  hi: "किसी एग्ज़िट को कुछ न मिलने के आधार पर दोषी ठहराने से पहले कितने अलग गंतव्यों का शांत होना ज़रूरी है, ताकि एक बंद साइट काम करते एग्ज़िट को न हटा सके"
  id: "Berapa banyak tujuan berbeda yang harus diam sebelum exit divonis tidak menerima, agar satu situs mati tidak bisa menghapus exit yang berfungsi"
  it: "Quante destinazioni distinte devono essere silenziose prima che un’uscita venga condannata per mancata ricezione, così un solo sito irraggiungibile non può rimuovere un’uscita funzionante"
  ja: "受信なしで出口を判定するまでに無応答でなければならない異なる宛先の数。1 つのサイトの停止で正常な出口が除外されることを防ぎます"
  ko: "수신 없음으로 출구를 판정하기 전에 무응답이어야 하는 서로 다른 대상 수로, 죽은 사이트 하나 때문에 정상 출구가 제외되지 않게 합니다"
  nl: "Hoeveel verschillende bestemmingen stil moeten zijn voordat een exit wordt veroordeeld voor geen ontvangst, zodat één dode site geen werkende exit kan verwijderen"
  pl: "Ile różnych celów musi milczeć, zanim wyjście zostanie skazane za brak odbioru, aby jedna martwa witryna nie mogła usunąć działającego wyjścia"
  pt: "Quantos destinos distintos têm de ficar em silêncio antes de uma saída ser condenada por não receber, para que um único site em baixo não remova uma saída que funciona"
  pt-BR: "Quantos destinos distintos precisam ficar em silêncio antes que uma saída seja condenada por não receber, para que um único site fora do ar não remova uma saída que funciona"
  pt-PT: "Quantos destinos distintos têm de ficar em silêncio antes de uma saída ser condenada por não receber, para que um único site em baixo não remova uma saída que funciona"
  ru: "Сколько разных адресатов должны молчать, прежде чем выход будет осуждён за отсутствие приёма, чтобы один мёртвый сайт не мог удалить рабочий выход"
  sv: "Hur många olika destinationer som måste vara tysta innan en utgång fälls för utebliven mottagning, så att en enda död webbplats inte kan ta bort en fungerande utgång"
  sw: "Idadi ya malengo tofauti yanayopaswa kuwa kimya kabla njia ya kutoka haijahukumiwa kwa kutopokea, ili tovuti moja iliyokufa isiweze kuondoa njia ya kutoka inayofanya kazi"
  th: "ต้องมีปลายทางต่างกันกี่แห่งที่เงียบก่อนตัดสินว่าทางออกไม่รับข้อมูล เพื่อไม่ให้เว็บไซต์ที่ตายเพียงแห่งเดียวลบทางออกที่ใช้งานได้"
  uk: "Скільки різних цілей має мовчати, перш ніж вихід засудять за відсутність прийому, щоб один мертвий сайт не міг видалити робочий вихід"
  vi: "Cần bao nhiêu đích khác nhau im lặng trước khi một điểm thoát bị kết luận là không nhận, để một trang chết duy nhất không thể loại bỏ một điểm thoát đang hoạt động"
  zh: "在因无接收而将出口定罪之前，必须有多少个不同的目标保持静默，以免单个失效站点导致正常出口被移除"
  zh-HK: "在因沒有接收而將出口判罪之前，必須有多少個不同的目標保持靜默，以免單一失效網站令正常出口被移除"
