description: "Developer tools screen: explanatory subtext under the 'heartbeat' control."
source: "How often one line summarizing live state is written to the log for later forensics. Off silences it; shorter spots a transition, longer keeps more buffer"
platforms:
  - android
localizations:
  ar: "عدد مرات كتابة سطر يلخّص الحالة الحية في السجل لأغراض التحليل لاحقًا. عند الإيقاف، يتوقف؛ الفترة الأقصر ترصد التحولات، والأطول تحتفظ بمخزن مؤقت أكبر"
  cs: "Jak často se do logu zapíše jeden řádek se shrnutím aktuálního stavu pro pozdější analýzu. Vypnuto ho ztiší; kratší zachytí přechod, delší drží víc vyrovnávací paměti"
  de: "Wie oft eine Zeile mit einer Zusammenfassung des aktuellen Zustands für spätere Analysen ins Log geschrieben wird. Aus: schaltet sie stumm; kürzer erfasst Übergänge, länger behält mehr Puffer"
  el: "Πόσο συχνά γράφεται στο αρχείο καταγραφής μία γραμμή που συνοψίζει την τρέχουσα κατάσταση για μεταγενέστερη ανάλυση. Η απενεργοποίηση τη σιωπά· συντομότερο εντοπίζει μια μετάβαση, μακρύτερο κρατά περισσότερο buffer"
  en: "How often one line summarizing live state is written to the log for later forensics. Off silences it; shorter spots a transition, longer keeps more buffer"
  es: "Con qué frecuencia se escribe en el registro una línea que resume el estado actual para un análisis forense posterior. Si está desactivado, se silencia; un intervalo más corto detecta una transición y uno más largo conserva más búfer"
  es-419: "Con qué frecuencia se escribe en el registro una línea que resume el estado actual para un análisis forense posterior. Si está desactivado, se silencia; un intervalo más corto detecta una transición y uno más largo conserva más búfer"
  es-MX: "Con qué frecuencia se escribe en el registro una línea que resume el estado actual para un análisis forense posterior. Si está desactivado, se silencia; un intervalo más corto detecta una transición y uno más largo conserva más búfer"
  fr: "Fréquence à laquelle une ligne résumant l’état en direct est écrite dans le journal pour une analyse ultérieure. Désactivé la coupe ; plus court repère une transition, plus long garde plus de tampon"
  he: "באיזו תדירות נכתבת ללוג שורה אחת שמסכמת את המצב הנוכחי לצורך ניתוח מאוחר. כיבוי משתיק אותה; קצר יותר תופס מעבר, ארוך יותר שומר יותר חוצץ"
  hi: "बाद की जाँच के लिए लाइव स्थिति का सार बताने वाली एक पंक्ति लॉग में कितनी बार लिखी जाती है। बंद करने पर यह बंद हो जाती है; छोटा अंतराल बदलाव पकड़ता है, लंबा ज़्यादा बफ़र रखता है"
  id: "Seberapa sering satu baris ringkasan status terkini ditulis ke log untuk analisis nanti. Nonaktif membungkamnya; lebih pendek menangkap transisi, lebih panjang menyimpan lebih banyak buffer"
  it: "Ogni quanto viene scritta nel log una riga che riassume lo stato attuale, per un’analisi successiva. Disattivato la silenzia; più breve coglie una transizione, più lungo conserva più buffer"
  ja: "後で調査するために、現在の状態を要約した 1 行をログに書き込む頻度。オフにすると停止します。短くすると状態遷移を捉えやすく、長くするとバッファを多く保持できます"
  ko: "나중에 분석할 수 있도록 현재 상태를 요약한 한 줄을 로그에 기록하는 빈도입니다. 끄면 기록하지 않습니다. 짧을수록 상태 변화를 잘 잡고, 길수록 버퍼를 더 많이 보관합니다"
  nl: "Hoe vaak één regel met de huidige status naar de log wordt geschreven voor later onderzoek. Uit zet hem stil; korter vangt een overgang, langer bewaart meer buffer"
  pl: "Jak często do logu trafia jeden wiersz podsumowujący bieżący stan, do późniejszej analizy. Wyłączenie go wycisza; krótszy wyłapie przejście, dłuższy zachowa więcej bufora"
  pt: "Com que frequência uma linha que resume o estado atual é escrita no log para análise posterior. Desativado silencia-a; mais curto deteta uma transição, mais longo guarda mais buffer"
  pt-BR: "Com que frequência uma linha que resume o estado atual é gravada no log para análise posterior. Desativado a silencia; mais curto detecta uma transição, mais longo guarda mais buffer"
  pt-PT: "Com que frequência uma linha que resume o estado atual é escrita no log para análise posterior. Desativado silencia-a; mais curto deteta uma transição, mais longo guarda mais buffer"
  ru: "Как часто в лог записывается строка со сводкой текущего состояния для последующего анализа. Если выключено, запись отключается; меньший интервал позволяет заметить переход, больший — сохранить больше буфера"
  sv: "Hur ofta en rad som sammanfattar aktuell status skrivs till loggen för senare analys. Av tystar den; kortare fångar en övergång, längre behåller mer buffert"
  sw: "Mara ngapi mstari mmoja unaofupisha hali ya sasa huandikwa kwenye kumbukumbu kwa uchunguzi wa baadaye. Kuzima kunaunyamazisha; muda mfupi hunasa mabadiliko, mrefu huhifadhi bafa zaidi"
  th: "ความถี่ในการเขียนหนึ่งบรรทัดที่สรุปสถานะปัจจุบันลงล็อกเพื่อการวิเคราะห์ภายหลัง ปิดเพื่อหยุดเขียน ช่วงสั้นกว่าจับการเปลี่ยนแปลงได้ ช่วงยาวกว่าเก็บบัฟเฟอร์ได้มากกว่า"
  uk: "Як часто в лог записується рядок із підсумком поточного стану для подальшого аналізу. Вимкнення приглушує його; коротший ловить перехід, довший зберігає більше буфера"
  vi: "Tần suất ghi vào nhật ký một dòng tóm tắt trạng thái hiện tại để phân tích sau này. Tắt sẽ ngừng ghi; ngắn hơn bắt được chuyển đổi, dài hơn giữ được nhiều bộ đệm hơn"
  zh: "将一行实时状态摘要写入日志以供事后排查的频率。关闭时不写入；间隔越短越容易发现状态切换，越长则保留越多缓冲"
  zh-HK: "將一行即時狀態摘要寫入日誌以供事後排查的頻率。關閉時不寫入；間隔越短越容易發現狀態轉換，越長則保留越多緩衝"
