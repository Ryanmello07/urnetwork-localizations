description: "Settings: explanation under the automatic update check switch."
source: "Look for new releases shortly after launch and every six hours. Nothing is ever installed without a click."
platforms:
  - linux
localizations:
  ar: "البحث عن إصدارات جديدة بعد التشغيل بقليل وكل ست ساعات. لا يُثبّت أي شيء أبدًا دون نقرة."
  cs: "Hledat nová vydání krátce po spuštění a každých šest hodin. Nic se nikdy nenainstaluje bez kliknutí."
  de: "Kurz nach dem Start und alle sechs Stunden nach neuen Versionen suchen. Ohne Klick wird nie etwas installiert."
  el: "Αναζήτηση νέων εκδόσεων λίγο μετά την εκκίνηση και κάθε έξι ώρες. Τίποτα δεν εγκαθίσταται ποτέ χωρίς κλικ."
  en: "Look for new releases shortly after launch and every six hours. Nothing is ever installed without a click."
  es: "Buscar nuevas versiones poco después de iniciar y cada seis horas. Nunca se instala nada sin un clic."
  es-419: "Buscar nuevas versiones poco después de iniciar y cada seis horas. Nunca se instala nada sin un clic."
  es-MX: "Buscar nuevas versiones poco después de iniciar y cada seis horas. Nunca se instala nada sin un clic."
  fr: "Rechercher de nouvelles versions peu après le lancement et toutes les six heures. Rien n’est jamais installé sans un clic."
  he: "חיפוש גרסאות חדשות זמן קצר אחרי ההפעלה ובכל שש שעות. שום דבר לא מותקן בלי לחיצה."
  hi: "लॉन्च के कुछ ही देर बाद और हर छह घंटे में नए रिलीज़ खोजें। बिना क्लिक के कभी कुछ भी इंस्टॉल नहीं होता।"
  id: "Cari rilis baru sesaat setelah peluncuran dan setiap enam jam. Tidak ada yang pernah dipasang tanpa klik."
  it: "Cerca nuove versioni poco dopo l’avvio e ogni sei ore. Non viene mai installato nulla senza un clic."
  ja: "起動直後と6時間ごとに新しいリリースを確認します。クリックなしにインストールされることはありません。"
  ko: "실행 직후와 6시간마다 새 릴리스를 찾습니다. 클릭 없이는 아무것도 설치되지 않습니다."
  nl: "Kort na het starten en elke zes uur naar nieuwe releases zoeken. Er wordt nooit iets geïnstalleerd zonder klik."
  pl: "Szukaj nowych wydań krótko po uruchomieniu i co sześć godzin. Nic nigdy nie jest instalowane bez kliknięcia."
  pt: "Procura novas versões logo após abrir e a cada seis horas. Nada é instalado sem um clique."
  pt-BR: "Procura novas versões logo após abrir e a cada seis horas. Nada é instalado sem um clique."
  pt-PT: "Procura novas versões pouco depois do arranque e a cada seis horas. Nada é instalado sem um clique."
  ru: "Искать новые выпуски вскоре после запуска и каждые шесть часов. Без нажатия ничего не устанавливается."
  sv: "Sök efter nya versioner strax efter start och var sjätte timme. Inget installeras någonsin utan ett klick."
  sw: "Tafuta matoleo mapya muda mfupi baada ya kuzindua na kila saa sita. Hakuna kinachosakinishwa bila kubofya."
  th: "ค้นหารุ่นใหม่หลังเปิดแอปไม่นานและทุกหกชั่วโมง จะไม่มีการติดตั้งสิ่งใดโดยไม่ได้คลิก"
  uk: "Шукати нові випуски невдовзі після запуску та кожні шість годин. Без натискання нічого не встановлюється."
  vi: "Tìm bản phát hành mới ngay sau khi khởi động và mỗi sáu giờ. Không bao giờ cài đặt gì nếu không nhấp."
  zh: "启动后不久及每六小时查找新版本。未经点击绝不会安装任何内容。"
  zh-HK: "啟動後不久及每六小時尋找新版本。未經點擊絕不會安裝任何內容。"
