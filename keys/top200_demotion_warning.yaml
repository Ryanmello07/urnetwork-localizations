description: "Warning when the score nears the floor."
source: "Your score is close to the eviction floor. Add routable IPs to keep the spot."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "نتيجتك قريبة من حد الإقصاء. أضف عناوين IP قابلة للتوجيه للاحتفاظ بالمقعد."
  cs: "Vaše skóre je blízko hranice vyřazení. Přidejte směrovatelné IP adresy, abyste si místo udrželi."
  de: "Dein Score liegt nahe an der Verdrängungsgrenze. Füge routbare IPs hinzu, um den Platz zu behalten."
  el: "Η βαθμολογία σας είναι κοντά στο όριο αποκλεισμού. Προσθέστε δρομολογήσιμες IP για να κρατήσετε τη θέση."
  en: "Your score is close to the eviction floor. Add routable IPs to keep the spot."
  es: "Tu puntuación está cerca del umbral de expulsión. Añade IP enrutables para conservar el puesto."
  es-419: "Tu puntuación está cerca del umbral de expulsión. Agrega IP enrutables para conservar el lugar."
  es-MX: "Tu puntuación está cerca del umbral de expulsión. Agrega IP enrutables para conservar el lugar."
  fr: "Votre score est proche du seuil d’éviction. Ajoutez des IP routables pour garder la place."
  he: "הניקוד שלכם קרוב לסף ההדחה. הוסיפו כתובות IP ניתנות לניתוב כדי לשמור על המקום."
  hi: "आपका स्कोर निष्कासन सीमा के करीब है। अपनी जगह बनाए रखने के लिए रूट करने योग्य IP जोड़ें।"
  id: "Skor Anda mendekati batas pengeluaran. Tambahkan IP yang dapat dirutekan untuk mempertahankan tempat."
  it: "Il tuo punteggio è vicino alla soglia di esclusione. Aggiungi IP instradabili per mantenere il posto."
  ja: "スコアが除外ラインに近づいています。枠を維持するには、ルーティング可能な IP を追加してください。"
  ko: "점수가 탈락 기준에 가깝습니다. 자리를 지키려면 라우팅 가능한 IP를 추가하세요."
  nl: "Je score zit dicht bij de verwijderingsgrens. Voeg routeerbare IP's toe om je plek te houden."
  pl: "Twój wynik jest blisko progu usunięcia. Dodaj routowalne adresy IP, aby utrzymać miejsce."
  pt: "A sua pontuação está perto do limiar de expulsão. Adicione IPs encaminháveis para manter o lugar."
  pt-BR: "Sua pontuação está perto do limite de expulsão. Adicione IPs roteáveis para manter a vaga."
  pt-PT: "A sua pontuação está perto do limiar de expulsão. Adicione IPs encaminháveis para manter o lugar."
  ru: "Ваш балл близок к порогу вытеснения. Добавьте маршрутизируемые IP, чтобы сохранить место."
  sv: "Din poäng ligger nära utslagningsgränsen. Lägg till routbara IP-adresser för att behålla platsen."
  sw: "Alama zako ziko karibu na kizingiti cha kuondolewa. Ongeza IP zinazoweza kupitishwa ili kubaki na nafasi."
  th: "คะแนนของคุณใกล้เกณฑ์ถูกคัดออก เพิ่ม IP ที่กำหนดเส้นทางได้เพื่อรักษาที่ไว้"
  uk: "Ваш рахунок близький до межі вибуття. Додайте маршрутизовані IP, щоб утримати місце."
  vi: "Điểm của bạn đang gần ngưỡng loại. Hãy thêm IP có thể định tuyến để giữ chỗ."
  zh: "您的分数接近淘汰线。请添加可路由的 IP 以保住席位。"
  zh-HK: "你的分數接近淘汰線。請加入可路由的 IP 以保住席位。"
