description: "Settings: confirmation text before uninstalling the VPN service."
source: "This stops the URnetwork service and removes its systemd unit. The app can't connect until it is set up again. You will be asked for administrator permission."
platforms:
  - linux
localizations:
  ar: "هذا يوقف خدمة URnetwork ويزيل وحدة systemd الخاصة بها. لن يتمكن التطبيق من الاتصال حتى تُعدّ الخدمة مجددًا. سيُطلب منك إذن المسؤول."
  cs: "Tím se zastaví služba URnetwork a odstraní se její jednotka systemd. Aplikace se nebude moci připojit, dokud se služba znovu nenastaví. Budete požádáni o oprávnění správce."
  de: "Das stoppt den URnetwork-Dienst und entfernt seine systemd-Unit. Die App kann sich erst wieder verbinden, wenn er neu eingerichtet ist. Du wirst nach einer Administratorberechtigung gefragt."
  el: "Αυτό σταματά την υπηρεσία URnetwork και αφαιρεί τη μονάδα systemd της. Η εφαρμογή δεν μπορεί να συνδεθεί μέχρι να ρυθμιστεί ξανά. Θα σας ζητηθεί άδεια διαχειριστή."
  en: "This stops the URnetwork service and removes its systemd unit. The app can't connect until it is set up again. You will be asked for administrator permission."
  es: "Esto detiene el servicio de URnetwork y elimina su unidad de systemd. La app no podrá conectarse hasta que se configure de nuevo. Se te pedirá permiso de administrador."
  es-419: "Esto detiene el servicio de URnetwork y elimina su unidad de systemd. La app no podrá conectarse hasta que se configure de nuevo. Se te pedirá permiso de administrador."
  es-MX: "Esto detiene el servicio de URnetwork y elimina su unidad de systemd. La app no podrá conectarse hasta que se configure de nuevo. Se te pedirá permiso de administrador."
  fr: "Cela arrête le service URnetwork et supprime son unité systemd. L’application ne pourra pas se connecter tant qu’il n’est pas reconfiguré. Une autorisation d’administrateur vous sera demandée."
  he: "פעולה זו עוצרת את שירות URnetwork ומסירה את יחידת ה-systemd שלו. האפליקציה לא תוכל להתחבר עד שהוא יוגדר מחדש. תתבקשו לתת הרשאת מנהל."
  hi: "यह URnetwork सेवा को रोकता है और उसकी systemd यूनिट हटा देता है। इसे फिर से सेट अप करने तक ऐप कनेक्ट नहीं कर सकता। आपसे व्यवस्थापक अनुमति माँगी जाएगी।"
  id: "Ini menghentikan layanan URnetwork dan menghapus unit systemd-nya. Aplikasi tidak dapat terhubung sampai layanan disiapkan lagi. Anda akan diminta izin administrator."
  it: "Questo arresta il servizio URnetwork e rimuove la sua unità systemd. L’app non può connettersi finché non viene configurato di nuovo. Ti verrà chiesto il permesso dell’amministratore."
  ja: "URnetwork サービスを停止し、その systemd ユニットを削除します。再設定するまでアプリは接続できません。管理者の許可を求められます。"
  ko: "URnetwork 서비스를 중지하고 해당 systemd 유닛을 제거합니다. 다시 설정할 때까지 앱은 연결할 수 없습니다. 관리자 권한을 요청합니다."
  nl: "Dit stopt de URnetwork-dienst en verwijdert zijn systemd-unit. De app kan pas weer verbinden als die opnieuw is ingesteld. Je wordt om beheerdersrechten gevraagd."
  pl: "To zatrzymuje usługę URnetwork i usuwa jej jednostkę systemd. Aplikacja nie będzie mogła się łączyć, dopóki usługa nie zostanie ponownie skonfigurowana. Zostaniesz poproszony o uprawnienia administratora."
  pt: "Isso para o serviço URnetwork e remove sua unidade do systemd. O app não pode conectar até que ele seja configurado de novo. Você receberá um pedido de permissão de administrador."
  pt-BR: "Isso para o serviço URnetwork e remove sua unidade do systemd. O app não pode conectar até que ele seja configurado de novo. Você receberá um pedido de permissão de administrador."
  pt-PT: "Isto para o serviço URnetwork e remove a respetiva unidade systemd. A app não pode ligar até ele ser configurado novamente. Ser-lhe-á pedida permissão de administrador."
  ru: "Это остановит службу URnetwork и удалит её юнит systemd. Приложение не сможет подключаться, пока служба не будет настроена заново. Потребуется разрешение администратора."
  sv: "Det här stoppar URnetwork-tjänsten och tar bort dess systemd-enhet. Appen kan inte ansluta förrän den har konfigurerats igen. Du kommer att bli ombedd om administratörsbehörighet."
  sw: "Hii husimamisha huduma ya URnetwork na kuondoa kitengo chake cha systemd. Programu haiwezi kuunganisha hadi isanidiwe tena. Utaombwa ruhusa ya msimamizi."
  th: "การดำเนินการนี้จะหยุดบริการ URnetwork และลบยูนิต systemd ของบริการ แอปจะเชื่อมต่อไม่ได้จนกว่าจะตั้งค่าใหม่ ระบบจะขอสิทธิ์ผู้ดูแลระบบจากคุณ"
  uk: "Це зупинить службу URnetwork і видалить її юніт systemd. Застосунок не зможе підключатися, доки службу не буде налаштовано знову. У вас попросять дозвіл адміністратора."
  vi: "Thao tác này dừng dịch vụ URnetwork và gỡ bỏ unit systemd của nó. Ứng dụng không thể kết nối cho đến khi thiết lập lại. Bạn sẽ được yêu cầu quyền quản trị viên."
  zh: "这会停止 URnetwork 服务并移除其 systemd 单元。在重新设置之前应用无法连接。系统将请求管理员权限。"
  zh-HK: "這會停止 URnetwork 服務並移除其 systemd 單元。在重新設定之前應用程式無法連線。系統將要求管理員權限。"
