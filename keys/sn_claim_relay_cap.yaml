description: "Earnings, the settlement v2 tile and the claim sheet: URnetwork's daily budget for paying claim gas is spent, so the claim waits for the next day (UTC)."
source: "Today's claim budget is used up, so this waits for the next day. Nothing is lost: this credit never expires."
platforms:
  - apple
localizations:
  ar: "نفدت ميزانية المطالبات لهذا اليوم، لذا سينتظر هذا حتى اليوم التالي. لا يضيع شيء: هذا الرصيد لا تنتهي صلاحيته أبدًا."
  cs: "Dnešní rozpočet na vyzvedávání je vyčerpaný, takže to počká do dalšího dne. Nic se neztratí: tento kredit nikdy nevyprší."
  de: "Das heutige Einlösebudget ist aufgebraucht, daher wartet das bis zum nächsten Tag. Nichts geht verloren: Dieses Guthaben verfällt nie."
  el: "Ο σημερινός προϋπολογισμός διεκδικήσεων εξαντλήθηκε, οπότε αυτό θα περιμένει την επόμενη ημέρα. Δεν χάνεται τίποτα: αυτή η πίστωση δεν λήγει ποτέ."
  en: "Today's claim budget is used up, so this waits for the next day. Nothing is lost: this credit never expires."
  es: "El presupuesto de reclamaciones de hoy se ha agotado, así que esto esperará al día siguiente. No se pierde nada: este saldo nunca caduca."
  es-419: "El presupuesto de reclamaciones de hoy se agotó, así que esto esperará al día siguiente. No se pierde nada: este saldo nunca vence."
  es-MX: "El presupuesto de reclamaciones de hoy se agotó, así que esto esperará al día siguiente. No se pierde nada: este saldo nunca vence."
  fr: "Le budget de réclamations du jour est épuisé, donc cela attendra le lendemain. Rien n’est perdu : ce crédit n’expire jamais."
  he: "תקציב המימושים של היום נוצל במלואו, ולכן זה ימתין ליום הבא. שום דבר לא הולך לאיבוד: תוקף הזיכוי הזה לעולם לא פג."
  hi: "दावों के लिए आज का बजट खत्म हो गया है, इसलिए यह अगले दिन तक प्रतीक्षा करेगा। कुछ भी खोया नहीं जाता: यह क्रेडिट कभी समाप्त नहीं होता।"
  id: "Anggaran klaim hari ini sudah habis, jadi ini menunggu hari berikutnya. Tidak ada yang hilang: saldo ini tidak pernah kedaluwarsa."
  it: "Il budget per i riscatti di oggi è esaurito, quindi questo attende il giorno successivo. Non si perde nulla: questo credito non scade mai."
  ja: "本日の受け取り予算が尽きたため、翌日まで待機します。失われるものはありません。この残高に有効期限はありません。"
  ko: "오늘의 받기 예산이 소진되어 다음 날까지 기다립니다. 잃는 것은 없습니다. 이 잔액은 절대 만료되지 않습니다."
  nl: "Het claimbudget van vandaag is op, dus dit wacht tot de volgende dag. Er gaat niets verloren: dit tegoed verloopt nooit."
  pl: "Dzisiejszy budżet na odbiory się wyczerpał, więc to poczeka do następnego dnia. Nic nie przepada: te środki nigdy nie wygasają."
  pt: "O orçamento de reivindicações de hoje esgotou-se, por isso isto fica à espera do dia seguinte. Nada se perde: este saldo nunca expira."
  pt-BR: "O orçamento de resgates de hoje se esgotou, então isso aguarda o dia seguinte. Nada se perde: este saldo nunca expira."
  pt-PT: "O orçamento de reivindicações de hoje esgotou-se, por isso isto fica à espera do dia seguinte. Nada se perde: este saldo nunca expira."
  ru: "Бюджет на получение на сегодня исчерпан, поэтому это подождёт до следующего дня. Ничего не теряется: у этого начисления нет срока действия."
  sv: "Dagens uttagsbudget är förbrukad, så det här väntar till nästa dag. Inget går förlorat: det här tillgodohavandet löper aldrig ut."
  sw: "Bajeti ya madai ya leo imekwisha, kwa hivyo hili linasubiri siku inayofuata. Hakuna kinachopotea: salio hili halitaisha muda kamwe."
  th: "งบประมาณสำหรับการรับของวันนี้หมดแล้ว รายการนี้จึงรอถึงวันถัดไป ไม่มีอะไรสูญหาย ยอดนี้ไม่มีวันหมดอายุ"
  uk: "Бюджет на отримання на сьогодні вичерпано, тож це зачекає до наступного дня. Нічого не втрачається: це нарахування не має строку дії."
  vi: "Ngân sách cho việc nhận hôm nay đã hết, nên khoản này sẽ chờ đến ngày hôm sau. Không mất gì cả: khoản này không bao giờ hết hạn."
  zh: "今日的领取预算已用完，因此将等到次日。不会有任何损失：这笔余额永不过期。"
  zh-HK: "今日的領取預算已用完，因此將等到翌日。不會有任何損失：這筆餘額永不過期。"
