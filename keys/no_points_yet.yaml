description: "Empty state of the points history."
source: "No epochs yet. Points appear after your first finalized epoch."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "لا توجد فترات بعد. تظهر النقاط بعد أول فترة مكتملة لك."
  cs: "Zatím žádné epochy. Body se objeví po vaší první dokončené epoše."
  de: "Noch keine Epochen. Punkte erscheinen nach deiner ersten abgeschlossenen Epoche."
  el: "Δεν υπάρχουν ακόμη εποχές. Οι πόντοι εμφανίζονται μετά την πρώτη οριστικοποιημένη εποχή σας."
  en: "No epochs yet. Points appear after your first finalized epoch."
  es: "Aún no hay épocas. Los puntos aparecen después de tu primera época finalizada."
  es-419: "Todavía no hay épocas. Los puntos aparecen después de tu primera época finalizada."
  es-MX: "Todavía no hay épocas. Los puntos aparecen después de tu primera época finalizada."
  fr: "Aucune époque pour l’instant. Les points apparaissent après votre première époque finalisée."
  he: "עדיין אין תקופות. נקודות יופיעו אחרי התקופה הראשונה שלכם שתושלם."
  hi: "अभी कोई एपोक नहीं। आपके पहले पूर्ण एपोक के बाद पॉइंट दिखेंगे।"
  id: "Belum ada epoch. Poin muncul setelah epoch pertama Anda selesai."
  it: "Ancora nessuna epoca. I punti compaiono dopo la tua prima epoca finalizzata."
  ja: "まだエポックがありません。最初のエポックが確定するとポイントが表示されます。"
  ko: "아직 에포크가 없습니다. 첫 에포크가 확정되면 포인트가 표시됩니다."
  nl: "Nog geen epochs. Punten verschijnen na je eerste afgeronde epoch."
  pl: "Jeszcze nie ma epok. Punkty pojawią się po twojej pierwszej sfinalizowanej epoce."
  pt: "Ainda não há épocas. Os pontos aparecem após a sua primeira época finalizada."
  pt-BR: "Ainda não há épocas. Os pontos aparecem após sua primeira época finalizada."
  pt-PT: "Ainda não há épocas. Os pontos aparecem após a sua primeira época finalizada."
  ru: "Эпох пока нет. Очки появятся после вашей первой завершённой эпохи."
  sv: "Inga epoker än. Poäng visas efter din första slutförda epok."
  sw: "Bado hakuna vipindi. Pointi huonekana baada ya kipindi chako cha kwanza kukamilika."
  th: "ยังไม่มีอีพอค คะแนนจะปรากฏหลังอีพอคแรกของคุณสรุปแล้ว"
  uk: "Епох ще немає. Бали з’являться після вашої першої завершеної епохи."
  vi: "Chưa có epoch nào. Điểm sẽ xuất hiện sau epoch hoàn tất đầu tiên của bạn."
  zh: "暂无周期。积分将在您的第一个周期确认后显示。"
  zh-HK: "暫時沒有週期。積分會在你的第一個週期確認後顯示。"
