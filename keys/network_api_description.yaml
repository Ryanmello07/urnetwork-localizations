description: "Explains the network API selector."
source: "Choose the network domain used by the app. Leave the API and connect URLs blank to derive them from the domain."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "اختر نطاق الشبكة الذي يستخدمه التطبيق. اترك عنواني API و connect فارغين ليتم اشتقاقهما من النطاق."
  cs: "Zvolte síťovou doménu, kterou aplikace používá. Ponechte URL API a connect prázdné, aby se odvodily z domény."
  de: "Wähle die Netzwerkdomain, die die App verwendet. Lass die API- und Connect-URLs leer, um sie von der Domain abzuleiten."
  el: "Επιλέξτε τον τομέα δικτύου που χρησιμοποιεί η εφαρμογή. Αφήστε τα URL του API και του connect κενά για να προκύψουν από τον τομέα."
  en: "Choose the network domain used by the app. Leave the API and connect URLs blank to derive them from the domain."
  es: "Elige el dominio de red que usa la app. Deja las URL de API y connect en blanco para derivarlas del dominio."
  es-419: "Elige el dominio de red que usa la app. Deja las URL de API y connect en blanco para derivarlas del dominio."
  es-MX: "Elige el dominio de red que usa la app. Deja las URL de API y connect en blanco para derivarlas del dominio."
  fr: "Choisissez le domaine réseau utilisé par l'application. Laissez les URL API et connect vides pour les dériver du domaine."
  he: "בחר את דומיין הרשת שבו האפליקציה משתמשת. השאר את כתובות ה-API וה-connect ריקות כדי לגזור אותן מהדומיין."
  hi: "ऐप द्वारा उपयोग किया जाने वाला नेटवर्क डोमेन चुनें। API और connect URL को डोमेन से प्राप्त करने के लिए खाली छोड़ें।"
  id: "Pilih domain jaringan yang digunakan aplikasi. Biarkan URL API dan connect kosong agar diturunkan dari domain."
  it: "Scegli il dominio di rete usato dall'app. Lascia vuoti gli URL API e connect per derivarli dal dominio."
  ja: "アプリが使用するネットワークドメインを選択します。API と connect の URL を空欄にすると、ドメインから導出されます。"
  ko: "앱이 사용할 네트워크 도메인을 선택하세요. API 및 connect URL을 비워 두면 도메인에서 파생됩니다."
  nl: "Kies het netwerkdomein dat de app gebruikt. Laat de API- en connect-URL's leeg om ze af te leiden van het domein."
  pl: "Wybierz domenę sieci używaną przez aplikację. Pozostaw adresy URL API i connect puste, aby wyprowadzić je z domeny."
  pt: "Escolha o domínio de rede usado pela app. Deixe os URL de API e connect em branco para os derivar do domínio."
  pt-BR: "Escolha o domínio de rede usado pelo app. Deixe as URLs de API e connect em branco para derivá-las do domínio."
  pt-PT: "Escolha o domínio de rede usado pela app. Deixe os URL de API e connect em branco para os derivar do domínio."
  ru: "Выберите домен сети, используемый приложением. Оставьте URL API и connect пустыми, чтобы вывести их из домена."
  sv: "Välj nätverksdomänen som appen använder. Lämna API- och connect-URL:erna tomma för att härleda dem från domänen."
  sw: "Chagua kikoa cha mtandao kinachotumiwa na programu. Acha URL za API na connect wazi ili zitokane na kikoa."
  th: "เลือกโดเมนเครือข่ายที่แอปใช้ เว้น URL ของ API และ connect ว่างไว้เพื่อให้ได้มาจากโดเมน"
  uk: "Виберіть домен мережі, який використовує застосунок. Залиште URL API та connect порожніми, щоб вивести їх із домену."
  vi: "Chọn tên miền mạng mà ứng dụng sử dụng. Để trống URL API và connect để suy ra từ tên miền."
  zh: "选择应用使用的网络域名。将 API 和 connect URL 留空则从域名派生。"
  zh-HK: "選擇應用程式使用的網絡網域。將 API 和 connect URL 留空則從網域衍生。"
