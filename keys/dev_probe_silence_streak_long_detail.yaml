description: "Developer page (Apple): the explanation under the 'Probe silence streak' setting."
source: "How many consecutive probe passes an exit may answer with total silence before it is warned out of new-flow placement — the compensation for providers that leave the network mid-session. Placement only: removal stays traffic-based, and any sign of life clears the streak"
platforms:
  - apple
localizations:
  ar: "عدد جولات الفحص المتتالية التي يمكن للمخرج أن يقابلها بصمت تام قبل أن يُحذَّر ويُستبعد من توزيع التدفقات الجديدة — وهذا تعويض عن المزودين الذين يغادرون الشبكة في منتصف الجلسة. يؤثر في التوزيع فقط: تبقى الإزالة مبنية على حركة البيانات، وأي علامة حياة تُعيد السلسلة إلى الصفر"
  cs: "Kolik po sobě jdoucích průchodů sond smí výstup nechat v úplném tichu, než dostane varování a bude vyřazen z umisťování nových toků — vyrovnání pro poskytovatele, kteří opustí síť uprostřed relace. Jen umisťování: odstranění se dál řídí provozem a každá známka života sérii vynuluje"
  de: "Wie viele aufeinanderfolgende Prüfdurchläufe ein Exit mit völliger Stille beantworten darf, bevor er per Warnung aus der Platzierung neuer Flows genommen wird — der Ausgleich für Anbieter, die das Netzwerk mitten in der Sitzung verlassen. Nur die Platzierung: Entfernt wird weiterhin nach dem Datenverkehr, und jedes Lebenszeichen setzt die Serie zurück"
  el: "Πόσους διαδοχικούς γύρους ελέγχου μπορεί μια έξοδος να αφήσει χωρίς καμία απάντηση πριν λάβει προειδοποίηση και αποκλειστεί από την τοποθέτηση νέων ροών — η αντιστάθμιση για παρόχους που φεύγουν από το δίκτυο στη μέση της συνεδρίας. Μόνο τοποθέτηση: η αφαίρεση εξακολουθεί να βασίζεται στην κίνηση, και κάθε σημάδι ζωής μηδενίζει το σερί"
  en: "How many consecutive probe passes an exit may answer with total silence before it is warned out of new-flow placement — the compensation for providers that leave the network mid-session. Placement only: removal stays traffic-based, and any sign of life clears the streak"
  es: "Cuántas pasadas de sondeo consecutivas puede responder una salida con silencio total antes de quedar advertida y fuera de la asignación de flujos nuevos — la compensación por los proveedores que abandonan la red en mitad de la sesión. Solo afecta a la asignación: la eliminación sigue basándose en el tráfico, y cualquier señal de vida reinicia la racha"
  es-419: "Cuántas pasadas de sondeo consecutivas puede responder una salida con silencio total antes de quedar advertida y fuera de la asignación de flujos nuevos — la compensación por los proveedores que abandonan la red a mitad de la sesión. Solo afecta la asignación: la eliminación sigue basándose en el tráfico, y cualquier señal de vida reinicia la racha"
  es-MX: "Cuántas pasadas de sondeo consecutivas puede responder una salida con silencio total antes de quedar advertida y fuera de la asignación de flujos nuevos — la compensación por los proveedores que abandonan la red a mitad de la sesión. Solo afecta la asignación: la eliminación sigue basándose en el tráfico, y cualquier señal de vida reinicia la racha"
  fr: "Combien de passes de sondage consécutives une sortie peut laisser sans aucune réponse avant d’être avertie et exclue du placement des nouveaux flux — la compensation pour les fournisseurs qui quittent le réseau en cours de session. Placement uniquement : le retrait reste fondé sur le trafic, et le moindre signe de vie remet la série à zéro"
  he: "כמה סבבי בדיקה רצופים יציאה יכולה לענות בשתיקה מוחלטת לפני שהיא מקבלת אזהרה ומוצאת מהקצאת זרימות חדשות — הפיצוי על ספקים שעוזבים את הרשת באמצע סשן. הקצאה בלבד: ההסרה נשארת מבוססת תעבורה, וכל סימן חיים מאפס את הרצף"
  hi: "कोई एग्ज़िट लगातार कितने प्रोब पास का जवाब पूरी चुप्पी से दे सकता है, इससे पहले कि उसे चेतावनी देकर नए फ़्लो के प्लेसमेंट से बाहर किया जाए — यह उन प्रदाताओं की भरपाई है जो सत्र के बीच में नेटवर्क छोड़ देते हैं। सिर्फ़ प्लेसमेंट: हटाना अब भी ट्रैफ़िक पर आधारित है, और ज़िंदा होने का कोई भी संकेत गिनती को शून्य कर देता है"
  id: "Berapa banyak putaran probe berturut-turut yang boleh dijawab sebuah exit dengan diam total sebelum exit itu diperingatkan dan dikeluarkan dari penempatan aliran baru — kompensasi untuk penyedia yang meninggalkan jaringan di tengah sesi. Hanya penempatan: penghapusan tetap berdasarkan lalu lintas, dan setiap tanda kehidupan mengatur ulang rentetan"
  it: "Quanti passaggi di sondaggio consecutivi un’uscita può lasciare in totale silenzio prima di essere avvisata ed esclusa dall’assegnazione dei nuovi flussi — la compensazione per i provider che lasciano la rete a metà sessione. Solo assegnazione: la rimozione resta basata sul traffico, e qualsiasi segno di vita azzera la serie"
  ja: "出口が完全な無応答を続けてもよい確認の連続回数。これを超えると警告され、新しいフローの割り当て対象から外されます。セッションの途中でネットワークを離れるプロバイダーへの対策です。割り当てのみ: 除外は引き続きトラフィックに基づき、生存の兆候が 1 つでもあれば連続回数はリセットされます"
  ko: "출구가 완전한 무응답으로 넘길 수 있는 연속 점검 횟수입니다. 이를 넘으면 경고를 받고 새 플로우 배치에서 제외됩니다. 세션 도중 네트워크를 떠나는 제공자에 대한 보완책입니다. 배치에만 적용: 제외는 계속 트래픽을 기준으로 하며, 살아 있다는 신호가 하나라도 있으면 연속 횟수가 초기화됩니다"
  nl: "Hoeveel opeenvolgende testrondes een exit volledig stil mag laten voordat hij een waarschuwing krijgt en buiten de plaatsing van nieuwe flows valt — de compensatie voor providers die het netwerk midden in een sessie verlaten. Alleen plaatsing: verwijderen blijft op verkeer gebaseerd, en elk teken van leven zet de reeks terug"
  pl: "Ile kolejnych przebiegów sondowania wyjście może zbyć całkowitym milczeniem, zanim dostanie ostrzeżenie i zostanie wyłączone z przydzielania nowych przepływów — to rekompensata za dostawców, którzy opuszczają sieć w trakcie sesji. Tylko przydzielanie: usuwanie nadal zależy od ruchu, a każdy znak życia zeruje serię"
  pt: "Quantas rondas de sondagem consecutivas uma saída pode deixar em silêncio total antes de ser avisada e excluída da atribuição de novos fluxos — a compensação pelos fornecedores que saem da rede a meio da sessão. Só atribuição: a remoção continua a basear-se no tráfego, e qualquer sinal de vida repõe a sequência"
  pt-BR: "Quantas rodadas de sondagem consecutivas uma saída pode deixar em silêncio total antes de ser avisada e retirada da alocação de novos fluxos — a compensação pelos provedores que saem da rede no meio da sessão. Só alocação: a remoção continua baseada no tráfego, e qualquer sinal de vida zera a sequência"
  pt-PT: "Quantas rondas de sondagem consecutivas uma saída pode deixar em silêncio total antes de ser avisada e excluída da atribuição de novos fluxos — a compensação pelos fornecedores que saem da rede a meio da sessão. Só atribuição: a remoção continua a basear-se no tráfego, e qualquer sinal de vida repõe a sequência"
  ru: "Сколько проходов проб подряд выход может отвечать полной тишиной, прежде чем получит предупреждение и будет исключён из размещения новых потоков — это поправка на провайдеров, которые покидают сеть посреди сеанса. Только размещение: удаление по-прежнему зависит от трафика, а любой признак жизни сбрасывает серию"
  sv: "Hur många sonderingsomgångar i rad en utgång får besvara med total tystnad innan den varnas och hålls utanför placeringen av nya flöden — kompensationen för leverantörer som lämnar nätverket mitt i en session. Bara placering: borttagning styrs fortfarande av trafiken, och varje livstecken nollställer sviten"
  sw: "Idadi ya mizunguko ya vipimo mfululizo ambayo njia ya kutoka inaweza kujibu kwa ukimya kamili kabla ya kuonywa na kuondolewa kwenye upangaji wa mitiririko mipya — fidia kwa watoa huduma wanaoondoka kwenye mtandao katikati ya kipindi. Upangaji pekee: uondoaji bado unategemea trafiki, na dalili yoyote ya uhai hufuta mfululizo"
  th: "ทางออกตอบรอบการทดสอบติดต่อกันด้วยความเงียบสนิทได้กี่รอบก่อนถูกเตือนและถูกนำออกจากการจัดวางโฟลว์ใหม่ — เป็นการชดเชยสำหรับผู้ให้บริการที่ออกจากเครือข่ายกลางเซสชัน เฉพาะการจัดวาง: การลบยังคงอิงตามทราฟฟิก และสัญญาณว่ายังทำงานอยู่ใดๆ จะล้างจำนวนครั้งติดต่อกัน"
  uk: "Скільки проходів зондування поспіль вихід може відповідати повною тишею, перш ніж отримає попередження й буде виключений з розміщення нових потоків — це компенсація для провайдерів, які залишають мережу посеред сеансу. Лише розміщення: видалення й далі залежить від трафіку, а будь-яка ознака життя скидає серію"
  vi: "Một điểm thoát có thể đáp lại bao nhiêu lượt thăm dò liên tiếp bằng sự im lặng hoàn toàn trước khi bị cảnh báo và loại khỏi việc xếp luồng mới — biện pháp bù cho các nhà cung cấp rời mạng giữa phiên. Chỉ ảnh hưởng việc xếp luồng: việc loại bỏ vẫn dựa trên lưu lượng, và bất kỳ dấu hiệu còn hoạt động nào cũng xóa chuỗi"
  zh: "出口可以连续多少轮探测都完全无应答，之后会被警告并排除在新流分配之外——这是对在会话中途离开网络的提供商的补偿。仅影响分配：移除仍以流量为依据，任何存活迹象都会清零该计数"
  zh-HK: "出口可以連續多少輪探測都完全沒有回應，之後會被警告並排除在新流分配之外——這是對在工作階段中途離開網絡的供應商的補償。只影響分配：移除仍以流量為依據，任何存活跡象都會將計數歸零"
