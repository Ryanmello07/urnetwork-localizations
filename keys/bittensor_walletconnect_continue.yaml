description: "Shown while the browser is open on the WalletConnect page: the user scans the code or opens their wallet app there."
source: "Continue in your browser: scan the code with your wallet app, or open the wallet on this device."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "تابع في متصفحك: امسح الرمز باستخدام تطبيق محفظتك، أو افتح المحفظة على هذا الجهاز."
  cs: "Pokračujte v prohlížeči: naskenujte kód aplikací své peněženky, nebo peněženku otevřete na tomto zařízení."
  de: "Fahre in deinem Browser fort: Scanne den Code mit deiner Wallet-App oder öffne die Wallet auf diesem Gerät."
  el: "Συνεχίστε στο πρόγραμμα περιήγησης: σαρώστε τον κωδικό με την εφαρμογή του πορτοφολιού σας ή ανοίξτε το πορτοφόλι σε αυτήν τη συσκευή."
  en: "Continue in your browser: scan the code with your wallet app, or open the wallet on this device."
  es: "Continúa en tu navegador: escanea el código con la app de tu billetera o abre la billetera en este dispositivo."
  es-419: "Continúa en tu navegador: escanea el código con la app de tu billetera o abre la billetera en este dispositivo."
  es-MX: "Continúa en tu navegador: escanea el código con la app de tu cartera o abre la cartera en este dispositivo."
  fr: "Continuez dans votre navigateur : scannez le code avec l’app de votre portefeuille ou ouvrez le portefeuille sur cet appareil."
  he: "המשיכו בדפדפן: סרקו את הקוד באפליקציית הארנק או פתחו את הארנק במכשיר הזה."
  hi: "अपने ब्राउज़र में जारी रखें: अपने वॉलेट ऐप से कोड स्कैन करें, या इस डिवाइस पर वॉलेट खोलें।"
  id: "Lanjutkan di browser: pindai kode dengan aplikasi dompet Anda, atau buka dompet di perangkat ini."
  it: "Continua nel browser: scansiona il codice con l’app del tuo portafoglio o apri il portafoglio su questo dispositivo."
  ja: "ブラウザで続行してください。ウォレットアプリでコードをスキャンするか、このデバイスでウォレットを開きます。"
  ko: "브라우저에서 계속하세요. 지갑 앱으로 코드를 스캔하거나 이 기기에서 지갑을 여세요."
  nl: "Ga verder in je browser: scan de code met je wallet-app of open de wallet op dit apparaat."
  pl: "Kontynuuj w przeglądarce: zeskanuj kod aplikacją portfela albo otwórz portfel na tym urządzeniu."
  pt: "Continue no seu navegador: digitalize o código com a app da sua carteira ou abra a carteira neste dispositivo."
  pt-BR: "Continue no seu navegador: escaneie o código com o app da sua carteira ou abra a carteira neste dispositivo."
  pt-PT: "Continue no seu navegador: digitalize o código com a app da sua carteira ou abra a carteira neste dispositivo."
  ru: "Продолжите в браузере: отсканируйте код приложением кошелька или откройте кошелек на этом устройстве."
  sv: "Fortsätt i webbläsaren: skanna koden med din plånboksapp eller öppna plånboken på den här enheten."
  sw: "Endelea kwenye kivinjari chako: changanua msimbo kwa programu ya pochi yako, au fungua pochi kwenye kifaa hiki."
  th: "ดำเนินการต่อในเบราว์เซอร์: สแกนรหัสด้วยแอปกระเป๋าเงินของคุณ หรือเปิดกระเป๋าเงินบนอุปกรณ์นี้"
  uk: "Продовжте в браузері: відскануйте код застосунком гаманця або відкрийте гаманець на цьому пристрої."
  vi: "Tiếp tục trong trình duyệt: quét mã bằng ứng dụng ví của bạn, hoặc mở ví trên thiết bị này."
  zh: "请在浏览器中继续：用钱包应用扫描二维码，或在此设备上打开钱包。"
  zh-HK: "請在瀏覽器中繼續：用錢包應用程式掃描 QR 碼，或在此裝置上開啟錢包。"
