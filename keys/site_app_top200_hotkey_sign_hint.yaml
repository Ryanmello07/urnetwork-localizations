description: "App top200: how to produce the hotkey signature"
source: "With --hotkey_seed_file, the payload from provider fleet sign already carries the hotkey signature. Or, where the hotkey seed is kept, run provider fleet sign with the device's --client_id and --hotkey_seed_file and paste the 0x signature it prints here. provider fleet bind signs with the hotkey for you."
platforms:
  - site
localizations:
  ar: "مع --hotkey_seed_file تتضمن بيانات الربط التي يطبعها provider fleet sign توقيع hotkey مسبقًا. أو، حيث تحتفظ ببذرة hotkey، شغّل provider fleet sign مع --client_id الخاص بالجهاز و --hotkey_seed_file والصق هنا توقيع 0x الذي يطبعه. الأمر provider fleet bind يوقّع باستخدام hotkey نيابةً عنك."
  de: "Mit --hotkey_seed_file enthält die Payload von provider fleet sign bereits die Hotkey-Signatur. Oder führe dort, wo der Hotkey-Seed liegt, provider fleet sign mit der --client_id des Geräts und --hotkey_seed_file aus und füge die ausgegebene 0x-Signatur hier ein. provider fleet bind signiert für dich mit dem Hotkey."
  en: "With --hotkey_seed_file, the payload from provider fleet sign already carries the hotkey signature. Or, where the hotkey seed is kept, run provider fleet sign with the device's --client_id and --hotkey_seed_file and paste the 0x signature it prints here. provider fleet bind signs with the hotkey for you."
  es: "Con --hotkey_seed_file, la carga útil de provider fleet sign ya incluye la firma de la hotkey. O bien, donde guardes la semilla de la hotkey, ejecuta provider fleet sign con el --client_id del dispositivo y --hotkey_seed_file, y pega aquí la firma 0x que imprime. provider fleet bind firma con la hotkey por ti."
  ru: "С --hotkey_seed_file данные от provider fleet sign уже содержат подпись hotkey. Или там, где хранится seed hotkey, выполните provider fleet sign с --client_id устройства и --hotkey_seed_file и вставьте сюда выведенную подпись 0x. provider fleet bind подписывает ключом hotkey за вас."
  zh: "加上 --hotkey_seed_file 后，provider fleet sign 输出的绑定数据已包含 hotkey 签名。或者，在保存 hotkey 种子的设备上，使用该设备的 --client_id 和 --hotkey_seed_file 运行 provider fleet sign，并将其输出的 0x 签名粘贴到此处。provider fleet bind 会替您用 hotkey 签名。"
