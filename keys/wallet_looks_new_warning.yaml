description: "Warning when a wallet address has no activity on the Bittensor chain yet; the user may continue."
source: "This address has no activity on the Bittensor chain yet. It looks like a new wallet. Make sure it is yours before continuing."
platforms:
  - android
  - apple
  - windows
  - linux
  - site
localizations:
  ar: "لا يوجد أي نشاط لهذا العنوان على سلسلة Bittensor بعد. يبدو أنها محفظة جديدة. تأكد من أنها ملكك قبل المتابعة."
  cs: "Tato adresa zatím nemá na řetězci Bittensor žádnou aktivitu. Vypadá jako nová peněženka. Než budete pokračovat, ověřte, že je vaše."
  de: "Diese Adresse hat noch keine Aktivität auf der Bittensor-Chain. Es sieht nach einer neuen Wallet aus. Vergewissere dich, dass sie dir gehört, bevor du fortfährst."
  el: "Αυτή η διεύθυνση δεν έχει ακόμη δραστηριότητα στην αλυσίδα Bittensor. Μοιάζει με νέο πορτοφόλι. Βεβαιωθείτε ότι είναι δικό σας πριν συνεχίσετε."
  en: "This address has no activity on the Bittensor chain yet. It looks like a new wallet. Make sure it is yours before continuing."
  es: "Esta dirección aún no tiene actividad en la cadena de Bittensor. Parece una billetera nueva. Asegúrate de que es tuya antes de continuar."
  es-419: "Esta dirección todavía no tiene actividad en la cadena de Bittensor. Parece una billetera nueva. Asegúrate de que es tuya antes de continuar."
  es-MX: "Esta dirección todavía no tiene actividad en la cadena de Bittensor. Parece una cartera nueva. Asegúrate de que es tuya antes de continuar."
  fr: "Cette adresse n’a encore aucune activité sur la chaîne Bittensor. Elle ressemble à un nouveau portefeuille. Assurez-vous qu’il vous appartient avant de continuer."
  he: "לכתובת הזו עדיין אין פעילות בשרשרת Bittensor. היא נראית כמו ארנק חדש. ודאו שהוא שלכם לפני שתמשיכו."
  hi: "इस पते पर अभी Bittensor चेन पर कोई गतिविधि नहीं है। यह नया वॉलेट लगता है। आगे बढ़ने से पहले पक्का कर लें कि यह आपका है।"
  id: "Alamat ini belum memiliki aktivitas di chain Bittensor. Sepertinya ini dompet baru. Pastikan dompet ini milik Anda sebelum melanjutkan."
  it: "Questo indirizzo non ha ancora attività sulla catena Bittensor. Sembra un portafoglio nuovo. Assicurati che sia tuo prima di continuare."
  ja: "このアドレスには Bittensor チェーン上の活動がまだありません。新しいウォレットのようです。続行する前に、自分のものか確認してください。"
  ko: "이 주소는 아직 Bittensor 체인에서 활동 기록이 없습니다. 새 지갑으로 보입니다. 계속하기 전에 내 지갑이 맞는지 확인하세요."
  nl: "Dit adres heeft nog geen activiteit op de Bittensor-chain. Het lijkt een nieuwe wallet. Zorg dat hij van jou is voordat je verdergaat."
  pl: "Ten adres nie ma jeszcze żadnej aktywności w łańcuchu Bittensor. Wygląda na nowy portfel. Zanim przejdziesz dalej, upewnij się, że należy do ciebie."
  pt: "Este endereço ainda não tem atividade na cadeia Bittensor. Parece uma carteira nova. Confirme que é sua antes de continuar."
  pt-BR: "Este endereço ainda não tem atividade na cadeia Bittensor. Parece uma carteira nova. Confirme que ela é sua antes de continuar."
  pt-PT: "Este endereço ainda não tem atividade na cadeia Bittensor. Parece uma carteira nova. Confirme que é sua antes de continuar."
  ru: "У этого адреса пока нет активности в блокчейне Bittensor. Похоже, это новый кошелек. Прежде чем продолжить, убедитесь, что он ваш."
  sv: "Den här adressen har ingen aktivitet på Bittensor-kedjan än. Den ser ut som en ny plånbok. Kontrollera att den är din innan du fortsätter."
  sw: "Anwani hii bado haina shughuli kwenye mnyororo wa Bittensor. Inaonekana kuwa pochi mpya. Hakikisha ni yako kabla ya kuendelea."
  th: "ที่อยู่นี้ยังไม่มีกิจกรรมบนเชน Bittensor ดูเหมือนเป็นกระเป๋าเงินใหม่ ตรวจสอบให้แน่ใจว่าเป็นของคุณก่อนดำเนินการต่อ"
  uk: "Ця адреса ще не має активності в блокчейні Bittensor. Схоже, це новий гаманець. Переконайтеся, що він ваш, перш ніж продовжити."
  vi: "Địa chỉ này chưa có hoạt động nào trên chuỗi Bittensor. Có vẻ đây là ví mới. Hãy chắc chắn ví này là của bạn trước khi tiếp tục."
  zh: "此地址在 Bittensor 链上尚无任何活动，看起来是一个新钱包。继续之前，请确认它属于您。"
  zh-HK: "此地址在 Bittensor 鏈上尚未有任何活動，看來是一個新錢包。繼續之前，請確認它屬於你。"
