description: "Developer page: the explanation under the 'Drop stalled exits fast' setting."
source: "How long an exit may stop delivering before it is dropped, in ms. Off waits 30s"
platforms:
  - linux
  - apple
localizations:
  ar: "المدة التي يمكن فيها للمخرج التوقف عن التسليم قبل إسقاطه، بالمللي ثانية. عند الإيقاف، ينتظر 30 ثانية"
  cs: "Jak dlouho smí výstup přestat doručovat, než bude vyřazen, v ms. Vypnuto čeká 30 s"
  de: "Wie lange ein Exit nichts ausliefern darf, bevor er verworfen wird, in ms. Aus: wartet 30 s"
  el: "Για πόσο μπορεί μια έξοδος να σταματήσει να παραδίδει πριν απορριφθεί, σε ms. Η απενεργοποίηση περιμένει 30 δ"
  en: "How long an exit may stop delivering before it is dropped, in ms. Off waits 30s"
  es: "Cuánto tiempo puede una salida dejar de entregar antes de descartarla, en ms. Si está desactivado, espera 30 s"
  es-419: "Cuánto tiempo puede una salida dejar de entregar antes de descartarla, en ms. Si está desactivado, espera 30 s"
  es-MX: "Cuánto tiempo puede una salida dejar de entregar antes de descartarla, en ms. Si está desactivado, espera 30 s"
  fr: "Combien de temps une sortie peut cesser de livrer avant d’être écartée, en ms. Désactivé attend 30 s"
  he: "כמה זמן יציאה יכולה להפסיק למסור לפני שהיא מוסרת, במילישניות. כיבוי ממתין 30 שניות"
  hi: "कोई एग्ज़िट हटाए जाने से पहले कितनी देर तक डिलीवरी रोक सकता है, ms में। बंद करने पर 30 सेकंड इंतज़ार होता है"
  id: "Berapa lama sebuah exit boleh berhenti mengirim sebelum dibuang, dalam ms. Nonaktif menunggu 30 dtk"
  it: "Per quanto tempo un’uscita può smettere di consegnare prima di essere scartata, in ms. Disattivato attende 30 s"
  ja: "出口が配信を止めてから除外されるまでの時間（ミリ秒）。オフにすると 30 秒待ちます"
  ko: "출구가 전달을 멈춘 뒤 제외되기까지 허용되는 시간(밀리초)입니다. 끄면 30초를 기다립니다"
  nl: "Hoe lang een exit mag stoppen met afleveren voordat hij wordt verwijderd, in ms. Uit wacht 30 s"
  pl: "Jak długo wyjście może przestać dostarczać, zanim zostanie odrzucone, w ms. Wyłączenie czeka 30 s"
  pt: "Durante quanto tempo uma saída pode deixar de entregar antes de ser descartada, em ms. Desativado espera 30 s"
  pt-BR: "Por quanto tempo uma saída pode parar de entregar antes de ser descartada, em ms. Desativado espera 30 s"
  pt-PT: "Durante quanto tempo uma saída pode deixar de entregar antes de ser descartada, em ms. Desativado espera 30 s"
  ru: "Как долго выход может ничего не доставлять, прежде чем его отключат, в мс. Если выключено, ожидание 30 с"
  sv: "Hur länge en utgång får sluta leverera innan den tas bort, i ms. Av väntar 30 s"
  sw: "Muda ambao njia ya kutoka inaweza kuacha kuwasilisha kabla ya kuondolewa, kwa ms. Kuzima kunasubiri sekunde 30"
  th: "ทางออกหยุดส่งข้อมูลได้นานเท่าใดก่อนถูกตัดทิ้ง (มิลลิวินาที) ปิดเพื่อรอ 30 วินาที"
  uk: "Як довго вихід може не доставляти, перш ніж його буде відкинуто, у мс. Вимкнення чекає 30 с"
  vi: "Một điểm thoát có thể ngừng chuyển dữ liệu trong bao lâu trước khi bị loại, tính bằng ms. Tắt sẽ chờ 30 giây"
  zh: "出口停止传送多长时间后会被丢弃（毫秒）。关闭时等待 30 秒"
  zh-HK: "出口停止傳送多久後會被捨棄（毫秒）。關閉時等待 30 秒"
