description: "Redeem balance code: the server answered that this code was already redeemed. Distinct from invalid -- the user may have redeemed it on an earlier attempt that looked like a failure."
source: "This balance code has already been redeemed. If you redeemed it earlier, the data is already on your balance."
platforms:
  - android
  - linux
  - windows
localizations:
  ar: "تم استرداد رمز الرصيد هذا بالفعل. إذا كنت قد استرددته سابقًا، فالبيانات موجودة بالفعل في رصيدك."
  cs: "Tento kód zůstatku už byl uplatněn. Pokud jste ho uplatnili dříve, data už máte na zůstatku."
  de: "Dieser Guthabencode wurde bereits eingelöst. Wenn du ihn schon früher eingelöst hast, sind die Daten bereits in deinem Guthaben."
  el: "Αυτός ο κωδικός υπολοίπου έχει ήδη εξαργυρωθεί. Αν τον εξαργυρώσατε νωρίτερα, τα δεδομένα βρίσκονται ήδη στο υπόλοιπό σας."
  en: "This balance code has already been redeemed. If you redeemed it earlier, the data is already on your balance."
  es: "Este código de saldo ya se canjeó. Si lo canjeaste antes, los datos ya están en tu saldo."
  es-419: "Este código de saldo ya se canjeó. Si lo canjeaste antes, los datos ya están en tu saldo."
  es-MX: "Este código de saldo ya se canjeó. Si lo canjeaste antes, los datos ya están en tu saldo."
  fr: "Ce code de solde a déjà été utilisé. Si vous l’avez utilisé plus tôt, les données sont déjà sur votre solde."
  he: "קוד היתרה הזה כבר מומש. אם מימשתם אותו קודם, הנתונים כבר ביתרה שלכם."
  hi: "यह बैलेंस कोड पहले ही रिडीम हो चुका है। अगर आपने इसे पहले रिडीम किया था, तो डेटा पहले से आपके बैलेंस में है।"
  id: "Kode saldo ini sudah ditukarkan. Jika Anda menukarkannya sebelumnya, datanya sudah ada di saldo Anda."
  it: "Questo codice saldo è già stato riscattato. Se l’hai riscattato prima, i dati sono già nel tuo saldo."
  ja: "この残高コードはすでに引き換えられています。以前に引き換えた場合、データはすでに残高に反映されています。"
  ko: "이 잔액 코드는 이미 사용되었습니다. 이전에 사용했다면 데이터가 이미 잔액에 들어 있습니다."
  nl: "Deze tegoedcode is al ingewisseld. Als je hem eerder hebt ingewisseld, staat de data al op je tegoed."
  pl: "Ten kod salda został już wykorzystany. Jeśli wykorzystano go wcześniej, dane są już na twoim saldzie."
  pt: "Este código de saldo já foi resgatado. Se o resgatou antes, os dados já estão no seu saldo."
  pt-BR: "Este código de saldo já foi resgatado. Se você o resgatou antes, os dados já estão no seu saldo."
  pt-PT: "Este código de saldo já foi resgatado. Se o resgatou antes, os dados já estão no seu saldo."
  ru: "Этот код баланса уже активирован. Если вы активировали его ранее, данные уже зачислены на ваш баланс."
  sv: "Den här saldokoden har redan lösts in. Om du löste in den tidigare finns datan redan i ditt saldo."
  sw: "Msimbo huu wa salio umeshakombolewa. Ikiwa uliukomboa awali, data tayari iko kwenye salio lako."
  th: "รหัสยอดคงเหลือนี้ถูกแลกไปแล้ว หากคุณแลกไว้ก่อนหน้านี้ ข้อมูลอยู่ในยอดคงเหลือของคุณแล้ว"
  uk: "Цей код балансу вже активовано. Якщо ви активували його раніше, дані вже на вашому балансі."
  vi: "Mã số dư này đã được đổi. Nếu bạn đã đổi trước đó, dữ liệu đã có trong số dư của bạn."
  zh: "此余额码已被兑换。如果您之前已兑换过，数据已计入您的余额。"
  zh-HK: "此餘額碼已被兌換。如果你之前已兌換，數據已計入你的餘額。"
