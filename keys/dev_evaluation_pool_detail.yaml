description: "Developer tools screen: explanatory subtext under the 'evaluation pool' control."
source: "How many providers a window expansion pings and ranks per slot it needs, keeping the best. 1 evaluates exactly what it needs"
platforms:
  - android
localizations:
  ar: "عدد المزودين الذين يرسل إليهم توسيع النافذة ping ويرتّبهم لكل خانة يحتاجها، مع الاحتفاظ بالأفضل. القيمة 1 تقيّم العدد المطلوب بالضبط"
  cs: "Kolik poskytovatelů rozšíření okna otestuje pingem a seřadí na každou potřebnou pozici, přičemž si ponechá ty nejlepší. 1 hodnotí přesně tolik, kolik je potřeba"
  de: "Wie viele Anbieter eine Fenstererweiterung pro benötigtem Slot anpingt und bewertet, wobei die besten behalten werden. 1 bewertet genau so viele wie nötig"
  el: "Πόσους παρόχους ελέγχει με ping και κατατάσσει μια επέκταση παραθύρου για κάθε θέση που χρειάζεται, κρατώντας τους καλύτερους. Το 1 αξιολογεί ακριβώς όσους χρειάζονται"
  en: "How many providers a window expansion pings and ranks per slot it needs, keeping the best. 1 evaluates exactly what it needs"
  es: "Cuántos proveedores sondea con ping y clasifica una ampliación de ventana por cada hueco que necesita, quedándose con los mejores. 1 evalúa exactamente los que necesita"
  es-419: "Cuántos proveedores sondea con ping y clasifica una ampliación de ventana por cada espacio que necesita, quedándose con los mejores. 1 evalúa exactamente los que necesita"
  es-MX: "Cuántos proveedores sondea con ping y clasifica una ampliación de ventana por cada espacio que necesita, quedándose con los mejores. 1 evalúa exactamente los que necesita"
  fr: "Combien de fournisseurs une extension de fenêtre teste par ping et classe pour chaque emplacement nécessaire, en gardant les meilleurs. 1 évalue exactement ce qu’il faut"
  he: "כמה ספקים הרחבת חלון בודקת בפינג ומדרגת לכל משבצת שהיא צריכה, תוך שמירת הטובים ביותר. 1 בודק בדיוק את מה שנדרש"
  hi: "विंडो विस्तार अपनी ज़रूरत के हर स्लॉट के लिए कितने प्रदाताओं को पिंग और रैंक करता है, और सबसे अच्छे रखता है। 1 ठीक उतने ही जाँचता है जितने चाहिए"
  id: "Berapa banyak penyedia yang di-ping dan diperingkat oleh perluasan jendela untuk setiap slot yang dibutuhkan, dengan menyimpan yang terbaik. 1 mengevaluasi tepat sebanyak yang dibutuhkan"
  it: "Quanti provider un’espansione della finestra testa con un ping e classifica per ogni posto che le serve, tenendo i migliori. 1 valuta esattamente quelli che servono"
  ja: "ウィンドウの拡張時に、必要なスロットごとに ping してランク付けするプロバイダーの数。最も良いものを残します。1 は必要な数だけを評価します"
  ko: "창 확장 시 필요한 슬롯마다 ping으로 확인하고 순위를 매기는 제공자 수이며, 가장 좋은 제공자를 남깁니다. 1은 필요한 만큼만 평가합니다"
  nl: "Hoeveel providers een vensteruitbreiding pingt en rangschikt per plek die nodig is, waarbij de beste blijven. 1 beoordeelt precies wat nodig is"
  pl: "Ilu dostawców rozszerzenie okna pinguje i ocenia na każde potrzebne miejsce, zostawiając najlepszych. 1 ocenia dokładnie tyle, ile trzeba"
  pt: "Quantos fornecedores uma expansão de janela testa com ping e classifica por cada vaga necessária, ficando com os melhores. 1 avalia exatamente o que precisa"
  pt-BR: "Quantos provedores uma expansão de janela testa com ping e classifica por vaga necessária, ficando com os melhores. 1 avalia exatamente o que precisa"
  pt-PT: "Quantos fornecedores uma expansão de janela testa com ping e classifica por cada vaga necessária, ficando com os melhores. 1 avalia exatamente o que precisa"
  ru: "Сколько провайдеров расширение окна пингует и ранжирует на каждый нужный слот, оставляя лучших. 1 — оценивать ровно столько, сколько нужно"
  sv: "Hur många leverantörer en fönsterutökning pingar och rankar per plats den behöver, och behåller de bästa. 1 utvärderar exakt det som behövs"
  sw: "Idadi ya watoa huduma ambao upanuzi wa dirisha huwapigia ping na kuwapanga kwa kila nafasi inayohitajika, ukibakiza walio bora. 1 hutathmini idadi inayohitajika tu"
  th: "จำนวนผู้ให้บริการที่การขยายหน้าต่าง ping และจัดอันดับต่อช่องที่ต้องการ แล้วเก็บรายที่ดีที่สุด 1 คือประเมินเท่าที่ต้องการพอดี"
  uk: "Скільки провайдерів розширення вікна пінгує й ранжує на кожне потрібне місце, залишаючи найкращих. 1 оцінює рівно стільки, скільки потрібно"
  vi: "Khi mở rộng cửa sổ, số nhà cung cấp được ping và xếp hạng cho mỗi vị trí cần thiết, giữ lại những nhà tốt nhất. 1 đánh giá đúng số lượng cần"
  zh: "窗口扩展时为每个所需槽位 ping 并排名的提供商数量，保留最佳者。1 表示只评估恰好所需的数量"
  zh-HK: "視窗擴展時為每個所需空位 ping 並排名的供應商數量，保留最佳者。1 表示只評估剛好所需的數量"
