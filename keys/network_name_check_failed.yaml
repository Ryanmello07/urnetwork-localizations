description: "Create Network Form: the network name availability check could not reach the server. Not a verdict on the name; the user may still create the network."
source: "Couldn't check availability. You can still continue."
platforms:
  - android
  - apple
localizations:
  ar: "تعذّر التحقق من التوفر. لا يزال بإمكانك المتابعة."
  cs: "Dostupnost se nepodařilo ověřit. Přesto můžete pokračovat."
  de: "Verfügbarkeit konnte nicht geprüft werden. Du kannst trotzdem fortfahren."
  el: "Δεν ήταν δυνατός ο έλεγχος διαθεσιμότητας. Μπορείτε να συνεχίσετε."
  en: "Couldn't check availability. You can still continue."
  es: "No se pudo comprobar la disponibilidad. Aun así puedes continuar."
  es-419: "No se pudo verificar la disponibilidad. Aun así puedes continuar."
  es-MX: "No se pudo verificar la disponibilidad. Aun así puedes continuar."
  fr: "Impossible de vérifier la disponibilité. Vous pouvez tout de même continuer."
  he: "לא ניתן היה לבדוק זמינות. עדיין אפשר להמשיך."
  hi: "उपलब्धता की जांच नहीं हो सकी। आप फिर भी जारी रख सकते हैं।"
  id: "Tidak dapat memeriksa ketersediaan. Anda tetap dapat melanjutkan."
  it: "Impossibile verificare la disponibilità. Puoi comunque continuare."
  ja: "利用可能かどうかを確認できませんでした。このまま続行できます。"
  ko: "사용 가능 여부를 확인할 수 없습니다. 계속 진행할 수 있습니다."
  nl: "Kan beschikbaarheid niet controleren. Je kunt toch doorgaan."
  pl: "Nie udało się sprawdzić dostępności. Nadal możesz kontynuować."
  pt: "Não foi possível verificar a disponibilidade. Ainda pode continuar."
  pt-BR: "Não foi possível verificar a disponibilidade. Você ainda pode continuar."
  pt-PT: "Não foi possível verificar a disponibilidade. Ainda pode continuar."
  ru: "Не удалось проверить доступность. Вы всё равно можете продолжить."
  sv: "Det gick inte att kontrollera tillgängligheten. Du kan ändå fortsätta."
  sw: "Imeshindwa kukagua upatikanaji. Bado unaweza kuendelea."
  th: "ไม่สามารถตรวจสอบความพร้อมใช้งานได้ คุณยังคงดำเนินการต่อได้"
  uk: "Не вдалося перевірити доступність. Ви все одно можете продовжити."
  vi: "Không thể kiểm tra tính khả dụng. Bạn vẫn có thể tiếp tục."
  zh: "无法检查是否可用。你仍可以继续。"
  zh-HK: "無法檢查是否可用。你仍可以繼續。"
