description: "The confirmation of Delete account, shown only while the Bittensor key's recovery phrase is not saved."
source: "Your Bittensor recovery phrase isn't saved yet. Deleting your account also deletes this key from this device, and without the phrase your SN25α can't be reached."
deprecated:
  - apple
platforms:
  - apple
localizations:
  ar: "لم يتم حفظ عبارة النسخ الاحتياطي الخاصة بك لـ Bittensor بعد. حذف حسابك يحذف هذا المفتاح أيضًا من هذا الجهاز، وبدون هذه العبارة لن يمكن الوصول إلى SN25α الخاص بك."
  cs: "Vaše obnovovací fráze Bittensor ještě není uložená. Odstraněním účtu se z tohoto zařízení odstraní i tento klíč a bez této fráze se k vašemu SN25α nebude možné dostat."
  de: "Deine Bittensor-Wiederherstellungsphrase ist noch nicht gespeichert. Wenn du dein Konto löschst, wird auch dieser Schlüssel von diesem Gerät gelöscht, und ohne die Phrase ist dein SN25α nicht mehr erreichbar."
  el: "Η φράση επαναφοράς Bittensor σας δεν έχει αποθηκευτεί ακόμη. Η διαγραφή του λογαριασμού σας διαγράφει και αυτό το κλειδί από αυτή τη συσκευή, και χωρίς τη φράση δεν θα είναι δυνατή η πρόσβαση στα SN25α σας."
  en: "Your Bittensor recovery phrase isn't saved yet. Deleting your account also deletes this key from this device, and without the phrase your SN25α can't be reached."
  es: "Tu frase de recuperación de Bittensor aún no está guardada. Al eliminar tu cuenta también se elimina esta clave de este dispositivo y, sin la frase, no se podrá acceder a tu SN25α."
  es-419: "Tu frase de recuperación de Bittensor todavía no está guardada. Al eliminar tu cuenta también se elimina esta clave de este dispositivo y, sin la frase, no se podrá acceder a tu SN25α."
  es-MX: "Tu frase de recuperación de Bittensor todavía no está guardada. Al eliminar tu cuenta también se elimina esta clave de este dispositivo y, sin la frase, no se podrá acceder a tu SN25α."
  fr: "Votre phrase de sauvegarde Bittensor n’est pas encore enregistrée. Supprimer votre compte supprime aussi cette clé de cet appareil, et sans la phrase, vos SN25α seront inaccessibles."
  he: "ביטוי השחזור של Bittensor שלכם עדיין לא נשמר. מחיקת החשבון שלכם מוחקת גם את המפתח הזה מהמכשיר הזה, ובלי הביטוי לא תהיה גישה ל-SN25α שלכם."
  hi: "आपका Bittensor रिकवरी फ़्रेज़ अभी सहेजा नहीं गया है। अकाउंट डिलीट करने पर यह कुंजी भी इस डिवाइस से डिलीट हो जाएगी, और फ़्रेज़ के बिना आपके SN25α तक पहुँचा नहीं जा सकेगा।"
  id: "Frasa cadangan Bittensor Anda belum disimpan. Menghapus akun Anda juga menghapus kunci ini dari perangkat ini, dan tanpa frasa tersebut SN25α Anda tidak dapat diakses."
  it: "La tua frase di recupero Bittensor non è ancora salvata. Eliminando il tuo account elimini anche questa chiave da questo dispositivo e, senza la frase, i tuoi SN25α non saranno più accessibili."
  ja: "Bittensor の復元フレーズはまだ保存されていません。アカウントを削除すると、このキーもこのデバイスから削除され、フレーズがなければ SN25α にアクセスできなくなります。"
  ko: "Bittensor 복구 문구가 아직 저장되지 않았습니다. 계정을 삭제하면 이 키도 이 기기에서 삭제되며, 문구가 없으면 SN25α에 접근할 수 없습니다."
  nl: "Je Bittensor-herstelzin is nog niet opgeslagen. Als je je account verwijdert, wordt deze sleutel ook van dit apparaat verwijderd, en zonder de zin is je SN25α niet meer bereikbaar."
  pl: "Twoja fraza odzyskiwania Bittensor nie jest jeszcze zapisana. Usunięcie konta usuwa też ten klucz z tego urządzenia, a bez tej frazy do twoich SN25α nie będzie można się dostać."
  pt: "A sua frase de recuperação Bittensor ainda não está guardada. Eliminar a sua conta também elimina esta chave deste dispositivo e, sem a frase, não será possível aceder ao seu SN25α."
  pt-BR: "Sua frase de recuperação Bittensor ainda não está salva. Excluir sua conta também exclui esta chave deste dispositivo e, sem a frase, não será possível acessar seu SN25α."
  pt-PT: "A sua frase de recuperação Bittensor ainda não está guardada. Eliminar a sua conta também elimina esta chave deste dispositivo e, sem a frase, não será possível aceder ao seu SN25α."
  ru: "Ваша фраза восстановления Bittensor ещё не сохранена. При удалении аккаунта этот ключ также будет удалён с этого устройства, и без этой фразы получить доступ к вашим SN25α будет невозможно."
  sv: "Din Bittensor-återställningsfras är inte sparad än. Om du raderar ditt konto raderas också den här nyckeln från den här enheten, och utan frasen går det inte att komma åt dina SN25α."
  sw: "Kifungu chako cha urejeshaji cha Bittensor bado hakijahifadhiwa. Kufuta akaunti yako pia kunafuta ufunguo huu kwenye kifaa hiki, na bila kifungu hicho SN25α yako haitaweza kufikiwa."
  th: "ยังไม่ได้บันทึกวลีสำรอง Bittensor ของคุณ การลบบัญชีจะลบคีย์นี้ออกจากอุปกรณ์นี้ด้วย และหากไม่มีวลีนี้ จะไม่สามารถเข้าถึง SN25α ของคุณได้"
  uk: "Вашу фразу відновлення Bittensor ще не збережено. Видалення облікового запису також видалить цей ключ із цього пристрою, і без цієї фрази отримати доступ до ваших SN25α буде неможливо."
  vi: "Cụm từ sao lưu Bittensor của bạn chưa được lưu. Xóa tài khoản cũng sẽ xóa khóa này khỏi thiết bị này, và nếu không có cụm từ đó, sẽ không thể truy cập SN25α của bạn."
  zh: "您的 Bittensor 恢复短语尚未保存。删除账户也会从这台设备上删除此密钥，没有此短语，您的 SN25α 将无法访问。"
  zh-HK: "你的 Bittensor 復原短語尚未儲存。刪除帳戶亦會從這部裝置刪除此金鑰，沒有此短語，你的 SN25α 將無法存取。"
