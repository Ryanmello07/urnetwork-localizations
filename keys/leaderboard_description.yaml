description: "Call to action"
source: "The leaderboard is the sum of the last 4 payments. It is updated each payment cycle."
platforms:
  - android
  - apple
  - linux
  - windows
localizations:
  ar: "لوحة الصدارة هي مجموع آخر 4 دفعات. يتم تحديثها كل دورة دفع."
  cs: "Žebříček je součtem posledních 4 plateb. Je aktualizován každý platební cyklus."
  de: "Die Bestenliste ist die Summe der letzten 4 Zahlungen. Sie wird bei jedem Zahlungszyklus aktualisiert."
  el: "Ο πίνακας κατάταξης είναι το άθροισμα των τελευταίων 4 πληρωμών. Ενημερώνεται κάθε κύκλο πληρωμής."
  en: "The leaderboard is the sum of the last 4 payments. It is updated each payment cycle."
  es: "La tabla de clasificación es la suma de los últimos 4 pagos. Se actualiza en cada ciclo de pago."
  es-419: "La tabla de clasificación es la suma de los últimos 4 pagos. Se actualiza en cada ciclo de pago."
  es-MX: "La tabla de clasificación es la suma de los últimos 4 pagos. Se actualiza en cada ciclo de pago."
  fr: "Le classement est la somme des 4 derniers paiements. Il est mis à jour à chaque cycle de paiement."
  he: "טבלת המובילים היא סכום 4 התשלומים האחרונים. היא מתעדכנת בכל מחזור תשלומים."
  hi: "लीडरबोर्ड पिछले 4 भुगतानों का योग है। यह प्रत्येक भुगतान चक्र में अपडेट किया जाता है।"
  id: "Papan peringkat adalah jumlah dari 4 pembayaran terakhir. Ini diperbarui setiap siklus pembayaran."
  it: "La classifica è la somma degli ultimi 4 pagamenti. Viene aggiornata ad ogni ciclo di pagamento."
  ja: "リーダーボードは過去4回の支払いの合計です。支払いサイクルごとに更新されます。"
  ko: "리더보드는 최근 4번의 결제 합계입니다. 각 결제 주기마다 업데이트됩니다."
  nl: "Het scorebord toont de som van de laatste 4 betalingen. Deze wordt elke betalingscyclus bijgewerkt."
  pl: "Tablica wyników to suma ostatnich 4 płatności. Jest aktualizowana w każdym cyklu płatności."
  pt: "O quadro de líderes é a soma dos últimos 4 pagamentos. É atualizado a cada ciclo de pagamento."
  pt-BR: "O placar de líderes é a soma dos últimos 4 pagamentos. Ele é atualizado a cada ciclo de pagamento."
  pt-PT: "A tabela de classificação é a soma dos últimos 4 pagamentos. É atualizada a cada ciclo de pagamento."
  ru: "Таблица лидеров представляет собой сумму последних 4 платежей. Она обновляется в каждом платежном цикле."
  sv: "Topplistan är summan av de 4 senaste betalningarna. Den uppdateras vid varje betalningscykel."
  sw: "Ubao wa wanaoongoza ni jumla ya malipo 4 yaliyopita. Husasishwa kila mzunguko wa malipo."
  th: "กระดานจัดอันดับจะรวมยอดจาก 4 ยอดนำจ่ายล่าสุด และจะอัพเดตแต่ละรอบการนำจ่าย"
  uk: "Таблиця лідерів — це сума останніх 4 платежів. Вона оновлюється в кожному платіжному циклі."
  vi: "Bảng xếp hạng là tổng của 4 khoản thanh toán gần nhất. Nó được cập nhật sau mỗi chu kỳ thanh toán."
  zh: "排行榜是最近 4 次付款的总和。它会在每个付款周期更新。"
  zh-HK: "排行榜是最近 4 次付款的總和。它會在每個付款週期更新。"
