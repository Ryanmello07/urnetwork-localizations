description: "Shown when the post-checkout confirmation poll gives up (2 minutes) without the server confirming the subscription. The purchase is still likely to land later; the background poll and the next launch pick it up. On apple: the delayed phase of PurchaseSuccessView and the MainView snackbar."
source: "We couldn't confirm your purchase yet. If you completed checkout, your plan will update automatically in a few minutes — there's no need to buy again."
platforms:
  - windows
  - apple
  - linux
localizations:
  ar: "لم نتمكن من تأكيد عملية الشراء بعد. إذا أكملت الدفع، فسيتم تحديث خطتك تلقائيًا خلال دقائق قليلة — لا حاجة للشراء مرة أخرى."
  cs: "Zatím se nám nepodařilo potvrdit váš nákup. Pokud jste platbu dokončili, váš tarif se během několika minut aktualizuje automaticky — není třeba nakupovat znovu."
  de: "Wir konnten deinen Kauf noch nicht bestätigen. Wenn du den Bezahlvorgang abgeschlossen hast, wird dein Plan in wenigen Minuten automatisch aktualisiert — du musst nicht erneut kaufen."
  el: "Δεν μπορέσαμε ακόμη να επιβεβαιώσουμε την αγορά σας. Αν ολοκληρώσατε την πληρωμή, το πρόγραμμά σας θα ενημερωθεί αυτόματα σε λίγα λεπτά — δεν χρειάζεται να αγοράσετε ξανά."
  en: "We couldn't confirm your purchase yet. If you completed checkout, your plan will update automatically in a few minutes — there's no need to buy again."
  es: "Aún no hemos podido confirmar tu compra. Si completaste el pago, tu plan se actualizará automáticamente en unos minutos; no es necesario volver a comprar."
  es-419: "Aún no pudimos confirmar tu compra. Si completaste el pago, tu plan se actualizará automáticamente en unos minutos; no es necesario volver a comprar."
  es-MX: "Aún no pudimos confirmar tu compra. Si completaste el pago, tu plan se actualizará automáticamente en unos minutos; no es necesario volver a comprar."
  fr: "Nous n'avons pas encore pu confirmer votre achat. Si vous avez terminé le paiement, votre plan sera mis à jour automatiquement dans quelques minutes — inutile d'acheter à nouveau."
  he: "עדיין לא הצלחנו לאשר את הרכישה שלכם. אם השלמתם את התשלום, התוכנית שלכם תתעדכן אוטומטית בעוד מספר דקות — אין צורך לרכוש שוב."
  hi: "हम अभी तक आपकी खरीदारी की पुष्टि नहीं कर सके। यदि आपने चेकआउट पूरा कर लिया है, तो आपकी योजना कुछ ही मिनटों में अपने आप अपडेट हो जाएगी — दोबारा खरीदने की जरूरत नहीं है।"
  id: "Kami belum dapat mengonfirmasi pembelian Anda. Jika Anda telah menyelesaikan checkout, paket Anda akan diperbarui secara otomatis dalam beberapa menit — tidak perlu membeli lagi."
  it: "Non siamo ancora riusciti a confermare il tuo acquisto. Se hai completato il pagamento, il tuo piano si aggiornerà automaticamente entro pochi minuti — non è necessario acquistare di nuovo."
  ja: "購入をまだ確認できませんでした。チェックアウトを完了した場合、プランは数分以内に自動的に更新されます。再度購入する必要はありません。"
  ko: "아직 구매를 확인하지 못했습니다. 결제를 완료하셨다면 몇 분 안에 플랜이 자동으로 업데이트됩니다. 다시 구매할 필요가 없습니다."
  nl: "We konden je aankoop nog niet bevestigen. Als je het afrekenen hebt voltooid, wordt je plan binnen enkele minuten automatisch bijgewerkt — je hoeft niet opnieuw te kopen."
  pl: "Nie udało się jeszcze potwierdzić zakupu. Jeśli płatność została zakończona, Twój plan zaktualizuje się automatycznie w ciągu kilku minut — nie musisz kupować ponownie."
  pt: "Ainda não conseguimos confirmar a sua compra. Se concluiu o pagamento, o seu plano será atualizado automaticamente dentro de alguns minutos — não é preciso comprar novamente."
  pt-BR: "Ainda não conseguimos confirmar sua compra. Se você concluiu o checkout, seu plano será atualizado automaticamente em alguns minutos — não é preciso comprar de novo."
  pt-PT: "Ainda não conseguimos confirmar a sua compra. Se concluiu o pagamento, o seu plano será atualizado automaticamente dentro de alguns minutos — não é preciso comprar novamente."
  ru: "Пока не удалось подтвердить вашу покупку. Если вы завершили оплату, ваш тариф обновится автоматически через несколько минут — покупать заново не нужно."
  sv: "Vi kunde inte bekräfta ditt köp ännu. Om du slutförde betalningen uppdateras din plan automatiskt inom några minuter — du behöver inte köpa igen."
  sw: "Bado hatujaweza kuthibitisha ununuzi wako. Ikiwa ulikamilisha malipo, mpango wako utasasishwa kiotomatiki baada ya dakika chache — hakuna haja ya kununua tena."
  th: "เรายังไม่สามารถยืนยันการซื้อของคุณได้ หากคุณชำระเงินเสร็จแล้ว แพ็กเกจของคุณจะอัปเดตโดยอัตโนมัติภายในไม่กี่นาที — ไม่จำเป็นต้องซื้อซ้ำ"
  uk: "Ми поки не змогли підтвердити вашу покупку. Якщо ви завершили оплату, ваш план оновиться автоматично за кілька хвилин — купувати повторно не потрібно."
  vi: "Chúng tôi chưa thể xác nhận giao dịch mua của bạn. Nếu bạn đã hoàn tất thanh toán, kế hoạch của bạn sẽ tự động cập nhật sau vài phút — không cần mua lại."
  zh: "我们尚未能确认您的购买。如果您已完成结账，您的计划将在几分钟内自动更新——无需再次购买。"
  zh-HK: "我們尚未能確認您的購買。如果您已完成結帳，您的計劃將在幾分鐘內自動更新——無需再次購買。"
