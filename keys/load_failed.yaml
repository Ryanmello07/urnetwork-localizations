description: "A section (points, wallet, referral code, epoch history, payout wallet) could not be loaded. Shown in place of the loading spinner or the section's data, next to a Try again (Retry on apple) button."
source: "Couldn't load. Check your connection and try again."
platforms:
  - android
  - apple
  - windows
  - linux
localizations:
  ar: "تعذّر التحميل. تحقّق من اتصالك وحاول مرة أخرى."
  cs: "Nepodařilo se načíst. Zkontrolujte připojení a zkuste to znovu."
  de: "Laden fehlgeschlagen. Überprüfe deine Verbindung und versuche es erneut."
  el: "Δεν ήταν δυνατή η φόρτωση. Ελέγξτε τη σύνδεσή σας και δοκιμάστε ξανά."
  en: "Couldn't load. Check your connection and try again."
  es: "No se pudo cargar. Revisa tu conexión y vuelve a intentarlo."
  es-419: "No se pudo cargar. Revisa tu conexión y vuelve a intentarlo."
  es-MX: "No se pudo cargar. Revisa tu conexión y vuelve a intentarlo."
  fr: "Chargement impossible. Vérifiez votre connexion et réessayez."
  he: "הטעינה נכשלה. בדקו את החיבור ונסו שוב."
  hi: "लोड नहीं हो सका। अपना कनेक्शन जाँचें और दोबारा कोशिश करें।"
  id: "Tidak dapat memuat. Periksa koneksi Anda dan coba lagi."
  it: "Impossibile caricare. Controlla la connessione e riprova."
  ja: "読み込めませんでした。接続を確認してもう一度お試しください。"
  ko: "불러올 수 없습니다. 연결을 확인한 후 다시 시도하세요."
  nl: "Kan niet laden. Controleer je verbinding en probeer het opnieuw."
  pl: "Nie udało się wczytać. Sprawdź połączenie i spróbuj ponownie."
  pt: "Não foi possível carregar. Verifique a sua ligação e tente novamente."
  pt-BR: "Não foi possível carregar. Verifique sua conexão e tente novamente."
  pt-PT: "Não foi possível carregar. Verifique a sua ligação e tente novamente."
  ru: "Не удалось загрузить. Проверьте подключение и повторите попытку."
  sv: "Det gick inte att läsa in. Kontrollera din anslutning och försök igen."
  sw: "Imeshindwa kupakia. Kagua muunganisho wako kisha ujaribu tena."
  th: "โหลดไม่ได้ ตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง"
  uk: "Не вдалося завантажити. Перевірте з’єднання і спробуйте ще раз."
  vi: "Không thể tải. Hãy kiểm tra kết nối và thử lại."
  zh: "无法加载。请检查网络连接后重试。"
  zh-HK: "無法載入。請檢查網絡連線後再試。"
