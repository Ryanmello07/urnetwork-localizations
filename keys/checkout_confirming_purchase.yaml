  hi: "हम आपकी खरीद की पुष्टि कर रहे हैं। आपका प्लान अपने आप अपडेट हो जाएगा।"
  id: "Kami sedang mengonfirmasi pembelian Anda. Paket Anda akan diperbarui secara otomatis."
