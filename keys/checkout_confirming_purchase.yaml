  uk: "Ми підтверджуємо вашу покупку. Ваш план оновиться автоматично."
  vi: "Chúng tôi đang xác nhận giao dịch mua của bạn. Gói của bạn sẽ tự động được cập nhật."
  zh: "我们正在确认你的购买。你的套餐会自动更新。"
  zh-HK: "我們正在確認你的購買。你的計劃會自動更新。"
