  pl: "Potwierdzamy Twój zakup. Twój plan zaktualizuje się automatycznie."
  pt: "Estamos confirmando sua compra. Seu plano será atualizado automaticamente."
  pt-BR: "Estamos confirmando sua compra. Seu plano será atualizado automaticamente."
