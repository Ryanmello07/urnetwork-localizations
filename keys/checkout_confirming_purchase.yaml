  de: "Wir bestätigen deinen Kauf. Dein Plan wird automatisch aktualisiert."
  el: "Επιβεβαιώνουμε την αγορά σας. Το πρόγραμμά σας θα ενημερωθεί αυτόματα."
  en: "We're confirming your purchase. Your plan will update automatically."
  es: "Estamos confirmando tu compra. Tu plan se actualizará automáticamente."
  es-419: "Estamos confirmando tu compra. Tu plan se actualizará automáticamente."
  es-MX: "Estamos confirmando tu compra. Tu plan se actualizará automáticamente."
