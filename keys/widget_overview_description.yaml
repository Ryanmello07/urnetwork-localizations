description: "Description of the overview widget in the widget gallery, on Android (the home screen, the lock screen and Samsung's cover screen) and on the iPhone, iPad and Mac home screen: one large widget that shows the connection with the quick connect toggle, the connected providers on a globe, the transfer balance, today's traffic and the open contracts."
source: "Connection, providers on the globe, balance, today's traffic and contracts in one widget, with quick connect."
platforms:
  - apple
  - android
